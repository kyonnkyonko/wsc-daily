人沉在敗壞和滅亡中。<br>貪財是萬惡之根！有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。</p></blockquote><p>這段經文是使徒保羅寫的。他說，當人想要發財的時候，就落入到試探當中，會犯錯誤的。他警告我們，當我們貪財（或貪戀錢能買到的東西）的時候，我們就會犯罪，出很多問題。貪財的態度——想要的越來越多——會叫我們竊取不屬於我們的東西，因為我們太想要那些東西了。</p>"},{"day":4,"html":"<p>想要避免貪財，一個方法就是，要明白到底什麼東西讓我們富足。大多數人以為如果他們有足夠的錢，就會幸福了。大多數人以為「足夠的錢」就是比現在擁有的稍多一些。我們以為，富有的意思就是有錢想做什麼就做什麼。以為富有就是有大房子，有好車。富有就是擁有漂亮衣服，購買我們喜歡的東西。富有就可以瀟灑地度假，做很刺激的事情。大多數人以為如果有了所有這一切，他們就是富有的人，就會幸福快樂。</p><p class=\"read-prompt\">請讀箴言10:22，看看是什麼使人真正地富足。</p><blockquote><p><strong>箴言10:22</strong><br>耶和華所賜的福，使人富足，並不加上憂慮。</p></blockquote><p>當我們知道什麼東西是真正有價值的，我們就會以我們所擁有的知足。錢財不能長存。我們只有擁有了永存的東西，才算真正富足了。只有上帝能賜給我們那樣的富足。如果我們信靠主耶穌基督來賜給我們屬靈的財富，比如與主和好，在天上永遠的家，那我們就是真的富足了。即使我們沒有很多錢財，我們仍然擁有賜財富的主的祝福。</p>"},{"day":5,"html":"<p>貪財的反義詞叫做知足。上帝命令我們不要偷盜的時候，也是告訴我們不可有貪財的心態。祂想要我們有的是心態是知足的心。知足就是為我們所擁有的而感到滿意和感恩。不讓我們所缺少的東西破壞我們的知足之心。上帝的兒女不可以為自己的擁有而知足，因為上帝曾應許供他所需用的一切。如果我們缺乏什麼，我們卻以為我們很需要，那是因為上帝知道我們需要的是另外的東西。當我們缺乏的時候，上帝會給我們力量叫我們繼續信靠祂。請讀腓立比書4:11-13。</p><blockquote><p><strong>腓立比書4:11-13</strong><br>我並不是因缺乏說這話，我無論在什麼景況都可以知足，這是我已經學會了的。<br>我知道怎樣處卑賤，也知道怎樣處豐富，或飽足、或飢餓、或有餘、或缺乏，隨事隨在，我都得了秘訣。<br>我靠著那加給我力量的，凡事都能做。</p></blockquote>"},{"day":6,"html":"<p>我們可以為所有的一切知足，還有一個原因是我們知道上帝掌管一切。當我們學習《要理問答》第七問的時候，我們學到「上帝預定了所發生的一切事」。沒有上帝的計劃，什麼事情也不會發生。不論我們環境如何——不論我們富足還是貧窮——這都是上帝為我們選擇的環境。因為我們知道上帝愛我們，而且祂有至高的智慧，我們就知道祂選擇的環境就是對我們最好的環境。我們可可以滿足於我們的所有，因為我們所有的都是上帝賜給我們的。約伯是個富人，有許多祝福。他也為此感謝上帝。即使他兒女喪命、財產盡失，他仍能知足。他知道賜給他一切財富的是上帝，收取這些財富的也是上帝。請讀約伯記1:20-21，看看約伯怎麼說：</p><blockquote><p><strong>約伯記1:20-21</strong><br>約伯便起來，撕裂外袍，剃了頭，伏在地上下拜，<br>說：「我赤身出於母胎，也必赤身歸回。賞賜的是耶和華，收取的也是耶和華。耶和華的名是應當稱頌的。」</p></blockquote>"}]},{"num":74,"title":"第八誡命是什麼？","answer":"第八誡命吩咐我們：以合乎神律法的方式，來獲得、增加自己和別人的財富及產業。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-9","days":[{"day":1,"html":"<p>上帝告訴我們不可想要什麼就偷過來，反而叫我們工作來買所需用的。當上帝造人的時候，祂給人工作。聖經告訴我們，上帝剛創造亞當之後，就將他安置在伊甸園，叫他「修理看守」（創世記2:15）。</p><blockquote><p><strong>創世記2:15</strong><br>耶和華神將那人安置在伊甸園，使他修理看守。</p></blockquote><p>人們應該工作。這是上帝給他們的計劃的一部分。箴言書中充滿了日常生活的智慧。它告訴我們如何獲得我們所需用的東西。請讀箴言14:23和箴言10:4。</p><blockquote><p><strong>箴言14:23</strong><br>諸般勤勞都有益處；嘴上多言乃致窮乏。</p><p><strong>箴言10:4</strong><br>手懶的，要受貧窮；手勤的，卻要富足。</p></blockquote><p>依據上帝的話，想要有錢買我們想要的東西，唯一途徑就是透過努力勞動！</p>"},{"day":2,"html":"<p class=\"read-prompt\">請讀箴言28:19。</p><blockquote><p><strong>箴言28:19</strong><br>耕種自己田地的，必得飽食；追隨虛浮的，足受窮乏。</p></blockquote><p>所羅門寫箴言書的年代，國中大多數人都是農民。所羅門說「耕種自己田地的」，就是那些為了確保莊稼長得好而常年辛勞的人，必然會得到豐富的食物。他將富富有餘，可以將餘糧出售。雖然這裡講的是關於農民的事，不過對於我們每個人來說都適用，那就是要透過辛苦勞動來得到所需用的。這節經文還說到另一個因為忙於「追隨虛浮」而不勞動的人。他老是想方設法快發財。這種人就是學校裡那些長大了想打NBA而現在不好好學習的男生們，或者是長大了想當模特而在乎學習成績的女生們。這些人正在追隨虛浮，根本得不到他們需要的東西。他們只能收穫貧窮。</p>"},{"day":3,"html":"<p>努力工作能給我們換來錢。應該努力勞動、出色工作，還有一個更好的原因。我們應該為著上帝的榮耀竭力做到最好。要牢記第一問的答案：「人的主要目的是榮耀上帝、以祂為樂，直到永遠。」我們都應該為了上帝的榮耀而工作。一個男人，不管他是牧師還是汽車修理工，都應該在工作中盡力才能在工作中榮耀上帝。一個女人，不管是家庭主婦還是護士，都應該勤奮努力，叫上帝得著榮耀。一個小孩子，複習考數學的時候，或者清理房間的時候，都應該是為著上帝而做。意思是說，他不可以拖拖拉拉、心不在焉地做，而是專心致志地做。如果人知道我們說是愛上帝，卻看見我們工作馬虎，他們對上帝會怎樣想？請讀帖撒羅尼迦前書4:11-12。</p><blockquote><p><strong>帖撒羅尼迦前書4:11-12</strong><br>又要立志作安靜人，辦自己的事，親手做工，正如我們從前所吩咐你們的，<br>叫你們可以向外人行事端正，自己也就沒有什麼缺乏了。</p></blockquote>"},{"day":4,"html":"<p>「不可偷盜」這條誡命要求我們為著得到我們所需用的，並且為著上帝的榮耀來努力工作。它也要求我們要關心別人的需要。我們必須儘可能地幫助別人得著所需用的。偷盜的反義詞是不偷盜嗎？不，偷盜的反義詞是分享。接受人給的東西，對應的是給予人東西。這條誡命禁止偷盜，藉此要求的是偷盜的反面——分享。我們要善待人，包括幫助他們擁有更多有益於他們的東西。請讀加拉太書6:10。</p><blockquote><p><strong>加拉太書6:10</strong><br>所以，有了機會，就當向眾人行善，向信徒一家的人更當這樣。</p></blockquote>"},{"day":5,"html":"<p>我們要努力工作得著所需用的。那麼，當我們有了所需用的，我們是否應該停止工作、不要賺錢了呢？不是的，因為如果我們繼續工作的話，我們就會有更多的錢可以與人分享。我們工作，藉著我們的辛勤榮耀上帝。我們工作，為要得著我們所需用的。我們工作，好有錢跟那些缺乏的人分享。請讀以弗所書4:28。</p><blockquote><p><strong>以弗所書4:28</strong><br>從前偷竊的，不要再偷；總要勞力，親手做正經事，就可有餘，分給那缺少的人。</p></blockquote>"},{"day":6,"html":"<p>因為罪的緣故，世上的事情未必都那麼公平，經常會發生悲慘的事情。因為罪的緣故，人們遇到各種難題。世上一直都有窮人，他們得不到需要的東西。在基督再來之前，世上也將一直有窮人。當我們應有盡有的時候，我們很容易忽略那些缺乏的人。有時候，有些人是因為沒有照著上帝的吩咐去努力勞動，因此受了窮。不過人們往往因為自己不能改變的原因受窮。這樣的人需要我們幫助。上帝要我們牢記，窮也是人。我們必須尊重他們，因為上帝照著自己的形像造了他們。祂要我們盡力幫助他們。請讀箴言17:5。</p><blockquote><p><strong>箴言17:5</strong><br>戲笑窮人的，是辱沒造他的主；幸災樂禍的，必不免受罰。</p></blockquote>"}]},{"num":75,"title":"第八誡命禁止我們做什麼？","answer":"第八誡命禁止我們：以任何不義手段，實際地或可能地，減損自己或他人的財富或產業。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-9","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀22:1-6。</p><blockquote><p><strong>出埃及記22:1-6</strong><br>人若偷牛或羊，無論是宰了，是賣了，他就要以五牛賠一牛，四羊賠一羊。<br>人若遇見賊挖窟窿，把賊打了，以至於死，就不能為他有流血的罪；<br>若太陽已經出來，就為他有流血的罪。賊若被拿，總要賠還；若他一無所有，就要被賣，頂他所偷的物。<br>若他所偷的，或牛，或驢，或羊，仍在他手下存活，他就要加倍賠還。<br>人若在田間或在葡萄園裡放牲畜，任憑牲畜上別人的田裡去吃，就必拿自己田間上好的和葡萄園上好的賠還。<br>若點火燒荊棘，以致將別人堆積的禾捆、站著的禾稼，或是田園，都燒盡了，點火的必要賠還。</p></blockquote><p>第八誡命特別禁止偷盜。不僅僅拿槍搶銀行或者入戶盜竊個錄影機什麼的才算是偷盜。當我們不讓人擁有照理屬於他或她的東西，我們就違反了這條誡命。出埃及記22:1-6說到偷盜，以及如何懲罰偷盜的人。第五和第六節講到的是並非故意偷盜，而是因為疏忽導致別人財產損失的人。這種疏忽也是偷盜的一種形式。這段經文吩咐疏忽的人要賠還受損的人。</p>"},{"day":2,"html":"<p>當我們欺騙人的時候，是用不公正的手段奪取別人的錢財。我們買東西的時候，別人可能會多找錢給我們。如果我們意識到發生了什麼，卻閉口不言，我們就等於騙了那個人（或店）的錢。這是偷盜。如果我們拾到別人丟的東西卻不歸還，我們是騙得了照理屬於人家的東西，我們就是在偷盜了。當我們借了東西卻沒有歸還，我們就是騙了人的東西。我們就不算是借人的東西了，反而是偷盜。當人們在別人的房屋上亂寫亂畫或者損壞別人的房屋，這都是偷盜。</p><p class=\"read-prompt\">請讀箴言20:17。</p><blockquote><p><strong>箴言20:17</strong><br>以虛謊而得的食物，人覺甘甜，但後來他的口必充滿塵沙。</p></blockquote><p>欺詐就是騙人。欺詐就是哄騙人，好得著他的錢。想象一下，把十分可口的食物放在口中，嚼著嚼著，突然變成了塵沙！這節經文說，騙來的東西就會是這個樣子。起初，你喜愛得到的東西。因為這是上帝不喜悅的，所以，可以保證的是，你早晚都會因此而痛苦。</p>"},{"day":3,"html":"<p>當你腳痛得不得了，你還怎麼走路呢？你只能一瘸一拐，因為疼痛的腳根本吃不了力。如果你牙疼，你怎麼嚼東西呢？你只能小口小口地吃軟東西，因為你根本不能用牙疼的那半邊吃東西。請讀箴言25:19。</p><blockquote><p><strong>箴言25:19</strong><br>患難時倚靠不忠誠的人，好像破壞的牙，錯骨縫的腳。</p></blockquote><p>如果我指望著你做一件事，你沒有做或馬馬虎虎地做，那就像是我得瘸腿走路或者用壞牙嚼東西一樣。想象一下，在八月炎熱的天氣裡，你在田地裡勞動。你已經在炎炎烈日下勞動了好幾個鐘頭。你大汗淋漓、滿身灰土——突然下雪了！可真涼爽啊！</p><p class=\"read-prompt\">請讀箴言25:13。</p><blockquote><p><strong>箴言25:13</strong><br>忠信的使者，叫差他的人心裡舒暢，就如在收割時，有冰雪的涼氣。</p></blockquote><p>如果我指望你做一件事，你做得很好，那我就很感到很痛快。那麼，這又跟「不可偷盜」的誡命有什麼關係呢？如果有人花錢要我做什麼事，如果我沒有照著薪酬付出工作，或者如果我做得馬馬虎虎，甚至需要別人重做，那麼我就是沒有把我該給他的人。當我們為僱主儘量做好工作的時候，我們就是避免了違反第八條誡命。</p>"},{"day":4,"html":"<p class=\"read-prompt\">請讀箴言22:1。</p><blockquote><p><strong>箴言22:1</strong><br>美名勝過大財；恩寵強如金銀。</p></blockquote><p>有時候，人們偷盜的不是錢，也不是錢能買到的物品。這節經文就說到美名或名譽的價值。當人有名譽的時候，一聽到那人的名字，就想到關於他的那些美好品格。當人有名譽的時候，他就受到相識者的敬重。別人的敬重比錢還有價值。</p><p>不過，我們可能會偷盜別人的名譽。偷盜某人的名譽，只需要告訴人們關於某人的一些事情，讓大家質疑他的人品。如果我們傳播我們所聽的關於某人的壞話，我們就是在協同偷盜某人的名譽。那些事可能不是真的，或者是隻有一部分是真的。當我們把那些事跟別人講的時候，人們會信以為真，就會輕看我們所談論的那人。當我們聽到關於某人的壞話，我們都願意聽。一旦我們聽了，我們就想把聽到的東西告訴別人。無論何時，我們做這樣的事，就是違反了第八誡命，因為我們是在偷盜別人的名譽。</p>"},{"day":5,"html":"<p>我們可能偷盜別人，我們也可能偷自己。這個要理問答的答案說，我們不可以「以任何不義手段，實際地或可能地，減損自己的財富或產業。」我們可能有許多敗壞的方式來減損自己的產業或財富。</p><p class=\"read-prompt\">請讀箴言21:17。</p><blockquote><p><strong>箴言21:17</strong><br>愛宴樂的，必致窮乏；好酒、愛膏油的，必不富足。</p></blockquote><p>這節經文描繪的是一位貪圖享樂的人。他總是想著享受。他什麼東西都要最好的。在聖經的那個時代，有錢人才能喝好酒、用上等膏油。如果一個人不是真的有錢，卻又追求有錢人用的東西，他/她很快就會窮乏的。我們可能花錢買很多給我們帶來享受的東西。我們想這裡花點錢吃點兒美食，那裡再花點兒錢跟朋友瀟灑一下，還有那裡再多花點錢買點兒好玩兒的東西。突然，我們的錢就什麼也不剩了。</p><p>花大筆的錢來買享受的東西，那是浪費財富。當我們花太多錢買我們想要的東西，我們就不再有錢買我們需要的東西。當我們不關心供應自己的需要時，當我們浪費我們的財富，我們就是違反了「不可偷盜」的誡命。</p>"},{"day":6,"html":"<p>我們曾經說過，有了正確的態度，就可以幫助我們避免違反「不可偷盜」的誡命。如果我們不貪心，滿足於自己所有的，那麼我們就不會感覺總是想要擁有更多，那麼我們也就不會出去偷了。當我們相信上帝的護理，我們就會為我們所有的感謝上帝，不會貪心不足。當我們敬畏上帝的時候，我們就會順服這條誡命。我們明白上帝是聖潔的，祂恨惡偷盜，祂也懲罰偷盜的行為，那麼我們就會留意不會違反這條誡命。不論我們多麼想比現在擁有的更多，我們都更想討上帝的喜悅。請讀箴言15:16。</p><blockquote><p><strong>箴言15:16</strong><br>少有財寶，敬畏耶和華，強如多有財寶，煩亂不安。</p></blockquote>"}]},{"num":76,"title":"第九誡命是什麼？","answer":"第九誡命是：「不可作假見證陷害人」。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-10","days":[{"day":1,"html":"<p>「見證」這個詞是用在法院裡的。某人被控告犯了罪，帶到法庭。看到犯罪過程或者對被告有所瞭解的證人就會被叫來。當某個證人講述自己所知道的事，我們就把這過程叫做「作見證」。只有所有的證人都說實話，法庭才能正常工作。如果證人作假見證，受審的人就有可能為他根本沒做過的事受刑罰。或者叫確實犯了大罪的人逍遙法外。</p><p>特別在法庭上，人們一定要說實話。如果某人在法庭上給無辜的人作假見證，那個無辜者可能會因為他沒做過的事受苦。如果某人給有罪的犯人作假見證，他就逍遙法外了，會讓更多無辜的人受苦。</p><p>上帝的百姓總要說實話。上帝喜愛真實、恨惡虛假。無論我們是否在法庭上，我們都必須講實話。請讀撒迦利亞書8:16-17。</p><blockquote><p><strong>撒迦利亞書8:16-17</strong><br>你們所當行的是這樣：各人與鄰舍說話誠實，在城門口按至理判斷，使人和睦；<br>誰都不可心裡謀害鄰舍，也不可喜愛起假誓，因為這些事都為我所恨惡。「這是耶和華說的。</p></blockquote>"},{"day":2,"html":"<p>舊約律法的一部分講述了，如果某人犯了大錯該怎麼辦。如果某人被證實犯了罪，其他人要用石頭打死他。那律法說到，為他作有罪見證的人要第一個用石頭打他。就是那個跟別人說「我看見這個人犯罪了」的人，他要扔第一塊石頭。（申命記13:9）</p><blockquote><p><strong>申命記13:9</strong><br>總要殺他，你先下手，然後眾民也下手，將他治死。</p></blockquote><p>這個規定會幫助人們意識到他們的見證是多麼嚴肅的事。正是他們所說的話，會是那人被治死。</p><p>我們所說的關於別人的話確實是非常嚴肅的。上帝要求我們要謹慎地講論別人。我們無意的言談可能會嚴重傷害人。我們需要格外小心，不要以不真實的話來講論別人。請讀箴言14:5。</p><blockquote><p><strong>箴言14:5</strong><br>誠實見證人，不說謊話；假見證人，吐出謊言。</p></blockquote>"},{"day":3,"html":"<p>還記得最近一次有人跟你講別人的壞話嗎？當你聽到關於那個人的壞話，你有沒有感到特別有意思？多久之後你把這話講給別人？雖然我們知道不對，但是我們都喜歡傳播我們聽到的關於別人的壞話。大多數情況我們我們所傳播的內容，我們也不知道是不是都是事實。說一些貶低人的不實之言，這就叫做誹謗造謠。上帝禁止我們傳播謠言。請讀利未記19:16上。</p><blockquote><p><strong>利未記19:16</strong><br>不可在民中往來搬弄是非。</p></blockquote><p>要當心，不要傳播我們聽見的關於別人的壞話。你可能正在觸犯上帝的誡命。</p>"},{"day":4,"html":"<p>對於上帝來說，講別人的真話，始終說實話是十分重要的。上帝喜愛真理。祂只講真理。上帝的兒子耶穌說自己是「道路、真理、生命」。詩篇15描述了能夠親近上帝的那種人。請讀詩篇15。找一找談論誠實，以及我們如何講論他人的經文。</p><blockquote><p><strong>詩15:1-5</strong><br>耶和華啊，誰能寄居你的帳幕？誰能住在你的聖山？<br>就是行為正直、做事公義、心裡說實話的人。<br>他不以舌頭讒謗人，不惡待朋友，也不隨夥毀謗鄰里。<br>他眼中藐視匪類，卻尊重那敬畏耶和華的人。他發了誓，雖然自己吃虧，也不更改。<br>他不放債取利，不受賄賂以害無辜。行這些事的人必永不動搖。</p></blockquote>"},{"day":5,"html":"<p>人們都樂意想到上帝的愛。我們可能發現，我們可能沒那麼樂意想到上帝所恨的事物，其實我們也應該想這些事，好讓我們可以避免。箴言第六章列舉了上帝恨惡的七樣事情。請讀箴言6:16-19所列舉的，找出三樣與第九條誡命相關的內容。</p><blockquote><p><strong>箴言6:16-19</strong><br>耶和華所恨惡的有六樣，連他心所憎惡的共有七樣：<br>就是高傲的眼，撒謊的舌，流無辜人血的手，<br>圖謀惡計的心，飛跑行惡的腳，<br>吐謊言的假見證，並弟兄中佈散紛爭的人。</p></blockquote>"},{"day":6,"html":"<p>人們作假見證或說謊，有許多不同的原因。他們可能想透過這種做法來得到錢或者什麼別的東西。人們作假見證或者說謊，可能是為了編造更精彩的故事來吸引人的注意。他們這麼做也可能是為了避免惹上麻煩。我們既然意識到上帝恨謊言、總是要懲罰這種行為，那麼無論有什麼原因，撒謊都不算是好事。請讀箴言19:5。</p><blockquote><p><strong>箴言19:5</strong><br>作假見證的，必不免受罰；吐出謊言的，終不能逃脫。</p></blockquote>"}]},{"num":77,"title":"第九誡命吩咐我們做什麼？","answer":"第九誡命吩咐我們：人與人相處總要真誠，持守真理，保守自己與鄰舍的名譽；作見證時，更當如此。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-10","days":[{"day":1,"html":"<p>別人相信我們是什麼樣的人，那也就是我們的名聲。有人得了勤奮的名聲。有的人得了詭詐的名聲。有時候，所謂名聲是以事實為根據的。有時候，名聲確實基於人們未必實事求是的說法。我們的名聲是重要的。如果我們有好名聲，別人就會尊重我們，會將榮耀歸給上帝，因為我們口裡承認我們是屬於上帝的。</p><p>這條誡命吩咐我們，要儘量保護我們和別人的名聲。當我們傳播關於別人的壞話，那我們就是在損毀別人的名聲。如果我們愛別人，我們就不會那麼容易地相信我們聽到的關於他們的壞話，我們也不會想把這些話傳給別人。如果我們知道我們所愛的某個人做了不該做的事，我們會在跟別人說這件事之前先跟他本人說。我們會想了解他這麼做的原因。我們不會馬上得出結論，說他故意犯錯誤。請讀彼得前書4:8。</p><blockquote><p><strong>彼得前書4:8</strong><br>最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。</p></blockquote>"},{"day":2,"html":"<p>保護別人的名聲，不意味著我們就不該講真話。愛別人，就要求我們在別人犯錯的時候說出來。愛不是對於錯誤視而不見。不過講真話要有關心的方式。請讀馬太福音18:15-18。</p><blockquote><p><strong>馬太福音18:15-18</strong><br>倘若你的弟兄得罪你，你就去趁著只有他和你在一處的時候，指出他的錯來。他若聽你，你便得了你的弟兄；<br>他若不聽，你就另外帶一兩個人同去，要憑兩三個人的口作見證，句句都可定準。<br>若是不聽他們，就告訴教會；若是不聽教會，就看他像外邦人和稅吏一樣。<br>我實在告訴你們：凡你們在地上所捆綁的，在天上也要捆綁；凡你們在地上所釋放的，在天上也要釋放。</p></blockquote><p>當我們知道某人犯了罪，我們應該先跟他談，不過一定是單獨跟他談。我們不可以先跟別人說這件事。為了保護這個人的名聲，我們應該跟他單獨談。我們應該趁著只有他自己的時候跟他談，這樣別人就不會聽到。我們會盼望他為自己所做的事懊悔，從而發生改變。但是，如果他不悔改，我們不會停止努力。我們必須足夠愛他，再帶幾個人一起努力改變他的想法。如果他還不聽，我們仍然不要放棄。聖經告訴我們，下一件事是告訴教會</p><p>的領袖和會眾，他們也會努力勸他放棄犯罪。如果他繼續犯罪，我們就不可以再把他看做是教會的一員了。當然，如果那人懊悔自己所犯的罪，教會總是應該歡迎他回來。</p>"},{"day":3,"html":"<p>我們應該透過謹慎我們對別人的評價，來保護別人的名聲。我們也要透過謹慎我們所聽的評價，來保護別人的名聲。因為我們都是罪人，所以聽到關於別人的壞話總是很有意思的事情。我們可能以為我們並沒有做錯什麼，因為我們並沒有說什麼。不過，當我們聽憑別人敗壞別人的名聲而不阻止，我們就是犯了罪。請讀箴言18:8。</p><blockquote><p><strong>箴言18:8</strong><br>傳舌人的言語，如同美食深入人的心腹。</p></blockquote><p>美食是非常可口的食物。美食叫我們難以抗拒。當我們看到美食當前、令人垂涎，我們只想吃掉它。別人的閒話就像美食。我們很想聽，很不容易告訴別人說「不，我不想聽你說這些東西。」如同美食入心腹，成為我們的一部分，我們聽到的壞話也會留在我們裡面，影響我們對別人的看法。儘管我們不能確定所聽到的東西是否真實，都會銘記在心，影響我們對人的看法。</p>"},{"day":4,"html":"<p>當上帝的律法禁止一件事的時候，它同時吩咐了相反的事。我們不可以渴慕聽別人說壞話。我們可能永遠不會承認我們願意聽人犯罪，不過我們聽到別人犯罪的那種急切心情，讓我們看起來似乎十分享受犯罪的事。請讀哥林多前書13:6。</p><blockquote><p><strong>哥林多前書13:6</strong><br>不喜歡不義，只喜歡真理。</p></blockquote><p>我們應該喜歡聽別人的好事，而不是壞事。請讀約翰三書3-4。</p><blockquote><p><strong>約翰三書3</strong><br>有弟兄來證明你心裡存的真理，正如你按真理而行，我就甚喜樂。</p><p><strong>約翰三書4</strong><br>我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的。</p></blockquote>"},{"day":5,"html":"<p>我們不僅應該悉心呵護別人的名聲，也當保護自己的名聲。我們不可以對於別人的看法過於在意，以至於我們做什麼事，甚至是錯誤的事，來讓別人以為我們很好。我們應該讓人對我們有誠實、可靠、善良的想法。我們努力對於名聲的願望，應該使我們總是留心去做誠實、可靠、善良的事。即使環境艱難的時候也是如此。如果我們總是留心行善、遠避惡行，我們就會有清楚的良心。那麼，即使別人造謠誹謗我們，說我們的壞話，那麼很快眾人都會清楚，那是謠言。請讀彼得前書3:15-16。</p><blockquote><p><strong>彼得前書3:15-16</strong><br>只要心裡尊主基督為聖。有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人。<br>存著無虧的良心，叫你們在何事上被毀謗，就在何事上可以叫那誣賴你們在基督裡有好品行的人自覺羞愧。</p></blockquote>"},{"day":6,"html":"<p>每個人都願意有好名聲。我們都情願相信別人對我們有好的看法。我們願意瞭解到，別人之所以願意叫我們做某個工作，是因為他們確信我們能做好。但是保護自己名聲的最重要理由，不是因為我們喜歡好名聲。我們保護自己名聲的最重要理由是，如果我們是基督徒，人們看到我們所做的，就會想到上帝。如果我們口裡承認是基督徒，卻有撒謊或不良的名聲，人們就會藐視上帝，這樣我們就羞辱了上帝。上帝是純一、聖潔、良善的。我們永遠沒有辦法用我們的生命，來向人展示上帝的真實良善程度，但是我們總是應該盡力行善。當我們留心照著該行的去行，人們會將榮耀歸給上帝的。請讀馬太福音5:14-16。</p><blockquote><p><strong>馬太福音5:14-16</strong><br>你們是世上的光。城造在山上，是不能隱藏的。<br>人點燈，不放在鬥底下，是放在燈臺上，就照亮一家的人。<br>你們的光也當這樣照在人前，叫他們看見你們的好行為，便將榮耀歸給你們在天上的父。</p></blockquote>"}]},{"num":78,"title":"第九誡命禁止我們做什麼？","answer":"第九誡命禁止我們：做任何不合乎真理、損害鄰舍名譽的事。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-10","days":[{"day":1,"html":"<p>上帝只講真理。上帝創造我們，要我們成為公義聖潔。祂創造我們，要像祂那樣講真理、愛真理。亞當聽從撒但的謊言，卻沒有順服上帝的真理，就犯了罪。結果，我們所有的人生來就是喜愛虛謊、不愛真理的罪人。當上帝拯救我們，使我們重生，祂改變我們，叫我們願意為上帝而活，願意討祂喜悅。祂賜給我們新的對於真理的喜愛。基督徒在遠避虛謊、只講真理的時候，就顯明上帝已經改變了他們的心。請讀以弗所書4:21-25。</p><blockquote><p><strong>以弗所書4:21-25</strong><br>如果你們聽過他的道，領了他的教，學了他的真理。<br>就要脫去你們從前行為上的舊人，這舊人是因私慾的迷惑漸漸變壞的。<br>又要將你們的心志改換一新。<br>並且穿上新人，這新人是照著 神的形像造的，有真理的仁義和聖潔。<br>所以你們要棄絕謊言，各人與鄰舍說實話，因為我們是互相為肢體。</p></blockquote>"},{"day":2,"html":"<p>第九誡命禁止人作假見證陷害鄰舍。它要求我們說真話。我們可能作的最壞的假見證，就是我們為上帝做假見證。請讀耶利米書23:30-32。</p><blockquote><p><strong>耶利米書23:30-32</strong><br>耶和華說：「那些先知各從鄰舍偷竊我的言語，因此我必與他們反對。」<br>耶和華說：「那些先知用舌頭說『是耶和華說的』，我必與他們反對。」<br>耶和華說：「那些以幻夢為預言，又述說這夢，以謊言和矜誇使我百姓走錯了路的，我必與他們反對。我沒有打發他們，也沒有吩咐他們。他們與這百姓毫無益處。」這是耶和華說的。</p></blockquote><p>大多數人都有自己對於上帝的想法。他們喜歡跟別人講，如果他們講到上帝的時候，說的東西不對，那麼這就不僅僅是撒謊的事了，這叫做褻瀆。許多人面對大群人演講，或者聲稱為上帝代言而著書立說。他們告訴那些願意聽的人，上帝是怎樣的上帝，不過他們講的關於上帝的話是不對的。甚至有自稱是基督徒牧師的，會說上帝這樣說，實際上上帝根本沒有說，他們還說到關於上帝的子虛烏有的事。</p><p>我們怎麼能確定我們對於上帝的想法是正確的呢？我們怎麼知道當我們跟別人講上帝的時候，我們不是在給祂作假見證呢？當人們說：「上帝就是這樣的」，我們怎麼能夠知道他們說的對不對呢？要弄清楚這些，唯一的途徑就是要知道聖經怎麼說。我們不可以滿足於對聖經一知半解，否則我們就會對於上帝產生錯誤的概念。我們需要研讀上帝全部的話語。我們必須常常研讀，熟悉聖經。聖經是唯一可以學習到關於上帝的真理的地方。</p>"},{"day":3,"html":"<p>第九誡命禁止我們做任何損害別人名譽的事。不過，我們應該在說真話的前提下，保護別人的名聲。因為上帝看重真實，我們也要重視真實。我們應該捍衛真理，即使以某人的名聲損毀為代價。昨天我們讀到有些人自稱為上帝代言，說出上帝從來沒說過的話。當我們知道這樣的事情發生，聖經要求我們也要讓眾人知道這樣的事。</p><p>我們必須指出那些為上帝作假見證的人，好保護別人，不讓人相信關於上帝的謊言。這麼做，會損害那假見證之人的名聲，不過這也是必須的。上帝的百姓一定要抵擋虛假與邪惡。他們不可以出於畏懼而不抨擊上帝所恨惡的那些事物。當有人拒絕聽從上帝的話，繼續教導並實踐惡行，我們必須直言不諱。請讀以弗所書5:8-11。</p><blockquote><p><strong>以弗所書5:8-11</strong><br>從前你們是闇昧的，但如今在主裡面是光明的，行事為人就當像光明的子女。<br>光明所結的果子就是一切良善、公義、誠實。<br>總要察驗何為主所喜悅的事。<br>那闇昧無益的事，不要與人同行，倒要責備行這事的人。</p></blockquote>"},{"day":4,"html":"<p>昨天的查經內容告訴我們，我們要責備那些闇昧的事。上帝的話語要求我們，在看到邪惡的事情時要指出來。我們看到其他基督徒犯罪的時候，我們要樂於去找他們，提醒他們聖經的教導。這不是說，我們應該密切監視周圍所有的人，盼望別人犯罪，好讓我們可以講論他一番。當我們知道某人犯罪的時候，我們有責任說話。我最應該密切監視其罪行的人是我自己。請讀馬太福音7:3-5。</p><blockquote><p><strong>馬太福音7:3-5</strong><br>為什麼看見你弟兄眼中有刺，卻不想自己眼中有梁木呢？<br>你自己眼中有梁木，怎能對你弟兄說「容我去掉你眼中的刺」呢？<br>你這假冒為善的人！先去掉自己眼中的梁木，然後才能看得清楚，去掉你弟兄眼中的刺。</p></blockquote>"},{"day":5,"html":"<p>人們常常為自己作假見證。在聖靈光照他們的罪惡之前，他們實際上相信自己是好人。當然，這是假的。如果問大多數人：你死的時候能上天堂嗎？他們會說，能。如果你問他們，你為什麼認為能上天堂呢？他們會說，因為他們努力一生做好人。他們會自己作假見證，因為他們沒有意識到自己有多麼罪惡。有一個年輕人曾經在耶穌面前為自己做了一次這樣的假見證。這個年輕人真心地相信自己一生中已經完全守住了上帝的律法。於是耶穌告訴他去做一件事，這就顯出他根本沒有自己以為的那麼好。請讀馬可福音10:17-22中的這個故事。</p><blockquote><p><strong>馬可福音10:17-22</strong><br>耶穌出來行路的時候，有一個人跑來，跪在他面前，問他說：「良善的夫子，我當做什麼事才可以承受永生？」<br>耶穌對他說：「你為什麼稱我是良善的？除了 神一位之外，再沒有良善的。<br>誡命你是曉得的：不可殺人，不可姦淫，不可偷盜，不可作假見證，不可虧負人，當孝敬父母。」<br>他對耶穌說：「夫子，這一切我從小都遵守了。」<br>耶穌看著他，就愛他，對他說：「你還缺少一件，去變賣你所有的，分給窮人，就必有財寶在天上；你還要來跟從我。」<br>他聽見這話，臉上就變了色，憂憂愁愁地走了，因為他的產業很多。</p></blockquote>"},{"day":6,"html":"<p>耶穌曾講過一個故事，講到兩個人。其中一個人在上帝面前作假見證。他想告訴上帝他是多麼好的一個人，但是上帝根本都不聽他。另一個人明白自己的底細。他告訴上帝關於自己的實情（當然上帝早已經知道了）。他告訴上帝說，他是個罪人，不配從祂得什麼。耶穌說，這個人祈求憐憫的禱告能夠得蒙垂聽和應允。請讀路加福音18:9-14。</p><blockquote><p><strong>路加福音18:9-14</strong><br>耶穌向那些仗著自己是義人，藐視別人的，設一個比喻，<br>說：「有兩個人上殿裡去禱告：一個是法利賽人，一個是稅吏。<br>法利賽人站著，自言自語地禱告說：『神啊，我感謝你，我不像別人勒索、不義、姦淫，也不像這個稅吏。<br>我一個禮拜禁食兩次，凡我所得的都捐上十分之一。』<br>那稅吏遠遠地站著，連舉目望天也不敢，只捶著胸說：『神啊，開恩可憐我這個罪人！』<br>我告訴你們：這人回家去比那人倒算為義了。因為凡自高的，必降為卑；自卑的，必升為高。」</p></blockquote>"}]},{"num":79,"title":"第十誡命是什麼？","answer":"第十誡命是：「不可貪戀人的房屋，也不可貪戀人的妻子、僕婢、牛驢，並他一切所有的。」","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-11","days":[{"day":1,"html":"<p>如果我們不仔細思考，只是快快地讀過十誡中的前九條誡命，我們可能會以為自己是好人。我們沒有向偶像禱告，也沒有殺人，也沒有偷盜。如果我們這樣來看十誡，我們就無法查驗我們的內心。我們沒有看到，內心裡面錯誤的思想和態度也可能會違反十誡。這最後一條誡命的目的之一，就是迫使人查驗內心，這樣才會意識到自己是有罪的。</p><p>掃羅是一個非常有才華的人。他一生都使用他的才華來研究上帝的律法。但是儘管他做了那麼多研究，儘管他那麼有才華，他還是沒有意識到自己是個罪人。他以為靠著自己就能守住上帝的律法。他看到自己需要一位救主，信靠耶穌之後，他說這是第十誡命向他顯明他是個罪人所沒有的東西。我們的貪心，在內心，沒人看得見。這條誡命告訴我們，罪不僅僅是我們在外面做出來的。內心錯誤的想法和感受也同樣是罪。請讀羅馬書7:7。</p><blockquote><p><strong>羅馬書7:7</strong><br>這樣，我們可說什麼呢？律法是罪嗎？斷乎不是！只是非因律法，我就不知何為罪。非律法說，「不可起貪心」，我就不知何為貪心。</p></blockquote>"},{"day":2,"html":"<p>當我們得知一個人殺了人，我們會把那個人投入監獄。當我們得知有人偷了東西，我們也會把他投入監獄。我們都同意，殺人和盜賊都是犯法的人。人們常常以為，因為自己沒有做過應該坐監的罪，我們就算是守法的人了。既然他們不是罪犯，那他們就一定是好人了。上帝並不這麼認為。對於那些因沒進過監獄就自以為是好人的人，上帝頒佈了這條律法「不可貪戀」。我們所有的人都不得不承認，我們曾經違背這條律法。我們所有的人都曾經因為別人擁有的財富或特權而心生嫉妒。上帝想讓我們明白，我們都違背了這條律法。祂想讓我們知道，即使這一條是我們唯一曾經違反過的律法，我們也同觸犯了所有的律法那樣有罪。請讀雅各書2:10。</p><blockquote><p><strong>雅各書2:10</strong><br>因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條。</p></blockquote>"},{"day":3,"html":"<p>上帝告訴我們，祂的話就像鏡子一樣。我們照鏡子，是要看看我們樣貌如何，有什麼需要改變的地方。當我們查考上帝的話，我們看到我們身上有錯誤需要改變的地方。請讀雅各書1:22-25。</p><blockquote><p><strong>雅各書1:22-25</strong><br>只是你們要行道，不要單單聽道，自己欺哄自己。<br>因為聽道而不行道的，就像人對著鏡子看自己本來的面目，<br>看見，走後，隨即忘了他的形容如何。<br>惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。</p></blockquote><p>如果我離開早餐桌臉上還沾著點兒雞蛋，別人看見我可能會笑我，而我自己卻不知道發生了什麼事。當我最後一照鏡子，我看到了臉上的雞蛋，就會有些尷尬，因為那點兒雞蛋一直就在那裡。我們可能沒有意識到我們是多麼罪惡，因為我們也沒有為我們的罪感到羞愧。當我們停下來想一想這條「不可貪戀」的誡命，我們就意識到，就連我們錯誤的想法也是罪。我們看到我們曾經想過多少錯誤的想法，對於我們一直不自覺的罪惡，我們會感到羞愧。這就是為什麼上帝賜下這條誡命。</p>"},{"day":4,"html":"<p>有時候我們控制不了我們的想法和感覺。有人說話做事傷害我們的感受，儘管有時只是一瞬間，我們會對那人感到憤怒和仇恨。我們會遭遇這樣那樣的難處，我們至少會有那麼一刻，為自己感到難過，盼望能夠好過一些。別人得到我們一直真心想要的東西，我們至少會有那麼一刻，希望是我們而不是他們得到那些東西。如果一個想法或感覺突然臨到我們，叫我們禁不住產生那些想法或感受，那算得上是罪嗎？是的，是罪。</p><p>我們可能以為，如果我們禁不住做了什麼事，上帝不應該把那叫做罪。但是，上帝是聖潔的。如果我們只是盡力而已，祂不會滿意的。我們只有活出完全順服祂的生活，祂才會滿意。祂想讓我們竭力為上帝榮耀而活。如果我們不如此，就是犯了罪。請讀加拉太書3:10。</p><blockquote><p><strong>加拉太書3:10</strong><br>凡以行律法為本的，都是被咒詛的，因為經上記著：「凡不常照律法書上所記一切之事去行的，就被咒詛。」</p></blockquote>"},{"day":5,"html":"<p>我們控制不了的思想和感受，上帝稱之為罪，是不是上帝過於嚴厲了？不是的。這向我們顯明上帝的憐憫。祂賜給我們誡命，顯明我們的內心多麼罪惡，藉此，上帝向我們顯明我們是多麼需要一位救主。救主，是把人們從危險中拯救出來的人。游泳池裡的人，除非真的溺水了，否則不會想要人來救他。我們只有相信自己是罪人，才會想要從罪中得救。「不可貪心」的誡命，向我們顯明，我們需要救主，這樣我們才會轉向基督來拯救我們。耶穌邀請那些感受到勞苦重擔的人來祂那裡得安息。只有知道我們是罪人，才會讓我們感到勞苦重擔。我們需要這樣的誡命，來讓我們意識到，我們有何等的重擔，好叫我們求告耶穌拯救我們。請讀馬太福音11:28-30。</p><blockquote><p><strong>馬太福音11:28-30</strong><br>凡勞苦擔重擔的人，可以到我這裡來，我就使你們得安息。<br>我心裡柔和謙卑，你們當負我的軛，學我的樣式，這樣，你們心裡就必得安息。<br>因為我的軛是容易的，我的擔子是輕省的。「</p></blockquote>"},{"day":6,"html":"<p>上帝的誡命向我們顯明我們是何等罪惡，這樣我們才會轉向主耶穌來拯救我們。我們一旦如此，上帝的誡命就會促使我們向祂感恩。上帝的誡命是好的，是完美的。我們千百次地以千百種方式違反了那些良善的律法。如果我們想要數算我們違反上帝律法的次數，我們會發現根本數不過來。但是當我們信靠基督的時候，上帝接納我們，算我們為完全的義人。律法比非基督徒知道他們是何等需要一位救主。它向基督徒顯明他們被赦免的有多麼地多。請讀路加福音7:36-47。</p><blockquote><p><strong>路加福音7:36-47</strong><br>有一個法利賽人請耶穌和他吃飯，耶穌就到法利賽人家裡去坐席。<br>那城裡有一個女人，是個罪人，知道耶穌在法利賽人家裡坐席，就拿著盛香膏的玉瓶，<br>站在耶穌背後，挨著他的腳哭，眼淚溼了耶穌的腳，就用自己的頭髮擦乾，又用嘴連連親他的腳，把香膏抹上。<br>請耶穌的法利賽人看見這事，心裡說：「這人若是先知，必知道摸他的是誰，是個怎樣的女人，是個罪人。」<br>耶穌對他說：「西門，我有句話要對你說。」西門說：「夫子，請說。」<br>耶穌說：「一個債主有兩個人欠他的債：一個欠五十兩銀子，一個欠五兩銀子，<br>因為他們無力償還，債主就開恩免了他們兩個人的債。這兩個人哪一個更愛他呢？」<br>西門回答說：「我想是那多得恩免的人。」耶穌說：「你斷的不錯。」<br>於是轉過來向著那女人，便對西門說：「你看見這女人嗎？我進了你的家，你沒有給我水洗腳，但這女人用眼淚溼了我的腳，用頭髮擦乾；<br>你沒有與我親嘴，但這女人從我進來的時候就不住地用嘴親我的腳；<br>你沒有用油抹我的頭，但這女人用香膏抹我的腳。<br>所以我告訴你，她許多的罪都赦免了，因為她的愛多；但那赦免少的，他的愛就少。」</p></blockquote>"}]},{"num":80,"title":"第十誡命吩咐我們做什麼？","answer":"第十誡命吩咐我們：要對自己的景況全然知足，並以正直、仁愛的心靈，對待我們的鄰舍，並他一切所有的。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-11","days":[{"day":1,"html":"<p>我們的生活狀況，就是指我們所擁有的，以及我們相對於他人的身份。包括我們的家庭、我們的種族、我們的背景。包括窮富、男女。健康、俊秀、迷人、擅長運動，這些都算是我們的景況。「不可貪念」這條誡命要求我們，要全然滿足於我們在這些領域所擁有的一切。</p><p>這是多麼難守的誡命啊！我們身體不好的時候，我們就想抱怨。有人跑得賽得了第一，我們得了第二，我們都會感到失望。真正地順服第十誡命，就是要全然滿足於我們所擁有的一切。我們要滿足於我們的所有，因為這是上帝賜給我們的。任何的才幹、健康、金錢、財富，都是上帝的禮物，並非是我們出生的時候帶到世上來的。請讀提摩太前書6:6-7。</p><blockquote><p><strong>提摩太前書6:6-7</strong><br>然而，敬虔加上知足的心便是大利了；<br>因為我們沒有帶甚麼到世上來，也不能帶甚麼去。</p></blockquote><p>不僅如此，我們所擁有的一切，都超過了我們所應得的。我們生來是罪人，悖逆上帝，但上帝因祂的慈愛賜福給我們。上帝使雅各富足，但也使雅各一生歷經患難。在創世記32章10節，雅各是怎麼談論上帝的賞賜的？</p><blockquote><p><strong>創世記32:10</strong><br>你向僕人所施的一切慈愛和誠實，我一點也不配得；我先前只拿著我的杖過這約旦河，如今我卻成了兩隊了。</p></blockquote>"},{"day":2,"html":"<p>我們能夠全然滿足於自己的生活景況，因為那是上帝為我們計畫的。回顧第七問，我們學過：「上帝的旨意，就是祂永恆裡的目的，根據祂計畫的美意；藉此，祂為自己的榮耀，預定了一切將要發生的事。」我們所遭遇的事，都不是偶然的。上帝計畫了我們出生的地方、我們長相的樣式、我們的父母是誰、我們擁有哪些才幹。上帝命定每一件事，也包括關於我們自身和我們所擁有的一切。</p><p>我們也曾在第十一問學過：「上帝的護理之工，就是以祂至極的聖潔、智慧、權能，保護管理祂所造的萬物，和它們一切的動作。」上帝掌管發生在我們身上的每一件事。我們所擁有的一切都是上帝所賜的，我們所失去的，也是祂所收取的。上帝從不失誤。不論我們能否明白祂為何賜予、又為何收取，我們都知道我們可以信靠祂。上帝曾賜給約伯許多福分，後來又讓他失去一切。請看約伯怎麼說。</p><blockquote><p><strong>約伯記1:21</strong><br>我赤身出於母胎，也必赤身歸回；賞賜的是耶和華，收取的也是耶和華；耶和華的名是應當稱頌的。</p></blockquote>"},{"day":3,"html":"<p>有些人相信，他們生命中美善、快樂的事物是來自於上帝，悲傷的、艱難的事物不是來自於上帝。如果你以為壞事都是偶然臨到你，那你就不容易滿足於生活中的景況。聖經教導我們，上帝看合適的時候，會讓患難臨到祂的兒女。患難能夠比順境更能叫我們各方面都得到長進。</p><p class=\"read-prompt\">請讀詩篇119:75。</p><blockquote><p><strong>詩篇119:75</strong><br>耶和華，我知道你的判語是公義的；你使我受苦是以誠實待我。</p></blockquote><p>患難意味著受苦。詩篇的作者正以受苦作為生活景況的一部分。他知道是上帝叫患難臨到，不管上帝做什麼，都是為著他的最大益處。請讀羅馬書8:28。</p><blockquote><p><strong>羅馬書8:28</strong><br>我們曉得萬事都互相效力，叫 神的人得益處，就是按他旨意被召的人。</p></blockquote><p>因為上帝的護理之工掌管萬事，無一例外，而且因為上帝的護理之工是全然聖潔智慧，我們可以確信我們生命中的景況，都是對我們最好的。正因為如此，我們可以對於我們的身份和擁有知足。不滿於我們所擁有的，就顯明我們不信靠上帝，那是犯罪。</p>"},{"day":4,"html":"<p>我們可以全然滿足於我們的景況，因為上帝告訴我們，什麼是最重要的。金錢、才幹、外貌、健康，都不是生命中最重要的。我們大都相信，如果我們的錢財再多一點點，如果我們擁有真心想要的某種東西，我們就會知足。或許是健康的身體或者更漂亮的牙齒，就會叫我們知足了。這些東西不會叫我們滿足的。我們不會在金錢、財富、健康、美貌中找到滿足。上帝創造我們，叫我們只認識祂、愛祂、榮耀祂。只有當我們擁有了用來愛上帝榮耀上帝的事物，我們才能真正滿足。</p><p>有一個人來到耶穌那裡，很不開心，因為他的哥哥不願他分家產。他想讓耶穌吩咐他哥哥分家產。不過，耶穌卻想叫他知道，即使他從哥哥那裡得到了他想要的錢，他也並沒有得到真正重要的東西。請讀路加福音12:13-21中的故事。</p><blockquote><p><strong>路加福音12:13-21</strong><br>眾人中有一個人對耶穌說：「夫子，請你吩咐我的兄長和我分開家業。」<br>耶穌說：「你這個人！誰立我作你們斷事的官，給你們分家業呢？」<br>於是對眾人說：「你們要謹慎自守，免去一切的貪心，因為人的生命不在乎家道豐富。」<br>就用比喻對他們說：「有一個財主田產豐盛，<br>自己心裡思想說：『我的出產沒有地方收藏，怎麼辦呢？』<br>又說：『我要這麼辦：要把我的倉房拆了，另蓋更大的，在那裡好收藏我一切的糧食和財物，<br>然後要對我的靈魂說：靈魂哪，你有許多財物積存，可作多年的費用，只管安安逸逸地吃喝快樂吧！』<br>神卻對他說：『無知的人哪，今夜必要你的靈魂，你所預備的要歸誰呢？』<br>凡為自己積財，在 神面前卻不富足的，也是這樣。」</p></blockquote>"},{"day":5,"html":"<p>我們對於生命的景況知足，是因為我們所有的一切都是上帝賜下來的，超過了我們所當得的。那些能夠改變我們景況的東西——更多的金錢、更美的外貌、更健壯的身體——都沒有真實、永恆的價值。上帝的兒女應該滿足於他們現在所有的，其中一個非常合理的原因是：上帝的兒女擁有上帝自己。上帝應許祂的百姓：「我要作你的神。」有了神，我們就不缺少什麼，也不需要什麼，來叫我們的生命更豐盛。</p><p>有個人叫亞薩，他寫了詩篇第73篇。祂與貪心的罪惡爭戰之時寫下這篇詩篇。請讀詩篇73:2-3。</p><blockquote><p><strong>詩篇73:2-3</strong><br>至於我，我的腳幾乎失閃，我的腳險些滑跌。<br>我見惡人和狂傲人享平安，就心懷不平。</p></blockquote><p>亞薩嫉妒誰呢？為什麼？當他看到惡人，似乎他們得到了一切——雖然他一直想要討上帝的喜悅，可是連他沒有的東西。他倒有了。請讀第4節和第12節。</p><blockquote><p><strong>詩篇73:4</strong><br>他們死的時候沒有疼痛，他們的力氣卻也壯實。</p><p><strong>詩篇73:12</strong><br>看哪，這就是惡人，他們既是常享安逸，財寶便增加。</p></blockquote><p>在這篇詩篇的末尾，亞薩意識到兩件事。第一，上帝會在怒中滅盡惡人。他們今生享用的一切都幫不了他們。除此以外，亞薩還意識到，他現在擁有的一切比惡人擁有的一切更好，因為亞薩擁有上帝。</p><p>一份，就是一個人得到的那部分。分蛋糕的時候，你可能得到最大的那一份。在聖經的時代，長子會得到父親財產中最大的那份。亞薩明白了，上帝自己就是他得的那份，上帝永遠是他得到的那份。請讀詩篇73:23-26。</p><blockquote><p><strong>詩篇73:23-26</strong><br>然而我常與你同在，你攙著我的右手。<br>你要以你的訓言引導我，以後必接我到榮耀裡。<br>除你以外，在天上我有誰呢？除你以外，在地上我也沒有所愛慕的！<br>我的肉體和我的心腸衰殘，但 神是我心裡的力量，又是我的福分，直到永遠。</p></blockquote>"},{"day":6,"html":"<p>我們已經看到，「不可貪戀」這條誡命叫我們要全然滿足於我們生命的景況。它也吩咐我們要對他人和他人的財富「有正直、仁愛之心」。耶穌告訴我們，我們無論想要人怎樣對待我們，我們就應該怎樣待人（馬太福音7:12）。這就是我們對待他人及其財富的正直仁愛之心。</p><p class=\"read-prompt\">請讀羅馬書12:9-16。</p><blockquote><p><strong>羅馬書12:9-16</strong><br>愛人不可虛假；惡要厭惡，善要親近。<br>愛弟兄，要彼此親熱，恭敬人，要彼此推讓。<br>殷勤不可懶惰。要心裡火熱，常常服事主。<br>在指望中要喜樂，在患難中要忍耐，禱告要恆切。<br>聖徒缺乏要幫補，客要一味地款待。<br>逼迫你們的，要給他們祝福；只要祝福，不可咒詛。<br>與喜樂的人要同樂；與哀哭的人要同哭。<br>要彼此同心，不要志氣高大，倒要俯就卑微的人。不要自以為聰明。</p></blockquote><p>如果我們想要被人尊重，如果我們樂意領先，那麼當別人得到榮譽，或者當別人得獎的時候，我們也應該高興才是。既然我們喜歡擁有某些東西，那麼當別人擁有那些東西的時候，我們就應該高興。如果我們盼望我們更漂亮、更健康，那麼我們就應該為漂亮、健康的人感到高興。我們也看到，當我們看這條誡命的時候，我們發現自己是何等地背離上帝的律法。對我們來說，嫉妒別人遠比為別人高興來得更輕鬆、更自然。我們的心是何等地邪惡。我們以各種方式違背上帝的律法。我們何等需要一位救主啊！</p>"}]},{"num":81,"title":"第十誡命禁止我們做什麼？","answer":"第十誡命禁止我們：對自己的景況不滿足，對鄰舍的福利嫉妒或心懷不平，對他人所有的任何事物，有非分之想或行為。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-11","days":[{"day":1,"html":"<p>上帝要求我們，要滿足於自己所有的。當我們貪戀祂沒有賜給我們的東西時，祂就不喜悅。上帝曾解救以色列脫離埃及為奴之地。祂帶領他們前往祂應許賜給他們的地方。在途中，以色列人沒有食物店鋪飯館可以買食物。他們本來可能會餓死，不過上帝供應他們食物。祂用糧食為他們從天而降。那糧食名字叫做嗎哪。夜裡嗎哪降下，每早晨以色列人起來的時候，地上都有新鮮的嗎哪。他們只需要帶著筐子出去收取就行了。</p><p>從聖經中對於嗎哪的描述，它肯定是非常好吃的。你以為以色列人肯定會感激上帝的。祂在茫茫曠野中，為這麼多人供應食行。不過，以色列人也和我們是一樣的罪人。他們起初倒是頗為感激，不過他們漸漸就不知足了。日復一日，翻來覆去都是一樣的食物，他們抱怨起來了。請讀民數記11:4-6中，看他們說什麼。</p><blockquote><p><strong>民數記11:4-6</strong><br>他們中間的閒雜人大起貪慾的心，以色列人又哭號說：「誰給我們肉吃呢？<br>我們記得在埃及的時候，不花錢就吃魚，也記得有黃瓜、西瓜、韭菜、蔥、蒜、<br>現在我們的心血枯竭了，除這嗎哪以外，在我們眼前並沒有別的東西！」</p></blockquote><p>上帝給以色列人的營中降下了可以吃的鳥，名叫鵪鶉。千萬的鵪鶉在營中低飛，叫以色列人輕而易舉就可以抓到，作為食物吃掉。但是，上帝卻對以色列人很憤怒，因為他們竟然不滿足於嗎哪。請讀第33和34節，看看因為上帝的憤怒，發生了什麼事。</p><blockquote><p><strong>民數記11:33-34</strong><br>肉在他們牙齒之間，尚未嚼爛，耶和華的怒氣就向他們發作，用最重的災殃擊殺了他們。<br>那地方便叫作基博羅哈他瓦（注：就是「貪慾之人的墳墓」），因為他們在那裡葬埋那起貪慾之心的人。</p></blockquote>"},{"day":2,"html":"<p>每個精彩的故事裡往往都有一個大壞蛋。聖經中最精彩的故事之一，就是以斯帖的故事。皇后以斯帖是個猶太人，她挽救了她的同胞免於滅頂之災。故事中有一個特別卑鄙無恥的壞蛋——就是邪惡的哈曼。哈曼叫國王同意，下令處死各處的猶太人。這都起因於一個叫做末底改的猶太人，他在末底改面前經過的時候，末底改不拜他。哈曼就是一個違背「不可貪念」這條誡命的典型。哈曼不滿足於自己所有的，他想叫惡事臨到別人。國王曾叫哈曼在國中位列次席。哈曼有錢、有權，幾乎是一無所缺。不過，他卻因為一個人沒有隨他的心願來恭敬他就鬱鬱寡歡。請讀以斯帖記5:10-13，看看哈曼抱怨什麼。</p><blockquote><p><strong>以斯帖記5:10-13</strong><br>哈曼暫且忍耐回家，叫人請他朋友和他妻子細利斯來。<br>哈曼將他富厚的榮耀，眾多的兒女，和王抬舉他使他超乎首領臣僕之上，都述說給他們聽。<br>哈曼又說：「王后以斯帖預備延席，除了我之外，不許別人隨王赴席。明日王后又請我隨王赴席；<br>只是我見猶大人末底改坐在朝門，雖有這一切榮耀，也與我無益。」</p></blockquote>"},{"day":3,"html":"<p>詩篇112描述了義人和他將要得到的祝福。詩篇中說義人永遠穩固。義人會永遠信靠主。他有足夠的東西與窮人分享。請讀詩篇112:10，看看惡人對於義人的福分有何反應。</p><blockquote><p><strong>詩篇112:10</strong><br>惡人看見便惱恨，咬牙而消化；惡人的心願要歸滅絕。</p></blockquote><p>這種邪惡的心態，是第十誡命所禁止的。我們不可對於別人的成功產生嫉妒或不平的心。我們閱讀詩篇第112篇的時候，會承認惡人嫉妒別人是錯誤的。但是我們卻常常犯同樣的錯誤。別人成功的時候，我們心存嫉妒。我們情願成功的人是我們。也許我們不太喜歡的人因為什麼原因受到了讚揚。我們不太高興，因為我們覺得他/她不配。這確實不是一個容易守的誡命。它迫使我們認真省察我們自己的心態，叫我們看到我們常常是罪惡的。</p>"},{"day":4,"html":"<p>第十誡命也禁止我們對於別人的東西有任何非分之想。有一個故事講到一位以色列的國王，他貪戀別人的葡萄園。請讀列王紀上21:1-2。</p><blockquote><p><strong>列王紀上21:1-2</strong><br>這事以後，又有一事。耶斯列人拿伯在耶斯列有一個葡萄園，靠近撒瑪利亞王亞哈的宮。<br>亞哈對拿伯說：「你將你的葡萄園給我作菜園，因為是靠近我的宮；我就把更好的葡萄園換給你，或是你願意，我就按著價值給你。」</p></blockquote><p>起初，亞哈想要得到那個葡萄園，也沒什麼錯或可言。因為那葡萄園靠近王宮，作個菜園很合適。他主動提出要把它買過來或者換過來，甚至願意出高價錢。不過，葡萄園的主人拿伯不想賣。現在，亞哈的慾望就成了非分之想。請讀第4-6節。</p><blockquote><p><strong>列王紀上21:4-6</strong><br>亞哈因耶斯列人拿伯說「我不敢將我先人留下的產業給你」，就悶悶不樂地回宮，躺在床上，轉臉向內，也不吃飯。<br>王后耶洗別來問他說：「你為什麼心裡這樣憂悶，不吃飯呢？」<br>他回答說：「因我向耶斯列人拿伯說：『你將你的葡萄園給我，我給你價銀，或是你願意，我就把別的葡萄園換給你。』他卻說：『我不將我的葡萄園給你。』」</p></blockquote><p>亞哈的反應十分幼稚。我們也常有同樣的做法。儘管我們擁有那麼多，卻總有一樣——往往是很小很不起眼的什麼東西——就讓我們現在非常渴望擁有。如果我們得不到，我們就惱怒不已，因為得不到的東西撅嘴生氣。當我們如此行的時候，我們就顯明瞭，我們的願望不是健康的良好願望，而是非分之想。我們的心態是惡的，如果我們不謹慎，我們就會在罪中越陷越深。亞哈就是這樣。請讀列王紀上21:8-16，看看他做了什麼事情。</p><blockquote><p><strong>列王紀上21:8-16</strong><br>於是，託亞哈的名寫信，用王的印印上，送給那些與拿伯同城居住的長老貴胄。<br>信上寫著說：「你們當宣告禁食，叫拿伯坐在民間的高位上。<br>又叫兩個匪徒坐在拿伯對面，作見證告他說：『你謗瀆 神和王了。』隨後就把他拉出去用石頭打死。」<br>那些與拿伯同城居住的長老貴胄，得了耶洗別的信，就照信而行，<br>宣告禁食，叫拿伯坐在民間的高位上。<br>有兩個匪徒來，坐在拿伯的對面，當著眾民作見證告他說：「拿伯謗瀆神和王了！」眾人就把他拉到城外，用石頭打死。<br>於是打發人去見耶洗別說：「拿伯被石頭打死了。」<br>耶洗別聽見拿伯被石頭打死，就對亞哈說：「你起來得耶斯列人拿伯不肯為價銀給你的葡萄園吧！現在他已經死了。」<br>亞哈聽見拿伯死了，就起來，下去要得耶斯列人拿伯的葡萄園。</p></blockquote>"},{"day":5,"html":"<p>亞哈的嫉妒和非分之想導致了謀殺。第十誡命是非常重要的，因為它處理的是我們的思想和心態。凡我們所做的，無論善惡，都起源於一個想法或一種心態。我們若不及時阻止，罪惡的想法和心態就會演變為罪惡的行為。請讀雅各書4:1-3。</p><blockquote><p><strong>雅各書4:1-3</strong><br>你們中間的爭戰、鬥毆，是從哪裡來的呢？不是從你們百體中戰鬥之私慾來的嗎？<br>你們貪戀，還是得不著；你們殺害嫉妒，又鬥毆爭戰，也不能得。你們得不著，是因為你們不求；<br>你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中。</p></blockquote>"},{"day":6,"html":"<p>剛剛讀到第十誡命的時候，似乎沒那麼難，可是要守起來要難得多。當上帝吩咐我們不要做什麼，祂就是吩咐我們做相反的事。當祂命令我們不可殺人（這看起來太容易了），祂也是在命令我們去愛——完美地、持之以恆地去愛。祂命令我們不可敬拜別神，而要單單敬拜祂——完美地、持之以恆地敬拜祂。當我們停下來想一想十誡，我們就意識到，它們太嚴格了，我們遵守不了。上帝把「不可貪戀」這一條誡命放在裡面，免得我們想法不對。</p><p>我們必須時刻全然滿足於自己所有的。我們必須對於別人的福利感到歡喜，就如同這些事臨到我們自己身上。這條誡命清楚地顯明，我們是違背律法的人。上帝將違背祂律法的人視為祂的敵人，不喜悅他們。請讀詩篇5:4-6。</p><blockquote><p><strong>詩篇5:4-6</strong><br>因為你不是喜悅惡事的 神，惡人不能與你同居。<br>狂傲人不能站在你眼前；凡作孽的，都是你所恨惡的。<br>說謊言的，你必滅絕；好流人血、弄虛詭詐的，都為耶和華所憎惡。</p></blockquote><p>十誡，尤其是第十誡命，叫我們看到，如果我們不信靠主耶穌基督來拯救我們脫離上帝對我們罪惡的憤怒，我們會處於多麼危險的境地啊！</p>"}]},{"num":82,"title":"有人能完全遵守神的誡命嗎？","answer":"自從人類墮落以來，沒有一人能在今生完全遵守神的誡命，反倒在思想、言語和行為上，天天違背神的誡命。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-12","days":[{"day":1,"html":"<p>當我們花時間學習十誡的時候，我們看到每天我們多少次地以多少不同的方式來違背十誡。當上帝吩咐我們不要做什麼事的時候，祂吩咐我們做相反的事。我們一旦明白了這一點，我們就看到，我們無法做到上帝對我們所有的要求。當上帝命令我們要有某種的行為，祂也命令我們要有那種的思想和感受。如果我們意識到這一點，我們就意識到，我們無法完全遵守上帝的誡命。</p><p class=\"read-prompt\">請讀雅各書3:2。</p><blockquote><p><strong>雅各書3:2</strong><br>原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。</p></blockquote><p>雅各說我們在許多事上都有過失。他用我們所說的話來舉例子。如果你思考一下，是否在言語上遵守了它們，就會發現在很多事上都有罪。你曾否在主日學課或者主日聽道的時候講話呢？那麼你就已經違背了「守安息日為聖」的誡命了。你曾否頂撞過在上有權柄的呢？如果有，那麼你就已經違背了「孝敬父母」的誡命了。你曾否罵過人呢？因為沒有表現愛心，你違背了「不可殺人」的誡命。你曾否跟人講另外一個人的壞話呢？那麼你就是偷竊了那人的名譽，違背了「不可偷盜」的誡命。正如雅各所說，我們用我們的嘴巴犯了很多的過失。但是我們不僅僅在言語上犯罪，我們在行為上也犯罪，還在我們的慾望、愛憎、思想、感覺上犯罪。很清楚，我們沒有一個人遵守了上帝的誡命。</p>"},{"day":2,"html":"<p>沒有一個人能守上帝的誡命，這是不是讓上帝很驚訝呢？當然不會。上帝賜下律法的時候就知道，沒有人能守住律法。那麼祂為什麼賜給我們一頁又一頁的律法呢？上帝的目的是叫我們看到我們多麼需要基督。當我們讀祂的誡命，我們看到上帝自己的屬性。我們看到一個人要多麼聖潔才能得到上帝的悅納。當我們把自己與上帝在律法中所要求的相比較，我們就意識到我們遠遠沒有足夠聖潔，配得祂悅納我們。上帝的誡命向我們顯明我們&lt;/content&gt;&lt;/invoke&gt;決不能靠著遵行律法來取悅上帝。我們需要一位能夠代替我們遵行律法的。我們需要一位承擔我們違背誡命帶來的刑罰的。上帝賜給我們律法和誡命，叫我們看到我們需要一位救主。請讀加拉太書3:24。</p><blockquote><p><strong>加拉太書3:24</strong><br>這樣，律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。</p></blockquote>"},{"day":3,"html":"<p class=\"read-prompt\">請讀羅馬書8:7-8。</p><blockquote><p><strong>羅馬書8:7-8</strong><br>原來體貼肉體的，就是與神為仇，因為不服神的律法，也是不能服。<br>而且屬肉體的人不能得神的喜歡。</p></blockquote><p>我們成為基督徒之前，我們不守上帝的誡命，因為我們不能守。只有上帝改變我們心的時候，我們才會想要做上帝要我們做的事情。我們一旦成為基督徒，就不再一樣了。這時，上帝已經改變了我們的心，叫我們想做取悅上帝的事情。上帝也賜給我們祂的聖靈，住在我們裡面，叫我們能夠做祂喜悅的事情。不過，我們無法完美地遵守上帝的誡命，因為我們的心裡還有殘餘的罪。當我們做我們裡面的聖靈要我們做的事情，我們就是在遵守上帝的誡命。當我們做我們裡面的罪叫我們做的事情，我們就是在違背上帝的誡命。只要我們還在世上作基督徒，我們就應該在學習順服聖靈的引導、抵擋罪惡本性的挑釁方面不斷成長。請讀加拉太書5:16-18。</p><blockquote><p><strong>加拉太書5:16-18</strong><br>我說：你們當順著聖靈而行，就不放縱肉體的情慾了。<br>因為情慾和聖靈相爭，聖靈和情慾相爭，這兩個是彼此相敵，使你們不能做所願意的。<br>但你們若被聖靈引導，就不在律法以下。</p></blockquote>"},{"day":4,"html":"<p>因為基督徒知道，耶穌已經替他們遵守了律法，他們也知道他們自己無法遵守上帝的誡命，那麼他們是否可以停止努力呢？基督徒可以隨心所欲地生活嗎？斷然不可！自稱是基督徒的人，就是宣告自己是屬於主耶穌基督的國度。耶穌是他們的君王。他們必須順服君王，遵守上帝的誡命！耶穌說，祂的百姓應該以成為完全為目標，因為上帝是完全的。請讀馬太福音5:48。</p><blockquote><p><strong>馬太福音5:48</strong><br>所以你們要完全，像你們的天父完全一樣。</p></blockquote><p>當基督徒犯罪（他們是會犯罪的）的時候，耶穌站在他們與上帝的憤怒中間，因為耶穌已經親身承擔這憤怒。請讀約翰一書2:1-2。</p><blockquote><p><strong>約翰一書2:1-2</strong><br>我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。<br>他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪。</p></blockquote>"},{"day":5,"html":"<p>這一問的回答說，沒有人能在今生完全遵守上帝的誡命。那是不是說人們將在來生完全遵守上帝的誡命呢？聖經告訴我們，當耶穌再來迎接祂的百姓永遠與祂在天堂之中，他們將得著榮耀。得榮耀的一部分就是成為完全，能夠永不犯罪了。最終，上帝的百姓就如同耶穌那樣。那時，他們就能完全遵守上帝的誡命了。請讀約翰一書3:2。</p><blockquote><p><strong>約翰一書3:2</strong><br>親愛的弟兄啊，我們現在是神的兒女，將來如何，還未顯明；但我們知道，主若顯現，我們必要像他，因為必得見他的真體。</p></blockquote><p>就連那些已經死了的信徒，他們的靈魂在天堂等待身體從死裡復活。他們已經得以完全，能夠不再犯罪了。請讀希伯來書12:22-23。</p><blockquote><p><strong>希伯來書12:22-23</strong><br>你們乃是來到錫安山，永生神的城邑，就是天上的耶路撒冷。那裡有千萬的天使，<br>有名錄在天上諸長子之會所共聚的總會，有審判眾人的神和被成全之義人的靈魂。</p></blockquote>"},{"day":6,"html":"<p>這一問的回答說，沒有人能完全遵守上帝的誡命。耶穌完全地遵守了上帝的誡命。回答說的是，沒有一個凡人能夠完全遵守上帝的誡命。所謂凡人，就是僅僅是人，此外無他。當然，耶穌就不僅僅是人。祂是完全的人，但祂也是上帝。我們不能停止犯罪，可是耶穌卻不能犯罪。上帝是不可能犯罪的。耶穌是上帝。所以耶穌不可能犯罪。我們可以完全信靠祂，因為祂代替我們完全遵守了上帝的律法。當我們受試探的時候，我們可以來到祂那裡得幫助，因為祂也是人，知道被試探是怎樣的。請讀希伯來書4:14-16。</p><blockquote><p><strong>希伯來書4:14-16</strong><br>我們既然有一位已經升入高天尊榮的大祭司，就是神的兒子耶穌，便當持定所承認的道。<br>因我們的大祭司並非不能體恤我們的軟弱，他也曾凡事受過試探，與我們一樣；只是他沒有犯罪。<br>所以我們只管坦然無懼地來到施恩的寶座前，為要得憐恤，蒙恩惠，作隨時的幫助。</p></blockquote>"}]},{"num":83,"title":"違背律法的罪，都是同樣邪惡嗎？","answer":"有些罪因其本身，或因情節加重，在神眼中比其他的罪更加邪惡。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-12","days":[{"day":1,"html":"<p>即使只違背上帝的一條誡命，就足以叫我們在上帝面前有罪，將我們置身於祂的憤怒之中。我們可能會把某個事情看成小罪，不過因為所有的罪都是得罪上帝的，那麼就沒有小罪這麼回事。所有的罪都使我們成為違背律法的人。但是聖經告訴我們，有些罪會比其他的罪受到更重的審判，因為在上帝的嚴重，它們更為邪惡。有哪些罪比其他罪更加邪惡呢？</p><p>所有的罪都得罪上帝，甚至包括那些得罪人的罪。大衛謀殺烏利亞，娶了烏利亞的妻子之後，他向上帝認罪，說「我向你犯罪，惟獨得罪了你」。有時候人犯罪，只是想得罪別人。他們根本沒想到上帝。不過有些罪是刻意地得罪上帝，就比如人褻瀆上帝或者試圖阻止別人敬拜上帝。刻意得罪上帝，比只是想傷害人的罪要更嚴重。請讀撒母耳記上2:17,23-25。</p><blockquote><p><strong>撒母耳記上2:17</strong><br>如此，這二少年人的罪在耶和華面前甚重了，因為他們藐視耶和華的祭物（注：或作「他們使人厭棄給耶和華獻祭」）。</p><p><strong>撒母耳記上2:23-24</strong><br>他就對他們說：「你們為何行這樣的事呢？我從這眾百姓聽見你們的惡行。<br>我兒，不可這樣！我聽見你們的風聲不好，你們使耶和華的百姓犯了罪。</p></blockquote>"},{"day":2,"html":"<p>刻意得罪上帝的罪要比得罪人的罪更重。有些得罪人的罪比另一些得罪人的罪更惡。一個罪是否更邪惡，要看它對於別人傷害的程度。在十誡中，禁止我們得罪別人的罪是按照最大的傷害程度（不可殺人）到最小的傷害程度（不可貪戀）的次序排列的。奪取別人的性命比傷害他的婚姻更邪惡。傷害一個人的婚姻比偷竊他的財產更邪惡。請讀箴言6:30-35。</p><blockquote><p><strong>箴言6:30-35</strong><br>賊因飢餓偷竊充飢，人不藐視他，<br>若被找著，他必賠還七倍，必將家中所有的盡都償還。<br>與婦人行淫的，便是無知，行這事的，必喪掉生命。<br>他必受傷損，必被凌辱，他的羞恥不得塗抹。<br>因為人的嫉恨成了烈怒，報仇的時候決不留情。<br>什麼贖價，他都不願；你雖送許多禮物，他也不肯干休。</p></blockquote>"},{"day":3,"html":"<p>另一個決定某些罪是否比別的罪更邪惡的因素，是犯罪之人的地位。上帝叫某些人成為別人的領導者。人們把他們當作領導來尊重，並且效法他的榜樣。當處於領導位置的人犯罪時，其他人可能會效法他。人們看到領導作了上帝禁止的事情，自此以為沒什麼問題，畢竟領導者在這樣做。父母、教師、教會領袖，以及其他有權柄的人必須要格外謹慎不要作壞榜樣。請讀雅各書3:1。</p><blockquote><p><strong>雅各書3:1</strong><br>我的弟兄們，不要多人作師傅，因為曉得我們要受更重的判斷。</p></blockquote>"},{"day":4,"html":"<p>有些罪比其他罪更邪惡，是因為犯罪之人的身份。當基督徒犯罪的時候，他的罪要比非基督徒犯同樣的罪更邪惡。之所以這麼說，有幾個理由。首先，基督徒知道那個罪是罪，而非基督徒可能沒有意識到。還有，上帝賜給基督徒一個新心，叫他能夠順服上帝，而非基督徒不能做到上帝喜悅的事。基督徒有聖靈住在他裡面，指教他應該做什麼，並且給他遵行命令所需的能力。非基督徒沒有這樣的幫助。最後，基督徒代表著基督。人們看著他就會想「耶穌就是這樣的」。當他犯罪的時候，他羞辱了基督。所有這些因素，使得基督徒的罪比非基督徒犯的同樣的罪更邪惡。請讀羅馬書2:23-24。</p><blockquote><p><strong>羅馬書2:23-24</strong><br>你指著律法誇口，自己倒犯律法玷辱神嗎？<br>神的名在外邦人中，因你們受了褻瀆，正如經上所記的。</p></blockquote>"},{"day":5,"html":"<p>在基督徒家庭長大，這是個很大的特權。它使你擁有許多人沒有的好處。你從小就知道上帝是誰，知道上帝對你的要求。你從小了解福音，知道上帝賜下救主，叫你可以因信稱義。生長在基督徒的家庭裡也帶來更大的責任。你越知道上帝是誰、祂要什麼，你就越沒有藉口犯罪。聖經教我們，那些完全知道自己該做什麼，卻拒絕去做的人，他們要比那些沒有這些知識的人受到更重的懲罰。請讀路加福音12:47-48。</p><blockquote><p><strong>路加福音12:47-48</strong><br>僕人知道主人的意思，卻不預備，又不順他的意行，那僕人必多受責打；<br>惟有那不知道的，做了當受責打的事，必少受責打。因為多給誰，就向誰多取；多託誰，就向誰多要。</p></blockquote>"},{"day":6,"html":"<p>基督徒父母的兒女，從小就是上帝百姓的一部分。他們聚集聽上帝的話、共同敬拜上帝的時候，就與上帝的百姓合為一體。上帝的百姓彼此教導和服侍的時候，就教導並服侍了他們。基督徒父母的兒女從小反覆聽到福音。他們從小就知道上帝賜下祂的兒子，為罪獻上為祭，罪得赦免的唯一出路就是信靠他。基督教會的孩童，是為為他們禱告的人們一同成長。</p><p>儘管如此，基督徒家庭長大的孩子也可能會拒絕信靠主耶穌基督。他可能反而選擇活在悖逆上帝的罪中。這個罪，要比從小沒有聽過主耶穌基督的人所犯的罪更重。你生長在基督徒家庭中，就要為你擁有的特權感恩，何千萬別藐視這些特權。要知道，上帝審判你的罪，會比別人的罪更重。一定要確保你的信心是在基督裡，靠著祂承擔上帝的審判。請讀希伯來書10:26-31。</p><blockquote><p><strong>希伯來書10:26-31</strong><br>因為我們得知真道以後，若故意犯罪，贖罪的祭就再沒有了，<br>惟有戰懼等候審判和那燒滅眾敵人的烈火。<br>人干犯摩西的律法，憑兩三個見證人尚且不得憐恤而死；<br>何況人踐踏神的兒子，將他成聖之約的血當作平常，又褻慢施恩的聖靈，你想，他要受的刑罰該怎樣加重呢？<br>因為我們知道誰說：「伸冤在我，我必報應。」又說：「主要審判他的百姓。」<br>落在永生神的手裡，真是可怕的！</p></blockquote>"}]},{"num":84,"title":"每一個罪所當受的刑罰是什麼？","answer":"每一個罪，在今世和來生，都當受神的震怒和咒詛。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-12","days":[{"day":1,"html":"<p>在第十六問中，我們學過，當亞當犯罪的時候，他是代表著整個人類。當亞當犯罪的時候，我們所有的人都在他裡面犯了罪，與他一同墮落了。在第十九問，我們學過，正因為這個原因，所有的人類都在上帝的震怒和咒詛之下。這個問答教導我們，我們處於上帝的震怒和咒詛之下，不僅僅是因為亞當的罪，也是因為我們自己的罪。因為亞當所做的，上帝看所有人都是有罪的。即便不是這種情況，我們每個人都親身得罪了上帝，天天如此，屢次三番。因為這些罪中的每一個都會招致上帝的震怒和咒詛，所以說我們每個人都因為我們自己的罪，在上帝面前全然有罪。</p><p>因為我們在上帝面前是有罪的，理應出於兩個原因受懲罰。第一，因為我們在亞當裡犯了罪，其次，因為我們自己有罪，選擇悖逆了罪。我們每個人唯一的希望，就是不要再自以為是好人，要承認我們在上帝面前是不可救藥、罪惡滿盈。一旦我們認識到我們是罪人，我們就能轉向基督，只有祂能夠拯救罪人脫離上帝的震怒和咒詛。請讀約翰一書1:8-10。</p><blockquote><p><strong>約翰一書1:8-10</strong><br>我們若說自己無罪，便是自欺，真理不在我們心裡了；<br>我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義；<br>我們若說自己沒有犯過罪，便是以神為說謊的，他的道也不在我們心裡了。</p></blockquote>"},{"day":2,"html":"<p>這一問的回答，為什麼說每一個罪都應得上帝的震怒和咒詛呢？人們常常得罪我們，我們會饒恕他們。實際上，上帝告訴我們，要饒恕別人傷害我們的那些事。當人們做一些特別邪惡的事情，或者當他們屢次犯同樣的罪，我們就會覺得很難饒恕他們了。但是，我們都會放過小罪。難道上帝不應該也這樣做嗎？當真每一個罪都應得上帝的震怒和咒詛嗎？</p><p>得罪上帝的罪，完全不同於得罪人的罪。得罪了人，是得罪另一個罪人。得罪上帝，是得罪那從不犯罪的聖者。當我們得罪上帝時，我們得罪了那位賜給我們一切的，包括我們的生命和我們呼吸的空氣。當我們得罪上帝，我們得罪了萬有的主宰，祂配得絕對的順服。得罪這樣的一位上帝，是十分邪惡的。這就是為何我們的罪為我們換來的是祂的震怒和咒詛。請讀詩篇2:1-3。</p><blockquote><p><strong>詩篇2:1-3</strong><br>外邦為什麼爭鬧？萬民為什麼謀算虛妄的事？<br>世上的君王一齊起來，臣宰一同商議，要敵擋耶和華並他的受膏者，<br>說：「我們要掙開他們的捆綁，脫去他們的繩索。」</p></blockquote>"},{"day":3,"html":"<p>大多數人發現臭鼬的味道很叫人受不了。但是，其他的臭鼬倒彷彿不在乎那種味道。我們的罪是邪惡的，大大冒犯聖潔的上帝。可是，對我們來說，它們好像沒那麼嚴重，因為我們是罪人。有些名人正因為他們腐敗的生活併為此炫耀而名噪一時。上帝把這叫做罪。長時間工作，只想賺更多的錢，結果忽略了很多重要的事情，這是非常司空見慣的事情，不過上帝把這叫做罪。幾乎在每一部電影或電視劇裡面都能看到罵人話，以及拿那些應該尊重的事開玩笑。保羅在寫給以弗所教會的信中，列舉了以上這些事，把它們看做是上帝將懲罰的犯罪的例子。這些事情對我們來說好像沒那麼嚴重，因為這些事已經司空見慣了，但是上帝卻被這些罪大大地冒犯了。請讀以弗所書5:3-7。</p><blockquote><p><strong>以弗所書5:3-7</strong><br>至於淫亂並一切汙穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。<br>淫詞、妄語和戲笑的話都不相宜，總要說感謝的話。<br>因為你們確實地知道，無論是淫亂的，是汙穢的，是有貪心的，在基督和神的國裡都是無分的。有貪心的，就與拜偶像的一樣。<br>不要被人虛浮的話欺哄，因這些事，神的忿怒必臨到那悖逆之子。<br>所以你們不要與他們同夥。</p></blockquote>"},{"day":4,"html":"<p>我們的罪為我們換來的是在今生及來世上帝的震怒和咒詛。今生中，上帝對罪的咒詛一部分體現在，那些選擇犯罪的人會逐漸地越來越邪惡。他們越犯罪，就越喜歡犯罪。他們犯罪的時候為所欲為，沒有想到自己會變成什麼樣。這些人沒有願望要認識上帝、順服上帝；他們寧可服侍罪。於是上帝給他們想要的，作為上帝給他們的咒詛。請讀羅馬書1:28-31。</p><blockquote><p><strong>羅馬書1:28-31</strong><br>他們既然故意不認識神，神就任憑他們存邪僻的心，行那些不合理的事；<br>裝滿了各樣不義、邪惡、貪婪、惡毒，滿心是嫉妒、兇殺、爭競、詭詐、毒恨，<br>又是讒毀的、背後說人的、怨恨神的、侮慢人的、狂傲的、自誇的、捏造惡事的、違背父母的、<br>無知的、背約的、無親情的、不憐憫人的。</p></blockquote><p>他們越犯罪，就越招致來世上帝的憤怒和懲罰。請讀帖撒羅尼迦後書1:8-9。</p><blockquote><p><strong>帖撒羅尼迦後書1:8-9</strong><br>要報應那不認識神和那不聽從我主耶穌福音的人。<br>他們要受刑罰，就是永遠沉淪，離開主的面和他權能的榮光。</p></blockquote>"},{"day":5,"html":"<p class=\"read-prompt\">請讀啟示錄20:11-15。</p><blockquote><p><strong>啟示錄20:11-15</strong><br>我又看見一個白色的大寶座與坐在上面的，從他面前天地都逃避，再無可見之處了。<br>我又看見死了的人，無論大小，都站在寶座前。案卷展開了，並且另有一卷展開，就是生命冊。死了的人都憑著這些案卷所記載的，照他們所行的受審判。<br>於是海交出其中的死人，死亡和陰間也交出其中的死人。他們都照各人所行的受審判。<br>死亡和陰間也被扔在火湖裡，這火湖就是第二次的死。<br>若有人名字沒記在生命冊上，他就被扔在火湖裡。</p></blockquote><p>我們所有人都在上帝的震怒和咒詛之下，因為在亞當裡我們都犯了罪。我們也都超越了亞當的罪，因為我們自身的罪為我們自己招致上帝的震怒和咒詛。每一個罪都應得上帝的震怒和咒詛。即使我們一生只犯過一次罪，我們也應得上帝的懲罰。當然我們一生中不止犯罪一次而已。我們每天都犯罪。我們也不是一天只犯罪一次，而是每天屢次犯罪。所有這些罪都有記錄，上帝會為此而審判我們。只有那些名字記在生命冊上的，能夠逃過這些罪所應得的懲罰。</p>"},{"day":6,"html":"<p>因為亞當的罪，我們開始了在上帝面前罪惡的生命。我們持續我們罪惡的生命，天天犯罪，加增我們的罪債。我們是不可救藥的違法者，理應被上帝永遠懲罰。上帝預備了脫離祂公義審判的唯一出路。那出路就是信靠祂的兒子，祂承擔了罪所應得的咒詛和懲罰。那些相信主耶穌基督的人會免於上帝的審判。那些拒絕相信祂的，仍然處於上帝的憤怒和咒詛之下，並將親自經歷這憤怒與咒詛。請讀約翰福音3:36。</p><blockquote><p><strong>約翰福音3:36</strong><br>信子的人有永生；不信子的人得不著永生，神的震怒常在他身上。</p></blockquote>"}]},{"num":85,"title":"為要逃避我們因罪而當受的震怒與咒詛，神吩咐我們當做什麼？","answer":"為要我們逃避因罪而當受的震怒與刑罰，神吩咐我們當信耶穌基督——悔改得生命——並且殷勤使用一切外在的施恩媒介，就是基督藉以傳達救贖恩福給我們的媒介。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-13","days":[{"day":1,"html":"<p>上帝滿有憐憫。祂創造我們，賜給我們所需的一切。當我們選擇犯罪背離上帝的時候，祂除了震怒與咒詛之外並不欠我們什麼。不過，因著祂大大的憐憫，祂預備了一條逃亡之路，叫我們可以迴轉到祂那裡。上帝不僅給我們一個出路，祂還為我們預備一個出路，叫我們可以得著祂會賜給全然順服祂的人所有的福分。如果我們想要得到上帝的赦免，我們必須遵照祂的要求。上帝願意赦免人，不過還不是無論怎樣都赦免。祂會赦免那得到祂赦免而遵照上帝要求的人。</p><p>上帝藉著祂的兒子預備了代替者。祂賜下祂的兒子代替我們活出完全公義的生活，並且替我們死，為我們承擔了咒詛。為要得著赦免，上帝要求我們信靠祂的兒子。除此以外沒有別的方式可以得著祂的饒恕與接納。請讀使徒行傳13:38-39。</p><blockquote><p><strong>使徒行傳13:38-39</strong><br>所以弟兄們，你們當曉得：赦罪的道是由這人傳給你們的。<br>你們靠摩西的律法，在一切不得稱義的事上信靠這人，都得稱義了。</p></blockquote>"},{"day":2,"html":"<p>上帝要求我們信靠基督。祂還要求我們悔改。悔改就是轉離我們有罪的行為、思想、態度，歸向上帝。當我們悔改的時候，我們就不再愛錯誤的東西，開始恨惡它，併為之而羞愧。上帝赦罪的應許是為那些悔改的人預備。我們不能繼續戀戀罪惡，同時還指望上帝赦免罪惡。悔改的結果是「得生命」，因為轉離罪惡就是轉離死亡，轉向上帝就是轉向生命。請讀使徒行傳20:21。</p><blockquote><p><strong>使徒行傳20:21</strong><br>又對猶太人和希臘人證明當向神悔改，信靠我主耶穌基督。</p></blockquote>"},{"day":3,"html":"<p>上帝可以照著自己的選擇用任何方式來做任何事情。祂選擇以某種方式來做事。祂可以以其他方式來做事，不過是祂選擇了用這樣的方式。創造生命就是一例證。上帝用地上的塵土造第一個人，卻用第一個人的肋骨造了第二個人。此後的每一個人都是從父母而生。上帝不是非得用那樣的方式造人，不過是祂選擇用那樣的方式來做。</p><p>上帝已經選擇用特殊的百姓得著救恩。這就是這個問答所說「外在的施恩媒介，就是基督藉以傳達救贖恩福給我們的媒介」的意思。基督已經成全了我們的救贖。祂已經成成為所需的一切，來救我們逃避上帝的震怒。一些人享受著基督的恩福，而另一些人沒有。有些人罪得赦免了，得以與上帝和好。這些恩福藉著基督所使用的外在媒介而臨到人們。那些外在的媒介包括聆聽福音、禱告、聖禮（洗禮與聖餐）。上帝要求我們殷勤使用祂選擇使用的這些外在媒介。請讀希伯來書10:19-25。</p><blockquote><p><strong>希伯來書10:19-25</strong><br>弟兄們，我們既因耶穌的血，得以坦然進入至聖所，<br>是藉著他給我們開了一條又新又活的路，從幔子經過，這幔子就是他的身體，<br>又有一位大祭司治理神的家，<br>並我們心中天良的虧欠已經灑去，身體用清水洗淨了，就當存著誠心和充足的信心來到神面前；<br>也要堅守我們所承認的指望，不至搖動，因為那應許我們的是信實的。<br>又要彼此相顧，激發愛心，勉勵行善。<br>你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉。既知道那日子臨近，就更當如此。</p></blockquote>"},{"day":4,"html":"<p>上帝要求我們聽道，尤其是福音真道。正是在祂的百姓聽到福音傳講的時候，聖靈在他們心中做工，產生對基督的信心。上帝可以選擇藉助夢境、天上的聲音或者其他任何方式帶領人信靠耶穌，不過上帝已經選擇藉著福音的傳講來做成這事。這樣做是叫祂的兒子的榮耀。當上帝的百姓聽聞福音的傳講，上帝就賜給他們信心來信靠耶穌。一旦他們成為信徒，上帝願意讓祂的百姓有規律地來聽福音的傳講。祂將藉此來叫他們在認識祂、愛祂、效法祂方面都得長進。請讀哥林多前書15:1-2。</p><blockquote><p><strong>哥林多前書15:1-2</strong><br>弟兄們，我如今把先前所傳給你們的福音，告訴你們知道。這福音你們也領受了，又靠著站立得住；<br>並且你們若不是徒然相信，能以持守我所傳給你們的，就必因這福音得救。</p></blockquote>"},{"day":5,"html":"<p>我們不是某個時間做了某個禱告就成了基督徒了！我們單單因為信耶穌而成為基督徒。上帝使用禱告來帶領他們悔改相信。一個人可能開始明白自己犯罪得罪了上帝，叫上帝憤怒。他認識到，如果想要得救，自己必須轉離罪惡，不過他不確定自己是否能夠做到。這個人可以懇求上帝賜他悔改的心，叫他能夠轉離罪惡，得到赦免。一個人可能聽到，上帝要他信靠基督。他可能擔心自己對基督沒有真信心。他可以禱告，懇求上帝賜給他所需的信心。</p><p>新約中，有一個人對使徒說他說了一句話，顯出他心裡的惡念。彼得告訴他，他的心是何等邪惡，然後告訴他悔改，尋求赦免。請讀使徒行傳8:22-23。</p><blockquote><p><strong>使徒行傳8:22-23</strong><br>你當懊悔你這罪惡，祈求主，或者你心裡的意念可得赦免。<br>我看出你正在苦膽之中，被罪惡捆綁。</p></blockquote><p>我們一旦成為基督徒，禱告就是上帝選擇叫我們在聖潔中成長的媒介之一。上帝要求我們殷勤地禱告。</p>"},{"day":6,"html":"<p>上帝還要求我們殷勤地使用聖禮：洗禮和聖餐。這些事不能救我們。它們表明上帝如何拯救罪人，上帝使用它們來給我們帶來得救的恩福。洗禮和聖餐不是上帝的百姓想參加就參加，想忽略就忽略的。上帝要求祂的百姓都受洗，都來參與聖餐。請讀使徒行傳2:38和哥林多前書11:23-26。</p><blockquote><p><strong>使徒行傳2:38</strong><br>彼得說：「你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈。」</p><p><strong>哥林多前書11:23-26</strong><br>我當日傳給你們的，原是從主領受的，就是主耶穌被賣的那一夜，拿起餅來，<br>祝謝了，就擘開，說：「這是我的身體，為你們舍的。你們應當如此行，為的是記念我。」<br>飯後，也照樣拿起杯來，說：「這杯是用我的血所立的新約。你們每逢喝的時候，要如此行，為的是記念我。」<br>你們每逢吃這餅，喝這杯，是表明主的死，直等到他來。</p></blockquote>"}]},{"num":86,"title":"什麼是「相信耶穌基督」？","answer":"「相信耶穌基督」乃是拯救的恩典，藉此我們按照福音所見證的，接受基督，並唯獨倚靠祂而得救恩。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-13","days":[{"day":1,"html":"<p>前面一個問題的回答告訴我們，上帝要求我們做什麼來逃避我們犯罪當受的憤怒與咒詛。我們知道了，上帝要求我們要信靠耶穌基督。不是我們的信才救了我們。是主耶穌基督救了我們。祂為了救我們脫離上帝的憤怒與咒詛，已經做了一切所需要做的。信就是我們伸出手去接受耶穌為我們所做的一切。</p><p>假設我快要餓死了，有人可能會主動給我食物。我會伸出手接受人家給的食物。我的手不會救我脫離餓死的命運，救我的是食物。我的手就是我用來接受別人所給的食物。信心也是這樣的。不是信心救了我們；是基督為我們所做的救了我們。信心就是我們用來伸出手接受耶穌為我們所做的一切，叫我們擁有它。請讀羅馬書3:22-24。</p><blockquote><p><strong>羅馬書3:22-24</strong><br>就是神的義，因信耶穌基督加給一切相信的人，並沒有分別。<br>因為世人都犯了罪，虧缺了神的榮耀。<br>如今卻蒙神的恩典，因基督耶穌的救贖，就白白地稱義。</p></blockquote>"},{"day":2,"html":"<p>上帝要求我們相信耶穌基督，得以逃避我們犯罪應受的咒詛。耶穌代替我們所做的一切，救了我們。信心就是我們伸出手親自接受祂所做的一切。相信耶穌基督，不是我們自己努力的事情。如果是的話，那麼我們就可以說我們得救是因為我們做的事了！相信耶穌基督是上帝的恩賜。請讀以弗所書2:8-9。</p><blockquote><p><strong>以弗所書2:8-9</strong><br>你們得救是本乎恩，也因著信。這並不是出於自己，乃是神所賜的；<br>也不是出於行為，免得有人自誇。</p></blockquote><p>上帝要求我們的信心，祂親自把那信心賜給我們，好叫我們能夠逃避祂的咒詛。</p>"},{"day":3,"html":"<p>千百年來，上帝一直應許要賜下救主。祂賜下許多清楚的預言，說這位救主將是什麼樣的。當那應許的救主來臨，祂行了許多神蹟，本應listen所有人都相信祂就是上帝所應許的那一位。不過，很多人都沒有承認祂是上帝應許的那一位。那是因為，只有那些上帝賜給信心的人才能接受基督是應許的那位救主。請讀約翰福音1:10-13。</p><blockquote><p><strong>約翰福音1:10-13</strong><br>他在世界，世界也是藉著他造的，世界卻不認識他。<br>他到自己的地方來，自己的人倒不接待他。<br>凡接待他的，就是信他名的人，他就賜他們權柄，作神的兒女。<br>這等人不是從血氣生的，不是從情慾生的，也不是從人意生的，乃是從神生的。</p></blockquote>"},{"day":4,"html":"<p>上帝所要求的信心是單單倚靠基督得救恩。我們必須單單倚靠基督來拯救我們脫離上帝的憤怒。許多人相信，如果他們相信耶穌為他們所做的，再加上他們自己努力取悅上帝，這樣上帝才會拯救他們。他們以為，如果他們相信基督，上帝所付的罪就不會那麼憤怒了，但是他們必須再做些什麼。他們以為他們必須自己也行善才能挪去上帝的憤怒。</p><p>在使徒保羅相信基督之前，他努力為行善。他想要一絲不苟地遵守上帝的律法。等到上帝賜他在基督裡的信心，他才明白，他要單單倚靠基督。他過去的竭力行善，對他來說沒什麼意義了。他知道只有基督，不加上任何東西，能救他脫離上帝對他罪惡的憤怒。請讀腓立比書3:4-9。</p><blockquote><p><strong>腓立比書3:4-9</strong><br>其實我也可以靠肉體；若是別人想他可以靠肉體，我更可以靠肉體了。<br>我第八天受割禮，我是以色列族、便雅憫支派的人，是希伯來人所生的希伯來人；就律法說，我是法利賽人；<br>就熱心說，我是逼迫教會的；就律法上的義說，我是無可指摘的。<br>只是我先前以為與我有益的，我現在因基督都當作有損的。<br>不但如此，我也將萬事當作有損的，因我以認識我主基督耶穌為至寶。我為他已經丟棄萬事，看作糞土，為要得著基督，<br>並且得以在他裡面，不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義。</p></blockquote>"},{"day":5,"html":"<p>真信心接受耶穌基督。但是真信心接受的基督必須是福音裡面所見證的基督。人們對於接受基督有好多不同的看法。有些人以為，接受基督然後再給生命加上點什麼額外的東西，能夠使生命更美好、更幸福。還有人想要接受基督，無非是要醫治他們的孤獨或悲傷。有些人以為接受耶穌就是接受一位賜給他們力量的，好叫他們勝過生命中的難題。</p><p>耶穌可能為祂的百姓做這些事。不過這不是福音裡面所見證的基督。在聖經中，福音見證的基督是救我們脫離罪惡的主。上帝賜下祂的兒子，不是為了讓我們更開心，不是讓我們遠離孤獨，或者幫助我們解決困難。上帝把耶穌賜下來，是要拯救我們脫離我們與上帝隔絕的罪。基督裡的真信心，叫我們明白，我們是有罪的，因此首先，我們需要的是一位救主。真信心接受福音裡面見證的基督：是拯救我們脫離罪惡的救主。請讀使徒行傳中使徒們向人們傳講基督是拯救人脫離罪惡的救主的例證。請讀使徒行傳2:38；3:19-20；10:42-43。</p><blockquote><p><strong>使徒行傳2:38</strong><br>彼得說：「你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈；</p><p><strong>使徒行傳3:19-20</strong><br>所以你們當悔改歸正，使你們的罪得以塗抹；這樣，那安舒的日子就必從主面前來到，<br>主也必差遣所預定給你們的基督耶穌降臨。</p><p><strong>使徒行傳10:42-43</strong><br>他吩咐我們傳道給眾人，證明他是神所立定的，要作審判活人死人的主。<br>眾先知也為他作見證，說：『凡信他的人，必因他的名得蒙赦罪。』「</p></blockquote>"},{"day":6,"html":"<p>上帝要求我們相信耶穌基督，逃避祂對於我們犯罪的憤怒和咒詛。這信心，不是我們做什麼事來賺取上帝的救恩。信心是我們伸出手接受基督為我們做的一切。相信基督是從上帝賜下來的禮物。上帝賜下的信心叫我們可能接受福音裡所見證的基督，就是救我們脫離罪惡的救主。基督裡的真信心，就是相信耶穌代替我們所做的，不加上任何其他的東西，救我們脫離上帝對罪的憤怒。那麼誰擁有上帝要求的這種對耶穌基督的信心呢？</p><p>在上帝創造人之前，甚至在上帝創造萬物之前，祂揀選了一些人作祂的百姓。上帝早已認識並愛了祂的百姓。祂為他們做了所需要的一切。祂要求對基督的信心，祂又賜給他們那信心。上帝確保所有被揀選的人都能信靠耶穌基督。請讀使徒行傳13:48。</p><blockquote><p><strong>使徒行傳13:48</strong><br>外邦人聽見這話，就歡喜，讚美神的道；凡預定得永生的人都信了。</p></blockquote>"}]},{"num":87,"title":"什麼是「悔改得生命」？","answer":"「悔改得生命」是拯救的恩典，藉此罪人真正覺悟己罪，領悟神在基督裡的憐憫，就憂傷恨惡己罪，轉離罪惡歸向神，並全心全意竭力順從神。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-13","days":[{"day":1,"html":"<p>上帝為要赦免我們的罪，要求我們相信基督以及悔改得生命。我們不能持續在罪中，彷彿無所謂的樣子，同時還指望上帝赦免它。真正的悔改是從上帝對我們犯罪的憤怒中得救的必經之路。僅僅聲稱自己信耶穌，或者當有人問誰願意「接受基督」的時候舉手，是不夠的。耶穌降世，是作為救人脫離罪惡的救主。我們必須為我們的罪痛悔，願意轉離罪惡，全心全意歸向神。否則我們就不是在相信基督作救主來救我們脫離罪惡。為罪悔改以及相信基督作救主拯救我們脫離罪惡，總是密不可分的。這種悔改被稱為「悔改得生命」。當我們悔改的時候，我們因為罪而憂傷痛悔。通常憂傷痛悔會讓我們難過一陣子，然後就無影無蹤了。悔改是能夠帶來生命的痛悔，因為它能叫我們轉離罪惡歸向基督，好叫罪得赦免。請讀哥林多後書7:9-10。</p><blockquote><p><strong>哥林多後書7:9-10</strong><br>如今我歡喜，不是因你們憂愁，是因你們從憂愁中生出懊悔來。你們依著神的意思憂愁，凡事就不至於因我們受虧損了。<br>因為依著神的意思憂愁，就生出沒有後悔的懊悔來，以致得救；但世俗的憂愁是叫人死。</p></blockquote>"},{"day":2,"html":"<p>悔改是拯救的恩典。這是上帝賜給祂百姓的。我們自己不會為罪悔改。我們的心是有罪的，而且喜歡罪。聖經說，所有人的心都如同石頭一樣。他們根本不為罪痛悔。一個人必須得著一顆新心，才能悔改。上帝曾應許，祂要賜給祂的百姓一顆新心。請讀以西結書36:26-27。</p><blockquote><p><strong>以西結書36:26-27</strong><br>我也要賜給你們一個新心，將新靈放在你們裡面。又從你們的肉體中除掉石心，賜給你們肉心。<br>我必將我的靈放在你們裡面，使你們順從我的律例，謹守遵行我的典章。</p></blockquote><p>跟信基督一樣，悔改也不是我們自己努力做成的。跟信基督一樣，悔改是上帝為得救所要求的。跟信基督一樣，悔改是上帝給他所揀選的百姓所賜的禮物。請讀使徒行傳11:18。</p><blockquote><p><strong>使徒行傳11:18</strong><br>眾人聽見這話，就不言語了，只歸榮耀與神，說：「這樣看來，神也賜恩給外邦人，叫他們悔改得生命了。」</p></blockquote>"},{"day":3,"html":"<p>這一問答告訴我們，當罪人悔改的時候，他會「憂傷恨惡己罪」。為罪憂傷，就是非常難過，我曾經犯了罪。有時候人意識到自己沒有應該的那麼好，就因為別人對他的看法而感到尷尬。這不是悔改。當我們悔改的時候，我們難過，不是因為我們的壞行為讓我丟臉，而是因為我們羞辱了神。有時候，人們意識到他們做錯了事，他們的良心叫他們難過。然後，他們因為自責而難過。當我們真悔改的時候，我們不是因為傷害了自己的良心或感覺而難過，而是因為，我們知道我們的罪已經傷害了基督。當我們悔改的時候，我們開始恨惡己罪。我們過去如此喜歡的事物，如今我們恨惡討厭。我們也看自己是可恨可厭惡的，因為我們做了上帝恨惡的事。請讀以賽亞書64:5-7。</p><blockquote><p><strong>以賽亞書64:5-7</strong><br>你迎接那歡喜行義、記念你道的人；你曾發怒，我們仍犯罪。這景況已久，我們還能得救嗎？<br>我們都像不潔淨的人，所有的義都像汙穢的衣服；我們都像葉子漸漸枯乾，我們的罪孽好像風把我們吹去。<br>並且無人求告你的名，無人奮力抓住你；原來你掩面不顧我們，使我們因罪孽消化。</p></blockquote>"},{"day":4,"html":"<p>要想悔改，一個人需要明白自己是多麼罪惡。他需要為罪憂傷，這樣才能願意轉離它。在悔改之前，人也必須看到上帝是何等有憐憫，願意饒恕人。這會促使他轉向上帝。請讀詩篇51:1-2。</p><blockquote><p><strong>詩篇51:1-2</strong><br>神啊，求你按你的慈愛憐恤我，按你豐盛的慈悲塗抹我的過犯！<br>求你將我的罪孽洗滌淨盡，並潔除我的罪！</p></blockquote><p>這一問的回答告訴我們，人必須領悟「神在基督裡的憐憫」。神只在基督裡向我們施憐憫。若有人以為，他所需要做的就是為罪難過，或者跟神說「對不起」，就可以被赦免，那他就大錯特錯了！我們的信心必須在基督裡，相信他承擔了我們罪當受的刑罰。只有這樣上帝才能赦免罪。上帝是聖潔公義的，罪未得到懲罰就決不赦免。祂賜給我們憐憫和赦免，單單是因為基督已經為我們的罪受了刑罰。</p>"},{"day":5,"html":"<p>悔改不僅僅是一種感覺。猶大因為出賣耶穌而心裡難過，甚至痛苦得自盡了；但猶大並沒有悔改，他沒有轉離罪惡歸向上帝。當一個人真正悔改的時候，他會恨惡自己的罪，不再想跟罪有瓜葛。當人悔改時，他轉向上帝，懇求上帝憐憫和赦免。真正悔改的人想要開始順服。所有這些都是轉離罪惡歸向上帝的內容。請讀以賽亞書55:6-7。</p><blockquote><p><strong>以賽亞書 55:6</strong><br>當趁耶和華可尋找的時候尋找他，相近的時候求告他。</p></blockquote><blockquote><p><strong>以賽亞書 55:7</strong><br>惡人當離棄自己的道路，不義的人當除掉自己的意念。歸向耶和華，耶和華就必憐恤他；當歸向我們的 神，因為 神必廣行赦免。</p></blockquote>"},{"day":6,"html":"<p>這一問的回答，最後的部分告訴我們，真正的悔改包括「全心全意竭力順從神」。如果我們說我們後悔了，卻又計劃回到罪惡中，那就不是悔改了。被上帝賦予新心的人不會再樂意犯罪。現在他想要順服神。他不能十全十美地順服，因為他仍然是一個罪人。不過他將有上帝的聖靈住在他裡面，叫他樂於順服，叫他能夠順服。因此我們稱之為「新的順服」。人非有上帝的靈住在他裡面，就不能得神的喜悅。真正悔改、在信心中轉向基督的人都將樂於順服神，會在聖靈的幫助下盡心竭力。請讀約翰一書2:3-6。</p><blockquote><p><strong>約翰一書 2:3</strong><br>我們若遵守他的誡命，就曉得是認識他。</p></blockquote><blockquote><p><strong>約翰一書 2:4</strong><br>人若說「我認識他」，卻不遵守他的誡命，便是說謊話的，真理也不在他心裡了。</p></blockquote><blockquote><p><strong>約翰一書 2:5</strong><br>凡遵守主道的，愛 神的心在他裡面實在是完全的，從此我們知道我們是在主裡面。</p></blockquote><blockquote><p><strong>約翰一書 2:6</strong><br>人若說他住在主裡面，就該自己照主所行的去行。</p></blockquote>"}]},{"num":88,"title":"基督將救贖恩福傳達給我們，所使用的外在媒介是哪些？","answer":"基督將救贖恩福傳達給我們，所使用的外在與一般媒介是：祂的定規，特別是聖經、聖禮和禱告，這些都有效地實施在選民身上，使他們得救。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-14","days":[{"day":1,"html":"<p>假設有位父親，他出門在外。他一直就想給兒子買匹馬。父親在外期間，遇見了想給兒子的好馬。於是他就給兒子買了那匹馬。父親付了全部的價錢。這匹馬成為那個男孩的馬了，已經不需要再做什麼了。不過，因為男孩在家裡呢，是在不同的省份，所以，他還無法享受到有一匹馬的好處。於是父親僱了一輛拖車把馬給兒子運回去。現在，孩子終於可以享受到擁有父親給他買的那匹馬所有的好處。</p><p>當耶穌死在十字架上的時候，祂已付了完全的代價，救贖祂的百姓。要救贖他們，不需要再做什麼了。但是得救的好處卻需要實施在上帝的選民身上。主耶穌已經選擇恩福實施在我們身上的媒介。這個問題的答案已經列出了那些媒介。上帝的話語、聖禮（洗禮和聖餐）、禱告就是基督選擇將救贖恩福實施在我們身上的一般的外在的媒介。當我們讀經或聽道，當我們禱告，當我們領受洗禮或聖餐時，我們就得享基督為我們買的救贖恩福。</p><p>使徒保羅曾寫信給提摩太，在禱告、敬拜、講道和教導方面給他一些指導。他告訴提摩太，使用這些媒介將為提摩太以及他所服侍的人帶來救恩。請讀提摩太前書4:15-16。</p><blockquote><p><strong>提摩太前書 4:15</strong><br>這些事你要殷勤去做，並要在此專心，使眾人看出你的長進來。</p></blockquote><blockquote><p><strong>提摩太前書 4:16</strong><br>你要謹慎自己和自己的教訓，要在這些事上恆心。因為這樣行，又能救自己，又能救聽你的人。</p></blockquote>"},{"day":2,"html":"<p>救恩不僅僅是知道自己本該下地獄，而現在因為信了耶穌就能上天堂。救恩包括了罪得赦免，與神和好，作神的兒女——這些都是一個人成為基督徒以後發生的事。救恩也包括現在正在發生以及將來要發生的事。我們的救恩包括更少犯罪和更像耶穌。使用上帝所提供的媒介，就能幫助那些已經相信基督的人們在認識上帝以及成為聖潔方面都長進。上帝會使用這些媒介給那些暫未相信的百姓帶來基督裡的信心。請讀猶大書20-21。</p><blockquote><p><strong>猶大書 20</strong><br>親愛的弟兄啊，你們卻要在至聖的真道上造就自己，在聖靈裡禱告，</p></blockquote><blockquote><p><strong>猶大書 21</strong><br>保守自己常在 神的愛中，仰望我們主耶穌基督的憐憫，直到永生。</p></blockquote>"},{"day":3,"html":"<p>主耶穌已經選擇了使用某些媒介來將救贖恩福實施在我們身上。因為祂是主，祂有權選擇使用何種媒介。在祂的話語中，祂清楚告訴我們祂已經選擇了使用什麼媒介。祂也命令我們使用這些媒介。除非人們使用耶穌吩咐他們使用的媒介，否則我們無法指望人們會信靠耶穌並在效法基督方面有什麼長進。請讀馬太福音28:18-20。</p><blockquote><p><strong>馬太福音 28:18</strong><br>耶穌進前來，對他們說：「天上地下所有的權柄都賜給我了。</p></blockquote><blockquote><p><strong>馬太福音 28:19</strong><br>所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗。</p></blockquote><blockquote><p><strong>馬太福音 28:20</strong><br>凡我所吩咐你們的，都教訓他們遵守，我就常與你們同在，直到世界的末了。「</p></blockquote><p>有時候，耶穌選擇使用本問答列出的媒介之外的方式來完成祂在某人身上的計劃。比如，耶穌曾經命令我們要傳福音。這是使用來帶領人信祂的方式。但是使徒保羅歸信基督的時候，卻是因為他見了大光，並且聽見天上的聲音。不過，耶穌通常都是使用聖經——祂的話語——來帶領人信主。</p>"},{"day":4,"html":"<p>這一問的答案列出了「基督將救贖恩福實施在我們身上的一般的外在媒介」。第一樣列出來的是「聖經」。上帝在聖經裡賜給我祂的話。聖經不像任何其他的書。因為聖經是上帝的話，所以聖經是活的。它有能力。它改變人。上帝使用祂的話叫非信徒信基督。當非信徒讀聖經或者聽到忠心的傳道人講聖經的時候，聖靈叫他們明白他們所讀到或聽到的真理。祂改變他們的心，叫他們能夠信基督。</p><p>聖經也在基督徒心中帶來改變。我們不能知道上帝的話語有何等豐富。不論我們對聖經多麼熟悉，不論我們學得多好，我們總是應該更多地學習。我們應該來到神的話語面前，樂意讓它改變我們。當我們這樣做的時候，上帝就使用它來叫我們不被罪所控制，反而更像耶穌。請讀雅各書1:21-25。</p><blockquote><p><strong>雅各書 1:21</strong><br>所以，你們要脫去一切的汙穢和盈餘的邪惡，存溫柔的心領受那所栽種的道，就是能救你們靈魂的道。</p></blockquote><blockquote><p><strong>雅各書 1:22</strong><br>只是你們要行道，不要單單聽道，自己欺哄自己。</p></blockquote><blockquote><p><strong>雅各書 1:23</strong><br>因為聽道而不行道的，就像人對著鏡子看自己本來的面目，</p></blockquote><blockquote><p><strong>雅各書 1:24</strong><br>看見，走後，隨即忘了他的相貌如何。</p></blockquote><blockquote><p><strong>雅各書 1:25</strong><br>惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。</p></blockquote>"},{"day":5,"html":"<p>聖禮就是基督曾吩咐祂的百姓要做的，並且應許在他們遵行的時候祝福他們。基督賜給祂的百姓兩樣聖禮：洗禮和聖餐。我們看得見的聖禮會提醒我們看不見的屬靈事物。聖禮也是記念已經發生的事。同時，聖禮也是在記念，上帝為祂的百姓正在繼續做的事。請讀哥林多前書11:23-25。</p><blockquote><p><strong>哥林多前書 11:23</strong><br>我當日傳給你們的，原是從主領受的，就是主耶穌被賣的那一夜，拿起餅來，</p></blockquote><blockquote><p><strong>哥林多前書 11:24</strong><br>祝謝了，就掰開，說：「這是我的身體，為你們舍的。你們應當如此行，為的是記念我。」</p></blockquote><blockquote><p><strong>哥林多前書 11:25</strong><br>飯後，也照樣拿起杯來，說：「這杯是用我的血所立的新約。你們每逢喝的時候，要如此行，為的是記念我。」</p></blockquote>"},{"day":6,"html":"<p>主耶穌也吩咐我們禱告。祂在我們得救的過程中使用禱告。上帝使用祂百姓的禱告來帶領別人信基督。當一個人開始認識到自己是個罪人、需要救主的時候，上帝往往給他禱告尋求主的願望。用這些方式，上帝使用禱告來帶領非基督徒來信基督。我們成為基督徒之後，我們要成長的地方那麼多！我們仍然是罪人，一點兒也不像耶穌。祂吩咐我們禱告，叫祂來改變我們。祂吩咐我們禱告，叫我們在聖潔上長進。上帝使用我們禱告的時間，來塑造我們成為祂拯救我們要成為的樣式。請讀提摩太前書2:1-4。</p><blockquote><p><strong>提摩太前書 2:1</strong><br>我勸你第一要為萬人懇求、禱告、代求、祝謝，</p></blockquote><blockquote><p><strong>提摩太前書 2:2</strong><br>為君王和一切在位的，也該如此，使我們可以敬虔、端正、平安無事地度日。</p></blockquote><blockquote><p><strong>提摩太前書 2:3</strong><br>這是好的，在 神我們救主面前可蒙悅納。</p></blockquote><blockquote><p><strong>提摩太前書 2:4</strong><br>他願意萬人得救，明白真道。</p></blockquote>"}]},{"num":89,"title":"聖道怎樣產生效果，使人得救？","answer":"神的靈藉著閱讀聖經，特別是傳講聖道，作為有效的媒介，使罪人認罪迴轉；並在聖潔與安慰中被建造，使他們藉著相信以致得救。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-14","days":[{"day":1,"html":"<p>耶穌應許祂的門徒，祂將賜下聖靈。聖靈會讓人們相信：他們是罪人，需要一位救主。上帝的靈是改變人的那一位，叫他們不再愛罪，能夠信耶穌得赦免。聖靈有一個工具可以用來達成此目的。祂的工具就是聖經——上帝的話。上帝的靈使用上帝的話來使非基督徒信基督。請讀提摩太後書3:14-15。</p><blockquote><p><strong>提摩太後書 3:14</strong><br>但你所學習的、所確信的，要存在心裡，因為你知道是跟誰學的。</p></blockquote><blockquote><p><strong>提摩太後書 3:15</strong><br>並且知道你是從小明白聖經；這聖經能使你因信基督耶穌有得救的智慧。</p></blockquote><p>上帝的靈也使用上帝的道來使基督徒在聖潔上長進。從未聽過、讀過上帝話語的非基督徒不大可能成為基督徒。從不聽道或讀經的基督徒也不大可能在聖潔上長進。</p>"},{"day":2,"html":"<p>人們不是一直都有母語的聖經可以自己閱讀。今日全世界仍有許多人沒有他們自己語言的聖經。我們應該感謝上帝，因為祂賜給我們自己語言的聖經。不僅如此，更是因為祂賜給我們祂的話語我們該感謝上帝。聖經是件珍寶，我們應該殷勤使用。</p><p>上帝不僅賜下祂的話給我們可以讀，祂還賜給我們牧師和教師可以給我們解釋聖經。上帝已經選擇講道作為用來使非信徒信基督的主要媒介。請讀哥林多前書1:21。</p><blockquote><p><strong>哥林多前書 1:21</strong><br>世人憑自己的智慧，既不認識 神， 神就樂意用人所當作愚拙的道理拯救那些信的人，這就是 神的智慧了。</p></blockquote><p>祂也使用講道這個媒介來叫祂的百姓覺悟自己心裡的罪。祂使用忠心的牧師講道來呼籲祂的百姓更加聖潔。當然，許多人是在忠心講上帝的道，可是實際上卻是在說聖經上根本沒有的東西。上帝使我們每個人都自己熟悉聖經，這樣才能分辨講道人說的對不對。請讀使徒行傳17:11。</p><blockquote><p><strong>使徒行傳 17:11</strong><br>這地方的人賢於帖撒羅尼迦的人，甘心領受這道，天天考查聖經，要曉得這道是與不是。</p></blockquote>"},{"day":3,"html":"<p>聖靈使用聖道來勸服人們相信自己是需要救主的罪人。當人們在聖經中讀到上帝，他們看到了上帝的偉大和聖潔。當我們讀到上帝賜給我們的律法，就看到我們是多麼無可救藥，根本無法照著祂的要求完全遵守祂的律法。上帝的道向非基督徒顯明，他們是罪人，因為他們的罪令上帝憤怒。如果任憑他們，他們還自以為是好人。當他們跟別人比較的時候，他們也可能會以為自己比別人強。當上帝叫非基督徒與上帝的道比較的時候，他們就看到自己是可憐的罪人，非有一位救主不可。</p><p>人們信基督得救之後，他們還是罪人，每天必須對罪說不。他們必須在生活中學習順服主耶穌。同樣，聖靈使用上帝的話，向祂的百姓顯明他們心裡殘存的罪，叫他們可以轉離罪惡。請讀希伯來書4:12。</p><blockquote><p><strong>希伯來書 4:12</strong><br>神的道是活潑的、是有功效的，比一切兩刃的劍更快，甚至魂與靈、骨節與骨髓，都能刺入、剖開，連心中的思念和主意都能辨明。</p></blockquote>"},{"day":4,"html":"<p>聖靈使人覺悟自己的罪。也在於使人歸信。「歸信」意味著轉變。當聖靈轉變一個人，祂把那個人從非信徒轉變為信徒。祂把上帝的敵人轉變為上帝的兒女。祂也使用聖經——上帝的道——來轉變人。正是在上帝的道中，我們認識了上帝所預備的救主耶穌。聖經就是上帝的兒子，祂來替我們死。聖經告訴我們，耶穌已經做了所需的一切來拯救我們，而我們所需要做的就是相信祂。這就是福音。正是在人們聽到福音傳講的時候，聖靈轉變他們，改變他們的心，叫他們可以信。請讀使徒行傳4:1-4。</p><blockquote><p><strong>使徒行傳 4:1</strong><br>使徒對百姓說話的時候，祭司們和守殿官並撒都該人忽然來了。</p></blockquote><blockquote><p><strong>使徒行傳 4:2</strong><br>因他們教訓百姓，本著耶穌，傳說死人復活，就很煩惱。</p></blockquote><blockquote><p><strong>使徒行傳 4:3</strong><br>於是下手拿住他們；因為天已經晚了，就把他們押到第二天。</p></blockquote><blockquote><p><strong>使徒行傳 4:4</strong><br>但聽見道之人有許多信的，男丁數目約到五千。</p></blockquote>"},{"day":5,"html":"<p>上帝的靈使用上帝的道來勸服轉變罪人。人們歸信耶穌之後，還要有更多的事發生。基督徒必須越來越像耶穌，直到他們最終在天上與祂同在時才得以完全。也正是聖靈使這一切得以發生。祂在上帝百姓的生命中做工，照著主的願望來塑造他們。同樣聖靈使用祂的道來達成此目的。祂使用上帝的道來建造信徒。祂叫他們越來越認識上帝，更加全心全意地為上帝而活。請讀使徒行傳20:32。</p><blockquote><p><strong>使徒行傳 20:32</strong><br>如今我把你們交託 神和他恩惠的道；這道能建立你們，叫你們和一切成聖的人同得基業。</p></blockquote>"},{"day":6,"html":"<p>聖經明說，上帝的旨意一直是叫人成為祂自己的百姓。這些百姓一定要成為聖潔，因為上帝是聖潔的。當上帝拯救我們，不是為了上天堂或者為了更幸福。上帝拯救我們，是叫我們成為聖潔。上帝使用祂的道使我們成為聖潔。當我們花時間學習聖道，它就改變我們的心意。我們的思想就漸漸像上帝的思想，而不是邪惡的思想了。我們如何思想，將會改變我們如何談吐以及如何行事。這樣，當我們漸漸多瞭解聖道，我們就在聖潔上長進了。請讀提摩太後書3:16-17。</p><blockquote><p><strong>提摩太後書 3:16</strong><br>聖經都是 神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，</p></blockquote><blockquote><p><strong>提摩太後書 3:17</strong><br>叫屬 神的人得以完全，預備行各樣的善事。</p></blockquote>"}]},{"num":90,"title":"聖道該如何閱讀與聆聽，才會產生果效，使人得救？","answer":"為了使聖道產生得救的果效，我們必須以殷勤、預備、禱告的心來學習；以信心和愛心來領受，存記在我們心中，實行在日常生活裡。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-14","days":[{"day":1,"html":"<p>上帝的聖道不像世界上任何其他的書。因為它是上帝的道，它有能力在人內心帶來巨大變化。它可以把恨惡上帝的人轉變為愛上帝、為上帝而活的人。它可以把自私邪惡的人轉變為仁愛聖潔的人。上帝的聖道有得救的果效。上帝使用祂的道，帶領人信基督，並使人更像耶穌。</p><p>這不是說，聖經是神秘的。上帝的聖道不是什麼魔咒，誰唸了就發生奇怪的事。我們必須以某種方式來閱讀或聆聽聖道，才能產生救恩的果效。有時候，對於一些在基督徒家庭中長大的人，他們往往對聖道有一種無所不知的態度。他們以為自己聽過聖經所有的內容，不想再聽。這樣的人沒有認識到他們所處的危險。因為他們常常聆聽並閱讀聖經，他們誤以為自己就是上帝所喜悅的基督徒。</p><p>耶穌講過一個比喻，說的是聆聽及閱讀上帝聖道的不同種類的人。祂說，撒種的農夫就好像傳講上帝聖道的講員。有些種子落在路旁，沒有進到土裡，飛鳥來就把它吃掉了。這就像那些聽了道隨後就忘了的人。有些種子落在石頭地裡，開始生長，可是卻沒有根，很快就死了。這就像那種起初相信，不過發現順服上帝變得不容易的時候，他們就放棄了。還有的種子落在荊棘叢中，開始生長，可是荊棘將它擠死了。這種秧苗代表那些起初順服上帝的聖道，可是後來卻被世上的事物所迷惑了。最後一種，就是落在好土地裡，結實累累。請讀路加福音8:15，看看這樣的人是怎麼做的。</p><blockquote><p><strong>路加福音 8:15</strong><br>那落在好土裡的，就是人聽了道，持守在誠實善良的心裡，並且忍耐著結實。</p></blockquote>"},{"day":2,"html":"<p>如果想要藉著上帝的聖道得救，人要做的第一件事就是要以信心接受聖道。當人聆聽或閱讀上帝的聖道，他需要相信這實在是上帝的話，而不僅僅是另一個人的意見。上帝的聖道會告訴他，他是一個叫上帝憤怒的罪人。他也許不喜歡聽這些，但是他必須以信心接受上帝對於他所說的罪人。上帝的聖道會告訴他，沒有別的方法可以挪去他的罪以及上帝的憤怒。上帝的聖道也會告訴他，上帝已經賜下救主就是耶穌基督，親身擔當祂百姓的罪孽，並且為他們受刑罰。上帝的聖道會勸勉他閱讀、聆聽聖道，得以單單相信基督。聖道會向他顯明，只有耶穌能救他脫離罪惡以及上帝對罪惡的憤怒。如果一個人拒絕相信這是上帝對於與神和好的方式的說法，那麼他就不能得救。他必須原原本本地承認上帝的聖道，認可它，照著它說的去做。請讀帖撒羅尼迦前書2:13。</p><blockquote><p><strong>帖撒羅尼迦前書 2:13</strong><br>為此，我們也不住地感謝 神，因你們聽見我們所傳 神的道，就領受了；不以為是人的道，乃以為是 神的道。這道實在是 神的，並且執行在你們信主的人心中。</p></blockquote>"},{"day":3,"html":"<p>這一問的答案告訴我們，我們必須對於聖道持謹慎認真的態度。這意味著我們需要留出時間、勤奮地熟悉聖道。當孩子們（或年輕人及成年人）說：「我已經知道了」，表現出對聖經的厭煩，那麼他們就表明，他們其實不怎麼明白上帝的聖道。書籍表明作者的心聲。聖經向我們表明無限的上帝的心聲。我們既無法完全瞭解上帝，那麼他們就永遠無法透徹地知道並瞭解聖經所說的。</p><p>有些人日復一日、年復一年地整天研究聖經。在某些情況中，知道聖經的教導，這是他們的工作，這樣他們就花費幾乎全部的時間來研究聖經。甚至在他們生命的盡頭，他們可能還會說，在上帝的聖道中，還有這麼多東西是他們沒學會、沒發現的。如果我們想要上帝的聖道在我們的生命中產生果效，那麼我們必須殷勤地學習它。我們絕對不可以為我們已經知道了所需要知道的全部。我們必須一生中每一天努力學習它。請讀箴言2:1-5。</p><blockquote><p><strong>箴言 2:1</strong><br>我兒，你若領受我的言語，存記我的命令，</p></blockquote><blockquote><p><strong>箴言 2:2</strong><br>側耳聽智慧，專心求聰明，</p></blockquote><blockquote><p><strong>箴言 2:3</strong><br>呼求明哲，揚聲求聰明，</p></blockquote><blockquote><p><strong>箴言 2:4</strong><br>尋找它，如尋找銀子；搜求它，如搜求隱藏的珍寶，</p></blockquote><blockquote><p><strong>箴言 2:5</strong><br>你就明白敬畏耶和華，得以認識 神。</p></blockquote>"},{"day":4,"html":"<p>如果我們想要上帝的聖道在我們的生命中產生果效，我們必須預備自己來閱讀或聆聽。我們可以做幾件事來預備自己。在我們開始敬拜之前，或者我們讀經之前我們應該禱告，懇求上帝來幫助我們明白祂的話。沒有聖靈顯明上帝在聖道中的意思，我們就不會在靈裡領悟聖經。所以我們應該藉著禱告求悟性來預備自己。當我們準備好去敬拜，或者聆聽上帝的聖道被傳講，我們也應該花點時間懇求上帝來藉著聖道與我們講話。當我們聽道的時候，我們應該在聽道時，注意有什麼事情是上帝要我們改變的。請讀雅各書1:21。</p><blockquote><p><strong>雅各書 1:21</strong><br>所以，你們要脫去一切的汙穢和盈餘的邪惡，存溫柔的心領受那所栽種的道，就是能救你們靈魂的道。</p></blockquote>"},{"day":5,"html":"<p>上帝的敵人對於聖道沒有興趣。當上帝賜給人新心，那個人就對於上帝的聖道產生一種前所未有的喜愛。如果一個人在學習聖經的時候顯得很厭煩，那麼可能是他還沒有重生，還沒有得到上帝所賜的對於聖道的喜愛。上帝的兒女會喜愛上帝的聖道。他們會視之如珍寶。如果叫他們在他們的財富與夢想——甚至是重要的事物——和一本聖經之間做選擇，他們會選擇聖經。請讀下面的經文，看看約伯和大衛如何看待上帝的話：約伯記23:12；詩篇119:72,131。</p><blockquote><p><strong>約伯記 23:12</strong><br>他嘴唇的命令我未曾背棄；我看重他口中的言語，過於我需用的飲食。</p></blockquote><blockquote><p><strong>詩篇 119:72</strong><br>你口中的訓言與我有益，勝於千萬的金銀。</p></blockquote><blockquote><p><strong>詩篇 119:131</strong><br>我張口而氣喘，因我切慕你的命令。</p></blockquote>"},{"day":6,"html":"<p>想要上帝的聖道產生救恩的果效並且在我們心裡做成上帝的工，那麼我們必須以某些的方式來閱讀和聆聽聖道。我們應該謹慎認真。我們應該透過認罪、離棄我們的罪，以及禱告告訴聖靈賜下悟性，以此預備自己。當我們閱讀或聆聽上帝的聖道，我們必須以信心接受它，承認它就是上帝的話。上帝要我們愛慕祂的話語，在心裡珍視它。最後一點，如果想要上帝的聖道改變我們，我們不可以單單知道聖經怎麼說。我們必須要照著聖經說的去做。我們必須在生活中實行聖經的教訓。請讀雅各書1:22-25。</p><blockquote><p><strong>雅各書 1:22</strong><br>只是你們要行道，不要單單聽道，自己欺哄自己。</p></blockquote><blockquote><p><strong>雅各書 1:23</strong><br>因為聽道而不行道的，就像人對著鏡子看自己本來的面目，</p></blockquote><blockquote><p><strong>雅各書 1:24</strong><br>看見，走後，隨即忘了他的相貌如何。</p></blockquote><blockquote><p><strong>雅各書 1:25</strong><br>惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。</p></blockquote>"}]},{"num":91,"title":"聖禮怎樣成為有效的救恩媒介？","answer":"聖禮成為有效的救恩媒介，不是因為聖禮本身有功效，也不是施行者的能力，而是唯獨藉基督所賜的恩福，和祂的靈執行，在那些以「相信」領受聖禮的人心中。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-15","days":[{"day":1,"html":"<p>聖禮有兩個：洗禮與聖餐。這個問答解釋了上帝在拯救我們時，如何使用聖禮。不是因為聖禮本身有什麼「特殊的能力」。受洗不同於搖動魔杖。吃聖餐也不會產生什麼神奇的現象。洗禮和聖餐都必須憑信心來領受。新約中記載，有一個人，看到別人都受洗了，他也受了洗。不過我們在這個故事中看到，他只關心自己會得到什麼。他沒有基督裡的真信心。儘管他已經受了洗，不過如果他不悔改，就將滅亡。請讀使徒行傳8:9-13,18-23中的這個故事。</p><blockquote><p><strong>使徒行傳 8:9</strong><br>有一個人，名叫西門，向來在那城裡行邪術，妄自尊大，使撒馬利亞的百姓驚奇；</p></blockquote><blockquote><p><strong>使徒行傳 8:10</strong><br>無論大小都聽從他，說：「這人就是那稱為 神的大能者。」</p></blockquote><blockquote><p><strong>使徒行傳 8:11</strong><br>他們聽從他，因他久用邪術，使他們驚奇。</p></blockquote><blockquote><p><strong>使徒行傳 8:12</strong><br>及至他們信了腓利所傳 神國的福音和耶穌基督的名，連男帶女就受了洗。</p></blockquote><blockquote><p><strong>使徒行傳 8:13</strong><br>西門自己也信了，既受了洗，就常與腓利在一處，看見他所行的神蹟和大異能，就甚驚奇。</p></blockquote><blockquote><p><strong>使徒行傳 8:18</strong><br>西門看見使徒按手，便有聖靈賜下，就拿錢給使徒，</p></blockquote><blockquote><p><strong>使徒行傳 8:19</strong><br>說：「把這權柄也給我，叫我手按著誰，誰就可以受聖靈。」</p></blockquote><blockquote><p><strong>使徒行傳 8:20</strong><br>彼得說：「你的銀子和你一同滅亡吧！因你想 神的恩賜是可以用錢買的。</p></blockquote><blockquote><p><strong>使徒行傳 8:21</strong><br>你在這道上無分無關，因為在 神面前，你的心不正。</p></blockquote><blockquote><p><strong>使徒行傳 8:22</strong><br>你當懊悔你這罪惡，祈求主，或者你心裡的意念可得赦免。</p></blockquote><blockquote><p><strong>使徒行傳 8:23</strong><br>我看出你正在苦膽之中，被罪惡捆綁。「</p></blockquote>"},{"day":2,"html":"<p>上帝使用聖禮作為救恩的有效途徑。但是這不是因為「施行聖禮的人有什麼特別的能力」。有些人以為，在施洗和掰餅分杯的牧師身上有什麼特殊能力。這是不對的。當主的百姓順服祂的時候，主自己就祝福百姓。任何的牧師長老並沒有特殊的能力能夠拯救人。請讀哥林多前書3:6-7。</p><blockquote><p><strong>哥林多前書 3:6</strong><br>我栽種了，亞波羅澆灌了，惟有 神叫他生長。</p></blockquote><blockquote><p><strong>哥林多前書 3:7</strong><br>可見栽種的算不得什麼，澆灌的也算不得什麼，只在那叫他生長的 神。</p></blockquote>"},{"day":3,"html":"<p>如果洗禮和聖餐本身沒有什麼神奇的東西，如果施行聖禮的人也沒有特殊的能力，那麼是什麼叫聖禮產生救恩的果效呢？是因為「基督所賜的恩福」。是耶穌親自給我們設立洗禮。在與門徒的最後晚餐中，主給門徒設立聖餐。當主的百姓使用祂給他們所設的聖禮，祂就祝福他們。是基督的恩福叫聖禮產生救恩的果效。請讀使徒行傳2:38-39和哥林多前書10:16。</p><blockquote><p><strong>使徒行傳 2:38</strong><br>彼得說：「你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈；</p></blockquote><blockquote><p><strong>使徒行傳 2:39</strong><br>因為這應許是給你們和你們的兒女，並一切在遠方的人，就是主我們 神所召來的。「</p></blockquote><blockquote><p><strong>哥林多前書 10:16</strong><br>我們所祝福的杯，豈不是同領基督的血嗎？我們所擘開的餅，豈不是同領基督的身體嗎？</p></blockquote>"},{"day":4,"html":"<p>因為主耶穌設立了聖禮，所以我們在恭行聖禮的時候，主就祝福這聖禮。聖禮也在那些憑信心領受聖禮的人心裡做工了。水的洗禮表明聖靈給人施行洗禮，使人歸入基督的身體，使他們永遠成為基督身體的一部分。當信徒們在聖禮中分享餅和杯，他們是在共同享受在基督與祂的聖靈。請讀哥林多前書12:13。</p><blockquote><p><strong>哥林多前書 12:13</strong><br>我們不拘是猶太人，是希臘人，是為奴的，是自主的，都從一位聖靈受洗，成了一個身體，飲於一位聖靈。</p></blockquote>"},{"day":5,"html":"<p>洗禮和聖餐不是為每個人預備的。上帝唯獨把聖禮賜給祂的百姓。聖禮唯獨對於那些「憑信心領受的人」才產生救恩的果效。許多人領過聖餐。如果他們不明白聖餐的意義，而且從未信靠耶穌，那麼聖餐對他們毫無益處。很多人受過洗。如果他們從未相信福音，儘管他們受過洗，他們仍然會死在罪中。請讀馬可福音16:15-16。</p><blockquote><p><strong>馬可福音 16:15</strong><br>他又對他們說：「你們往普天下去，傳福音給萬民聽。</p></blockquote><blockquote><p><strong>馬可福音 16:16</strong><br>信而受洗的，必然得救；不信的，必被定罪。</p></blockquote>"},{"day":6,"html":"<p>童話故事裡面常常會講一些神奇的儀式，比如撫摸裡面有精靈的燈。在童話中，無論什麼時候施行儀式，就算是有人不小心弄的，也同樣會出現奇蹟。聖禮不同於神秘的儀式。上帝的目的，不是叫聖禮獨立被使用。他們要伴隨著上帝的聖道來使用。主耶穌基督吩咐祂的百姓受洗和領聖餐。祂應許賜下祝福伴隨聖禮。請讀兩處經文，看看經文中都應許了什麼。馬太福音26:26-28和使徒行傳2:38。</p><blockquote><p><strong>馬太福音 26:26</strong><br>他們吃的時候，耶穌拿起餅來，祝福，就掰開遞給門徒，說：「你們拿著吃，這是我的身體。」</p></blockquote><blockquote><p><strong>馬太福音 26:27</strong><br>又拿起杯來，祝謝了，遞給他們，說：「你們都喝這個，</p></blockquote><blockquote><p><strong>馬太福音 26:28</strong><br>因為這是我立約的血，為多人流出來，使罪得赦。</p></blockquote><blockquote><p><strong>使徒行傳 2:38</strong><br>彼得說：「你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈；</p></blockquote>"}]},{"num":92,"title":"聖禮是什麼？","answer":"聖禮是基督所設立的神聖禮儀，在其中可以感受到具體的記號，將基督和新約的恩福，表明、印證、實施在信徒身上。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-15","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀創世記17:1-2,9。</p><blockquote><p><strong>創世記 17:1</strong><br>亞伯蘭年九十九歲的時候，耶和華向他顯現，對他說：「我是全能的 神，你當在我面前作完全人。</p></blockquote><blockquote><p><strong>創世記 17:2</strong><br>我就與你立約，使你的後裔極其繁多。「</p></blockquote><blockquote><p><strong>創世記 17:9</strong><br>神又對亞伯拉罕說：「你和你的後裔必世世代代遵守我的約。</p></blockquote><p>「聖禮」一詞來源於很久以前羅馬士兵使用的一個詞。意思是非常嚴肅的承諾，保證永遠忠於將軍，遵行將軍的命令。這個詞也用來表示將軍所作的承諾，保證忠於他權下計程車兵。主耶穌基督與祂的百姓立約。祂向他們承諾，祂必賜給百姓許多恩福。祂的百姓也與祂立了約。他們承諾會一生信靠祂、順服祂、忠於祂。聖禮提醒我們，基督給我們的應許，以及我們與祂所立的約。</p>"},{"day":2,"html":"<p>聖禮就是基督所設立的神聖禮儀。禮儀，是有權柄的人所設立的法則或者規矩。主耶穌基督是教會的君王。祂制定了教會必須遵守的規矩。只有君王耶穌才能夠制定這樣的規矩。耶穌為教會制定了兩個規矩。祂將聖禮交給門徒，吩咐他們已經要遵守。其中有一個禮儀是在祂臨死之前最後一餐的時候設立。祂當時正在和門徒一起吃飯。當祂把餅擘開，並且把杯傳遞給門徒們，祂吩咐他們一直要用吃餅喝杯的方式來記念祂。上帝的百姓把守聖餐作為聖禮之一，是因為耶穌吩咐我們這樣做。請讀哥林多前書11:23-25。</p><blockquote><p><strong>哥林多前書 11:23</strong><br>我當日傳給你們的，原是從主領受的，就是主耶穌被賣的那一夜，拿起餅來，</p></blockquote><blockquote><p><strong>哥林多前書 11:24</strong><br>祝謝了，就掰開，說：「這是我的身體，為你們舍的。你們應當如此行，為的是記念我。」</p></blockquote><blockquote><p><strong>哥林多前書 11:25</strong><br>飯後，也照樣拿起杯來，說：「這杯是用我的血所立的新約。你們每逢喝的時候，要如此行，為的是記念我。」</p></blockquote><p>耶穌在昇天之前設立了另一個規矩。祂吩咐門徒們要去使萬民作主的門徒，為那些跟隨祂的人受洗。因此洗禮是另一聖禮。這是主耶穌所命令的聖禮。請讀馬太福音28:18-19。</p><blockquote><p><strong>馬太福音 28:18</strong><br>耶穌進前來，對他們說：「天上地下所有的權柄都賜給我了。</p></blockquote><blockquote><p><strong>馬太福音 28:19</strong><br>所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗。</p></blockquote>"},{"day":3,"html":"<p>每個聖禮都有兩個部分。一個是有形的部分，就是我們可看、可摸或可嘗的部分。還有一個就是有形部分所代表的真實、屬靈的內容。聖禮的這部分是不可見的。當一個人受洗時，他看到、摸到的是水。那些觀禮的人也可以看到水。他們看到受洗的人被水弄溼。但是洗禮所代表的內容卻是不可見的。它代表著與基督聯合。耶穌為罪而死，就算作是受洗的人因信而自己已死。正如耶穌從死裡復活，受洗的信徒也藉著與基督聯合而得了新生命，有能力為上帝而活。請讀羅馬書6:4。</p><blockquote><p><strong>羅馬書 6:4</strong><br>所以我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。</p></blockquote><p>當信徒領受聖餐時，他們吃的是普通的餅，喝的是普通的葡萄汁。這些東西無非是人們日常生活中用來維持生命的。信徒在聖餐中領受餅和杯，看到、摸到、嚐到真實的餅和葡萄汁。這些事物代表著看不見、摸不著、嘗不到的事物。吃聖餐的人倚靠基督擘開的身體、傾倒出來的血來賜予永生。請讀約翰福音6:54。</p><blockquote><p><strong>約翰福音 6:54</strong><br>吃我肉喝我血的人就有永生，在末日我要叫他復活。</p></blockquote>"},{"day":4,"html":"<p class=\"read-prompt\">請讀哥林多前書11:26。</p><blockquote><p><strong>哥林多前書 11:26</strong><br>你們每逢吃這餅，喝這杯，是表明主的死，直等到他來。</p></blockquote><p>人們記念那些過世的愛人。有時候，人們前往過世親朋的墓地，把鮮花放在那裡。主的晚餐不只是這種記念。這不僅僅是對於死去之人的記念儀式。對於信徒來說，吃聖餐是更加認識與信靠基督藉著十架命令為百姓成就的一切的方式。這是一種深深認識及信靠耶穌基督為祂百姓完成救恩的方式。雖然它確實象徵著基督替百姓所做的一切。不過耶穌也使用聖餐來叫祂的百姓漸漸長成祂心意中的樣式。</p>"},{"day":5,"html":"<p>在某些方面，聖禮與聖道相似。聖禮和聖道都是上帝賜給我們的。當我們殷勤使用的時候，都會幫助我們在恩典中長進。領受聖禮或聖道的人，都必須以信心來接受。聖靈使用聖禮和聖道來在祂百姓的心中產生變化。聖道是重要的，洗禮和聖餐也是重要的。不過，在某些方面，這兩樣又十分不同。上帝沒有使用洗禮或聖餐的外在舉動叫非信徒歸信。上帝卻使用聖道來叫非信徒相信基督。就是當非基督徒用信心聆聽聖道的時候，他就成了基督徒。洗禮或聖餐都不能使非基督徒成為基督徒。請讀約翰福音5:24。</p><blockquote><p><strong>約翰福音 5:24</strong><br>我實實在在地告訴你們：那聽我話、又信差我者的，就有永生，不至於定罪，是已經出死入生了。</p></blockquote>"},{"day":6,"html":"<p>聖禮不同於聖道，也在於得益處的人群不同。聖道是對所有人傳講的。當聖道向教會的會眾來傳道，就安慰他們，幫助他們在基督裡剛強。當聖道傳講給會眾之外的人，教會使用它來叫他們覺悟自己的罪，向他們顯明基督是救主。而聖禮只是為那些已經在教會里的人預備的。洗禮和聖餐能夠堅固、鼓舞上帝的百姓，卻對於那些還不是上帝百姓的人沒什麼作用。相反，聖道對於信徒和非信徒都有價值。上帝使用聖道，在那些沒有信心的人心中產生信心。祂使用聖禮來堅固已經信主之人的信心。請讀羅馬書10:17。</p><blockquote><p><strong>羅馬書 10:17</strong><br>可見通道是從聽道來的，聽道是從基督的話來的。</p></blockquote>"}]},{"num":93,"title":"新約的聖禮有哪些？","answer":"新約的聖禮有：洗禮和主的晚餐。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-15","days":[{"day":1,"html":"<p>上帝一直與他的百姓立約。當上帝與人立約的時候，祂應許為他們做事。祂向他們守約。祂也要求立約的百姓某些本分。貫穿整個舊約，上帝與祂的百姓立了若干的約。上帝最早立的約之一就是與亞伯拉罕所立的約。當上帝與亞伯拉罕立約的時候，祂告訴亞伯拉罕要受割禮。割禮是在男子或男孩身上動的一個小手術。亞伯拉罕家裡所有的男人，以及生在他家裡的所有男孩都要受割禮。這將是他們與上帝立約關係的記號和印記。這將在他們身體上看得見，將作為他們屬於上帝的標誌。請讀創世記17:9-10。</p><blockquote><p><strong>創世記 17:9</strong><br>神又對亞伯拉罕說：「你和你的後裔必世世代代遵守我的約。</p></blockquote><blockquote><p><strong>創世記 17:10</strong><br>你們所有的男子都要受割禮，這就是我與你，並你的後裔所立的約，是你們所當遵守的。</p></blockquote><p>不久之後，當摩西帶領上帝的百姓時，上帝與祂百姓立約。上帝給百姓的要求之一就是要他們每年守逾越節。這是為了提醒他們，上帝是如何拯救他們脫離埃及為奴之地。出埃及記12章指出了以色列人應該如何守逾越節。請讀出埃及記12:24，看上帝在這些指示的末了說了什麼。</p><blockquote><p><strong>出埃及記 12:24</strong><br>這例，你們要守著，作為你和你們子孫永遠的定例。</p></blockquote><p>割禮和逾越節是上帝給舊約的百姓作為立約記號和印記的聖禮。</p>"},{"day":2,"html":"<p>當耶穌降世，上帝與百姓立新約。這新約是比以往上帝百姓所擁有的約更美。它包括更美的應許和更美的恩福。當上帝以新的更美的約來代替舊約時，祂也更新了約的記號和印記。聖餐代替了逾越節。洗禮代替了割禮。</p><p>在舊約之下，一個人若不是以色列人，而又想侍奉獨一真神，想成為上帝百姓的一員，他就要受割禮。當猶太人的父母生了男孩，他們就要給他受割禮。割禮做在人身上只有一次。這表明一個人正加入到上帝的百姓中間。現在，他將要被包括在上帝與百姓所立的約中。請讀創世記17:11。</p><blockquote><p><strong>創世記 17:11</strong><br>你們都要受割禮，這是我與你們立約的證據。</p></blockquote><p>在新約之下，洗禮代替了割禮。如同割禮一樣，洗禮也是隻施行在人身上一次。洗禮表明一個人已經加入到上帝的百姓，如同割禮表明的一樣。如同割禮一樣，洗禮表明一個人已經包括在基督與祂的百姓所立的新約當中。請讀加拉太書3:26-28。</p><blockquote><p><strong>加拉太書 3:26</strong><br>所以，你們因信基督耶穌，都是 神的兒子。</p></blockquote><blockquote><p><strong>加拉太書 3:27</strong><br>你們受洗歸入基督的，都是披戴基督了。</p></blockquote><blockquote><p><strong>加拉太書 3:28</strong><br>並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡，都成為一了。</p></blockquote>"},{"day":3,"html":"<p>割禮是個手術，要切去一小塊皮。這會提醒罪人，需要斷絕罪性。人無法從心裡切去罪。必須要由上帝來除掉。當人受割禮的時候，表明他想要除掉罪。它表明他信靠上帝來除掉罪。有時候，一個人的身體受了割禮，可是心裡卻沒有願意要停止犯罪。在這種情況下，身體的割禮毫無用處了。</p><p>同樣，洗禮代表著向自己過去有罪的生活方式而死。當人選擇受洗，他就是在說他不想繼續在對上帝的悖逆中。他的罪性已經與基督同釘十字架。上帝將在他心裡動工，叫他越來越能夠為祂而活。如同割禮一樣，洗禮也是做在人身體上。如果人沒有願意停止犯罪、為神而活，那麼洗禮對他毫無益處。請讀歌羅西書2:11-12，看看這裡如何講論割禮與洗禮。</p><blockquote><p><strong>歌羅西書 2:11</strong><br>你們在他裡面，也受了不是人手所行的割禮，乃是基督使你們脫去肉體情慾的割禮。</p></blockquote><blockquote><p><strong>歌羅西書 2:12</strong><br>你們既受洗與他一同埋葬，也就在此與他一同復活，都因信那叫他從死裡復活 神的功用。</p></blockquote>"},{"day":4,"html":"<p>舊約的大事件是上帝拯救祂的百姓以色列人脫離埃及為奴之地。法老定意要繼續留著以色列人做奴隸。上帝定意要解放他們，領他們到祂應許給他們的地去。上帝給埃及人降了十災，法老才容他們去。最後一災是埃及每家長子夭亡。最終，法老容許以色列人離開埃及。可是，隨後他又改變了主意。他差軍兵追趕他們。當法老將以色列人困在紅海邊上，上帝叫海水分開，從中間形成乾地。隨後上帝的百姓走乾地過海。當埃及人想要追趕，海水複合，他們都淹死了。</p><p>上帝吩咐以色列人每年用一個星期時間來記念這個事件。節期的一個環節就是要吃逾越節的筵席。他們在有生之年，要反覆地有規律地守逾越節。請讀出埃及記12:14。</p><blockquote><p><strong>出埃及記 12:14</strong><br>你們要記念這日，守為耶和華的節，作為你們世世代代永遠的定例。</p></blockquote><p>上帝拯救以色列人出埃及，是一個重要的事件。不過，與上帝拯救祂的百姓脫離罪惡比起來，還是個小事。那是新約中的大事件。在新約之下上帝的百姓，不再透過吃逾越節的筵席來記念從埃及人手下得救。現在他們透過吃主的晚餐來記念他們從罪中得救。主的晚餐，如同逾越節一樣，不僅僅是一次而已，而是要常常反覆記念，直到主再來的日子。</p>"},{"day":5,"html":"<p>「逾越」這個詞來自於埃及十災時發生的事件。上帝警告，祂要殺死埃及地每家的長子。祂在這災禍中不想包括以色列人的家庭。於是神給他們一個方法，逃避上帝所差派滅命的使者。上帝告訴祂的百姓要在晚上殺一隻羊羔。他們要把羊羔的血塗在家裡的門框上。當夜裡滅命的使者來到，他看到門上的血，就從他們的房子「逾越」過去。</p><p>任何不是以色列人的，即使是埃及人，也可以照樣行，就可以逃避滅命的使者。被殺的羊羔，就是逾越節的羊羔。它受死，叫以色列人不必死。每一年，當上帝的百姓記念逾越節的時候，他們就會殺一隻羊羔，把它吃掉。他們同吃逾越節的筵席，來記念上帝為他們做了何等大的事。</p><p>逾越節的羔羊象徵著主耶穌基督。祂受死，叫上帝的百姓不必死。當上帝來審判人們的罪，祂看到他兒子為償還罪債而流出的血，就不審判他們，而是會從祂的百姓身上逾越過去。我們不再吃逾越節羔羊的肉。現在我們一起吃那代表耶穌身體的餅，我們喝葡萄酒或者葡萄汁，那就是耶穌所說代表祂的血。請讀哥林多前書5:7，看聖經如何稱呼耶穌。</p><blockquote><p><strong>哥林多前書 5:7</strong><br>你們既是無酵的面，應當把舊酵除淨，好使你們成為新團；因為我們逾越節的羔羊基督，已經被殺獻祭了。</p></blockquote>"},{"day":6,"html":"<p>在舊約的割禮和逾越節的聖禮中，人們可以看到、嚐到、摸到有形的事物，象徵著屬靈的事物。這些聖禮不是神秘的。它們表明，上帝已經與那些使用聖禮的人立約。割禮和逾越節表明人們相信上帝守約。這些事物表明，上帝的百姓願意忠於上帝。若是沒有對上帝的信心與順服，那麼這些舊約的聖禮就是毫無用處。當今的洗禮和聖餐也是一樣。他們表明我們信靠基督來救我們，表明我們永遠委身侍奉祂。若是沒有對基督的信靠順服，那麼新約的聖禮也是毫無用處的。下面關於割禮的經文，也同樣適用於新約的聖禮，請讀羅馬書2:28-29。</p><blockquote><p><strong>羅馬書 2:28</strong><br>因為外面作猶太人的，不是真猶太人；外面肉身的割禮，也不是真割禮。</p></blockquote><blockquote><p><strong>羅馬書 2:29</strong><br>惟有裡面作的，才是真猶太人；真割禮也是心裡的，在乎靈，不在乎儀文。這人的稱讚不是從人來的，乃是從 神來的。</p></blockquote>"}]},{"num":94,"title":"洗禮是什麼？","answer":"洗禮是聖禮，在其中奉父、子、聖靈的名，以水施洗，確實表明且印證我們與基督連結，領受恩約的福氣，並且我們歸屬於主。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-16","days":[{"day":1,"html":"<p>只要有罪阻隔，就沒有人能成為上帝的兒女。一個人要先脫離罪惡，才能領受歸屬上帝的福分。主耶穌降世，將祂的百姓從罪惡中釋放出來。祂死在十字架上，擔當了他們屢次違背律法所招致的上帝的憤怒。祂的血足夠有價值來償付祂所有百姓的罪。沒有了罪的阻隔，上帝的百姓就可以自由地愛上帝、服侍上帝了。請讀啟示錄1:5-6。</p><blockquote><p><strong>啟示錄 1:5</strong><br>並那誠實作見證的，從死裡首先復活，為世上君王元首的耶穌基督，有恩惠、平安歸與你們！他愛我們，用自己的血使我們脫離罪惡，</p></blockquote><blockquote><p><strong>啟示錄 1:6</strong><br>又使我們成為國民，作他父 神的祭司。但願榮耀、權能歸給他，直到永永遠遠。阿們！</p></blockquote>"},{"day":2,"html":"<p>基督的血洗淨了祂百姓的心。它洗淨了他們一切的罪。人受洗的時候，是用水洗或水灑於身體。這象徵著那些真信耶穌之人內心的狀況。他們的心已經被耶穌基督的血洗淨了。罪不再把上帝與祂的百姓分開。現在他們可以來到上帝面前，確信上帝歡迎他們。請讀希伯來書10:22。</p><blockquote><p><strong>希伯來書 10:22</strong><br>並我們心中天良的虧欠已經灑去，身體用清水洗淨了，就當存著誠心和充足的信心來到 神面前；</p></blockquote>"},{"day":3,"html":"<p>人們照著耶穌所吩咐的，奉父、子、聖靈的名受洗。在救人脫離罪惡的事上，父、子、聖靈都有各自的角色。新信徒必須相信照著聖經裡上帝對於自己的啟示來相信祂。意思是說，受洗的人必須相信聖父上帝，生活中順服祂的命令。他必須相信聖子上帝，把祂作為主來服侍祂。他也必須相信聖靈上帝，願意順服祂的旨意。請讀彼得前書1:1-2。</p><blockquote><p><strong>彼得前書 1:1</strong><br>耶穌基督的使徒彼得，寫信給那分散在本都、加拉太、加帕多家、亞西亞、庇推尼寄居的，</p></blockquote><blockquote><p><strong>彼得前書 1:2</strong><br>就是照父 神的先見被揀選，藉著聖靈得成聖潔，以致順服耶穌基督，又蒙他血所灑的：願恩惠、平安多多地加給你們！</p></blockquote>"},{"day":4,"html":"<p>上帝已經與我們，就是祂的百姓，立了新約。洗禮就是這約的記號和印記。在此約中，上帝應許了許多福分。其中兩樣是：被上帝親自收納為兒女，還有永生。還有好多其他的福氣。耶穌為祂的百姓贏得了這所有的福氣。我們因為與基督聯合而領受這些福氣。祂完全順服的生命和祂為罪而死，都算作是我們的了。洗禮就是我們與基督聯合的記號和印記，這樣祂所配得的各種福分也就屬於我們了。請讀羅馬書6:3-4。</p><blockquote><p><strong>羅馬書 6:3</strong><br>豈不知我們這受洗歸入基督耶穌的人，是受洗歸入他的死嗎？</p></blockquote><blockquote><p><strong>羅馬書 6:4</strong><br>所以我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。</p></blockquote>"},{"day":5,"html":"<p>耶穌為祂百姓贏得，並且在新約中賜給百姓的一種福氣，就是成為祂教會的一員。洗禮宣告一個人現在屬於上帝的百姓。新約裡的另一樣福氣，是罪得赦免。一個因信基督受洗的人，就是一個罪得赦免的人。請讀使徒行傳2:38。</p><blockquote><p><strong>使徒行傳 2:38</strong><br>彼得說：「你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈；</p></blockquote><p>信徒在新約中的另外一個福氣就是，他們已經被更新了。他們有一顆愛上帝、恨罪惡的新心。他們將活出新生活，每日更像耶穌。請讀提多書3:4-5。</p><blockquote><p><strong>提多書 3:4</strong><br>但到了 神我們救主的恩慈和他向人所施的慈愛顯明的時候，</p></blockquote><blockquote><p><strong>提多書 3:5</strong><br>他救了我們，並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。</p></blockquote><p>洗禮是基督為百姓贏得的所有這些恩福的記號和印記。</p>"},{"day":6,"html":"<p>洗禮給人打上屬於主的記號。受洗的人承擔責任，要在一生中作主的僕人。他一定要服侍、跟隨、順服基督。這一問的回答說，洗禮是表明和印證「我們屬於主」，這句話的意思就是如此。在受洗之後，一個人應該行事為人都為了得基督的喜悅。請讀羅馬書6:4,11。</p><blockquote><p><strong>羅馬書 6:4</strong><br>所以我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。</p></blockquote><blockquote><p><strong>羅馬書 6:11</strong><br>這樣，你們向罪也當看自己是死的；向 神在基督耶穌裡，卻當看自己是活的。</p></blockquote>"}]},{"num":95,"title":"洗禮當向誰施行？","answer":"洗禮不可施行於任何在有形教會以外的人，必須等到他們公開認信基督，並且順服祂，才給他們施洗；然而有形教會會員之嬰孩，都應受洗。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-16","days":[{"day":1,"html":"<p>洗禮表明一個人與基督聯合，也與上帝的百姓聯合。一個沒有與主聯合，也沒有與祂百姓聯合的人不應該受洗。洗禮是透過可見的形式，來宣告不可見的事實。洗禮告訴我們，受洗的人現在已經包括在基督與祂百姓所立的約裡面。請讀以弗所書2:12。</p><blockquote><p><strong>以弗所書 2:12</strong><br>那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有 神。</p></blockquote><p>想要受洗的人，必須確定自己信基督，願意順服祂。祂絕不可以只是在自己心裡私下相信而已，卻必須公開表明出來，讓別人可以聽見並且知道。因此，有人想要受洗的時候，牧師會問他是否已經信靠基督作他唯一的救主。牧師也會問，這人是否願意終生跟隨基督。牧師不會願意給不屬基督的人受洗。</p>"},{"day":2,"html":"<p>舊約中立約的記號是割禮。對於上帝在舊約中的百姓，割禮是非常重要的。如果他沒有受割禮，就沒有被包括在上帝的約中。當耶穌降世，祂立了更美的新約。祂設立洗禮，作為新約的記號。有一天，彼得正在向從未受過割禮的一群人傳講耶穌的福音。他正講的時候，聖靈降在聽的人身上。他們開始講起別國的話，讚美上帝。</p><p>這讓彼得和他的朋友們大吃一驚。他們從來沒有想過，聖靈竟然會降臨在沒有割禮的人中間。如果聖靈在這些人的裡面，那麼這些人就是在基督的新約裡面——儘管他們沒有受過割禮。彼得就給這些新信徒受了洗。他給他們打上了新約的記號，儘管他們沒有舊約的記號。這是因為，在新約之下，任何悔改信主的人都要受洗禮。請讀使徒行傳10:44-48。</p><blockquote><p><strong>使徒行傳 10:44</strong><br>彼得還說這話的時候，聖靈降在一切聽道的人身上。</p></blockquote><blockquote><p><strong>使徒行傳 10:45</strong><br>那些奉割禮和彼得同來的信徒，見聖靈的恩賜也澆在外邦人身上，就都希奇，</p></blockquote><blockquote><p><strong>使徒行傳 10:46</strong><br>因聽見他們說方言，稱讚 神為大。</p></blockquote><blockquote><p><strong>使徒行傳 10:47</strong><br>於是彼得說：「這些人既受了聖靈，與我們一樣，誰能禁止用水給他們施洗呢？」</p></blockquote><blockquote><p><strong>使徒行傳 10:48</strong><br>就吩咐奉耶穌基督的名給他們施洗。他們又請彼得住了幾天。</p></blockquote>"},{"day":3,"html":"<p>這個問答的答案教導我們，如果人沒有信基督，也不願意為祂而活，那麼他就不該受洗。但是，這一問也教導，當作為父母的信徒有嬰兒，他們應該在孩子還小的時候就給他受洗。這是因為，洗禮是與百姓立約的記號。在舊約時代，生在上帝家裡的小孩子領受舊約的記號，就是割禮。</p><p>在聖經中，多次講到上帝與百姓立約。如果你閱讀這些經文，你就會發現，上帝常常告訴百姓：「我是與你和你的後裔（兒女，以及兒女的兒女）立約。」當上帝為亞伯拉罕設立割禮，作為祂立約的記號，他命令亞伯拉罕給兒女割禮。當上帝百姓的家裡添了男孩，他就要在很小的時候就受割禮。請讀創世記17:10-12。</p><blockquote><p><strong>創世記 17:10</strong><br>你們所有的男子都要受割禮，這就是我與你，並你的後裔所立的約，是你們所當遵守的。</p></blockquote><blockquote><p><strong>創世記 17:11</strong><br>你們都要受割禮，這是我與你們立約的證據。</p></blockquote><blockquote><p><strong>創世記 17:12</strong><br>你們世世代代的男子，無論是家裡生的，是在你後裔之外用銀子從外人買的，生下來第八日，都要受割禮。</p></blockquote><p>當舊約的父母給男孩子受割禮的時候，他們是在順服上帝。父母是在表明，這孩子是生在上帝的約中的。他們承諾要把孩子作為上帝百姓的一員來撫養。父母是在表明，他們相信上帝能叫孩子憑信心遵守上帝的約。</p>"},{"day":4,"html":"<p>上帝與亞伯拉罕立約的時候，不僅僅是與亞伯拉罕立約，而是與亞伯拉罕的後裔——就是他的兒女、孫兒女、曾孫兒女——所立的。祂應許，不僅是亞伯拉罕的上帝，也是他兒女的上帝，也是他孫兒女的上帝。請讀創世記17:7。</p><blockquote><p><strong>創世記 17:7</strong><br>我要與你並你世世代代的後裔堅立我的約，作永遠的約，是要作你和你後裔的 神。</p></blockquote><p>上帝說祂與亞伯拉罕所立的約是永遠的約。隨著舊約歷史的延續，上帝也與百姓立過其它的約。每一個新約都是上帝與亞伯拉罕所立的同一個永約，不過更清晰更豐富一些。最後，當耶穌降世，與百姓立了新約，這是最終的完美的約。它沒有廢除上帝與亞伯拉罕所立的約，因為上帝曾說這約是永約。新約使得上帝與亞伯拉罕所立的約更加豐富和完美。上帝把信徒的兒女包括在與亞伯拉罕所立的約裡面。基督徒父母在給自己嬰孩受洗的時候，相信上帝是把他們的兒女包括在了新約裡。</p>"},{"day":5,"html":"<p>給自己嬰孩受洗的基督徒父母，想要表明的是，他們的兒女屬於上帝子民的群體。基督徒父母相信，上帝將在他們兒女裡面動工，帶領他們信靠基督。他們承諾要教導孩子認識耶穌，訓練他們來守約。給嬰孩受洗的基督徒父母知道，他們的兒女必須親自信耶穌。如果他們的兒女不信耶穌，他們的兒女就不能成為基督徒。</p><p>即使舊約信徒給孩子割禮的時候，他們也沒有以為割禮自動地就使孩子與上帝和好了。他們知道，真正的割禮是上帝在心裡作的。請讀申命記30:6。</p><blockquote><p><strong>申命記 30:6</strong><br>耶和華 神必將你心裡和你後裔心裡的汙穢除掉，好叫你盡心儘性愛耶和華你的 神，使你可以存活。</p></blockquote>"},{"day":6,"html":"<p>寫下這一要理問答的人說，洗禮是為了悔改相信的人，也是為了信徒的嬰孩。不過有些基督徒相信，洗禮只是給悔改信相信的人設立的。因為嬰孩不能悔改相信，所以這些基督徒認為嬰孩不應該受洗。</p><p>我們必須謹慎，對於像這樣的主題，不能只把我們的理解基於聖經中的幾處經文而已。對於任何主題，我們總是要研究、瞭解整本聖經的教導。然後我們就會有真正合乎聖經的理解。請讀箴言2:1-6。</p><blockquote><p><strong>箴言 2:1</strong><br>我兒，你若領受我的言語，存記我的命令，</p></blockquote><blockquote><p><strong>箴言 2:2</strong><br>側耳聽智慧，專心求聰明，</p></blockquote><blockquote><p><strong>箴言 2:3</strong><br>呼求明哲，揚聲求聰明，</p></blockquote><blockquote><p><strong>箴言 2:4</strong><br>尋找它，如尋找銀子；搜求它，如搜求隱藏的珍寶，</p></blockquote><blockquote><p><strong>箴言 2:5</strong><br>你就明白敬畏耶和華，得以認識 神。</p></blockquote><blockquote><p><strong>箴言 2:6</strong><br>因為耶和華賜人智慧，知識和聰明都由他口而出。</p></blockquote>"}]},{"num":96,"title":"主的晚餐是什麼？","answer":"主的晚餐是聖禮，是照著基督所規定的，分發與領受餅和杯，以表明主的死。按理領受聖餐的人，不憑肉體乃憑信心，領受主的身體與寶血，及祂一切的恩福，使他們的靈命得到養育，在恩典中長進。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-17","days":[{"day":1,"html":"<p>主耶穌賜給我們主的晚餐作為聖禮。在祂與門徒的最後一餐中，祂把餅掰開遞給他們，告訴他們這是祂的身體，為他們掰開的。祂把葡萄汁的杯傳遞給餐桌周圍的每一位，告訴他們這是祂的血，是為他們流出來的。耶穌告訴門徒，祂的血是為赦罪而流出。然後，祂吩咐他們要吃餅喝杯來記念祂，直等到祂再來。主的晚餐與洗禮一樣是上帝與百姓立約的記號和印記。這是立約的記號，意思是說，當我們吃的時候，我們就是在表明我們是被包括在上帝的約中。我們屬於上帝的百姓，我們的罪已得赦免。這也是約的印記，這樣，每一次吃主的晚餐就給我們帶來恩典和赦免。</p><p>為什麼耶穌選擇用吃餅喝杯的方式來作為聖禮呢？因為我們的身體離開餅以及其它糧食就不能生存。我們必須領受上帝賜的糧食，否則就要死掉。我們在屬靈方面，離了主耶穌基督就不能存活。耶穌稱他自己是生命的糧。如果我們想要有永生，就必須接受祂就是上帝所賜下的救主。耶穌說祂的肉是糧食，是祂賜下來叫我們得生命的。請讀約翰福音6:48-51。</p><blockquote><p><strong>約翰福音 6:48</strong><br>我就是生命的糧。</p></blockquote><blockquote><p><strong>約翰福音 6:49</strong><br>你們的祖宗在曠野吃過嗎哪，還是死了。</p></blockquote><blockquote><p><strong>約翰福音 6:50</strong><br>這是從天上降下來的糧，叫人吃了就不死。</p></blockquote><blockquote><p><strong>約翰福音 6:51</strong><br>我是從天上降下來生命的糧；人若吃這糧，就必永遠活著。我所要賜的糧，就是我的肉，為世人之生命所賜的。「</p></blockquote>"},{"day":2,"html":"<p>當上帝帶領我們悔改相信的時候，我們就信靠他的兒子耶穌。正當那時，上帝一次性地赦免我們所有的罪。祂赦免了我們過去曾經犯的罪，祂也赦免我們還沒有犯的罪。我們做什麼也不會失去上帝的赦免。我們做什麼也不能叫上帝的赦免更充分一點兒。不過我們沒有停止犯罪。我們每天也多種方式犯罪。因為上帝已經改變了我們的心，所以現在我們的首要的願望是得上帝的喜悅。當我們犯罪的時候，我們就會感到自責和憂愁。上帝憑著自己的良善，賜給我們主的晚餐，提醒我們，耶穌已經完全償付了我們所有的罪債，上帝已經饒恕我們。當我們來到主的桌前，我們認真省察自己過去的生活，看看我們在哪些方面得罪了上帝。當我們憑信心來吃主的晚餐，我們又一次接受基督和祂的赦免。請讀馬太福音26:26-28。</p><blockquote><p><strong>馬太福音 26:26</strong><br>他們吃的時候，耶穌拿起餅來，祝福，就掰開遞給門徒，說：「你們拿著吃，這是我的身體。」</p></blockquote><blockquote><p><strong>馬太福音 26:27</strong><br>又拿起杯來，祝謝了，遞給他們，說：「你們都喝這個，</p></blockquote><blockquote><p><strong>馬太福音 26:28</strong><br>因為這是我立約的血，為多人流出來，使罪得赦。</p></blockquote>"},{"day":3,"html":"<p>一天要結束了，如果你從午飯後一直拼命地工作或者玩耍，什麼東西也沒有吃，那麼你會飢腸轆轆。你的身體會疲乏軟弱。當你吃東西的時候，你的身體就重新得力。你又可以強壯，有了新能量，當你每天吃正確的食物，那些食物就會滋養你的身體。它會叫你的身體強壯健康。</p><p>主的晚餐對於上帝百姓的靈命來說，正像是食物對於他們身體的作用一樣。有時候，我們在為上帝而活的時候，會變得疲乏、灰心。主的晚餐使基督徒重新得力，如同食物使我們的身體重新得力一樣。我們藉著吃主的晚餐得到鼓勵和剛強。上帝賜下主的晚餐，滋養我們的靈魂。當耶穌在世上的時候，祂跟一群不明白祂話的人說過，他們沒有為靈魂尋覓食物。這些人當時只關心身體需要糧食一樣。這些人看到耶穌用一個男孩的午餐，五個餅兩條魚，餵飽了五千人。他們跟隨耶穌，盼望著耶穌給他們的身體提供更多的食物。請讀約翰福音6:26-27，看看耶穌告訴他們什麼？</p><blockquote><p><strong>約翰福音 6:26</strong><br>耶穌回答說：「我實實在在地告訴你們：你們找我，並不是因見了神蹟，乃是因吃餅得飽。</p></blockquote><blockquote><p><strong>約翰福音 6:27</strong><br>不要為那必壞的食物勞力，要為那存到永生的食物勞力，就是人子要賜給你們的，因為人子是父 神所印證的。「</p></blockquote>"},{"day":4,"html":"<p>在主的晚餐中，上帝的百姓領受掰開的餅，把它吃掉。他們拿起為他們所傾倒的杯，把它喝掉。當他們如此行的時候，上帝的百姓領受主的身體和主的血。信徒不是靠自己來得所需，而是謙卑地領受上帝所賜的。當人們起初信靠基督的時候，他們信靠上帝所賜的救主來赦免他們的罪。當他們有規律地吃主的晚餐，他們是在持續地信靠祂，憑信心以祂為糧。請讀約翰福音6:28-29。</p><blockquote><p><strong>約翰福音 6:28</strong><br>眾人問他說：「我們當行什麼，才算做 神的工呢？」</p></blockquote><blockquote><p><strong>約翰福音 6:29</strong><br>耶穌回答說：「信 神所差來的，這就是做 神的工。」</p></blockquote>"},{"day":5,"html":"<p>那些分享主的晚餐的人，是與基督聯合。按理領受聖餐的人，領受主的身體與寶血，及祂一切的恩福，都算作是上帝的百姓自己做的一樣。耶穌在世上以人的樣式所做的一切，都算作是上帝的百姓自己做的一樣。祂向上帝活出了完全順服的生活。祂的百姓與祂聯合，這樣祂因自己的順服所得的賞賜也都屬於祂的百姓了。耶穌受死償還罪債。祂的百姓與祂聯合，這樣祂所受到的所有刑罰，都算作是祂的百姓所受的。上帝絕不會再次懲罰他們。當上帝的百姓在主的晚餐時吃餅喝杯，他們是憑著信心領受祂所購來的恩典。請讀約翰福音6:53-56。</p><blockquote><p><strong>約翰福音 6:53</strong><br>耶穌說：「我實實在在地告訴你們：你們若不吃人子的肉，不喝人子的血，就沒有生命在你們裡面。</p></blockquote><blockquote><p><strong>約翰福音 6:54</strong><br>吃我肉喝我血的人就有永生，在末日我要叫他復活。</p></blockquote><blockquote><p><strong>約翰福音 6:55</strong><br>我的肉真是可吃的，我的血真是可喝的。</p></blockquote><blockquote><p><strong>約翰福音 6:56</strong><br>吃我肉、喝我血的人常在我裡面，我也常在他裡面。</p></blockquote>"},{"day":6,"html":"<p>當信徒參與主的晚餐，他們在「表明祂的死」。這不僅僅是說，上帝的百姓在向世界宣告耶穌死得很悲慘。有時候當無辜的人們因事故死亡，人們會在特殊的儀式上為他們默哀片刻。當重要的領導人去世，國旗都會降下幾日。這些方式都是記念已故的人，表明對於已故者的尊重。</p><p>主的晚餐卻不是這樣的。這可不僅僅是一個記念儀式。當上帝的百姓在主的晚餐中「表明祂的死」，他們信靠耶穌受死之時所做成的事。他們藉著自己的行動宣告，當耶穌死在十字架上，祂是為了祂百姓的罪孽。藉著吃主的晚餐，上帝的百姓表明他們相信，耶穌的死足以拯救他們脫離他們的罪惡。請讀哥林多前書11:26。</p><blockquote><p><strong>哥林多前書 11:26</strong><br>你們每逢吃這餅，喝這杯，是表明主的死，直等到他來。</p></blockquote>"}]},{"num":97,"title":"應當如何行，才是按理領受主的晚餐？","answer":"按理領受主的晚餐，人必須省察自己：是否清楚分辨這是主的身體，是否憑信心領受祂為真糧，是否向主悔改、愛主愛人，重新順服；免得不按理吃喝，自取審判。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-17","days":[{"day":1,"html":"<p>吃主的晚餐本身並沒有什麼神秘的。如果想要它幫助我們成長，我們就必須按理領受。主的晚餐雖然不是神秘的，卻是神聖的。這是聖潔的禮儀時間，是更新我們向主委身的時間。聖經警告我們，不要以不合宜的方式來吃主的晚餐。意思是說，不要輕視它，不把它當做非常嚴肅的事情。因為主的晚餐是特別的，所以我們應該為此有所預備。聖經告訴我們要在領受主的晚餐之前省察自己。每次我們準備領受的時候，都有一些事情需要我們在內心省察。請讀哥林多前書11:27-28。</p><blockquote><p><strong>哥林多前書 11:27</strong><br>所以，無論何人不按理吃主的餅、喝主的杯，就是干犯主的身、主的血了。</p></blockquote><blockquote><p><strong>哥林多前書 11:28</strong><br>人應當自己省察，然後吃這餅、喝這杯。</p></blockquote>"},{"day":2,"html":"<p>在領受主的晚餐之前需要在內心省察的一個重要方面，就是我們的悟性。這個問答的答案說我們要「分辨這是主的身體」，就是這個意思。我們是否清楚這餅代表著基督的身體，是為祂的百姓破碎的？我們是否清楚，葡萄汁代表耶穌的血，是為償還他們的罪債而流出的？</p><p>有時候，小孩子們也想吃主的晚餐，就是因為那是吃的東西，而且別人都吃了！主的晚餐不是用茶點的時間。孩童們尚未明白基督為罪而死，餅和杯如何向我們表明這真理，那麼父母就不可以允許孩童吃主的晚餐。有時候人們想吃主的晚餐，是因為他們想效仿周圍其他人的行動而已。有的成年人或許以為餅和葡萄汁本身對他們有益處。當然，這是不對的。如果不明白主的晚餐是什麼，那麼就不應該與人同領。請讀哥林多前書11:29。</p><blockquote><p><strong>哥林多前書 11:29</strong><br>因為人吃喝，若不分辨是主的身體，就是吃喝自己的罪了。</p></blockquote><p>我們也要省察自己的信心。我們是否憑信心領受祂為真糧？我們是否信靠主耶穌基督來賜給我們取悅上帝以及我們成長所需要的一切？從來沒有信靠基督的人不應該領受主的晚餐。請讀哥林多後書13:5。</p><blockquote><p><strong>哥林多後書 13:5</strong><br>你們總要自己省察有信心沒有，也要自己試驗。豈不知，你們若不是可棄絕的，就有耶穌基督在你們心裡嗎？</p></blockquote>"},{"day":3,"html":"<p>這一問的答案說，我們也應該省察自己，看我們是否向祂悔改了。上帝給祂所拯救的人賜下悔改的心。如果人從未從罪中悔改，他們就根本不是基督徒。如果他們從來沒有為罪憂傷，也從未從罪中轉離，他們就不應該吃主的晚餐。即使在上帝改變我們的心，我們能悔改信靠基督耶穌之後，我們心裡的罪也沒有馬上就無影無蹤。我們仍然會時而與悖逆上帝。我們每天都犯罪，需要不斷悔改。在主的晚餐之前，我們應該花時間想想我們的日常生活，省察我們做的有罪的事，以及我們有罪的態度。我們省察到了什麼，我們就必須向上帝認罪。然後我們必須決定，靠著上帝的幫助，我們不要再做那樣的事。請讀耶利米哀歌3:40。</p><blockquote><p><strong>耶利米哀歌 3:40</strong><br>我們當深深考察自己的行為，再歸向耶和華。</p></blockquote>"},{"day":4,"html":"<p>在吃主的晚餐之前，我們也必須省察自己的愛心。如果任其自然，人們自然地在心裡恨惡上帝。當耶穌改變人心的時候，祂拿走了那顆恨惡上帝的心，以對上帝的愛來代替。真正的基督徒會愛上帝，願意得祂的喜悅。聖經告訴我們，真正的基督徒也會愛其他的基督徒。如果人不愛上帝，也不愛上帝的百姓，那麼他根本不是基督徒，就不應該吃主的晚餐。就算上帝在信徒心裡賜下對上帝的愛和對祂百姓的愛之後，人們也仍然彼此冒犯。常常會見到，基督徒彼此傷害，彼此激怒。</p><p>在主的晚餐之前，我們尤其應該省察我們自己，看看我們心裡是否有什麼缺乏愛心的態度。我們應該問自己是否做過任何傷害他人的事。如果有，我們應該到我們曾傷害的人那裡，請求饒恕，然後再吃主的晚餐。也許有人曾做了傷害我們的事。我們應該在心裡饒恕他們，然後再來到主的桌前。請讀約翰壹書4:19-21。</p><blockquote><p><strong>約翰一書 4:19</strong><br>我們愛，因為 神先愛我們。</p></blockquote><blockquote><p><strong>約翰一書 4:20</strong><br>人若說「我愛 神」，卻恨他的弟兄，就是說謊話的；不愛他所看見的弟兄，就不能愛沒有看見的 神。</p></blockquote><blockquote><p><strong>約翰一書 4:21</strong><br>愛 神的，也當愛弟兄，這是我們從 神所受的命令。</p></blockquote>"},{"day":5,"html":"<p>主的晚餐也提醒我們，要省察自己看看我們是否對基督有重新的順服。在耶穌拯救我們之前，我們是悖逆上帝的人。我們不想他做要求我們的事。但是當耶穌拯救我們，改變我們的心，祂賜給我們一個新的願望，要順服祂。如果我們是基督徒，我們就會想知道上帝的話是怎樣說，好叫我們順服。那些根本不在乎自己是否順服上帝的人，不應該吃主的晚餐。他們也許不是基督徒。當然，就連那些知道上帝的話、願意遵行上帝話語的人，有時候也會失敗。在領受主的晚餐之前，基督徒應該省察自己，看看自己在哪些方面沒有順服上帝。他們應該為這些事在上帝面前認罪，懇求上帝幫助他順服。請讀約翰一書2:3-6。</p><blockquote><p><strong>約翰一書 2:3</strong><br>我們若遵守他的誡命，就曉得是認識他。</p></blockquote><blockquote><p><strong>約翰一書 2:4</strong><br>人若說「我認識他」，卻不遵守他的誡命，便是說謊話的，真理也不在他心裡了。</p></blockquote><blockquote><p><strong>約翰一書 2:5</strong><br>凡遵守主道的，愛 神的心在他裡面實在是完全的，從此我們知道我們是在主裡面。</p></blockquote><blockquote><p><strong>約翰一書 2:6</strong><br>人若說他住在主裡面，就該自己照主所行的去行。</p></blockquote>"},{"day":6,"html":"<p>使徒保羅寫信給哥林多的基督徒，告訴他們，他們在領受主的晚餐的方式上有錯誤。那些哥林多人在彼此惹氣的狀態中吃主的晚餐。他們在生活方式上正在犯罪，卻沒有在來到主的晚餐之前悔改。他們只是把主的晚餐當成是另一次吃飯的時間。保羅為此責備了哥林多人。他告訴他們，他們中間有人得病，有的死了，是因為上帝因著他們領受主的晚餐的方式正在審判他們。上帝非常重視主的晚餐。祂命令我們守聖餐，而且要我們也重視聖餐。請讀哥林多前書11:17-18,20-21,30。</p><blockquote><p><strong>哥林多前書 11:17</strong><br>我現今吩咐你們的話，不是稱讚你們，因為你們聚會不是受益，乃是招損。</p></blockquote><blockquote><p><strong>哥林多前書 11:18</strong><br>第一，我聽說你們聚會的時候，彼此分門別類，我也稍微地信這話。</p></blockquote><blockquote><p><strong>哥林多前書 11:20</strong><br>你們聚會的時候，算不得吃主的晚餐；</p></blockquote><blockquote><p><strong>哥林多前書 11:21</strong><br>因為吃的時候，各人先吃自己的飯，甚至這個飢餓，那個酒醉。</p></blockquote><blockquote><p><strong>哥林多前書 11:30</strong><br>因此，在你們中間有好些軟弱的與患病的，死的也不少。</p></blockquote>"}]},{"num":98,"title":"禱告是什麼？","answer":"禱告是奉基督的名，承認我們的眾罪，感謝上帝諸般的憐憫，來向上帝獻上我們的心願，並祈求合乎上帝旨意的事。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-18","days":[{"day":1,"html":"<p>很多人對於禱告有錯誤的觀念。大多數人都相信，他們什麼時候願意，什麼時候就可以向上帝說話，祂就會聽。這些人相信，上帝的工作就是聽禱告，然後回應禱告。他們可能連續多年根本不跟上帝講話。然後當出現難題的時候，他們禱告求幫助，盼望上帝回應禱告。這些人沒有弄明白，上帝不是聽每一個人的禱告。</p><p class=\"read-prompt\">請讀箴言15:8,29。</p><blockquote><p><strong>箴言 15:8</strong><br>惡人獻祭，為耶和華所憎惡；正直人祈禱，為他所喜悅。</p></blockquote><blockquote><p><strong>箴言 15:29</strong><br>耶和華遠離惡人，卻聽義人的禱告。</p></blockquote><p>上帝不聽惡人的禱告。祂恨惡他們的禱告。因為所有人都是罪人，那麼就沒有人可以向上帝禱告了麼？那些信靠耶穌的人，是以耶穌的義來到上帝面前，是因為他們的罪已得赦免。未曾信靠基督的非信徒，
