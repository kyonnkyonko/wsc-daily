<script type="application/json" id="app-data">{"about":{"html":"<h2>更新心意學教理</h2><p class=\"subtitle\"><em>以《威斯敏斯德小教理問答》為基礎的家庭敬拜</em></p><p>作者：Starr Meade</p><p>翻譯：郭春雨</p><h3>簡介</h3><p>使徒保羅在其所寫的第一卷教牧書信中，把教會定義為「真理的柱石和根基」（提摩太前書 3:15）。對於今日去教會的人來說，他們找教會的時候，未必是要尋找真理的柱石和根基。他們最關心的可能是：受歡迎的熱烈程度，教會音樂的風格，或者每週可選的活動數量。人們在教會中，越來越少地把忠於聖經真理當做第一要緊的事。</p><p>不過，至少從新約作者的角度看，一個教會的最高檢驗標準就是：這個教會是真理的柱石和根基嗎？它是否十分熟悉聖經中所記載的福音真理？它是否高舉上帝的道，在所有敬拜及活動中讓它居首位？在這混亂及虛妄的世界中，它是否不惜代價地捍衛真理，毫不妥協地傳揚真理？它是否呼籲會眾為了謹守遵行上帝的道，而要曉得上帝的道？</p><h4>教會的任務</h4><p>在每個世代，教會最關鍵的任務都是，要原原本本地照著主所交付的，高舉並傳揚真理。這個任務的一個重要方面就是，要殷勤預備教會的孩子們，繼續在未來的世代作真理的柱石和根基。上帝呼籲每個世代的教會要「為一次交付聖徒的真道竭力爭辯」（猶大書3）。當我們的兒女接替我們成為信仰的護衛者，他們對於自己要捍衛的真理有清楚的瞭解嗎？當他們接替我們成為真理擁護者，他們是否明白真理，以至於能夠清晰表達出來，並且能夠認出冒牌貨呢？</p><p>往日那些明智敬虔的人明白真理標準以及基督信仰教義的必要性。他們看到了標準規範的意義，在於將聖經的基本教導，以簡明、系統的方式呈現出來。也在於提供一種架構來篩選一切教導和觀念。他們以極大的關切以及恆切的禱告，同心合力地制訂了信經、信條，來規範基督信仰的基礎要義。他們知道把這些教義傳遞給兒女的重要性，於是他們也預備了教理問答來教導小孩子。</p><p>教理問答只是教導的指南。是一本問答手冊，其設計目的就是要教導信仰的原則。用問答方式教導孩子，就是要教他們背誦問答裡的回答，這樣當被問到教理問答的問題時，孩子們就可以答出正確答案。因為好的教理問答，既簡明又深入，所以如果孩子學得好，那麼他們對於基督信仰的基本要義就會得到完備的檢驗。教理問答中比較出色的一個，就是《韋斯敏斯德小要理問答》。它以簡明的形式，為孩子提供了關於上帝、聖經、主耶穌基督、聖靈、救恩、聖禮、十誡和主禱文等方面的主要聖經教導。</p><p>教導教理問答曾經一度是教會的常規。教會與家庭一道，給成長於基督徒圈子裡的孩子們提供最有效的教導。父母會在家一起學習，要求孩子背誦教理問答的回答（父母自己也背誦這些答案）。家人會一起討論這些問題的意思。牧師就著教理問答中講到的題目來講道，會系統地安排探訪每一個教會成員家庭，問這些問題，看這家人是否學會了如何回答。</p><p>清教徒牧師理查德·巴克斯特，把每年探訪教會的八百個家庭作為常例，探訪的核心就是《韋斯敏斯德小要理問答》中的教導。除了檢查孩子和大人是否瞭解教理問答，他還會問額外的問題，看他們是否真正明白了答案。然後他繼續鼓勵這家的每個成員，要照著每個熟記在心的真理而生活。巴克斯特說，透過這種做法，在他的教會成員中，黑暗的國度被成功摧毀的外在表現，甚至超過他在公眾面前的講道。</p><p>不幸的是，用教理問答教導孩子的做法已經在家庭和教會中失寵了。原因之一是，人們開始追逐新潮的教育技術，強調體驗、學生參與以及選擇。死記硬背已經失寵了。但是，我從小到大記得最清楚的東西，就是我背過的東西。給很多東西排序的時候，我們所唱的「字母表」，九九乘法表，普通的童謠，甚至在我還不明白的時候，因為其文字優美而背誦下來的莎士比亞的劇本臺詞——這些東西都銘記在我心裡。我可以在任何需要的時候想起它們，也十分有把握，它們隨時在那裡為我待命。</p><p>有人說，如果我們要求孩子死記硬背，他們記住的都是毫無意義的讀音和詞彙，卻一點也不理解。當然，如果我們堅持叫他們背誦不理解的東西，同時我們卻不花時間問他們討論、教導和解釋意思，那麼我們確實在幫倒忙。不過，解決方式不是撇棄背誦這種教導方式，而是藉著討論和解釋來忠實地充實其含義。</p><h4>教會的失敗</h4><p>不過，教理問答失寵有另一個更重要的原因。就是總體來說，對於任何人，尤其是對孩子，教義方面的教導已經不受歡迎了。為了試圖吸引非信徒，教會致力於提供能夠融入這個世界的東西。這樣做的時候，教會就看不到她的真正存在的目的是真理的柱石和根基。</p><p>從講臺上傳講的安慰、感動和培靈資訊是受歡迎的，可是教義不受歡迎。人們在錯誤原則引導下，試圖不惜任何代價保守合一，教義方面的教導大家避之唯恐不及，因為「教義造成分裂」。去教會的人們批評強調教義的講道，說這樣的講道不實用，他們不明白真正改變的生命源於真正改變的心意。越來越多的教會，為了迎合人們的需要，就提供一些溫暖的、感動人的，卻從不清楚解明福音的資訊。在越來越多的教會敬拜及活動中，娛樂代替了基督信仰義的實際教導。</p><p>在一般美國教會的兒童和青少年部門，這些現象是最明顯不過了。在我為某個地方教會擔任兒童事工主任的十年中，我收集了許多教會課程計劃，而且也收到了很多教會向外發放的廣告。</p><p>通常，色彩繽紛、光彩照人的促銷材料都承諾「你的孩子肯定會喜歡的！好玩的遊戲，新潮的手工，樂翻天的體驗！」當然「遊戲、手工和快樂體驗」對於孩子來說，沒什麼錯的。我們凡是愛孩子的，都想讓他們享受學習。不過，一頁又一頁的內容都是在描述怎麼玩，而只是在小冊子某個不起眼的角落稍微提到了課程的內容，很顯然已經搞錯了什麼是重點。</p><p>研究表明人們喜歡什麼，廣告商就宣傳什麼。那麼教會對於自己的孩子，重點應該放在哪裡？兒童課程的廣告已經給出了最清楚的答案。讓孩子娛樂開心——這成了其他東西都要讓位的最主要目標。</p><p>就算是在以教導孩子聖經為主的地方，教導教義很少成為主要目標。孩子們不斷反覆聽到同樣的聖經故事，幾乎總是關於如何表現的道德教訓。典型的主日學課程，把聖經故事濃縮成了道德故事，彷彿伊索寓言一樣。重點放在了故事中的人，他成了主角。於是老師講到最後，就總結了「你也要像大衛那樣，上帝就會祝福你了。」或者說「你千萬別像亞哈那樣，否則你的麻煩就大了。」</p><p>當聖經故事如此使用的時候，上帝處在了敘事的邊緣地帶，就像童話故事裡的小精靈，因著人的好行為就祝福他，因著人的失敗就咒詛他。孩子們很少學到，上帝自己才是每一個聖經故事的主角。孩子們沒有學會在所讀到的每段故事中發問「關於上帝，這個故事告訴我們什麼？」他們從來沒有學會，以上帝救贖祂子民群體歸屬自己的救贖目的這個角度來閱讀所有的聖經記事。他們學到的就是：要乖乖的，上帝就祝福；要不聽話，祂就不祝福。這不僅是濫傳福音，而且根本不是福音！這是多大的悲劇啊。</p><p>上帝在祂的恩典和降卑中，叫聖經充滿了故事以及對於抽象真理的具體例證。但是我們必須照著上帝的目的來使用聖經故事。祂賜給我們聖經故事的原因，與賜給我們整本聖經的原因是一樣的——叫我們認識祂，唯一的真神是怎樣的，我們明白祂藉著祂的兒子為祂子民所預備的救恩。聖經故事闡述的是聖經教義。我們做兒童事工的弟兄姊妹應該為此感恩，應該使用聖經敘事來幫助孩子們理解信仰的教義。我們如果只是用它們來做道德教化或者裝備孩子們贏得聖經知識競賽，那麼我們就是在浪費聖經故事。</p><p>教會是否正在裝備孩子們在下一代成為真理的柱石和根基呢？幾年前，我聽一個廣播節目，在一個基督徒大會現場採訪與會者的作家和出版商。採訪者反覆提問與會者的兩個主要問題是：「稱義是什麼？」以及「福音是什麼？」很可悲的是，大多數的受訪者對於這兩個問題，都不能給出一個清楚的符合聖經的答案。然而，基督信仰就是福音本身啊。我們信仰的核心問題就是在聖潔的上帝面前，罪人被稱義了。這些東西對於理解基督信仰來說是最核心的。</p><p>如果這些受訪者被教導過《韋斯敏斯德小要理問答》，他們就會胸中有成竹地回答「稱義是上帝白白恩典的行動，藉此祂赦免我們的一切罪惡，接納我們在他面前為義人。這唯獨因基督的義歸算在我們身上，而我們只是憑信心領受而已。」多麼簡單，又是多麼透徹啊！難道有什麼理由，人們必須等到去聖經學院或者神學院，才去學習我們信仰中這麼要緊、這麼簡單的定義嗎？</p><p>今天，我們常常滿足於滿口「神」字的話語，滿足於對於祂溫暖的感受。在充斥著關於上帝的錯謬觀念的社會里，我們在使用一個詞的時候，沒有給出定義。我們渴慕接納並最樂觀地看待每個人，所以當我們聽到那些帶著「神」的話，就樂不可支，以為使用的人是我們中的一員了。當我們把這種錯誤與我們對孩子自然的同情結合起來，我們就更迅速地以為孩子是基督徒了，而實際上，他根本都不知道成為基督徒是什麼意思。</p><p>在一年的夏天，在一個問題家庭兒童的基督徒營會中，一位輔導員跟我彙報了她與一位十歲的營員之間的對話。她說：「我問他，有沒有曾經請求耶穌進入他的心，他說他六歲的時候就這樣做了。」她繼續給我講，他們一起翻看他的新聖經，突然孩子看見了一幅圖畫，是加略山上的三個十字架。男孩好奇地問「這個故事講的是什麼啊？」跟這孩子的討論結果讓輔導員感到安慰，她相信孩子因為六歲的時候做過的一件事就得救了。不過，很明顯，她沒有想到，不管孩子可能做過什麼決定，如果他們完全不懂基督釘十字架，就沒有把握假定他們就是信徒了。</p><h4>解決方案</h4><p>我們如果真正關心傳遞歷史傳承下來的基督信仰真理接力棒，我們必須認識到忠心向孩子們分享教義的重要性。我們不可以依靠雜亂無章的聖經故事和背誦金句，指望孩子可能會以某種方式從中提取出基督信仰的重要教導。反之，我們必須提供認真系統的教義教導。孩子們需要一種過濾機制，來篩選他們看到和聽到的一切。教義不能等到孩子成為青少年的時候，因為青少年已經開始做重要的人生抉擇了。做這些抉擇所需的神學框架，就是符合聖經的世界觀，必須早早就位。</p><p>這本書的目的，就是要為那些重視向孩子們傳遞教義的基督徒父母和教會提供一個工具。問題和答案來自於《韋斯敏斯德小要理問答》。每一個問答都提供六天分量的家庭共同靈脩閱讀材料。這些閱讀內容用詞淺顯，主要物件是小學、初中的孩子。內容也簡短扼要，主要是考慮到孩子們能夠保持專注的時間有限，以及當代家庭多有忙碌的計劃。</p><p>每一段閱讀內容都配有經文依據和對答案的解釋。每一週的每一天，都會問同一個問題，答案也會被多次複述，然後輔以所提供的閱讀內容。在週末的時候，答案就要背下來。可是事先確定某種獎勵，學會了一定數量的問答之後就可以頒發了。如果每週背誦一個答案，那麼整個教理問答將在兩年完成。因為教理問答包含了豐富的資訊，因為我們反覆溫習就記得最牢固，所以我建議，可以帶領孩子反覆學習整個要理問答。</p><p>使徒保羅稱提摩太是「因信主作他真兒子」。他透徹地、忠心地教導提摩太，然後差他去繼續保羅自己開始的事工。這是我們作為父母必須為孩子做的事。這是我們作為教會為我們之後的教會，為下一代的教會做的事。我們必須現在就履行我們的責任，這樣我們才能像保羅對提摩太那樣滿有把握地說：「你從我所聽的那純正話語的規模，要用在基督耶穌裡的信心和愛心，常常守著。從前所交託你的善道，你要靠著那住在我們裡面的聖靈牢牢地守著。」（提摩太後書 1:13-14）</p>"},"categories":[{"id":"intro","part":0,"label":"引言","range":"第1-3問","questions":[1,2,3]},{"id":"p1-1","part":1,"label":"神是怎樣的神","range":"第4-6問","questions":[4,5,6]},{"id":"p1-2","part":1,"label":"神做了什麼","range":"第7-8問","questions":[7,8]},{"id":"p1-3","part":1,"label":"創造","range":"第9-10問","questions":[9,10]},{"id":"p1-4","part":1,"label":"護理","range":"第11-12問","questions":[11,12]},{"id":"p1-5","part":1,"label":"人是如何犯罪的","range":"第13-15問","questions":[13,14,15]},{"id":"p1-6","part":1,"label":"人犯罪的結果","range":"第16-19問","questions":[16,17,18,19]},{"id":"p1-7","part":1,"label":"救恩","range":"第20-22問","questions":[20,21,22]},{"id":"p1-8","part":1,"label":"基督的拯救工作","range":"第23-28問","questions":[23,24,25,26,27,28]},{"id":"p1-9","part":1,"label":"聖靈的拯救工作","range":"第29-31問","questions":[29,30,31]},{"id":"p1-10","part":1,"label":"救恩在今世的益處","range":"第32-36問","questions":[32,33,34,35,36]},{"id":"p1-11","part":1,"label":"救恩在今世之後的益處","range":"第37-38問","questions":[37,38]},{"id":"p2-1","part":2,"label":"道德律","range":"第39-44問","questions":[39,40,41,42,43,44]},{"id":"p2-2","part":2,"label":"第一誡","range":"第45-48問","questions":[45,46,47,48]},{"id":"p2-3","part":2,"label":"第二誡","range":"第49-52問","questions":[49,50,51,52]},{"id":"p2-4","part":2,"label":"第三誡","range":"第53-56問","questions":[53,54,55,56]},{"id":"p2-5","part":2,"label":"第四誡","range":"第57-62問","questions":[57,58,59,60,61,62]},{"id":"p2-6","part":2,"label":"第五誡","range":"第63-66問","questions":[63,64,65,66]},{"id":"p2-7","part":2,"label":"第六誡","range":"第67-69問","questions":[67,68,69]},{"id":"p2-8","part":2,"label":"第七誡","range":"第70-72問","questions":[70,71,72]},{"id":"p2-9","part":2,"label":"第八誡","range":"第73-75問","questions":[73,74,75]},{"id":"p2-10","part":2,"label":"第九誡","range":"第76-78問","questions":[76,77,78]},{"id":"p2-11","part":2,"label":"第十誡","range":"第79-81問","questions":[79,80,81]},{"id":"p2-12","part":2,"label":"律法的刑罰","range":"第82-84問","questions":[82,83,84]},{"id":"p2-13","part":2,"label":"得救之法","range":"第85-87問","questions":[85,86,87]},{"id":"p2-14","part":2,"label":"聖經是蒙恩的管道","range":"第88-90問","questions":[88,89,90]},{"id":"p2-15","part":2,"label":"聖禮是蒙恩的管道","range":"第91-93問","questions":[91,92,93]},{"id":"p2-16","part":2,"label":"洗禮","range":"第94-95問","questions":[94,95]},{"id":"p2-17","part":2,"label":"聖餐","range":"第96-97問","questions":[96,97]},{"id":"p2-18","part":2,"label":"禱告也是蒙恩的管道","range":"第98-99問","questions":[98,99]},{"id":"p2-19","part":2,"label":"主禱文","range":"第100-107問","questions":[100,101,102,103,104,105,106,107]}],"questions":[{"num":1,"title":"人的主要目的是什麼？","answer":"人的主要目的是榮耀上帝，以祂為樂，直到永遠。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"intro","days":[{"day":1,"html":"<p>如果不照著一樣東西的真正用途來使用它，那會怎麼樣呢？比方說，你想牙齒更白，於是想用白鞋油來美白你的牙齒，你看看怎麼樣？當然不可以啦。鞋油是用來擦鞋的，不是用來刷牙的。如果把棉花糖放到烤麵包機裡面，那又怎麼樣呢？你會弄得一團糟，因為烤麵包機是用來烤麵包的，不是用來烤棉花糖的。各種東西都用得其所，才能發揮最大的作用。</p><p>上帝造人的時候，對人有一個設想的目的。上帝要人認識祂，享受祂。石頭、樹木和小貓不能以上帝為樂——可是人能！</p><p class=\"read-prompt\">請讀詩篇 16:11。</p><blockquote><p><strong>詩篇 16:11</strong><br>你必將生命的道路指示我。在你的面前有滿足的喜樂。在你右手中有永遠的福樂。</p></blockquote><p>這節經文描述了，人們按照上帝設計的目的生活時，是何等的幸福快樂！有些人活著，似乎就為了及時行樂，要麼就是為了賺大錢。這樣的人，永遠不會滿足。他們發現，放縱狂歡和新鮮玩意兒帶來的開心，真是稍縱即逝。這是因為，他們沒有照著上帝設計的目的去生活。當我們為以上帝為樂而活著，我們就是在做上帝造我們時要我們做的，那麼我們在祂裡面的喜樂就可以經久不衰。</p>"},{"day":2,"html":"<p>既然上帝創造我們，為了讓我們以祂為樂，那麼我們就必須弄清楚：我們怎樣才能以祂為樂。想要完全享受一朵花，我們只有停下來仔細觀看，看看它的美麗；再深吸一口氣，聞聞它的芳香。想要完全享受一個蘋果，我們就要咬一口，嚐嚐它是怎樣的脆、怎樣的甜。如果你想享受上帝，你就得花點時間，認識祂是何等美善。</p><p>讀路加福音 10:38–42。</p><blockquote><p><strong>路加福音 10:38-42</strong><br>他們走路的時候，耶穌進了一個村莊。有一個女人名叫馬大，接他到自己家裡。他有一個妹子名叫馬利亞，在耶穌腳前坐著聽他的道。馬大伺候的事多，心裡忙亂，就進前來說，主阿，我的妹子留下我一個人伺候，你不在意麼。請吩咐她來幫助我。耶穌回答說，馬大，馬大，你為許多的事，思慮煩擾。但是不可少的只有一件。馬利亞已經選擇那上好的福分，是不能奪去的。</p></blockquote><p>馬利亞正在以耶穌為樂。馬大卻搞不懂上帝給她的目的。她似乎以為，她的目的是努力工作，做一個好主婦。耶穌說，馬利亞已經選擇了上好的，就是選擇了花時間來以祂為樂。我們越多花時間來認識上帝的美善，我們就會越以祂為樂。</p>"},{"day":3,"html":"<p>活出上帝創造我們時所設計的目的，有一個好處，就是不管我們周圍發生什麼事情，我們都能夠以上帝為樂。如果我為了交朋友而活，為了讓朋友高興而活，那麼當朋友不在的時候，我就沒有什麼活下去的動力了。如果我為了美貌和健康而活，那麼一旦我老了、病了，我就沒有了活下去的理由。如果我活著就是為了賺錢買東西，一旦有個三長兩短，讓我傾家蕩產，那我該怎麼辦呢？</p><p>舊約中有位上帝的先知，名叫哈巴谷。哈巴谷生活在耶路撒冷，他和鄰居們都有舒適的家，一派太平景象。哈巴谷活著，就是為了榮耀上帝、以祂為樂。可是他的鄰居們，活著就是為了滿足自己。因為哈巴谷是個先知，上帝告訴他將要發生的事情。敵人的軍隊在一場戰爭中毀滅耶路撒冷。敵軍會燒燬那些舒適的房屋，哈巴谷和他的鄰居們將一無所有。當然，哈巴谷也不是盼著傾家蕩產。不過，因為他的目的不是為了以物質為樂，而是以上帝為樂，讓我們聽聽他想說什麼。讀哈巴谷書 3:16-18。</p><blockquote><p><strong>哈巴谷書 3:16-18</strong><br>我聽見耶和華的聲音，身體戰兢，嘴唇發顫，骨中朽爛。我在所立之處戰兢。我只可安靜等候災難之日臨到，犯這民的人上來。雖然無花果樹不發旺，葡萄樹不結果，橄欖樹也不效力，田地不出糧食，圈中絕了羊，棚內也沒有牛。然而我要因耶和華歡欣，因救我的神喜樂。</p></blockquote>"},{"day":4,"html":"<p>上帝創造萬物，為了榮耀祂自己。意思是說，祂創造萬物，是為了顯明他是何等美善。現在，許多人對於上帝的榮耀知之不多，還有人知道上帝的事，卻不願意承認祂的美善。但是上帝應許，有一天全世界每一個人都會認識祂偉大的榮耀。讀哈巴谷書 2:14。</p><blockquote><p><strong>哈巴谷書 2:14</strong><br>認識耶和華榮耀的知識，要充滿遍地，好像水充滿洋海一般。</p></blockquote><p>儘管有些人不願明白這一點，不過每一個受造物被造，都是向我們顯明上帝榮耀的某個方面，為了向我們顯明上帝是什麼樣的。讀詩篇 104:31 和詩篇 19:1。</p><blockquote><p><strong>詩篇 104:31</strong><br>願耶和華的榮耀存到永遠。願耶和華喜悅自己所造的。</p><p><strong>詩篇 19:1</strong><br>諸天述說神的榮耀，穹蒼傳揚他的手段。</p></blockquote><p>當你仰望夜空中的點點繁星，你有何想法？當你看到屹立千萬年的巍巍高山，你如何看待那位造它們的上帝呢？</p><p>上帝的創造榮耀祂。受造的萬物顯明上帝的本性。我們也是上帝造的。上帝的目的就是要我們也榮耀祂。</p>"},{"day":5,"html":"<p>我們可以用哪些方式來榮耀上帝呢？我們如何能顯明他的美善呢？一種方式是讚美敬拜他。讀詩篇 29:2 和詩篇 50:23 上。</p><blockquote><p><strong>詩篇 29:2</strong><br>要將耶和華的名所當得的榮耀歸給他。以聖潔的妝飾敬拜耶和華。</p><p><strong>詩篇 50:23 上</strong><br>凡以感謝獻上為祭的，便是榮耀我。</p></blockquote><p>耶穌說我們透過我們的好行為來榮耀上帝。上帝是良善的、慈愛的、聖潔的。當我們的行為良善、慈愛、聖潔的時候，我們就是在向人們顯明上帝的本性。讀馬太福音 5:16。</p><blockquote><p><strong>馬太福音 5:16</strong><br>你們的光也當這樣照在人前，叫他們看見你們的好行為，便將榮耀歸給你們在天上的父。</p></blockquote><p>聖經告訴我們無論做什麼事情，就算是最簡單、最普通的事情，也要以榮耀上帝的方式來做。讀哥林多前書 10:31。</p><blockquote><p><strong>哥林多前書 10:31</strong><br>所以你們或吃或喝，無論作什麼，都要榮耀神而行。</p></blockquote>"},{"day":6,"html":"<p>一件怪事發生在伯沙撒的父親身上。伯沙撒的父親統治著當時世界上最大的國家。他為自己的國家非常自豪。上帝警告伯沙撒的父親，如果他不因著他的國家把榮耀歸給上帝，上帝就要把這國家從他手中奪走。伯沙撒的父親繼續驕傲下去，他的國家就照著上帝曾說過的，從他手中奪走七年。不僅如此，國王自己也像野獸那樣生活了七年。七年結束的時候，伯沙撒的父親重新得回了理智，也得回了國家。這時，他開始榮耀上帝了。</p><p>你或許以為，伯沙撒肯定從父親的經歷學到了教訓吧。你或許以為，他應該明白他活著的目的不是為了滿足自己，也不是為了作一個了不起的國王，而是把榮耀歸給上帝。可是伯沙撒卻沒有吸取教訓，他作王的時候，他就為了自己的快活活著。他使用上帝聖殿裡的酒杯來縱酒狂歡。一天晚上，在他的宴會中間，突然不知在哪裡出來一隻手，在伯沙撒王宮的牆上寫字。伯沙撒大驚失色，打發人叫了上帝的先知但以理來，讓他解釋那些字的意思。但以理提醒伯沙撒發生在他父親身上的事情。</p><p>讀但以理書 5:22-23，但以理還對他說了什麼。就在那天晚上，敵軍進犯，殺死了伯沙撒，佔領了他的國家。上帝創造我們，就是要我們把榮耀歸給祂，而不是歸給我們自己。</p><blockquote><p><strong>但以理書 5:22-23</strong><br>伯沙撒啊，你是他的兒子，你雖知道這一切，你心仍不自卑，竟向天上的主自高，使人將他殿中的器皿拿到你面前，你和大臣、皇后、妃嬪用這器皿飲酒。你又讚美那不能看、不能聽、無知無識、金、銀、銅、鐵、木、石所造的神，卻沒有將榮耀歸於那手中有你氣息，管理你一切行動的神。</p></blockquote>"}]},{"num":2,"title":"上帝賜下什麼準則，指教我們如何榮耀祂、以祂為樂？","answer":"上帝的道記載於新舊約聖經，就是唯一的準則，指教我們如何榮耀祂、以祂為樂。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"intro","days":[{"day":1,"html":"<p>我們的主要目的是榮耀上帝，以祂為樂。不過我們怎麼做呢？我們從哪裡可以瞭解達到這個目的的方法呢？真正知道如何榮耀上帝的，只有一位，就是上帝自己。只有祂能夠告訴我們如何來榮耀祂。</p><p>上帝本來可以用任何祂願意的方式跟我們說話。他已經選擇藉著祂的道——聖經——來跟我們說話。我們為了榮耀上帝、以祂為樂，所需要知道的一切都可以在聖經中找到。關於如何榮耀上帝，如果我們問別人的意見，或者我們在聖經以外的書裡面找答案，我們都無法肯定地得到正確的資訊。不過，我們可以信賴聖經，因為聖經是上帝的道，上帝從來不會錯。請讀提摩太後書 3:16-17。</p><blockquote><p><strong>提摩太後書 3:16-17</strong><br>聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義，都是有益的。叫屬神的人得以完全，預備行各樣的善事。</p></blockquote>"},{"day":2,"html":"<p>聖經是一本奇妙的書。聖經包括人們給朋友寫的書信，有歌曲，有故事，有詩歌。還有法律、講章和預言（千百個預言都已經應驗了）。寫作聖經的作者很多，包括國王、漁夫、農夫還有醫生。這些人寫的，都是照著上帝所吩咐的，因為有聖靈引導他們。請讀彼得後書 1:20-21。</p><blockquote><p><strong>彼得後書 1:20-21</strong><br>第一要緊的，該知道經上所有的預言，沒有可隨私意解釋的。因為預言從來沒有出於人意的，乃是人被聖靈感動說出神的話來。</p></blockquote>"},{"day":3,"html":"<p>上帝首先把書面形式的道賜給了以色列人。他們正在離開為奴之地的埃及，前往上帝應許的土地。上帝在西奈山迎見他們。祂把十誡寫在兩塊石版上交給摩西。他還賜給摩西許多其它的律法和教訓，摩西都一一記下了。儘管與我們現在手頭的聖經相比，那些只是一小部分，不過以色列人知道，能夠閱讀並儲存上帝的道，是何等美好的特權啊。請讀申命記 4:5-8。</p><blockquote><p><strong>申命記 4:5-8</strong><br>我照著耶和華我神所吩咐的將律例典章教訓你們，使你們在所要進去得為業的地上遵行。所以你們要謹守遵行。這就是你們在萬民眼前的智慧，聰明。他們聽見這一切律例，必說，這大國的人真是有智慧，有聰明。哪一大國的人有神與他們相近，像耶和華我們的神，在我們求告他的時候與我們相近呢，哪有一大國有這樣公義的律例典章，像我今日在你們面前所陳明的這一切律法呢。</p></blockquote><p>上帝跟我們是天壤之別，我們根本無法自己發現上帝。他必須告訴我們，祂是怎樣的上帝，我們應當如何榮耀祂，否則我們將永遠無法知道。上帝真好！祂把祂的道藉著聖經賜給我們，讓我們可以認識祂、得祂的喜悅。請讀申命記 29:29。</p><blockquote><p><strong>申命記 29:29</strong><br>隱秘的事是屬耶和華我們神的。惟有明顯的事是永遠屬我們和我們子孫的，好叫我們遵行這律法上的一切話。</p></blockquote>"},{"day":4,"html":"<p>我們擁有的很多東西很重要，不過如果迫不得已的話，也可以沒有。上帝的道是那麼重要，我們決不能沒有它。如果沒有上帝的道，我們就只能想象上帝是怎樣的，那麼我們肯定會弄錯。如果沒有上帝的道，我們就只能猜想如何活得有智慧，如何辨別是非——每個人的猜想都將另一個人不一樣！在上帝給我們的所有禮物中，聖經是最好的禮物之一。懇求上帝賜你感恩的心，來體會祂的聖道的價值。請讀詩篇 119:97-105。</p><blockquote><p><strong>詩篇 119:97-105</strong><br>我何等愛慕你的律法，終日不住地思想。你的命令常存在我心裡，使我比我的師傅更通達。因思想的法度。我比年老的更明白，因我守了你的訓詞。我禁止我腳走一切的邪路，為要遵守你的話。我沒有偏離你的典章，因為你教訓了我。你的言語，在我上膛何等甘美。在我口中比蜜更甜。我藉著你的訓詞，得以明白。所以我恨一切的假道。你的話是我腳前的燈，是我路上的光。</p></blockquote>"},{"day":5,"html":"<p>關於如何榮耀上帝、以祂為樂，聖經是唯一的準則。意思是說聖經有最終的權威；它總是正確的。如果一個人或者一本書所說的，與聖經所說的不一樣，那麼就是那個人或那本書錯了。聖經總是對的。那是因為，聖經出於永不失誤、永不犯錯的上帝。使徒保羅寫道，如果有人教導的跟聖經不一樣——就算那位是天上來的使者——他就當受咒詛！請讀加拉太書 1:8。</p><blockquote><p><strong>加拉太書 1:8</strong><br>但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。</p></blockquote><p>就是應該如此尊重上帝的道，它是高於一切、重於一切。</p><p>上帝命令人們不可篡改祂的道。人不可加添，也不可刪減。請讀申命記 4:2。</p><blockquote><p><strong>申命記 4:2</strong><br>所吩咐你們的話，你們不可加添，也不可刪減，好叫你們遵守我所吩咐的，就是耶和華你們神的命令。</p></blockquote><p>對於那些以自己的教導來假冒上帝的道的，上帝十分憤怒。請讀耶利米書 23:31-32。</p><blockquote><p><strong>耶利米書 23:31-32</strong><br>耶和華說，那些先知用舌頭，說是耶和華說的。我必與他們反對。耶和華說，那些以幻夢為預言，又說這夢，以謊言和誇誇使我百姓走錯了路的，我必與他們反對。我沒有打發他們，也沒有吩咐他們。他們與這百姓毫無益處。這是耶和華說的。</p></blockquote>"},{"day":6,"html":"<p>儘管上帝命令人們不可加添、刪減祂的道，可是有人還是這樣做了。有人口稱「上帝說」，然後就開始講一些上帝根本沒說過的東西！有時候，就連講道人也會講出關於上帝的不實之言。因此一定要弄清楚，人們說的是在聖經裡的，真的是在聖經裡。在新約時代，庇哩亞城的人們查考使徒保羅所說的一切話，看看是否合乎聖經。請讀使徒行傳 17:10-11。</p><blockquote><p><strong>使徒行傳 17:10-11</strong><br>弟兄們，隨即在夜間打發保羅和西拉往庇哩亞去。二人到了，就進入猶太人的會堂。這地方的人，賢於帖撒羅尼迦的人，甘心領受這道，天天考查聖經，要曉得這道，是與不是。</p></blockquote><p>因為聖經是上帝的道，我們應該高度重視它。我們不可以與聖經辯論。相反，我們必須好好研究，來了解它，也來尊敬它，並且順服它所說的。請讀帖撒羅尼迦前書 2:13。</p><blockquote><p><strong>帖撒羅尼迦前書 2:13</strong><br>為此，我們也不住的感謝神，因你們聽見我們所傳神的道，就領受了，不以為是人的道，乃以為是神的道。這道實在是神的，並且執行在你們信主的人心中。</p></blockquote>"}]},{"num":3,"title":"聖經主要的教導是什麼？","answer":"聖經主要的教導是：人對於上帝所當信的真理，以及上帝要人所當盡的本分。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"intro","days":[{"day":1,"html":"<p>想象一下，有一位畫家，他已經默默地工作了幾個月，創作他最偉大的作品。大家都急切地想看他的作品。終於，畫家按計劃展示他的畫作的日子來到了。在恰當的時刻，有人揭開蒙在作品上的布，大家就看到了那幅畫。原來隱藏著的東西，現在顯明瞭。</p><p>其實，啟示的意思就是，把原來隱藏的東西顯明出來。聖經啟示了上帝是怎樣的上帝，以及祂對人的要求。請讀哥林多前書 2:7-12。</p><blockquote><p><strong>哥林多前書 2:7-12</strong><br>我們講的，乃是從前所隱藏、神奧秘的智慧，就是神在萬世以前預定使我們得榮耀的。<br>這智慧，世上有權有位的人沒有一個知道的；他們若知道，就不把榮耀的主釘在十字架上了。<br>如經上所記：「神為愛他的人所預備的，是眼睛未曾看見，耳朵未曾聽見，人心也未曾想到的。」<br>只有神藉著聖靈向我們顯明瞭，因為聖靈參透萬事，就是神深奧的事也參透了。<br>除了在人裡頭的靈，誰知道人的事？像這樣，除了神的靈，也沒有人知道神的事。<br>我們所領受的，並不是世上的靈，乃是從神來的靈，叫我們知道神開恩賜給我們的事。</p></blockquote><p>第七節說，原來所隱藏的是什麼？在第十一節，只有誰能知道上帝的意念？在第十節中看一看，我們如何能夠知道上帝的意念以及祂隱藏的智慧呢？</p>"},{"day":2,"html":"<p class=\"read-prompt\">請讀約伯記 11:7 和羅馬書 11:33。</p><blockquote><p><strong>約伯記 11:7</strong><br>你考察，就能測透神麼？你豈能盡情測透全能者麼？</p><p><strong>羅馬書 11:33</strong><br>深哉！神豐富的智慧和知識。他的判斷何其難測！他的蹤跡何其難尋！</p></blockquote><p>我們要是想知道上帝是怎樣的，必須由上帝來啟示祂自己。上帝比我們大多了，我們自己永遠無法認識祂。祂比我們能想象得到的任何事物都美好。如果讓我們自己來，我們將永遠不會認識上帝。對於上帝的知識將永遠隱藏。上帝是慈愛良善的。祂想要我們認識祂，我們好來愛祂、以祂為樂。於是上帝給我們聖經，告訴我們所有關於祂的事情，若非如此我們將無法知道這些事。</p><p>知道聖經說什麼，這很重要。其中一個原因就是，這樣的話，我們才會相信關於上帝的真理。許多人——甚至一些基督徒——相信的是關於上帝的不正確的想法。要確保我們對於上帝的信仰正確，唯一的方式就是，要確保我們關於上帝的信仰必須僅僅來自於聖經。</p>"},{"day":3,"html":"<p>上帝在千百年的時間裡，把祂的道一部分一部分地賜給我們。我們把上帝話語的第一個部分稱作律法書。在這首先的五卷書中，上帝對於自己的屬性有一些啟示，他也賜下律法，顯明祂要人們做什麼。在聖經的第一個部分，有許多的律法，那些律法很難守，我們當中誰也沒有辦法一樣不差地順服，連一天都不能。這是因為，我們裡面都是罪惡的——我們很自然地想要用自己的方式來做事，不喜歡上帝的方式。在祂賜下律法的時候，上帝知道我們是罪人，我們不能守住律法。那麼祂還賜我們律法做什麼呢？</p><p>一直以來，上帝都計劃要賜下祂的兒子，來把祂的百姓從罪惡中拯救出來。但是祂知道，祂的百姓不會相信自己需要一位救主，除非他們明白自己有多麼罪孽深重。藉著賜給我們的完全、聖潔的律法，祂向我們顯明，我們靠自己得祂的喜悅是不可能的。請讀羅馬書 7:7。</p><blockquote><p><strong>羅馬書 7:7</strong><br>這樣，我們可說什麼呢？律法是罪麼？斷乎不是。只是非因律法，我就不知何為罪。非律法說，不可起貪心。我就不知何為貪心。</p></blockquote><p>保羅怎麼知道自己貪心是錯的呢？請讀加拉太書 3:22。</p><blockquote><p><strong>加拉太書 3:22</strong><br>但聖經把眾人都圈在罪裡，使所應許的福因信耶穌基督，歸給那信的人。</p></blockquote><p>這節經文說，聖經告訴我們眾人都是怎樣的人？這節經文還解釋了這一點的原因是什麼。那麼原因是什麼呢？</p>"},{"day":4,"html":"<p>聖經告訴我們上帝的屬性。聖經啟示我們的主要方式就是，向我們顯明上帝的兒子，耶穌基督，祂是誰，祂為祂的百姓做了什麼。聖經是千百年的時間裡，藉著許多人寫成的。因為上帝告訴他們要寫的東西，所以他們寫的都是同樣至關重要的真理：上帝藉著祂的兒子為祂的百姓提供救恩。這是整本聖經的主題。舊約盼望要來的救主；新約回顧已來的救主。請讀提摩太後書 3:15。</p><blockquote><p><strong>提摩太後書 3:15</strong><br>並且知道你是從小明白聖經。這聖經能使你因信基督耶穌有得救的智慧。</p></blockquote><p>這節經文說，聖經可以讓你得智慧。那種智慧會帶給你什麼結果？請讀約翰福音 5:39。</p><blockquote><p><strong>約翰福音 5:39</strong><br>你們查考聖經。你們以為內中有永生。給我作見證的就是這經。</p></blockquote><p>這節經文中的話，是耶穌說的。他說聖經給誰作見證？講述的是誰呢？</p><p>約翰是上帝使用的聖經作者之一。請讀約翰福音 20:31。</p><blockquote><p><strong>約翰福音 20:31</strong><br>但記這些事，要叫你們信耶穌是基督，是神的兒子。並且叫你們信了他，就可以因他的名得生命。</p></blockquote><p>看看他為什麼要記他所記的這些事呢？</p>"},{"day":5,"html":"<p>首先，聖經向我們顯明，關於上帝我們應當信什麼。其次，聖經向我們顯明，祂對我們有什麼要求，幫助我們看到，我們永遠無法達到祂的要求；我們需要一位救主！聖經向我們顯明那位救主是誰（耶穌），祂為拯救我們做了什麼，上帝對我們有何要求（我們當信耶穌）。最後，上帝向已經信耶穌的百姓顯明，祂對他們的要求——不是為了得救，而是為了顯明他們因為得救是何等的感恩。我們一旦信了耶穌，我們就不敢去做讓祂不喜悅的事情，因為我們如此愛祂。開始瞭解聖經，瞭解聖經告訴我們的生活方式，這是保證我們活得讓耶穌喜悅的最好方式。請讀詩篇 119:9, 11。</p><blockquote><p><strong>詩篇 119:9</strong><br>少年人用什麼潔淨他的行為呢。是要遵行你的話。</p><p><strong>詩篇 119:11</strong><br>我將你的話藏在心裡，免得我得罪你。</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀馬太福音 7:24-27。</p><blockquote><p><strong>馬太福音 7:24-27</strong><br>所以凡聽見我這話就去行的，好比一個聰明人，把房子蓋在磐石上。雨淋，水衝，風吹，撞著那房子，房子總不倒塌。因為根基立在磐石上。凡聽見我這話不去行的，好比一個無知的人，把房子蓋在沙土上。雨淋，水衝，風吹，撞著那房子，房子就倒塌了。並且倒塌得很大。</p></blockquote><p>誰像是把房子蓋在磐石上的人？誰像是把房子蓋在沙土上的人？瞭解上帝的道所說的，但卻不去遵行，是很無知的。</p><p>如果我們認識耶穌，也愛耶穌，那麼祂要我們做什麼，我們都會願意遵行。想要知道祂要我們做什麼，怎麼做，我們就得了解聖經。關於上帝是誰，祂對我們有什麼要求，這些我們需要知道的事情，聖經都會告訴我們的。請讀提摩太後書 3:16-17。</p><blockquote><p><strong>提摩太後書 3:16-17</strong><br>聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義，都是有益的。叫屬神的人得以完全，預備行各樣的善事。</p></blockquote>"}]},{"num":4,"title":"上帝是怎樣的上帝？","answer":"上帝是靈。他的本體、智慧、權能、聖潔、公義、良善、真實，都是無限無量、無始無終、永不改變的。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-1","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀約翰福音 4:24。</p><blockquote><p><strong>約翰福音 4:24</strong><br>神是個靈，所以拜他的，必須用心靈和誠實拜他。</p></blockquote><p>上帝是什麼？</p><p class=\"read-prompt\">請讀提摩太前書 1:17。</p><blockquote><p><strong>提摩太前書 1:17</strong><br>但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！</p></blockquote><p>上帝是看得見的嗎？</p><p>上帝是靈。祂沒有身體，是看不到的。上帝與宇宙裡的所有人、物都不同。拿一點來說吧，只有上帝不是被造的。上帝創造了這世上曾存在的每一個人、每一樣東西。只有上帝是一直就有的。祂是永遠存在的。意思是說，祂沒有開始，也沒有終結。請讀詩篇 102:24下-27。</p><blockquote><p><strong>詩篇 102:24下-27</strong><br>你的年數世世無窮。你起初立了地的根基，天也是你手所造的。天地都要滅沒，你卻要長存；天地都要如外衣漸漸舊了，你要將天地如衣更換，天地就都改變了。惟有你永不改變，你的年數沒有窮盡！</p></blockquote><p>上帝也是無限的。無限的意思是，沒有限量。人是有限的；他們有限量。人能做許多事，但是他們所做的總會有限度。上帝無所不能：祂的能力無限大。人侷限於同時只能在一個地方。上帝是無限的：祂同一時間無所不在。當所羅門王為上帝建成宏偉的聖殿時，他知道一座建築物無法容納上帝的全部，於是他如此禱告。請讀列王記上 8:27。</p><blockquote><p><strong>列王記上 8:27</strong><br>神果真住在地上嗎？看哪！天和天上的天，尚且不足你居住的，何況我所建的這殿呢？</p></blockquote><p>上帝是不改變的。祂不會比現在更好一些，因為祂已經是完美的了。祂不會比現在更不好或者更渺小，否則祂就不是上帝了。請讀瑪拉基書 3:6。</p><blockquote><p><strong>瑪拉基書 3:6</strong><br>因我耶和華是不改變的，所以你們雅各之子沒有滅亡。</p></blockquote>"},{"day":2,"html":"<p class=\"read-prompt\">請讀羅馬書 11:33 和詩篇 147:5。</p><blockquote><p><strong>羅馬書 11:33</strong><br>深哉，神豐富的智慧和知識。他的判斷何其難測！他的蹤跡何其難尋！</p><p><strong>詩篇 147:5</strong><br>我們的主為大，最有能力。他的智慧無法測度！</p></blockquote><p>說到上帝的智慧如何？無限的意思是沒有限量。上帝的智慧是無限的。智慧，就是在任何環境中知道最好的辦法，實行最好的辦法。因為上帝無所不知，祂總是知道什麼是最好的，那也就是祂所做的。因為上帝的智慧無限，我們可以信靠祂告訴我們的，相信這就是我們能夠做的最明智的事。我們可以照著祂告訴我們的去做，相信這就是我們能夠做的最明智的事。</p><p>因為上帝的智慧無限、永恆、不變，我們就知道祂的話語——聖經——就是真理。聖經上說的一切都是絕對真實的。請讀詩篇 19:7-9。</p><blockquote><p><strong>詩篇 19:7-9</strong><br>耶和華的律法全備，能甦醒人心；耶和華的法度確定，能使愚人有智慧；耶和華的訓詞正直，能快活人的心；耶和華的命令清潔，能明亮人的眼目；耶和華的道理潔淨，存到永遠；耶和華的典章真實，全然公義。</p></blockquote>"},{"day":3,"html":"<p class=\"read-prompt\">請讀以賽亞書 40:25-26。</p><blockquote><p><strong>以賽亞書 40:25-26</strong><br>那聖者說：「你們將誰比我，叫他與我相等呢？你們向上舉目，看誰創造這永珍，按數目領出，他一一稱其名，因他的權能，又因他的大能大力，連一個都不缺。」</p></blockquote><p>為什麼連一個星星也不缺？是什麼保護他們不從天際墜落呢？</p><p>上帝無限的能力托住了所有受造之物。祂的能力是永恆的——它一直如此，永不會耗盡，永不會衰弱。上帝的能力是不改變的。祂無所不能，所以祂不會比現在更有能力。祂的能力無限——什麼也不能限制它。請讀耶利米書 32:17。</p><blockquote><p><strong>耶利米書 32:17</strong><br>主耶和華啊，你曾用大能和伸出來的膀臂創造天地，在你沒有難成的事。</p></blockquote><p>這節經文告訴我們，什麼事情對於上帝來說是難成的呢？</p><p class=\"read-prompt\">請讀但以理書 4:35。</p><blockquote><p><strong>但以理書 4:35</strong><br>世上所有的居民，都算為虛無。在天上的萬軍和世上的居民中，他都憑自己的意旨行事。無人能攔住他手，或問他說：「你做什麼呢？」</p></blockquote><p>根據這節經文，誰能攔住上帝，不讓祂做祂要做的事呢？</p>"},{"day":4,"html":"<p>先知以賽亞看見了天上的異象。他看見撒拉弗，或者說天使，環繞在上帝的寶座旁邊，不住地讚美上帝。請讀以賽亞書 6:3。</p><blockquote><p><strong>以賽亞書 6:3</strong><br>彼此呼喊說：「聖哉！聖哉！聖哉！萬軍之耶和華，他的榮光充滿全地！」</p></blockquote><p>找出天使重複了三遍來描述上帝的詞語。</p><p class=\"read-prompt\">請讀啟示錄 15:4。</p><blockquote><p><strong>啟示錄 15:4</strong><br>主啊，誰敢不敬畏你，不將榮耀歸與你的名呢？因為獨有你是聖的，萬民都要來在你面前敬拜，因你公義的作為已經顯出來了。</p></blockquote><p>為什麼所有人都將敬畏上帝，榮耀祂的名？</p><p>上帝是絕對聖潔的。祂的思想、言語、行為絕無任何罪惡。上帝的本性和作為，都是良善、正確、完美的。請讀約翰一書 1:5。</p><blockquote><p><strong>約翰一書 1:5</strong><br>神就是光，在他毫無黑暗！這是我們從主所聽見、又報給你們的資訊。</p></blockquote><p>上帝不僅自己從不犯罪，他也恨惡在受造界中一切的罪惡。在聖經中，「聖」這個字比任何其它的字更多地用來描述上帝。上帝在祂的聖潔方面是永恆、無限、不變的。</p>"},{"day":5,"html":"<p>一名警察看到發生搶劫卻無動於衷，那可是一個嚴重的問題。一名法官任憑殺人犯逍遙法外，那也是一個嚴重的問題。上帝如果忽視罪惡，那上帝就不是上帝了。上帝恨惡罪惡，總要懲罰它。現在，我們看到周圍發生許多可怕的事情。每一天，新聞裡都充斥著人犯罪傷害人、得罪上帝的事情。有時候，關於犯罪和仇恨的新聞，連我們都會憂傷。但是詩篇 96:11-13 給了我們一個歡慶快樂的理由。那是什麼？</p><blockquote><p><strong>詩篇 96:11-13</strong><br>願天歡喜，願地快樂！願海和其中所充滿的澎湃！願田和其中所有的都歡樂！那時林中的樹木都要在耶和華面前歡呼。因為他來了，他來要審判全地。他要按公義審判世界，按他的信實審判萬民。</p></blockquote><p>聖經使我們確信，上帝是公義的上帝。祂不會永遠任憑罪惡橫行。當耶穌再來的時候，所有作惡的，不管是已經死了的，還是當時在世的，都要受審判，遭受自己罪行所應得的。請讀彼得後書 2:9。</p><blockquote><p><strong>彼得後書 2:9</strong><br>主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子。</p></blockquote><p>上帝的公義是無限、永恆、不變的。人類最好的警察和法官也會時而犯錯，因為他們不能看到發生的一切，總有他們不知道的秘密。上帝看見一切，知道一切的秘密。就連我們做事時的想法和感受，祂都能判斷，因為祂能看透我們的心。</p>"},{"day":6,"html":"<p>如果上帝是聖潔、恨惡罪惡，如果祂審判懲罰一切罪惡，那麼我們有大麻煩了。我們每個人每天都犯罪。我們中間沒有人想要面對上帝的審判和懲罰。</p><p>但是上帝在祂的良善上也是無限、永恆、不變的。這可不是說上帝只是對人好而已。因為上帝的良善，雖然祂的百姓是不配的罪人，祂還是一直為他們的益處而執行萬事。請讀詩篇 86:5。</p><blockquote><p><strong>詩篇 86:5</strong><br>主啊，你本為良善，樂意饒恕人，有豐盛的慈愛，賜給凡求告你的人。</p></blockquote><p>上帝的良善使祂願意赦免。祂是聖潔的，不能對我們的罪視而不見，但是因為祂無限的良善，祂賜下祂的兒子，替我們受刑罰。凡信靠耶穌的人，都將免於上帝公義的審判，反而得著祂的賜福。請讀詩篇 34:8。</p><blockquote><p><strong>詩篇 34:8</strong><br>你們要嚐嚐主恩的滋味，便知道他是美善；投靠他的人有福了！</p></blockquote><p>你們要讚美耶和華！要稱謝耶和華，因他本為善，他的慈愛永遠長存！（詩篇 106:1）</p>"}]},{"num":5,"title":"上帝是獨一的嗎？","answer":"上帝是獨一無二、又真又活的。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-1","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀申命記 6:4。</p><blockquote><p><strong>申命記 6:4</strong><br>以色列啊，你要聽！耶和華我們神是獨一的主。</p></blockquote><p>當人類的先祖被造的時候，他們知道只有一位上帝。但是先祖犯了罪，把罪傳遞給兒女，這樣每個人從生下來就有了罪性。因為人們有罪，他們不願意相信有一位要求他們如何生活的聖潔上帝。於是，在遠古的歷史中間，人們開始製造自己的假神，它們不像獨一真神那麼聖潔，也比較容易和諧共處。不過，只有一位上帝，沒有一位像祂的。請讀以賽亞書 45:18, 22。</p><blockquote><p><strong>以賽亞書 45:18</strong><br>創造諸天的耶和華，製造成全大地的神，他創造堅定大地，並非使地荒涼，是要給人居住。他如此說：「我是耶和華，再沒有別神！</p><p><strong>以賽亞書 45:22</strong><br>地極的人都當仰望我，就必得救。因為我是神，再沒有別神！</p></blockquote>"},{"day":2,"html":"<p>縱觀歷史，人們一直敬拜上帝所造的，卻不拜上帝。人們常常用金銀木頭製作雕像，來代表他們所拜的假神。這些雕像叫做偶像。在舊約時代，幾乎世上所有的人都拜偶像。上帝把以色列民族分別出來作祂自己特別的百姓，要他們敬拜祂，永不可拜偶像。詩篇115對比了以色列的上帝與鄰國的偶像。請讀詩篇 115:1-8。</p><blockquote><p><strong>詩篇 115:1-8</strong><br>耶和華啊，榮耀不要歸與我們，不要歸與我們，<br>要因你的慈愛和誠實歸在你的名下！<br>為何容外邦人說：<br>「他們的神在哪裡呢？」<br>然而我們的神在天上，<br>都隨自己的意旨行事。<br>他們的偶像是金的銀的，<br>是人手所造的，<br>有口卻不能言，<br>有眼卻不能看，<br>有耳卻不能聽，<br>有鼻卻不能聞，<br>有手卻不能摸，<br>有腳卻不能走，<br>有喉嚨也不能出聲。<br>造他的要和他一樣，<br>凡靠他的也要如此。</p></blockquote><p>列舉一下，這詩篇提到偶像不能做的事有哪些。第三節說上帝能夠做什麼？</p>"},{"day":3,"html":"<p>上帝呼召了以色列人作祂的選民。祂命令他們建造會幕，在那裡，他們要來敬拜上帝。在會幕裡有約櫃，就是放十誡的櫃子。有時候上帝命令以色列人抬著約櫃，伴隨他們打仗，這是要提醒他們，上帝與他們同在。有一次以色列人被敵人非利士人打敗了。原因就是他們當時生活敗壞，拒絕順服上帝。當非利士人打敗他們的時候，以色列人本該轉離他們邪惡的生活方式。可是，他們卻以為只要帶著約櫃，就可以打贏下一場戰爭。</p><p>他們又去與非利士人爭戰，這一次帶著約櫃進入戰場。不過，上帝仍然沒有與他們同在，因為他們不順服上帝。非利士人又一次打敗以色列人，約櫃也成了他們的戰利品。非利士人大喜過望。他們以為這就證明他們的偶像大袞要比以色列的上帝厲害啊！他們把約櫃抬到他們的亞實突廟裡，放在大袞廟裡，作為戰利品來顯示大袞的偉大。請讀撒母耳記上 5:2-5 看看發生了什麼事。</p><blockquote><p><strong>撒母耳記上 5:2-5</strong><br>非利士人將神的約櫃抬進大袞廟，放在大袞的旁邊。次日清早，亞實突人起來，見大袞仆倒在耶和華的約櫃前，臉伏於地，就把大袞仍立在原處。又次日清早起來，見大袞仆倒在耶和華的約櫃前，臉伏於地，並且大袞的頭和兩手都在門檻上折斷，只剩下大袞的殘體。因此，大袞的祭司和一切進亞實突大袞廟的人，都不踏大袞廟的門檻，直到今日。</p></blockquote>"},{"day":4,"html":"<p>以色列人沒有一直忠心地敬拜獨一的真神。他們周圍的各國都有許多假神，他們常常學習他們鄰居的樣子。當亞哈作以色列王的時候，他和他的妻子耶洗別敬拜一個叫做巴力的偶像，使得以色列全國都來拜它。許多人仍繼續敬拜上帝，不過他們一邊敬拜上帝，一邊敬拜巴力。</p><p>真神的一位先知以利亞，向巴力的先知發起挑戰，要比試比試。（巴力先知有 450 人，他只有孤身一人！）以利亞聚集了以色列人和巴力的先知。他提議，他和巴力的先知各築一罈，在上面預備祭物。不過，他們都不可以在祭物上點火。他們要向他們各自的神禱告，哪個神回應禱告，從天降火燒掉祭物，那位就該被認作是真神。</p><p>巴力的先知開始了。請讀列王記上 18:26-29。看看他們做了什麼。</p><blockquote><p><strong>列王記上 18:26-29</strong><br>他們將所得的牛犢預備好了，從早晨到午間，求告巴力的名說：「巴力啊，求你應允我們！」卻沒有聲音，沒有應允的。他們在所築的壇四圍踴跳。到了正午，以利亞嘲笑他們說：「大聲求告吧！因為他是神，他或默想，或走到一邊，或行路，或睡覺，你們當叫醒他。」他們大聲求告，按著他們的規矩，用刀槍自割自刺，直到身體流血。從午後直到獻晚祭的時候，他們狂呼亂叫，卻沒有聲音，沒有應允的，也沒有理會的。</p></blockquote><p>巴力的先知為了得到巴力的回應，忙活了多長時間？結果怎樣？</p>"},{"day":5,"html":"<p>現在該輪到以利亞了。他在他築的壇旁邊挖了一道溝，讓人往祭物和柴上倒了四桶水。如此又倒了兩輪，直到水溢位祭壇，滿了溝渠。然後他禱告。請讀列王記上 18:37-39，看看發生了什麼事。</p><blockquote><p><strong>列王記上 18:37-39</strong><br>耶和華啊，求你應允我，應允我！使這民知道你耶和華是神，又知道是你叫這民的心迴轉。「於是，耶和華降下火來，燒盡燔祭、木柴、石頭、塵土，又燒乾溝裡的水。眾民看見了，就俯伏在地說：」耶和華是神！耶和華是神！「</p></blockquote><p>像以利亞一樣，耶利米也是獨一無二、又真又活的上帝的先知。他像以利亞一樣，他大力反對以色列人拜偶像。在耶利米書第十章，耶利米描述人們如何製造偶像。有個人砍樹，刻成偶像，然後用金銀來裝飾偶像。請讀耶利米書 10:5。關於偶像，這節經文怎麼說？</p><blockquote><p><strong>耶利米書 10:5</strong><br>它好像棕樹，是旋成的，不能說話，不能行走，必須有人抬著。你們不要怕它，它不能降禍，也無力降福。</p></blockquote><p class=\"read-prompt\">請讀耶利米書 10:6-7, 10。</p><blockquote><p><strong>耶利米書 10:6-7</strong><br>耶和華啊，沒有能比你的；你本為大，有大能大力的名！萬國的王啊，誰不敬畏你？敬畏你本是合宜的；因為在列國的智慧人中，雖有政權的尊榮，也不能比你。</p><p><strong>耶利米書 10:10</strong><br>惟耶和華是真神，是活神，是永遠的王！他一發怒，大地震動；他一癲憤，列國都擔當不起。</p></blockquote><p>列舉經文中對於上帝的描述。</p><p class=\"read-prompt\">請讀第十一節。</p><blockquote><p><strong>耶利米書 10:11</strong><br>「你們要對他們如此說：『不是那創造天地的神，必從地上從天下被除滅！』」</p></blockquote><p>偶像的未來如何？</p>"},{"day":6,"html":"<p>偶像崇拜——敬拜偶像——是過去的事嗎？請讀歌羅西書 3:5。</p><blockquote><p><strong>歌羅西書 3:5</strong><br>所以要治死你們在地上的肢體，就如淫亂、汙穢、邪情、惡欲和貪婪，貪婪就與拜偶像一樣。</p></blockquote><p>這節經文中把什麼叫做拜偶像？當人們想要更多更多的錢，更多更多的東西，他們就是貪婪。貪婪是一種拜偶像的形式，原因有二。第一，它使得錢和東西變成最重要的，而實際上上帝是最重要的。第二，貪婪的人倚賴錢財和東西來滿足他們的需要，而實際上只有上帝能夠滿足我們的需要。你以為，我們的社會中許多人是不是在拜偶像呢？</p><p class=\"read-prompt\">請讀帖撒羅尼迦前書 1:9。</p><blockquote><p><strong>帖撒羅尼迦前書 1:9</strong><br>因為他們自己已經報明我們是怎樣進到你們那裡，你們是怎樣離棄偶像，歸向神，要服事那又真又活的神。</p></blockquote><p>在這節經文中，保羅描述人們成為基督徒之後，發生什麼事？</p>"}]},{"num":6,"title":"上帝有幾個位格？","answer":"上帝有三位格：聖父、聖子、聖靈；這三位格就是同一真神，同本質，同權能，同榮耀。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-1","days":[{"day":1,"html":"<p>第五問告訴我們，上帝只有一位。但是我們從聖經中得知，天父是上帝，耶穌是上帝，聖靈是上帝。聽起來是不是彷彿有三位上帝啊？這周的問答告訴我們只有一位上帝，但是這位上帝有三個位格。這是上帝與人不同的一個方面。一個人就是一個人，一個位格。只有一個你，你只有一個位格。只有一位上帝，但是祂有三個位格。</p><p>你是不是發現這很難理解呢？不止你一人這樣想啊！教會中最聰明的基督徒，或者最優秀的聖經學者，也從來沒有完全理解上帝怎麼能是一位上帝卻有三個位格。別忘了，上帝是無限的。人類的思想是有限的。我們用我們有限的頭腦，來理解無限的上帝，也就只能到這個程度了。請讀約伯記 11:7-8。</p><blockquote><p><strong>約伯記 11:7-8</strong><br>你考察，就能測透神嗎？你豈能盡情測透全能者嗎？他的智慧高於天，你還能做什麼？深於陰間，你還能知道什麼？</p></blockquote><p>聖經一再地重申只有一位上帝。同時，聖經也告訴我們有三個位格——聖父、聖子、聖靈——每一位都是上帝。我們必須相信聖經上要求我們相信的，儘管我們不能完全理解。</p>"},{"day":2,"html":"<p>上帝三個位格中的第一位是聖父上帝。祂是耶穌的父，耶穌是聖子上帝。聖父也差聖靈到祂的百姓中間。請讀哥林多前書 8:6 上。</p><blockquote><p><strong>哥林多前書 8:6</strong><br>然而我們只有一位神，就是父，萬物都本於他，我們也歸於他；</p></blockquote><p>父的目的是為著自己的榮耀創造萬物（不過，聖子和聖靈也都參與了造物之工）。也是聖父上帝計劃，賜下救主，就是祂自己的愛子，替祂的百姓受死，把他們從罪惡中拯救出來。請讀約翰一書 4:14。</p><blockquote><p><strong>約翰一書 4:14</strong><br>父差子作世人的救主，這是我們所看見且作見證的。</p></blockquote>"},{"day":3,"html":"<p>上帝三個位格中的第二位是聖子上帝，或者說耶穌。聖子上帝是一直活著的。當祂在馬槽裡降生為嬰孩時，祂也取了人性。不過，那並不是祂生命的開始。祂作為上帝一直都是活著的。因為聖子降生為人，我們可以看見那看不見的上帝是怎樣的。（像我們這些人，耶穌在世時候還沒有我們，那我們可以透過閱讀關於祂的記載，這樣也可以明白上帝是什麼樣的。）請讀歌羅西書 1:15-16，看看聖子上帝，就是耶穌，祂創造了什麼。</p><blockquote><p><strong>歌羅西書 1:15-16</strong><br>愛子是那不能看見之神的像，是首生的，在一切被造的以先。因為萬有都是靠他造的，無論是天上的、地上的、能看見的、不能看見的，或是有位的、主治的、執政的、掌權的，一概都是藉著他造的，又是為他造的。</p></blockquote><p>昨天，我們已經看到聖父上帝計劃將祂的百姓從罪惡中拯救出來，使他們與自己和好。上帝藉著祂的兒子耶穌使祂的百姓與祂和好。請讀歌羅西書 1:19-20。</p><blockquote><p><strong>歌羅西書 1:19-20</strong><br>因為父喜歡叫一切的豐盛在他裡面居住。既然藉著他在十字架上所流的血成就了和平，便藉著他叫萬有，無論是地上的、天上的，都與自己和好了。</p></blockquote>"},{"day":4,"html":"<p>聖靈是上帝三位格里面的第三位。祂是由聖父與聖子差來的。聖靈也參與創造，祂是感動人寫下聖經的那一位。（就是說，祂引導作者，使他們寫出來的都是上帝的話）聖靈在上帝拯救祂百姓的工作中是非常主動的。祂是使人重生信靠耶穌的那一位。請讀約翰福音 3：3-5。</p><blockquote><p><strong>約翰福音 3: 3-5</strong><br>耶穌回答說：「我實實在在地告訴你：人若不重生，就不能見神的國。」尼哥底母說：「人已經老了，如何能重生呢？豈能再進母腹生出來嗎？」耶穌說：「我實實在在地告訴你：人若不是從水和聖靈生的，就不能進神的國。</p></blockquote><p>聖靈住在祂百姓的裡面，使他們越來越長成耶穌的樣式。請讀加拉太書 5:22-23。</p><blockquote><p><strong>加拉太書 5:22-23</strong><br>聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這樣的事，沒有律法禁止。</p></blockquote>"},{"day":5,"html":"<p>「同本質」是什麼意思呢？在過去這麼多年，人們對於上帝的三位格給出了不同的解釋。有人說，只有聖父是上帝，耶穌儘管非常特別，不與聖父同樣是上帝。「同本質」的意思是，三位格的每一位都是完全的上帝。聖子耶穌與上帝同為上帝。聖靈與聖父聖子一樣是完全的上帝。聖父、聖子、聖靈在權能和榮耀上是相同的。沒有哪一位比另外兩位更大、更配得敬拜。我們把聖父、聖子、聖靈作為上帝敬拜。</p><p>聖經告訴我們聖父是上帝，我們要敬拜他。請讀以弗所書 4:6 和約翰福音 4:23。</p><blockquote><p><strong>以弗所書 4:6</strong><br>一神，就是眾人的父，超乎眾人之上，貫乎眾人之中，也住在眾人之內。</p><p><strong>約翰福音 4:23</strong><br>時候將到，如今就是了。那真正拜父的，要用心靈和誠實拜他，因為父要這樣的人拜他。</p></blockquote>"},{"day":6,"html":"<p>上帝的兒子耶穌，完全是上帝。所有的榮耀和權柄都是祂的，祂配得我們的敬拜。請讀馬太福音 1:23 以及詩篇 2:10-12。</p><blockquote><p><strong>馬太福音 1:23</strong><br>說：「必有童女懷孕生子，人要稱他的名為以馬內利。」（以馬內利翻出來就是「神與我們同在」。）</p><p><strong>詩篇 2:10-12</strong><br>現在，你們君王應當省悟；你們世上的審判官該受管教！當存畏懼事奉耶和華，又當存戰兢而快樂。當以嘴親子，恐怕他發怒，你們便在道中滅亡，因為他的怒氣快要發作。凡投靠他的，都是有福的。</p></blockquote><p>聖靈也是完全的上帝，配得敬拜和讚美。請讀哥林多後書 3:17-18。</p><blockquote><p><strong>哥林多後書 3:17-18</strong><br>主就是那靈，主的靈在哪裡，那裡就得以自由。我們眾人既然敞著臉得以見主的榮光，好像從鏡子裡返照，就變成主的形狀，榮上加榮，如同從主的靈變成的。</p></blockquote>"}]},{"num":7,"title":"上帝的旨意是什麼？","answer":"上帝的旨意，就是祂永恆的目的，根據祂計劃的美意；藉此，祂為自己的榮耀，預定了一切將要發生的事。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-2","days":[{"day":1,"html":"<p>上帝所造的萬物都有目的。世上發生的萬事也有祂的目的：上帝的目的是要榮耀祂自己。在開始創造以前，上帝已經計劃了祂所造的萬物如何互相效力，這些事如何一起來給祂帶來榮耀。為了確保萬事都如所計劃的那樣成就，祂預定了，或者說提前命定了將要發生的一切事。我們把這些命令稱為上帝的旨意。</p><p class=\"read-prompt\">請讀詩篇 33:11。</p><blockquote><p><strong>詩篇 33:11</strong><br>耶和華的籌算永遠立定，他心中的思念萬代常存。</p></blockquote><p>我們經常制定計劃，又不得不改變計劃。我們可能計劃野餐，可是因為下雨不得不改變計劃。我們做計劃的時候，不知道會下雨。下不下雨是我們控制不了的事情。上帝從來不改變祂的計劃。沒有什麼事情會讓上帝大吃一驚，因為祂無所不知。沒有什麼事情在祂的掌控之外，因為祂是無所不能的。上帝的計劃是永恆的。祂的計劃基於祂永不改變的目的。</p>"},{"day":2,"html":"<p>上帝在所造的萬物及所發生的萬事中所定的目的，是彰顯祂的榮耀。藉著行作顯明祂美德的事，上帝彰顯祂的榮耀。上帝在哈巴谷書 2:14 告訴我們祂的目的是什麼。上帝也在以賽亞書 40:5 作出類似的應許。</p><blockquote><p><strong>哈巴谷書 2:14</strong><br>認識耶和華榮耀的知識，要充滿遍地，好像水充滿洋海一般。</p><p><strong>以賽亞書 40:5</strong><br>耶和華的榮耀必然顯現，凡有血氣的必一同看見。因為這是耶和華親口說的。</p></blockquote><p>在要理問答第一問中你學到什麼來著？人的主要目的是什麼？並非只有人這種受造物的目的是榮耀上帝。上帝創造萬物，都是為著彰顯祂的榮耀。</p>"},{"day":3,"html":"<p>所有受造物的目的都是歸榮耀給上帝。天和天上的星辰，榮耀上帝。請讀詩篇 19:1。</p><blockquote><p><strong>詩篇 19:1</strong><br>諸天述說神的榮耀。穹蒼傳揚他的手段。</p></blockquote><p>上帝創造祂的百姓，為著祂自己的榮耀。請讀以賽亞書 43:7。</p><blockquote><p><strong>以賽亞書 43:7</strong><br>就是凡稱我名下的人，我為自己的榮耀創造的，是我所做成、所造作的。</p></blockquote><p>上帝的百姓要將榮耀歸給他，在萬民中傳揚祂的榮耀。請讀詩篇 96:3, 8。</p><blockquote><p><strong>詩篇 96:3</strong><br>在列邦中述說他的榮耀，在萬民中述說他的奇事。</p><p><strong>詩篇 96:8</strong><br>要將耶和華的名所當得的榮耀歸給他，拿供物來進入他的院宇。</p></blockquote>"},{"day":4,"html":"<p>旨意是國王釋出的命令，國中人人都必須遵守。上帝是宇宙的君王。祂的旨意掌管其中的所有人和所有事物。就連上帝的仇敵也在執行祂的目的，儘管他們並不是有意地這樣做。</p><p>上帝創造萬有，或者說上帝命定了萬物的創造。請讀詩篇 148:1-12。</p><blockquote><p><strong>詩篇 148:1-12</strong><br>你們要讚美耶和華！從天上讚美耶和華，在高處讚美他。<br>他的眾使者都要讚美他，他的諸軍都要讚美他。<br>日頭、月亮，你們要讚美他！放光的星宿，你們都要讚美他！<br>天上的天和天上的水，你們都要讚美他！<br>願這些都讚美耶和華的名，因他一吩咐便都造成。<br>他將這些立定，直到永永遠遠。他定了命，不能廢去。<br>所有在地上的，大魚和一切深洋，<br>火與冰雹，雪和霧氣，成就他命的狂風，</p></blockquote><p>大山和小山，結果的樹木和一切香柏樹，野獸和一切牲畜、昆蟲和飛鳥，世上的君王和萬民，首領和世上一切審判官，少年人和處女，老年人和孩童，都當讚美耶和華！</p><p>上帝降旨讓祂的兒子掌管萬有。請讀詩篇2:6-8。</p><blockquote><p><strong>詩篇2:6-8</strong><br>說：「我已經立我的君在錫安我的聖山上了。」受膏者說，我要傳聖旨：耶和華曾對我說：「你是我的兒子，我今日生你。你求我，我就將列國賜你為基業，將地極賜你為田產。</p></blockquote><p>上帝也按照他的旨意命定了人們生活中發生的事情。尼布甲尼撒王七年之久喪失理智。請讀但以理書4:24，看看為什麼發生了這種事。</p><blockquote><p><strong>但以理書4:24</strong><br>王啊，講解就是這樣：臨到我主我王的事是出於至高者的命。</p></blockquote>"},{"day":5,"html":"<p>上帝預定——計劃並提前命定——所發生的萬事。如果沒有上帝的命令，什麼事情也不會發生。就連那些看上去與上帝的目的相反的事情——悲慘的事情和不好的事情——也都配合著祂的計劃。請讀以賽亞書45:6-7。</p><blockquote><p><strong>以賽亞書45:6-7</strong><br>從日出之地到日落之處，使人都知道除了我以外，沒有別神。我是耶和華！在我以外並沒有別神。我造光，又造暗；我施平安，又降災禍；造作這一切的是我耶和華。</p></blockquote><p>上帝預定人們未來的光景和作為。請讀耶利米書1:5。</p><blockquote><p><strong>耶利米書1:5</strong><br>我未將你造在腹中，我已曉得你；你未出母胎，我已分別你為聖；我已派你作列國的先知。</p></blockquote><p>上帝預定祂的百姓將信靠耶穌。請讀使徒行傳13:48。</p><blockquote><p><strong>使徒行傳13:48</strong><br>外邦人聽見這話，就歡喜，讚美神的道；凡預定得永生的人都信了。</p></blockquote><p>萬事發生，都因為上帝已經預定要發生，為要成全祂的目的。</p>"},{"day":6,"html":"<p class=\"read-prompt\">請讀以賽亞書46:9-10。</p><blockquote><p><strong>以賽亞書46:9-10</strong><br>你們要追念上古的事，因為我是神，並無別神；我是神，再沒有能比我的！我從起初指明末後的事，從古時言明未成的事說：我的籌算必立定，凡我所喜悅的，我必成就。</p></blockquote><p>有的人以為上帝預知未來，看見將要發生的事，然後據此作出計劃。聖經教導我們，上帝不僅僅知道將要發生什麼；祂也是那位促使它發生的那一位。聖經中到處都是預言。其中有許多都已經完全應驗了。上帝之所以能夠精確地告訴祂的先知們將來的事情，是因為祂將要使這些事發生。上帝命定要發生的事，就會發生，沒有什麼能阻止它。</p><p>有時候我們說，某些事情會發生的，比如「我們隊會贏的」或者「我再也不那麼幹了！」我們說的話有可能發生，也有可能不發生。上帝的話有權柄，每當祂說話，都會實際地促使事情發生。請讀以賽亞書55:10-11。</p><blockquote><p><strong>以賽亞書55:10-11</strong><br>雨雪從天而降，並不返回，卻滋潤地土，使地上發芽結實，使撒種的有種，使要吃的有糧。我口所出的話也必如此，決不徒然返回，卻要成就我所喜悅的，在我發它去成就事上必然亨通。</p></blockquote>"}]},{"num":8,"title":"上帝怎樣執行祂的旨意？","answer":"上帝以創造和護理之工，來執行祂的旨意。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-2","days":[{"day":1,"html":"<p>上帝一直做工，執行祂永恆的計劃，完全按照祂所預定的那樣成就一切將要發生的事。上帝以兩種方式來執行祂的旨意。祂在創造中執行祂的旨意。祂創造萬有，讓萬有照著祂的意願來執行。上帝也在護理中執行祂的旨意。祂使日常生活中的大小事情都互相效力，使它們都成就祂的目的。我們把這兩種方式稱為「創造」（上帝創造萬物）與「護理」（上帝根據祂的旨意使世上萬物互相效力）。請讀詩篇135:5-6。主有何作為？祂在哪裡做這事？</p><blockquote><p><strong>詩篇135:5-6</strong><br>原來我知道耶和華為大，也知道我們的主超乎萬神之上。耶和華在天上、在地下、在海中、在一切的深處，都隨自己的意旨而行。</p></blockquote><p class=\"read-prompt\">請讀但以理書4:35。</p><blockquote><p><strong>但以理書4:35</strong><br>世上所有的居民、都算為虛無。在天上的萬軍和世上的居民中，他都憑自己的意旨行事。無人能攔住他手，或問他說：「你做什麼呢？」</p></blockquote><p>在哪兩類受造物中，上帝憑自己的意旨行事？誰能攔住祂？</p>"},{"day":2,"html":"<p>當你放手的時候，手裡的東西會怎樣？會掉下去。總是這樣。水到了冰點會怎樣？會凍成冰。總是這樣。星星年復一年按照軌道遨遊太空：每年都是春夏秋冬，冬去春來；每一天都有日出日落。這些事之所以如此，乃是因為上帝已經命定它們如此。自然中普通的、日常的事情，對我們來說已經司空見慣了，它們是上帝旨意的成就。我們稱為「自然律」的東西，實際上是上帝的旨意。</p><p>科學家之所以可以進行科學研究，是因為宇宙是可靠的。我們能夠預期在某種環境中某些事總會發生，是因為那就是上帝所命定的。在創造的時候，祂把這些定律放在祂的宇宙之內，祂所有的受造物都順服祂。（不過，只要上帝願意，祂可以讓自然執行平時不能做的事。這就是我們所謂的神蹟）請讀詩篇104:5-9。</p><blockquote><p><strong>詩篇104:5-9</strong><br>將地立在根基上，使地永不動搖。你用深水遮蓋地面，猶如衣裳；諸水高過山嶺。你的斥責一發，水便奔逃；你的雷聲一發，水便奔流。諸山升上，諸谷沉下，歸你為它所安定之地。你定了界限，使水不能過去，不再轉回遮蓋地面。</p></blockquote>"},{"day":3,"html":"<p class=\"read-prompt\">請讀詩篇104:10-30。</p><blockquote><p><strong>詩篇104:10-30</strong><br>耶和華使泉源湧在山谷，流在山間。<br>使野地的走獸有水喝，野驢得解其渴。<br>天上的飛鳥在水旁住宿，在樹枝上啼叫。<br>他從樓閣中澆灌山嶺，因他作為的功效，地就豐足。<br>他使草生長，給六畜吃，使菜蔬髮長，供給人用，使人從地裡能得食物。<br>又得酒能悅人心，得油能潤人面，得糧能養人心。<br>佳美的樹木，就是黎巴嫩的香柏樹，是耶和華所栽種的，都滿了汁漿。<br>雀鳥在其上搭窩。至於鸛，松樹是它的房屋。<br>高山為野山羊的住所；岩石為沙番的藏處。<br>你安置月亮為定節令，日頭自知沉落。<br>你造黑暗為夜，林中的百獸就都爬出來，<br>少壯獅子吼叫，要抓食，向神尋求食物。<br>日頭一出，獸便躲避，臥在洞裡。<br>人出去作工，勞碌直到晚上。<br>耶和華啊，你所造的何其多！都是你用智慧造成的，遍地滿了你的豐富。<br>那裡有海，又大又廣；其中有無數的動物，大小活物都有。<br>那裡有船行走，有你所造的鱷魚游泳在其中。<br>這都仰望你按時給它食物。<br>你給它們，它們便拾起來；你張手，它們飽得美食。<br>你掩面，它們便驚惶；你收回它們的氣，它們就死亡，歸於塵土。<br>你發出你的靈，它們便受造。你使地面更換為新。</p></blockquote><p>請回答下面的問題。野獸喝的水從哪裡來？（10-11節）山嶺的植物怎樣得到所需的水？（13節）野獸在夜裡覓食。如果黑夜不來會怎樣？為什麼黑夜會到來？（20節）獅子從哪裡得食物？（21節）所有的活物每次的呼吸都要倚靠上帝！當上帝收回它的氣息的時候，它就怎樣了？（29節）自然界的這些東西——還有好多好多——都是上帝在創造中執行祂旨意的例子。</p>"},{"day":4,"html":"<p>我們研究科學的時候，就是在研究上帝在創造中的旨意。我們研究歷史的時候，我們就是在研究上帝在護理中的旨意。從時間開始的第一刻起，上帝一直做工，執行祂的旨意，透過發生的每一件事成就祂的目的。上帝創造了不同民族的人——波蘭人、德國人、非洲人、猶太人。歷史中一個國家崛起的時候，是因為上帝命定那個國家強大。上帝命定它強大多久，它就能維持強大多久，然後另一個國家就會崛起。</p><p>上帝在地上選擇了各國所處的位置，設立自然的疆界——山脈、海洋、河流——把它們分開。請讀但以理書2:21上和使徒行傳17:26。</p><blockquote><p><strong>但以理書2:21上</strong><br>他改變時候、日期、廢王、立王，</p><p><strong>使徒行傳17:26</strong><br>他從一本造出萬族的人，住在全地上，並且預先定準他們的年限和所住的疆界；</p></blockquote><p>關於上帝，有些人曾說過，全部歷史就是「祂的故事」。上帝具有何等驚人的智慧，能計劃全部歷史所有的細節來成就祂的目的。上帝具有何等的權能，能讓萬事完全照著祂所計劃的發生！</p>"},{"day":5,"html":"<p>想一想上帝照著祂的計劃所行的各樣不同的事情，真是奇妙。上帝設計了每一個人生命中的細節。不僅如此，他也讓這些細節都成就祂對整個民族的計劃。在這一切當中，上帝使萬事互相效力，叫祂的百姓得益處。</p><p>約瑟的哥哥們嫉恨他，把他賣為奴隸。他被帶到遠方的埃及。約瑟在埃及受了些苦，可是不管到哪裡，上帝都讓人們喜愛他，給他尊貴的地位。最終，約瑟成了埃及位居第二的統治者。上帝預定了約瑟生命中的每一個細節，是為著他的益處。當約瑟在埃及作官的時候，他為了預備災荒積存了許多糧食。災荒來臨的時候，因為約瑟已經存好糧食，只有埃及地有糧。約瑟的家人——最初的以色列人——在災荒期間來埃及。這樣，他們總算是在饑荒中活了下來。</p><p>上帝已經預定了這個故事中的每一個細節，為著以色列民族的益處。以色列是救主耶穌將要降生的民族。因此，這些起初的以色列人熬過饑荒是十分重要的。上帝預定了這個故事中的每一個細節，是為了祂百姓的益處，也是為了祂自己的榮耀。請讀創世記50:20。</p><blockquote><p><strong>創世記50:20</strong><br>從前你們的意思是要害我，但神的意思原是好的，要保全許多人的性命，成就今日的光景。</p></blockquote><p>約瑟對賣他為奴的哥哥們說什麼？請讀羅馬書8:28。</p><blockquote><p><strong>羅馬書8:28</strong><br>我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。</p></blockquote>"},{"day":6,"html":"<p>有時候，相信上帝在執行祂的旨意是很困難的。尤其是當悲慘的事情發生在人們身上或者當我們看到作惡的人逍遙法外的時候。耶穌被釘十字架的時候，祂的門徒肯定也是這樣的感受。門徒們很確信，上帝差祂耶穌來，就是祂所應許的彌賽亞。但是嫉妒的猶太人官長逮捕了祂，誣陷祂，說祂有罪，並且判祂死刑。門徒肯定會想，這下上帝一定會干預吧！祂不會讓祂的彌賽亞被殺的。但是，士兵們殘酷地折磨了耶穌之後，將耶穌釘了十字架。祂死了，被埋葬了。</p><p>門徒們絕望了。上帝的彌賽亞死了；上帝沒辦法成就祂的目的了。他們沒有理解，上帝一直以來的計劃就是，耶穌要作為祂百姓的贖罪祭被殺。上帝甚至使用了祂敵人最惡毒的計劃和舉動，來執行祂的旨意。耶穌從死裡復活之後，門徒們才明白了。請讀使徒行傳4:27-28中他們向上帝禱告的內容。</p><blockquote><p><strong>使徒行傳4:27-28</strong><br>希律和本丟彼拉多、外邦人和以色列民果然在這城裡聚集，要攻打你所膏的聖僕耶穌，成就你手和你意旨所預定必有的事。</p></blockquote>"}]},{"num":9,"title":"創造之工是什麼？","answer":"創造之工，是上帝藉著權能的話，在六日之內，從無中造出萬有，並且都甚好。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-3","days":[{"day":1,"html":"<p>因為上帝照著他的形像造人，所以人有創造性。其它的活物也會製造，但是隻有人類能夠創作。蜜蜂造蜂窩，小鳥造鳥巢，但是鳥和蜜蜂只能造出本能驅使它們造的東西。人類可以創作出許多的東西——建築物、音樂、故事、發明、傢俱、服裝。人類創作的東西比動物靠本能造出的東西更好。但是上帝的創造，要比人造的任何東西強，因為上帝是從無中創造。如果你要創作一幅畫，你得有顏料、紙張或者帆布。如果你要織一件漂亮的毛衫，你得有織針和毛線。當上帝創造的時候，他從無中造出萬物。再沒有誰從無中造出東西來。只有上帝能夠做到。請讀希伯來書11:3和啟示錄4:11。</p><blockquote><p><strong>希伯來書11:3</strong><br>我們因著信，就知道諸世界是藉神話造成的，這樣，所看見的，並不是從顯然之物造出來的。</p><p><strong>啟示錄4:11</strong><br>我們的主，我們的神，你是配得榮耀、尊貴、權柄的，因為你創造了萬物，並且萬物是因你的旨意被創造而有的。</p></blockquote>"},{"day":2,"html":"<p>上帝怎樣從無中造出萬有的呢？藉著祂的話，或者祂的命令。祂只需要開口，事物就存在了。在創造的敘述中，我們讀到「上帝說」「上帝說：要有光」，「上帝說：天上要有光體」「上帝說：地要生出活物來」（創世記1:3,14,24）每次上帝說了之後，就有新的東西被造出來了。</p><p>上帝真是了不起！祂不僅能從無中造出東西，而且祂不需要為創造勞苦——祂只需要說就行了。因為這樣，本週問題的答案才把上帝的話稱為「權能」的。當上帝想要某事發生，單靠祂的話就足以成就。請讀詩篇33:6-9。</p><blockquote><p><strong>詩篇33:6-9</strong><br>諸天藉耶和華的命而造；永珍藉他口中的氣而成。<br>他聚集海水如壘，收藏深洋在庫房。<br>願全地都敬畏耶和華；願世上的居民都懼怕他。<br>因為他說有，就有；命立，就立。</p></blockquote>"},{"day":3,"html":"<p>上帝在六日之內創造萬有。在紙上寫下數字1-6，看看你能否（按順序）寫出上帝在這創世的六日中每日都造了什麼。請讀創世記1:1-27看看你答得有多正確。</p><p>創世記1:1-27</p><p>1:1 起初 神創造天地。1:2 地是空虛混沌，淵面黑暗；神的靈執行在水面上。1:3 神說：「要有光。」就有了光。1:4 神看光是好的，就把光暗分開了。1:5 神稱光為晝，稱暗為夜。有晚上，有早晨，這是頭一日。1:6 神說：「諸水之間要有空氣，將水分為上下。」1:7 神就造出空氣，將空氣以下的水、空氣以上的水分開了。事就這樣成了。1:8 神稱空氣為天。有晚上，有早晨，是第二日。1:9 神說：「天下的水要聚在一處，使旱地露出來。」事就這樣成了。1:10 神稱旱地為地，稱水的聚處為海。神看著是好的。1:11 神說：「地要發生青草和結種子的菜蔬，並結果子的樹木，各從其類，果子都包著核。」事就這樣成了。1:12 於是地發生了青草和結種子的菜蔬，各從其類；並結果子的樹木，各從其類，果子都包著核。神看著是好的。1:13 有晚上，有早晨，是第三日。1:14 神說：「天上要有光體，可以分晝夜，作記號，定節令、日子、年歲，1:15 並要發光在天空，普照在地上。」事就這樣成了。1:16 於是神造了兩個大光，大的管晝，小的管夜，又造眾星，1:17 就把這些光擺列在天空，普照在地上，1:18 管理晝夜，分別明暗。神看著是好的。1:19 有晚上，有早晨，是第四日。1:20 神說：「水要多多滋生有生命的物，要有雀鳥飛在地面以上，天空之中。」1:21 神就造出大魚和水中所滋生各樣有生命的動物，各從其類；又造出各樣飛鳥，各從其類。神看著是好的。1:22 神就賜福給這一切說：「滋生繁多，充滿海中的水；雀鳥也要多生在地上。」1:23 有晚上，有早晨，是第五日。1:24 神說：「地要生出活物來，各從其類；牲畜、昆蟲、野獸，各從其類。」事就這樣成了。1:25 於是神造出野獸，各從其類；牲畜，各從其類；地上一切昆蟲，各從其類。神看著是好的。1:26 神說：「我們要照著我們的形像，按著我們的樣式造人，使他們管理海里的魚、空中的鳥、地上的牲畜和全地，並地上所爬的一切昆蟲。」1:27 神就照著自己的形像造人，乃是照著他的形像造男造女。</p>"},{"day":4,"html":"<p>請再看創世記1:1-24。你發現「上帝看著是好的」這句話出現了幾次？祂創造每種東西之後，上帝看著是好的。當祂完成了造物的工，祂看這一切怎麼樣？請讀創世記1:31中的答案。</p><blockquote><p><strong>創世記1:31</strong><br>神看著一切所造的都甚好。有晚上，有早晨，是第六日。</p></blockquote><p>我們現在看到的身邊這個世界已經不再是上帝創造時的樣子了。上帝造物時都是好的，但是我們現在我們看到身邊的東西不好的——比如痛苦、邪惡、悲傷、死亡。上帝沒有創造這些；當最初的人類選擇犯罪的時候，這些東西才進入到世界裡面來的。</p><p>我們仍然能夠看到上帝造物留下來的很多美妙，但是當祂起初創造的時候，是比現在更美好的。上帝創造的世界不是沒救了。罪也不會嚇到上帝。祂已經應許，有一天會消除罪惡，除掉罪帶給世界的所有敗壞。當耶穌再來接祂的百姓時，上帝就會這麼做。一切都將完好如初，不再有悲傷、罪惡。</p>"},{"day":5,"html":"<p>為什麼一天總是二十四個小時呢？為什麼太陽天天升起？為什麼每逢秋天樹葉會飄落，每年春天會長出嫩葉來？因為上帝已經命定這些事發生。上帝真好，祂命定萬物，使之有章可循。農夫知道何時播種，莊稼才會在最好的季節生長。上帝在自然界的旨意向我們顯明，祂是何等信實地眷顧祂的受造物。祂的信實千載不變。在你的曾祖父的時候，那順服上帝的「自然律」今日仍然順服上帝。請讀詩篇119:89-91。</p><blockquote><p><strong>詩篇119:89-91</strong><br>耶和華啊，你的話安定在天，直到永遠。<br>你的誠實存到萬代；你堅定了地，地就長存。<br>天地照你的安排存到今日；萬物都是你的僕役。</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀詩篇147，然後回答後面的問題。</p><blockquote><p><strong>詩147:1-20</strong><br>你們要讚美耶和華！因歌頌我們的神為善為美，讚美的話是合宜的。<br>耶和華建造耶路撒冷，聚集以色列中被趕散的人。<br>他醫好傷心的人，裹好他們的傷處。<br>他數點星宿的數目，一一稱它的名。<br>我們的主為大，最有能力。他的智慧無法測度！<br>耶和華扶持謙卑人，將惡人傾覆於地。<br>你們要以感謝向耶和華歌唱，用琴向我們的神歌頌。<br>他用雲遮天，為地降雨，使草生長在山上。<br>他賜食給走獸和啼叫的小烏鴉。<br>他不喜悅馬的力大，不喜愛人的腿快。<br>耶和華喜愛敬畏他和盼望他慈愛的人。<br>耶路撒冷啊，你要頌讚耶和華！錫安哪，你要讚美你的神！<br>因為他堅固了你的門閂，賜福給你中間的兒女。<br>他使你境內平安，用上好的麥子使你滿足。<br>他發命在地，他的話頒行甚快。<br>他降雪如羊毛，撒霜如爐灰。<br>他擲下冰雹如碎渣，他發出寒冷，誰能當得起呢？<br>他一出令，這些就都消化；他使風颳起，水便流動。<br>他將他的道指示雅各，將他的律例典章指示以色列，<br>別國他都沒有這樣待過；至於他的典章，他們向來沒有知道。你們都要讚美耶和華！</p></blockquote><p>上帝一一稱誰的名？（4節）上帝賜下什麼？（8節）祂賜給小鳥和野獸什麼？（9節）第16,17節談到雪、霜、冰雹。是什麼造成這些東西？（15節）是什麼使它們融化？（18節）這些都是上帝在創造中的旨意。</p>"}]},{"num":10,"title":"上帝怎樣創造人？","answer":"上帝按照自己的形像，造男造女；他們是在知識、仁義、聖潔中被造，受託治理一切被造之物。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-3","days":[{"day":1,"html":"<p>上帝最後創造人。祂已經造好了宇宙，造了一個美麗的世界，用鳥、獸、魚遍滿了世界。然後，上帝造人。是否因為上帝孤獨了，想要有人以愛回報祂呢？絕對不是！上帝自己擁有所需的一切。祂不需要任何人、任何東西來使祂比現在更快樂、更滿足。在永恆中間，在萬物存在之前，聖父、聖子、聖靈就共享完美之愛。上帝永不孤單。祂選擇造人的原因，與選擇造任何東西一樣——都是為了祂自己的榮耀。請讀詩篇100:1-3。</p><blockquote><p><strong>詩100:1-3</strong><br>普天下當向耶和華歡呼！<br>你們當樂意事奉耶和華，當來向他歌唱！<br>你們當曉得耶和華是神。我們是他造的，也是屬他的；我們是他的民，也是他草場的羊。</p></blockquote>"},{"day":2,"html":"<p>你還記得上帝怎樣評價祂所造的一切？「是好的」。請讀創世記2:18。</p><blockquote><p><strong>創世記2:18</strong><br>耶和華神說：「那人獨居不好，我要為他造一個配偶幫助他。」</p></blockquote><p>上帝說什麼不好？上帝不想讓人們獨居。他想要人們以相愛的關係共同生活。男人需要女人，女人也需要男人。亞當和夏娃，第一對夫妻，也是第一個家庭。上帝的目的是要新的人類出生在家庭裡，讓他們在那兒學習如何與他人彼此相愛、和睦共處。上帝還為孩子們計劃，要在家庭裡學習認識上帝。家庭是上帝的恩賜，顯明瞭祂的智慧和良善。請讀詩篇68:6的第一行。</p><blockquote><p><strong>詩篇68:6（第一行）</strong><br>神叫孤獨的有家。</p></blockquote>"},{"day":3,"html":"<p>上帝造人，與其它受造物不同。請讀創世記1:27，看看人有何不同。</p><blockquote><p><strong>創世記1:27</strong><br>神就照著自己的形像造人，乃是照著他的形像造男造女。</p></blockquote><p>照著上帝的形像被造，那是什麼意思呢？請讀創世記5:1看看另一種表達的方式。</p><blockquote><p><strong>創世記5:1</strong><br>亞當的後代記在下面。當神造人的日子，是照著自己的樣式造的，</p></blockquote><p>照著上帝的形像被造，就是很多方面跟上帝相像，而其它受造物不是這樣。當然沒有人和任何東西真正地像上帝。上帝是無限的（沒有限量），所有其它的都是有限的。上帝創造了萬有，而祂自己從來就不是被造的。但是人是上帝造人，在某種程度上，稍微顯出上帝的屬性。人們可以與別人溝通想法和感受。他們可以設想製作有創意的東西。他們可以提前計劃。上帝造的人，是所有受造物中最高貴的。能夠按照上帝的形像和樣式被造是何等的特權啊！</p>"},{"day":4,"html":"<p>人能夠彰顯上帝形像的一種方式，就是他們能夠獲得知識。魚、鳥、動物都是憑著本能來行動。上帝在這些活物裡面都內建了完美的機制，告訴它們，為了生存如何做所需做的事情。鳥類知道每年遷徙數千裡去溫暖的地方。但是動物和鳥類不是在思考和計劃之後來選擇做這些事情的。他們是靠著本能來做這些事。</p><p>只有人是不同的。他能夠思考，認知事物。人能夠學習，不斷在已有知識上積累。上帝造我們，有能力認知學習，這樣我們也能夠認識祂。沒有動物能夠認識上帝的。因為罪進入了世界，人們把認知的能力用在了錯誤的目的上。有人想要大大的學問，就是想比其他人更聰明。還有人要獲得知識，目的是為了賺大錢。人們甚至使用學習的能力來學習作惡。請讀耶利米書9:23-24，看看使用我們認知能力的最佳方式是什麼？</p><blockquote><p><strong>耶利米書9:23-24</strong><br>耶和華如此說：「智慧人不要因他的智慧誇口，勇士不要因他的勇力誇口，財主不要因他的財物誇口。<br>誇口的卻因他有聰明，認識我是耶和華，又知道我喜悅在世上施行慈愛、公平和公義，以此誇口。」這是耶和華說的。</p></blockquote>"},{"day":5,"html":"<p>還有一方面，人帶著上帝的形像。他們有能力分辨對錯。上帝沒有把這個能力給其它受造物。動物捕食或者搶奪其它動物的東西，都是出於本能的行動。他們沒有對錯的觀念。人類像上帝，知道對錯，能夠在對錯之間選擇。所有人內心裡面都是有罪的。這就促使他們選擇做錯誤的事，選擇自己的道路，不要上帝的道路。</p><p>上帝造最初的人類不是那樣的。祂所造的先祖是公義聖潔的，裡面根本沒有邪惡。不過，上帝給他們選擇對錯的能力，亞當和夏娃就選擇了做錯誤的事。這就使他們從裡面有了罪。他們把罪性傳遞給後代的全人類。因為人知道善惡的不同，他們比地上的所有其它受造物優秀。他們也得為自己的行為負責。上帝不會審判行為自私或者傷害其它動物的動物。因為人選擇做明知是錯的事，上帝將要審判他們。請讀傳道書7:29。</p><blockquote><p><strong>傳道書7:29</strong><br>我所找到的只有一件：就是神造人原是正直，但他們尋出許多巧計。</p></blockquote>"},{"day":6,"html":"<p>當上帝造人的時候，祂給人兩個命令。第一個命令就是要生養眾多，遍滿地面。第二個命令是什麼？在創世記1:28中找一找。</p><blockquote><p><strong>創世記1:28</strong><br>神就賜福給他們，又對他們說：「要生養眾多，遍滿地面，治理這地；也要管理海里的魚、空中的鳥，和地上各樣行動的活物。」</p></blockquote><p>世界和其中所有的都屬於上帝，但是祂把它交給人來使用，以滿足人的需要。因為世界和其中所有的都是主的，我們應該在使用的方式上榮耀上帝。對於上帝所造的一切，我們不應該自私、貪婪、浪費。</p><p>今天，人們很擔憂利用自然的方式。他們為水源汙染和空氣汙染憂慮。他們為著將要耗盡上帝為我們所造的東西而憂慮。我們應該有智慧地利用上帝的恩賜。我們也需要記得，上帝把治理自然的權利交給人。有人說，人類只不過是自然的一部分，跟蟲子一樣不足掛齒，這麼說是錯的。比如，有人可能關注殺害幼年的鯨魚或者海豚，但是對於墮胎這種殺害未出生嬰兒的行為，他們卻覺得無所謂。嬰兒和幼鯨的不同是什麼？請讀詩篇8。</p><blockquote><p><strong>詩8:1-6-8</strong><br>耶和華我們的主啊，你的名在全地何其美！你將你的榮耀彰顯於天。<br>你因敵人的緣故，從嬰孩和吃奶的口中建立了能力，使仇敵和報仇的閉口無言。<br>我觀看你指頭所造的天，並你所陳設的月亮星宿，<br>便說，人算什麼，你竟顧念他？世人算什麼，你竟眷顧他？<br>你叫他比天使微小一點，並賜他榮耀尊貴為冠冕。<br>你派他管理你手所造的，使萬物，就是一切的牛羊、田野的獸、空中的鳥、海里的魚，凡經行海道的，都服在他的腳下。</p><p><strong>詩8:9</strong><br>耶和華我們的主啊，你的名在全地何其美！</p></blockquote>"}]},{"num":11,"title":"上帝的護理之工是什麼？","answer":"上帝的護理之工，就是以祂至極的聖潔、智慧、權能，保護管理祂所造的萬物，和它們一切的動作。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-4","days":[{"day":1,"html":"<p>上帝預先計劃了發生的每一件事。然後祂按照所計劃的成就每一件事。我們把這叫做護理。上帝是聖潔的。祂形成的每一個計劃，以及祂執行計劃的方式，都是全然聖潔的。上帝是完全智慧的。祂的計劃與作為從不會有差錯，而總是選擇最好的。上帝是有大能的。因為所有的能力都屬乎祂，沒有什麼能攔阻祂完全照著祂的計劃行事。</p><p>全部歷史講述的就是上帝的護理。歷史書中每一個故事都是在講上帝，儘管它並沒有提到上帝的名字。祂是成就歷史上每一個事件的那一位，請讀下面的例子，大小事情都是由上帝來決定的：箴言16:9,33和箴言21:1。</p><blockquote><p><strong>箴言16:9</strong><br>人心籌算自己的道路，惟耶和華指引他的腳步。</p><p><strong>箴言16:33</strong><br>籤放在懷裡，定事由耶和華。</p><p><strong>箴言21:1</strong><br>王的心在耶和華手中，好像隴溝的水隨意流轉。</p></blockquote><p>以斯帖記是聖經中的一卷歷史書，完全沒有提到上帝的名字。在整本以斯帖記，我們都能清楚地看到上帝的護理。</p>"},{"day":2,"html":"<p>以斯帖記的名字來源於王后以斯帖。這卷書講述了一個滅絕猶太人的陰謀。要記得，上帝曾經應許要差遣彌賽亞把祂的百姓從罪惡中拯救出來。上帝說過，彌賽亞將會是亞伯拉罕的後裔，也就是猶太人。如果所有的猶太人都被殺了，那麼上帝的彌賽亞就沒辦法出自猶太民族了，上帝就不能守約了。以斯帖記講述了上帝如何阻止了這場陰謀的實施，如何保護了祂的百姓，如何懲罰了祂的仇敵。以斯帖記講述的是上帝護理的故事。</p><p>故事開始於當時的霸權、波斯要娶新王后。為了找到王后，國王舉辦了規模宏大的選美競賽。請讀以斯帖記2:5-7。</p><blockquote><p><strong>以斯帖記2:5-7</strong><br>書珊城有一個猶大人，名叫末底改，是便雅憫人基士的曾孫、示每的孫子、睚珥的兒子。<br>從前巴比倫王尼布甲尼撒將猶大王耶哥尼雅和百姓從耶路撒冷擄去，末底改也在其內。<br>末底改撫養他叔叔的女兒哈大沙（後名以斯帖），因她沒有父母。這女子又容貌俊美，她父母死了，末底改就收她為自己的女兒。</p></blockquote><p>以斯帖是哪族人？是誰使她容貌俊美？請讀以斯帖記2:17-18。</p><blockquote><p><strong>以斯帖記2:17-18</strong><br>王愛以斯帖過於愛眾女，她在王眼前蒙寵愛比眾處女更甚。王就把王后的冠冕戴在她頭上，立她為王后，代替瓦實提。<br>王因以斯帖的緣故給眾首領和臣僕設擺大筵席，又豁免各省的租稅，並照王的厚意大頒賞賜。</p></blockquote><p>誰使國王喜愛以斯帖勝過其他女子？</p>"},{"day":3,"html":"<p>以斯帖有個堂兄名叫末底改。一天，有兩個人密謀殺害國王。請讀以斯帖記2:21-23看看發生了什麼。</p><blockquote><p><strong>以斯帖記2:21-23</strong><br>當那時候，末底改坐在朝門，王的太監中有兩個守門的闢探和提列，惱恨亞哈隨魯王，想要下手害他。<br>末底改知道了，就告訴王后以斯帖。以斯帖奉末底改的名，報告於王。<br>究察這事，果然是實，就把二人掛在木頭上，將這事在王面前寫於歷史上。</p></blockquote><p>末底改怎麼碰巧聽到二人密謀，於是藉著以斯帖給國王通風報信？請注意，國王把末底改的事蹟記在了哪裡，這一點以後會很重要的。</p><p>哈曼是個大人物，地位僅次於國王。不過哈曼走過的時候，末底改從來不拜。這讓哈曼十分惱火，他憎恨末底改，想要除掉他。不僅如此呢，當哈曼聽說末底改是個猶太人，他也想除掉所有的猶太人。哈曼賄賂國王，使國王下令，在某某日全國百姓都可以起來殺掉所有猶太人。</p>"},{"day":4,"html":"<p>猶太人聽到國王的命令，得知他們要被殺以後，他們就哀痛哭泣。以斯帖還沒有聽說國王的命令。她給末底改送信，問是出了什麼事。末底改回信，講到了國王的命令，懇求她求求國王，不要讓猶太人被殺。請讀以斯帖記4:11，看看以斯帖如何答覆。</p><blockquote><p><strong>以斯帖記4:11</strong><br>王的一切臣僕和各省的人民，都知道有一個定例：若不蒙召，擅入內院見王的，無論男女必被治死；除非王向他伸出金杖，不得存活。現在我沒有蒙召進去見王已經三十日了。</p></blockquote><p>末底改明白上帝的護理。他知道上帝會保護猶太人，以成就祂差遣一位猶太人彌賽亞的計劃。他也明白，沒有什麼事是偶然發生的。以斯帖這位猶大女子，在這危急時刻，身為王后，這絕非偶然。請讀以斯帖記4:13-14末底改對以斯帖說了什麼，以及以斯帖在4:15-16的決定。</p><blockquote><p><strong>以斯帖記4:13-16</strong><br>末底改託人回覆以斯帖說：「你莫想在王宮裡強過一切猶大人，得免這禍。<br>此時你若閉口不言，猶大人必從別處得解脫、蒙拯救；惟知你得了王后的位分，不是為現今的機會嗎？」<br>以斯帖就吩咐人回報末底改說：<br>「你當去招聚書珊城所有的猶大人，為我禁食三晝三夜，不吃不喝；我和我的宮女也要這樣禁食。然後我違例進去見王，我若死就死吧！」</p></blockquote><p>以斯帖在沒有被召的情況下去見王，發生了什麼？請讀以斯帖記5:1-3。</p><blockquote><p><strong>以斯帖記5:1-3</strong><br>第三日，以斯帖穿上朝服，進王宮的內院，對殿站立。王在殿裡坐在寶座上，對著殿門。<br>王見王后以斯帖站在院內，就施恩於她，向她伸出手中的金杖；以斯帖便向前摸杖頭。<br>王對她說：「王后以斯帖啊，你要什麼？你求什麼？就是國的一半也必賜給你。」</p></blockquote><p>為什麼國王歡迎以斯帖？你還記得我們禮拜一讀的經文嗎？「王的心在耶和華手中，好像隴溝的水隨意流轉。」（箴21:1）以斯帖邀請國王和哈曼來赴宴。他們來的時候，她邀請他們再來赴宴。就在第二次的筵席上，她要求國王救她的同胞。</p>"},{"day":5,"html":"<p>以斯帖的邀請讓哈曼得意洋洋！被請的只有他和國王。哈曼向每個人都吹噓了一通。「只有一件事讓我高興不起來，」哈曼唸叨著，「就是那個猶太人末底改！每次看到他該拜我的時候都站得直直的，我就氣不打一處來！」</p><p>哈曼的妻子給他出謀劃策：「那就別等著所有猶太人被殺的時候再弄死他，現在就做個木架子，明天一大早求國王把末底改吊死在上面。」哈曼聽了大喜。他就叫人做了木架子，切切盼望天亮。上帝不僅救了末底改免於死在架子上。他還使末底改得尊榮，叫祂的仇敵哈曼羞愧。請讀以斯帖記6:1-12。</p><blockquote><p><strong>以斯帖記6:1-12</strong><br>那夜，王睡不著覺，就吩咐人取歷史來，念給他聽。<br>正遇見書上寫著說，王的太監中有兩個守門的闢探和提列，想要下手害亞哈隨魯王，末底改將這事告訴王后。<br>王說：「末底改行了這事，賜他什麼尊榮爵位沒有？」伺候王的臣僕回說：「沒有賜他什麼。」<br>王說：「誰在院子裡？」（那時哈曼正進王宮的外院，要求王將末底改掛在他所預備的木架上。）<br>臣僕說：「哈曼站在院內。」王說：「叫他進來。」<br>哈曼就進去。王問他說：「王所喜悅尊榮的人，當如何待他呢？」哈曼心裡說：「王所喜悅尊榮的，不是我是誰呢？」<br>哈曼就回答說：「王所喜悅尊榮的人，<br>當將王常穿的朝服和戴冠的御馬，<br>都交給王極尊貴的一個大臣，命他將衣服王所喜悅尊榮的人穿上，使他騎上馬，走遍城裡的街市，在他面前宣告說：『王所喜悅尊榮的人，就如此待他。』」<br>王對哈曼說：「你速速將這衣服和馬，照你所說的，向坐在朝門的猶大人末底改去行。凡你所說的，一樣不可缺。」<br>於是哈曼將朝服給末底改穿上，使他騎馬走遍城裡的街市，在他面前宣告說：「王所喜悅尊榮的人，就如此待他。」<br>末底改仍回到朝門；哈曼卻憂憂悶悶地蒙著頭，急忙回家去了，</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀以斯帖記7，看看這個故事的尾聲。故事的結局是這樣的：國王無法更改殺猶太人的命令，但是他下了新命令，叫猶太人可以自衛。上帝讓波斯通國的人都懼怕猶太人。到了要殺猶太人的日子，猶太人倒是把他們的仇敵殺了。末底改得了尊榮，坐上了哈曼的高位。</p><p>以斯帖記讓我們看到上帝護理的一個小小的例子。自從創世以來，上帝一直信實地行作成就萬事，叫祂的百姓得益處，叫祂自己得榮耀。</p>"}]},{"num":12,"title":"當上帝造人的時候，上帝向人施行的特別護理作為是什麼？","answer":"當上帝造人之後，祂與人立了生命之約——以完全順服為條件——以死亡的痛苦為刑罰，禁止人吃分別善惡樹的果子。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-4","days":[{"day":1,"html":"<p>因為上帝創造了人類，人類屬於上帝；上帝可以儘管按照祂喜悅的方式來對待他們。在上帝的恩典中，祂選擇透過立約的方式來對待人類。約就是一種協議。在符合某些條件的前提下承諾某些利益。人之間立約的時候，必須在立定之前確保是雙方都願意的。然後一方承諾為另一方做某些事。雙方都要信守承諾。如果一方背約，另一方就不需要再守約了。</p><p>不過，當上帝與人立約的時候，這個約並非在兩個平等的人中間訂立。上帝比我們大得多。祂創造我們，我們屬於祂。在上帝訂立的約中，祂向人承諾了賜福，祂要求人遵守祂的命令。你讀聖經的時候，你會常常發現上帝與人立約。上帝所立的第一個約是與亞當立的。請讀詩篇103:17-19。</p><blockquote><p><strong>詩篇103:17-19</strong><br>但耶和華的慈愛歸於敬畏他的人，從亙古到永遠；他的公義也歸於子子孫孫，<br>就是那些遵守他的約，記念他的訓詞而遵行的人。<br>耶和華在天上立定寶座，他的權柄（注：原文作「國」）統管萬有。</p></blockquote>"},{"day":2,"html":"<p>當上帝創造第一個人的時候，祂給了他可能需要的一切，並且有餘。上帝照著祂的形像造人，有能力做很多其他被造物不能做的事。上帝將人置於一個完美的世界中，告訴他可以使用他喜歡的任何東西。祂只留了一樣東西沒有讓亞當使用：分別善惡樹。上帝告訴亞當不要吃這棵樹上的果子，他就要死。這是上帝與人所立的第一個約。約的要求就是完全順服上帝。如果他不順服就會死；如果他順服著就會活。請讀創世記2:8-17。</p><p>創世記2:8 耶和華神在東方的伊甸立了一個園子，把所造的人安置在那裡。創世記2:9 耶和華神使各樣的樹從地裡長出來，可以悅人的眼目，其上的果子好作食物。園子當中又有生命樹和分別善惡的樹。創世記2:10 有河從伊甸流出來滋潤那園子，從那裡分為四道：創世記2:11 第一道名叫比遜，就是環繞哈腓拉全地的。在那裡有金子，創世記2:12 並且那地的金子是好的；在那裡又有珍珠和紅瑪瑙。創世記2:13 第二道河名叫基訓，就是環繞古實全地的。創世記2:14 第三道河名叫底格里斯，流在亞述的東邊，第四道河就是幼發拉底河。創世記2:15 耶和華神將那人安置在伊甸園，使他修理看守。創世記2:16 耶和華神吩咐他說：「因中各樣樹上的果子，你可以隨意吃，創世記2:17 只是分別善惡樹上的果子，你不可吃，因為你吃的日子必定死。」</p>"},{"day":3,"html":"<p>人類是非常了不起的受造物，不過他們也僅僅是受造物。人能夠做其他受造物不能做的許多事情，但是他沒有上帝就不能存活。他必須記得，他凡事都得倚靠上帝——包括生命本身。請讀詩篇104:27-30。</p><blockquote><p><strong>詩篇104:27-30</strong><br>這都仰望你按時給它食物。<br>你給它們，它們便拾起來；你張手，它們飽得美食。<br>你掩面，它們便驚惶；你收回它們的氣，它們就死亡，歸於塵土。<br>你發出你的靈，它們便受造。你使地面更換為新。</p></blockquote><p>上帝與亞當所立的約要求亞當信靠上帝的話，以致順服它。上帝要亞當完全地信靠祂。上帝告訴亞當不要吃分別善惡樹的果子，否則就會死，這時亞當本該信靠上帝，相信祂、順服祂。</p>"},{"day":4,"html":"<p>上帝的約要求人完全的順服。大多數時間的順服並不能達到上帝的要求。當人們說到好人的時候，他們通常的意思是說某人跟別人比起來算是個好人。當我們說某人是「乖乖女」的時候，我們的意思不是說她是完美的；我們的意思是說她表現得比許多其他孩子乖而已。「好人」就是比其他人做更多好事的人，但是我們並不認為他就是完美的。</p><p>上帝對於「好」的概念，與我們的不同。只有人完全順服了祂的命令，上帝才會把他看成是好的。這是因為上帝是聖潔的。祂從來不做錯事，他恨惡在祂受造物中的所有罪惡。請讀利未記19:2和申命記18:13。</p><blockquote><p><strong>利未記19:2</strong><br>「你曉諭以色列全會眾說：『你們要聖潔，因為我耶和華你們的神是聖潔的。</p><p><strong>申命記18:13</strong><br>你要在耶和華你的神面前作完全人。</p></blockquote><p>上帝造人能夠行善，因此祂要求人行善——不是偶爾，不是大多數時間，而是一直如此。如果亞當違背上帝一次，吃了不可吃的果子，就會如同上帝警告的那樣面對死亡。</p>"},{"day":5,"html":"<p class=\"read-prompt\">請讀創世記2:7。</p><blockquote><p><strong>創世記2:7</strong><br>耶和華神用地上的塵土造人，將生氣吹在他鼻孔裡，他就成了有靈的活人，名叫亞當。</p></blockquote><p>當上帝將生命氣息吹入亞當，亞當就活了。肉體的生命是來自於上帝的禮物。呼吸、行走、思考、歡笑的能力是上帝所賜的美好禮物。上帝不僅賜予了肉體的生命，祂也賜下屬靈的生命。屬靈的生命就是能夠與上帝相交的能力。有屬靈生命的人們知道自己是上帝的朋友，不是上帝的敵人。與上帝有正確的關係就是有屬靈的生命。請讀箴言22:4和詩篇36:9。</p><blockquote><p><strong>箴言22:4</strong><br>敬畏耶和華心存謙卑，就得富有、尊榮、生命為賞賜。</p><p><strong>詩篇36:9</strong><br>因為在你那裡有生命的源頭，在你的光中，我們必得見光。</p></blockquote><p>上帝也賜下永生，就是永存的生命，完全喜樂，完美美善的生命。請讀約翰福音17:3和約翰福音11:25-26。</p><blockquote><p><strong>約翰福音17:3</strong><br>認識你獨一的真神，並且認識你所差來的耶穌基督，這就是永生。</p><p><strong>約翰福音11:25-26</strong><br>耶穌對她說：「復活在我，生命也在我！信我的人，雖然死了，也必復活。<br>凡活著信我的人必永遠不死。你信這話嗎？」</p></blockquote><p>在上帝與人的第一個約中，上帝應許了這三種生命——肉體的、屬靈的、永遠的——只要亞當遵守祂的命令。</p>"},{"day":6,"html":"<p>工價就是人們勞動賺來的報酬。請讀羅馬書6:23。</p><blockquote><p><strong>羅馬書6:23</strong><br>因為罪的工價乃是死；惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。</p></blockquote><p>悖逆上帝就是賺來死亡。上帝警告亞當，如果他違背上帝的命令吃了那分別善惡樹的果子，他就必定死。正如有三種生命，如果亞當犯罪，人也經歷三種的死亡。</p><p>如果他犯罪，他的身體會死亡——不是他吃的時候立刻就死，而是從那時開始死亡。他的身體將會衰老、虛弱，直到老邁或患病而死。如果亞當犯罪，人就會在靈命上死亡。他的罪將使他與上帝隔絕，使他成為上帝的敵人，因為上帝恨惡罪惡。請讀以弗所書2:1。</p><blockquote><p><strong>以弗所書2:1</strong><br>你們死在過犯愆之中，他叫你們活過來。</p></blockquote><p>如果亞當犯罪，他也會為人類賺得永死。永死就是與上帝隔絕，在地獄中永遠受刑罰。請讀啟示錄21:8。</p><blockquote><p><strong>啟示錄21:8</strong><br>惟有膽怯的、不信的、可憎的、殺人的、淫亂的、行邪術的、拜偶像的和一切說謊話的，他們的分就在燒著硫磺的火湖裡，這是第二次的死。</p></blockquote><p>上帝向人承諾，如果他順服上帝就可存活，警告他，如果悖逆就必死。上帝也給了人做正確選擇順服上帝所需的一切。</p>"}]},{"num":13,"title":"我們的始祖持續在他們受造的狀態中嗎？","answer":"我們的始祖因其自由意志，選擇犯罪得罪上帝，就從當初受造的狀態中墮落了。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-5","days":[{"day":1,"html":"<p>上帝曾賜給人何等大的特權！在所有的受造物中，只有人是照著上帝的形像造的。只有人能夠敬拜上帝，能夠與上帝交流。只有人能夠思考、記憶和計劃。只有人能夠做選擇，而不僅僅是出於本能來行事。但是伴隨這如此高的特權而來的是責任。上帝給人能力選擇，人就要用這種能力來選擇順服上帝。請讀申命記10:12-13。</p><blockquote><p><strong>申命記10:12-13</strong><br>以色列啊，現在耶和華神向你所要的是什麼呢？只要你敬畏耶和華你的神，遵行他的道，愛他，盡心儘性事奉他，<br>遵守他的誡命、律例，就是我今日所吩咐你的，為要叫你得福。</p></blockquote>"},{"day":2,"html":"<p>上帝曾經告訴亞當，如果他吃了分別善惡樹上的果子，他就會死。上帝已經造了人和其他萬物。關於祂所造的世界，上帝所說的，亞當理應相信就是了。上帝已經給亞當所有的好東西讓他享用。那麼當上帝給他一個命令的時候，亞當也理應相信是為了他的好處。</p><p>可是當撒但來告訴亞當和夏娃，「你吃那果子，不會死；你會成為上帝一樣！」他們竟相信了，聽了牠的話，而沒有聽上帝的話。亞當夏娃不拜上帝，不怕違背祂的話，倒妄想自己作自己的神。多年以後，撒但試探耶穌，讓祂只顧自己，不要信靠上帝。耶穌的回答，顯明祂信靠上帝的話。請讀馬太福音4:4。</p><blockquote><p><strong>馬太福音4:4</strong><br>耶穌卻回答說：「經上記著說：『人活著，不是單靠食物，乃是靠神口裡所出的一切話。』」</p></blockquote>"},{"day":3,"html":"<p>亞當夏娃犯罪的時候，他們得罪了上帝。犯罪總是得罪上帝的。我們犯罪的時候，表面上似乎我們只是我行我素罷了，可是如果我們的行為違背了上帝的律法，我們就得罪了祂。我們跟某人發怒的時候，表面上似乎只是得罪了某人，可是如果我們的行為違背了上帝的律法，我們就得罪了上帝。不管我們什麼時候犯罪，不管我們的罪都是冒犯上帝的罪行。當我們選擇犯罪的時候，我們就是在告訴上帝，我們不在乎他想要什麼；我們想要的對我們來說更重要。請讀詩篇51:3-4。</p><blockquote><p><strong>詩篇51:3-4</strong><br>因為我知道我的過犯，我的罪常在我面前。<br>我向你犯罪，惟獨得罪了你，在你眼前行了這惡，以致你責備我的時候顯為公義；判斷我的時候顯為清正。</p></blockquote>"},{"day":4,"html":"<p>始祖所犯的第一個罪，我們稱之為「墮落」。我們如此稱呼它，是因為亞當和夏娃犯罪的時候，所有的人類就從完全美好的狀態墮落了有罪的狀態。上帝已經賜給人創造力，可是現在人用這種能力來發明邪惡的事物與招數來傷害人。上帝造人的時候，上帝使人能夠愛上帝和他人，可是現在，人愛自己遠超過愛別人。人有思想，這是上帝所賜的禮物，使人比其他受造物高明，可是現在人使用思想來選擇邪惡，謀算各種套路來作惡。只有人受造是能夠認識上帝、敬拜上帝，可是現在人敬拜其它東西，要麼就乾脆說沒有上帝。請讀詩篇14:1-3。</p><blockquote><p><strong>詩篇14:1-3</strong><br>愚頑人心裡說：「沒有神。」他們都是邪惡，行了可憎惡的事；沒有一個人行善。<br>耶和華從天上垂看世人，要看有明白的沒有，有尋求神的沒有。<br>他們都偏離正路，一同變為汙穢；並沒有行善的，連一個也沒有！</p></blockquote>"},{"day":5,"html":"<p>在第十問中，我們學過，上帝造人本有知識、仁義、聖潔。上帝創造人，讓他認識上帝和祂的旨意。自從墮落之後，人不再能夠自己認識上帝，不再能夠明白屬靈真理。請讀哥林多前書2:14。</p><blockquote><p><strong>哥林多前書2:14</strong><br>然而，屬血氣的人不領會神聖靈的事，反倒以為愚拙，並且不能知道，因為這些事惟有屬靈的人才能看透。</p></blockquote><p>人被造時是聖潔的，能夠做上帝喜悅的事。自從墮落之後，每個人最好的行為在上帝的眼中也不算是仁義的。請讀以賽亞書64:6。</p><blockquote><p><strong>以賽亞書64:6</strong><br>我們都像不潔淨的人，所有的義都像汙穢的衣服；我們都像葉子漸漸枯乾，我們的罪孽好像風把我們吹去。</p></blockquote><p>上帝造人本是聖潔，這樣人可以愛上帝，渴望良善。但是因為墮落，人已經成了上帝的敵人。現在人拒絕愛上帝，卻選擇去愛受造之物和邪惡的事情。請讀羅馬書1:21-23,25。</p><blockquote><p><strong>羅馬書1:21-23</strong><br>因為他們雖然知道神，卻不當作神榮耀他，也不感謝他。他們的思念變為虛妄，無知的心就昏暗了。<br>自稱為聰明，反成了愚拙；<br>將不能朽壞之神的榮耀變為偶像，彷佛必朽壞的人和飛禽、走獸、昆蟲的樣式。</p><p><strong>羅馬書1:25</strong><br>他們將神的真實變為虛謊，去敬拜事奉受造之物，不敬奉那造物的主。主乃是可稱頌的，直到永遠。阿們！</p></blockquote>"},{"day":6,"html":"<p>上帝造人的時候，曾吩咐他管理其他受造物。這是很高的特權，也是重大的責任。人將要治理自然，照管它，為著上帝的榮耀有智慧地利用它。自從墮落之後，人想要以邪惡的方式來治理。人以貪心來治理自然，浪費它而不去照管它。人也自私地企圖彼此統治，甚至為達目的不惜彼此刀鋒相見。自從墮落以後，人甚至連自己都控制不了了。請讀雅各書4:1-3。</p><blockquote><p><strong>雅各書4:1-3</strong><br>你們中間的爭戰、鬥毆，是從哪裡來的呢？不是從你們百體中戰鬥之私慾來的嗎？<br>你們貪戀，還是得不著；你們殺害嫉妒，又鬥毆爭戰，也不能得。你們得不著，是因為你們不求；<br>你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中。</p></blockquote><p>人是照著上帝的形像造的，因此他能夠認識上帝、愛上帝、選擇行善、治理其他萬物。現在人不能認識上帝和祂的真理。人抵擋上帝，選擇作惡。他透過統治的方式來傷害殺戮，全為著自己的喜好，而非為著上帝的榮耀。因為犯罪，人類墮落得是何等深啊！我們是何等需要一位救主啊！</p>"}]},{"num":14,"title":"罪是什麼？","answer":"凡不遵守或違背上帝的律法的，都是罪。","hasDays":false,"mergedInto":15,"mergedFrom":null,"categoryId":"p1-5","days":[]},{"num":15,"title":"我們的始祖犯了什麼罪，使他們從當初受造的狀態中墮落了？","answer":"我們的始祖吃了禁果，使他們從當初受造的狀態中墮落了。","hasDays":true,"mergedInto":null,"mergedFrom":14,"categoryId":"p1-5","days":[{"day":1,"html":"<p>上帝完美的律法，給了我們標準，來判斷什麼是對、什麼是錯。上帝的律法是絕對的。意思是說，無論何時、無論何地，它都是一樣的。不管什麼時候，誰要是違背了上帝律法中的一條，那個人就犯罪了。有人可能覺得，在特定的處境當中，他/她沒辦法不違背上帝的律法；但是不管怎麼說，那仍舊是罪。請讀約翰一書3:4。</p><blockquote><p><strong>約翰一書3:4</strong><br>凡犯罪的，就是違背律法；違背律法，就是罪。</p></blockquote><p>違背律法就是不合乎律法、不遵守律法。</p><p>我們犯兩個方面的罪。上帝告訴我們不要做的事，我們做了，是犯罪。上帝告訴我們要做的事，我們沒做，也是犯罪。</p>"},{"day":2,"html":"<p>上帝告訴我們不要做，我們非要做，就是犯罪。第十四問的回答說，凡不遵守上帝律法的，*都*是罪。意思是說，就算只有一次沒遵守上帝的律法也是犯罪。上帝是聖潔的，祂的律法是聖潔的、絕對的（無論何時何地都是一樣的）。</p><p>就算我們順服了上帝頒佈的每一條命令，只是沒有遵守一條，照聖經所說，我們仍像是犯了上帝所有律法一樣有罪。請讀雅各書2:10-11。</p><blockquote><p><strong>雅各書2:10-11</strong><br>因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條。<br>原來那說不可姦淫的，也說不可殺人。你就是不姦淫，卻殺人，仍是成了犯律法的。</p></blockquote>"},{"day":3,"html":"<p>做了上帝不讓做的事，是犯罪。可是，不僅僅我們*做了*上帝不讓做的才是犯罪。當我們*想要做*上帝不讓我們做的事，就犯罪了。當我們喜愛、盼望或者嚮往著可以試探上帝所恨惡的事，我們就犯罪了。當我們並沒有真正實行，而只是思想或計劃罪惡，我們仍是在犯罪。請讀馬太福音5:21-22。</p><blockquote><p><strong>馬太福音5:21-22</strong><br>你們聽見有吩咐古人的話，說：『不可殺人』，又說：『凡殺人的，難免受審判。』<br>只是我告訴你們：凡向弟兄動怒的，難免受審判。凡罵弟兄是拉加的，難免公會的審斷；凡罵弟兄是魔利的，難免地獄的火。</p></blockquote>"},{"day":4,"html":"<p>當我們不去做上帝要我們做的事，我們是在犯罪。我們可能欺騙自己，以為只要沒有違背哪一條具體的律法，我們就是順服上帝了。不過，當我們沒有做正確的事，我們也犯罪了。請讀雅各書4:17。</p><blockquote><p><strong>雅各書4:17</strong><br>人若知道行善，卻不去行，這就是他的罪了。</p></blockquote><p>有時候，我們以為，既然我們知道上帝的旨意，那我們就是聖潔的，有基督的樣式了。知道上帝的旨意而不遵行，跟完全不知道上帝的旨意不過是半斤八兩。</p>"},{"day":5,"html":"<p>有人問耶穌，上帝所有誡命中最大的是什麼，耶穌說，是這一條：「盡心、儘性、盡意、盡力愛主你的上帝。」耶穌說，第二大的誡命是：「愛鄰舍如同自己。」如果我們一直完美地愛上帝、愛他人，我們就永不會犯罪了。如果我們總是把上帝和他人放在自己前面，我們就不會犯錯誤了。那樣我們就不會違背上帝的律法了。但是，每一天，我們每個人都是一再地把自己放在第一位。這樣我們所有人在每一天中都一再地犯罪。請讀羅馬書13:8-10。</p><blockquote><p><strong>羅馬書13:8-10</strong><br>凡事都不可虧欠人，惟有彼此相愛，要常以為虧欠，因為愛人的就完全了律法。<br>像那不可姦淫，不可殺人，不可偷盜，不可貪婪，或有別的誡命，都包在「愛人如己」這一句話之內了。<br>愛是不加害與人的，所以愛就完全了律法。</p></blockquote>"},{"day":6,"html":"<p>聖經說，做錯誤的事就是犯罪。沒有做正確的事，也是犯罪。上帝是全然聖潔的。祂從來不做錯事。祂只做正確的事。上帝對祂的受造物有同樣的要求。只要人達不到祂的要求，人就犯罪了。新約聖經的作者是用希臘文寫作。我們的聖經翻譯成「罪」的那個字，希臘文的意思是「未中目標」。這個詞是一個用來形容拉弓射箭的術語。這個詞的意思就是，你偏離了目標。偏離上帝全然公義的目標就是犯罪，就是虧缺了祂的榮耀。請讀羅馬書3:23。</p><blockquote><p><strong>羅馬書3:23</strong><br>因為世人都犯了罪，虧缺了神的榮耀。</p></blockquote>"}]},{"num":16,"title":"全人類都在亞當初次犯罪中墮落了嗎？","answer":"上帝和亞當所立的聖約，不單是為他自己，也是為了他的後裔；全人類都是按常例傳宗接代，由亞當而來，在亞當裡犯了罪，在他初次犯罪中與他一同墮落了。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-6","days":[{"day":1,"html":"<p>亞當像你平時看到的任何人一樣，是個真實的人。不過，在幾個重要的方面，亞當與其他人不同。舉個例子吧，亞當是唯一沒有出生過程和長大過程的男人。上帝把他造成一個成年人。再舉個例子，亞當是世界上第一個人。之後的每個人都是從亞當來的。就連夏娃也是從他的一條肋骨造出來的。至少有那麼一小段時間，亞當是整個世界上唯一的人。</p><p>亞當與其他人不同的最重要的一點在於：亞當是後來從他而出的全人類的代表。代表就是站在另一個人的位置上。不管代表做什麼，就彷彿是他所代表的人做的一樣。比如，兩個國家想要簽訂和平條約，不可能讓住在兩國的人民都聚在一起開會。於是，每個國家派個代表去開會。代表說什麼，就算是他的國家說的。如果代表簽了和平條約，就等於他的國家簽了和平條約。</p><p>有時候，人們選擇自己的代表。有時候，掌權的人替人們選代表。上帝選擇亞當，代表全人類。因為我們知道，上帝擁有完全的智慧，祂所做的都是美善，我們知道這是最好的選擇了。請讀羅馬書11:33和詩篇145:17。</p><blockquote><p><strong>羅馬書11:33</strong><br>深哉，神豐富的智慧和知識！他的判斷何其難測！他的蹤跡何其難尋！</p><p><strong>詩篇145:17</strong><br>耶和華在他一切所行的，無不公義；在他一切所做的都有慈愛。</p></blockquote>"},{"day":2,"html":"<p>第十二問的回答說，上帝與人立了約（協議），如果人順服就賜他生命。如果他不順服、吃了上帝告訴他不可吃的果子，他就會死亡。亞當是由他而出的全人類的代表。所以，當上帝立約的時候，祂不僅僅是在與亞當立約。上帝是與亞當肉身的後裔——亞當的兒女、孫輩、曾孫輩等等——就是所有由亞當而出的人立約。如果亞當選擇順服上帝，那就彷彿全人類都順服上帝了一樣。不僅亞當，而且整個人類將與上帝和睦共處並且有永生。但是，如果亞當不順服的話，整個人類就會經歷上帝所宣告的死亡。請讀羅馬書5:12。</p><blockquote><p><strong>羅馬書5:12</strong><br>這就如罪是從一人入了世界，死又是從罪來的，於是死就臨到眾人，因為眾人都犯了罪。</p></blockquote>"},{"day":3,"html":"<p>亞當是我們的代表。他犯罪的時候，在他裡面的所有人都犯了罪。當亞當從夏娃手裡接過禁果，咬了一口，就彷彿你我正在吃那個禁果，與他一同犯罪。上帝總是說話算話的。儘管亞當沒有在吃禁果的時候當場斃命，但是他的靈命已死。他跟上帝之間的關係不再正確，他無法再讓上帝喜悅。他的身體開始衰老，預備身體死亡的那一天。</p><p>上帝在亞當裡的形像已經扭曲了。亞當墮落了，而他是我們的代表，所以我們眾人都與他一同墮落了。亞當因為不順服帶來的後果，都同樣發生在我們身上，儘管我們那時甚至還沒有出生！請讀羅馬書5:14。</p><blockquote><p><strong>羅馬書5:14</strong><br>然而從亞當到摩西，死就作了王，連那些不與亞當犯一樣罪過的，也在他的權下。亞當乃是那以後要來之人的預像。</p></blockquote>"},{"day":4,"html":"<p>有個好訊息，就是上帝已經為祂的百姓選擇了另一個代表。上帝已經計劃，讓祂的獨生子降世為人。耶穌作為人，將活出完全順服的生命。祂一次也不會違背上帝任何的命令。耶穌代替所有後來相信祂的人活出了那種完全順服的生命。上帝召喚我們信靠耶穌基督，作為我們與上帝和好的唯一中保。當我們信靠祂，上帝就把耶穌完全順服的生命，算作我們自己活出來的一樣！請讀羅馬書5:15,18。</p><blockquote><p><strong>羅馬書5:15</strong><br>只是過犯不如恩賜。若因一人的過犯，眾人都死了，何況神的恩典，與那因耶穌基督一人恩典中的賞賜，豈不更加倍地臨到眾人嗎？</p><p><strong>羅馬書5:18</strong><br>如此說來，因一次的過犯，眾人都被定罪；照樣，因一次的義行，眾人也就被稱義得生命了。</p></blockquote>"},{"day":5,"html":"<p>儘管我信耶穌，祂完全的順服都算是我做的，可是我所有的罪惡怎麼辦呢？上帝是聖潔的，總是要懲罰罪惡。祂永遠不會說「這次就算了吧」。耶穌代替祂的百姓做了另一件奇妙的事。因為我們的罪惡，我們所有的人都是該死的，正如上帝向亞當說過的那樣。耶穌代替祂的百姓死了。祂承擔了他們犯罪應得的刑罰。請讀以賽亞書53:5-6。</p><blockquote><p><strong>以賽亞書53:5-6</strong><br>哪知他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。<br>我們都如羊走迷，各人偏行己路。耶和華使我們眾人的罪孽都歸在他身上。</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀羅馬書5:19。</p><blockquote><p><strong>羅馬書5:19</strong><br>因一人的悖逆，眾人成為罪人；照樣，因一人的順從，眾人也成為義了。</p></blockquote><p>這節經文第一處的「一人」，說的是亞當。第二處的「一人」，說的是耶穌基督。</p><p>亞當代表整個人類。當他悖逆上帝犯罪墮落的時候，我們也都在他裡面犯罪墮落了。耶穌代表祂所有的百姓。當祂完全順服的時候，祂是代表所有信祂的人做的。當他死在十字架上的時候，他代表著祂的百姓而死，為了要承擔他們罪惡的刑罰。</p><p>因上帝賜給我們耶穌，我們對上帝應當何等地感恩！因耶穌代替我們所做的一切，我們對耶穌應當何等的感恩！我們需要弄清楚：我們信的是耶穌，是耶穌完全公義的生命，是耶穌代替我們受死。這是我們能夠與上帝和好、得蒙上帝喜悅的唯一方式！</p>"}]},{"num":17,"title":"墮落使人類陷入什麼狀態中？","answer":"墮落使人類陷入罪惡和悲慘的狀態中。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-6","days":[{"day":1,"html":"<p>上帝曾經警告亞當，如果不順服就會死。亞當和夏娃咬那果子的時候，並沒有立刻倒地身亡。不過實際上他們裡面的屬靈生命已死，他們的身體開始走向死亡。當亞當和夏娃不順服的時候，他們和從他們而出的每一個人都成了罪惡和悲慘的人。我們先來看看，不理睬上帝的話，帶來什麼樣罪惡和悲慘的結局，然後我們再繼續讀下去。請讀創世記3:6-10。</p><blockquote><p><strong>創世記3:6-10</strong><br>於是，女人見那棵樹的果子好作食物，也悅人的眼目，且是可喜愛的，能使人有智慧，就摘下果子來吃了；又給她丈夫，她丈夫也吃了。<br>他們二人的眼睛就明亮了，才知道自己是赤身露體，便拿無花果樹的葉子，為自己編做裙子。<br>天起了涼風，耶和華神在園中行走。那人和他妻子聽見神的聲音，就藏在園裡的樹木中，躲避耶和華神的面。<br>耶和華神呼喚那人，對他說：「你在哪裡？」<br>他說：「我在園中聽見你的聲音，我就害怕，因為我赤身露體，我便藏了。」</p></blockquote><p>亞當和夏娃一吃那禁果，就發現自己赤身露體，十分尷尬。他們感到內疚和羞愧——這是以前從未有過的感覺。當他們知道上帝來了，他們就怕祂，藏起來了。他們以前從來沒有怕過上帝。他們以前一直愛祂、以祂為樂，超過世上萬物。現在罪已經把這一切都毀了。</p><p>上帝造我們，要我們成為聖潔，要我們幸福，要我們以祂為樂。結果呢，因著亞當的罪，我們也有了罪，心感羞愧，企圖逃避上帝。我們需要一位救主，來除掉我們的罪，使我們與上帝和好如初！</p>"},{"day":2,"html":"<p class=\"read-prompt\">請讀創世記 3:8-13。</p><blockquote><p><strong>創世記3:8-13</strong><br>天起了涼風，耶和華　神在園中行走。那人和他妻子聽見　神的聲音，就藏在園裡的樹木中，躲避耶和華　神的面。<br>耶和華　神呼喚那人，對他說：「你在哪裡？」<br>他說：「我在園中聽見你的聲音，我就害怕，因為我赤身露體，我便藏了。」<br>耶和華說：「誰告訴你赤身露體呢？莫非你吃了我吩咐你不可吃的那樹上的果子嗎？」<br>那人說：「你所賜給我、與我同居的女人，她把那樹上的果子給我，我就吃了。」<br>耶和華　神對女人說：「你做的是什麼事呢？」女人說：「那蛇引誘我，我就吃了。」</p></blockquote><p>因為亞當和夏娃犯了罪，害怕上帝，所以他們想要躲避上帝。當然，他們無法躲避上帝。祂在同一時間無所不在，祂能看到一切。上帝告訴他之所以藏起來，是因為他不好意思赤身露體。上帝知道亞當已經違背了，但是祂想讓亞當面對他已經做的事。於是上帝問他是不是吃了不該吃的禁果。</p><p>亞當走投無路，只好承認自己確實吃了——不過，他是在為自己的行為推卸責任之後才承認的！「你所賜給我、與我同居的女人，她把那樹上的果子給我，我就吃了。」亞當彷彿在說：「都是夏娃的錯；是她把果子給了我。」或者說：「都是上帝的錯！祂把夏娃給了我！」</p><p>上帝創造夏娃作為美好的禮物賜給亞當。現在亞當抱怨上帝的禮物。上帝本意是叫亞當保護照顧他的妻子。現在亞當為了保護自己，反而埋怨妻子。</p><p>上帝創造我們，是為了叫我們在家庭中幸福地生活，彼此成為祝福。但是，由於亞當的罪，夫妻吵架，彼此傷害。上帝創造我們是為了享受祂所賜給我們的許多福分，並且為此讚美祂。不過，由於亞當的罪，我們抱怨良善、完全的上帝。我們需要一位救主，使我們能夠照著上帝創造的目的來彼此相愛，享受上帝所賜的美好福分。</p>"},{"day":3,"html":"<p class=\"read-prompt\">請讀創世記 3:16-19。</p><blockquote><p><strong>創世記3:16-19</strong><br>又對女人說：「我必多多加增你懷胎的苦楚，你生產兒女必多受苦楚。你必戀慕你丈夫，你丈夫必管轄你。」<br>又對亞當說：「你既聽從妻子的話，吃了我所吩咐你不可吃的那樹上的果子，地必為你的緣故受咒詛。你必終身勞苦，才能從地裡得吃的。」<br>地必給你長出荊棘和蒺藜來，你也要吃田間的菜蔬。<br>你必汗流滿面才得餬口，直到你歸了土，因為你是從土而出的。你本是塵土，仍要歸於塵土。「</p></blockquote><p>上帝是聖潔的。在祂所造的世界裡，罪惡總是有後果的。上帝告訴亞當和夏娃，因為他們的罪，什麼事會臨到他們和他們的後代，以及全世界。祂告訴他們，將會有痛苦。你有沒有過受傷比較重的時候？你是否曾經只能眼睜睜地看著你所愛的人受苦？有時候因為疾病或者意外事故，我們的身體痛苦——或者甚至有人故意地傷害我們。有時候我們內心感受痛苦。那種痛苦雖然看不見，但也是一樣嚴重的傷害。如果亞當從沒有犯過罪，痛苦根本就不會存在。</p><p>上帝也說，將會有許多艱難。地裡將會長出荊棘、蒺藜。有時候天氣會熱得要命，有時候又會冷得要命。將會出現地震、洪水和其它自然災害。如果亞當順服了上帝，整個世界都仍然會像伊甸園一樣。</p><p>因為有了罪，就會有死亡。大多數人都最怕死亡。大多數人面對所愛的人去世，都最感悲痛。如果亞當完全順服了上帝，我們就永遠不會因為死亡而失去我們所愛的人，我們自己也永遠不需要擔心死亡的事。</p><p>上帝創造我們，要我們快樂、健康。不過，由於亞當的罪，我們感受到的是痛苦和憂傷。上帝創造萬有賜給我們。不過，由於亞當的罪，自然常常與我們作對。上帝賜我們生命，可是現在人人都得死。我們需要一位救主，除去悲傷、痛苦，讓自然重新為人效力，榮耀上帝。我們需要一位能夠勝過死亡，並且能夠賜給我們永生的救主。</p>"},{"day":4,"html":"<p class=\"read-prompt\">請讀創世記 4:1-10。</p><blockquote><p><strong>創世記4:1-10</strong><br>有一日，那人和他妻子夏娃同房，夏娃就懷孕，生了該隱，便說：「耶和華使我得了一個男子。」<br>又生了該隱的兄弟亞伯。亞伯是牧羊的，該隱是種地的。<br>有一日，該隱拿地裡的出產為供物獻給耶和華；<br>亞伯也將他羊群中頭生的和羊的脂油獻上。耶和華看中了亞伯和他的供物，<br>只是看不中該隱和他的供物。該隱就大大地發怒，變了臉色。<br>耶和華對該隱說：「你為什麼發怒呢？為什麼變了臉色呢？<br>你若行得好，豈不蒙悅納？你若行得不好，罪就伏在門前。它必戀慕你，你卻要制伏它。」<br>該隱與他兄弟亞伯說話，二人正在田間，該隱起來打他兄弟亞伯，把他殺了。<br>耶和華對該隱說：「你兄弟亞伯在哪裡？」他說：「我不知道！我豈是看守我兄弟的嗎？」<br>耶和華說：「你做了什麼事呢？你兄弟的血有聲音從地裡向我哀告。</p></blockquote><p>聖經告訴我們，兒女是上帝所賜的福，兒女眾多的家庭是快樂的家庭。上帝賜給亞當夏娃兒女，可是由於罪，他們的家庭不是一個十分幸福的家。亞當的兒子該隱和亞伯長大以後，該隱嫉妒他的兄弟亞伯。祂對弟弟動怒，打死了他。</p><p>上帝本來要人們彼此相伴。上帝創造我們，要我們彼此相愛，彼此欣賞。祂計劃要人們彼此需要，彼此幫助。不過，由於亞當的罪，人們自私自利，只顧自己。我們因為一些雞毛蒜皮的小事就大動肝火，通常是因為我們沒有說了算。我們吵架、罵人、講究別人。人們都想彼此傷害、殺戮、爭鬥。我們需要一位救主，改變我們的心，讓我們能夠愛上帝和他人勝過愛自己。</p>"},{"day":5,"html":"<p class=\"read-prompt\">請讀創世記 5:1-3。</p><blockquote><p><strong>創世記5:1-3</strong><br>亞當的後代記在下面。當　神造人的日子，是照著自己的樣式造的，<br>並且造男造女。在他們被造的日子，　神賜福給他們，稱他們為人。<br>亞當活到一百三十歲，生了一個兒子，形像樣式和自己相似，就給他起名叫塞特。</p></blockquote><p>上帝造人是照著誰的形像造的？當亞當的兒子塞特出生的時候，他的形像樣式和誰相似？上帝造人，本是良善公義的。如果亞當順服了上帝，他所有的兒孫都將照著上帝的形像來到這個世上，有良善有公義。我們仍然是上帝的形像，不過自從亞當悖逆上帝，這個形像已經受損了。現在，我們也是以亞當的形像出生。意思是說，我們在亞當和他家人生活中所看到的一切犯罪、躲避上帝、埋怨別人，這些東西也在我們裡面。</p><p>亞當一家的悲傷、痛苦、死亡、自私、憤怒、仇恨，也成為了我們的一部分。上帝所造的第一個家庭的故事完全可以是一個幸福的故事！相反，卻成為了讓人悲哀失望的故事。亞當的家庭和我們，沒有給其他受造物顯明上帝的屬性，反而成了罪惡滔天的怪物。我們只為自己活，帶來各種的醜惡。我們需要一位救主，修復我們裡面上帝的形像，使我們能夠反映祂的榮耀。</p>"},{"day":6,"html":"<p>創世記的前兩章講述了上帝創造包括人在內的萬事萬物，這是個美麗的故事。接下來的幾章講述了亞當犯罪及其後果的悲慘沮喪故事。這是亞當夏娃與神為敵、彼此為敵的故事。這是他們的一個兒子殺害兄弟的故事。這個故事繼續講述亞當的後裔如何生來就像亞當那樣有了罪，處於何種的苦境之中，他們最終都得如何面對死亡。最後，故事講述了全世界每個人都如此邪惡，以至於上帝用洪水毀滅了它。祂只保護挪亞一家人。</p><p>在這一切的悲劇中間，上帝作出一個非常好的應許。就在亞當和夏娃犯罪之後，在上帝告訴他們後果之前，上帝作出這個美妙的承諾。祂是在向撒但說話的時候講出這個應許的，撒但曾誘惑夏娃摘下果子吃。請讀創世記 3:15 中這奇妙的應許。</p><blockquote><p><strong>創世記3:15</strong><br>我又要叫你和女人彼此為仇；你的後裔和女人的後裔也彼此為仇。女人的後裔要傷你的頭；你要傷他的腳跟。「</p></blockquote><p>上帝應許，有一天一個女人生下一個孩子。這個孩子要消滅撒但，除掉他的作為。這個孩子會除去罪惡，使人與上帝和好。祂將成為改變我們心靈的救主，使我們能夠愛上帝，也彼此相愛。祂將恢復我們裡面上帝的形像，除去罪惡、悲傷、消除死亡，好讓我們永遠與上帝同住。感謝上帝信守諾言，把耶穌賜給我們作我們的救主！</p>"}]},{"num":18,"title":"人墮落的狀態中，其罪惡有哪些？","answer":"人墮落的狀態中，其罪惡有：一、亞當初犯的罪辜、原有仁義的喪失、人性全面的敗壞（通常稱為原罪），二、人從罪性所發出的一切過犯。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-6","days":[{"day":1,"html":"<p>這個問題的答案告訴我們，每個人在兩個方面有罪。我們因為裡面的本性而有罪，我們也因為外面的行為而有罪。我們不僅僅做了犯罪的事，我們本身就是有罪的人。我們外面犯罪的原因在於我們裡面就是罪人。今天，還有許多人相信「人之初，性本善」。人們都傾向於以為如果不去影響一個人，那麼這個人自然就會做好事，就會愛人，不會犯罪。人們常說，人之所以犯罪，都是因為別人對他不好。他們會說，每個孩子生下來是好人，不過如果他很窮，或者他沒有好父母，他就會幹壞事。</p><p>聖經可不是這麼說的。聖經說，因為墮落的緣故，所有人生下來，在裡面就有了罪性。我們大家都是罪人，沒有一個生下來就是好人。我們做罪惡的事，因為我們是罪惡的人。請讀詩篇 58:3 和馬太福音 15:18-19。</p><blockquote><p><strong>詩篇58:3</strong><br>惡人一出母胎，就與　神疏遠；一離母腹，便走錯路，說謊話。</p><p><strong>馬太福音15:18-19</strong><br>惟獨出口的，是從心裡發出來的，這才汙穢人。<br>因為從心裡發出來的，有惡念、兇殺、姦淫、苟合、偷盜、妄證、謗瀆。</p></blockquote>"},{"day":2,"html":"<p>我們在上帝面前是有罪的，因為我們的行為；我們在上帝面前是有罪的，因為我們的本性。我們是人。亞當作為全人類的代表違背了上帝，所以所有的人類都有了罪。亞當把他的罪傳遞給了所有由他而出的人。由於亞當，我們生來就有罪。</p><p>我們生來就帶著亞當的罪，不僅如此，因為亞當，我們生來就缺少一些東西。當上帝創造人的時候，祂造人是公義正直的。這就是我們所謂的「原初的義」。就是上帝造人的時候給人的義。人藉著上帝所賜的原初的義，可以自願選擇做上帝喜悅的事。</p><p>亞當選擇犯罪的時候，他失去了上帝所賜原初的義。他不再能夠做上帝喜悅的事。他只能犯罪。亞當失去的不僅是自己原初的義，也是全人類的。再沒有一個凡人，生來具有原初的義了。所有的人都生來在上帝面前就有罪，不能做上帝喜悅的事。原罪的意思就是我們生來就有的罪，還有我們在行善方面的無能為力。請讀詩篇 14:2-3 和以賽亞書 64:6。</p><blockquote><p><strong>詩篇14:2-3</strong><br>耶和華從天上垂看世人，要看有明白的沒有，有尋求　神的沒有。<br>他們都偏離正路，一同變為汙穢；並沒有行善的，連一個也沒有！</p><p><strong>以賽亞書64:6</strong><br>我們都像不潔淨的人，所有的義都像汙穢的衣服；我們都像葉子漸漸枯乾，我們的罪孽好像風把我們吹去。</p></blockquote>"},{"day":3,"html":"<p>因為亞當的罪，我們整個的本性已經敗壞了。意思是說，現在我們的每一個部分都出了問題。上帝造人的時候，人是所有受造物中最美好的，但是人因為犯罪使自己變得那麼不好。罪破壞了我們的每一個部分。罪破壞了我們的身體，以至於我們現在會生病，會受傷，或者有的器官不好用了。因為罪，我們的身體會衰老、死亡。</p><p>罪也破壞了我們的思想。上帝給我們思想，來學習認識祂。可是，因為罪，我們使用我們的思想來想邪惡的事、做邪惡的計劃。我們的思想敗壞到了一個程度，以至於人自己無法理解上帝在聖經中所說的事情。請讀哥林多前書 2:14。</p><blockquote><p><strong>哥林多前書2:14</strong><br>然而，屬血氣的人不領會　神聖靈的事，反倒以為愚拙，並且不能知道，因為這些事惟有屬靈的人才能看透。</p></blockquote><p>我們的心也被罪破壞了。上帝給我們情感，讓我們可以愛祂，渴望善事。但是我們的心，我們的情感現在是有罪的，於是我們愛該恨的，恨該愛的。我們享受、渴慕上帝所禁止的事情。我們不喜歡禱告，不喜歡去敬拜，也不喜歡服侍人。因為我們的心是有罪的，我們把情感都用在了錯誤的事情上。請讀約翰福音 3:19。</p><blockquote><p><strong>約翰福音3:19</strong><br>光來到世間，世人因自己的行為是惡的，不愛光倒愛黑暗，定他們的罪就是在此。</p></blockquote><p>上帝給人分辨善惡的能力，那是動物魚鳥所沒有的。人有意志力，所以人能夠選擇行善。罪破壞了我們的意志力，以至於我們使用意志來作惡。我們作錯誤的選擇，不僅是因為我們無知，我們選擇做錯事，因為我們是有罪的。請讀約翰福音 5:39-40。</p><blockquote><p><strong>約翰福音5:39-40</strong><br>你們查考聖經，因你們以為內中有永生；給我作見證的就是這經。<br>然而你們不肯到我這裡來得生命。</p></blockquote>"},{"day":4,"html":"<p>儘管我們身上還是有不少好的地方，但是我們每一個部分都受到了破壞——身體、思想、情感和意志。我們沒有使用上帝所賜給我們的來服侍上帝，反而用它來犯罪。我們不能做什麼來改變自己。我們靠自己沒辦法明白上帝話語的屬靈真理。就算我們的思想明白，我們的心也不會愛慕它。靠著自己，我們的意志也沒有力量來選擇上帝的旨意。請讀耶利米書 13:23。</p><blockquote><p><strong>耶利米書13:23</strong><br>古實人豈能改變皮膚呢？豹豈能改變斑點呢？若能，你們這習慣行惡的便能行善了。</p></blockquote><p>因為罪的緣故，沒有人能轉向上帝，開始愛祂、為祂而活。</p><p>我們本身是沒有指望了，我們無力改變成為另外的樣式。我們是多麼需要一位救主啊！上帝賜下耶穌作為我們的救主，祂為我們做了我們自己做不到的，我們該是何等的感恩啊！</p>"},{"day":5,"html":"<p>在過去的幾天裡，我們看到了，作為罪人的我們是什麼樣子的。我們生來就在一種罪的、墮落的狀態裡。我們生來有罪，是因為亞當的罪，我們沒有自己的義可以讓上帝喜悅。我們生來敗壞——或者說是被罪破壞了——在我們整個的本性，以及我們的每一個部分都是如此。這只是我們罪惡的一部分。所有這些東西來自於亞當的罪，是一代一代傳給我們的。</p><p>我們罪惡的另一部分就是，我們每天選擇犯罪作惡。像亞當一樣，我們自己選擇違背上帝。如果我們一生中，每天只犯一次罪，那麼我們也會是很大的罪人了。更何況我們可不是一天只犯一次罪。我們每個人每天都犯罪很多次。我們所犯的具體的悖逆的行為，就構成了我們的罪惡的另一個部分。請讀羅馬書 3:10-18，看看這裡如何描述所有人。</p><blockquote><p><strong>羅馬書3:10-18</strong><br>就如經上所記：「沒有義人，連一個也沒有！<br>沒有明白的，沒有尋求　神的；<br>都是偏離正路，一同變為無用。沒有行善的，連一個也沒有！」<br>「他們的喉嚨是敞開的墳墓；他們用舌頭弄詭詐。」「嘴唇裡有虺蛇的毒氣。」<br>「滿口是咒罵苦毒。」<br>「殺人流血，他們的腳飛跑，<br>所經過的路，便行殘害暴虐的事；<br>平安的路，他們未曾知道。<br>」他們眼中不怕　神。「</p></blockquote>"},{"day":6,"html":"<p>人們不喜歡思想自己的罪。他們寧可以為，上帝愛每一個人，他們犯罪的時候上帝也不在意。聖經告訴我們，上帝是聖潔的，當有罪阻隔的時候，上帝不會接納和喜愛任何一個人。我們在兩個方面有罪。我們因為帶著亞當的罪性而有罪，我們因為主動犯的錯誤而有罪。我們不想罪的時候，也許感覺會比較好，但是上帝不會照著我們現在的狀況接納和祝福我們。當我們想到我們的罪，我們就看出我們是何等地需要一位救主。請讀約翰一書 1:8-9。</p><blockquote><p><strong>約翰一書1:8-9</strong><br>我們若說自己無罪，便是自欺，真理不在我們心裡了；<br>我們若認自己的罪，　神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。</p></blockquote>"}]},{"num":19,"title":"人墮落的狀態中，其悲慘是什麼？","answer":"全人類由於墮落，喪失了與上帝的交通，落在上帝的忿怒和咒詛之下，所以應受今生一切的愁苦、死亡，以及地獄永遠的痛苦。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-6","days":[{"day":1,"html":"<p>由於亞當的墮落，人類不僅有了罪，而且處於悲慘的狀態之中。墮落之後，人最悲慘的狀況就是，他與上帝隔絕。你還記得要理問答第一問的答案吧：「人的主要目的是，榮耀上帝，以祂為樂，直到永遠。」由於犯罪，人不能照著上帝創造他的目的去做。上帝恨惡罪惡，只要有罪阻隔，上帝就不會與人建立關係。請讀以賽亞書 59:2 和以弗所書 2:12。</p><blockquote><p><strong>以賽亞書59:2</strong><br>但你們的罪孽使你與　神隔絕。你們的罪惡使他掩面不聽你們。</p><p><strong>以弗所書2:12</strong><br>那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有　神。</p></blockquote>"},{"day":2,"html":"<p>由於人的罪，上帝不僅與人無關，而且因此對人非常忿怒。人不喜歡談論上帝的忿怒。他們樂於思想上帝的慈愛和良善，但是上帝的忿怒與慈愛和良善一樣，是祂屬性的一部分。聖經明說，罪惡使上帝忿怒。我們發怒的時候，往往是出於自私和錯誤。但是上帝的憤怒是義怒。祂的憤怒總是帶出行動。這就是為什麼上帝總是懲罰罪惡。請讀那鴻書 1:2-3, 6。</p><blockquote><p><strong>那鴻書1:2-3</strong><br>耶和華是忌邪施報的　神。耶和華施報大有忿怒；向他的敵人施報，向的仇敵懷怒。<br>耶和華不輕易發怒，大有能力，萬不以有罪的為無罪。他乘旋風和暴風而來，雲彩為他腳下的塵土。</p><p><strong>那鴻書1:6</strong><br>他發忿恨，誰立得住呢？他發烈怒，誰能當得起呢？他的忿怒如火傾倒，磐石因他崩裂。</p></blockquote><p>有時候人們說：「上帝對罪發怒，但是祂不對人發怒。」這也不對。聖經告訴我們，在我們信靠基督之前，我們跟別人一樣——我們是上帝「憤怒的物件」（參弗 2:3）。上帝不僅對於我們的罪憤怒；祂對我們這些罪人也是憤怒的。</p>"},{"day":3,"html":"<p>人是悲慘的，因為他與上帝隔絕。人是悲慘的，也因為上帝對他是憤怒的。因為人的罪，上帝那種能夠融化山嶺、摧毀世界的烈怒，就指向了人。想起來就讓人害怕：偉大、聖潔、擁有所有權柄的上帝向我們發怒！聖經告訴我們「落在永生上帝的手裡，真是可怕的！」（希伯來書 10:31）啟示錄描述了世界末了的時候，上帝為罪所施行的審判。凡是沒有信靠基督來救他們脫離罪惡的人，都將懼怕戰兢。他們將知道，基督要再臨，祂對他們發怒。請讀啟示錄 6:15-17。</p><blockquote><p><strong>啟示錄6:15-17</strong><br>地上的君王、臣宰、將軍、富戶、壯士和一切為奴的、自主的，都藏在山洞和岩石穴裡，<br>向山和岩石說：「倒在我們身上吧！把我們藏起來，躲避坐寶座者的面目和羔羊的忿怒，<br>因為他們忿怒的大日到了，誰能站得住呢？」</p></blockquote>"},{"day":4,"html":"<p class=\"read-prompt\">請讀傳道書 2:22-23。</p><blockquote><p><strong>傳道書2:22-23</strong><br>人在日光之下勞碌累心，在他一切的勞碌上得著什麼呢？<br>因為他日日憂慮，他的勞苦成為愁煩，連夜間心也不安。這也是虛空。</p></blockquote><p>人類墮落後的悲慘，也包括今生生活的一切問題、愁煩和勞累。亞當犯罪之後，上帝告訴他：「地因你受了咒詛（創 3:17）」。這句話的意思是，整個地球都因為罪的緣故，與從前不一樣了。當上帝起初造地球的時候，沒有什麼會帶來憂慮痛苦。植物沒有荊棘。工作是種享受，絕不艱難。什麼也不傷人。現在，因為罪的緣故，人常常面對可悲的事情。</p><p>人們身體受傷，情感也受傷。疾病攻擊我們的身體，也攻擊我們的思想。人一生面對各種愁煩。這些事，有的只是讓我們心煩意亂。但是有些事讓我們悲傷得不想活下去了。所有的這些傷害、悲哀和艱難，都是罪給全地帶來的咒詛的一部分。因為人處於墮落的狀態，所有這些就臨到了人。</p>"},{"day":5,"html":"<p class=\"read-prompt\">請讀詩篇 49:10 和詩篇 103:15-16。</p><blockquote><p><strong>詩篇49:10</strong><br>他必見智慧人死，又見愚頑人和畜類人一同滅亡，將他們的財貨留給別人。</p><p><strong>詩篇103:15-16</strong><br>至於世人，他的年日如草一樣，他發旺如野地的花；<br>經風一吹，便歸無有，他的原處，也不再認識他。</p></blockquote><p>所有人都會面對的一個悲劇就是，他們知道有一天他們的生命會走到盡頭。每個人都知道自己會死，沒有人想死。如果亞當從未犯過罪，我們的生命就不會終結。人們想到死就憂愁。對於死亡的方式和時間，他們十分憂愁。他們寧願不必死亡。當所愛之人死亡，無法繼續同在的時候，人們非常悲傷。因為罪，死亡才存在。罪奪取了上帝創造的美善事物，把它變成了悲傷醜陋的東西。死亡給全人類帶來悲劇。</p>"},{"day":6,"html":"<p>死亡之所以讓人如此愁煩，因為人們害怕死後的事。從來沒有信靠耶穌基督做他們唯一救主的人有所恐懼。聖經告訴我們，人得罪上帝，後果嚴重，上帝在罪人死後有一個審判的地方為他預備。這就是地獄，是永遠持續的折磨和悲慘的地方。請讀帖撒羅尼迦後書 1:8-9。</p><blockquote><p><strong>帖撒羅尼迦後書1:8-9</strong><br>要報應那不認識　神和那不聽從我主耶穌福音的人。<br>他們要受刑罰，就是永遠沉淪，離開主的面和他權能的榮光。</p></blockquote><p>人的悲慘是徹底的。他活在勞苦愁煩之中，與上帝隔絕，而他被造原是要以上帝為樂的。他會死，死後去到一個永遠受刑罰的地方。罪所帶來的是何等的災難啊！我們是何等地需要一位救主，來救我們脫離慘況呢！</p>"}]},{"num":20,"title":"上帝任憑人類都在罪惡和悲慘中沉淪嗎？","answer":"上帝全然根據自己的美意，在萬古之先，揀選了一些人得永生，就設立了恩典之約，要藉著一位救贖主，拯救他們脫離罪惡和愁苦，進入蒙拯救的狀態。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-7","days":[{"day":1,"html":"<p>亞當和夏娃由於悖逆，落入罪惡和愁苦中，不過上帝立即給他們一個得安慰的應許。上帝應許，有一天，有一位女人的後裔將打碎那曾欺騙他們的撒但的頭。</p><p>人類的墮落，有著可怕的後果：痛苦、死亡、上帝的審判，這並沒有讓上帝措手不及。上帝的計劃一直是這樣的：祂的百姓之所以成為祂的百姓，不是因為他們為自己做了什麼，而是因為上帝為他們做了什麼。在墮落之後的千百年，上帝的百姓等待著上帝應許的那位救主的降生。整部舊約都在盼望祂的到來。舊約包含許多預言，都在耶穌身上完全應驗了。這些舊約預言，有的講到了應許的那一位會為祂的百姓做什麼。祂要承擔他們罪所應得的審判，代表他們活出完全順服上帝的生命，這樣就把他們從罪惡和愁苦中拯救出來了。我們來看一看耶穌降生前幾百年寫下的一個這樣的預言。請讀以賽亞書 53:5-6,11。</p><blockquote><p><strong>以賽亞書53:5-6</strong><br>哪知他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。<br>我們都如羊走迷，各人偏行己路。耶和華使我們眾人的罪孽都歸在他身上。</p><p><strong>以賽亞書53:11</strong><br>他必看見自己勞苦的功效，便心滿意足。有許多人因認識我的義僕得稱為義，並且要擔當他們的罪孽。</p></blockquote>"},{"day":2,"html":"<p>上帝與祂的百姓立了恩典之約。約就是一種協議，在符合某些條件的前提下，承諾提供益處。恩典就是人們在任何方面都不配得到的好處和祝福。上帝與祂的百姓立了恩典之約。祂同意賜給他們許多他們不配得到的禮物和福分。在這個約中，與其他的約一樣，如果上帝的百姓想要得到福分，那麼必須符合一些條件。上帝應許，祂自己會滿足那些條件。</p><p>你還記得這一問的答案嗎？「上帝有幾個位格？」（上帝有三位格：聖父、聖子、聖靈；這三位格就是同一真神，同本質，同權能，同榮耀。）這三位格都參與了立約和守約。聖父上帝揀選了一些人作祂的兒女。</p><p>雖然這些人跟所有人一樣，應該遭受上帝的忿怒，不過上帝選擇去愛他們。儘管他們由於犯罪，應該受死，不過上帝選擇用某種方式來賜他們永生。聖父上帝本來不必揀選任何人。祂之所以選擇將祂的愛和永生賜給他們，完全是因為祂是有恩典的上帝，是賜給人不配得到的福分的上帝。如果你已經信靠耶穌作為上帝所賜的救主，你對上帝揀選你作祂的兒女是何等的感恩！請讀以弗所書 1:3-6。</p><blockquote><p><strong>以弗所書1:3-6</strong><br>願頌讚歸與我們主耶穌基督的父　神！他在基督裡曾賜給我們天上各樣屬靈的福氣。<br>就如　神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵；<br>又因愛我們，就按著自己意旨所喜悅的，預定我們藉著耶穌基督得兒子的名分，<br>使他榮耀的恩典得稱讚。這恩典是他在愛子裡所賜給我們的。</p></blockquote>"},{"day":3,"html":"<p>在上帝與祂百姓所立的恩典之約中，聖子上帝有非常重要的角色。祂成為人，滿足了約中所有的要求，這樣上帝的百姓可以得到所有的好處。在世界上還沒人之前，甚至在世界被造之前，上帝就揀選了將要成為祂特殊百姓的人們。祂將這些人交託給聖子上帝，聖子上帝將拯救他們脫離罪惡。</p><p>耶穌來到世界，為自己的百姓完成上帝的旨意。耶穌降世捨命，為要上帝百姓中的每一個人都得生命（約翰福音 6:37-40）。</p><blockquote><p><strong>約翰福音6:37-40</strong><br>凡父所賜給我的人，必到我這裡來；到我這裡來的，我總不丟棄他。<br>因為我從天上降下來，不是要按自己的意思行，乃是要按那差我來者的意思行。<br>差我來者的意思就是：他所賜給我的，叫我一個也不失落，並且在末日卻叫他復活。<br>因為我父的意思是叫一切見子而信的人得永生，並且在末日我要叫他復活。</p></blockquote><p>如果你已經信靠耶穌把你從罪惡中拯救出來，那麼祂在上帝面前順服的生命，就是為你而作的。祂為你獲得了上帝恩典之約中的一切福分，而你永無可能靠自己得到。你已經賺來的是上帝的忿怒和審判，但是耶穌在十字架上受死的時候，祂已經為你承擔了這些。聖子上帝降世，為了你遵守了約中所有的要求，使你可以享受此約所有的福分，你應該何等的感恩呢！請讀以弗所書 1:7-12。</p><blockquote><p><strong>以弗所書1:7-12</strong><br>我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。<br>這恩典是　神用諸般智慧聰明，充充足足賞給我們的，<br>都是照他自己所預定的美意，叫我們知道他旨意的奧秘，<br>要照所安排的，在日期滿足的時候，使天上地上一切所有的，都在基督裡面同歸於一。<br>我們也在他裡面得了基業，這原是那位隨己意行作萬事的，照著他旨意所預定的，<br>叫他的榮耀，從我們這首先在基督裡有盼望的人，可以得著稱讚。</p></blockquote>"},{"day":4,"html":"<p>聖靈上帝在上帝與祂百姓所立的約中也有重要的角色。罪已經使我們的心思矇蔽，無法靠自己理解福音。聖靈賜下屬靈的悟性，讓上帝的百姓能夠聽了福音就明白。人如果順其自然，都會喜愛罪惡。他們不在乎上帝對罪惡的忿怒。聖靈改變上帝百姓的心意，使他們恨惡罪惡，轉向基督，讓基督救他們脫離罪惡。聖子為祂的百姓贏得了恩典之約所有的福分。聖靈上帝把這些福分實施在上帝所揀選的特定的人身上。</p><p>耶穌為祂百姓所獲得的一些福分，要等到耶穌再來的時候才會賜下來。在那之前，聖靈都住在他們裡面。祂保證，他們最終會得到耶穌為他們獲得的一切。如果你已經信靠耶穌作你的救主，那麼對於聖靈賜你對福音的悟性，對於聖靈更新你的心意，使你能夠信耶穌，你應該是何等地感恩啊！請讀以弗所書 1:13-14。</p><blockquote><p><strong>以弗所書1:13-14</strong><br>你們既聽見真理的道，就是那叫你們得救的福音，也信了基督，既然信他，就受了所應許的聖靈為印記。<br>這聖靈是我們得基業的憑據，直等到　神之民被贖，使他的榮耀得著稱讚。</p></blockquote>"},{"day":5,"html":"<p>如果上帝只揀選了一些人得永生，那為什麼上帝揀選他們，沒有揀選別人呢？祂是不是揀選那些聰明過人的，或是那些更加善良的？聖經回答說「不」。在被揀選的人中，沒有哪個人身上，有任何東西使上帝非要揀選他不可的。沒有人可以對於上帝揀選他這件事感到驕傲。上帝揀選了誰，就是因為祂要揀選誰，不是因為那個人有什麼優點。</p><p>聖經講到兩個孿生兄弟的事，他們一個叫雅各，一個叫以掃。雖然上帝對他們都很好，不過上帝揀選了雅各，給他特別的賜福。上帝揀選雅各來認識上帝，成為彌賽亞的先祖。甚至在這對雙胞胎沒有出生之前，上帝就告訴他們的母親利百加，祂已經揀選了雅各，要以特別的愛來愛他。既然兩個孩子都還沒有生出來，哪一個也還沒有做什麼事，讓上帝想要揀選他。上帝揀選了雅各，完全是因為祂想要揀選雅各。請讀羅馬書 9:10-17。</p><blockquote><p><strong>羅馬書9:10-17</strong><br>不但如此，還有利百加，既從一個人，就是從我們的祖宗以撒懷了孕。<br>（雙子還沒有生下來，善惡還沒有作出來，只因要顯明　神揀選人的旨意，不在乎人的行為，乃在乎召人的主。）<br>神就對利百加說：「將來大的要服事小的。」<br>正如經上所記：「雅各是我所愛的，以掃是我所惡的。」<br>這樣，我們可說什麼呢？難道　神有什麼不公平嗎？斷乎沒有！<br>因他對摩西說：「我要憐憫誰，就憐憫誰；要恩待誰，就恩待誰。」<br>據此看來，這不在乎定意的，也不在乎奔跑的，只在乎發憐憫的神。<br>因為經上有話向法老說：「我將你興起來，特要在你身上彰顯我的權能，並要使我的名傳遍天下。」</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀羅馬書 8:28-30。</p><blockquote><p><strong>羅馬書8:28-30</strong><br>我們曉得萬事都互相效力，叫愛　神的人得益處，就是按他旨意被召的人。<br>因為他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子在許多弟兄中作長子。<br>預先定下的人又召他們來；所召來的人又稱他們為義；所稱為義的人又叫他們得榮耀。</p></blockquote><p>這段經文說的是上帝的預定，或者說預先揀選，一些人作祂的兒女。經文說，祂預先所知道的人，祂預定揀選他們。這不是說，上帝預見未來，看到誰會相信祂的兒子，然後再揀選這些人作祂的兒女。預先知道並不是這個意思。這個詞的意思不是指上帝預先知道祂的百姓會做什麼；而是指，祂預先認識祂的百姓。在祂的百姓還沒有出生之前，上帝就認識他們，是那種你與朋友相知的認識。祂能夠在祂百姓出生之前就認識他們，是因為祂就是那位造他們的主。當然，上帝知道祂的百姓會信靠祂的兒子，不過祂並不是因為他們會信而揀選他們；反而是，因為祂揀選他們，他們才會信。</p>"}]},{"num":21,"title":"上帝選民的救贖主是誰？","answer":"上帝選民唯一的救贖主是主耶穌基督，祂從永遠就是上帝的兒子，降世為人，此後具有可識別的神人二性，是一位格，直到永遠。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-7","days":[{"day":1,"html":"<p>在舊約時代，土地對於人們來說非常重要，因為大多數人都是農民。農民必須有土地才能耕種。不過，有時候，有人會窮到必須賣掉田地的地步。在舊約時代，一個被稱為「買贖者」的親屬可以把那窮人的田地買回來，歸還到他手中。一位買贖者要付出代價，才能為原來的主人買回他的財產。</p><p>耶穌是上帝百姓的買贖者。上帝的百姓一直屬於上帝，不過罪孽使他們與上帝隔絕，所以他們無法被稱作上帝的百姓了。耶穌用自己的血，付出了重價，為真正的主人把上帝的百姓買回來了。請讀啟示錄 5:9，在天上對耶穌的頌讚。</p><blockquote><p><strong>啟示錄5:9</strong><br>他們唱新歌，說：「你配拿書卷，配揭開七印。因為你曾被殺，用自己的血從各族、各方、各民、各國中買了人來，叫他們歸於　神。」</p></blockquote>"},{"day":2,"html":"<p>耶穌基督是降生在馬槽的時候，才開始祂的生命嗎？耶穌基督是在馬利亞的肚子裡面孕育的時候開始祂的生命嗎？聖經告訴我們，耶穌是上帝的兒子。因為祂是上帝，祂的生命沒有開始。祂一直活著。在祂沒有降世為人之前，在沒有地球之前，上帝的兒子就在。彌迦書 5:2 是一個有名的預言。在耶穌降生之前幾百年，它就預言，上帝應許的掌權者要生在哪一個小城裡。請讀這節經文，看看它對於上帝所應許的那位掌權者，祂的根源（開始）是在哪裡呢？</p><blockquote><p><strong>彌迦書5:2</strong><br>「伯利恆、以法他啊，你在猶大諸城中為小，將來必有一位從你那裡出來，在以色列中為我作掌權的；他的根源從亙古、從太初就有。」</p></blockquote><p>約翰福音1:1-2 說耶穌是「道」。讀一讀，看看經文說祂存在多久了。</p><blockquote><p><strong>約翰福音1:1-2</strong><br>太初有道，道與　神同在，道就是　神。<br>這道太初與　神同在。</p></blockquote>"},{"day":3,"html":"<p>耶穌並非一直是人，但是祂一直是上帝。祂降世為人的時候，在很多方面都限制了自己，不過祂從來沒有一刻不是上帝的。經文告訴我們，耶穌有許多美妙的名字。其中有一個名字叫做「以馬內利」，意思就是「上帝與我們同在」。（馬太福音 1:23）</p><p>耶穌在一生中所做的事情，顯明祂是上帝。當祂呵斥風浪，風浪也聽祂，這顯明祂是那位創造的主。當祂說話，回答人們心中尚未講出的疑惑時，祂顯出祂知道萬事。當耶穌為人醫病，當鬼也聽祂，這就顯明耶穌擁有所有的權柄。當耶穌度過一生從未犯罪，就顯明祂是聖潔的。耶穌最清楚地顯明自己是上帝的時候，就是當祂從死裡復活的時候。藉著祂作為上帝的能力，耶穌受死之後復活了。除祂以外再沒有人曾經如此，因為沒有人像祂一樣是上帝。請讀羅馬書 1:3-4。</p><blockquote><p><strong>羅馬書1:3-4</strong><br>論到他兒子我主耶穌基督，按肉體說，是從大衛後裔生的；<br>按聖善的靈說，因從死裡復活，以大能顯明是　神的兒子。</p></blockquote>"},{"day":4,"html":"<p>耶穌作為上帝，一直都存在。在歷史中的某一日，祂又成為人。祂取了人的身體靈魂，孕育在被選為祂母親的女子腹中。祂在母親腹中懷胎十月，像每個人一樣，也像常人一樣地出生。耶穌逐漸長成幼童、少年、成人，跟所有人的成長過程一樣。</p><p>當我們讀到，耶穌餓了，就差門徒買食物；祂累了，就在風暴中仍然睡覺，我們就知道祂和我們一樣是人。當我們讀到，祂感到孤獨，希望祂的門徒陪祂一同警醒，我們就知道，祂跟我們一樣，有常人的感情。耶穌在世為人，與我們唯一不同的地方，就是祂從來沒有犯罪。祂常像我們一樣受試探，可是因為祂是上帝，祂不能犯罪。請讀希伯來書 4:14-15。</p><blockquote><p><strong>希伯來書4:14-15</strong><br>我們既然有一位已經升入高天尊榮的大祭司，就是　神的兒子耶穌，便當持定所承認的道。<br>因我們的大祭司並非不能體恤我們的軟弱，他也曾凡事受過試探，與我們一樣；只是他沒有犯罪。</p></blockquote>"},{"day":5,"html":"<p>一旦聖子上帝取了人性和人體，祂就一直有人性，以後一直是這樣。耶穌一直是完完全全的上帝，祂現在也總是完完全全的人。祂在天上仍有人性和人體，以後也是如此。當祂在世的時候，耶穌也一直是完全的上帝，也是完全的人。作為上帝，祂知道萬事。作為人，祂在智慧上成長。因為耶穌是人，祂會疲乏、飢餓、軟弱。作為上帝，耶穌是永恆不變的，作為人，祂有出生、長大和死亡的過程。</p><p>也許不容易完全理解，一個人怎麼能同時又是神又是人，但是我們對這一點的相信是十分重要的，因為聖經就是如此教導的。耶穌如果不是身兼神人二性，就不能把我們從罪惡中拯救出來。</p><p>有的人教導說，耶穌只是一個人——是一個大好人，僅此而已。如果耶穌只是一個人，祂的死就不足以償還別人的罪債。因為祂是上帝，所以當祂代替祂的百姓而死時，祂的死可以償還他們的罪債。</p><p>有些人說，耶穌是上帝，祂來探望我們，但是祂沒有像我們一樣成為真正的人。上帝不會死的；如果耶穌不是一個人，祂就沒有辦法為我們的罪而死。只有成為人的上帝能夠作罪人的救主。請讀腓立比書 2:5-11。</p><blockquote><p><strong>腓立比書2:5-11</strong><br>你們當以基督耶穌的心為心。<br>他本有　神的形像，不以自己與　神同等為強奪的，<br>反倒虛己，取了奴僕的形像，成為人的樣式。<br>既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。<br>所以　神將他升為至高，又賜給他那超乎萬名之上的名，<br>叫一切在天上的、地上的和地底下的，因耶穌的名無不屈膝，<br>無不口稱耶穌基督為主，使榮耀歸與父　神。</p></blockquote>"},{"day":6,"html":"<p>因為耶穌既是神也是人，祂才能成為我們的買贖者。因為祂是人，祂可以死，為買贖我們付出代價。因為祂是神，祂的死就有足夠的價值來為祂的百姓償還罪債。只有耶穌既是神又是人，那麼也只有耶穌才能作我們的買贖者。</p><p>聖經告訴我們，耶穌也是我們的中保。中保就是在兩個不和的人中間，幫助他們和好的中間人。耶穌是神和人中間的中保，因為祂既是神又是人。只有祂能作我們的中保。只有祂能洗淨我們的罪，使我們的罪不再成為上帝接納我們的阻隔。只有耶穌能夠為我們死，承擔上帝對我們罪惡的所有忿怒，使上帝不再厭惡我們。今天，有許多人說，認識上帝的途徑有很多，耶穌是其中的一個。這麼說是錯誤的。祂是有罪的人和聖潔的上帝之間唯一的中保。耶穌是唯一的救主。請讀提摩太前書 2:5-6。</p><blockquote><p><strong>提摩太前書2:5-6</strong><br>因為只有一位　神，在　神和人中間，只有一位中保，乃是降世為人的基督耶穌。<br>他舍自己作萬人的贖價，到了時候，這事必證明出來。</p></blockquote>"}]},{"num":22,"title":"基督是上帝的兒子，祂是如何成為人？","answer":"上帝的兒子基督成為人，乃是親自取了真實的身體和理性的靈魂，藉著聖靈的能力，在童貞女馬利亞的腹中感孕，為她所生，但是沒有罪。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-7","days":[{"day":1,"html":"<p>走獸、魚鳥都有我們看得見的身體。走獸、魚鳥也有我們看不見的部分。那個看不見的部分，就是動物活的時候有，死的時候沒有的。人也有兩個部分，一部分是可見的，叫做身體；另一部分是不可見的，叫做靈魂。人的靈魂可以認識上帝、敬拜上帝。</p><p>耶穌成為人的時候，祂不僅僅是上帝進入人的身體而已。祂自己取了一個身體，還有人的靈魂。耶穌在各個方面仍然是上帝。祂也像其他人一樣是完全的人。耶穌代替信祂的人，活出了完全順服上帝的生命。為此，祂必須像我們一樣，是完全的人。請讀希伯來書 10:5-7。</p><blockquote><p><strong>希伯來書10:5-7</strong><br>所以，基督到世上來的時候，就說：「神啊，祭物和禮物是你不願意的；你曾給我預備了身體。<br>燔祭和贖罪祭是你不喜歡的。<br>那時我說：『神啊！我來了，為要照你的旨意行；我的事在經卷上已經記載了。』」</p></blockquote>"},{"day":2,"html":"<p>父親的一個細胞和母親的一個細胞，在母親肚子裡面結合的時候，一個新的人就開始了生命。一個小小的新人就開始成長。他在媽媽肚子里長大，直到足以獨立存活為止，那時他就出生了。基督沒有開始。因為祂是上帝。祂一直都存在。不過，祂的人性的部分是有開始的。像所有人類的嬰兒一樣，耶穌在媽媽肚子裡面孕育，直到足以達到出生的程度。不過，在一個非常重要的方面，耶穌與所有其他人類不同。耶穌沒有肉身的父親。當天使最初告訴耶穌的母親馬利亞，她要生一個孩子，她很納悶，沒有父親，哪有孩子呢？天使告訴她，聖靈的能力將降臨在她身上，嬰兒就是如此形成的。只有上帝自己作祂的父親。請讀路加福音 1:26-35。</p><blockquote><p><strong>路加福音1:26-35</strong><br>到了第六個月，天使加百列奉　神的差遣往加利利的一座城去，這城名叫拿撒勒，<br>到一個童女那裡，是已經許配大衛家的一個人，名叫約瑟，童女的名字叫馬利亞。<br>天使進去，對她說：「蒙大恩的女子，我問你安，主和你同在了！」<br>馬利亞因這話就很驚慌，又反覆思想這樣問安是什麼意思。<br>天使對她說：「馬利亞，不要怕！你在　神面前已經蒙恩了。<br>你要懷孕生子，可以給他起名叫耶穌。<br>他要為大，稱為至高者的兒子，主　神要把他祖大衛的位給他。<br>他要作雅各家的王，直到永遠；他的國也沒有窮盡。」<br>馬利亞對天使說：「我沒有出嫁，怎麼有這事呢？」<br>天使回答說：「聖靈要臨到你身上，至高者的能力要蔭庇你，因此所要生的聖者必稱為　神的兒子。</p></blockquote>"},{"day":3,"html":"<p class=\"read-prompt\">請讀羅馬書 5:19。</p><blockquote><p><strong>羅馬書5:19</strong><br>因一人的悖逆，眾人成為罪人；照樣，因一人的順從，眾人也成為義了。</p></blockquote><p>這節經文說，因為一個人的悖逆，眾人都怎麼樣了？亞當之後出生的人，都是照著他的形像出生的。我們每一個人生來都是罪人。耶穌的母親馬利亞，也是一個需要救主的罪人。只有耶穌是生來無罪的。他不像我們生來有罪性，所以他沒有犯罪的慾望。你還記得，當祂上十字架之前，在園中向天父禱告的時候說的話嗎？祂說：「不要照我的意思，而是要照你的意思。」耶穌在世的一生，都尋求上帝的旨意。其他所有的人，都是罪人，尋求自己的意思，不要上帝的方式。只有耶穌總是把上帝的旨意擺在自己的意願之前。</p>"},{"day":4,"html":"<p>耶穌是自從有人類以來，唯一里面沒有罪性的人。祂也是上帝。因為祂是上帝，祂是所有生在世上的人中間，唯一一位不能犯罪的。上帝是絕對聖潔的。祂恨惡所有的罪惡，祂從不犯罪。因為耶穌是上帝，對祂來說，犯罪是不可能的。這不是說，祂從來沒有受過犯罪的試探。</p><p>聖經告訴我們，耶穌受過試探。不過，祂從來沒有想到過要犯罪，一次也沒有。撒但常常想讓耶穌犯罪。牠知道，如果耶穌本身是罪人，就不能救我們脫離罪惡。耶穌曾經面對的最大的試探，就是不承擔我們的罪孽，不在十字架上受死。耶穌知道撒但會想方設法攔阻祂這麼做，但是耶穌也知道，祂會照著上帝的旨意，勇往直前，在十字架上受死。祂知道祂不會犯罪，因為祂是上帝的兒子，也不能犯罪。耶穌在與門徒共進最後的晚餐時，與門徒說起這一點。請讀約翰福音 14:30-31。</p><blockquote><p><strong>約翰福音14:30-31</strong><br>以後我不再和你們多說話，因為這世界的王將到，他在我裡面是毫無所有；<br>但要叫世人知道我愛父，並且父怎樣吩咐我，我就怎樣行。起來，我們走吧。</p></blockquote>"},{"day":5,"html":"<p class=\"read-prompt\">請讀約翰福音 8:29。</p><blockquote><p><strong>約翰福音8:29</strong><br>那差我來的，是與我同在；他沒有撇下我獨自在這裡，因為我常做他所喜悅的事。</p></blockquote><p>耶穌說，祂用多少時間來做上帝喜悅的事？有沒有任何其他一個人，可以誠實地這麼說？在另一處，耶穌問道：「你們中間誰能指證我有罪呢？」就連祂的敵人也想不出祂犯了什麼罪。耶穌的一個門徒，彼得，幾乎一直跟隨耶穌，與祂一起生活。如果耶穌曾經犯過罪，彼得肯定會看到的。請讀彼得前書 2:22，看看彼得如何評價耶穌。耶穌的一生都完全無罪，順服上帝。</p><blockquote><p><strong>彼得前書2:22</strong><br>「他並沒有犯罪，口裡也沒有詭詐。」</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀希伯來書 4:14-15。</p><blockquote><p><strong>希伯來書4:14-15</strong><br>我們既然有一位已經升入高天尊榮的大祭司，就是　神的兒子耶穌，便當持定所承認的道。<br>因我們的大祭司並非不能體恤我們的軟弱，他也曾凡事受過試探，與我們一樣；只是他沒有犯罪。</p></blockquote><p>亞當曾代表整個人類。當他犯罪的時候，我們都犯罪了。耶穌代表上帝所有的百姓。當祂完全順服上帝的時候，祂是替我們做的。上帝把祂的全然順服算在我們身上，儘管我們自己並沒有完全順服上帝。這就是為什麼耶穌必須像我們一樣，完全成為人，因為這樣祂才能代表我們。祂必須活出一個完全無罪的人類的生命。祂為我們做到了。當耶穌死在十字架上，這一點也是十分重要的，就是祂從未犯過罪。如果祂犯過罪，祂就為自己的罪應該受死。因為祂從未犯過罪，所以祂可以受死，來為自己的百姓承擔罪孽的刑罰。請讀哥林多後書 5:21。</p><blockquote><p><strong>哥林多後書5:21</strong><br>神使那無罪的，替我們成為罪，好叫我們在他裡面成為　神的義。</p></blockquote>"}]},{"num":23,"title":"基督作我們的救主，所執行的職分是什麼？","answer":"基督作我們的救贖主，在降卑與升高的境界中，執行先知、祭司、君王的職分。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-8","days":[{"day":1,"html":"<p>上帝的百姓等待了千百年，等待上帝差來祂應許差遣的那一位。那一位將摧毀撒但和牠的工作。在百姓等待的時期，上帝賜給他的百姓三種特殊的人：先知、祭司和君王。這三種人幫助上帝的百姓，在等候的時期知道並遵行上帝的旨意。這些人也描繪了上帝所應許的那一位。耶穌將集完全的先知、完全的祭司和完全的君王於一身。祂在世生活、受苦的期間，也就是祂降卑的境界中，這將成為事實。現在，耶穌的降卑已經結束，祂已進入祂的升高境界。耶穌的升高，就是因為祂為罪人所做的，得到祂當得的尊榮。在祂升高的境界中，祂也是完全的先知、祭司和君王。請讀希伯來書 2:9。</p><blockquote><p><strong>希伯來書2:9</strong><br>惟獨見那成為比天使小一點的耶穌，因為愛死的苦，
