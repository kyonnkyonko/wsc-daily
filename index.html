題。教會是人們想去就去的地方，人們可以自由選擇的。上帝在聖經中可不是這麼說的。聖經中多處命令我們有規律地與上帝的百姓聚集敬拜上帝、學習祂的話語。敬拜不是一個選擇。上帝命令我們要敬拜祂，禁止我們不敬拜祂。請讀希伯來書10:25。</p><blockquote><p><strong>希伯來書10:25</strong><br>你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉。既知道那日子臨近，就更當如此。</p></blockquote>"},{"day":4,"html":"<p>有了「除我以外不可有別神」這條誡命，那麼不把上帝當得的敬拜和榮耀歸給祂，就是一種罪。請讀歷代志上16:23-29。</p><blockquote><p><strong>歷代志上16:23-29</strong><br>全地都要向耶和華歌唱！天天傳揚他的救恩。<br>在列邦中述說他的榮耀，在萬民中述說他的奇事。<br>因耶和華為大，當受極大的讚美；他在萬神之上，當受敬畏！<br>外邦的神都屬虛無，惟獨耶和華創造諸天。<br>有尊榮和威嚴在他面前，有能力和喜樂在他聖所。<br>民中的萬族啊，你們要將榮耀能力歸給耶和華，都歸給耶和華！<br>要將耶和華的名所當得的榮耀歸給他，拿供物來奉到他面前；當以聖潔的妝飾敬拜耶和華。</p></blockquote><p>這段經文說，榮耀應當屬於上帝的名。如果某物應當歸誰，就是欠那人了。當我從圖書館借書到期該還的時候，我就要把它拿回到圖書館。那本書屬於圖書館，我欠著他們的書。當我買了東西，收到賬單的時候，上面寫著「應付金額」。意思是說，我欠著一筆錢，必須得付。榮耀和敬拜歸屬於上帝。我們是祂所造的，我們應當把敬拜和榮耀都歸給祂。如同這個問答的答案所說，因為祂是獨一真神，我們上帝的榮耀與敬拜歸給祂。</p>"},{"day":5,"html":"<p>第一誡禁止否認上帝。禁止不將我們應該歸給獨一真神、我們上帝的榮耀與敬拜歸給祂。它也禁止將敬拜或榮耀歸給任何人、任何事物。上帝設計我們能敬拜。我們與地球上的所有其它生物不同，因為我們可以認識祂，因為我們裡面有敬拜的需要。當然，上帝要我們敬拜祂，唯一配得敬拜的是祂。因為人們有罪，所以他們選擇悖逆上帝，不敬拜祂。既然，人被設計成敬拜的，那麼如果他們不敬拜上帝，他們就總是會找到別的什麼替代品來敬拜，去敬拜和榮耀它。</p><p>使徒保羅教導說，所有人都知道有上帝，因為他們可以看到上帝所造的，因為他們有良心。保羅說人們沒有做的那件事是什麼？請讀羅馬書1:21。</p><blockquote><p><strong>羅馬書1:21</strong><br>因為他們雖然知道神，卻不當作神榮耀他，也不感謝他。他們的思念變為虛妄，無知的心就昏暗了。</p></blockquote><p class=\"read-prompt\">請讀22-23節，看看他們用什麼來代替上帝的榮耀？</p><blockquote><p><strong>羅馬書1:22-23</strong><br>自稱為聰明，反成了愚拙；<br>將不能朽壞之神的榮耀變為偶像，彷佛必朽壞的人和飛禽、走獸、昆蟲的樣式。</p></blockquote><p class=\"read-prompt\">請讀25節。人們用什麼代替上帝的真實？他們不去敬拜造物的主，反倒去敬拜服侍什麼？</p><blockquote><p><strong>羅馬書1:25</strong><br>他們將神的真實變為虛謊，去敬拜事奉受造之物，不敬奉那造物的主。主乃是可稱頌的，直到永遠。阿們！</p></blockquote>"},{"day":6,"html":"<p>我們都知道，向偶像、向月亮或向另外的人叩拜、禱告，是錯誤的。我們可能以為，只要我們沒做這幾件事，我們就是守了第一誡了。想要確知自己守了第一誡「除我以外，你不可有別神」，我們必須問自己一個問題。有沒有任何事情攔阻我敬拜上帝，攔阻我照著應有的方式來榮耀祂？</p><p>比如，一個學生可能擔心，如果讓同學看到自己對聖經感興趣，或者如果他對於老師有應分的尊敬，同學們可能瞧不起他。這樣，他可能看起來並非明顯悖逆，卻對於老師的快速回應，他就不讓人看見他有聖經。他人的想法，就成了真神以外的別神了。可能另一位知道應該花時間讀經禱告，可是她老是忙得不可開交。一天天過去了，她總是找不到禱告或者讀經的時間。她在真神以外，就有了「自己的方便」和「自己的喜好」這樣的別神。</p><p>當約書亞帶領以色列人進入應許地的時候，他挑戰他們，要麼就全心侍奉獨一真神，要麼就侍奉周圍民族的假神。請讀約書亞記24:14-18。</p><blockquote><p><strong>約書亞記24:14-18</strong><br>現在你們要敬畏耶和華，誠心實意地事他，將你們列祖在大河那邊和在埃及所事奉的神除去，去事奉耶和華。<br>若是你們以事奉耶和華為不好，今日就可以選擇所要事奉的：是你們列祖在大河那邊所事奉的神呢？是你們所住這地的亞摩利人的神呢？至於我和我家，我們必定事奉耶和華。「<br>百姓回答說：」我們斷不敢離棄耶和華去事奉別神，<br>因耶和華我們的神曾將我們和我們列祖從埃及地的為奴之家領出來，在我們眼前行了那些大神蹟，在我們所行的道上，所經過的諸國，都保護了我們，<br>耶和華又把住此地的亞摩利人都從我們面前趕出去。所以，我們必事奉耶和華，因為他是我們的神。「</p></blockquote><p>我們也面臨同樣的挑戰。在我們的四周，人們把自己當作神，把享樂當作神，把財富當作神。我們要先服侍這些神，把剩下的給真神嗎？還是願意遵守上帝的誡命，除祂以外沒有別神呢？</p>"}]},{"num":48,"title":"第一誡命的「除了我以外」，這話特別教導我們什麼？","answer":"第一誡命的「除了我以外」（原文：「在我面前」），這話教導我們：鑑察萬物的神，留心注意並且十分憎惡「另有別神」的罪。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-2","days":[{"day":1,"html":"<p>雖然上帝不像我們一樣有眼睛，但是祂比我們看得清楚多了。上帝同時看到所有地方和所有事物。上帝之所以能夠如此，是因為上帝是無所不在的，就是說祂可以同時在任何地方。聖經告訴我們，上帝連一隻小鳥從天落下，也能看到。聖經說，祂在嬰孩出生前，他們還在母腹中的時候，就看到他們。什麼也不能從上帝面前隱藏。祂看到一切發生的事情。上帝甚至看透人心，以至於祂知道人們在想什麼。任何罪都無法逃過上帝，使祂看不見。如果一個人在上帝以外有了別神，真神上帝是知道的。當有人拒絕敬拜侍奉上帝，上帝是知道的。</p><p>有時候，一個人去教會，也行善，不過他這麼做，只是為了在人前看起來很好。其實他對上帝根本沒有興趣；祂是假裝在敬拜祂。他可以矇騙所有人，但是上帝知道這樣的一個人沒有遵守第一條誡命。請讀詩篇44:20-21。</p><blockquote><p><strong>詩篇44:20-21</strong><br>倘若我們忘了神的名，或向別神舉手，<br>神豈不鑑察這事嗎？因為他曉得人心裡的隱秘。</p></blockquote>"},{"day":2,"html":"<p>上帝總會鑑察另有別神的罪。不管是誰敬拜了上帝以外的東西，祂都鑑察。任何人以任何東西代替上帝，都是得罪上帝，惹祂發怒的事。也不管敬拜別神的人住在哪裡，真神都會留心著。</p><p>聖經講到非利士人，他們敬拜一個叫做大袞的偶像。因為以色列人不順服上帝，非利士人就在戰爭中勝了以色列人。非利士人因此讚美尊崇他們的偶像大袞。他們從以色列人手裡擄獲了約櫃。約櫃就是存放刻有十誡的石版的櫃子。為了顯示他們的偶像大袞比真神偉大，非利士人把約櫃放在大袞廟裡，彷彿上帝成了偶像的俘虜。請讀撒母耳記，看看發生了什麼。</p><blockquote><p><strong>撒母耳記上5:2-5</strong><br>非利士人將神的約櫃抬進大袞廟，放在大袞的旁邊。次日清早，亞實突人起來，見大袞仆倒在耶和華的約櫃前，臉伏於地，就把大袞仍立在原處。又次日清早起來，見大袞仍倒在耶和華的約櫃前，臉伏於地，並且大袞的頭和兩手都在門檻上折斷，只剩下大袞的殘體。因此，大袞的祭司和一切進亞實突大袞廟的人，都不踏大袞廟的門檻，直到今天。</p></blockquote><p>這還不算。那城裡的人都長了痛瘡，有些人連命都丟了。雖然非利士人不是上帝的百姓，但是他們在祂面前敬拜偶像仍然得罪上帝。他們不將榮耀歸給上帝，惹怒上帝懲罰他們。</p>"},{"day":3,"html":"<p>那些不敬拜祂的人也得罪上帝。聖經告訴我們，上帝是忌邪的上帝。有時候，人們以犯罪的方式，或者因為嫉妒的原因生髮嫉妒。如果我們因為不想與人分享或者因為我們想擁有最好的東西而生嫉妒，那麼我們的嫉妒就是錯的。有時候嫉妒是正確的。一個男人可能會因他的妻子而生嫉妒。他不想讓人對待她像對待老婆一樣，因為他才是她唯一的丈夫。別人像丈夫一樣對待這個人的妻子是錯的。</p><p>當上帝所造的人像對待上帝一樣地對待其它的東西，上帝就會嫉妒。只有祂是上帝。祂造人，要敬拜祂。其它任何東西都不配受敬拜。人們敬拜上帝以外的東西是錯的。那也是有害於上帝的。因為這些原因，人們不敬拜上帝就會大大得罪上帝。當上帝嫉妒的時候，絕對不是罪惡的。請讀以賽亞書42:8。</p><blockquote><p><strong>以賽亞書42:8</strong><br>我是耶和華，這是我的名，我必不將我的榮耀歸給假神，也不將我的稱讚歸給雕刻的偶像。</p></blockquote>"},{"day":4,"html":"<p>使徒行傳跟我們講述了最初的基督徒們。他們生活在敬拜各種偶像的人們中間。這些人甚至敬拜他們的統治者，那些統治者不過是人，可是人們把他們當神來拜。當然這些統治者知道自己只是人，不是神！也許他們反覆聽說自己是神，連他們自己也開始相信了。也許他們從未相信過，不過他們還是喜歡別人這麼相信，這樣他們就會尊崇、順服他。</p><p>使徒行傳講到一個王，名叫希律。他抵擋真神，禁止使徒傳講上帝的道。他迫害使徒，殺害了使徒雅各，又計劃殺害使徒彼得。上帝差遣天使，救彼得脫離關押他的監牢。希律王派兵去帶彼得行刑的時候，發現彼得不見了，希律傻眼了。他搞不懂彼得哪兒去了，也找不到他。</p><p>再說希律王，有一天他與一群人聚集，那些人都有求於他。他們都奉承他，稱他為神。請讀使徒行傳12:21-24。看看發生了什麼。</p><blockquote><p><strong>使徒行傳12:21-24</strong><br>希律在所定的日子，穿上朝服，坐在位上，對他們講論一番。<br>百姓喊著說：「這是神的聲音，不是人的聲音。」<br>希律不歸榮給神，所以主的使者立刻罰他，他被蟲所咬，氣就絕了。<br>神的道日見興旺，越發廣傳。</p></blockquote><p>希律死得很慘，因為他接受了只有上帝才配得的敬拜。同時，上帝的道，就是希律企圖要禁止的，反而日見興旺，越發廣傳。</p>"},{"day":5,"html":"<p>今天，人們是否從別人那裡接受敬拜尊榮，彷彿他們是神？今天，是否有人似乎覺得自己既然是偉人、名人，就不需要順服上帝的法則呢？上帝沒有改變。他對於今日人們尊崇敬拜別人的行為，對於像希律那樣接受如此尊榮的人，有一樣的感受。</p><p class=\"read-prompt\">請讀以弗所書5:5-6。</p><blockquote><p><strong>以弗所書5:5-6</strong><br>因為你們確實地知道，無論是淫亂，是汙穢的，是有貪心的，在基督和神的國裡都是無分的。有貪心的，就與拜偶像的一樣。<br>不要被人虛浮的話欺哄，因這些事，神的忿怒必臨到那悖逆之子。</p></blockquote><p>這段經文告訴我們，有貪心的人，就是一個拜偶像的人。有貪心的人，他們想要的總比上帝已經賜予的多。這樣的人與上帝的國無關。上帝的憤怒會臨到這人。上帝的憤怒，是聖潔的、大能的、可怕的。那些以別的人或物當作神的人，大大地得罪上帝。儘管祂耐心地等候他們悔改，祂的憤怒最終會降臨在他們身上。聖經告訴我們「落在永生神的手裡，真是可怕的！」（希伯來書10:31）</p>"},{"day":6,"html":"<p>今天人們相信，關於該敬拜誰，接受大家的觀點能顯出我們的寬容仁愛。人們可以想拜誰就拜誰。或者乾脆誰也不拜。其實拜什麼都沒什麼區別嘛。這就是今天人們關於敬拜的說法，不過上帝不同意。上帝警告以色列人，他們一旦安居在應許地，他們就會受到試探，忘記神。如果他們忘記神，敬拜別神，祂警告要除滅他們。請讀申命記6:10-15。</p><blockquote><p><strong>申命記6:10-15</strong><br>耶和華你的神，領你進他向你列祖亞伯拉罕、以撒、雅各起誓應許給你的地。那裡有城巳，又大又美，非你所建造的；<br>有房屋，裝滿各樣美物，非你所裝滿的；有鑿成的水井，非你所鑿成的；還有葡萄園、橄欖園，非你所栽種的，你吃了而且飽足。<br>那時，你要謹慎，免得你忘記將你從埃及地為奴之家領出來的耶和華。<br>你要敬畏耶和華你的神，事奉他，指著他的名起誓。<br>不可隨從別神，就是你們四圍國民的神，<br>因為在你們中間的耶和華你神，是忌邪的神。惟恐耶和華你神的怒氣向你發作，將你從地上除滅。</p></blockquote>"}]},{"num":49,"title":"第二誡命是什麼？","answer":"第二誡是：「不可為自己雕刻偶像；也不可作什麼形像彷彿上天、下地和地底下、水中的百物。不可跪拜那些像；也不可事奉它，因為我耶和華你的神，是忌邪的神。恨我的，我必追討他的罪，自父及子，直到三四代；愛我、守我誡命的，我必向他們發慈愛，直到千代。」","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-3","days":[{"day":1,"html":"<p>第二條誡命告訴我們不可製造偶像，也不可跪拜偶像，聽起來好像第一誡命一樣。第一條誡命中，上帝說除了祂以外不可有別神。區別在這裡：在第一條誡命中，我們要敬拜又真又活的上帝，而且單單敬拜祂。第二條誡命告訴我們如何敬拜祂。我們不可以用雕像或偶像來敬拜上帝，也不可在敬拜中做任何祂不喜悅的事。</p><p>在聖經中，上帝告訴我們想要我們如何敬拜祂。我們必須照著祂的指示來敬拜祂。請讀出埃及記32:4-6。</p><blockquote><p><strong>出埃及記32:4-6</strong><br>亞倫從他們手裡接過來，鑄了一隻牛犢，用雕刻的器具做成。他們就說：「以色列啊，這是領你出埃及地的神！」<br>亞倫看見，就在牛犢面前築壇，且宣告說：「明日要向耶和華守節。」<br>次日清早，百姓起來獻燔祭和平安祭，就坐下吃喝，起來玩耍。</p></blockquote><p>亞倫告訴百姓，第二天會有節期。他說這個節期是獻給耶和華的。在守節的時候，百姓向金牛犢獻祭。他們的節慶，是在曠野、混亂中度過，他們做了很多罪惡的事。但是他們竟稱之為「向耶和華守節」。他們聲稱是在敬拜上帝。但是他們企圖用拜偶像等不對他喜悅的方式來敬拜祂。上帝恨惡人敬拜別神。同樣，祂也恨惡人們用違背祂所指示的方式敬拜祂。</p>"},{"day":2,"html":"<p>我們作為上帝的百姓聚集的時候，敬拜中最重要的部分就是讀祂的話語，聆聽講道與教導。使徒保羅曾寫信給年輕的牧師提摩太。信裡面告訴提摩太，在敬拜中什麼是最要緊的。保羅告訴提摩太，作為牧師，要以幾件事為念。以某事為念的意思就是把那件事放在第一位。如果你以某事為念，你就會在沒時間做其它事的情況下，也確保做好這件事。請讀提摩太前書4:13。</p><blockquote><p><strong>提摩太前書4:13</strong><br>你要以宣讀、勸勉、教導為念，直等到我來。</p></blockquote><p>上帝的百姓聚集敬拜的時候，宣讀、傳講、教導聖經是教會的第一要務。教會必須以上帝的道為中心，一同宣讀並且本著聖經講道、教導。這樣，就防止上帝的百姓敬拜自己頭腦中想象出來的神。他們一直可以看到上帝在祂的聖道中，如何啟示祂自己。這樣，也防止上帝的百姓以上帝不喜悅的方式敬拜上帝。他們會一直查考上帝的道，看看什麼是上帝喜悅的事。</p>"},{"day":3,"html":"<p>在寫給年輕的牧師提摩太的同一封信中，使徒保羅提到了我們敬拜中應該做的另一件重要的事。請讀提摩太前書2:1，看看那是什麼。</p><blockquote><p><strong>提摩太前書2:1</strong><br>我勸你第一要為萬人懇求、禱告、代求、祝謝。</p></blockquote><p>聖經告訴我們，當我們按著祂的旨意祈求，祂垂聽並且回應我們的禱告。這就是為什麼教會要在敬拜中以上帝的旨意為中心的另一個充分的理由。只有透過讀經知道了上帝的旨意，我們才能照著上帝的旨意禱告。</p><p>在保羅寫給歌羅西教會的信中，保羅說到我們在敬拜中，上帝讓我們做的另一件事。他說我們要向上帝唱詩章、頌詞、靈歌。請讀歌羅西書3:16。</p><blockquote><p><strong>歌羅西書3:16</strong><br>當用各樣的智慧，把基督的道理豐豐富富地存在心裡，用詩章、頌詞、靈歌，互相教導，心被恩感，歌頌神。</p></blockquote><p>我們想透過唱詩的方式，把上帝的道「豐豐富富地存在心裡」。</p><p>許多人喜歡音樂。有時候我們過於欣賞一首歌的音樂，以至於不注意歌詞了。一首歌的歌詞必須符合上帝的話，否則我們就不可以用這樣的歌來敬拜。當你在敬拜中唱詩的時候，總要聽聽自己唱的是什麼。如果歌詞說到上帝，與聖經教導的不同，就不要在敬拜中用那首歌。如果那首歌是以符合聖經的方式讚美上帝的，那就要發自內心地唱，把它作為你的敬拜獻給上帝。</p>"},{"day":4,"html":"<p>基督徒的敬拜，還有兩個重要的部分：洗禮與聖餐。一個人受洗，表明他或她與基督聯合，成為上帝百姓中的一員。受洗應該當眾進行，在上帝的其他百姓面前進行。洗禮是非常嚴肅的事，但也是值得慶賀的事。聖餐也是非常嚴肅的，因為上帝的百姓聚集一起來記念耶穌的死。聖餐同樣是慶賀的時間，因為我們記念耶穌為我們死，叫我們的罪都得赦免。我們有這兩種特殊的敬拜，是因為主耶穌就是如此命令我們的。請讀馬太福音28:19和哥林多前書11:23-26。</p><blockquote><p><strong>馬太福音28:19</strong><br>所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗，</p><p><strong>哥林多前書11:23-26</strong><br>我當日傳給你們的，原是從主領受的，就是主耶穌被賣的那一夜，拿起餅來，<br>祝謝了，就擘開，說：「這是我的身體，為你們舍的。你們應當如此行，為的是記念我。」<br>飯後，也照樣拿起杯來，說：「這杯是用我的血所立的新約。你們每逢喝的時候，要如此行，為的是記念我。」<br>你們每逢吃這餅，喝這杯，是表明主的死，直等到他來。</p></blockquote>"},{"day":5,"html":"<p>上帝告訴我們，除了上帝以外不可敬拜別神。上帝告訴我們當心，只可以祂吩咐的方式來敬拜祂。上帝不是提建議，祂是在命令我們。這個命令附帶著警誡。上帝警告我們，祂是忌邪的上帝，如果不順服祂，後果自負。祂說祂會懲罰那些恨祂之人的罪，甚至牽連到他們的兒孫後代。這就是罪帶來的可怕後果。罪所傷及的人，遠遠不止犯罪的人本身。一個人會把罪惡的生活方式傳遞給兒孫後代。</p><p>亞哈是舊約時代的一位以色列國王，但是他很邪惡，是個拜偶像的人。當上帝的先知告訴亞哈，上帝會因為他的罪審判他的家，他悔改了。不過，罪總是有後果的。請讀列王記上21:25-29。上帝何時會降災？</p><blockquote><p><strong>列王記上21:25-29</strong><br>（從來沒有像亞哈的，因他自賣，行耶和華眼中看為惡的事，受了王后耶洗別的聳動，<br>就照耶和華在以色列人面前所趕出的亞摩利人，行了最可憎惡的事，信從偶像。）<br>亞哈聽見這話，就撕裂衣服，禁食，身穿麻布，睡臥也穿著麻布，並且緩緩而行。<br>耶和華的話臨到提斯比人以利亞說：<br>「亞哈在我面前這樣自卑，你看見了嗎？因他在我面前自卑，他還在世的時候，我不降這禍；到他兒子的時候，我必降這禍與他的家。」</p></blockquote>"},{"day":6,"html":"<p>這第二條誡命，也附帶著一個應許。上帝應許，要向那些愛祂守祂誡命的人發慈愛。不僅如此，上帝也會祝福那些愛祂之人的子孫後代。作為小孩子，參加敬拜的過程，你就學會了敬拜獨一的真神。當你觀察大家敬拜，在你參與敬拜的過程中，你就學會了照著上帝的心意來敬拜祂。你透過聖道的宣讀和傳講，透過唱詩禱告，透過觀察洗禮，透過觀察或參與聖餐，學會了敬拜。如果你的父母照著上帝的吩咐敬拜上帝，那麼你作為他們的兒女就會得著這份祝福。既然有這樣的父母，就要善用這樣的恩典，從他們那裡學會自己愛上帝、敬拜上帝。要知道一點，你之所以敬拜上帝，是因為自己要敬拜祂，而不是因為有人逼你去教會你才敬拜上帝。請讀詩篇103:17-18。</p><blockquote><p><strong>詩篇103:17-18</strong><br>但耶和華的慈愛歸於敬畏他的人，從亙古到永遠；他的公義也歸於子子孫孫，<br>就是那些遵守他的約，記念他的訓詞而遵行的人。</p></blockquote>"}]},{"num":50,"title":"第二誡命吩咐我們什麼？","answer":"第二誡命吩咐我們：領受與遵行神在聖經中所規定，一切有關敬虔的崇拜與律例，都要純然的、全然的遵守。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-3","days":[{"day":1,"html":"<p>在上帝帶領以色列人出埃及的路上，祂賜下祂的律法。我們可以把上帝賜下的律法分成三類。民事律法是特別賜給舊約的以色列民族的法則。道德律告訴上帝的百姓如何行事。即使上帝賜下道德律幾千年後的今天，儘管上帝耶穌已經來了，上帝也仍然要求祂的百姓遵守道德律。另外一種律法叫做禮儀律。禮儀律包括一大堆關於如何獻祭，獻哪一種祭，祭司的穿戴等等。禮儀律象徵著耶穌在世的工作。祂將成為最大的祭司，帶領百姓直接進入上帝的同在。祂將成為完美的祭物，永遠除去罪惡。禮儀律的所有細節都是象徵著耶穌。</p><p>既然耶穌已經來了，我們就不再需要象徵了。我們認識了上帝所預備的真正的祭司和真正的祭物。請讀希伯來書10:1,10。</p><blockquote><p><strong>希伯來書10:1</strong><br>律法既是將來美事的影兒，不是本物的真像，總不能藉著每年常獻一樣的祭物，叫那近前的人得以完全。</p><p><strong>希伯來書10:10</strong><br>我們憑這旨意，靠耶穌基督只一次獻上他的身體，就得以成聖。</p></blockquote><p>聖經中關於禮儀律的那部分，仍會讓我們看到對耶穌工作的認真描述。所以我們仍要閱讀，但是我們不必再遵守那部分的律法。不過，道德律是我們仍然要遵守的。在這方面，我們這些活在耶穌降世之後的人，與那些活在道德律剛剛成文的時代的人們，都是完全一樣的。</p>"},{"day":2,"html":"<p>有一次，一位婦人問耶穌應該怎樣敬拜上帝。她想問的是應該在哪裡敬拜。她關心的是律法的禮儀部分。耶穌的回答說明，現在耶穌已經來了，律法的禮儀部分就不重要了。不過，敬拜本身仍然是重要的事。敬拜對於上帝非常重要，祂要人正確地敬拜祂。耶穌說，那些正確敬拜上帝的人，會用心靈和誠實（在聖靈中用真理）來敬拜祂。</p><p>如果我們想要按照上帝接受的方式來敬拜上帝，我們就必須照著上帝在祂的聖道中啟示的真理來敬拜祂，而不是照著我們自己的想法。耶穌說，敬拜上帝的人，必須在聖靈中，在真理中敬拜上帝。照著自己的想法敬拜上帝，不照著上帝吩咐的方式敬拜，就根本算不上是敬拜祂。請讀約翰福音4:23-24。</p><blockquote><p><strong>約翰福音4:23-24</strong><br>時候將到，如今就是了。那真正拜父的，要用心靈和誠實拜他，因為父要這樣的人拜他。<br>神是個靈，所以拜他的，必須用心靈和誠實拜他。「</p></blockquote>"},{"day":3,"html":"<p>上帝已經在聖經中設立了信仰與敬拜的條規（或法則）。祂要我們敬拜祂，祂要我們在敬拜的時候做幾件事。上帝要求祂的百姓常常聚集敬拜。當他們聚會的時候，祂要求百姓一起宣讀誡的話，聆聽真道的傳講。祂要我們唱詩讚美祂。祂要他們的一起禱告。上帝也要祂的百姓，要用聖餐記念主的死，也要受洗歸入教會。那些真正屬於主的人，都會接受祂的這些要求。他們會甘心地參與這些事。那些屬於上帝的人會樂意在主日跟著百姓在一起。他們會願意唱詩讚美主，聆聽真理的教導，儘管不一定能明白所教導的全部。如果你總是厭煩主日去教會，你要問問自己，是不是真的屬於上帝的百姓。請讀詩篇122:1。</p><blockquote><p><strong>詩篇122:1</strong><br>人對我說：「我們往耶和華的殿去」，我就歡喜。</p></blockquote>"},{"day":4,"html":"<p>上帝要我們恭敬地履行祂賜給我們的敬拜要求。意思是說，我們不僅在敬拜的時候照著祂的要求做，而且帶著對上帝的尊敬。上帝所配得的尊敬，大大地高過父母或其他有權柄的人配得的尊敬。我們應當歸給上帝的尊敬是特別的：有一個特別的名字：敬畏。我們對上帝要有敬畏的心。敬畏是一種非常崇高的尊敬，實際上有一種畏懼在其中。這種畏懼，就是唯恐作出得罪上帝的事。</p><p>當我們以敬畏的心來敬拜，我們就會嚴肅對待我們的敬拜。有敬畏之心的敬拜者，不會在敬拜的時候說話、嬉笑或者玩耍。他也不會任由自己的思緒遊蕩於各種雜事之中。有敬畏之心的敬拜者會儘可能地投入到敬拜中去。今天，人們喜歡把上帝想象成「哥們兒」。人們忘記了，上帝比我們不知道偉大多少，於是就在敬拜中沒有了敬畏之心。儘管耶穌降世，為要叫我們成為上帝的兒女，不過祂仍要求我們以敬畏之心來敬拜祂。請讀詩篇5:7。</p><blockquote><p><strong>詩篇5:7</strong><br>至於我，我必憑你豐盛的慈愛進入你的居所；我必存敬畏你的心向你的聖殿下拜。</p></blockquote>"},{"day":5,"html":"<p>上帝要求祂的百姓純然地、全然地遵守祂所賜下的敬拜規矩。意思是說，我們必須注意，要一直照著上帝命令我們的方式來敬拜。隨著時間流逝，人們漸漸忽略、遺忘上帝的命令。他們可能不去做上帝要求他們做的事，開始在敬拜中加上一些上帝不喜歡的東西。新約聖經告訴牧師和教會領袖，要傳講教導上帝的命令。聖經也警告說，就連教會里的人都可能寧可相信自己的主張，不喜歡聽上帝的真理。</p><p>有的教會，說是在敬拜上帝，但是卻在敬拜中做上帝沒有命令的事。人們會讓他們喜歡的東西來代替上帝的命令，比如代替聽道。始終要記得，敬拜的目的不是為了我們高興，是為了順服上帝、尊崇上帝。我們必須謹慎地照著上帝在聖經裡的要求來敬拜上帝。請讀提摩太後書4:1-3。</p><blockquote><p><strong>提摩太後書4:1-3</strong><br>我在神面前，並在將來審判活人死人的基督耶穌面前，憑著他的顯現和他的國度囑咐你：<br>務要傳道！無論得時不得時，總要專心，並用百般的忍耐，各樣的教訓，責備人，警戒人，勸勉人。<br>因為時候要到，人必厭煩純正的道理，耳朵發癢，就隨從自己的情慾，增添好些師傅。</p></blockquote>"},{"day":6,"html":"<p>祭司拿達和亞比戶決定照著自己的方式敬拜上帝，不要照著上帝給他們設立的規矩做。祭司們的工作包括向耶和華獻祭。香是一種燃燒時會有香味的粉末。舊約中敬拜上帝的一個環節是焚香作為獻給上帝的祭。上帝清楚地指示摩西如何製作香料。祭司們在敬拜中只能用某種特定的香。拿達和亞比戶獻的並不是上帝要求的那種。請讀利未記10:1-3。</p><blockquote><p><strong>利未記10:1-3</strong><br>亞倫的兒子拿答、亞比戶，各拿自己的香爐，盛上火，加上香，在耶和華面前獻上凡火，是耶和華所沒有吩咐他們的，<br>就有火從耶和華面前出來，把他們燒滅，他們就死在耶和華面前。<br>於是摩西對亞倫說：「這就是耶和華所說：『我在親近我的人中要顯為聖；在眾民面前，我要得榮耀。』」亞倫就默默不言。</p></blockquote><p>上帝定意要戰拜他敬拜祂的人。祂要的是帶著敬畏之心的敬拜。祂要求來敬拜祂的，照著祂當得的榮耀來尊崇祂。這也包括照著祂的指示來敬拜祂，而不是照著人的想法來敬拜祂。</p>"}]},{"num":51,"title":"第二誡命禁止我們作什麼？","answer":"第二誡命禁止我們用任何形像來敬拜神，或用聖經所沒有指定的任何方法來敬拜祂。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-3","days":[{"day":1,"html":"<p>上帝曾經命令百姓敬拜祂，而且告訴他們，敬拜當中要他們做的事情。上帝的百姓不可以效仿外邦人的敬拜。在舊約時代，當上帝起初賜下十誡給以色列人的時候，他們必須防範的試探就是拜偶像。他們周圍的所有民族，都是外邦人，他們都拜那看得見的偶像。以色列人老是想跟周圍的民族一樣，他們總想嘗試在敬拜真神的時候使用偶像。</p><p>正因如此，第二誡命清楚地禁止製造偶像，也禁止在敬拜中使用偶像。不僅不可跪拜別神的像，他們也不可以為真神製作偶像，在敬拜中使用。上帝是靈。祂沒有可見的身體。祂不讓祂的百姓造出一個看得見的東西，然後說這就是上帝，或者說這就彷彿是上帝。請讀申命記4:15-18。</p><blockquote><p><strong>申命記4:15-18</strong><br>所以你們要分外謹慎，因為耶和華在何烈山從火中對你們說話的那日，你們沒有看見什麼形像。<br>惟恐你們敗壞自己，雕刻偶像，彷彿什麼男像女像，<br>或地上走獸的像，或空中飛鳥的像，<br>或地上爬物的像，或地底下水中魚的像。</p></blockquote>"},{"day":2,"html":"<p class=\"read-prompt\">請讀使徒行傳17:29。</p><blockquote><p><strong>使徒行傳17:29</strong><br>我們既是神所生的，就不當以為神的神性像人手藝、心思所雕刻的金、銀、石。</p></blockquote><p>在當今的美國，人們不再用金子、木頭、石頭製作偶像來跪拜。今天，上帝的百姓不會受試探造偶像，說「這就是上帝」。今天，人們在想象中製造假神。他們用意念造假神。大多數人相信有一位神。但是人們對於上帝是什麼樣的，有許多不同的想法。如果這些想法跟上帝在聖經中所說的不一致，那麼這些想法就是錯誤的。當人們對於上帝有錯誤的想法，他們相信的神就是假神或假信仰了。</p><p>有時候，人們聽別人說關於上帝的事情，沒經過查考聖經就信以為真。你不應該相信自己對於上帝想法。你也不應該相信別人的想法。只有一種方式才能保證，你敬拜的是真神，而不是人捏造出來的上帝的概念。你必須搞清楚，你對於上帝的信仰是來自於聖經。為此，你必須熟悉聖經。如果你只瞭解聖經的一部分，你就無法對上帝有真實的認識。上帝已經在聖經中向我們啟示祂自己。只有熟悉聖經，我們才能照著祂的吩咐來敬拜祂。</p>"},{"day":3,"html":"<p>上帝的百姓不製造上帝的雕像或者畫像，這個事情為什麼那麼重要呢？上帝的百姓從經文中認識上帝，而不是透過想象來認識上帝，這個事情為什麼那麼重要呢？上帝是極其偉大的。沒有人能夠造出上帝的雕像或者畫像，能顯示神的偉大。沒人能在想象中造出以為像真神那麼偉大的上帝。雕像、畫像、想象，只能貶損上帝的偉大。</p><p class=\"read-prompt\">請讀詩篇97:1-2。</p><blockquote><p><strong>詩篇97:1-2</strong><br>耶和華作王，願地快樂，願眾海島歡喜！<br>密雲和幽暗在他的四圍；公義和公平是他寶座的根基。</p></blockquote><p>經文說什麼圍繞上帝？</p><p class=\"read-prompt\">請讀提摩太前書6:15-16。</p><blockquote><p><strong>提摩太前書6:15-16</strong><br>到了日期，那可稱頌、獨有權能的萬王之王、萬主之主，<br>就是那獨一不死，住在人不能靠近的光裡，是人未曾看見，也是不能看見的，要將他顯明出來。但願尊貴並永遠的權能都歸給他。阿們！</p></blockquote><p>經文說上帝住在哪裡？一處經文說上帝被幽暗環繞，另一處經文卻說他住在人不能靠近的光裡。兩處經文都描述了上帝是何等偉大，超出我們的理解力。祂如此超乎我們的想象，彷彿祂在刺眼的光芒中。祂如此令我們難以理解，彷彿祂處於幽暗之中。上帝的偉大，超乎我們能製作的任何畫像或雕像。祂的偉大，也超過我們能想到的任何事物。我們要單單從祂在聖經裡啟示我們的，來了解祂是怎樣的上帝。</p>"},{"day":4,"html":"<p>第二誡命禁止我們用我們手所造的或者我們心所想的形像來敬拜上帝。以色列人在敬拜中增加了上帝未曾吩咐的事情，於是出了問題。第一次犯這罪，是敬拜領他們出埃及的上帝時，造了個金牛犢來代表上帝。後來他們反覆地把拜偶像的事新增到敬拜中。</p><p>我們也可以這樣理解這一誡命，就是我們不可在上帝自己的吩咐之外，在敬拜中新增任何東西。使徒保羅給歌羅西的信徒寫信，說到有些人告訴他們，敬拜上帝包括吃某些東西，不吃某些東西。他們把某些日子特殊化，並且為此立了規矩。請讀歌羅西書2:16,20-22。</p><blockquote><p><strong>歌羅西書2:16</strong><br>所以不拘在飲食上，或節期、月朔、安息日，都不可讓人論斷你們。</p><p><strong>歌羅西書2:20、21</strong><br>你們若是與基督同死，脫離了世上的小學，為什麼仍像在世俗中活著，服從那「不可拿、不可嘗、不可摸」等類的規條呢？</p><p><strong>歌羅西書2:22</strong><br>這都是照人所吩咐、所教導的。說到這一切，正用的時候就都敗壞了。</p></blockquote><p>保羅說這些規條是以人的吩咐和教導為基礎的。人們對上帝都有自己的看法，同樣，人們也對於如何敬拜有許多的看法。有時候，他們把上帝看著重要的事情放在一邊，讓路給那些以人的想法為基礎的東西。想要知道我們是在照著人的想法敬拜，還是在照著上帝的要求敬拜，還是得熟悉聖經。</p>"},{"day":5,"html":"<p>耶穌曾對一些不顧上帝吩咐、只要自己想法的人講話。上帝吩咐成年的兒女要孝敬年長的父母，供給他們的需要。耶穌面對的這些人，卻定了自己的規矩和傳統來使用自己的錢財。他們寧可守著這些規矩，卻不要上帝的法則。耶穌告訴這些人，他們是因著人的遺傳，犯了上帝的誡命。請讀馬太福音15:3,8-9。</p><blockquote><p><strong>馬太福音15:3</strong><br>耶穌回答說：「你們為什麼因著你們的遺傳，犯神的誡命呢？</p><p><strong>馬太福音15:8-9</strong><br>『這百姓用嘴唇尊敬我，心卻遠離我；<br>他們將人的吩咐當作道理教導人，所以拜我也是枉然。』「</p></blockquote><p>今天，在敬拜中也往往看到上帝在聖經中未曾吩咐的事情。同時，敬拜中又往往缺少了上帝吩咐我們聚集要做的事情。為什麼會這樣？是因為教會把上帝的吩咐放在一邊，倒去做那些人以為美的事情。耶穌說這樣的敬拜也是枉然。這樣的敬拜沒有價值。這樣的敬拜不是在尊崇上帝。</p>"},{"day":6,"html":"<p>不幸的是，有時候一些人號稱自己是上帝的百姓，卻教導一些聖經中根本沒有的關於上帝的事情。有些講員或者作者，或是不熟悉聖經說什麼，或是不理會聖經說什麼。他們說的上帝，正好與聖經教導的相反。他們在敬拜中，做一些並不尊崇上帝的事情。要記得，不要因為一個事情是某個講員說的，或者某本書寫的，就一定是真的。我們必須用聖經的教導來檢驗每一樣事物。當我們發現，關於上帝，有人教導不正確的東西，我們根本就不應該聽那個人的。請讀申命記13:1-4。</p><blockquote><p><strong>申命記13:1-4</strong><br>你們中間若有先知或是做夢的起來，向你顯個神蹟奇事，<br>對你說：『我們去隨從你素來所不認識的別神，事奉他吧！』他所顯的神蹟奇事，雖有應驗，<br>你也不可聽那先知或是那做夢之人的話。因為這是耶和華你們神試驗你們，要知道你們是盡心儘性愛耶和華你們神不是。<br>你們要順從耶和華你們的神，敬畏他，謹守他的誡命，聽從他的話，事奉他，專靠他。</p></blockquote>"}]},{"num":52,"title":"第二誡命所舉出的理由依據是什麼？","answer":"第二誡命所舉出的理由依據是：神在我們身上擁有主權，我們屬於祂，他熱切要我們以正確方法敬拜祂。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-3","days":[{"day":1,"html":"<p>上帝全權掌管祂所造的萬有，也就是說，祂在我們身上有完全的主權。國王有權命令臣民照著國王喜悅的方式來到面前。那麼作為萬王之王的上帝，是多麼地更加有權告訴祂自己的臣民要怎樣敬拜祂啊！不僅如此，我們藉著在主耶穌基督裡的信心成為上帝的子民，已經立志永遠委身，侍奉我們的主，我們就應該熱切地侍奉祂。上帝已經告訴我們如何敬拜，我們應該高興，因為這樣我們就可以照著祂的旨意行。請讀詩篇145:1-3；10-13。</p><blockquote><p><strong>詩篇145:1-3</strong><br>我的神、我的王啊，我要尊崇你，我要永永遠遠稱頌你的名！<br>我要天天稱頌你，也要永永遠遠讚美你的名！<br>耶和華本為大，該受大讚美，其大無法測度。</p></blockquote><blockquote><p><strong>詩篇145:10-13</strong><br>耶和華啊，你一切所造的都要稱謝你；你的聖民也要稱頌你，<br>傳說你國的榮耀，談論你的大能，<br>好叫世人知道你大能的作為，並你國度威嚴的榮耀。<br>你的國是永遠的國，你執掌的權柄存到萬代。</p></blockquote>"},{"day":2,"html":"<p>因為上帝創造萬物，萬物就都屬於上帝。那也包括我們在內。上帝用祂兒子的血將我們贖買回來，歸給祂自己，我們在雙重意義上屬於上帝。我們屬於祂，因祂造了我們；我們屬於祂，因祂買贖我們歸給祂自己。上帝有權照祂喜悅的方式來對待我們這些受造者。當祂告訴我們如何在敬拜中來到祂面前的時候，我們都當順服祂。請讀詩篇95:1-7上。</p><blockquote><p><strong>詩篇95:1-7</strong><br>來啊，我們要向耶和華歌唱！向拯救我們的磐石歡呼！<br>我們要來感謝他，用詩歌向他歡呼！<br>因耶和華為大神，為大王，超乎萬神之上。<br>地的深處在他手中，山的高峰也屬他。<br>海洋屬他，是他造的；旱地也是他手造成的。<br>來啊，我們要屈身敬拜，在造我們的耶和華面前跪下。<br>因為他是我們的神，我們是他草場的羊，是他手下的民。</p></blockquote>"},{"day":3,"html":"<p>第二誡命的理由依據是，上帝在我們身上有完全的主權，我們屬於祂，祂熱切要我們以正確方式敬拜祂。上帝要人敬拜祂，因為祂配得敬拜，因為人最大的益處就是敬拜上帝。上帝要人正確地敬拜祂，因為不照祂吩咐的敬拜是傷害人、羞辱上帝的。當以色列人預備進入上帝應許的土地，上帝告訴他們，祂將使他們能趕出一直住在那地的居民。這是因為那些人敬拜別神。他們拜偶像的行為大大冒犯上帝。祂警告以色列人，當他們進入應許地的時候，務必除掉一切偶像以及那些人曾使用的敬拜場所。他們絕不可留下任何可能引誘他們不正確敬拜真神的東西。請讀出埃及記34:13-14。</p><blockquote><p><strong>出埃及記34:13-14</strong><br>卻要拆毀他們的祭壇，打碎他們的柱像，砍下他們的木偶。<br>不可敬拜別神，因為耶和華是忌邪的神，名為忌邪者。</p></blockquote>"},{"day":4,"html":"<p>第二誡命的末尾告訴我們，上帝懲罰那些恨祂之人的罪惡。這表明上帝對於不以祂要求的方式來敬拜的那些人是多麼憤怒啊。祂看這樣的敬拜是有罪的，把如此敬拜的人看作是恨祂的人。在許多教會里，上帝要求的敬拜方式已經被人們喜歡的東西代替了。這種教會里的人還以為自己在敬拜上帝，但是實際上是在表達對上帝的恨。他們拒絕了上帝命令的敬拜方式。</p><p>先知瑪拉基把上帝的資訊寫給百姓，當時人們的敬拜鬆鬆垮垮，沒有照著上帝的命令。他們沒有把最好的牲畜作為祭物獻給上帝，反而把有病、有殘疾的牲畜帶來。上帝說，這證明他們對上帝沒有尊重。祂說，祂寧可沒有敬拜，也好過百姓缺乏敬畏和順服的敬拜。請讀瑪拉基書1:6-11。</p><blockquote><p><strong>瑪拉基書1:6-11</strong><br>藐視我名的祭司啊，萬軍之耶和華對你們說：兒子尊敬父親，僕人敬畏主人；我既為父親，尊敬我的在哪裡呢？「你們卻說：『我們在何事上藐視你的名？』<br>你們將汙穢的食物獻在我的壇上，且說：『我們在何事上汙穢你呢？』因你們說，耶和華的桌子是可輕慢的。<br>你們將瞎眼的獻為祭物，這不為惡嗎？將瘸腿的、有病的獻上，這不為惡嗎？你獻給你的省長，他豈喜悅你，豈能看你的情面嗎？」這是萬軍之耶和華說的。<br>「現在我勸你們懇求神，他好恩待我們。這妄獻的事既由你們經手，他豈能看你們的情面嗎？」這是萬軍之耶和華說的。<br>「甚願你們中間有一人關上殿門，免得你們徒然在我壇上燒火。」萬軍之耶和華說：「我不喜悅你們，也不從你們手中收納供物。」<br>萬軍之耶和華說：「從日出之地到日落之處，我的名在外邦中必尊為大。在各處，人必奉我的名燒香，獻潔淨的供物。因為我的名在外邦中必尊為大。</p></blockquote>"},{"day":5,"html":"<p>這個誡命的最後一段說，上帝對那些愛祂守祂誡命的人發慈愛。我們想要知道祂想要的是什麼，好讓我們能遵守，這樣我們顯出對祂的愛。真愛上帝的人會殷勤查考祂的話語，來了解祂要的是什麼樣的敬拜，好來治理敬拜祂。他們不會發明敬拜的方式。他們不會照著自己的喜好來敬拜，他們不會忽略上帝的心意。我們透過了解和遵行祂的命令，來顯明我們對上帝的愛。耶穌在約翰福音14:21也說了同樣的話。</p><blockquote><p><strong>約翰福音14:21</strong><br>有了我的命令又遵守的，這人就是愛我的；愛我的必蒙我父愛他，我也要愛他，並且要向他顯現。</p></blockquote>"},{"day":6,"html":"<p>上帝應許要賜福給遵守祂誡命之人的後裔。對於那些照著上帝的要求敬拜祂的，這條誡命特別地應許會賜福給他們的子孫後代。你也許有一些朋友，他們主日也去教會，不過他們主日過得似乎比你們教會更有趣。那可能是由於那裡的人們已經把上帝的要求換成了人們的喜好。你也許有一些朋友，他們根本不去教會，週日上午在家睡懶覺，或者看電視。但是如果你的父母正在按照上帝的要求培養你有規律敬拜上帝的習慣，你應該感恩。因為你父母的忠心，上帝應許賜福給你。如果你能夠持續地忠心敬拜祂，你將更加蒙福。你的子孫也會像你一樣蒙福。請讀申命記5:29。</p><blockquote><p><strong>申命記5:29</strong><br>惟願他們存這樣的心敬畏我，常遵守我的一切誡命，使他們和他們的子孫永遠得福。</p></blockquote>"}]},{"num":53,"title":"第三誡命是什麼？","answer":"第三誡命是：「不可妄稱耶和華你神的名，因為妄稱耶和華名的，耶和華必不以他為無罪。」","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-4","days":[{"day":1,"html":"<p>當我們跟別人介紹自己，告訴人家我們的名字，是因為我們想要與人家建立關係。我們每天也會見到許多不跟我們說一句話的人。他們也許會遇見另一些人，他們跟我們禮貌地打招呼，可是我們其實不認識他們。但是如果一個人站在我們面前，向我們介紹自己，告訴我們他的名字，那我們就知道，他想跟我們有比以前更近的關係。</p><p>上帝做了一件奇妙的事。祂曾告訴我們祂的名字！我們本來不可能對上帝有什麼瞭解，如果上帝不告訴我們，我們也當然不會知道祂的名字。但是上帝已經在祂的話語中跟我們講話。祂曾告訴我們祂的名字，因為祂想讓我們認識祂。祂想要我們建立關係。上帝如此偉大，一個名字不會告訴我們關於上帝的全部。因此在聖經中，上帝使用了很多名字，每個名字都向我們顯明更多關於上帝的美善。</p><p>當上帝呼召摩西帶領以色列人離開埃及為奴之地，摩西擔心百姓會問他，是誰差遣他做這事的。「我告訴百姓你叫什麼名字呢？」他問上帝。請讀出埃及記3:14-15中上帝的回答。</p><blockquote><p><strong>出埃及記3:14-15</strong><br>神對摩西說：「我是自有永有的。」又說：「你要對以色列人這樣說：『那自有的打發我到你們這裡來。』」<br>神又對摩西說：「你要對以色列人這樣說：『耶和華你祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，打發我到你們這裡來。耶和華是我的名，直到永遠；這也是我的紀念，直到萬代。』」</p></blockquote>"},{"day":2,"html":"<p>摩西帶領百姓，一邊順服主、服侍主，一邊更加認識上帝。摩西越認識上帝，就越想更加認識上帝。一天，摩西懇求上帝顯明祂的榮耀。上帝回答說，沒有人能看見上帝還存活的。於是上帝告訴摩西，祂要將摩西放在磐石洞穴中，可以有些保護。然後上帝會讓祂的榮耀經過摩西面前。同時，上帝也會向摩西宣告祂的名字。請讀出埃及記34:5-7，上帝曾說，祂要想摩西宣告祂的名字。</p><blockquote><p><strong>出埃及記34:5-7</strong><br>耶和華在雲中降臨，和摩西一同站在那裡，宣告耶和華的名。<br>耶和華在他面前宣告說：「耶和華，耶和華，是有憐憫、有恩典的神，不輕易發怒，並有豐盛的慈愛和誠實，<br>為千萬人存留慈愛，赦免罪孽、過犯和罪惡，萬不以有罪的為無罪，必追討他的罪，自父及子，直到三四代。」</p></blockquote><p>不過，祂告訴了摩西所有這些關於自己的屬性。上帝的名字代表著上帝的屬性。上帝告訴摩西，祂是有憐憫、有恩典的神。祂是忍耐、赦免、慈愛、信實的。祂是聖潔的，祂懲罰罪惡。這些關於上帝的屬性都包括在祂的名字裡面。</p><p>因此，我們必須以特別的尊重和敬畏來對待上帝的名。它代表上帝的屬性。如果用不敬的方式提到上帝的名，就是要對上帝本身不尊重。</p>"},{"day":3,"html":"<p class=\"read-prompt\">請讀詩篇8:1。</p><blockquote><p><strong>詩篇8:1</strong><br>耶和華我們的主啊，你的名在全地何其美！你將你的榮耀彰顯於天。</p></blockquote><p>上帝的作為給祂的名帶來讚美和尊榮。這篇詩篇講述了上帝奇妙的創世之工。在整個宇宙中，我們都看到上帝的名何等偉大，因為我們看到祂所造的萬物都是多麼奇妙。在舊約中，上帝為百姓所做的事，向所有人顯明，上帝的名是偉大榮耀的。上帝所作的最奇妙的事，是藉著祂的兒子為祂的百姓賜下救恩。因為祂賜給我們救恩，我們應該稱頌偉大上帝的名。</p><p>人們往往以為，上帝一切的作為主要是為著我們的緣故。上帝愛祂的百姓，祂出於祂的愛為他們做事。不過，上帝行作萬事，最重要的原因是為自己的名帶來榮耀和尊榮。上帝常告訴以色列人，祂為他們所作的，不是因為他們比別人好，而是為自己名的緣故。上帝的百姓，在舊約時代常常懇求上帝赦免、保護，不是因為他們配得，而是為祂名的緣故。請讀詩篇115:1。</p><blockquote><p><strong>詩篇115:1</strong><br>耶和華啊，榮耀不要歸與我們，不要歸與我們，要因你的慈愛和誠實歸在你的名下！</p></blockquote>"},{"day":4,"html":"<p>上帝的名大過所有其它的名。上帝的名代表祂的屬性。上帝行奇事，為自己的名得榮耀稱頌。祂要求我們榮耀祂的名，以尊重的態度對待祂的名。我們中間凡愛祂的人，都會樂於稱頌上帝偉大的名。請讀詩篇113:1-4。</p><blockquote><p><strong>詩篇113:1-4</strong><br>你們要讚美耶和華！耶和華的僕人哪，你們要讚美，讚美耶和華的名！<br>耶和華的名是應當稱頌的，從今時直到永遠！<br>從日出之地到日落之處，耶和華的名是應當讚美的！<br>耶和華超乎萬民之上，他的榮耀高過諸天！</p></blockquote>"},{"day":5,"html":"<p class=\"read-prompt\">請讀路加福音11:1-4。</p><blockquote><p><strong>路加福音11:1-4</strong><br>耶穌在一個地方禱告。禱告完了，有個門徒對他說：「求主教導我們禱告，像約翰教導他的門徒。」<br>耶穌說：「你們禱告的時候，要說：我們在天上的父，願人都尊你的名為聖。願你的國降臨，願你的旨意行在地上，如同行在天上。<br>我們日用的飲食，天天賜給我們。<br>赦免我們的罪，因為我們也赦免凡虧欠我們的人。不叫我們遇見試探；救我們脫離兇惡。『」</p></blockquote><p>耶穌的門徒請求耶穌教導他們如何禱告。如果禱告是與上帝說話，耶穌知道關於禱告所有應該知道的。耶穌，聖子上帝，是自有永有的。從永恆之中，祂就愛聖父上帝，與聖父上帝相交。因為耶穌是上帝，所以耶穌知道父神的心意。祂知道我們應該如何用上帝喜悅的方式禱告。耶穌說我們禱告中首先要祈求的是：「願人都尊父的名為聖」。通常，我們禱告的時候，首先想求的，就是當下我們最大的需要。耶穌教導我們，首先當求的是，願人都照著上帝的名所配得的，尊上帝的名為聖。</p>"},{"day":6,"html":"<p>上帝關於自己的名字所說的，也適用於主耶穌基督的名。耶穌是聖子上帝，聖父上帝也要耶穌的名字如同自己的名字一樣得著尊榮。除此以外，因為耶穌成為人，為上帝百姓的罪而死，聖父上帝要祂的兒子更加得尊榮。請讀腓立比書2:8-11。</p><blockquote><p><strong>腓立比書2:8-11</strong><br>既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。<br>所以神將他升為至高，又賜給他那超乎萬名之上的名，<br>叫一切在天上的、地上的和地底下的，因耶穌的名無不屈膝，<br>無不口稱耶穌基督為主，使榮耀歸與父神。</p></blockquote><p>耶穌的名，也包括在這條不可妄稱上帝之名的誡命中。我們對於上帝的名所有的敬畏、榮耀、尊重，也必須同樣應用於主耶穌基督的名。</p>"}]},{"num":54,"title":"第三誡命吩咐我們作什麼？","answer":"第三誡命吩咐我們：當存聖潔敬畏的心，使用神的名字、稱號、屬性、法則、聖道與工作。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-4","days":[{"day":1,"html":"<p>十誡中的第一誡告訴我們，敬拜的物件應該是上帝，而且只能是上帝。第二誡命告訴我們，敬拜的時候怎麼做，用什麼方式。我們不可以用偶像或者上帝沒有要求的方式來敬拜，而只能照著祂所命令的來敬拜。這第三條誡命，仍將我們的注意力集中於對上帝的敬拜。這條誡命告訴我們敬拜的時候，應當懷怎樣的態度。我們敬拜的時候，當然也包括我們使用上帝名字的任何時候，都必須留心要有十分尊敬的態度。我們對於上帝當有的尊敬，有一個特別的名字叫做：敬畏。我們談到上帝時，或者我們與上帝說話時，都要有敬畏的態度。這是因為，祂遠遠地高過我們，大過我們。請讀詩篇99:1-5。</p><blockquote><p><strong>詩篇99:1-5</strong><br>耶和華作王，萬民當戰抖！他坐在二基路伯上，地當動搖！<br>耶和華在錫安為大，他超乎萬民之上。<br>他們當稱讚他大而可畏的名，他本為聖！<br>王有能力，喜愛公正，堅立公正，在雅各中施行公平和公義。<br>你們當尊崇耶和華我們的神，在他腳凳前下拜；他本為聖！</p></blockquote>"},{"day":2,"html":"<p>在先前的問答中，我們曾經學過，十誡是道德律的總結。十誡是上帝賜給人要人遵守的所有律法的縮影。要理問答中關於十誡的問答讓我們看到，僅僅遵守十誡的字面要求是不夠的。比如，如果我們遵守了「不妄稱上帝的名」這一誡命，卻不明白上帝的話語，我們還是沒有真正地遵守第三條誡命。因此，要理問答對第三誡要求什麼，所給的答案就不僅包括以敬畏的態度使用「上帝」這個詞。答案說，上帝還要求我們要以敬畏之心使用祂的名字、稱號、屬性、法則、聖道以及工作。這些都是上帝藉以向我們顯明祂自己的途徑。</p><p>上帝在聖經中有許多的名號。祂的名字與稱號都幫助我們認識祂的屬性。上帝已經在聖經中向我們啟示祂自己。祂已經告訴我們，祂自己的一些屬性，比如聖潔、良善、公義和權能。上帝賜給我們法則或指令，告訴我們如何來到祂面前，如何長成基督的樣式。這些法則，當我們使用的時候，就能夠幫助我們更加認識祂。上帝還在祂的話語——聖經——中向我們啟示自己。上帝也藉著祂的工作、作為向我們顯明祂自己。當我們研究祂的創造、祂每一日眷顧受造之物、以及祂為我們成就的救恩，都可以看到上帝的屬性。請讀詩篇138:1-2。</p><blockquote><p><strong>詩篇138:1-2</strong><br>我要一心稱謝你，在諸神面前歌頌你！<br>我要向你的聖殿下拜，為你的慈愛和誠實讚美你的名；因你使你的話顯為大，過於你所應許的。</p></blockquote>"},{"day":3,"html":"<p>在聖經中，上帝有許多不同的名字。這是因為，對於上帝的百姓來說，沒有哪一個名字能夠完全包括上帝所有的屬性。你能想到聖經裡面上帝的一些名字嗎？除了祂的名字，祂還有一些稱號比如「造物的主」「鑑察人的主」「萬王之王、萬主之主」。無論我們什麼時候提到上帝，或者與上帝說話的時候，我們都要留意使用上帝在聖經中使用的名字和稱號。如果說成「上面像我的那一位」或者說上帝是「樓上那位」，都沒有對上帝顯出當有的敬重。上帝已經在聖經中向我們顯明祂的屬性。祂已經向我們顯明祂的很多特質。上帝已經啟示了祂的名字、稱號、屬性，好叫我們認識祂。祂要我們在聖經中學習這些東西，常常思想。我們應該讓上帝所啟示給我們的這一切來幫助我們更加愛祂。上帝的名字、稱號以及屬性，我們應該學習敬畏祂，以祂為樂。請讀詩篇145:1-5。</p><blockquote><p><strong>詩篇145:1-5</strong><br>我的神、我的王啊，我要尊崇你，我要永永遠遠稱頌你的名！<br>我要天天稱頌你，也要永永遠遠讚美你的名！<br>耶和華本為大，該受大讚美，其大無法測度。<br>這代要對那代頌讚你的作為，也要傳揚你的大能。<br>我要默唸你威嚴的尊榮，和你奇妙的作為。</p></blockquote>"},{"day":4,"html":"<p>我們想要越來越認識上帝，所需要的一切上帝已經賜給我們了，只要好好使用，我們就會活在上帝的心意之中。如果我們想要遵守這第三誡命，我們就要以敬畏的態度來對待這些事。我們會忠心地使用上帝為了我們的成長所預備的一切。上帝已經賜給我們禱告，作為幫助我們在基督裡成長的途徑之一。我們要忠心地禱告，當我們禱告的時候，我們要有敬畏的態度。上帝已經賜給我們教會里面其他的基督徒。祂要我們定期跟他們聚集來讀</p><p>經聽道，一同敬拜。上帝已經賜給我們洗禮和聖餐，也叫我們更加認識祂，更長成耶穌的樣式。</p><p>人很容易忽略上帝賜給我們的這些規矩。有時候我們忙忙碌碌，以至於很難抽時間禱告或者聚會。但是上帝要求我們，要善用上帝已經賜給我們的這些事。我們善用這些恩典的途徑時，要以敬畏的心對待上帝的安排，要留心照著上帝的吩咐來做。早期的基督徒們給我們樹立了好榜樣，他們忠心地、心懷敬畏地使用上帝為著他們的成長所賜的一切。請讀使徒行傳2:42-47。</p><blockquote><p><strong>使徒行傳2:42-47</strong><br>都恆心遵守使徒的教訓，彼此交接，擘餅，祈禱。<br>眾人都懼怕。使徒又行了許多奇事、神蹟。<br>信的人都在一處，凡物公用；<br>並且賣了田產、家業，照各人所需用的分給各人。<br>他們天天同心合意恆切地在殿裡，且在家中擘餅，存著歡喜、誠實的心用飯，<br>讚美神，得眾民的喜愛。主將得救的人天天加給他們。</p></blockquote>"},{"day":5,"html":"<p>如果我們想要尊重上帝的名，我們就要尊重地向我們啟示祂名的聖經。我們帶著敬畏之心使用聖經，我們敬拜中的態度就會榮耀上帝。聖經是奇妙的寶藏——是一本完整的書，上帝藉著聖經告訴我們祂是怎樣的，祂為我們做了什麼，祂想要我們怎麼樣。有聖經卻束之高閣，是很傻的事！我們應該每天研讀上帝的話語，渴慕祂的心意，在其中尋求祂的旨意，好讓我們能快快遵行，這樣才算是以敬畏之心對待聖經。</p><p>約西亞王是一位對上帝的話有如此敬畏之心的好榜樣。在他還沒有作王之前，以色列人早就開始敬拜偶像了。他們越來越少使用上帝的聖殿，以至於聖殿已經雜亂無章、荒涼潦倒。約西亞王叫工匠清理修繕聖殿。他們幹活的時候，發現了一卷經書。經書裡面寫著上帝的律法。以色列人久已忽略上帝的話，導致這卷經書已經是大家能找到的唯一一卷了，而且是遺失多年了！約西亞王叫人給他讀這卷書的話。他一邊聽，一邊意識到百姓一直以來是多麼的悖逆。他認識到了律法的本質——是人人都要遵行的上帝的話。請讀歷代志下34:19-21,31，看看約西亞如何回應上帝的話語。</p><blockquote><p><strong>歷代志下34:19-21</strong><br>王聽見律法上的話，就撕裂衣服，<br>吩咐希勒家與沙番的兒子亞希甘、米迦的兒子亞比頓、書記沙番和王的臣僕亞撒雅說：<br>「你們去為我、為以色列和猶大剩下的人，以這書上的話求問耶和華，因我列祖沒有遵守耶和華的言語，沒有照這書上所記的去行，耶和華的烈怒就倒在我們身上。」</p><p><strong>歷代志下34:31</strong><br>王站在他的地位上，在耶和華面前立約，要盡心儘性地順從耶和華，遵守他的誡命、法度、律例，成就這書上所記的約言。</p></blockquote>"},{"day":6,"html":"<p>上帝藉著祂的作為和奇事來向我們啟示祂自己。上帝的作為之一是創造。上帝全部的創造都顯明，上帝是偉大的。我們要因祂所造的一切來讚美祂，讓我們所看到的奇妙提醒我們，我們的上帝是多麼奇妙。上帝在護理中的作為也向我們顯明上帝。祂每一天眷顧祂的百姓，供應他們的需要，為著他們的益處以及上帝的榮耀來安排他們生命中的一切事情。</p><p>當我們觀看上帝藉著萬事執行祂的計劃，我們應該為祂的作為來讚美祂、信任他。上帝最偉大的作為就是祂的拯救之工。祂藉著賜給百姓救恩，最好地彰顯祂自己。我們一定要接受祂所賜的救恩，對上帝的作為存感恩的心來過順服的生活。我們要以敬畏之心對待上帝創造、護理和拯救的作為，讓這些事吸引我們更多地讚美上帝、愛上帝。請讀啟示錄15:3下-4。</p><blockquote><p><strong>啟示錄15:3-4</strong><br>主神，全能者啊，你的作為大哉，奇哉！萬世之王啊，你的道途義哉，誠哉！<br>主啊，誰敢不敬畏你，不將榮耀歸與你的名呢？因為獨有你是聖的，萬民都要來在你面前敬拜，因你公義的作為已經顯出來了。</p></blockquote>"}]},{"num":55,"title":"第三誡命禁止我們什麼？","answer":"第三誡命禁止我們褻瀆與妄用凡神藉以彰顯自己的任何事物。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-4","days":[{"day":1,"html":"<p>在上一個問答當中我們看到，上帝命令我們不可妄用祂的名字，祂其實是關心我們對於祂的態度。第三誡命包括的還不僅僅是我們對待上帝名字的態度。它也要求我們對於凡是上帝用來彰顯自己的事物都要有敬畏的態度。我們在上一個問答當中看到，上帝藉著諸多事物彰顯自己：祂的名字，祂的稱號，祂的屬性，來到祂面前以及在敬虔上長進的途徑，祂的話語，祂的作為。</p><p>第三誡命要求我們使用這些事物來增加我們對上帝的認識和順服。它要求我們，不僅要使用這些事物，而且要以敬畏的態度來使用。當然，這條誡命同時也禁止一些事。我們不可以對於上帝用以彰顯自己的事物表示不虔不敬。上帝禁止我們把這些事物看作平常。我們必須把這些事物看作是神聖的。上帝不可以濫用它們，不可以不按照上帝計劃的方式來使用它們。上帝按照祂當得的榮耀來尊崇祂。請讀瑪拉基書2:2。</p><blockquote><p><strong>瑪拉基書2:2</strong><br>萬軍之耶和華說：「你們若不聽從，也不放在心上，將榮耀歸與我的名，我就使咒詛臨到你們，使你們的福分變為咒詛；因你們不把誡命放在心上，我已經咒詛你們了。</p></blockquote>"},{"day":2,"html":"<p>上帝至高無上。祂比我們大多了。上帝的名字代表祂的本體，所以一定要把上帝的名字看作是至高聖的。人們常常在平時的語言中把上帝的名字當作普通的詞。這是一種褻瀆。是對上帝的侮辱。以色列人離開埃及嚮應許地行進的途中，有兩個人打架了。我想你們都知道人生氣的感受。生氣的時候，人會說一些平時不大可能說的話。打架的兩個人中，有一個用上帝的名字來罵人。有人就把這事報告給了摩西。摩西把那人關起來，等候上帝指示如何處置濫用上帝名字的那人。請讀利未記24:13-16,23，看看上帝說要如何處置那人。</p><blockquote><p><strong>利未記24:13-16</strong><br>耶和華曉諭摩西說：<br>「把那咒詛聖名的人帶到營外，叫聽見的人都放手在他頭上，全會眾就要用石頭打死他。<br>你要曉諭以色列人說：『凡咒詛神的，必擔當他的罪。<br>那褻瀆耶和華的名的，必被治死，全會眾總要用石頭打死他。不管是寄居的是本地人，他褻瀆耶和華名的時候，必被治死。』</p><p><strong>利未記24:23</strong><br>於是，摩西曉諭以色列人，他們就把那咒詛聖名的人帶到營外，用石頭打死。以色列人就照耶和華所吩咐摩西的行了。</p></blockquote><p>當我們在聖經中讀到類似的記載，我們應該記住，這表明了上帝的屬性，上帝對於濫用祂名字的人是什麼感受，上帝會如何審判那人。上帝是不改變的。今天，對於用上帝的名字來罵人的，或者把上帝的名字當作口頭禪的，或者用很輕浮的方式使用上帝的名字的，上帝仍有同樣的感受。我們也要以敬畏之心對待上帝所有的稱號和屬性。請讀列王紀下19:22。</p><blockquote><p><strong>列王紀下19:22</strong><br>你辱罵誰？褻瀆誰？揚起聲來，高舉眼目攻擊誰呢？乃是攻擊以色列的聖者！</p></blockquote>"},{"day":3,"html":"<p>上帝給我們規定了一些途徑，讓我們在照著祂的本意使用的時候，就有助於我們來認識祂，長成耶穌的樣式。這條誡命禁止我們妄用這些事物。下面的這些事，如果我們做了，就是妄用了上帝的規定和安排。在敬拜中，我們可能咯咯傻笑、竊竊私語、打瞌睡、或者在座位上一副懶洋洋的樣子，一點禮貌也沒有。當我們這麼做的時候，我們就沒有以敬畏的心來對待上帝給我們所安排的一切。如果在禱告、敬拜或者讀經中，我們任由我們的思緒遊蕩於上帝以外的事物，我們是在妄用上帝的安排，沒有把它們當作是神聖的。</p><p>妄用上帝所安排的事物，還有一種形式，就是隻在外表做，裡面卻根本不屬於上帝。有時候，有些人也會做一些真基督徒做的事，但是他們這麼做，只是為了讓人注意，讓人以為他們還不錯。在他們的心裡，他們對於上帝沒有真愛，對上帝也根本不感興趣。所有這些妄用上帝神聖事物的方式，都表現出對於上帝缺乏敬意。請讀詩篇50:16-17。</p><blockquote><p><strong>詩篇50:16-17</strong><br>但神對惡人說：「你怎敢傳說我的律例，口中提到我的約呢？<br>其實你恨惡管教，將我的言語丟在背後。</p></blockquote>"},{"day":4,"html":"<p>我們要使用上帝的話語，並且以敬畏之心對待它。有時候，在基督徒家庭里長大的孩子，雖然去基督教會，不過從他們的舉動看，他們似乎很厭煩上帝的話。他們不僅自己不帶經文去主日學，甚至老師借給他們，他們也不想用。他們常常找藉口說：「這個我都知道了。」這樣的孩子是在藐視上帝的話。</p><p>有人妄用上帝的話，使用聖經的經文，來教導經文沒有教導的東西。這些人使用一兩節經文，而不是使用一節經文說出上帝本來無意要說的話。使徒彼得寫到保羅的書信，那書信也是上帝話語的一部分。他說，有人讓保羅的信說出本來沒說的東西。請讀彼得後書3:16，看看彼得怎麼說這話人。</p><blockquote><p><strong>彼得後書3:16</strong><br>他一切的信上也都是講論這事。信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪。</p></blockquote><p>有人也這樣使用上帝的話，他們把自己的意見說成是「主的話」。有人這麼說：「主告訴我這麼做」或者「上帝跟我說話了。」他們實際上在談論自己的感受或者觀點。上帝已經在聖經裡面告訴我們他要對我們說的一切。祂不用別的方式說話。請讀耶利米書23:34-36。</p><blockquote><p><strong>耶利米書23:34-36</strong><br>無論是先知，是祭司，是百姓說『耶和華的默示』，我必刑罰那人和他的家。<br>你們各人要對鄰舍，各人要對弟兄如此說：『耶和華回答什麼？耶和華說了什麼呢？』<br>『耶和華的默示』你們不可再提，各人所說的話必作自己的重擔。因為你們謬用永生神萬軍之耶和華我們神的言語。</p></blockquote>"},{"day":5,"html":"<p>上帝把祂的作為顯給我們看，用另一種方式來向我們顯明祂自己。我們要讓受造的世界來提醒我們造物主的偉大。今天，許多人說，所有的受造物加在一起就是上帝。我們絕對不可以這樣來妄用上帝創造的工作。</p><p>上帝每一天也在護理中行事。祂賜給我們順境，讓我們因此感恩；也賜給我們逆境，讓我們學習更加信靠祂。當我們把所得的祝福當作理所當然，讓這些祝福把我們帶離上帝，我們就是在妄用上帝護理的工作。請讀何西阿書13:6，上帝指責百姓對於祂的禮物忘恩負義。</p><blockquote><p><strong>何西阿書13:6</strong><br>這些民照我所賜的食物得了飽足；既得飽足，心就高傲，忘記了我。</p></blockquote><p>我們對於生命中的患難，如果沒有把它看成是上帝的管教或者是幫助我們成長的途徑，反而產生苦毒心態的時候，我們也是在妄用上帝的護理之工。請讀耶利米書5:3。</p><blockquote><p><strong>耶利米書5:3</strong><br>耶和華啊，你的眼目，不是看顧誠實嗎？你擊打他們，他們卻不傷慟；你毀滅他們，他們仍不受懲治。他們使臉剛硬過於磐石，不肯回頭。</p></blockquote>"},{"day":6,"html":"<p>上帝最偉大的作為是拯救之工。當我們接受祂的救恩，信靠基督來救我們，以祂為主，為祂而活，這樣我們就是在尊崇上帝。妄用上帝名字的一種方式就是，當我們不屬於上帝，也沒有為祂而活的時候，非得說自己在上帝名下。很多人說他們是基督徒或者上帝的兒女，但是看他們的活法，誰都看得出來他們根本不認識上帝。只有那些為祂而活，正在祂的樣式中成長的人，上帝才允許稱作祂自己名下的人。請讀馬太福音7:21-23。</p><blockquote><p><strong>馬太福音7:21-23</strong><br>凡稱呼我『主啊，主啊』的人，不能都進天國；惟獨遵行我天父旨意的人，才能進去。<br>當那日，必有許多人對我說：『主啊，主啊，我們不是奉你的名傳道，奉你的名趕鬼，奉你的名行許多異能嗎？』<br>我就明明地告訴他們說：『我從來不認識你們，你們這些作惡的人，離開我去吧！』</p></blockquote>"}]},{"num":56,"title":"第三誡命所舉出的理由依據是什麼？","answer":"第三誡命所舉出的理由依據是：雖然違犯此誡命，可能逃避從人來的刑罰，但是主耶和華我們的神，必不容他們逃脫公義的審判。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-4","days":[{"day":1,"html":"<p>上帝一直善待我們。祂的名對於祂來說非常重要。祂總是要祂的名得到當得的尊重。祂賜給我們祂的名，讓我們為得救而呼求。上帝告訴我們，祂重重地刑罰罪惡。然後祂告訴我們，如果我們呼求祂拯救我們，祂就會拯救我們脫離那刑罰。請讀羅馬書10:12-13。</p><blockquote><p><strong>羅馬書10:12-13</strong><br>猶太人和希臘人並沒有分別；因為眾人同有一位主，他也厚待一切求告他的人。<br>因為「凡求告主名的，就必得救。」</p></blockquote><p>上帝不僅告訴我們祂的名字是什麼，而且祂告訴我們祂的名字，是為了叫我們可以呼求，來得到我們所需的救恩。</p>"},{"day":2,"html":"<p>每個人都應該知道，上帝告訴我們祂的名字，這是祂多麼慈愛的作為啊。尤其是，祂把祂的名告訴我們，這樣我們可以用祂的名呼求祂，好使我們得救。我們都應該為著上帝啟示我們祂的名而感恩。我們應該尊敬祂的名。不過，有很多人根本一點也不尊重上帝和祂的名。很多人濫用上帝的名，當發生這樣事的時候，也沒有多少人在意。上帝是慈愛的，祂給那些濫用祂名的人降下禍患，要提醒他們注意。祂讓這些事情臨到，要叫人轉回尊重祂。往往，人們卻拒絕悔改，反倒更加不尊重上帝的名。請讀啟示錄16:8-9。</p><blockquote><p><strong>啟示錄16:8-9</strong><br>第四位天使把碗倒在日頭上，叫日頭能用火烤人。<br>人被大熱所烤，就褻瀆那有權掌管這些災的神之名，並不悔改將榮耀歸給神。</p></blockquote><p>這些人越是頑梗不悔改，上帝就為他們積蓄更重的審判。</p>"},{"day":3,"html":"<p>上帝是慈愛的，祂告訴我們祂的名，叫我們可以呼求，以致得救。祂還以另一種慈愛的方式使用祂的名在我們身上。凡是蒙祂拯救的，祂就讓他們歸在自己的名下。歸在上帝的名下，意思是，信徒擁有「上帝的百姓」「上帝的兒女」「基督徒」等名字。能夠歸在上帝的名下，是一個相當大的特權。請讀申命記28:9-10。</p><blockquote><p><strong>申命記28:9-10</strong><br>你若謹守耶和華你神的誡命，遵行他的道，他必照著你所起的誓，立你作為自己的聖民。<br>天下萬民見你歸在耶和華的名下，就要懼怕你。</p></blockquote>"},{"day":4,"html":"<p>上帝是慈愛的，祂讓祂的百姓歸在祂的名下。不過，他們必須牢記，上帝要求他們尊重祂的名。歸在上帝的名下是個特權，但也是重大的責任。如果我們自稱是上帝的百姓，我們就必須活得像上帝的百姓。如果我們說我們是跟隨主耶穌基督的，我們就必須要藉著遵行祂的命令來尊敬祂。當我們說上帝使我們成為祂的兒女時，我們就應該藉著我們的生活和態度，來使上帝的名得著榮耀。若有人說自己是上帝的百姓，卻忽略上帝的話語，這就表明他/她根本不是上帝的百姓。不管人自己說自己如何愛上帝，凡是違犯上帝命令的，就表明他是恨上帝。上帝會因為那人不尊重祂的名而審判那人。請讀提摩太後書2:19。</p><blockquote><p><strong>提摩太後書2:19</strong><br>然而，神堅固的根基立住了。上面有這印記說：「主認識誰是他的人。」又說：「凡稱呼主名的人總要離開不義。」</p></blockquote>"},{"day":5,"html":"<p>我們應該以感恩的心來敬拜上帝的名，為著祂將祂的名告訴我們而感恩。上帝的百姓應該尊敬上帝的名，因為祂將自己的名告訴他們，好叫他們呼求，以致得救。我們必須尊敬上帝的名，還因為祂說過要嚴懲那些不尊敬祂的人。對上帝之名的不敬，已經非常氾濫。上帝的名被用來罵人，上帝的話語也被褻瀆，不被遵守。可是似乎沒人在乎。可是上帝很在乎。濫用祂的名，不順服祂的，祂將懲罰。請讀申命記28:58-59。</p><blockquote><p><strong>申命記28:58,59</strong><br>這書上所寫律法的一切話，是叫你敬畏耶和華你神可榮可畏的名。你若不謹守遵行，耶和華就必將奇災，就是至大至長的災，至重至久的病，加在你和你後裔的身上。</p></blockquote>"},{"day":6,"html":"<p>當我們尊重敬畏上帝和祂的名的時候，上帝並沒有因此欠我們什麼。不過上帝是如此的慈愛，祂應許，因為我們只是做了祂最起碼應該做的事情，祂要報答我們。祂應許要因為我們敬畏祂的名報答我們。祂應許，當我們尊重祂的名，祂算我們是愛祂的人。上帝應許要祝福我們和我們的子孫，直到千代。上帝現在耐心地等候人們悔改，不過總有一天，祂會審判那些不尊重上帝和祂名的人，正如祂說過的一樣。請讀啟示錄11:16-18。</p><blockquote><p><strong>啟示錄11:16-18</strong><br>在神面前，坐在自己位上的二十四位長老，就面伏於地敬拜神，說：<br>「昔在、今在的主神，全能者啊，我們感謝你！因你執掌大權作王了。」<br>外邦發怒，你的忿怒也臨到了，審判死人的時候也到了；你的僕人眾先知和眾聖徒，凡敬畏你名的人，連大帶小得賞賜的時候也到了；你敗壞那些敗壞世界之人的時候也就到了。「</p></blockquote>"}]},{"num":57,"title":"第四誡命是什麼？","answer":"第四誡命是：「當記念安息日，守為聖日。六日要勞碌作你一切的工，但第七日是向耶和華你神當守的安息日；這一日你和你的兒女、僕婢、牲畜，和你城裡寄居的客旅，無論何工都不可做，因為六日之內，耶和華造天地海和其中的萬物，第七日便安息，所以耶和華賜福與安息日，定為聖日。」","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-5","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀創世記2:1-3。</p><blockquote><p><strong>創世記2:1-3</strong><br>天地萬物都造齊了。<br>到第七日，神造物的工已經完畢，就在第七日歇了他一切的工，安息了。<br>神賜福給第七日，定為聖日，因為在這日神歇了他一切創造的工，就安息了。</p></blockquote><p>上帝從無中造出萬有。祂在六日之內創造了一切。在第七日，上帝歇了祂的工。上帝不是累了。上帝是靈，沒有身體。祂不會疲乏。但是上帝選擇了第七日，叫這一天成為安歇休息的一個特殊日子。這一天須特別對待，人要停下日常的工作，整天安息，享受上帝。</p>"},{"day":2,"html":"<p>在上帝創造萬有多年之後，上帝呼召猶太人作自己的百姓，祂把祂的律法賜給他們。祂賜給他們的律法中有一條就是現在我們正在學習的。猶太人必須認真地分別七日裡的一日來作為停工休息的日子。上帝在舊約的百姓還有其他的安息。他們要耕種田地六年，第七年他們必須讓田地安息一年。在第七年，他們不可種植任何莊稼，也不可耕作田地。</p><p>每五十年也會有一個特別的安息。被稱作禧年。在禧年，那些因為貧困潦倒而出賣田地的人可以得回他們的田地。同樣，那些因窮困而作奴僕的人都要在第五十年得釋放。（利未記25章）。請讀出埃及記31:12。</p><blockquote><p><strong>出埃及記31:12</strong><br>耶和華曉諭摩西說。</p></blockquote><p>這些的安息，都是在描述主耶穌，祂將賜給百姓安息，脫離在祂降世之前的那些禮儀和獻祭。</p>"},{"day":3,"html":"<p>耶穌在地上的時候，祂常常讓法利賽人惱火。（法利賽人就是那些非常注重遵行規條的人）。讓他們惱火的事情之一，就是耶穌並沒有像他們以為的那樣，在安息日謹慎自己的行為。祂在安息日醫病，還有一次，祂竟然允許祂那些飢餓的門徒在安息日掐麥穗吃。在馬太福音12:8，耶穌如何稱自己？</p><blockquote><p><strong>馬太福音12:8</strong><br>因為人子是安息日的主。</p></blockquote><p>耶穌就是安息的實現。安息日不過是描繪了祂將要賜給百姓的安息。祂會替他們完全地遵守上帝的誡命，這些誡命是百姓絕對無法自己完成的。他們不必再反覆地獻祭，每次都得一絲不苟。所有的獻祭、禮儀和特別的日子，都是刻畫著救主對於百姓的意義。</p>"},{"day":4,"html":"<p>上帝做完了創造的奇妙大工，第七日就安息了。於是舊約中上帝的百姓就把第七日作為特別的敬拜安息的日子。主耶穌基督做完了祂拯救百姓的奇妙大工，在七日的第一日從死裡復活。於是上帝的百姓現在把第一日作為特別的敬拜和安息的日子。請讀使徒行傳20:7。</p><blockquote><p><strong>使徒行傳20:7</strong><br>七日的第一日，我們聚會擘餅的時候，保羅因為要次日起行，就與他們講論，直講到半夜。</p></blockquote><p>這節經文給我們看到上帝的百姓在七日的第一日聚會的例子。他們聚集領受聖餐，聽保羅講道。</p>"},{"day":5,"html":"<p class=\"read-prompt\">請讀歌羅西書2:16-17。</p><blockquote><p><strong>歌羅西書2:16-17</strong><br>所以不拘在飲食上，或節期、月朔、安息日，都不可讓人論斷你們。<br>這些原是後事的影兒，那形體卻是基督。</p></blockquote><p>節期、安息日不過是後事的影兒。它們描繪的是耶穌的作為。耶穌是賜給我們完全安息的那一位，安息日不過是祂的預表而已。有的人相信，既然耶穌已經來了，我們就不需要再守安息日了。有的人說，既然守安息日是十誡之一，是道德律的一部分，所以今天人們還需要尊重這日。</p>"},{"day":6,"html":"<p>真正的基督徒，雖然都知道並且遵行上帝的話，但不是凡事都意見相合。基督徒是否需要像舊約信徒那樣守安息日，就是基督徒們意見不合的一個領域。至於如何面對我們的分歧，羅馬書14:5-6,22給了我們一些指導原則。</p><blockquote><p><strong>羅馬書14:5-6</strong><br>有人看這日比那日強，有人看日日都一樣，只是各人心裡要意見堅定。<br>守日的人，是為主守的；</p><p><strong>羅馬書14:22</strong><br>你有信心，就當在神面前守著。人在自己以為可行的事上能不自責，就有福了。</p></blockquote>"}]},{"num":58,"title":"第四誡命吩咐我們什麼？","answer":"第四誡命吩咐我們：將神在聖道中所分別出來的時間，向祂謹守為聖；特別是七日中的一整日，向祂守為聖安息日。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-5","days":[{"day":1,"html":"<p>安息日是一種歇息。在創造的時候，第一個安息日，上帝歇了祂創造的工作。這第四誡吩咐上帝的百姓，要藉著停止日常一切的工作來尊重安息日。舊約的律法要求人們讓田地有安息年。田地每七年要休息一年，不可耕種。那麼這種休息的目的是什麼呢？原因是，人從工作中有規律地分出時間休息，不是僅是人的益處，而是上帝自己的榮耀。安息日就是要提醒上帝所有的百姓，他們需要休息。上帝呼召他們與祂同享安息。七日之中，為上帝分出一天，停止日常的工作，這樣可以提醒上帝的百姓這些事情。請讀詩篇62:1,5。</p><blockquote><p><strong>詩篇62:1</strong><br>我的心默默無聲，專等候神；我的救恩是從他而來。</p><p><strong>詩篇62:5</strong><br>我的心哪，你當默默無聲，專等候神，因為我的盼望是從他而來。</p></blockquote>"},{"day":2,"html":"<p>上帝的百姓只有在上帝裡面才能找到真正的安息。安息是上帝賜給百姓的眾多福分之一。上帝給百姓的所有福分，包括安息日，都是藉著上帝所差遣的救主耶穌而來的。舊約的信徒守安息日盼望彌賽亞來臨之前上帝將賜下的安息。</p><p>在《天路歷程》這個故事中，基督徒揹負著無法卸下的重擔。他揹負這包袱有好長的時間，包袱又是那麼重，他發現自己什麼也不想了，只想解脫這可怕的負擔，得到安息。他起身去尋找安息。最終在十字架那裡找到了。當他來到十字架，包袱自動從他肩上掉下來，骨碌碌滾走了。基督徒就再也沒有看見它了。</p><p>耶穌賜給上帝的百姓安息，脫離罪惡的重擔。祂賜他們安息，脫離想要賺取上帝喜悅的不可能的任務。耶穌賜給他們安息，脫離彌賽亞來臨之前他們照著要求必須做的許多的獻祭和儀式。安息日預表著耶穌所賜的完美安息。請讀馬太福音11:27-29。</p><blockquote><p><strong>馬太福音11:27-29</strong><br>一切所有的，都是我父交付我的。除了父，沒有人知道子；除了子和子所願意指示的，沒有人知道父。<br>凡勞苦擔重擔的人，可以到我這裡來，我就使你們得安息。<br>我心裡柔和謙卑，你們當負我的軛，學我的樣式，這樣，你們心裡就必得享安息。</p></blockquote>"},{"day":3,"html":"<p>安息日預表著信徒們在耶穌裡的安息。當我們憑著信心來到耶穌那裡，相信祂會賜給我們安息，脫離守律法的重任，脫離我們罪惡的重擔，我們就是做了安息日所預表的事。我們歇了我們的勞苦。我們不再企圖藉著我們的行為賺取上帝的喜悅。請讀希伯來書4:8-11。</p><blockquote><p><strong>希伯來書4:8-11</strong><br>若是約書亞叫他們享了安息，後來神就不再提別的日子了。<br>這樣看來，必另有一安息日的安息，為神的子民存留。<br>因為那進入安息的，乃是歇了自己的工，正如神歇了他的工一樣。<br>所以，我們務必竭力進入那安息，免得有人學那不信從的樣子跌倒了。</p></blockquote>"},{"day":4,"html":"<p>那麼我們應當怎麼做，才算是享受了上帝藉著耶穌所賜的安息呢？當我們聽到福音的時候，我們相信福音。就是那麼簡單。福音就是好訊息，因為上帝恨惡我們的罪，我們一直與上帝為敵，不過上帝開了一條路，叫我們成為祂的朋友。上帝賜下祂的兒子替我們死，除去我們所有罪的刑罰。祂的兒子在這世上生活了三十多年，從來沒有犯過罪，而是一直完美地遵行了上帝的律法。這本來是上帝要求我們做到的，我們沒有做到。當耶穌行了上帝的律法，祂是替我們做的。祂為我們的罪償還了罪債，祂為我們遵行了上帝的律法。沒有給我們留下什麼要我們自己做。這就是福音了。</p><p>現在，上帝要我們做的，就是要信福音。如果我們信福音，我們就是與上帝認同，承認我們是罪人，應當面對上帝的憤怒，而且我們沒有辦法來改變這件事。當我們相信福音的時候，我們相信，耶穌已經做了除罪所需的一切，而且使我們與上帝化敵為友。只有相信福音，我們才能開始享受上帝所預備的，藉著安息日所預表的安息。請讀希伯來書4:1-3上。</p><blockquote><p><strong>希伯來書4:1-3</strong><br>我們既蒙留下有進入他安息的應許，就當畏懼，免得我們中間或有人似乎是趕不上了。<br>因為有福音傳給我們，像傳給他們一樣；只是所聽見的道與他們無益，因為他們沒有信心與所聽見的道調和。<br>但我們已經相信的人得以進入那安息。</p></blockquote>"},{"day":5,"html":"<p>上帝把守安息日的命令賜給舊約的百姓以色列人。對於一些人來說，這可以提醒他們，完美的安息，是脫離罪惡，是脫離賺取上帝恩惠的企圖，那恩惠是上帝將要賞賜的。這些百姓相信上帝的應許，相信上帝會守約。他們還不知道耶穌。他們也不明白，上帝的所有應許都將在基督裡得以成全。但是他們相信，上帝會守約，上帝會滿足他們一切的需要。這些以色列人相信上帝會賜給他們安息。</p><p>還有些以色列人，是身處上帝的百姓之中，因為他們是生來的以色列人，不過他們還算不上真是上帝的百姓。這些以色列人沒有把信心建立在上帝和祂的應許上。他們對於上帝的不信體現在他們的行為上。這些以色列人一次又一次地違背上帝和祂的命令。上帝賜給他們好多悔改相信上帝的機會，不過他們沒有抓住這些機會。終於，上帝不再願意寬容他們。祂向他們發怒，說：「我就在忿怒中起誓說：『他們斷不可進入我的安息。』」（希伯來書3:11）請讀希伯來書3:16-19。</p><blockquote><p><strong>希伯來書3:16-19</strong><br>那時聽見他話、惹他發怒的是誰呢？豈不是跟著摩西從埃及出來的眾人嗎？<br>神四十年之久厭煩誰呢？豈不是那些犯罪、屍首倒在曠野的人嗎？<br>又向誰起誓，不容他們進入他的安息呢？豈不是向那些不信從的人嗎？<br>這樣看來，他們不能進入安息是因為不信的緣故了。</p></blockquote>"},{"day":6,"html":"<p>如果安息日預表著我們在耶穌裡的安息，那麼既然耶穌已經來了，我們就可以在主日的時候為所欲為嗎？基督徒在主日工作，是不是就無所謂了呢？我們是不是有自由停止聚會，以便我們做自己想做的事，不去用這一天來敬拜上帝呢？因為基督為我們所做的，我們不是為了與上帝和好而守安息日。作為上帝的兒女，我們是因為如此愛祂才會想要守安息日。我們想要為著祂在祂兒子主耶穌基督裡所賜給我們的一切來感恩。當我們真正理解上帝為我們所成就的，我們就會渴慕每個星期花一天時間來認識祂，來讚美祂。請讀提多書3:4-8。</p><blockquote><p><strong>提多書3:4-8</strong><br>但到了神我們救主的恩慈和他向人所施的慈愛顯明的時候，<br>他便救了我們，並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。<br>聖靈就是神藉著耶穌基督我們救主厚厚澆灌在我們身上的，<br>好叫我們因他的恩得稱為義，可以憑著永生的盼望成為後嗣。<br>這話是可信的。我也願你把這些事切實實地講明，使那些已信神的人留心做正經事業。這都是美事，並且與人有益。</p></blockquote>"}]},{"num":59,"title":"神指定七日的哪一日，為每週的安息日？","answer":"從世界起始至基督復活，神指定一週的第七日，為每週的安息日；從基督復活起至世界的末了，則是七日的第一日，就是基督徒的安息日。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-5","days":[{"day":1,"html":"<p>安息日預表著我們在基督裡得到的安息。從創世到救主降臨，人們盼望主耶穌將要帶給他們的安息。安息日是在每週的末尾。整個星期，上帝的百姓都在盼望著安息日，就彷彿整個舊約時代，人們盼望基督來臨。現在基督已經來了，我們回顧祂為我們做的一切。現在我們的安息日是一週的開始。請讀出埃及記31:12-13,17。</p><blockquote><p><strong>出埃及記31:12-13</strong><br>耶和華曉諭摩西說：<br>「你要吩咐以色列人說：『你們務要守我的安息日，因為這是我與你之間世世代代的證據，使你們知道我耶和華是叫你們成為聖的。</p><p><strong>出埃及記31:17</strong><br>這是我與以色列人永遠的證據，因為六日之內耶和華造天地，第七日便安息舒暢。『「</p></blockquote>"},{"day":2,"html":"<p>上帝向以色列人顯明，祂要求他們嚴肅對待安息日。觸犯安息日，將要受到死的刑罰！當以色列人去往上帝的應許地途中，他們需要食物吃。於是上帝為他們賜下嗎哪。嗎哪像是一粒一粒白色的點心，味道就像蜜的薄餅一樣。上帝讓嗎哪從天降下，賜給以色列人。每天早上，他們起床之後，嗎哪長滿了地面，他們只需要出去撿起來就可以。上帝告訴他們只可以撿拾一家人一天吃的量。如果他們收取的多過一天的量，第二天就會生蟲。但是，上帝也告訴他們，安息日不要去收嗎哪。在安息日的前一天，摩西告訴百姓如何預備第二天的食物呢？請讀出埃及記16:23-30。</p><blockquote><p><strong>出埃及記16:23-30</strong><br>摩西對他們這樣說：「耶和華這樣說：『明天是聖安息日，是向耶和華守的聖安息日，你們要烤的就烤了，要煮的就煮了，所剩下的都留到早晨。』」<br>他們就照摩西的吩咐留到早晨，也不臭，裡頭也沒有蟲子。<br>摩西說：「你們今天吃這個吧！因為今天是向耶和華守的安息日，你們在田野必找不著了。<br>六天可以收取，第七天乃是安息日，那一天必沒有了。」<br>第七天百姓中有人出去收，什麼也找不著。<br>耶和華對摩西說：「你們不肯守我的誡命和律法要到幾時呢？<br>你們看！耶和華既將安息日賜給你們，所以第六天他賜給你們兩天的食物，第七天各人要住在自己的地方，不許什麼人出去。」<br>於是，百姓第七天安息了。</p></blockquote>"},{"day":3,"html":"<p>每週第七日安息，對於猶太人是非常重要的，因為上帝看它是重要的。為什麼安息日改到每週的第一天了呢？在舊約的時代，安息日記念的是上帝創世之工的結束。在第七日，上帝停止了創造的工作，歇息了。我們這個時代，安息和敬拜的日子，是為了記念上帝救贖之工的結束。在七日的第一日，主耶穌基督從死裡復活。祂完成了為百姓的罪惡承受刑罰的工作。請讀路加福音24:1-8中記載的這一重要事件。</p><blockquote><p><strong>路加福音24:1-8</strong><br>七日的頭一日，黎明的時候，那些婦女帶著所預備的香料來到墳墓前，<br>看見石頭已經從墳墓滾開了，<br>她們就進去，只是不見主耶穌的身體。<br>正在猜疑之間，忽然有兩個人站在旁邊，衣服放光。<br>婦女們驚怕，將臉伏地。那兩個人就對她們說：「為什麼在死人中找活人呢？<br>他不在這裡，已經復活了。當記念他還在加利利的時候怎樣告訴你們，<br>說：『人子必須被交在罪人手裡，釘在十字架上，第三日復活。』」<br>她們就想起耶穌的話來。</p></blockquote><p>就在這同一天，就是七日的第一日，耶穌在復活之後初次向門徒顯現。請讀約翰福音20:19-20。</p><blockquote><p><strong>約翰福音20:19-20</strong><br>那日（就是七日的第一日）晚上，門徒所在的地方，因怕猶太人，門都關了。耶穌來站在當中，對他們說：「願你們平安！」<br>說了這話，就把手和肋旁指給他們看。門徒看見主，就喜樂了。</p></blockquote>"},{"day":4,"html":"<p>在耶穌從死裡復活的那天晚上，耶穌向門徒顯現的時候，有一個門徒沒有在場。那個門徒叫多馬。大家告訴多馬，他們看到耶穌了。多馬不敢相信。他要是不親眼看到耶穌，就不相信。多馬告訴其他門徒，除非他摸到耶穌手上的釘痕，探一探祂肋旁兵丁的槍留下的傷口，否則不會相信耶穌已經從死裡復活。請讀約翰福音20:26-29。</p><blockquote><p><strong>約翰福音20:26-29</strong><br>過了八日，門徒又在屋裡，多馬也和他們同在。門都關了。耶穌來站在當中說：「願你們平安！」<br>就對多馬說：「伸過你的指頭來，摸（注：」摸「原文作」看「）我的手；伸出你的手來，探入我的肋旁。不要疑惑，總要信！」<br>多馬說：「我的主，我的神！」<br>耶穌對他說：「因你看見了我才信，那沒有看見就信的有福了！」</p></blockquote><p>耶穌在向其他門徒顯現一週之後向多馬顯現，跟多馬講話。那又是一個禮拜天。</p>"},{"day":5,"html":"<p>耶穌的復活對於基督徒來說是非常重要的事件。沒有基督復活，就沒有基督信仰。如果耶穌沒有從死裡復活，祂做的其他事情也就沒有多大意義了。耶穌的復活，證明耶穌是真神，這樣祂的死就有足夠的償付百姓的罪惡。因為復活的重要性，因為這是耶穌大大得勝，因為這個日子就發生在七日的第一日，所以早期的基督徒就開始稱七日的第一日為主日。從使徒約翰解釋他如何要寫作啟示錄，我們可以看到這樣的一個例子。請讀啟示錄1:9-11。</p><blockquote><p><strong>啟示錄1:9-11</strong><br>我約翰就是你們的弟兄，和你們在耶穌的患難、國度、忍耐裡一同有分，為神的道，併為給耶穌作的見證，曾在那名叫拔摩的海島上。<br>當主日，我被聖靈感動，聽見我後面有大聲音如吹號，說：<br>「你所看見的，當寫在書上，達與以弗所、士每拿、別迦摩、推雅推喇、撒狄、非拉鐵非、老底嘉那七個教會。」</p></blockquote>"},{"day":6,"html":"<p>主日，或七日的第一日，對於早期基督徒來說是一個特別的日子。在這一日，他們聚會禱告、聽使徒的教導、向上帝奉獻金錢，並且守聖餐。這就是七日的第一日如何成為基督徒分別出來敬拜安息的日子。請讀使徒行傳20:7和哥林多前書16:1-2。</p><blockquote><p><strong>使徒行傳20:7</strong><br>七日的第一日，我們聚會擘餅的時候，保羅因為要次日起行，就與他們講論，直講到半夜。</p><p><strong>哥林多前書16:1-2</strong><br>論到為聖徒捐錢，我從前怎樣吩咐加拉太的眾教會，你們也當怎樣行。<br>每逢七日的第一日，各人要照自己的進項抽出來留著，免得我來的時候現湊。</p></blockquote>"}]},{"num":60,"title":"應當如何遵守安息日為聖？","answer":"遵守安息日為聖，當天整日有聖潔的安息，連其他六日中，合乎神律法的世務、工作和娛樂，也不可做；除了「必須」的與「憐憫」的事之外，要將全部時間用在公眾與私下敬拜神。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-5","days":[{"day":1,"html":"<p>我們主日的時候停止工作或學業，以便有更多的時間來自由地讀上帝的話，敬拜上帝。我們可以明智地使用主日餘下的時間來學習認識神或者敬拜神。當然，有些工作是即使在主日也是必需有人做的。這些工作指的是絕對必需的工作以及慈惠的工作。</p><p>絕對必需的工作指的是我們沒有辦法提前或者延後做的事情。是指必須這天做的。比如照顧嬰兒的工作，還有為家人預備飯食以及清洗餐具的工作。去聚會的路上，家人乘坐的汽車也許壞了輪胎。那麼換輪胎就是必需的工作。然而像做作業以及侍弄庭院等工作就不是必需的工作，因為這都可以提前一天做。那麼在馬太福音12:1-8中描述了什麼必需的工作？</p><blockquote><p><strong>馬太福音12:1-8</strong><br>那時，耶穌在安息日從麥地經過。他的門徒餓了，就掐起麥穗來吃。<br>法利賽人看見，就對耶穌說：「看哪，你的門徒做安息日不可做的事了！」<br>耶穌對他們說：「經上記著大衛和跟從他的人飢餓之時所做的事，你們沒有念過嗎？<br>他怎麼進了神的殿，吃了陳設餅，這餅不是他和跟從他的人可以吃得，惟獨祭司才可以吃。<br>再者，律法上所記的，當安息日，祭司在殿裡犯了安息日，還是沒有罪，你們沒有念過嗎？<br>但我告訴你們：在這裡有一人比殿更大。<br>『我喜愛憐恤，不喜愛祭祀。』你們若明白這話的意思，就不將無罪的當作有罪的了。<br>因為人子是安息日的主。」</p></blockquote>"},{"day":2,"html":"<p>在主日也應該做的另一種事是慈惠憐憫的行動。如果有人急需幫助，那麼無論誰幫助了那人，仍然算是遵守了安息日。當基督徒醫生、護士、消防員、警察在主日照常在崗位工作時，他們是為了能夠履行憐憫的作為。他們的工作是幫助那些需要即刻幫助的人。在路加福音13:10-16的安息日中履行了什麼憐憫的作為？</p><blockquote><p><strong>路加福音13:10-16</strong><br>安息日，耶穌在會堂裡教訓人。<br>有一個女人被鬼附著，病了十八年，腰彎得一點直不起來。<br>耶穌看見，便叫過來，對她說：「女人，你脫離這病了！」<br>於是用兩隻手按著她，她立刻直起腰來，就歸榮耀與神。<br>管會堂的因為耶穌在安息日治病，就氣忿忿地對眾人說：「有六日應當做工，那六日之內可以來求醫，在安息日卻不可！」<br>主說：「假冒為善的人哪，難道你們各人在安息日不解開槽上的牛、驢，牽去飲嗎？<br>況且這女人本是亞伯拉罕的後裔，被撒但捆綁了這十八年，不當在安息日解開她的綁嗎？」</p></blockquote>"},{"day":3,"html":"<p>因為我們主日上午不上班或者不上課，我們可能會呆在家睡懶覺。如果我們選擇那麼做，我們就沒有用主日來尊榮主。當我們整天停止我們日常的工作，我們應該用來敬拜上帝，學習認識上帝。有時候，你可能聽人這麼說過「我不是非得去教會才是敬拜上帝吧」，這話不錯。但是大多數情況下，如果人們選擇主日不去教會，反而呆在家裡，結果他們就隨心所欲，任意妄為，並沒有花時間來敬拜上帝。另外，上帝要求我們與祂的百姓聚集來公共敬拜。請讀以賽亞書58:13-14。</p><blockquote><p><strong>以賽亞書58:13-14</strong><br>你若在安息日拌轉你的腳步，在我聖日不以操作為喜樂，稱安息日為可喜樂的，稱耶和華的聖日為可尊重的，而且尊敬這日，不辦自己的私事，不隨自己的私意，不說自己的私話，<br>你就以耶和華為樂。耶和華要使你乘駕地的高處，又以你祖雅各的產業養育你。「這是耶和華親口說的。</p></blockquote>"},{"day":4,"html":"<p>主日去教會的另一個原因是，我們屬於神的人也屬於祂的百姓。無論在舊約新約，上帝都把祂的百姓看成一個群體。祂想讓我們每一個認識祂的人都參與到這個群體中，而不是全靠著自己來作為個體的基督徒。聖經沒有讓我們只想到「上帝和我」，而是讓我們想到「上帝和祂的百姓還有我」。我們與上帝的百姓聚集、一同讚美敬拜上帝、一起學習神話語的時候，就是在榮耀順服上帝。使徒行傳20:7描繪了早期教會在七日的第一日或者主日聚會的景象。</p><blockquote><p><strong>使徒行傳20:7</strong><br>七日的第一日，我們聚會擘餅的時候，保羅因為要次日起行，就與他們講論，直講到半夜。</p></blockquote><p>根據這節經文描述，我們敬拜的時候常常做哪兩樣事？</p>"},{"day":5,"html":"<p>上帝的百姓在主日聽道、記念主餐，共同敬拜。請讀哥林多前書16:1-2。</p><blockquote><p><strong>哥林多前書16:1-2</strong><br>論到為聖徒捐錢，我從前怎樣吩咐加拉太的眾教會，你們也當怎樣行。<br>每逢七日的第一日，各人要照自己的進項抽出來留著，免得我來的時候現湊。</p></blockquote><p>使徒保羅告訴哥林多教會要在七日的第一日把奉獻抽出來。我們奉獻金錢的時候也是在敬拜上帝。我們的奉獻表明我們擁有的一切都是上帝的恩賜，我們應該為此感恩。這表明，我們信靠主供應我們所需要的。我們奉獻的時候，不必憂慮我們所需的會得不到。奉獻表明我們想讓我們的財富和本人都為著上帝的榮耀來使用，而不是為自己。凡是還有金錢的基督徒，儘管只是很少的零花錢，也應該按規律地向上帝奉獻一部分。這是我們敬拜尊榮上帝的重要部分。</p>"},{"day":6,"html":"<p>詩篇是上帝的百姓在敬拜禱告時所唱的詩歌。許多詩篇都有標題。有些標題會告訴我們發生了什麼事情，促使詩人寫下那篇詩篇。還有的標題告訴我們，詩篇應該如何配樂。詩篇92有個標題，告訴我們這篇詩篇可應用的場合。標題說「安息日的詩歌」。今日請讀此詩篇，預備明天的敬拜。</p><blockquote><p><strong>詩篇92:1-2-3</strong><br>稱謝耶和華，歌頌你至高者的名！<br>用十弦的樂器和瑟，用琴彈幽雅的聲音。早晨傳揚你的慈愛，每夜傳揚你的信實，這本為美事。</p><p><strong>詩篇92:4-15</strong><br>因你耶和華藉著你的作為叫我高興；我要因你手的工作歡呼。<br>耶和華啊，你的工作何其大，你的心思極其深！<br>畜類人不曉得，愚頑人也不明白。<br>惡人茂盛如草，一切作孽之人發旺的時候，正是他們要滅亡，直到永遠。<br>惟你耶和華是至高，直到永遠！<br>耶和華啊，你的仇敵都要滅亡，一切作孽的也要離散。<br>你卻高舉了我的角，如野牛的角；我是被新油膏了的。<br>我眼睛看見仇敵遭報；我耳朵聽見那些起來攻擊我的惡人受罰。<br>義人要發旺如棕樹，生長如黎巴嫩的香柏樹。<br>他們栽於耶和華的殿中，發旺在我們神的院裡。<br>他們年老的時候仍要結果子，要滿了汁漿而常發青。<br>好顯明耶和華是正直的。他是我的磐石，在他毫無不義。</p></blockquote>"}]},{"num":61,"title":"第四誡命禁止我們做什麼？","answer":"第四誡命禁止我們：忽略或不留心守安息所當盡的本分，閒懶或作犯罪的事，或以不必要的思想、言語、行為，從事我們世俗的工作及娛樂，以致褻瀆了此日。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-5","days":[{"day":1,"html":"<p>當我們把主日分別出來與上帝的百姓聚會的時候，我們是在尊重主日。我們把這一日作為特別的日子來遵守，用來敬拜上帝。但是我們不僅必須如此來尊重主日，而且必須在做這些事的方式上尊重主。有些人出於習慣來參加敬拜。或者別人讓他們來他們才來。這些人來倒是來了，不過心裡面卻是老大不願意，心裡想要是不用來就好了。他們巴不得在家裡待著。在整個敬拜的過程中，他們都是在想敬拜之後去幹什麼。他們在敬拜中，不斷看錶，如果過了該結束的時候，他們就氣得不得了。舊約先知阿摩司給以色列百姓傳達了上帝憤怒的資訊。那些以色列人正在做惹惱上帝的事情。在阿摩司書8:5上半節，請讀一讀，他說的什麼話。惹惱了？</p><blockquote><p><strong>阿摩司書8:5</strong><br>你們說：「月朔幾時過去？我們好賣糧；安息日幾時過去？我們好擺開麥子。</p></blockquote>"},{"day":2,"html":"<p>當我們對於敬拜漫不經心的時候，我們就是沒有在主日尊榮上帝。我們可能在幾個方面忽略我們的敬拜。人們去參加敬拜時，常常遲到。想象一下，如果你接到邀請要見一個重要的人，結果去晚了！來敬拜上帝至少也要跟見一個大人物同等重要吧。但是基督徒們似乎感到可以很隨便就赴聚會遲到。</p><p>想象一下，在和一個重要人物會面時，就比方說是國家主席吧，根本不注意他說什麼東西。人們常常在敬拜中心不在焉。當人們坐在聚會當中，聽道的時候心猿意馬，或者唱詩的時候漫不經心，這都表明忽略了尊重上帝的本分。</p><p>先知瑪拉基記下了上帝給祂百姓的資訊。祂責備他們在敬拜中忽略本分。以色列的問題在於，他們把有病的、殘疾的牲畜帶來獻給上帝。這是冒犯上帝的，因為他們本該把最好的帶來給上帝。祂問他們：「你會把這樣的禮物送給你們的省長嗎？」如果這樣的禮物羞辱世上的官長，難道不更褻瀆上帝嗎？我們敬拜中不再需要帶來祭牲。但是原則仍然是有效的。上帝的百姓應該把最好的帶來給上帝——就是他們最好的敬拜，他們最大的專注。我們來敬拜我們偉大的上帝，應該謹慎，不應散漫。請讀瑪拉基書1:6-8。</p><blockquote><p><strong>瑪拉基書1:6-8</strong><br>藐視我名的祭司啊，萬軍之耶和華對你們說：兒子尊敬父親，僕人敬畏主人；我既為父親，尊敬我的在哪裡呢？我既為主人，敬畏我的在哪裡呢？『你們卻說：』我們在何事上藐視你的名呢？『<br>你們將汙穢的食物獻在我的壇上，且說：』我們在何事上汙穢你呢？『因你們說，耶和華的桌子是可輕視的。<br>你們將瞎眼的獻為祭物，這不為惡嗎？將瘸腿的、有病的獻上，這不為惡嗎？你獻給你的省長，他豈喜悅你，豈能看你的情面嗎？「這是萬軍之耶和華說的。</p></blockquote>"},{"day":3,"html":"<p>當我們參加敬拜聽道的時候，我們前來的時候，應該預備好我們的心。只是人來了，那是不夠的。只是聽了道也是不夠的。因為傳講的是上帝的話語，我們必須謹慎聆聽。我們要以謙卑的態度聽，願意改變自己來遵行上帝話語的吩咐。我們來的時候，就是為了能夠從上午聽到的內容當中找到自己可以順服的內容。上帝告訴我們，我們對於祂的話應該有什麼樣的態度。請讀以賽亞書66:1-2。</p><blockquote><p><strong>以賽亞書66:1-2</strong><br>耶和華如此說：「天是我的座位，地是我的腳凳。你們要為我造何等的殿宇？哪裡是我安息的地方呢？<br>耶和華說：」這一切都是我手所造的，所以就都有了。『但我所看顧的，就是虛心痛悔、因我話而戰兢的人。「</p></blockquote><p>那麼去敬拜之前，在週日早上或者週六晚上花點時間禱告，是非常不錯的主意。請求上帝預備你聆聽並遵行你在祂話語中聽到的。</p>"},{"day":4,"html":"<p>真正的基督徒想要每一日都尊榮上帝，而不僅僅是在禮拜天。他明白，上帝在主耶穌基督裡面為他做了多少，所以他不擔心給上帝的時間太多。他會每個星期都分別一天來敬拜，並且在餘下的六天裡也會為上帝而活。真正屬於上帝的兒女都會感謝耶穌為他做的一切。他會尋求以各種方式表達他的感恩之心。他想每一天都屬於主。請讀哥林多後書5:14-15。</p><blockquote><p><strong>哥林多後書5:14-15</strong><br>原來基督的愛激勵我們。因我們想，一人既替眾人死，眾人就都死了；<br>並且他替眾人死，是叫那些活著的人不再為自己活，乃為替他們死而復活的主活。</p></blockquote>"},{"day":5,"html":"<p>上帝的百姓願意花時間讀祂的話語、花時間禱告。當聖靈使人重生，祂會把這些事的喜愛放在那人的心中。一個人成為信徒之前，他對聚會、讀經、向真神禱告都不感興趣。當聖靈改變人心，他對這些事產生喜愛之情。他不會厭倦這些事，因為這些事能夠幫助他更認識上帝。他會每天渴慕做這些事，而不是僅僅在主日。請讀詩篇119:147-148,164。</p><blockquote><p><strong>詩篇119:147-148</strong><br>我趁天未亮呼求；我仰望了你的言語；<br>我趁夜更未換將眼睜開，為要思想你的話語。</p><p><strong>詩篇119:164</strong><br>我因你公義的典章，一天七次讚美你。</p></blockquote>"},{"day":6,"html":"<p>世俗的事務，指的是我們平時需要負責的那些事情，需要思考，需要投入時間的。對於孩子來說，可以是家務活或者作業。成年人的「事務」可能包括工作中的一些責任。不過，主日做這些事情不是必需的。如果我們能夠提前做好謹慎的計劃，不把事情留到最後時刻，我們就可以在週一到週六處理好這些責任，把週日留出來專注於主的事。我們的娛樂，我們休閒享樂的那些事，需要好好計劃，好把週日留出來敬拜、學習，與上帝的百姓聚會。請讀以弗所書5:15-20。</p><blockquote><p><strong>以弗所書5:15-20</strong><br>你們要謹慎行事，不要像愚昧人，當像智慧人。<br>要愛惜光陰，因為現今的世代邪惡。<br>不要作糊塗人，要明白主的旨意如何。<br>不要醉酒，酒能使人放蕩，乃要被聖靈充滿。<br>當用詩章、頌詞、靈歌彼此對說，口唱心和地讚美主。<br>凡事要奉我們主耶穌基督的名，常常感謝父神。</p></blockquote>"}]},{"num":62,"title":"第四誡命所舉出的理由依據是什麼？","answer":"第四誡命所舉出的理由依據是：神允許我們每週以六日，作自己的工；祂要我們尊重第七日為祂自己的日子；祂自己守安息的榜樣；以及祂賜福與安息日。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-5","days":[{"day":1,"html":"<p>當上帝要我們給祂什麼的時候，祂滿有恩典，給我們留下很多讓我們自己使用。在舊約中，上帝要求祂的百姓把所有金錢奉獻百分之十。意味著每十塊，他們就要給上帝一塊。這樣他們就剩下九塊可以隨意使用。同樣，上帝命令我們七日分別出來一日來敬拜上帝。上帝滿有恩典，允許我們用六日來做自己的工作。我們平常能做的工作，也是上帝所賜的禮物。祂計劃要人有工作，可以充實可享受的、有收益的事情。我們在祂所造的世界中工作時，可以學習認識上帝。上帝給我們七日中的六日來完成我們必須的工作。請讀創世記2:8-10,15。</p><blockquote><p><strong>創世記2:8-10</strong><br>耶和華神在東方的伊甸立了一個園子，把所造的人安置在那裡。<br>耶和華神使各樣的樹從地裡長出來，可以悅人的眼目，其上的果子好作食物。園子當中又有生命樹和分別善惡的樹。<br>有河從伊甸流出來滋潤那園子，從那裡分為四道：</p><p><strong>創世記2:15</strong><br>耶和華神將那人安置在伊甸園，使他修理看守。</p></blockquote>"},{"day":2,"html":"<p>第四條誡命只要求我們一週中把一天給上帝。你想一想我們欠上帝的一切，那麼把七日中的一日給上帝就不算是很多了。我們的一切財富和身份都是上帝所給的，因為最起碼是祂創造了我們。祂計劃了我們一生的年日。祂計劃了我們每個人在一生中的事情。我們整個的生命就是從上帝來的禮物。我們生命的每一天都是上帝賜下的禮物。祂給我們這些日子，為要用這些日子來認識祂來愛祂。把七日中的一日給上帝，算不上是多大的回報吧。請讀詩篇139:15-16。</p><blockquote><p><strong>詩篇139:15-16</strong><br>我在暗中受造，在地的深處被聯絡，那時，我的形體並不向你隱藏。<br>我未成形的體質，你的眼早已看見了。你所定的日子，我尚未度一日，你都寫在你的冊上了。</p></blockquote>"},{"day":3,"html":"<p>有些基督徒，真正明白上帝為他們所做的一切，他們會渴慕分別時間來尊榮上帝。基督徒應該比任何其他的人更有感恩的理由。上帝賜給每個人生命。祂賜給自己百姓永遠的生命。</p><p>基督徒的生命屬於上帝，不僅僅因為上帝創造了我們、起初給了我們生命。基督徒的生命屬於上帝，還因為上帝買贖了他的生命歸於自己。上帝賜下祂自己看為最寶貴的，讓我們脫離罪惡，歸於上帝。請讀彼得前書1:17-19。</p><blockquote><p><strong>彼得前書1:17-19</strong><br>你們既稱那不偏待人、按各人行為審判人的主為父，就當存敬畏的心，度你們在世寄居的日子，<br>知道你們得贖、脫去你們祖宗所傳流虛妄的行為，不是憑著能壞的金銀等物，<br>乃是憑著基督的寶血，如同無瑕疵、無玷汙的羔羊之血。</p></blockquote><p>基督徒明白，他整個一生的每一天都屬於主，應該用來榮耀上帝。</p>"},{"day":4,"html":"<p>遵守第四誡命的一個理由是，上帝允許用一週裡的六天來完成祂給我們的工作，只要求一天給祂自己。另一個理由是，上帝自己完成創世之工時所設立的榜樣。聖經告訴我們，上帝在第七日就安息了，因為祂已經完成了祂創世的工。主耶穌基督在地上的時候也尊重安息日。請讀路加福音4:16看看耶穌的習慣。</p><blockquote><p><strong>路加福音4:16</strong><br>耶穌來到拿撒勒，就是他長大的地方。在安息日，照他平常的規矩進了會堂，站起來要念聖經。</p></blockquote>"},{"day":5,"html":"<p>記念主日的另一個理由是，上帝祝福安息日。在第一個安息日，當上帝歇了祂創世的工，聖經告訴我們「上帝賜福第七日，定為聖日。」因為上帝創造我們，就是要尊重榮耀祂，所以我們尊重榮耀祂的時候就是我們最出色最幸福的時候。當我們正確地使用主日來認識上帝來敬拜上帝，上帝會賜福給我們。我們花時間跟祂在一起的時候，我們對上帝的愛就會增長。我們會有福分學習到祂在聖經中說的話。當我發生，在主日來讚美主，我們會發現這也會給我們帶來喜樂。請讀以賽亞書56:6-7。</p><blockquote><p><strong>以賽亞書56:6-7</strong><br>還有那些與耶和華聯合的外邦人，要事奉他，要愛耶和華的名，要作他的僕人，凡守安息日不干犯、又持守他約的人。<br>我必領他們到我的聖山，使他們在禱告我的殿中喜樂。他們的燔祭和平安祭，在我壇上必蒙悅納。因我的殿必稱為萬民禱告的殿！「</p></blockquote>"},{"day":6,"html":"<p>當我們每週分別一日思想、談論、學習認識上帝時，我們就有福了。我們從上帝的話語當中對上帝的認識越多，我們就越會看到祂是多麼奇妙，我們就會更加愛祂。我們越多時間禱告讚美主，我們就越認識祂，我們越多時間禱告讚美主，我們就越認識祂。當上帝的百姓把主日用來做那些可以幫助他們更加認識上帝的事情，他們會得到賜福。他們會在上帝裡面發現更多可愛可喜樂的事。這樣，安息日就成了上帝百姓的福分。請讀以賽亞書58:13-14。</p><blockquote><p><strong>以賽亞書58:13-14</strong><br>你若在安息日拌轉你的腳步，在我聖日不以操作為喜樂，稱安息日為可喜樂的，稱耶和華的聖日為可尊重的，而且尊敬這日，不辦自己的私事，不隨自己的私意，不說自己的私話，<br>你就以耶和華為樂。耶和華要使你乘駕地的高處，又以你祖雅各的產業養育你。「這是耶和華親口說的。</p></blockquote>"}]},{"num":63,"title":"第五誡命是什麼？","answer":"第五誡命是：「當孝敬父母，使你的日子在耶和華你神所賜的地上，得以長久。」","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-6","days":[{"day":1,"html":"<p>要記得，十誡是道德律的總結。總結的意思就是，一些細節會被省略，只是給出了要點。因此，當我們學習十誡的時候，我們不能以為只需要照著它字面說的去做就行了，不需要比那個多做什麼。我們必須遵守每一個具體誡命所總結或代表的所有律法。當我們學習這條關於孝敬父母的誡命時，我們會明白，這條誡命總結了上帝要我們如何處理好與各種人的關係，而不僅僅是我們的父母而已。請讀羅馬書13:6-10。</p><blockquote><p><strong>羅馬書13:6-10</strong><br>你們納糧也為這個緣故，因他們是神的差役，常常特管這事。<br>凡人所當得的，就給他；當得糧的，給他納糧；當得稅的，給他上稅；當懼怕的，懼怕他；當恭敬的，恭敬他。<br>凡事都不可虧欠人，惟有彼此相愛，要常以為虧欠，因為愛人的就完全了律法。<br>像那「不可姦淫」，「不可殺人」，「不可偷盜」，「不可貪婪」，或有別的誡命，都包在「愛人如己」這一句話之內了。<br>愛是不加害與人的，所以愛就完全了律法。</p></blockquote>"},{"day":2,"html":"<p>我們上面的權柄，第一個就是父母的權柄。當我們長大的時候，我們發現還有其他的權柄需要尊重。所有的人都應該首先敬畏上帝。祂是萬物的創造者和君王，我們應該對祂完全尊重順服。在生命的各個領域，上帝設立了我們需要尊重的各種權柄。上帝賦予一些人供養、保護他人的任務。父母撫養保護兒女。丈夫供應保護妻子。君王官長供應保護臣民，牧師長老供應保護會眾。</p><p>這些人如果整天與其權柄之下的人爭論怎麼辦是最好的，那麼這些人沒辦法完成上帝給他們的任務。所以上帝賜給他們權柄。在他們權下的人，應該尊重他們、順服他們。有權柄的人不一定總是正確的。但是，除非他們命令我們悖逆上帝，否則我們必須尊重順服他們。當我們不尊重權柄的時候，我們其實是不尊重上帝，因為是上帝把一些人放在有權柄的位置上。請讀羅馬書13:1-2。</p><blockquote><p><strong>羅馬書13:1-2</strong><br>在上有權柄的，人人當順服他，因為沒有權柄不是出於神的，凡掌權的都是神所命的。<br>所以抗拒掌權的，就是抗拒神的命；抗拒的必自取刑罰。</p></blockquote>"},{"day":3,"html":"<p>上帝在家庭中設立了權柄。丈夫是妻子的權柄。他要供應她的需要，保護她，盡力幫助她成長像耶穌，幫助她使用上帝給她的恩賜。妻子要順服丈夫。她要尊重丈夫的權柄，知道丈夫的想法就去做，儘管自己想做點別的事。父母是孩子的權柄。父母要供應孩子在身體、思想、靈命健康方面所需要的一切。他們要保護孩子，教養孩子。孩子一定要尊重父母的權柄，立刻地順服父母。請讀歌羅西書3:18-21。</p><blockquote><p><strong>歌羅西書3:18-21</strong><br>你們作妻子的，當順服自己的丈夫，這在主裡面是相宜的。<br>你們作丈夫的，要愛你們的妻子，不可苦待她們。<br>你們作兒女的，要凡事聽從父母，因為這是主所喜悅的。<br>你們作父親的，不要惹兒女的氣，恐怕他們失了志氣。</p></blockquote>"},{"day":4,"html":"<p>除了家庭以外，上帝也在其他領域設立了權柄。上帝設立政府來執行公義。祂設立了君王、總統、主席、省長等來懲罰作惡的人，保護那些守法的人。我們可能不會完全同意主席或者省長做的事，但是我們還是要以尊敬的態度來對待他們。我們必須順服他們制定的法律，除非那些法律要求我們違背上帝在聖經裡的命令。請讀彼得前書2:13-14,17。</p><blockquote><p><strong>彼得前書2:13-14</strong><br>你們為主的緣故，要順服人的一切制度，或是在上的君王，<br>或是君王所派罰惡賞善的臣宰。</p><p><strong>彼得前書2:17</strong><br>務要尊敬眾人，親愛教中的弟兄，敬畏神，尊敬君王。</p></blockquote><p>上帝也在祂的教會中設立了權柄。長老和牧師給信徒們提供教導。他們保護教會不受假師傅的攪擾。牧師和長老鼓勵上帝的百姓跟隨基督，信徒犯罪的時候，他們也會發出警告。基督徒應該順服自己教會里面長老和教師的決定。要順服他們，聽從他們的教導。請讀希伯來書13:17。</p><blockquote><p><strong>希伯來書13:17</strong><br>你們要依從那些引導你們的，且要順服，因他們為你們的靈魂時刻警醒，好像那將來交賬的。你們要使他們交賬的時候有快樂，不至憂愁；若憂愁就與你們無益了。</p></blockquote>"},{"day":5,"html":"<p>上帝要我們尊重對我們有權柄的人，或者那些在我們之上的人。祂也呼召我們要適當地尊重在我們之下的人，以及跟我們同輩的人。在我們之下，不是說那些人不如我們好。在別人之下的人是受到照顧和保護的。我們說妻子在丈夫之下。這不是說妻子不如丈夫有價值，或者不如丈夫有恩賜，不如丈夫聰明。只是說，他們在丈夫的權柄之下。百姓在官長權下。僱員在僱主權下。年輕人在老年人權下。孩子在父母權下。這條誡命告訴我們要照著上帝的命令來對待那些在我們權下的人。有權柄的人不可以濫用權柄。他們要忠心地執行上帝給他們的照顧屬下的責任。請讀提摩太前書5:8和以弗所書6:4。</p><blockquote><p><strong>提摩太前書5:8</strong><br>人若不看顧親屬，就是背了真道，比不信的人還不好。不看顧自己家裡的人更是如此。</p><p><strong>以弗所書6:4</strong><br>你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。</p></blockquote>"},{"day":6,"html":"<p>這條誡命要我們孝敬父母。這條誡命也暗示我們，要照著上帝的命令尊重在上的權柄，善待在我們權下的人。但是這條誡命也告訴我們應該如何對待那些不在我們之上也不在我們之下的人。他們是跟我們在同一層面。他們跟我們年齡相仿，不是我們的老師，不是我們的老闆，也不是長老，也不是官長。我們也要尊敬他們，因為他們是照著上帝的形像造的，我們要愛他們。請讀羅馬書12:10和腓立比書2:3-4。</p><blockquote><p><strong>羅馬書12:10</strong><br>愛弟兄，要彼此親熱；恭敬人，要彼此推讓。</p><p><strong>腓立比書2:3-4</strong><br>凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強。<br>各人不要單顧自己的事，也要顧別人的事。</p></blockquote>"}]},{"num":64,"title":"第五誡命吩咐我們作什麼？","answer":"第五誡命吩咐我們：無論是對長輩、晚輩或平輩，總要按照個人在其所處地位與關係中，維護個人的名譽，克盡個人的職責。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-6","days":[{"day":1,"html":"<p>十誡總結了上帝所賜的所有道德律，這條誡命告訴我們如何與各種人相處。因為這條誡命尤其處理兒女與父母的關係，所以我們會花幾天的時間來了解，關於兒女如何對待父母，上帝的話語是怎麼說的。上帝的話語告訴做兒女的，對父母有幾方面的本分。一個本分就是要專心聽從父母的教導。需要懂的東西，全靠依靠父母來教導。孩子生下來的時候，什麼都不懂。他們觀察父母，也就學會了行事為人。孩子聽父母說話的時候，就學會了說話。他們觀察父母說話的時候，就學會了說話。</p><p>孩子可以從父母那裡學到的最重要的東西，就是上帝話語中的真理。上帝要求基督徒父母要教導兒女認識上帝是誰，知道上帝要他們做什麼。父母必須教導兒女，上帝看重什麼，如何為上帝的榮耀而活。上帝要孩童專心聆聽父母的教導，記住父母告訴他們的事。兒女應該珍惜基督徒父母的教導，讓這教導來引導自己的一生。請讀箴言6:20-23。</p><blockquote><p><strong>箴言6:20-23</strong><br>我兒，要謹守你父親的誡命，不可離棄你母親的法則。<br>要常系在你心懷，掛在你項上。<br>你行走，它必引導你；你躺臥，它必保守你；你睡醒，它必與你談論。<br>因為誡命是燈，法則是光，訓誨的責備是生命的道。</p></blockquote>"},{"day":2,"html":"<p>孩子對父母的另一個本分是順服父母。也許孩子已經學會了父母要他們懂的東西，甚至能倒背如流，不過不可以停在這裡。孩子必須繼續來順服那教導。孩子常常懂得並且記住了父母告訴他們做的事。不當父母不在身邊的時候，他們卻違背父母的教導。這條誡命就是要孩子們遵行父母的吩咐，就算父母不在場的時候也是一樣。</p><p>除了遵行父母的教導，孩子還要聽父母的話。父母給孩子一個命令，孩子應該順服。孩子不應該等著看看是不是父母非要逼著他做。他不應問「為什麼？」，也不應頂嘴。孩子要立刻地順服，彷彿聽到了上帝的命令一樣。畢竟，父母是上帝賜給每個孩子的，上帝要求我們尊重他們的權柄。請讀以弗所書6:1。</p><blockquote><p><strong>以弗所書6:1</strong><br>你們作兒女的，要在主裡聽從父母，這是理所當然的。</p></blockquote><p>同樣，父母不在的時候，由老師或者保姆看管的時候，孩子必須順服尊重老師或者保姆，如同對待父母一樣。</p>"},{"day":3,"html":"<p>有時候，父母必須執行一個不是很開心的任務，就是管教孩子。也許父母不讓孩子擁有某個東西，因為父母知道那是對孩子不好的。也許孩子做錯了事，必須承擔後果，比如被關禁閉或者打屁股。其實父母是寧可不這樣的。忠實的、慈愛的父母之所以管教兒女，是因為他們知道，如果老是讓孩子為所欲為，得不到矯正的話，他們長大了就會成為自私、不敬虔的人。父母的責任就是在必要的時候管教孩子。孩子的責任就是要接受父母的管教，從中吸取教訓。</p><p>這對誰來說都不是開心的事。但是明智的孩子能意識到，管教是為他們自己好。明智的孩子對於父母必要的管教心存感激。聰明的孩子從管教中學習功課。愚蠢的孩子在受管教的時候不吸取教訓。他們輕視管教，持續做同樣的錯事，所以就需要反覆地被管教。請讀箴言12:1和箴言13:1。</p><blockquote><p><strong>箴言12:1</strong><br>喜愛管教的，就是喜愛知識；恨惡責備的，卻是畜類。</p><p><strong>箴言13:1</strong><br>智慧子聽父親的教訓；褻慢人不聽責備。</p></blockquote>"},{"day":4,"html":"<p>兒女不僅在未成年的時候要尊重父母，兒女長大了也對父母有責任。兒女多大年紀都不可不孝敬父母。只要活著，就該持續向父母顯出尊重。孩子一旦長大成人了，父母就不再像孩子小的時候那樣吩咐他們做這做那。儘管如此，成年的兒女也應該透過徵求並認真考慮父母的建議來尊重他們。</p><p>儘管人都會長大成人，但是怎麼說父母也是活過了更多的年頭，有更豐富的經驗。不管孩子多大了，父母的建議總還是有價值的。成年的兒女跟父母說話也要有禮貌，跟別人談到自己父母的時候也要有尊重，透過這種方式來尊敬父母。我們孝敬父母的另一個方式，是在父母年老需要的時候照顧他們。人上了年紀，不能繼續勞動的時候，可能會需要金錢方面的幫助。成年的兒女孝敬父母的方式，就是徵求聆聽父母的意見，禮貌地談論父母，父母年老有需要的時候幫助他們。請讀箴言23:22。</p><blockquote><p><strong>箴言23:22</strong><br>你要聽從生你的父親；你母親老了，也不可藐視她。</p></blockquote>"},{"day":5,"html":"<p>我們已經學習了兒女對待父母方面的幾個責任。這些責任就是：聽從他們的教導，順服他們，接受他們的管教並從管教中學習教訓，父母年老的時候也要孝敬他們。兒女對父母有正確的態度，就會做到以上所說的那些。對待父母的正確態度就是尊重。尊重父母的兒女不敢惹父母生氣。這倒不是因為怕被抓到或者怕被懲罰。這是出於一種心裡的渴望，要做父母喜悅的，不做讓父母憂愁的事。當然，父母和兒女都是罪人。有時候父母犯了罪，做出的事情讓孩子很難再尊重他們。有時候孩子犯了罪，不想再尊重父母了。這個誡命呼籲我們，無論感受如何，都要尊重父母。請讀利未記19:3。</p><blockquote><p><strong>利未記19:3</strong><br>你們各人都當孝敬父母，也要守我的安息日。我是耶和華你們的神。</p></blockquote>"},{"day":6,"html":"<p>在某些國家，老年人十分受尊重。在那些國家，一個人越老，就越因著他的智慧受尊重。在我們的國家，老年人沒有受到多少尊重。年輕人因為更強壯更漂亮，得到的尊重倒是多一些。在我們的國家，人們重視的是外貌和能力，而不重視智慧！這種價值觀不是屬上帝的價值觀。上帝命令我們要尊重比我們年長的人。請讀彼得前書5:5和利未記19:32。</p><blockquote><p><strong>彼得前書5:5</strong><br>你們年幼的也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服，「因為神阻擋驕傲的人，賜恩給謙卑的人。」</p><p><strong>利未記19:32</strong><br>在白髮的人面前，你要站起來；也要尊敬老人，又要敬畏你的神。我是耶和華。</p></blockquote><p>孩子們，你們有沒有尊重成年人呢？也包括你不認識的成年人？你有沒有跟他們打招呼，讓他們走在你前面，為他們開門，或者其它表示尊重的事呢？或者你不理睬他們，或者更糟糕的是取笑他們或者給他們製造麻煩？如果父母之外的成年人告訴你做什麼（或者別做什麼），你有沒有以尊重的態度來回應？這些事在我們的社會中已經越來越不常見了，可是這些都是上帝要求我們的。</p>"}]},{"num":65,"title":"第五誡命禁止我們作什麼？","answer":"第五誡命禁止我們：忽視或侵犯個人在其地位與關係中的名譽與職責。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-6","days":[{"day":1,"html":"<p>聖經教導兒女應該如何對待父母。聖經教導他們要做什麼，不要做什麼。聖經命令兒女孝敬父母，聖經也禁止兒女不孝敬父母。他們絕對不可以任何方式來顯出不尊重。可悲的是，我們在周圍隨處可以看到各個年齡段的兒女，對父母都有表現出不尊重。這樣的態度司空見慣，我們似乎也見怪不怪了。在上帝看來，不尊重父母是非常嚴重的事。以色列百姓剛進入應許地的時候，上帝曾經叫他們宣告十二項咒詛。這些咒詛是為犯十二種大罪的人預備的。這些咒詛是為了懲罰那些類似濫殺無辜、踐踏偶像等等罪行。這些咒詛當中，有一個是為那些不孝敬父母的人預備的。請讀申命記27:16。</p><blockquote><p><strong>申命記27:16</strong><br>「輕慢父母的，必受咒詛！『百姓都要說：』阿們！『」</p></blockquote>"},{"day":2,"html":"<p>那麼兒女在哪些方面容易不尊重父母呢？一個非常明顯的方式就是拳打腳踢傷害父母。有時候，成年的兒女或者將近成年的兒女會跟父母發脾氣，跟父母動手。有時候甚至非常小的孩子因為沒有得到自己想要的東西，就大發脾氣踢打父母。因為上帝設立父母來管著孩子。因此打父母就如同攻擊上帝、挑戰上帝一樣。請讀出埃及記21:15，看一看，照著上帝為以色列民設立的律法，該怎樣對待這樣不孝的孩子。</p><blockquote><p><strong>出埃及記21:15</strong><br>打父母的，必要把他治死。</p></blockquote><p>另一種攻擊父母，傷害父母的方式是咒罵父母，或者說想讓他們遭遇不幸的事情。對待咒罵父母的孩子，也要以同樣的方式對待。請讀出埃及記21:17。</p><blockquote><p><strong>出埃及記21:17</strong><br>咒罵父母的，必要把他治死。</p></blockquote>"},{"day":3,"html":"<p>我希望讀者您從來沒有打過父母也沒有咒罵過父母。不過除此以外還有其他的方面，我們可能對父母表現出不尊重，而這些方面我們可能覺得沒有那麼嚴重，因為有時候所有的孩子好像都這麼做。但是聖經告訴我們，這些事情是不可以的，在上帝眼中是嚴重的。因為孩子也是罪人（跟所有人一樣），所以孩子常常不順服父母。這是罪，不僅得罪父母，而且也得罪上帝。有些孩子喜歡偷偷摸摸地做父母不會允許他們作的事。他們周密地謀劃，看如何可以不順服又不被抓到。這麼做，其實比單單一個不順服的行動還更糟糕。這種態度似乎表明，孩子以為自己比爸爸媽媽更高明，也比他們的規矩略勝一籌。懷著這種態度的孩子不屬於順服。他以為自己太聰明瞭，太成熟了，根本不需要順服了。</p><p>對待父母的不尊重態度，還表現為取笑的態度。孩子跟夥伴一起的時候笑話自己的父母，這是對父母的不尊重。他取笑父母，讓朋友們都知道父母說的蠢話、辦的蠢事，然後表明自己跟他們不一樣。有人在旁邊的時候，他跟父母大聲說話，而且還儘量不讓別人看到自己和父母在一起。這這就是一種取笑的態度。請讀聖經箴言書30:17，看一看那裡如何評價取笑父母不尊父母的孩子。</p><blockquote><p><strong>箴言30:17</strong><br>戲笑父親、就視而不從母親的，他的眼睛必為谷中的烏鴉啄出來，為鷹雛所吃。</p></blockquote>"},{"day":4,"html":"<p>聖經禁止兒女在身體上攻擊父母、語言上咒罵父母、拒絕順服父母、取笑父母，這都是不尊重。兒女拒絕從父母的教導，這也是一種不尊重。幾乎所有的父母都是為著孩子的最大好處著想。父母教給孩子的東西，是父母認為孩子應該懂的。兒女不是一直都明白父母的教導有什麼大不了的，但是兒女應該相信，父母還是比他們明智。他們需要殷勤地學習父母的教導。尤其當兒女有基督徒的父母時，父母會教導兒女上帝話語的真理，兒女更應該努力學習父母想讓他們懂得的東西。</p><p>不幸的是，有時候聽到上帝話語的孩子，往往會感到厭煩。這是罪惡的心態。長大以後偏離父母的基督信仰教導的，犯了兩個方面的罪。他們選擇做錯事，這是一個方面的</p><p>罪。上帝賜給他們基督信仰教導這份許多孩子沒有的禮物，他們卻拒絕領受這份禮物，這是另一方面的罪。請讀箴言4:1-5。</p><blockquote><p><strong>箴言4:1-5</strong><br>眾子啊，要聽父親的教訓，留心得知聰明。<br>因我所給你們的是好教訓，不可離棄我的法則。<br>我在父親面前為孝子，在母親眼中為獨一的嬌兒。<br>父親教訓我說：「你心要存記我的言語，遵守我的命令，便得存活。<br>要得智慧，要得聰明，不可忘記，也不可偏離我口中的言語。」</p></blockquote>"},{"day":5,"html":"<p>有時候長大的兒女想方設法利用父母來得到他們想要的東西。他們長大成人，卻不去找工作。他們還指望父母來養活他們。成年的兒女也可能會變得很自私，忘記了父母為他們付出的一切，不願意幫助解決父母的需要。父母老了的時候，就沒辦法像以前工作那麼多了，甚至乾脆就不能工作了。他們可能沒有足夠的錢買需要的東西。老年人也會需要人幫忙幹活，因為他們身體不那麼好了。為著自私的原因利用父母，或者在父母有需要的時候不幫助父母，這都是不孝敬。這些事情，上帝也恨惡。請讀箴言19:26。</p><blockquote><p><strong>箴言19:26</strong><br>虐待父親、攆出母親的，是貽羞致辱之子。</p></blockquote>"},{"day":6,"html":"<p>上帝賜給以色列人禮儀律，跟祭牲、祭司、洗濯等有關。祂賜給以色列人道德律，對於任何時代、任何地方的人都是適用的。上帝也賜給以色列人民事律，那是為著舊約以色列國專用的。我們不需要再遵從這些民事律。但是，當我們讀到上帝賜給以色列的民事律，我們看到，很多事情對於上帝來說是重要的。對於在父母面前屢教不改、大逆不道的子女，有這樣一條民事律規定相應的處罰辦法，的確讓我們看到悖逆在上帝眼中是何等的重罪啊。請讀申命記21:18-21中記載的這條律法。</p><blockquote><p><strong>申命記21:18-21</strong><br>人若有頑梗悖逆的兒子，不聽從父母的話，他們雖懲治他，他仍不聽從，<br>父母就要抓住他，將他帶到本地的城門、本城的長老那裡，<br>對長老說：「我們這兒子頑梗悖逆，不聽從我們的話，是貪食好酒的人。『<br>本城的眾人就要用石頭將他打死。這樣，就把惡從你們中間除掉，以色列眾人都要聽見害怕。</p></blockquote>"}]},{"num":66,"title":"第五誡命所舉出的理由依據是什麼？","answer":"第五誡命所舉出的理由依據是：神應許凡遵守這誡命的人（在使神得榮耀、使人得益處的前提下），在世長壽與昌盛。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-6","days":[{"day":1,"html":"<p>如同其他幾條誡命一樣，上帝給了我們順服這條誡命的理由依據。當然，單單因為上帝如此說，我們就應該總是順服上帝的命令。不過因為上帝恩待我們，所以祂常常為祂的命令賜給我們理由依據。祂讓我們看到，如果順服祂會怎麼樣；如果不順服祂，又會怎麼樣。上帝是在以色列人即將進入應許地的時候把這條誡命賜給他們的。</p><p>上帝賜給他們「要孝敬父母」的誡命，要他們遵守，這樣好「使你的日子在耶和華你神所賜你的地上得以長久。」上帝曾應許百姓，只要他們順服上帝，他們就會在上帝賜給他們的地上享受太平。如果他們不再順服上帝，也不再聽上帝的命令，上帝就會興起敵人攻擊他們，把他們擄掠到別的國家去。作為上帝的百姓，生活當中一個很重要的方面，就是要順服這條「兒女要孝敬父母」的命令。</p><p>這個問答所使用的第五誡命，記錄在出埃及記20:12，那裡的應許是，人們會在上帝賜的地上得以長久。</p><blockquote><p><strong>出埃及記20:12</strong><br>當孝敬父母，使你的日子在耶和華你神所賜你的地上得以長久。</p></blockquote><p>在申命記5:16中，又重複了這條誡命。讀一讀，看看這句經文又在應許上加添了什麼。</p><blockquote><p><strong>申命記5:16</strong><br>當照耶和華你神所吩咐的孝敬父母，使你得福，並使你的日子在耶和華你神所賜你的地上得以長久。</p></blockquote>"},{"day":2,"html":"<p>上帝首先把第五誡命給了以色列人。祂應許他們，如果他們遵守誡命，他們就會在應許之地上得以長久。現在上帝的百姓不再居住於一個特定的國家了。那是不是說這個應許就沒有意義了呢？不是的，使徒保羅在新約聖經中也重申了這條誡命，那時候上帝的百姓已經是住在許多不同的國家裡了。請讀以弗所書6:1-3。</p><blockquote><p><strong>以弗所書6:1-2</strong><br>你們作兒女的，要在主裡聽從父母，這是理所當然的。</p><p><strong>以弗所書6:3</strong><br>要孝敬父母，使你得福，在世長壽。這是第一條帶應許的誡命。</p></blockquote><p>這個應許不是說那些年紀輕輕就去世的人都是不孝敬父母的人。而是通常來說，孝敬父母、聽從父母建議的人，他們會活得比較健康，會比那些不孝父母話的人長壽。</p><p>不過，有時候上帝的百姓去世早可能會比年老去世更能榮耀神。發生這樣事的時候，我們可以相信，上帝知道這個人最好的，並且祂的作為也是最好的。這個問題的答案說到，在使神得榮耀、使人得益處的前提下，孝敬父母的人，上帝賜他長壽與昌盛。</p>"},{"day":3,"html":"<p>上帝告訴我們要遵守這條誡命，好叫我們順利，並且在地上長壽。箴言書也告訴我們關於這方面的福氣。請讀箴言1:8-9。</p><blockquote><p><strong>箴言1:8-9</strong><br>我兒，要聽你父親的訓誨，不可離棄你母親的法則，<br>因為這要作你頭上的華冠，你項上的金鍊。</p></blockquote><p>頭上的華冠和項上的金鍊都會讓你更美麗。當你聽從教訓，孝敬父母的時候，我們就會擁有別人欣賞、上帝喜悅的品格。因為我們的品格與基督相似，我們就是在過取悅神的生活，我們就會喜樂，享受生命。</p>"},{"day":4,"html":"<p class=\"read-prompt\">請讀箴言3:1-2。</p><blockquote><p><strong>箴言3:1-2</strong><br>我兒，不要忘記我的法則，你心要謹守我的誡命。<br>因為他必將長久的日子、生命的年數與平安加給你。</p></blockquote><p>這段經文應許我們，當我們牢記虔父母對我們的教導，從心裡遵行他們的命令，我們就會得著長壽與平安。而且，如果我們活得有智慧，照著父母的教導去生活，我們大概會在地上活得更久。不過，即使我們在地上的生命不長久，如果我們聽從了基督徒父母的教誨，我們也會永遠活在天上。他們已經教導我們信靠並跟從耶穌基督。謹守父母的誡命會給我們帶來昌盛。那可不是說，聽話的孩子都能成為百萬富翁！如果我們聽從父母關於工作、節儉、理財方面的教訓，我們大概會富足一些。不過，如果我們謹守了我們信主的父母給我們的教訓，我們肯定會在最重要的方面富足，就是在關乎上帝的事上富足。</p>"},{"day":5,"html":"<p class=\"read-prompt\">請讀箴言4:20-22。</p><blockquote><p><strong>箴言4:20-22</strong><br>我兒，要留心我的言詞，側耳聽我的話語。<br>都不可離你的眼目，要存記在你心中。<br>因為得著它的，就得了生命，又得了醫全體的良藥。</p></blockquote><p>這段經文告訴我們，要留心聽父母的話語。大家常常看到，兒童或者青少年打斷父母，說「我知道啦，我知道啦」之類的話。他們需要聽，需要留心，不應該好像什麼都知道似的，彷彿他們從父母那裡什麼也學不到。這段經文說，父母的話對我們就是生命，就是良藥。父母會引導孩子做那些有利於身體的事情，比如充足的睡眠，吃健康的食物等等。父母會警告孩子遠離有害身體的藥物和其它東西。敬虔的父母也會給我們教導，讓我們在其它方面也都健康。如果孩子能夠聽從父母關於交朋友的勸告，孩子通常都會更健康和快樂。父母有智慧能夠看出什麼人對於孩子是沒有益處的。而且，如果我們的父母教導我們愛主跟隨主，我們就會有健康的靈命，而這正是最最重要的。</p>"},{"day":6,"html":"<p class=\"read-prompt\">請讀箴言6:20-23。</p><blockquote><p><strong>箴言6:20-23</strong><br>我兒，要謹守你父親的誡命，不可離棄你母親的法則，<br>要常系在你心上，掛在你項上。<br>你行走，它必引導你；你躺臥，它必保守你；你睡醒，它必與你談論。<br>因為誡命是燈，法則是光，訓誨的責備是生命的道。</p></blockquote><p>當我們尊重父母，認真聽從他們，那麼他們的教導就會引導我們的一生。它會保護我們，遠離傷害；我們若是不懂得如何避免，就會受傷。敬虔父母的教導就像一盞燈。燈能夠使我們看得清楚，好叫我們正確地選擇，叫我們知道要做什麼。當父母糾正或管教我們的時候，我們必須尊重他們，儘管這個過程不是很開心的。這段經文提醒我們，敬虔父母的糾正和管教對於孩子來說就是生命的道。我們從以上幾個方面說到，孝敬父母帶給我們什麼好處，以及如何幫助我們享受長久的生命。</p>"}]},{"num":67,"title":"第六誡命是什麼？","answer":"第六誡命是：「不可殺人」。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-7","days":[{"day":1,"html":"<p>洪水之後，挪亞一家開始了在世界上的新生活，這時藉著挪亞給全人類一個命令。上帝說若是誰流人的血，他的血就要被人流。上帝為什麼這麼說呢？這不僅僅是因為傷害人不是好事。請讀創世記9:6，看看人為什麼不可以殺死或傷害他人。</p><blockquote><p><strong>創世記9:6</strong><br>凡流人血的，他的血也必被人所流；因為神造人，是照自己的形像造的。</p></blockquote><p>這是因為，人是照著上帝的形像造的。殺死動物、鳥、魚，是另外一回事。這些生物屬於上帝，我們對待動物也要有些憐憫，在對待它們的時候也要用榮耀上帝的方式。不過捕撈並殺魚來吃，或者讓病重的狗安樂死，這並不是錯的。但是，殺死人就是犯罪了，因為人都是帶著上帝的形像。傷人、殺人不僅是殘酷的事，而且是羞辱上帝的。</p>"},{"day":2,"html":"<p>有時候，殺死一個人未必就違背了上帝的「不可殺人」的誡命。舉個例子，就比如在自衛的情況下。請讀出埃及記22:2。</p><blockquote><p><strong>出埃及記22:2</strong><br>人若遇見賊挖窟窿，把賊打了，以至於死，就不能為他有流血的罪；</p></blockquote><p>在這段經文中，一個人在防護自己的家庭財產，在防衛的過程中殺了盜賊。根據上帝的律法，被盜搶的人不為殺盜賊的行為承擔罪責。這條誡命還有另外一種例外，就是在戰爭期間。戰爭往往也會是自衛的一種形式。或者是一種防範別國以殘酷和貪婪的方式欺壓小國的手段。在必要的時候參加戰爭，殺了人也不能算是違背第六條誡命。</p>"},{"day":3,"html":"<p class=\"read-prompt\">請讀民數記35:30。</p><blockquote><p><strong>民數記35:30</strong><br>無論誰故殺人，要憑几個見證人的口，把那故殺人的殺了，只是不可憑一個見證的口叫人死。</p></blockquote><p>這條誡命的另一個例外就是執行死刑。今天有許多人認為死刑應該被禁止。死刑就是將殺人者處死。在聖經中，上帝不僅允許死刑，而且甚至要求死刑。殺人是對那照著自己形像造人的上帝的攻擊。上帝要求的是，若有人殺了另一個人，殺人者要受到處死的刑罰。對殺人兇手執行死刑的人，不算是違背上帝的誡命。</p>"},{"day":4,"html":"<p>我們不僅可以殺別人，這條誡命還禁止我們自殺。自殺與殺人是同樣的錯誤。通常，人是感到生活太難了才會想到自殺。他要麼遭遇了不幸，要麼就是失去了不可或缺的人或物。他寧願不活了，也不願意安於現狀，於是就選擇自殺。當人選擇自殺的時候，他就是選擇不接受上帝為他選擇的。因為上帝掌管一切，祂也為每個人選擇了處境。當我們吃苦的時候，我們要相信上帝所做的是為著我們的益處。我們要相信祂供應我們所需，幫我們渡過困境。選擇自殺是抗拒上帝。這是在向上帝宣告：「不！我不要接受你的安排，我不相信你是為我好！」請讀彼得前書4:19，看一看在苦難中的敬虔態度。</p><blockquote><p><strong>彼得前書4:19</strong><br>所以，那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主。</p></blockquote>"},{"day":5,"html":"<p>當你讀到第六誡命的時候，你可能會想：「這個誡命多麼容易遵行啊！我肯定不會殺人啊！」但是我們要記住，十誡歸納的是上帝全部的道德律法。當我們想到這條「不可殺人」的誡命，我們要想到它所歸納的全部內容。殺人是從惱怒的想法引出的行為。惱怒就升級為仇恨的態度，結果就是殺人。如果你恨別人，或者你對人有惱怒的想法，你就已經朝殺人邁出了第一步。請讀約翰一書3:11-12,15。</p><blockquote><p><strong>約翰一書3:11-12</strong><br>我們應當彼此相愛，這就是你們從起初所聽見的命令。<br>不可像該隱，他是屬那惡者，殺了他的兄弟。為什麼殺了他呢？因自己的行為是惡的，兄弟的行為是善的。</p><p><strong>約翰一書3:15</strong><br>凡恨他弟兄的，就是殺人的；你們曉得凡殺人的，沒有永生存在他裡面。</p></blockquote>"},{"day":6,"html":"<p>第六誡命不僅禁止殺人。它也告訴我們該如何待人。當我們思考它的全部意義，就發現它告訴我們不該做什麼，也幫助我們看到與人交往時應該怎麼做。這條誡命不僅僅呼籲我們不要殺人；它也是呼籲我們愛人。有另一個要理問答（《海德堡要理問答》106,107問）也教導了這條誡命。那個要理問答是這樣說的：「上帝禁止殺人時，也教訓我們，祂憎惡那殺人的根源，如嫉妒、恨惡、惱怒、報復之心；這一切在祂眼中也算為殺人罪。上帝禁止我們嫉妒、仇恨和惱怒時，就是吩咐我們愛人如己，向鄰舍表示忍耐、和睦、溫柔、慈悲和一切良善，並盡我們的能力保護他不受傷害；甚至還要善待我們的仇敵。」請讀羅馬書13:9-10。</p><blockquote><p><strong>羅馬書13:9-10</strong><br>像那「不可姦淫」，「不可殺人」，「不可偷盜」，「不可貪婪」，或有別的誡命，都包在「愛人如己」這一句話之內了。<br>愛是不加害與人的，所以愛就完全了律法。</p></blockquote>"}]},{"num":68,"title":"第六誡命吩咐我們作什麼？","answer":"第六誡命吩咐我們：要竭力依法來保全自己及他人的生命。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-7","days":[{"day":1,"html":"<p>上帝看重人的生命，所以我們也必須尊重生命。上帝要我們保全和愛護人的生命。但是，我們也不可以在盡力保護人生命的同時，做非法或得罪上帝的事。許多國人以為墮胎，就是殺死沒有出生的嬰兒，有什麼不對。墮胎是錯的，因為那就是殺害幼小的人類。相信上帝話語的人們都應該努力在自己國家裡終結墮胎之風。</p><p>不過，有時候，在關於墮胎的問題發生衝突的時候，有人用殺人的方式來解決。不應該這麼做。殺害未出生的嬰兒是錯的。殺擁護墮胎的人也同樣是錯的。上帝已經設立了政府，賦予他們指責去懲罰犯罪者，比如施行墮胎的人。請讀彼得前書2:13-14。</p><blockquote><p><strong>彼得前書2:13-14</strong><br>你們為主的緣故，要順服人的一切制度，或是在上的君王，<br>或是君王所派罰惡賞善的臣宰。</p></blockquote><p>普通百姓是不可以直接懲罰犯罪者的。那是政府應該做的。我們不能以非法的方式來保全生命。</p>"},{"day":2,"html":"<p>在過去的若干個世紀當中，上帝的百姓僅僅因為自己是上帝的百姓就被殺害。上帝有許多敵人，那些敵人一直致力於讓上帝的百姓背叛上帝。基督徒往往面對抉擇，要麼宣告放棄跟隨基督，要麼就得死。一個基督徒透過否認基督的方式來保全性命，是不合法的。請讀馬太福音10:32-33,39。</p><blockquote><p><strong>馬太福音10:32-33</strong><br>凡在人面前認我的，我在我天上的父面前也必認他；<br>凡在人面前不認我的，我在我天上的父面前也必不認他。</p><p><strong>馬太福音10:39</strong><br>得著生命的，將要失喪生命；為我失喪生命的，將要得著生命。</p></blockquote><p>藉著各種合法的方式，我們必須保全性命，照顧自己的身體，保持健康。營養的飲食和足夠的睡眠，還有鍛鍊身體，這些不僅僅是明智的想法而已。這樣做，就是在順服上帝「保全性命、不殺人」的誡命。</p>"},{"day":3,"html":"<p>我們可能因為沒有殺過人，很高興地以為我們已經順服了這條「不可殺人」的誡命。不過這條誡命的含義可不止於此。它要求我們不遺餘力地保全生命。如果我們有什麼東西可以給人，讓人不至於死，我們就必須要他以至於能夠施以援手。如果我們不幫，那麼他們死了，我們至少承擔一部分責任，因為他們沒有得到他們需要的東西。如果我們僅僅是沒有殺人，上帝是不會滿意的。上帝要求我們要藉著跟有需要的人來分享，顯明愛與憐憫。請讀約翰一書3:17-18。</p><blockquote><p><strong>約翰一書3:17-18</strong><br>凡有世上財物的，看見弟兄窮乏，卻塞住憐恤的心，愛神的心怎能存在他裡面呢？<br>小子們哪，我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。</p></blockquote>"},{"day":4,"html":"<p class=\"read-prompt\">請讀路加福音10:25-37。</p><blockquote><p><strong>路加福音10:25-37</strong><br>有一個律法師起來試探耶穌，說：「夫子，我該做什麼才可以承受永生？」<br>耶穌對他說：「律法上寫的是什麼？你念的是怎樣呢？」<br>他回答說：「你要盡心、儘性、盡力、盡意愛主你的神；又要愛鄰舍如同自己。」<br>耶穌說：「你回答的是。你這樣行，就必得永生。」<br>那人要顯明自己有理，就對耶穌說：「誰是我的鄰舍呢？」<br>耶穌回答說：「有一個人從耶路撒冷下耶利哥去。落在強盜手中。他們剝去他的衣裳，把他打個半死，就丟下他走了。<br>偶然有一個祭司從這條路下來，看見他就從那邊過去了。<br>又有一個利未人來到這地方，看見他，也照樣從那邊過去了。<br>惟有一個撒馬利亞人行路來到那裡，看見他就動了慈心，<br>上前用油和酒倒在他的傷處，包裹好了，扶他騎上自己的牲口，帶到店裡去照應他。<br>第二天拿出二錢銀子來，交給店主，說：『你且照應他，此外所費用的，我回來必還你。』<br>你想，這三個人哪一個是落在強盜手中的鄰舍呢？」<br>他說：「是憐憫他的。」耶穌說：「你去照樣行吧。」</p></blockquote><p>耶穌告訴律法師說，要得永生，就需要盡心、儘性、盡力、盡意愛上帝，又要愛鄰舍如同自己。耶穌想讓他看看，要做到這兩點是多麼不可能的事。但是實際上，律法師以為他能做到呢！他想顯明自己有理。他想證明自己是義的，於是他問道「誰是我的鄰舍呢？」耶穌就講了上面的故事，讓他明白，每當我們看到有需要的地方，我們能幫上忙的，那麼上帝的律法就要求我們來幫助。</p>"},{"day":5,"html":"<p>上帝的百姓應該渴慕聖潔。他們應該渴慕那些能夠幫助他們在聖潔上長進的事，比如讀經、禱告、與弟兄姐妹共同敬拜上帝。不過，上帝的百姓有可能太關注自己在聖潔方面的成長，而沒有餘下任何時間精力來照顧別人。上帝的百姓應該聚集，彼此鼓勵、效法基督。不過他們也有可能花太多時間在一起，以至於沒有時間或願望去跟那些不認識耶穌的人顯明愛心、分享福音。</p><p>這條誡命呼籲我們要照顧別人，而不僅僅是我們自己的基督徒生活或者我們的基督徒朋友們。它呼籲我們要關心別人，並採取行動。在以賽亞書中，救責的百姓，熱衷於許多宗教活動，卻沒有向有需要的人顯出愛心。祂告訴他們，如果想要在聖潔上有所長進，他們必須怎麼辦。請讀以賽亞書58:3-10。</p><blockquote><p><strong>以賽亞書58:3-10</strong><br>他們說：「我們禁食，你為何不看見呢？我們刻苦己心，你為何不理會呢？『看哪！你們禁食的日子仍求利益，勒逼人為你們做苦工。<br>你們禁食，卻互相爭競，以兇惡的拳頭打人。你們今日禁食，不得使你們的聲音聽聞於上。<br>這樣禁食，豈是我所揀選、使人刻苦己心的日子嗎？豈是叫人垂頭像葦子，用麻布和爐灰鋪在他以下嗎？你這可稱為禁食、為耶和華所悅納的日子嗎？<br>我所揀選的禁食，不是要鬆開兇惡的繩，解下軛上的索，使被欺壓的得自由，折斷一切的軛嗎？<br>不是要把你的餅分給飢餓的人，將飄流的窮人接到你家中，見赤身的給他衣服遮體，顧恤自己的骨肉而不掩藏嗎？<br>這樣，你的光就必發現如早晨的光，你所得的醫治要速速發明。你的公義必在你前面行；耶和華的榮光必作你的後盾。<br>那時，你求告，耶和華必應允；你呼求，他必說：我在這裡。你若從你中間除掉重軛和指摘人的指頭，併發惡言的事，<br>你心若向飢餓的人發憐憫，使困苦的人得滿足，你的光就必在黑暗中發現，你的幽暗必變如正午。</p></blockquote>"},{"day":6,"html":"<p>第六條誡命要求我們，要向所有人顯出愛心來，因為所有人都是照著上帝的形像造的。上帝沒有要求我們只是愛那些愛我們的人，或者那些愛起來比較容易的人。我們必須愛每一個人。上帝甚至不允許我們恨惡那些抵擋上帝的罪人。上帝可能會轉變他們，叫他們成為上帝的孩子，不再作他們的敵人。如果祂不轉變他們，那麼當祂的時候到了的時候，祂會審判他們。同時，當他們做了傷害我們的事，我們必須饒恕他們，並且對他們顯出愛心來。請讀羅馬書12:17-21。</p><blockquote><p><strong>羅馬書12:17-21</strong><br>不要以惡報惡。眾人以為美的事，要留心去做。<br>若是能行，總要盡力與眾人和睦。<br>親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒。因為經上記著：「主說：『伸冤在我，我必報應。』」<br>所以，「你的仇敵若餓了，就給他吃；若渴了，就給他喝。因為你這樣行，就是把炭火堆在他的頭上。」<br>你不可為惡所勝，反要以善勝惡。</p></blockquote>"}]},{"num":69,"title":"第六誡命禁止我們作什麼？","answer":"第六誡命禁止我們：奪去我們自己的生命，或以不義手段奪取他人生命，或一切導致這種情況發生的事。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-7","days":[{"day":1,"html":"<p>第六誡命禁止殺人，但它不僅僅禁止殺人的舉動。它也禁止那些能夠導致殺人的態度。上帝是絕對聖潔的。祂恨惡各種形式的罪惡。心裡對他人的仇恨，以及不赦免他人的那種苦毒，在上帝的眼中是違背第六誡命的另一種方式。請讀利未記19:16-18。</p><blockquote><p><strong>利未記19:16-18</strong><br>不可在民中往來搬弄是非，也不可與鄰舍為敵，置之於死。我是耶和華。<br>不可心裡恨你的弟兄；總要指摘你的鄰舍，免得因他擔罪。<br>不可報仇，也不可埋怨你本國的子民，卻要愛人如己。我是耶和華。</p></blockquote><p>耶穌告訴我們，對人動怒和罵人都會叫我們成為在上帝面前有罪的人。（馬太福音5:21-22）</p><blockquote><p><strong>馬太福音5:21-22</strong><br>你們聽見有吩咐古人的話，說：『不可殺人』，又說：『凡殺人的，難免受審判。』<br>只是我告訴你們：凡向弟兄動怒的，難免受審判。凡罵弟兄是拉加的，難免公會的審斷；凡罵弟兄是魔利的，難免地獄的火。</p></blockquote>"},{"day":2,"html":"<p>殺人是上帝禁止的行為。而仇恨和苦毒是上帝禁止的態度。恨人，一般都是由於某人做了一件我們不喜歡的事，讓我們憤怒。這種憤怒是自我中心的，因此是有罪的。今天，人們教導說，有人冤枉我們的時候，我們一定要有足夠的怒氣，並且把它自由地發洩出來。如果我們不這麼做，這些人就會告訴我們，那會影響我們的健康。他們感覺鼓勵那些曾經受到傷害的人，不斷地思想並談論他們受到的傷害，不斷地重新感受那種憤怒。</p><p>可是聖經的教導完全相反。當有人傷害我們的時候（肯定會發生的），我們必須饒恕他們，繼續我們的生活。詩篇37篇講到了傷害到的惡人。這篇詩篇告訴我們，就連對待這樣的人，我們也應該相信上帝看顧他們，會公義地審判他們。這篇詩篇反覆告訴我們，不要為作惡的心懷不平。心懷不平就會一直想著那件事，一直讓這件事攪擾你。當我們因為別人做了傷害我們的事而心懷不平的時候，我們就越發激動，怒氣不斷升級。怒氣就迅速轉化為仇恨。上帝譴責怒氣和恨惡，而不僅僅是殺人。請讀詩篇37:7-9。</p><blockquote><p><strong>詩篇37:7-9</strong><br>你當默然倚靠耶和華，耐性等候他。不要因那道路通達的和那惡謀成就的心懷不平。<br>當止住怒氣，離棄忿怒；不要心懷不平，以致作惡。<br>因為作惡的必被剪除，惟有等候耶和華的必承受地土。</p></blockquote>"},{"day":3,"html":"<p>「棍棒石頭能打骨折，惡言惡語能奈何？」有時候看到有人被惡言傷害，人們常常用這句話來勸慰人。其實，無論你年紀大小，都大概認識到這句話說得不太對。可以肯定，在你一生中肯定至少有那麼一次，你曾感說過傷害你的話。聖經也不同意這種「惡言不傷人」之類的話。請讀箴言12:18。</p><blockquote><p><strong>箴言12:18</strong><br>說話浮躁的，如刀刺人；智慧人的舌頭，卻為醫人的良藥。</p></blockquote><p>我們可能用劍殺人，從而違背了「不可殺人」的誡命。不過，我們也可能用我們的言語傷人，以另外的方式違背了這條誡命。有時候，一個人如果恨另一個人，他可能會故意誹謗那個人，或者為了傷害對方而罵他。</p><p>這節經文說「說話浮躁的」，不是故意要刻薄，而是說話有口無心。可能我們跟人開玩笑，傷害了別人，卻不是有意的。也許跟別人傳講某人的秘密，並非想要傷害誰。我們的言語很容易浮躁。我們口無遮攔的時候，沒想過會造成什麼傷害。我們好好想一想，我們用言語傷人，會成為一種隱形的謀殺，那麼我們大概說話的時候可以更加謹慎一些了。</p>"},{"day":4,"html":"<p>這條誡命禁止仇恨和忿怒的態度，因為這是殺人的開始，除此以外，這條誡命還禁止冷漠的態度。冷漠就是不關心，不在乎。有許多人需要食物和住處，沒錢買東西。他們的需要十分急迫，如果沒有人幫他們就會死的。當我們瞭解有這樣的人，當我們有足夠的錢幫助他們，那麼這條誡命就禁止我們保持冷漠。它禁止我們不關心或者忽視這些人。約伯說，他看到凡有需要的人，就幫助他，因為他知道，如果不幫助人，就是犯罪得罪上帝。請讀約伯記31:16-23。</p><blockquote><p><strong>約伯記31:16-23</strong><br>我若不容貧寒人得其所願，或叫寡婦眼中失望；<br>或獨自吃我一點食物，孤兒沒有與我同吃；<br>（從幼年時孤兒與我同長，好像父子一樣；我從出母腹就扶助寡婦。）<br>我若見人因無衣死亡，或見窮乏人身無遮蓋；<br>我若不使他因我羊的毛得暖，為我祝福；<br>我若在城門口見有幫助我的，舉手攻擊孤兒；<br>情願我的肩頭從缺盆骨脫落，我的膀臂從上骨折斷。<br>因神降的災禍使我恐懼；因他的威嚴，我不能妄為。</p></blockquote>"},{"day":5,"html":"<p>有時候，我們以為只要我們不傷害別人，那我們就是讓上帝喜悅的。上帝要求我們，不僅僅是不做那些錯的事。上帝要求我們竭力做正確的事。當祂要求我們不可殺人的時候，祂也是在命令我們不要做任何會傷害人的事。當上帝命令我們不要傷害別人的事，祂也是在命令我們做幫助人的事。耶穌教導我們，要認出誰是屬於上帝的人，要看他們是否竭力來滿足別人的需要。祂還說，我們這麼做的時候，就彷彿我們在滿足了祂的需要一樣。請讀馬太福音25:31-46。</p><blockquote><p><strong>馬太福音25:31-46</strong><br>當人子在他榮耀裡，同著眾天使降臨的時候，要坐在他榮耀的寶座上。<br>萬民都要聚集在他面前。他要把他們分別出來，好像牧羊的分別綿羊山羊一般。<br>把綿羊安置在右邊，山羊在左邊。<br>於是，王要向那右邊的說：『你們這蒙我父賜福的，可來承受那創世以來為你們所預備的國。<br>因為我餓了，你們給我吃；渴了，你們給我喝；我作客旅，你們留我住；<br>我赤身露體，你們給我穿；我病了，你們看顧我；我在監裡，你們來看我。』<br>義人就回答說：『主啊，我們什麼時候見你餓了，給你吃，渴了，給你喝？<br>什麼時候見你作客旅，留你住，或是赤身露體，給你穿？<br>又什麼時候見你病了，或是在監裡，來看你呢？』<br>王要回答說：『我實在告訴你們：這些事你們既做在我這弟兄中一個最小的身上，就是做在我身上了。』<br>王又要向那左邊的說：『你們這被咒詛的人，離開我，進入那為魔鬼和他的使者所預備的永火裡去！<br>因為我餓了，你們不給我吃；渴了，你們不給我喝；<br>我作客旅，你們不留我住；我赤身露體，你們不給我穿；我病了，我在監裡，你們不來看顧我。』<br>他們也要回答說：『主啊，我們什麼時候見你餓了，或渴了，或作客旅，或赤身露體，或病了，或在監裡，不伺候你呢？』<br>王要回答說：『我實在告訴你們：這些事你們既不做在我這弟兄中一個最小的身上，就是不做在我身上了。』<br>這些人，要往永刑裡去；那些義人，要往永生裡去。「</p></blockquote>"},{"day":6,"html":"<p>第六誡命告訴我們不要殺人、不要恨人、不要憤怒、不要苦毒，不要以任何方式說傷人的話，做傷人的事。這條誡命呼籲我們要饒恕，要有恩慈、有憐憫，要分享我們所擁有的，要竭力做有益於他人的事。如果我們只是順其自然，那麼我們會努力遵守這條誡命，不過只會如此對待我們的朋友以及那些愛我們的人。如果面對的是我們的敵人或者那些曾經傷害過我們的人，我們就不想幫助他們，也不想與他們分享了。我們倒是不大可能去殺他們，不過我們會以為我們有權跟他們生氣，有權牢記他們做的錯事。但是耶穌告訴我們，如果我們只是跟朋友在一起才遵守這條誡命，我們就不是照著上帝的要求來遵守誡命了。請讀馬太福音5:43-48。</p><blockquote><p><strong>馬太福音5:43-48</strong><br>你們聽見有話說：『當愛你的鄰舍，恨你的仇敵。』<br>只是我告訴你們：要愛你們的仇敵，為那逼迫你們的禱告。<br>這樣，就可以作你們天父的兒子，因為他叫日頭照好人，也照歹人；降雨給義人，也給不義的人。<br>你們若單愛那愛你們的人，有什麼賞賜呢？就是稅吏不也是這樣行嗎？<br>你們若單請你弟兄的安，比人有什麼長處呢？就是外邦人不也是這樣行嗎？<br>所以你們要完全，像你們的天父完全一樣。</p></blockquote>"}]},{"num":70,"title":"第七誡命是什麼？","answer":"第七誡命是：「不可姦淫」。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-8","days":[{"day":1,"html":"<p>上帝創造人的時候，祂首先造了一個男人。上帝說那個男人獨居不好，於是祂給那男人造了一個女人。亞當很喜歡上帝給他造的妻子，夏娃也肯定十分高興和亞當在一起。夫妻是上帝賜給對方的禮物。請讀箴言18:22。</p><blockquote><p><strong>箴言18:22</strong><br>得著賢妻的，是得著好處，也是蒙了耶和華的恩惠。</p></blockquote><p>上帝設立夫妻關係的目的是要彼此有一個特殊的關係，一種比其他任何關係都更親密的關係。上帝要讓夫妻成為對方最好的朋友。上帝要夫妻一生都生活在一起，什麼也不可以把他們分開。「不可姦淫」的誡命，目的就是要保護夫妻之間這種特殊的關係。</p>"},{"day":2,"html":"<p>我們中的大多數人都有很多朋友。我們的朋友有男有女。在全世界的人中間，每個人只能選擇一位來作為丈夫或妻子。我們一旦做了選擇，與那個人結婚了，那麼我們跟別人的關係，就不可以像對待我們的配偶那樣特別。婚姻是上帝的主意。他要男女以榮耀上帝並且有益於自身的方式來生活在一起。於是上帝設立了婚姻制度，以此來保護夫妻之間的特別關係。請讀馬太福音19:4-6。</p><blockquote><p><strong>馬太福音19:4-6</strong><br>耶穌回答說：「那起初造人的，是造男造女，<br>並且說：『因此，人要離開父母，與妻子連合，二人成為一體。』這經你們沒有念過嗎？<br>既然如此，夫妻不再是兩個人，乃是一體了。所以，神配合的，人不可分開。」</p></blockquote>"},{"day":3,"html":"<p>結婚不總是那麼簡單的事。因為夫妻都是罪人。不管他們怎樣彼此相愛，也不論他們如何樂意遵從上帝給他們的命令，罪還是會偶爾妨礙婚姻的幸福。所有的婚姻關係都有艱難的時期。有的婚姻多數時間都是很艱難。婚姻中出問題的時候，人們往往想要放棄。他們可能會想到分手。</p><p>上帝設立了婚姻，為了防止夫妻在婚後有困難的時候就分手。一男一女結婚的時候，他們要彼此立約。所謂的約就是無論境況如何都要一直忠於對方的一份保證書。人不是都非得結婚不可，不過上帝的話告訴我們，一旦兩個人立了婚約，那麼破壞婚約就是犯罪。先知瑪拉基寫給以色列人的話，告訴他們上帝為什麼不喜悅他們的敬拜。他說是因為他們不忠於他們的婚約。請讀瑪拉基書2:13-14。</p><blockquote><p><strong>瑪拉基書2:13-14</strong><br>你們又行了一件這樣的事，使前妻嘆息哭泣的眼淚遮蓋耶和華的壇，以致耶和華不再看顧所供物，也不樂意從你手中收納。<br>你們還說：「這是為什麼呢？」因耶和華在你和你幼年所娶的妻中間作見證。她雖是你的配偶，又是你盟約的妻，你卻以詭詐待她。</p></blockquote>"},{"day":4,"html":"<p class=\"read-prompt\">請讀瑪拉基書2:16。</p><blockquote><p><strong>瑪拉基書2:16</strong><br>耶和華以色列的神說：「休妻的事和以強暴待妻的人，都是我所恨惡的。所以當謹守你們的心，不可行詭詐。這是萬軍之耶和華說的。」</p></blockquote><p>這節經文告訴我們上帝恨惡的兩件事，離婚與暴力。離婚就是結束婚姻。人們離婚後，就不再以夫妻身份一起生活。不幸的是，很多人把離婚當作解決痛苦處境的唯一出路。夫妻婚後發現關係不和，或者婚後生活不盡如人意的時候，他們可能會將離婚當作解決辦法。離婚對於夫妻雙方都是傷害。離婚尤其會傷害這個婚姻中所生的孩子們！比如在我國許多家庭以離婚收場，就會影響整個國家。因為以上這些重要的原因，人們不應該選擇離婚。但是比這些更重要的是，上帝說他恨惡離婚。我們絕對不該想要做上帝恨惡的事情。</p>"},{"day":5,"html":"<p>這條誡命告訴我們不可姦淫。姦淫就是兩個人並非夫妻，卻像夫妻之間的關係那樣相處。這是錯誤的事，因為上帝讓一男一女結婚，一生中不再與別人結合。結了婚的人如果像跟配偶那麼親密地接觸別人，那就是犯了姦淫的罪。如果一個人為了跟別人結婚，而與配偶離婚，這也是犯了姦淫罪。請讀馬太福音19:9。</p><blockquote><p><strong>馬太福音19:9</strong><br>我告訴你們：凡休妻另娶的，若不是為淫亂的緣故，就是犯奸淫了；有人娶那被休的婦人，也是犯奸淫了。「</p></blockquote>"},{"day":6,"html":"<p>上帝十分看重婚姻。祂要求我們小心守護婚姻。除非有極少的例外，祂禁止人們以離婚來結束婚姻。他也禁止人犯奸淫的罪，就是與配偶以外的人有那種夫妻之間才有的特殊關係。上帝重視婚姻，因為祂勾畫的婚姻圖景，是為了描繪主耶穌基督與祂的教會之間的關係。婚姻應該向世人顯明，基督和祂的教會應該是怎麼樣的。如果人們不按照上帝吩咐的方式看待婚姻，那麼這個目的就無法達到了。請讀以弗所書5:22-33。</p><blockquote><p><strong>以弗所書5:22-33</strong><br>你們作妻子的，當順服自己的丈夫，如同順服主。<br>因為丈夫是妻子的頭，如同基督是教會的頭，他又是教會全體的救主。<br>教會怎樣順服基督，妻子也要怎樣凡事順服丈夫。<br>你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。<br>要用水藉著道把教會洗淨，成為聖潔，<br>可以獻給自己，作個榮耀的教會，毫無玷汙、皺紋等類的病，乃是聖潔沒有瑕疵的。<br>丈夫也當照樣愛妻子，如同愛自己的身子，愛妻子便是愛自己了。<br>從來沒有人恨惡自己的身子，總是保養顧惜，正像基督待教會一樣。<br>因我們是他身上的肢體。<br>為這個緣故，人要離開父母，與妻子連合，二人成為一體。<br>這是極大的奧秘，但我是指著基督和教會說的。<br>然而你們各人都當愛妻子，如同愛自己一樣；妻子也當敬重她的丈夫。</p></blockquote>"}]},{"num":71,"title":"第七誡吩咐我們作什麼？","answer":"第七誡命吩咐我們：無論存心、說話、行事，都要保守自己與別人的貞潔。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-8","days":[{"day":1,"html":"<p>男人的身體與女人的身體不同，因為上帝要夫妻使用自己的身體來彼此相愛。夫妻關係是人類中間最親密的關係。這種關係比父母子女之間或朋友之間的關係還要親密得多。夫妻之間用身體來彼此相愛，是其他人不可以的。這一問的回答說我們要保守貞潔，就是這個意思。</p><p>我們一定小心，只能與我們的配偶來使用這種以身體的結合來相愛的方式。結了婚的男人只和自己的妻子以身體來表示相愛，這就是保持了貞潔。如果他對任何其他人表現那種親密，那他就不再貞潔了！未婚的人不用身體向任何人表示那種親密的婚內的愛，那就是保守貞潔了。他會等到結婚的時候。如果他一直不結婚，那麼他就不要和任何人發生那麼親密的關係。那種特別的愛是僅限於夫妻之間的。請讀希伯來書13:4。</p><blockquote><p><strong>希伯來書13:4</strong><br>婚姻，人人都當尊重，床也不可汙穢，因為苟合行淫的，神必要審判。</p></blockquote>"},{"day":2,"html":"<p>不幸的是，今日的中國人（原文：美國人，下同）不再認為婚姻有什麼特別的。結婚的人中間有一半後來離婚。中國人很多沒等到結婚，就發生了像夫妻那樣的性愛關係。今天的人們說男女在身體上彼此親近是很合理的事，至於結婚與否是無所謂的。如果你說的是動物，那倒是很合理的想法。動物可能有很多不同的配偶。可是人類不是動物，人們連這個都意識不到，是很可悲的。</p><p>人類是照著上帝的形像造的。夫妻的關係要描繪上帝與祂百姓的關係。上帝與祂的百姓立約。祂應許永遠作他們的上帝，叫他們永遠作祂的百姓。當一個男人和一個女人結婚的時候，他們彼此立約。祂應許永遠作他們的上帝，叫他們永遠作祂的百姓。當一個男人和一個女人結婚的時候，他們彼此承諾只要二人都活著，就彼此結為夫妻，不與別人結合。男人女人沒有結婚就用身體來彼此親近是不對的。請讀箴言2:16-17。</p><blockquote><p><strong>箴言2:16-17</strong><br>智慧要救你脫離淫婦，就是那油嘴滑舌的外女。<br>她離棄幼年的配偶，忘了神的盟約。</p></blockquote>"},{"day":3,"html":"<p>今天人們對於貞潔的概念是很混亂的。有一個原因就是，太多的人花太多時間看電視、看電影、聽流行音樂。這些東西所傳遞的資訊是混亂的。差不多在每一個愛情影片裡，一男一女剛剛認識，自以為可能喜歡上了對方，他們就用上帝為夫妻關係所特定那種方式來彼此相愛。</p><p>看了大多數的電影、以及聽過大多數的流行音樂，你可能就會以為，這樣的以身體示愛就是男女彼此瞭解的方式。完全弄反了！用身體與人交往，不是認識人的方式！首先，兩個人應該彼此好好了解。如果他們在對方身上看到基督那樣的品格，他們可能會成為朋友，然後開始彼此相愛。然後，他們會彼此承諾，結為夫妻永遠生活在一起。他們一生都彼此屬於對方。最後，他們才可以自由地使用他們的身體來彼此相愛。請讀哥林多前書7:4。</p><blockquote><p><strong>哥林多前書7:4</strong><br>妻子沒有權柄主張自己的身子，乃在丈夫；丈夫也沒有權柄主張自己的身子，乃在妻子。</p></blockquote>"},{"day":4,"html":"<p>如今，人們對於貞潔的概念十分混亂的另一個原因是，他們已經忘記了上帝創造他們的目的。你還記得這本要理問答的第一問的回答嗎？「人的主要目的是什麼」「人的主要目的就是榮耀上帝，以祂為樂，直到永遠。」今天，人們以為他們的首要目的是讓自己快樂。於是，他們隨心所欲地使用自己的身體，做一些給自己帶來快樂的事。我們的身體被造，就是讓我們用來榮耀上帝的。這對於基督徒來說更是真實的。上帝已經賜下祂的聖靈來住在基督徒的裡面。我們的身體是祂的殿，我們應該使用身體來榮耀祂。當耶穌為我們死的時候，祂不僅僅是為我們的靈魂而死，也是為著我們的身體而死的。我們的身體屬於祂。我們必須為著祂的目的，而不是為著我們自私的目的，來使用身體。請讀哥林多前書6:19-20。</p><blockquote><p><strong>哥林多前書6:19-20</strong><br>豈不知你們的身子就是聖靈的殿嗎？這聖靈是從神而來，住在你們裡頭的；並且你們不是自己的人，<br>因為你們是重價買來的，所以要在你們的身子上榮耀神。</p></blockquote>"},{"day":5,"html":"<p>保守貞潔不僅僅是要當心我們如何使用身體。這個問題的回答告訴我們，我們必須在心思、言語、行為上都保持貞潔。耶穌說，即使一個男人沒有用身體犯什麼錯，但是心裡對妻子以外的人動了淫念，那人就已經在心裡犯了姦淫了。（馬太福音5:28）</p><blockquote><p><strong>馬太福音5:28</strong><br>只是我告訴你們：凡看見婦女就動淫念的，這人心裡已經與她犯奸淫了。</p></blockquote><p>上帝不會被我們外面做的事打動。上帝要求我們有純潔的心思。保持貞潔的行為，最好的辦法就是，我們要留心思想、愛慕純潔的事物。我們的為人是來源於我們裡面的真實自我。請讀箴言4:23。</p><blockquote><p><strong>箴言4:23</strong><br>你要保守你心，勝過保守一切，因為一生的果效，是由心發出。</p></blockquote>"},{"day":6,"html":"<p>使徒保羅提醒哥林多的基督徒，他們是上帝的百姓。上帝應許跟祂的百姓有超出其他人的關係。出於跟上帝之間這種特殊關係，上帝的百姓應該在感恩中在各方面保守純潔。與他們有特殊關係的上帝是聖潔的，他們也應因此而留心成為純潔的人。他們應該不敢去做上帝不喜悅的事。上帝的話呼籲我們要多方留意保守我們的身體和心靈純潔。請讀哥林多後書7:1。</p><blockquote><p><strong>哥林多後書7:1</strong><br>親愛的弟兄啊，我們既有這等應許，就當潔淨自己，除去身體、靈魂一切的汙穢，敬畏神，得以成聖。</p></blockquote>"}]},{"num":72,"title":"第七誡命禁止我們做什麼？","answer":"第七誡命禁止我們：一切不純潔的意念、言語和行為。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-8","days":[{"day":1,"html":"<p>人們違犯這條誡命犯奸淫的時候，絕不是毫無前兆地突然犯罪了。之所以能違犯這條誡命，是因為他們一直在想，如果違犯這條誡命，那會是什麼樣的。我們的行為總是源於我們平常的思想。上帝要求我們在意念上純潔。意思是說，我們放在頭腦中的需要是純潔的事物。請讀腓立比書4:8。</p><blockquote><p><strong>腓立比書4:8</strong><br>弟兄們，我還有未盡的話：凡是真實的、可敬的、公義的、清潔的、可愛的、有美名的，若有什麼德行，若有什麼稱讚，這些事你們都要思念。</p></blockquote><p>這節經文描述了我們應該用哪類的東西來充實我們的思想。我們應該根據這節經文所描述的評價，對所聽的音樂、所讀的書、所看的電視節目有所選擇。當我們起初看到或聽到明知不純潔的東西，我們不會喜歡，我們會認為那是不好的東西。不過，如果我們繼續地看下去或聽下去，我們就會越不在乎了。逐漸地，我們就改變了我們對於純潔與否的想法。那樣，我們就不是在用上帝的話來判斷這些事物，反而是讓我們看的節目和聽的音樂來告訴我們什麼是對，什麼是錯。</p>"},{"day":2,"html":"<p class=\"read-prompt\">請讀約伯記31:1。</p><blockquote><p><strong>約伯記31:1</strong><br>我與眼睛立約，怎能戀戀瞻望處女呢？</p></blockquote><p>約伯的想法是明智的。他知道，如果我們花時間看某些東西，就會讓我們產生不潔的思想。他也知道，一旦我們開始了看那些不該看的東西，就很難停止。所以約伯事先決定，不看那些讓他想入非非的東西。他說，他與眼睛立了約。約伯立志不看那些讓他想入非非的東西。當我們等著那些我們不該看的東西突然出現在眼前的時候，就很難把目光挪開了。如果我們事先已經決定了我們要看什麼，不要看什麼，那就會比較容易離開讓我們想入非非的事物。</p>"},{"day":3,"html":"<p>當我們留心我們的眼睛時，我們就會彼此幫助潔淨思想。上帝造了夫妻，讓他們彼此欣賞的時候，就互相吸引。那是對的，是好的。不過我們需要留意，不可以邀請我們配偶以外的人來注視我，來幻想我們的身體。有些衣者會吸引人注意我們的身體。緊身和暴露身體的服裝可能會讓別人看我們，產生一些不當的想法。我們總是要注意，我們的裝束要得體，不要吸引人注意我們的身體。請讀提摩太前書2:9-10。</p><blockquote><p><strong>提摩太前書2:9-10</strong><br>又願女人廉恥、自守，以正派衣裳為妝飾，不以編髮、黃金、珍珠和貴价的衣裳為妝飾；<br>只要有善行，這才與自稱是敬神的女人相宜。</p></blockquote><p>這節經文說的是女人，不過男人（包括男孩子）有時候穿著也不得體。他們也要留意自己的穿著，不要試圖吸引人注意他們的身體。</p>"},{"day":4,"html":"<p>第七誡命禁止我們在行為上不正派，或者意念上不純潔。它也禁止我們說淫穢的話。請讀以弗所書5:3-4。</p><blockquote><p><strong>以弗所書5:3-4</strong><br>至於淫亂並一切汙穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。<br>淫詞、妄語和戲笑的話都不相宜，總要說感謝的話。</p></blockquote><p>我們周圍充斥著髒話和低俗的笑話。多數人說的時候都沒有好好想過。他們也沒看到這麼說話有什麼不對的。髒話和低俗笑話就是人們在言語方面的淫亂。這段經文告訴我們，因為我們是上帝的百姓，那些淫亂汙穢的事在我們中間連提都不要提。</p>"},{"day":5,"html":"<p>我們想要在言語方面純潔，因為這是上帝的要求。上帝造我們，讓我們有溝通的能力，我們也要留心我們的言語，讓我們的言語可以實現上帝造我們時的目的。彼此交談的能力是上帝給我們最好的禮物之一。祂把這個禮物賜給我們，是為了祂的榮耀，而且是為了別人的益處。當我們用汙穢的方式使用言語，我們就完全背離上帝在我們身上的目的。我們就是用言語來傷害人，而不是幫助人了。請讀以弗所書4:29。</p><blockquote><p><strong>以弗所書4:29</strong><br>汙穢的言語，一句不可出口，只要隨事說造就人的好話，叫聽見的人得益處。</p></blockquote>"},{"day":6,"html":"<p>聖經裡講到一個受到淫亂誘惑的年輕人，他拒絕向誘惑低頭。約瑟是個僕人，在埃及護衛長家裡殷勤工作。約瑟的主人十分信任他。他讓約瑟管理家裡的大小事情。約瑟主人的妻子覺得約瑟十分迷人。她想跟約瑟有夫妻那樣的親密關係。請讀創世記39:6-9。</p><blockquote><p><strong>創世記39:6-9</strong><br>波提乏將一切所有的都交在約瑟的手中，除了自己所吃的飯，別的事一概不知。約瑟原來秀雅俊美。<br>這事以後，約瑟主人的妻，以目送情給約瑟說：「你與我同寢吧！」<br>約瑟不從，對他主人的妻說：「看哪！一切家務我主人都不知道，他把所有的都交在我手裡。<br>在這家裡沒有比我大的，並且他沒有留下一樣不交給我，只留下了你，因為你是他的妻子。我怎能作這大惡，得罪神呢？」</p></blockquote><p>約瑟不願聽從那女人的迷惑。原因之一是，他知道主人信任他，因此他不想辜負主人。不過他提出的更重要的原因是，那樣做就犯罪得罪上帝了。</p>"}]},{"num":73,"title":"第八誡命是什麼？","answer":"第八誡命是：「不可偷盜」。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-9","days":[{"day":1,"html":"<p>十誡中的前四條誡命告訴我們對上帝的本分。那幾條誡命警告我們不可奪取屬於上帝的東西。當我們沒有照我們的本分敬拜祂，或者當我們敬拜其他的人或物，我們就是奪取屬於上帝的東西。十誡中的後面六條告訴我如果對待其他人。這第八條誡命特別地警告我們不可偷盜別人的東西。我們應該把敬畏、崇拜、順服歸給上帝。不把上帝當得的獻給祂，就是偷竊屬上帝之物。我們也當尊重人，因為他們是照著上帝的形像造的。我們尊重人的一個方式就是尊重屬於他的東西。我們也當愛人，因為上帝命令我們愛別人。我們向別人表示愛心的一種方式就是幫助他們的需要。請讀羅馬書13:7-8。</p><blockquote><p><strong>羅馬書13:7-8</strong><br>凡人所當得的，就給他；當得糧的，給他納糧；當得稅的，給他上稅；當懼怕的，懼怕他；當恭敬的，恭敬他。<br>凡事都不可虧欠人，惟有彼此相愛，要常以為虧欠，因為愛人的就完全了律法。</p></blockquote>"},{"day":2,"html":"<p>上帝命令我們愛別人。他告訴我們，當我們愛人的時候，就遵守了律法。有時候我們可能不知道如何愛人。我們可以問問自己：如果我是處在那個人的位置，我想要人為我做什麼？耶穌說，要人怎樣待你，你就該怎樣待別人，這樣就歸納了上帝關於如何待人的教導。請讀馬太福音7:12。</p><blockquote><p><strong>馬太福音7:12</strong><br>所以，無論何事，你們願意人怎樣待你們，你們也要怎樣待人，因為這就是律法和先知的道理。</p></blockquote><p>我們不想讓人拿走我們的東西，也不想別人借了我們的東西再也不歸還。我們也不願意付了錢給人，讓他為我們工作，他卻敷衍了事，結果還得返工。所以，我們也不應該對任何人做這樣的事。反過來，我們願意在我們一無所有的時候，有人跟我們分享他們的食物。如果我們損失了重要的東西，有人撿到了歸還給我們，這會讓我們非常高興。那麼這些事都是我們應該為別人做的事。當我們願意別人怎樣對我們，我們就怎樣對別人，那麼我們就是遵守了不可偷盜的誡命。</p>"},{"day":3,"html":"<p>對於這條「不可偷盜」的誡命，同樣的原則也適用於所有的誡命。上帝不會只滿足於我們做什麼或不做什麼。祂要我們有正確的態度。我們可能從未拿過不屬於我們的東西，不過那並不意味著我們就是守了這條誡命。這條誡命也禁止貪財。貪財就是不滿足於我們所擁有的，有了還想更多。請讀提摩太前書6:6-10。</p><blockquote><p><strong>提摩太前書6:6-10</strong><br>然而，敬虔加上知足的心便是大利了，<br>因為我們沒有帶什麼到世上來，也不能帶什麼去，<br>只要有衣有食，就當知足。<br>但那些想要發財的人，就陷在迷惑、落在網羅和許多無知有害的私慾裡，叫
