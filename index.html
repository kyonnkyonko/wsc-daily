仍然活在罪中。他們不能指望上帝聽他們禱告。</p><p>聖經教導我們禱告是什麼。它指教我們，如何禱告上帝才會聽。當我們按照上帝在祂話語中吩咐的去禱告，上帝就會使用禱告來作為我們得救的媒介。</p>"},{"day":2,"html":"<p>這個問答的答案為我們提供了符合聖經的禱告定義。它告訴我們，在真正的禱告中，我們將我們的心向上帝陳明。心願是我們對於一些事情的願望。我們在上帝面前陳明什麼心願呢？我們所陳明的心願應該「合乎上帝的旨意」。我們想要的東西很多，而上帝也確實眷顧我們生活中的細節。但是，當我們禱告的時候，我們不應該花大部分時間為明天贏得比賽或者為朋友聚會有好天氣禱告。當我們在禱告中來到上帝面前，我們必須誠實地告訴祂我們想要我們擁有的東西。這些東西就是比如愛人如己、饒恕他人，真知道上帝，還有聖潔等等。上帝在祂的道中賜下許多禱告的範例。讀讀這些範例，然後像這些經文中禱告的人一樣祈求同樣的東西。請在歌羅西書1:9-10中，讀讀其中一位聖經中的禱告者如何禱告。</p><blockquote><p><strong>歌羅西書 1:9</strong><br>因此，我們自從聽見的日子，也就為你們不住地禱告祈求，願你們在一切屬靈的智慧悟性上，滿心知道 神的旨意，</p></blockquote><blockquote><p><strong>歌羅西書 1:10</strong><br>好叫你們行事為人對得起主，凡事蒙他喜悅，在一切善事上結果子，漸漸地多知道 神；</p></blockquote>"},{"day":3,"html":"<p>注意，這個問題的答案告訴我們要將我們的心願陳明在上帝面前。心願來自內心。有時候我們的禱告有口無心，根本沒想我們說的是什麼。這是錯誤的，因為上帝不想只從我們這裡聽到話語而已。他要我們向祂以心裡禱告。當我們出聲禱告時，我們應該謹慎，思想我們說的是什麼。當別人禱告的時候，尤其是他們禱告時間比較長的時候，我們很容易思想溜號。這是很容易發生的事，不過這是不對的。當別人禱告的時候，我們必須省察和聽，並認可他們所說的。大多數人發現禱告很難。真誠的禱告並且在禱告中警醒，是不容易的事。我們必須在禱告方面成長，因為上帝吩咐我們禱告。我們越禱告，就越成長像基督。請讀帖撒羅尼迦前書5:16-18。</p><blockquote><p><strong>帖撒羅尼迦前書 5:16</strong><br>要常常喜樂，</p></blockquote><blockquote><p><strong>帖撒羅尼迦前書 5:17</strong><br>不住地禱告，</p></blockquote><blockquote><p><strong>帖撒羅尼迦前書 5:18</strong><br>凡事謝恩，因為這是 神在基督耶穌裡向你們所定的旨意。</p></blockquote>"},{"day":4,"html":"<p>我們向上帝陳明心願的唯一途徑是「奉基督的名」。這不是說，「奉基督的名」這幾個字就好像是在說「阿們」之前放在禱告末尾的神秘公式。你有沒有在電影裡聽見警察說「不許動！我以法律的名義命令你！」警察是在告訴那個人，命令你不許動的不只是一個人而已；他是代表整個的法律系統在命令他。如果那個人繼續跑，他是在違背當地的法律。</p><p>當我們「奉基督的名」來到上帝面前，我們是在告訴上帝，我們不是指望祂能照著我們本來的樣子來接納我們、聆聽我們。我們畢竟都是罪人。上帝不聽罪人的禱告。我們指望上帝接納聆聽我們的禱告，是因為主耶穌基督站在我們後面。那位一直完美順服上帝以至於死在十字架上的，我們是奉祂的名求祂所需的。當然，只有信靠主耶穌作主和救主的人，才能奉祂的名禱告。當我們奉祂的名前來，我們可以確信上帝會聆聽我們、回應我們。請讀以弗所書3:11-12。</p><blockquote><p><strong>以弗所書 3:11</strong><br>這是照 神從萬世以前，在我們主基督耶穌裡所定的旨意。</p></blockquote><blockquote><p><strong>以弗所書 3:12</strong><br>我們因信耶穌，就在他裡面放膽無懼，篤信不疑地來到 神面前。</p></blockquote>"},{"day":5,"html":"<p>當我們禱告的時候，我們祈求上帝，要得到上帝在祂的話語中告訴我們要擁有的東西。此外，我們也向上帝認罪。如果我們想要成為成熟的基督徒，我們會發現，每天省察我們的心是非常有幫助的。我們發現了什麼，就馬上向上帝承認，承認那是罪。我們應該懇求祂來叫我們恨惡我們在自己裡面看到的罪。如果我們每天忠心地如此行，就會大大幫助我們學習為上帝而活，而不是為自己而活。我們要向上帝認罪，還有另一個原因。祂在祂的話語中告訴我們，如果祂的兒女死死抓住罪惡不肯離棄，那麼祂就不會應允他們的祈求。請讀詩篇66:18。</p><blockquote><p><strong>詩篇 66:18</strong><br>我若心裡注重罪孽，主必不聽。</p></blockquote>"},{"day":6,"html":"<p>感恩是禱告的另一個重要部分。上帝對我們多好啊。如果要你只是列舉一下一天當中上帝善待我們的地方，那將是很長的一份清單。我們這些上帝的百姓，擁有祂在基督裡賜下的一切福分，我們也應該為此感恩。對於我們來說，就連悲哀的、艱難的事情也應該叫我們感恩。我們生活中的艱難，正是耶穌用來塑造我們更像祂的工具。我們必須忠心地檢視我們應該感謝上帝的那些事，然後為此感謝祂。當我們如此行，我們就會在敬虔的品格上大大長進。請讀腓立比書4:6。</p><blockquote><p><strong>腓立比書 4:6</strong><br>應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將你們所要的告訴 神。</p></blockquote>"}]},{"num":99,"title":"上帝賜下什麼準則，來教導我們禱告？","answer":"全本聖經就是用來教導我們如何禱告；特別作為禱告準則的，是基督教導門徒的禱告，通稱為「主禱文」。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-18","days":[{"day":1,"html":"<p>「禱告」這個詞對於許多人有許多不同的意思。對於有的人來說，禱告就是用心去想某個人。對於另一些人，禱告就是許願要得什麼東西。有些人把禱告看成是思想或說出心裡所有的感受，哪怕那是有罪的事情。許多人禱告的時候根本不思想。他們就是想說什麼就說什麼。還有人相信，他們把背誦下來的話念出來就是禱告了，也不管是否注意到說的是什麼。</p><p>對於我們所做的任何事情，我們都應該瞭解聖經怎麼說。關於敬拜和服侍上帝，尤其如此。聖經關於禱告有很多教導。它也給我們許多禱告的範例。聖靈自己也賜給我們禱告的話語，是在聖經裡的。我們不可照著我們當時的心情或感覺來禱告，而是要叫上帝的道來指導我們的禱告。我們就是在祂的話語中學習上帝的旨意。上帝應許垂聽合乎他旨意的禱告。請讀約翰一書5:14。</p><blockquote><p><strong>約翰一書 5:14</strong><br>我們若照他的旨意求他，他就聽我們，這是我們向他所存坦然無懼的心。</p></blockquote>"},{"day":2,"html":"<p>當我們來到聖經面前，叫聖經來指導我們的禱告，我們就瞭解到，我們不應該隨便要什麼東西。我們要祈求得到那些對上帝來說有價值的東西禱告。人們常常以為禱告是得到自己想要的東西的方式。這不是上帝賜給我們禱告權柄的原因。祂賜下禱告，是叫我們瞭解祂想要我們擁有的是什麼。當我們為著上帝想要我們擁有的東西禱告，我們就會學習渴慕擁有它們。我們不應該自私地使用禱告的權柄。</p><p>我們準備祈求某個東西，我們應該停下來問問自己「我為什麼要這個東西？」如果上帝應允了這個禱告，祂的道是否得到了尊重？祂百姓中是否會有一人或多人因此變得更敬虔？當我們捫心自問「我為什麼為此禱告？」如果答案只是「因為我真想要」，那麼我們就不該為那個東西禱告了。請讀雅各書4:2-3。</p><blockquote><p><strong>雅各書 4:2</strong><br>你們貪念，還是得不著；你們殺害嫉妒，又鬥毆爭戰，也不能得。你們得不著，是因為你們不求；</p></blockquote><blockquote><p><strong>雅各書 4:3</strong><br>你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中。</p></blockquote>"},{"day":3,"html":"<p>當我們查考聖經，叫它來指導我們的禱告，我們就需要考查聖經關於禱告的所有教導。馬太福音有一句經文說「你們祈求，就給你們……因為凡祈求的，就得著。」如果你只讀這一句經文，你可能會對禱告有錯誤的認識。你可能以為自己可以隨便要什麼，上帝就會給你，就好像瓶子裡出來的精靈滿足人的願望一樣。不過，我們從周邊的經文中瞭解到，當我們照著他的旨意來祈求，祂就聽我們禱告。耶穌在另一處經文裡，我們奉耶穌的名求什麼，上帝就賜給我們。換句話說，當我們來到上帝面前，祈求耶穌自己會祈求的內容，那麼上帝就會賜給我們。請讀路加福音11:9-13。</p><blockquote><p><strong>路加福音 11:9</strong><br>我又告訴你們：你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。</p></blockquote><blockquote><p><strong>路加福音 11:10</strong><br>因為，凡祈求的，就得著；尋找的，就尋見；叩門的，就給他開門。</p></blockquote><blockquote><p><strong>路加福音 11:11</strong><br>你們中間作父親的，誰有兒子求餅，反給他石頭呢？求魚，反拿蛇當魚給他呢？</p></blockquote><blockquote><p><strong>路加福音 11:12</strong><br>求雞蛋，反給他蠍子呢？</p></blockquote><blockquote><p><strong>路加福音 11:13</strong><br>你們雖然不好，尚且知道拿好東西給兒女，何況天父，豈不更將聖靈給求他的人嗎？</p></blockquote><p>耶穌應許賜聖靈給祂的跟隨者。上帝在祂的話中告訴我們，祂要祂的兒女都被聖靈掌管，在生活中結出聖靈的果子來。這就是我們可以奉耶穌的名祈求的好例子，知道上帝會聆聽並且應允。</p>"},{"day":4,"html":"<p>我們要用上帝全部的話來指導我們的禱告。我們尤其應該使用主禱文來叫我們明白如何禱告。因為耶穌把主禱文賜給我們，正是要教導我們如何禱告。一天耶穌正照常禱告。禱告完之後，祂的門徒對他說：「求主教導我們禱告。」耶穌的答案正是主禱文。耶穌比任何人更知道該如何禱告。耶穌曾在永恆中間與聖父上帝同在。祂認識天父，知道什麼是祂喜悅的。耶穌是完美無罪的，因此祂的禱告總是尊上帝為大。上帝總是聽耶穌的禱告。請讀耶穌叫拉撒路從死裡復活時，耶穌如何談論自己的禱告。請讀約翰福音 11:41-42。</p><blockquote><p><strong>約翰福音 11:41</strong><br>他們就把石頭挪開。耶穌舉目望天說：「父啊，我感謝你，因為你已經聽我；</p></blockquote><blockquote><p><strong>約翰福音 11:42</strong><br>我也知道你常聽我。但我說這話，是為周圍站著的眾人，叫他們信是你差了我來。」</p></blockquote>"},{"day":5,"html":"<p>我們可以用兩種方式來使用主禱文：將它本身作為禱告詞，以及將它當做禱告的範例。我們可以原封不動地用它來禱告。人們在敬拜中常常一同說主禱文。當我們如此行的時候，很容易有口無心，因為我們都已經把它背下來了。有口無心的禱告總是錯誤的。當我們說主禱文的時候，我們應該想想每個字和它的意思。每當我們有口無心地禱告，就是在妄稱上帝的名。我們開始禱告時呼求祂的名字，然後我們就馬馬虎虎地禱告。禱告時只有話語沒有真心，是不敬畏上帝，是在羞辱上帝。聖經警告我們不要說有口無心的空話。請讀馬太福音 6:7-8。</p><blockquote><p><strong>馬太福音 6:7</strong><br>你們禱告，不可像外邦人，用許多重複話，他們以為話多了必蒙垂聽。</p></blockquote><blockquote><p><strong>馬太福音 6:8</strong><br>你們不可效法他們，因為你們沒有祈求以先，你們所需用的，你們的父早已知道了。</p></blockquote>"},{"day":6,"html":"<p>我們使用主禱文的第二種方式是用它來當做禱告的範例或模板。當我們這樣做的時候，不是使用主禱文一模一樣的字句，而是照著主禱文的範例，祈求同樣的事。要理問答餘下的那些問答，讓我們明白，主禱文的每一個部分都是在祈求什麼，在說什麼。他們給我們提供例證，叫我們知道在用自己的話形成禱告詞時，如何用主禱文當做範例。請讀馬太福音 6:9-13。</p><blockquote><p><strong>馬太福音 6:9</strong><br>所以，你們禱告要這樣說：『我們在天上的父：願人都尊你的名為聖.</p></blockquote><blockquote><p><strong>馬太福音 6:10</strong><br>願你的國降臨。願你的旨意行在地上，如同行在天上.</p></blockquote><blockquote><p><strong>馬太福音 6:11</strong><br>我們日用的飲食，今日賜給我們.</p></blockquote><blockquote><p><strong>馬太福音 6:12</strong><br>免我們的債，如同我們免了人的債.</p></blockquote><blockquote><p><strong>馬太福音 6:13</strong><br>不叫我們遇見試探。救我們脫離兇惡。因為國度、權柄、榮耀，全是你的，直到永遠。阿們』</p></blockquote>"}]},{"num":100,"title":"主禱文的前言，教導我們什麼？","answer":"主禱文的前言「我們在天上的父」，教導我們：當以全然聖潔的敬畏與信靠之心，來親近神，如同兒女來到父親面前，相信祂能夠、也樂意幫助我們；並且教導我們要為他人並且為他人禱告。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>大多數父親都愛他們的兒女。父親為兒女感到自豪，並且想要兒女得到最好的福分。父親愛兒女是自然的，因為兒女是他們的一部分。因為父親愛兒女，所以父親想要把好東西給兒女。當一個男人收養孩子的時候，他選擇作這沒有父親之人的父親。這個父親選擇承擔這孩子一切的需用。他會照顧、愛護這孩子，直到他長大成人。一位父親收養不屬於自己的孩子，是非常有愛心的舉動。被收養的孩子到父親面前，請求得到所需要的東西，他確信父親會聽他。他的父親起初在收養他的時候，早已經顯明是愛他的。</p><p>上帝已經選擇作祂百姓的父。祂已經收養了我們。祂已經選擇成為永遠愛護我們、供應我們一切所需的那一位。耶穌教導我們，要把上帝看做慈父。祂教導我們要稱呼祂為「我們的父」當我們來到上帝面前禱告，我們可以確信祂會垂聽，因為祂是愛我們的父。請讀羅馬書 8:15-16。</p><blockquote><p><strong>羅馬書 8:15</strong><br>你們所受的不是奴僕的心，仍舊害怕；所受的乃是兒子的心，因此我們呼叫：「阿爸，父！」</p></blockquote><blockquote><p><strong>羅馬書 8:16</strong><br>聖靈與我們的心同證我們是 神的兒女；</p></blockquote>"},{"day":2,"html":"<p>我行我素、輕薄無禮的兒女來到父親面前時，馬上就要父親的關注。如果父親正在跟人講話，這孩子根本不顧禮節，不懂得等等再說話。他衝父親大喊大叫，甚至拉扯、拍打他，為要得到祂的關注。這個孩子不是懇求得到想要的東西，他是在粗魯地索取。孩子這樣對待父親是錯的。孩子應當孝敬父母。孩子跟父母講話時應該彬彬有禮，顯出對他們的尊重。當我們以禱告來到上帝面前，我們可以放心地來，就彷彿兒女來到父親面前一樣。不過，正如恭而有禮的兒女來到父親面前一樣，我們必須以恭敬的方式跟上帝講話。我們禱告的時候，不可以喊上去彷彿我們以為可以命令上帝。反而，我們要恭恭敬敬地請求上帝給我們所需的一切。請讀瑪拉基書 1:6。</p><blockquote><p><strong>瑪拉基書 1:6</strong><br>藐視我名的祭司啊，萬軍之耶和華對你們說：兒子尊敬父親，僕人敬畏主人；我既為父，我的尊榮在哪裡呢？我既為主人，敬畏我的在哪裡呢？「你們卻說：『我們在何事上藐視你的名呢？』」</p></blockquote>"},{"day":3,"html":"<p>嬌寵過度的孩子來到父親面前時，只知道自己想要什麼，除此以外什麼也不顧。如果父親不給他想要的東西，孩子就暴跳如雷、大喊大叫。他想方設法要父親把東西給他。聰明、順服的孩子不會這樣做。聰明的孩子知道，他父親比他更聰明得多。他會告訴父親，自己需要什麼，然後相信父親會做對他最有益處的事。如果父親告訴他，不能得到他想要的東西，他會毫無怨言地接受。當我們向我們的父上帝禱告的時候，我們不應該像一個慣壞了的孩子。我們應該在禱告中把需要帶到上帝面前，相信祂會供應我們所需用的。如果我們以為我們需要的東西，祂沒有給我們，那麼我們也不會抱怨。相反，我們會接受祂實際所給的，並以此為滿足。請讀詩篇 131。</p><blockquote><p><strong>詩篇 131:1</strong><br>耶和華啊，我的心不狂傲，我的眼不高大，重大和測不透的事，我也不敢行.</p></blockquote><blockquote><p><strong>詩篇 131:2</strong><br>我的心平穩安靜，好像斷過奶的孩子在他母親的懷中；我的心在我裡面真像斷過奶的孩子.</p></blockquote><blockquote><p><strong>詩篇 131:3</strong><br>以色列啊，你當仰望耶和華，從今時直到永遠！</p></blockquote>"},{"day":4,"html":"<p>耶穌在主禱文中開頭的幾個字「我們……的父」教導我們，我們可以像孩子來到父親面前一樣，放膽無懼地來到上帝面前。開頭的幾個字也提醒我們，我們是來到「天上」的父面前，而不是一位普普通通的父。我們的父上帝是「在天上」。他是我們的父，所以我們可以充滿信心地前來。同時，在我們與我們的天父之間仍有很大差別，所以我們必須帶著敬畏前來。上帝在天上，我們在地上。上帝是偉大、崇高、聖潔的上帝，而我們是有罪的受造者。所以我們在禱告時的態度，應該不僅僅是尊敬，而更要有敬畏之心。請讀傳道書 5:2。</p><blockquote><p><strong>傳道書 5:2</strong><br>你在 神面前不可冒失開口，也不可心急發言。因為 神在天上，你在地下，所以你的言語要寡少.</p></blockquote>"},{"day":5,"html":"<p>當兒女帶著需要來到世上的父親面前，父親可能是一個苛刻、冷酷的人，不關心孩子。他可能有能力滿足他們的需要，卻不願意這麼做。我們在天上的父不是這樣的。我們&lt;/content&gt;知道，上帝樂意把我們一切所需的，賜給我們這些作祂兒女的。我們對此篤信不疑，因為祂已經把祂最珍惜的賜給了我們。請讀羅馬書8:32。</p><blockquote><p><strong>羅馬書8:32</strong><br>神既不愛惜自己的兒子為我們眾人舍了，豈不也把萬物和他一同白白地賜給我們嗎？</p></blockquote><p>當兒女帶著需要來到世上的父親面前，父親可能樂意把他們要的東西給他們，可是他可能沒有能力做到。兒女們要的東西，可能他根本沒有。或者他們要求他的，對於他來說太難了，根本做不到。我們知道，對於我們在天上的父來說，沒有難成的事。祂不僅能夠做到我們所求的事，甚至祂所做的會超過我們所想。請讀以弗所書3:20-21。</p><blockquote><p><strong>以弗所書3:20-21</strong><br>神能照著執行在我們心裡的大力，充充足足地成就一切，超過我們所求所想的。<br>但願他在教會中，並在基督耶穌裡，得著榮耀，直到世世代代，永永遠遠。阿們。</p></blockquote>"},{"day":6,"html":"<p>主禱文的前言教導我們，我們可以滿懷信心來到上帝面前，因為祂是我們的父。它教導我們，必須要以敬畏之心來到上帝面前，因為祂是我們的上帝。這句話還教導我們另一樣東西。耶穌說我們要稱上帝為「我們」在天上的父。如果我們只想著自己，我們就會說「我在天上的父」。如果我們也想著別人，我們就會說「我們在天上的父」。有很多人以為敬拜和禱告是私人的事情。他們以為自己不需要教會，也不需要其他人。他們以為可以獨自敬拜、禱告，也能得上帝喜悅。這種想法不是來自於聖經。當主耶穌救人的時候，祂拯救他成為教會的一部分。祂要求我們一同敬拜禱告。祂要求我們要跟其他信徒一起禱告，也要為其他信徒禱告。請讀以弗所書6:18。</p><blockquote><p><strong>以弗所書6:18</strong><br>靠著聖靈，隨時多方禱告祈求，並要在此警醒不倦，為眾聖徒祈求。</p></blockquote>"}]},{"num":101,"title":"我們在「主禱文」的第一項祈求中，禱告什麼？","answer":"在第一項祈求「願人都尊你的名為聖」中，我們禱告：求神賜力量給我們和他人，使我們在禮用以顯明自己的一切事上，榮耀祂，並求祂行作萬事，彰顯祂自己的榮耀。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>每當在教會或家庭中到了禱告時間，大家就都提出自己的代禱事項。我們可以聽一段時間，看看我們的禱告事項中，有多少都是在求我們或者別人在今生更舒適。我們禱告，為病人求健康，為出門在外的人求平安。我們為人們找到好工作養家餬口來禱告。為大家應該做什麼事能開心而禱告。上帝關心我們生活的細節。不過，從耶穌所給我們的模範禱告中，有些東西是我們應該注意的。</p><p>在這篇禱告中，總共有六項祈求。只有一項是與我們今生的舒適有關。其他五項都與屬靈事物有關。在主禱文中，耶穌教導我們要為永存的屬靈事物禱告，而不是為暫時的物質的事情禱告。</p><p>第一項祈求就是要上帝的名被尊為聖。我們知道，這是一個上帝會回應的禱告，因為我們知道上帝要的名被尊崇。請讀瑪拉基書1:11。</p><blockquote><p><strong>瑪拉基書1:11</strong><br>萬軍之耶和華說：「從日出之地到日落之處，我的名在外邦中必尊為大。在各處，人必奉我的名燒香，獻潔淨的供物。因為我的名在外邦中必尊為大。</p></blockquote><p>別忘了第三誡命「不可妄稱耶和華你神的名」。那個問答說，上帝的名包括祂的「名字、稱號、屬性、法則、聖道與工作」。上帝的名代表所有這些。尊上帝的名為聖，就是要以敬畏之心對待這些事，在所有這些方面尊崇上帝。</p>"},{"day":2,"html":"<p>當我們禱告說「願人都尊你的名為聖」時，我們是在懇求上帝得著祂當得的尊榮和榮耀。我們祈求上帝，叫我們和他人能夠榮耀祂。我們祈求健康或者我們肉身需要的其他東西，並沒有錯。不過，我們禱告時間中更多的部分，應該用在祈求上帝幫助我們榮耀祂。當我們為別人禱告的時候，我們也應把大部分時間，用在祈求那些能夠幫助他為上帝的榮耀而活的事上。</p><p>上帝羞辱神的一種方式就是犯罪。如果我們說我們是上帝的百姓，然後卻犯罪，我們就是羞辱了神的名。請讀羅馬書2:23-24。</p><blockquote><p><strong>羅馬書2:23-24</strong><br>你指著律法誇口，自己倒犯律法玷辱神嗎？<br>神的名在外邦人中，因你們受了褻瀆，正如經上所記的。</p></blockquote><p>當我們向祂認罪、轉離罪，我們就是在尊上帝的名為聖。如果我們每天檢查自己有什麼需要認的罪，我們應該祈求上帝，為我們和我們所愛的人，在犯罪得罪上帝時有痛悔的心。</p>"},{"day":3,"html":"<p>當我們行在祂的真理中，我們就是在尊上帝的名為聖。請讀詩篇86:11。</p><blockquote><p><strong>詩篇86:11</strong><br>耶和華啊，求你將你的道指教我，我要照你的真理行；求你使我專心敬畏你的名。</p></blockquote><p>當我們行在上帝的真理中，我們就會有規律地研讀聖經。我們在上帝的聖道中所讀到的，我們都相信並喜愛，然後我們認真地順服它。如果我們自己不在日常生活中尊重上帝的名，那麼說我們想要尊上帝的名為聖，就是十分荒唐的。上帝的兒女渴望看到上帝得到祂當得的尊榮。他們閱讀聖經，學習如何為祂的榮耀而活。然後他們會祈求幫助他們，行出聖經中的教導，好叫祂的名被尊崇。</p>"},{"day":4,"html":"<p>當我們讚美敬拜上帝的時候，我們就是尊祂的名為聖，就是榮耀祂。有可能我們以為我們在敬拜上帝、在讚美祂的名，而實際上我們並沒有。如果我們沒有真正認識祂的屬性，就來敬拜祂，就會出現這種狀況。很有可能，我們以為自己知道上帝是怎樣的，然後向我們想象的神禱告，而神根本就不是那樣的。上帝已經在聖經中向我們顯明，祂是怎樣的神。如果我們對於上帝的觀念與聖經所說的不一樣，那麼就是我們對於上帝的觀念錯了。如果我們敬拜想象中的神，我們就不是在敬拜真神。當我們在祂的聖道中所描述的讚美，併為此來讚美祂的時候，我們就是在敬拜中尊祂的名為聖。請讀詩篇96:1-8。</p><blockquote><p><strong>詩篇96:1-8</strong><br>你們要向耶和華唱新歌，全地都要向耶和華歌唱！<br>要向耶和華歌唱，稱頌他的名，天天傳揚他的救恩。<br>在列邦中述說他的榮耀，在萬民中述說他的奇事。<br>因耶和華為大，當受極大的讚美；他在萬神之上，當受敬畏。<br>外邦的神都屬虛無，惟獨耶和華創造諸天。<br>有尊榮和威嚴在他面前，有能力與華美在他聖所。<br>民中的萬族啊，你們要將榮耀能力歸給耶和華，都歸給耶和華！<br>要將耶和華的名所當得的榮耀歸給他，拿供物來進入他的院宇。</p></blockquote>"},{"day":5,"html":"<p>當我們禱告「願人都尊你的名為聖」時，我們在祈求上帝幫助我們渴慕祂的榮耀勝過其它一切。一個真正屬上帝的兒女，應該在凡事上榮耀上帝。因為我們還是罪人，往往我們有罪的慾望還會妨礙我們。往往我們更關心自己，勝過關心上帝的榮耀。藉著禱告「願人都尊你的名為聖」，我們祈求上帝改變我們的心，使榮耀祂成為我們最重要的事。當使徒保羅寫信給腓立比的基督徒，他因為傳講耶穌，正在坐牢。他知道自己可能要被處死。祂寫信給腓立比人說，他或活或死都知足。不管藉著生，或是藉著死，他真正想要的就是要尊崇上帝。請讀腓立比書1:20。</p><blockquote><p><strong>腓立比書1:20</strong><br>照著我所切慕、所盼望的，沒有一事叫我羞愧。只要凡事放膽，無論是生是死，總叫基督在我身上照常顯大。</p></blockquote>"},{"day":6,"html":"<p>當我們禱告「願人都尊你的名為聖」時，我們求神「賜力量給我們和他人，使我們在祂用以顯明自己的一切事上，榮耀祂」。當我們如此禱告，我們也是在祈求上帝「行作萬事，彰顯祂自己的榮耀」。我們常常看到周圍發生的一些事情，讓我們以為上帝的敵人正在得勝。似乎違背上帝旨意的事情正在連連發生。要記得，上帝曾在祂的聖道中應許，祂會行作萬事，叫祂自己得著讚美和榮耀，這樣我們才能得安慰。當我們禱告求祂如此行，我們知道我們是在為祂樂意做的事禱告。請讀以弗所書1:11。</p><blockquote><p><strong>以弗所書1:11</strong><br>我們也在他裡面得了基業，這原是那位隨己意行做萬事的，照著他旨意所預定的。</p></blockquote>"}]},{"num":102,"title":"我們在「主禱文」的第二項祈求中，禱告什麼？","answer":"在第二項祈求「願你的國降臨」中，我們禱告：撒但的國度消滅，恩典的國度擴張，使我們眾人得以進入、並蒙保守在其中；祂榮耀的國度快快來臨。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>聖經教導我們，所有的人按照本性，都是撒但國度裡的一員，因為所有人都是有罪的。上帝造人，為要把他當作主和王來侍奉。當第一個人選擇順服撒但而不順服上帝的時候，全人類就落入了撒但的權柄。撒但不是上帝百姓合法的君王。牠也不是上帝的世界合法的君王。主耶穌來，為要消滅撒但的作為。請讀約翰一書3:8。</p><blockquote><p><strong>約翰一書3:8</strong><br>犯罪的是屬魔鬼，因為魔鬼從起初就犯罪。神的兒子顯現出來，為要除滅魔鬼的作為。</p></blockquote><p>在主禱文的第二項祈求中，我們禱告上帝，消滅現在就在祂百姓的心中來消滅它，並且在末日徹底永遠地消滅它。我們祈求上帝，現在在我們的心裡，將來在整個宇宙，以基督的國度代替撒但的國度。</p>"},{"day":2,"html":"<p>主耶穌是萬王之王。沒有一個國王像祂那樣偉大，將來也不會有。當耶穌第一次來到世界，祂建立了恩典的國度。這是在祂百姓心裡的國度。祂改變百姓的心，叫他們不再悖祂，叫他們選擇祂作他們的君王。祂賜下祂的靈，住在他們裡面，叫他們有能力順服祂。耶穌那個時代的猶太人知道，上帝曾經應許要賜下君王，建立一個國度。他們盼望著一位地上的君王，就像大衛或所羅門那樣。耶穌的恩典國度，不是一個人可以去的地方。那不是眼睛可以看得見的。現在，耶穌在百姓心中，也藉著百姓來治理。請讀路加福音17:20-21。</p><blockquote><p><strong>路加福音17:20-21</strong><br>法利賽人問：「神的國幾時來到？」耶穌回答說：「神的國來到不是眼所能見的。<br>人也不得說：『看哪，在這裡！看哪，在那裡！』因為神的國就在你們心裡。」</p></blockquote><p>當我們祈求上帝的國度降臨時，其中一部分就是禱告耶穌恩典的國度擴張、增長。</p>"},{"day":3,"html":"<p>當我們禱告「願你的國降臨」，我們是在祈求上帝的恩典國度擴張。這是耶穌第一次來到世界時建立的國度。藉著國度擴張的禱告，我們祈求更多人進入這個國度。上帝認識祂所揀選的人。祂將拯救他們中的每一位，脫離撒但的權下，帶領他們都進入到祂的國度。上帝已經選擇使用祂百姓的禱告作為祂拯救人歸自己旨意的一種方式。祂命令我們為著他人的救恩禱告。上帝使用聖道的傳揚以及祂百姓的禱告來使祂的國度擴張。祂使百姓從罪和撒但的國度中轉回，來順服上帝並且進入祂兒子的國度。請讀使徒行傳26:17-18。</p><blockquote><p><strong>使徒行傳26:17-18</strong><br>我也要救你脫離百姓和外邦人的手。<br>我差你到他們那裡去，要叫他們的眼睛得開，從黑暗中歸向光明，從撒但權下歸向神；又因信我，得蒙赦罪，和一切成聖的人同得基業。『</p></blockquote>"},{"day":4,"html":"<p>當人數加添到上帝的國度，這國度越來越大的時候，就是上帝的國在擴張。當上帝保守自己的百姓在祂的國度中，叫他們在聖潔中長進的時候，也是國度在擴張。當我們越來越像耶穌的時候，上帝的國度就在我們每個人的心中擴張了。當上帝百姓中許多人都在聖潔中長進，那麼祂整個的教會就在聖潔中增長了。當我們祈求「願你的國降臨」時，其中一部分就是為此禱告。請讀帖撒羅尼迦前書5:23-24。</p><blockquote><p><strong>帖撒羅尼迦前書5:23-24</strong><br>願賜平安的神親自使你們全然成聖。又願你們的靈與魂與身子得蒙保守，在我主耶穌基督降臨的時候，完全無可指摘。<br>那召你們的本是信實的，他必成就這事。</p></blockquote>"},{"day":5,"html":"<p>耶穌現在在祂百姓的心中掌權，但是祂的權柄並沒有完全被順服。那是因為，我們的心仍然是有罪的。罪在基督徒的裡面與上帝為敵，妨礙他們完全順服祂。撒但是在基督徒外面的另一個仇敵，總是要試探他們來跟隨牠，而不是跟隨上帝。上帝已經應許，當祂的時候到了，耶穌將再來。這一次，祂將建立榮耀的國度。這個國度將是完美的，因為祂將毀滅一切仇敵。撒但將被扔到火湖裡，牠將與上帝所有的仇敵一道永遠留在其中。到那時候，不再有任何事物任何人能夠抵擋上帝。祂的國度將是完美的、榮耀的。當我們禱告「願你的國度降臨」時，我們是在祈求耶穌早日再來，消滅祂的仇敵，毫無阻擋地統管萬有。請讀詩篇68:1-3。</p><blockquote><p><strong>詩篇68:1-3</strong><br>願神興起，使他的仇敵四散，叫那恨他的人，從他面前逃跑。<br>他們被驅逐，如煙被風吹散；惡人見神之面而消滅，如蠟被火熔化。<br>惟有義人必然歡喜，在神面前高興快樂。</p></blockquote>"},{"day":6,"html":"<p>這個世界現在完全不如罪惡進入之前那麼美好。但是，上帝仍舊賜下許多美善的事物叫我們享受。有時候，我們在這個世界可能會變得非常自在。不過，上帝的百姓看到罪惡帶來的痛苦和患難。他們看到上帝本來造得美善的事物，現在變得醜惡了。他們看到上帝的仇敵抵擋祂，有時候似乎那仇敵就要得勝。最讓上帝百姓憂愁的是，看到自己心裡的罪。他們知道，上帝為他們做了那麼多。他們知道他們是多麼虧欠上帝。他們知道自己應該徹底地愛祂，可是他們沒有。相反，他們每天得罪上帝。這件事本身，最讓上帝的百姓厭倦這個世界。就是這個，叫他們渴望並祈求上帝榮耀的國度快快來臨。</p><p>聖經最後一卷書記載了上帝的仇敵對祂的仇恨。它描述了他們如何頑固地抵擋祂。然後它描述了他們的仇敵。最後啟示錄講述了上帝完美的榮耀國度，不再有任何罪惡、悲傷和死亡。上帝的百姓渴望這個國度降臨。在主禱文中，耶穌教導我們祈求它快快降臨。請讀啟示錄22:12-15,20。</p><blockquote><p><strong>啟示錄22:12-15</strong><br>「看哪，我必快來！賞罰在我，要照各人所行的報應他。<br>我是阿拉法，我是俄梅戛；我是首先的，我是末後的；我是初，我是終。<br>那些洗淨自己衣服的有福了！可得權柄能到生命樹那裡，也能從門進城。<br>城外有那些犬類、行邪術的、淫亂的、殺人的、拜偶像的，並一切喜好說謊言編造虛謊的。</p><p><strong>啟示錄22:20</strong><br>證明這事的說：「是了，我必快來！」阿們！主耶穌啊，我願你來！</p></blockquote>"}]},{"num":103,"title":"我們在「主禱文」的第三項祈求中，禱告什麼？","answer":"在第三項祈求「願你的旨意行在地上，如同行在天上」中，我們禱告：求神賜恩，是我們能夠、且樂意在凡事上認識、遵從、順服祂的旨意，如同使者在天上所行的一樣。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>當我們祈求神的旨意成全，我們的意思可能有兩種。我們可能在祈求祂幫助我們遵行祂的旨意，如同祂在聖經裡所吩咐我們的。真正的基督徒都有強烈的願望要得神喜悅。他想要遵行上帝所吩咐的。他知道，靠自己無法遵行祂的旨意，所以他祈求幫助。如果一個人說自己是基督徒，卻不用心瞭解和遵行神的旨意，那麼他就沒有權利說自己是基督徒。真正屬神的人，都會渴慕順服祂。請讀馬太福音7:21。</p><blockquote><p><strong>馬太福音7:21</strong><br>凡稱呼我「主啊，主啊」的人，不能都進天國；惟獨遵行我天父旨意的人，才能進去。</p></blockquote>"},{"day":2,"html":"<p>我們可以祈求神的旨意的另一個方面，就是祈求祂為自己的目的，按祂的旨意來使萬事互相效力。我們稱之為神的護理。神在祂的護理之中，安排每個人生命中的所有細節，是為了祂百姓的益處，也是為了祂自己的榮耀。在這個意義上，我們祈求神的旨意時，我們是在祈求無論我們祈求與否，祂都會照樣做的事。我們藉著祈求祂行祂的旨意，我們與其說是在求什麼，不如說，我們是在告訴祂，我們接受祂認為最好的安排。我們承認祂是偉大、全智、全能的。我們告訴神，我們想要祂使用我們，祂知道什麼對我們最有益處，就做在我們身上。請讀彼得前書4:19。</p><blockquote><p><strong>彼得前書4:19</strong><br>所以，那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主。</p></blockquote>"},{"day":3,"html":"<p>因為罪的緣故，我們無法自己知道神的旨意，也不能明白祂的話。祂已經在聖經中告訴我們，祂對我們有什麼旨意。在聖經中，上帝賜給我們命令、應許和榜樣。如果我們靠自己，就不會正確理解祂的旨意。當我們祈求「願你的旨意行在地上，如同行在天上」，我們所求的其中一樣，就是在求神給我們悟性，能明白祂的旨意。我們祈求上帝在我們聆聽或研讀祂聖道的時候祝福我們，好叫我們從中學習，祂要我們知道的一切。我們祈求神，叫我們在對祂話語和旨意的知識方面有長進。因為，我們是向「我們在天上的父」禱告，所以在我們的禱告中，也包括了其他的人。我們祈求上帝向我們和別人啟示、顯明祂的旨意。請讀歌羅西書1:9。</p><blockquote><p><strong>歌羅西書1:9</strong><br>因此，我們自從聽見的日子，也就為你們不住地禱告祈求，願你們在一切屬靈的智慧悟性上，滿心知道神的旨意。</p></blockquote>"},{"day":4,"html":"<p>因為罪的緣故，我們靠自己無法瞭解和明白神的旨意。不僅如此，就算我們知道神的旨意，我們也不會樂意遵行的。這也是因為我們心裡的罪。我們心裡的罪叫我們想做我們自己想做的，而不是上帝想要我們做的。我們罪惡的內心，憑著它本身，只會看仇敵，想要悖逆神。當我們祈求「願神的旨意行在地上，如同行在天上」，我們在祈求神叫我們的心單單渴慕祂作我的君王。我們祈求神削弱我們內心的罪，堅固我們對祂的愛。這些都是神應許要為百姓做的。請讀以西結書36:26-27。</p><blockquote><p><strong>以西結書36:26-27</strong><br>我也要賜給你們一個新心，將新靈放在你們裡面。又從你們的肉體中除掉石心，賜給你們肉心。<br>我必將我的靈放在你們裡面，使你們順從我的律例，謹守遵行我的典章。</p></blockquote><p>神使用我們的禱告，叫我們的心願意遵行祂的旨意。在我們的禱告中，我們應該求神把樂意順服祂的心賜給我們和他人。</p>"},{"day":5,"html":"<p>當我們祈求上帝的旨意成全，我們是在求上帝使我們能夠知道、明白、樂意遵行祂在聖道中給我們的命令。我們也祈求上帝叫萬事互相效力，叫祂的百姓得益處，叫神得榮耀。當然，上帝無論如何都會行祂的旨意。當我們為此禱告，我們同意接受上帝給我們及祂的世界的旨意，無論那旨意是什麼。無論上帝為我們選擇什麼，我們都會信靠祂，不發怨言。</p><p>當上帝叫萬事效力，叫我們開心、健康的時候，我們會看到，我們所有的祝福都是來自神，我們就會向祂感恩。當上帝叫萬事效力，叫我們必須忍受悲傷、艱難的事情，我們也要看到這些事情出於神。我們不要發牢騷，而是應該信靠祂會做最合宜的事，我們要在困境中，也竭力忠心地順服祂，得祂的喜悅。請讀彼得前書3:16-17。</p><blockquote><p><strong>彼得前書3:16-17</strong><br>存著無虧的良心，叫你們在何事上被毀謗，就在何事上可以叫那誣賴你們在基督裡有好品行的人自覺羞愧。<br>神的旨意若是叫你們因行善受苦，總強如因行惡受苦。</p></blockquote>"},{"day":6,"html":"<p>在這項禱告中，我們祈求神的旨意成全。我們也表達了我們想要上帝的旨意如何成全。在天上，所有的天使總是遵行上帝的旨意。在天上，天使立即遵行神的旨意。他們不會質疑神的旨意，也不要等自己「感覺良好」的時候才去順服。他們立即順服。我們的禱告應該是，我們和他人無論在何地都順服神，就馬上順服。天上的使者從不會像我們有時候的樣子，順服神順服夠了。藉著祈求「神的旨意行在地上，如同行在天上」，我們是在祈求我們和他人能夠被堅固，持續遵行神的旨意。請讀詩篇103:20-21。</p><blockquote><p><strong>詩篇103:20-21</strong><br>聽從他命令、成全他旨意、有大能的天使，都要稱頌耶和華！<br>你們作他的諸軍，作他的僕役，行他所喜悅的，都要稱頌耶和華！</p></blockquote>"}]},{"num":104,"title":"我們在「主禱文」的第四項祈求中，禱告什麼？","answer":"在第四項祈求「我們日用的飲食，今日賜給我們」中，我們禱告：求神賜下祂白白的恩典，使我們豐富領受今生所需的美善事物，享受祂的恩福。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>當我們祈求日用的飲食，我們不只是在求飲食而已。「我們日用的飲食」指的是，我們存活所需的一切。包括我們的吃喝穿住。在主禱文所有的專案中，這是唯一一項為身體有所求。所有其它的禱告專案都是關於屬靈事物的。因為只有一項是關於我們的身體，那麼我們就明白了，我們的禱告應該更多的是關於屬靈的事情。不過，既然有這樣一項物質方面的祈求，我們也明白，上帝也很看重這些方面。上帝在祂的美善中，賜給我們身體所需用的。請讀詩篇145:15-16。</p><blockquote><p><strong>詩篇145:15-16</strong><br>萬民都舉目仰望你，你隨時給他們食物。<br>你張手，使有生氣的都隨願飽足。</p></blockquote>"},{"day":2,"html":"<p>乍一看，似乎向神求物質的東西有點兒自私。不過，實際上，祈求所需用的，這是對上帝的敬拜。當我們求神賜下日常生活所用的東西，我們就在承認，我們依靠他供應我們一切所需用的。我們用這種方式來表明，我們知道，我們離了神就不能存活，我們所擁有的一切都是來自神。祈求我們身體所需用的，就是顯明，我們知道祂是創造的主，是祂創造並照顧萬有。謙卑地為我們的需用來祈求上帝，是一種敬拜的形式。請讀詩篇65:9-13。</p><blockquote><p><strong>詩篇65:9-13</strong><br>你眷顧地，降下透雨，使地大得肥美。神的河滿了水；你這樣澆灌了地，好為人預備五穀。<br>你澆透地的犁溝，潤平犁脊，降甘霖使地軟和；其中髮長的，蒙你賜福。<br>你以恩典為年歲的冠冕，你的路徑都滴下脂油。<br>滴在曠野的草場上。小山以歡樂束腰，<br>草場以羊群為衣，谷中也長滿了五穀。這一切都歡呼歌唱！</p></blockquote>"},{"day":3,"html":"<p>當我們祈求神賜給我們日用的飲食，我們只要祈求我們所需要的。在我們中國這裡，大多數人已經擁有比日用飲食多得多的東西了！我們的櫥櫃和冰箱裡有至少能吃一個禮拜的食物。做父母的，每週工作的收入也可維持一週以上。這個禱告，是每次為一天的飲食禱告。基督徒對於物質的態度應該是，只要那些我們需要的，並且信靠神來決定，什麼是我們真正需要的。他曾應許把祂百姓所需的供給給他們。有時候，我們以為我們需要什麼東西，就向神求，不過我們發現還是沒得到。這樣的事發生時，我們就要相信，如果這個東西真是對我們最好的，祂就會給我們的。請讀箴言30:7-9。</p><blockquote><p><strong>箴言30:7-9</strong><br>我求你兩件事，在我未死之先，不要不賜給我：<br>求你使虛假和謊言遠離我；使我也不貧窮也不富足，賜給我需用的飲食。<br>恐怕我飽足不認你，說：「耶和華是誰呢？」又恐怕我貧窮就偷竊，以致褻瀆我神的名。</p></blockquote>"},{"day":4,"html":"<p>上帝是良善的。祂有豐富的賜福。聖經告訴我們，上帝叫日頭照好人也照歹人，降雨給義人，也給不義的人。上帝如此良善，祂白白地把生存所需的一切供應給動物、魚鳥和人類。祂甚至把食物和財物賜給那些從來沒有求過祂的人。那麼我們為什麼還要在禱告中把這些東西也包括進來呢？一方面，就是儘管上帝慷慨地把好多東西賜給很多人，但是祂只應許供應那些真正依靠祂的人所有的需要。請讀詩篇34:9-10。</p><blockquote><p><strong>詩篇34:9-10</strong><br>耶和華的聖民哪，你們當敬畏他，因敬畏他的一無所缺。<br>少壯獅子還缺食忍餓；但尋求耶和華的，什麼好處都不缺。</p></blockquote><p>我們禱告神賜我們所需，另一個原因是，祈求本身就表明，我們知道上帝是供應受造物的那一位，併為此敬畏祂。</p>"},{"day":5,"html":"<p>我們為日用的飲食禱告，因為這樣，日用的飲食成為我們的祝福。我們需要的不僅僅是日用的飲食以及其它身體所需要的；當我們在用這些東西的時候，我們也需要上帝的祝福。當我們吃東西的時候，我們需要記得這是上帝的恩賜。我們想要以感恩的心來吃喝。當我們享受健康的時候，我們想要為此感恩，用好身體來服侍祂。當我們祈求神賜給我們身體所需，我們是在祈求祂同時也賜下屬靈的祝福。請讀申命記28:1-8。</p><blockquote><p><strong>申命記28:1-8</strong><br>你若留意聽從耶和華神的話，謹守遵行他的一切誡命，就是我今日所吩咐你的，他必使你超乎天下萬民之上。<br>你若聽從耶和華神的話，這以下的福必追隨你，臨到你身上：<br>你在城裡必蒙福，在田間也必蒙福；<br>你身所生的、地所產的，並牲畜所下的，以及牛犢、羊羔都必蒙福；<br>你的筐子和你的摶面盆都必蒙福；<br>你出也蒙福，入也蒙福。<br>仇敵起來攻擊你，耶和華必使他們在你面前被殺敗，他們從一條路來攻擊你，從七條路逃跑。<br>在你倉房裡，並你手所辦的一切事上，耶和華所命的福必臨到你。耶和華你神也要在所給你的地上賜福與你。</p></blockquote>"},{"day":6,"html":"<p>我們所擁有的都是上帝所賜的。在中國這裡，我們大多數人都是太富有了，有時候都忘記了，這一切都是來源於上帝。大多數人都不止擁有日用的飲食。我們現在有的，夠我們吃用好多個禮拜，況且還不斷有新的東西。於是我們忘記了，如果上帝不給我們，我們就會一無所有。飯前感恩，就是一種好的方式，能提醒我們，我們所擁有的一切都是來自神。在教會敬拜中，在奉獻之前，我們唱「讚美真神，萬福之根」，也是同樣的意義。記得為物質的東西來感謝神，這就提醒我們，是祂賜給我們一切。請讀馬太福音15:35-37。</p><blockquote><p><strong>馬太福音15:35-37</strong><br>他就吩咐眾人坐在地上，<br>拿著這七個餅和幾條魚，祝謝了，擘開，遞給門徒，門徒又遞給眾人。<br>眾人都吃，並且吃飽了，收拾剩下的零碎，裝滿了七個筐子。</p></blockquote>"}]},{"num":105,"title":"我們在「主禱文」的第五項祈求中，禱告什麼？","answer":"在第五項祈求「免我們的債，如同我們免了人的債」中，我們禱告：求神因基督的緣故，白白赦免我們一切的罪。我們大受激勵而如此祈求，因為我們蒙了神的恩典，才能從心裡饒恕人。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>債就是我們所虧欠別人的。如果一樣東西賣給我了，我同意付錢卻沒付，這就是欠債了。上帝是我們的創造者，所以我們在順服方面欠祂。我們沒有照著本分來順服祂。相反，我們犯罪得罪祂。我們在上帝的公義面前有虧欠。我們能夠還債的唯一方式就是因為違背上帝的律法永遠承受痛苦的刑罰。</p><p>上帝滿有恩典地為祂的百姓提供了還債的方式。祂賜下祂的獨生子耶穌來為他們的違法行為承擔刑罰。祂賜下的獨生子，代替祂的百姓活出完全順服的生命。基督的死，已經償還了祂百姓所欠的一切債。基督徒可以靠著耶穌的義來到上帝面前。當我們祈求上帝免我們的債，我們不是求祂忽略我們的罪，而是求在祈求祂，因為基督已經為我們償還，因而赦免我們的債。請讀哥林多後書5:21。</p><blockquote><p><strong>哥林多後書5:21</strong><br>神使那無罪的，替我們成為罪，好叫我們在他裡面成為神的義。</p></blockquote>"},{"day":2,"html":"<p class=\"read-prompt\">請讀詩篇51:1。</p><blockquote><p><strong>詩篇51:1</strong><br>神啊，求你按你的慈愛憐恤我，按你豐盛的慈悲塗抹我的過犯！</p></blockquote><p>當我們祈求上帝赦免我們的罪，我們不是因為配得，所以來祈求。我們做什麼善事也無法彌補我們所犯的罪。我們祈求上帝赦免我們，因為我們知道上帝是有恩典、饒恕人的。既然上帝對於不配的罪人顯出憐憫，我們就可以祈求祂來向我們施憐憫、赦免我們的債。任何人都可以禱告求赦免。但是，求赦免的禱告中，能夠得到上帝回應的，必須是那些相信耶穌以及祂十架救恩的人。</p>"},{"day":3,"html":"<p>我們的罪當受刑罰。主耶穌基督替我們受苦。我們犯罪應得的神的憤怒和審判，祂親身擔當了。請讀以賽亞書53:4-6。</p><blockquote><p><strong>以賽亞書53:4-6</strong><br>他誠然擔當我們的憂患，揹負我們的痛苦；我們卻以為他受責罰，被神擊打苦待了。<br>哪知他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。<br>我們都如羊走迷，各人偏行己路。耶和華使我們眾人的罪孽都歸在他身上。</p></blockquote><p>當我們禱告「免我們的債」時，我們在祈求上帝，把耶穌的死和受苦算作是對我們罪惡的刑罰。我們祈求上帝不再定我們的罪，因為耶穌已經為我們的罪付上代價。</p>"},{"day":4,"html":"<p>當我們成為基督徒的時候，聖靈來住在我們裡面。祂賜給我們力量對罪說不。祂賜給我們力量順服上帝。不過，我們的心仍是有罪的，它繼續叫我們犯罪，直到我們離世或者耶穌再來。儘管聖靈住在我們裡面，我們也還是會犯罪的。我們仍是每天犯罪。每天晚上我們應該祈求上帝向我們顯明我們這一天所犯的罪。我們應該祈求上帝赦免我們每天的債、每天的罪。請讀何西阿書14:2。</p><blockquote><p><strong>何西阿書14:2</strong><br>當歸向耶和華，用言語禱告他說：「求你除淨罪孽，悅納善行；這樣，我們就把嘴唇的祭代替牛犢獻上。</p></blockquote>"},{"day":5,"html":"<p>因為聖靈內住在基督徒裡面，所以基督徒得罪神的時候就不可能有平安喜樂。上帝恨惡罪惡。我們一成為祂的兒女，罪也叫我們憂愁。當我們犯罪的時候，我們知道我們做了天父不喜悅的事了。當我們祈求上帝赦免我們的罪，我們在祈求祂，使我們恢復未犯罪時的平安和喜樂。我們祈求祂，叫我們確信祂已經赦免我們，不再因我們的罪而審判我們。請讀詩篇51:8-12。</p><blockquote><p><strong>詩篇51:8-12</strong><br>求你使我得聽歡喜快樂的聲音，使你所壓傷的骨頭可以踴躍。<br>求你掩面不看我的罪，塗抹我一切的罪孽。<br>神啊，求你為我造清潔的心，使我裡面重新有正直的靈。<br>不要丟棄我，使我離開你的面；不要從我收回你的聖靈。<br>求你使我仍得救恩之樂，賜我樂意的靈扶持我；</p></blockquote>"},{"day":6,"html":"<p>人們最難做到的事之一，就是饒恕曾經以某種方式傷害或冤枉過自己的人。上帝要求我們要饒恕此饒恕。祂賜下聖靈給祂的兒女。聖靈使我們能夠饒恕別人。罪人能夠彼此饒恕，真是一件奇妙的事！藉著神的恩典，我們就可以做到。的確，當我們奉那為我們償付罪債的耶穌之名來到上帝面前，那從不犯罪、永遠聖潔的上帝就赦免我們。因為上帝的恩典使我們能夠彼此饒恕，我們就可以大得激勵，確信祂會白白赦免我們。請讀馬太福音6:14-15。</p><blockquote><p><strong>馬太福音6:14-15</strong><br>你們饒恕人的過犯，你們的天父也必饒恕你們的過犯；<br>你們不饒恕人的過犯，你們的天父也必不饒恕你們的過犯。</p></blockquote>"}]},{"num":106,"title":"我們在「主禱文」的第六項祈求中，禱告什麼？","answer":"在第六項祈求「不叫我們遇見試探，救我們脫離兇惡」中，我們禱告：求神保守我們不受試探而犯罪，或在我們受試探時，扶助並拯救我們。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>當我們成為基督徒的時候，聖靈來住在我們裡面。祂改變我們的心，叫我們願意行善。祂賜給我們力量，叫我們不願意去做我們明知是錯的事。但是，在我們離世之前，我們的心仍然是有罪的。我們仍然想要犯罪。對於基督徒來說，彷彿裡面正在發生一場戰爭。確實是這樣的！在取悅神的新性情和犯罪取悅自己的舊性情之間，確實有爭戰。請讀加拉太書5:17。</p><blockquote><p><strong>加拉太書5:17</strong><br>因為情慾和聖靈相爭，聖靈和情慾相爭，這兩個是彼此相敵，使你們不能做所願意的。</p></blockquote><p>我們必須十分謹慎、警醒，因為我們如此容易落入罪惡。聖經告訴我們，魔鬼總是尋找機會叫我們犯罪（彼得前書5:8 務要謹守、警醒，因為你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。）。聖經也告訴我們，我們自己的心非常敗壞，會誘騙我們犯罪，欺哄自己說那根本不是罪。（耶利米書17:9 人心比萬物都詭詐，壞到極處，誰能識透呢？）。不過，單單謹慎是不夠的。如果上帝不保護我們遠離罪惡，我們的努力都將徒勞無益。因此，基督教導我們禱告說「不叫我們遇見試探，救我們脫離兇惡」。</p>"},{"day":2,"html":"<p>當然，上帝從來不會試探人犯罪。祂確實為我們選擇了生活中的所有環境。祂掌管著發生的萬事。當我們禱告「不叫我們遇見試探」，我們承認上帝掌管萬事，我們倚靠祂。我們祈求祂安排萬事，叫我們不受到試探。我們知道，除非上帝許可，否則連魔鬼也都做不成什麼，因此我們禱告神，阻止撒但試探我們。請讀約翰福音17:15。</p><blockquote><p><strong>約翰福音17:15</strong><br>我不求你叫他們離開世界，只求你保守他們脫離那惡者。</p></blockquote><p>我們知道，我們多麼容易犯罪，因此我們祈求上帝，不要叫我們落入受試探、容易屈服犯罪的環境。請讀詩篇19:13。</p><blockquote><p><strong>詩篇19:13</strong><br>求你攔阻僕人不犯任意妄為的罪，不容這罪轄制我，我便完全，免犯大罪。</p></blockquote>"},{"day":3,"html":"<p>有時候，上帝知道，我們面對犯罪的試探，對我們來說是有益處的。他知道，這是我們信心增長、學習更好地信靠順服祂的一種方式。因此，有時候祂會把我們放在一個環境中，允許撒但試探我們，使我們非常容易犯罪。祂曾應許，祂所許可的試探，無非是我們能受得住的。請讀哥林多前書10:13。</p><blockquote><p><strong>哥林多前書10:13</strong><br>你們所遇見的試探，無非是人所能受的。神是信實的，必不叫你們受試探過於所能受的。在受試探的時候，總要給你們開一條出路，叫你們能忍受得住。</p></blockquote><p>上帝曾經應許，當我們受試探，當撒但被允許來攪擾我們，上帝會賜給我們恩典。祂會賜給我們抵擋試探和持續順服祂所需的一切。請讀哥林多後書12:7-9。</p><blockquote><p><strong>哥林多後書12:7-9</strong><br>又恐怕我因所得的啟示太大，就過於自高，所以有一根刺加在我肉體上，就是撒但的差役要攻擊我，免得我過於自高。<br>為這事，我三次求主，叫這刺離開我。<br>他對我說：「我的恩典夠你用，因為我的能力是在人的軟弱上顯得完全。」所以，我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。</p></blockquote><p>當我們禱告「救我們脫離兇惡」時，我們在禱告神賜給我們力量，在受試探的時候能夠抵擋得住，不向罪屈服。</p>"},{"day":4,"html":"<p>當我們祈求上帝不叫我們遇見試探，或者在受試探的時候能夠救我們脫離兇惡，我們必須要真誠。如果我們是真心的，我們就會殷勤保守自己不受試探或者不向罪屈服。我們應該認真省察我們的內心。我們應該知道，哪些事情對於我們尤其容易勝過，哪些罪惡更容易試探我們。那麼我們就必須小心地避避這些東西。想要試試我們怎麼能最靠近罪而不犯罪，那是非常愚蠢的事情。當我們認真禱告神，不叫我們遇見試探，我們不應該故意走入試探中！如果我們知道，自己在某個罪上特別軟弱，我們就應該遠離那些容易促使我們犯那個罪的活動或人群。使徒保羅告訴他年輕的朋友提摩太說要逃離、遠避那些讓他想犯罪的事情。相反，保羅告訴他要在生命中努力建造那些得上帝喜悅的事。請讀提摩太後書2:22。</p><blockquote><p><strong>提摩太後書2:22</strong><br>你要逃避少年的私慾，同那清心禱告主的人追求公義、信德、仁愛、和平。</p></blockquote>"},{"day":5,"html":"<p>正如我們前面讀到的，撒但熱切尋找機會叫我們犯罪。因為我們的內心有罪，我們很容易與撒但配合。我們必須提防這種事。撒但最喜歡在神的百姓身上使用的試探之一，就是試探他們彼此恨惡，彼此懷恨。撒但知道，上帝想要祂的兒女彼此相愛。祂知這個世界都在觀望，看看基督徒是否言行一致。如果基督徒都合不來，那麼祂就不能對神的國度擴充套件有什麼大的貢獻。由於這些原因，撒但竭力地叫基督徒彼此之間互相不喜歡，彼此吵來吵去。</p><p>會有人得罪我們的。他們會傷害我們。我們是在幫撒但的忙。如果我們認真地禱告神，救我們脫離兇惡，我們就必須不可在心裡給魔鬼留地步，叫牠有機會分裂神的百姓。我們必須要饒恕別人，不斷地愛別人，即使我們不想這麼做。請讀以弗所書4:26-27。</p><blockquote><p><strong>以弗所書4:26-27</strong><br>生氣卻不要犯罪，不可含怒到日落；<br>也不可給魔鬼留地步。</p></blockquote>"},{"day":6,"html":"<p>因為上帝的靈住在我們裡面，因為我們想要取悅我們的父神，所以我們應該重視這第六項的禱告請求。我們應該樂意竭力確保我們不要落入試探，或者落入試探時，我們不要犯罪。在我們沒有落入試探的時期，我們應該竭力預備自己來面對將來要的試探。</p><p>基督徒應當把自己看作正在練兵的戰士。當戰士即將面對艱難的戰鬥，只是貪吃貪睡肯定是愚蠢的。戰士得確保自己的武器和裝備都處於良好狀態。他們會竭力鍛鍊身體，使自己越強壯好。好戰士總是在練兵，在戰鬥中越來越老成。同樣，基督徒也應該每天殷勤，更加熟悉上帝的道。他們應該花時間禱告。基督徒應該鼓勵其他基督徒，同時也接受其他基督徒的鼓勵。他們應該實際遵行上帝所吩咐的那些事。然後，當猛烈的試探來臨，就不會叫他們措手不及。因為他們一直殷勤預備，所以就能剛強，更加有能力抵擋得住。請讀以弗所書6:13-18。</p><blockquote><p><strong>以弗所書6:13-18</strong><br>所以，要拿起神所賜的全副軍裝，好在磨難的日子抵擋仇敵，並且成就了一切，還能站立得住。<br>所以要站穩了，用真理當作帶子束腰，用公義當作護心鏡遮胸，<br>又用平安的福音當作預備走路的鞋穿在腳上，<br>此外，又拿著信德當作藤牌，可以滅盡那惡者一切的火箭。<br>並戴上救恩的頭盔，拿著聖靈的寶劍，就是神的道。<br>靠著聖靈，隨時多方禱告祈求，並要在此警醒不倦，為眾聖徒祈求。</p></blockquote>"}]},{"num":107,"title":"「主禱文」的結語，教導我們什麼？","answer":"主禱文的結語「因為國度、權柄、榮耀，全是你的，直到永遠，阿們！」教導我們：唯獨從神得著激勵來禱告，並且在禱告中讚美神，將國度、權柄、榮耀都歸於祂。最後，我們說「阿們」，是要見證我們的心願，並確信我們的禱告蒙垂聽。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-19","days":[{"day":1,"html":"<p>上帝的百姓應該受到激勵來禱告。他們可以確定，他們是受歡迎來到上帝面前來祈求他們所需的東西。上帝的兒女可以大膽地祈求，甚至是看起來不可能的事情。不過，上帝的百姓禱告時滿有信心，只有一個原因。基督徒受激勵來禱告的原因，不是因為他們一直表現不錯，得到上帝的喜悅了。上帝不是因為禱告的人配得，才聆聽和回應禱告。祂是因為自己的屬性，是聆聽和回應禱告，是因為他們知道上帝是怎樣的上帝。上帝想要祂的百姓能夠向祂禱告。藉著賜下祂的兒子，上帝已經為百姓在禱告裡來到祂面前開了道路。上帝的百姓奉祂兒子的名前來，他們可以確信他們是受歡迎的。請讀但以理書9:18。</p><blockquote><p><strong>但以理書9:18</strong><br>但以理書9:18 我的神啊，求你側耳而聽，睜眼而看，眷顧我們荒涼之地和稱為你名下的城。我們在你面前懇求，原不是因自己的義，乃因你的大憐憫。</p></blockquote>"},{"day":2,"html":"<p>主禱文最後的話提醒我們，上帝是誰。這些話提醒我們，我們能夠滿有信心地向祂禱告，是因為祂能夠並且願意回應我們的禱告。主禱文提醒我們，國度是屬於上帝的。祂是萬有的君王。祂掌管萬有，隨自己的旨意行作萬事。我們可以祈求祂的旨意成就，祈求我們罪得赦免。我們可以祈求日用的飲食，祈求上帝保守我們脫離罪惡。上帝可以賜給我們這些，是因為祂統管萬有。如果上帝禱告蒙應允的結果是最好的，那麼祂就可以叫每個細節都互相效力，叫我們的禱告蒙應允。主禱文也提醒我們，權柄屬於上帝。所有的權柄都是祂的。在祂想做的事上，祂無所不能，這樣我們可以確定，祂能夠做我們所祈求的事。請讀以弗所書3:20-21。</p><blockquote><p><strong>以弗所書3:20-21</strong><br>神能照著執行在我們心裡的大力，充充足足地成就一切，超過我們所求所想的。<br>但願他在教會中，並在基督耶穌裡，得著榮耀，直到世世代代，永永遠遠。阿們。</p></blockquote>"},{"day":3,"html":"<p>上帝不僅能夠回應我們的禱告，祂也願意為我們做最好的事。如果所有的權柄都屬於上帝，但是祂又不關心祂的百姓，那麼祂就不會回應他們的禱告。但是主禱文最後的話提醒我們，所有的榮耀都屬於上帝。祂在祂的良善上是榮耀的，祂樂意賜福給祂所愛的人。祂在祂的信實上是榮耀的，總是會做最有益於祂百姓的事。當我們在禱告中祈求上帝賜下我們所需用的，我們可以受到激勵，因為我們知道我們榮耀的上帝或是會做我們所求的，或者會做更好的事。我們知道祂願意祝福祂的百姓。請讀馬太福音7:7-11。</p><blockquote><p><strong>馬太福音7:7-11</strong><br>你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。<br>因為凡祈求的，就得著；尋找的，就尋見；叩門的，就給他開門。<br>你們中間誰有兒子求餅，反給他石頭呢？<br>求魚，反給他蛇呢？<br>你們雖然不好，尚且知道拿好東西給兒女，何況你們在天上的父，豈不更把好東西給求他的人嗎？</p></blockquote>"},{"day":4,"html":"<p>禱告不僅僅是向神要東西。在禱告中，我們也為祂已經賜下來的福分來感謝、讚美神。當我們基督徒缺乏什麼東西的時候，我們很容易記得禱告。可是當祂賜下祝福，我們卻不容易記得要為祂回應禱告而感恩。聖經告訴我們，我們在禱告時必須結合著對於上帝恩賜的感恩。請讀腓立比書4:6-7。</p><blockquote><p><strong>腓立比書4:6-7</strong><br>應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將你們所要的告訴神。<br>神所賜出人意外的平安，必在基督耶穌裡，保守你們的心懷意念。</p></blockquote>"},{"day":5,"html":"<p>主禱文最後的話教導我們，我們可以受激勵來禱告，因為國度、權柄和榮耀都屬於上帝。我們知道，祂能夠並且願意聆聽並回應我們的禱告。這些話也是讚美的話。提醒我們禱告時要記得感恩。當我們禱告的時候，我們應該為祂是萬主之主而讚美祂。我們應該讚美祂，因為祂無所不能，可以成就祂所喜悅的任何事。祂的榮耀如此之高，我們提醒我們的讚美，因為祂的榮耀如此之高，不僅僅是為了我們能得到什麼，而是來到祂面前讚美祂。請讀歷代志上29:10-13。</p><blockquote><p><strong>歷代志上29:10-13</strong><br>所以，大衛在會眾面前稱頌耶和華說：「耶和華我們的父，以色列的神，是應當稱頌，直到永永遠遠的！<br>耶和華啊，尊大、能力、榮耀、強勝、威嚴都是你的；凡天上地下的都是你的；國度也是你的；並且你為至高，為萬有之首。<br>豐富尊榮都從你而來。你也治理萬物。在你手裡有大能大力，使人尊大強盛都出於你。<br>我們的神啊，現在我們稱謝你，讚美你榮耀之名！</p></blockquote>"},{"day":6,"html":"<p>主禱文的最後，正如在所有禱告的末尾一樣，我們說「阿們」。「阿們」的意思是「誠心所願」或「但願如此」。藉著說「阿們」，我們是在表達，我們相信上帝會聆聽並回應我們的禱告。聖經講述了哈拿的故事，她特別想有個孩子。她之前一直不能懷孕。這讓她非常難過，常常哭泣，不思茶飯。每個認識她的人都看得出來她多麼難過。一天，她來到會幕那裡懇切禱告了很久，要求神賜她一個孩子。在會幕裡侍奉的祭司以利鼓勵她，要她相信上帝已經聽她。哈拿的回答顯明，她確信上帝會回應她的禱告。請讀撒母耳記上1:17-18。</p><blockquote><p><strong>撒母耳記上1:17-18</strong><br>以利說：「你可以平平安安地回去，願以色列的神允准你向他所求的！」<br>哈拿說：「願婢女在你眼前蒙恩。」於是婦人走去吃飯，面上再不帶愁容了。</p></blockquote>"}]}]}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  var QUESTIONS = DATA.questions;
  var CATEGORIES = DATA.categories;
  var ABOUT_HTML = DATA.about.html;
  var PART_LABEL = {0:'引言', 1:'第一部：我們當信什麼', 2:'第二部：我們所當做的是什麼'};

  var qByNum = {};
  QUESTIONS.forEach(function(q){ qByNum[q.num] = q; });
  var catById = {};
  CATEGORIES.forEach(function(c){ catById[c.id] = c; });

  var units = [];
  QUESTIONS.forEach(function(q){
    if (!q.hasDays) return;
    for (var d = 1; d <= 6; d++) units.push({num:q.num, day:d});
  });
  var unitIndexByKey = {};
  units.forEach(function(u,i){ unitIndexByKey[u.num+'-'+u.day] = i; });

  var LS_KEY = 'catechism_last_position_v1';
  function saveLastPosition(num, day){
    try { localStorage.setItem(LS_KEY, JSON.stringify({num:num, day:day})); } catch(e){}
  }

  var FONT_SIZE_KEY = 'catechism_font_size_v1';
  var FONT_SIZES = [
    {id:'small', label:'小'},
    {id:'medium', label:'中'},
    {id:'large', label:'大'},
    {id:'xlarge', label:'最大'}
  ];
  function loadFontSize(){
    try {
      var v = localStorage.getItem(FONT_SIZE_KEY);
      if (FONT_SIZES.some(function(f){ return f.id === v; })) return v;
    } catch(e){}
    return 'medium';
  }
  function applyFontSize(id){
    document.documentElement.setAttribute('data-font-size', id);
    try { localStorage.setItem(FONT_SIZE_KEY, id); } catch(e){}
  }
  applyFontSize(loadFontSize());
  function loadLastPosition(){
    try {
      var v = JSON.parse(localStorage.getItem(LS_KEY));
      if (v && qByNum[v.num]) return v;
    } catch(e){}
    return null;
  }

  function resolveDailyTarget(num, day){
    var q = qByNum[num];
    if (q && !q.hasDays && q.mergedInto) num = q.mergedInto;
    day = Math.min(6, Math.max(1, day||1));
    if (!(num+'-'+day in unitIndexByKey)) day = 1;
    return {num:num, day:day};
  }

  function parseHash(){
    var h = location.hash.replace(/^#/, '');
    if (h === ''){
      var last = loadLastPosition();
      if (last){
        var t = resolveDailyTarget(last.num, last.day);
        return {view:'daily', num:t.num, day:t.day};
      }
      return {view:'daily', num:1, day:1};
    }
    if (h === 'menu') return {view:'menu'};
    if (h === 'about') return {view:'about'};
    var m = h.match(/^category\/(.+)$/);
    if (m && catById[m[1]]) return {view:'category', categoryId:m[1]};
    m = h.match(/^q(\d+)(?:\/d(\d))?$/);
    if (m){
      var num = parseInt(m[1],10);
      if (qByNum[num]){
        var day = m[2] ? parseInt(m[2],10) : 1;
        var t2 = resolveDailyTarget(num, day);
        return {view:'daily', num:t2.num, day:t2.day};
      }
    }
    return {view:'daily', num:1, day:1};
  }

  function esc(s){
    return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
  }

  var views = ['daily','menu','category','about'];
  function showView(name){
    views.forEach(function(v){
      document.getElementById('view-'+v).hidden = (v !== name);
    });
  }

  var state = {view:'daily', num:1, day:1};

  function render(){
    state = parseHash();
    if (state.view === 'daily'){
      showView('daily');
      renderDaily(state.num, state.day);
      saveLastPosition(state.num, state.day);
    } else if (state.view === 'menu'){
      showView('menu');
      renderMenu();
    } else if (state.view === 'category'){
      showView('category');
      renderCategory(state.categoryId);
    } else if (state.view === 'about'){
      showView('about');
      renderAbout();
    }
    window.scrollTo(0,0);
  }

  function dayLabel(d){
    return ['','禮拜一','禮拜二','禮拜三','禮拜四','禮拜五','禮拜六'][d];
  }

  function renderDaily(num, day){
    var q = qByNum[num];
    document.getElementById('daily-progress').textContent = '第' + num + '問 · ' + dayLabel(day);
    document.title = '第' + num + '問 · ' + dayLabel(day) + ' - 更新心意學教理';

    var html = '';
    html += '<p class="q-num">第' + num + '問</p>';
    html += '<h1 class="q-title">' + esc(q.title) + '</h1>';
    html += '<div class="q-answer"><b>答：</b>' + esc(q.answer) + '</div>';

    if (q.mergedFrom){
      var mq = qByNum[q.mergedFrom];
      html += '<details class="merged-q"><summary>附：第' + mq.num + '問　' + esc(mq.title) + '</summary>' +
              '<p><b>答：</b>' + esc(mq.answer) + '</p></details>';
    }

    var dayObj = null;
    for (var i = 0; i < q.days.length; i++){ if (q.days[i].day === day){ dayObj = q.days[i]; break; } }
    html += '<p class="day-label">' + dayLabel(day) + '</p>';
    html += '<div class="day-content">' + (dayObj ? dayObj.html : '') + '</div>';

    document.getElementById('daily-card').innerHTML = html;

    var bar = document.getElementById('weekday-bar');
    var barHtml = '';
    for (var d = 1; d <= 6; d++){
      barHtml += '<button data-day="' + d + '" class="' + (d===day?'active':'') + '">' + dayLabel(d) + '</button>';
    }
    bar.innerHTML = barHtml;
    Array.prototype.forEach.call(bar.querySelectorAll('button'), function(btn){
      btn.addEventListener('click', function(){
        gotoDay(parseInt(btn.getAttribute('data-day'),10));
      });
    });
  }

  var lastStepAt = 0;
  var STEP_COOLDOWN_MS = 300;
  function stepUnit(delta){
    var now = Date.now();
    if (now - lastStepAt < STEP_COOLDOWN_MS) return; // 防止任何來源的重複觸發在短時間內疊加
    lastStepAt = now;
    var key = state.num + '-' + state.day;
    var idx = unitIndexByKey[key];
    if (idx === undefined) idx = 0;
    var len = units.length;
    idx = (idx + delta + len) % len;
    var target = units[idx];
    history.replaceState(null, '', '#q' + target.num + '/d' + target.day);
    render();
  }

  function gotoDay(day){
    history.replaceState(null, '', '#q' + state.num + '/d' + day);
    render();
  }

  document.addEventListener('keydown', function(e){
    if (state.view !== 'daily') return;
    if (e.key === 'ArrowLeft') stepUnit(-1);
    else if (e.key === 'ArrowRight') stepUnit(1);
  });
  // swipe-area 是靜態、不會重建的節點，手勢監聽只需綁定一次；
  // 若每次 renderDaily() 都重新 attachSwipe，會疊加重複的 touch 監聽器，
  // 造成滑一次卻觸發多次切換（越滑越多天）的 bug。
  attachSwipe(document.getElementById('swipe-area'));

  function attachSwipe(el){
    var tracking = false, axisLocked = null, startX = 0, startY = 0;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    el.addEventListener('touchstart', function(e){
      tracking = false; axisLocked = null;
      if (e.touches.length !== 1) return;
      tracking = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      el.style.transition = 'none';
    }, {passive:true});

    el.addEventListener('touchmove', function(e){
      if (!tracking) return;
      if (e.touches.length !== 1){ tracking = false; axisLocked = null; return; }
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if (axisLocked === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)){
        axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if (axisLocked === 'x'){
        e.preventDefault();
        if (!reduceMotion) el.style.transform = 'translateX(' + dx + 'px)';
      } else if (axisLocked === 'y'){
        tracking = false;
      }
    }, {passive:false});

    el.addEventListener('touchend', function(e){
      if (!tracking || axisLocked !== 'x'){ tracking = false; axisLocked = null; return; }
      var dx = (e.changedTouches[0].clientX - startX);
      el.style.transition = 'transform 180ms ease';
      el.style.transform = 'translateX(0)';
      var threshold = Math.min(60, window.innerWidth * 0.18);
      if (dx > threshold) stepUnit(-1);
      else if (dx < -threshold) stepUnit(1);
      tracking = false; axisLocked = null;
    }, {passive:true});

    el.addEventListener('touchcancel', function(){
      tracking = false; axisLocked = null;
      el.style.transition = 'transform 180ms ease';
      el.style.transform = 'translateX(0)';
    }, {passive:true});
  }

  function renderMenu(){
    var html = '';
    var current = loadFontSize();
    html += '<div class="settings-section">';
    html += '<div class="settings-label">字體大小</div>';
    html += '<div class="fontsize-row" id="fontsize-row">';
    FONT_SIZES.forEach(function(f){
      html += '<button data-size="' + f.id + '" class="' + (f.id===current?'active':'') + '">' + esc(f.label) + '</button>';
    });
    html += '</div></div>';

    var lastPart = -1;
    CATEGORIES.forEach(function(c){
      if (c.part !== lastPart){
        html += '<div class="part-header">' + esc(PART_LABEL[c.part]) + '</div>';
        lastPart = c.part;
      }
      html += '<a class="menu-item" href="#category/' + c.id + '">' + esc(c.label) +
              '<span class="cat-range">' + esc(c.range) + '</span></a>';
    });
    document.getElementById('menu-list').innerHTML = html;

    var row = document.getElementById('fontsize-row');
    Array.prototype.forEach.call(row.querySelectorAll('button'), function(btn){
      btn.addEventListener('click', function(){
        applyFontSize(btn.getAttribute('data-size'));
        Array.prototype.forEach.call(row.querySelectorAll('button'), function(b){
          b.classList.toggle('active', b === btn);
        });
      });
    });
  }

  function renderCategory(categoryId){
    var c = catById[categoryId];
    document.getElementById('category-progress').textContent = c.label;
    var html = '<div class="cat-title">' + esc(c.label) + '</div>';
    html += '<div class="cat-range-title">' + esc(c.range) + '</div>';
    c.questions.forEach(function(num){
      var q = qByNum[num];
      var target = q.mergedInto ? q.mergedInto : num;
      var note = q.mergedInto ? '<span class="merged-note">（附於第' + q.mergedInto + '問）</span>' : '';
      html += '<a class="q-item" href="#q' + target + '/d1">第' + num + '問：' + esc(q.title) + note + '</a>';
    });
    document.getElementById('category-list').innerHTML = html;
  }

  function renderAbout(){
    document.getElementById('about-body').innerHTML = ABOUT_HTML;
  }

  document.getElementById('menu-back').addEventListener('click', function(e){
    e.preventDefault();
    history.back();
  });
  document.getElementById('about-back').addEventListener('click', function(e){
    e.preventDefault();
    history.back();
  });

  var ONBOARDING_KEY = 'catechism_onboarding_seen_v1';
  var onboardingOverlay = document.getElementById('onboarding-overlay');
  function showOnboarding(){ onboardingOverlay.hidden = false; }
  function dismissOnboarding(){
    onboardingOverlay.hidden = true;
    try { localStorage.setItem(ONBOARDING_KEY, '1'); } catch(e){}
  }
  document.getElementById('btn-onboarding-dismiss').addEventListener('click', dismissOnboarding);
  document.getElementById('btn-show-onboarding').addEventListener('click', showOnboarding);
  var onboardingSeen = false;
  try { onboardingSeen = !!localStorage.getItem(ONBOARDING_KEY); } catch(e){}
  if (!onboardingSeen) showOnboarding();

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', render);
  if (document.readyState === 'complete' || document.readyState === 'interactive') render();
})();
</script>
