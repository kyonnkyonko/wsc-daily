就得了尊貴、榮耀為冠冕，叫他因著　神的恩，為人人嚐了死味。</p></blockquote>"},{"day":2,"html":"<p>先知完全按照上帝賜給他們的話語來領受，並且把它傳給上帝的百姓。這樣，上帝的百姓才能認識上帝是怎樣的上帝，上帝對他們有什麼旨意。摩西是最早的先知之一。上帝會見摩西，與他說話。然後摩西會告訴百姓上帝說了什麼。有一次，百姓自己聽到上帝的聲音。上帝一發聲，祂的榮耀所在的那座山，就震動、著火、冒煙。百姓發現，聽到聖潔可畏的那位說話是一件讓人恐懼的事情，所以他們懇求摩西去聽上帝說話，替他們跟上帝說話。在這時，上帝應許，有一天，祂會賜給他們一位先知，是跟他們一樣的人，會忠心啟示上帝所有的旨意。祂在說的是祂的兒子，祂將成為完全的先知。請讀申命記 18:15-19。</p><blockquote><p><strong>申命記18:15-19</strong><br>耶和華你的　神要從你弟兄中間給你興起一位先知像我，你們要聽從他。<br>正如你在何烈山大會的日子求耶和華你　神一切的話說：『求你不再叫我聽見耶和華我　神的聲音，也不再叫我看見這大火，免得我死亡。』<br>耶和華就對我說：『他們所說的是。<br>我必在他們弟兄中間，給他們興起一位先知像你。我要將當說的話傳給他；他要將我一切所吩咐的都傳給他們。<br>誰不聽他奉我名所說的話，我必討誰的罪。</p></blockquote>"},{"day":3,"html":"<p>在祂降卑的期間，也就是祂在世上的時候，耶穌是最好的先知。所有的先知大多數時間都是在說自己的話，只有上帝賜給他們話語的時候，才說出上帝的話。耶穌說的每一句話都是上帝的話，因為祂自己就是上帝。耶穌不僅教導上帝的旨意。祂藉著自己完美無罪的生命，向人們顯明上帝的旨意。現在耶穌在天上被升高。祂仍藉著聖經來向我們顯明上帝的旨意，聖經記載著祂的話語和生命。祂差遣聖靈到祂的百姓那裡，賜給他們悟性來明白祂的話語。請讀希伯來書 1:1-3。</p><blockquote><p><strong>希伯來書1:1-3</strong><br>神既在古時藉著眾先知多次多方地曉諭列祖，<br>就在這末世，藉著他兒子曉諭我們，又早已立他為承受萬有的，也曾藉著他創造諸世界。<br>他是　神榮耀所發的光輝，是神本體的真像，常用他權能的命令托住萬有。他洗淨了人的罪，就坐在高天至大者的右邊。</p></blockquote>"},{"day":4,"html":"<p>祭司的工作就是為上帝百姓的罪來獻祭。人們會認罪，帶來一隻動物，殺死它，獻給上帝。用這種方式，人們承認他們是罪該受死的。他們信靠上帝會預備一位替他們死的祭牲。祭牲不能除去罪惡，但是它們指向耶穌的死，那會永遠除去罪孽。上帝委任祭司殺死祭牲，獻上為祭。</p><p>耶穌來到世界，為了替祂的百姓受死。祂是完全的祭司。所有其他的祭司都是象徵著祂。耶穌把自己的身體和血獻上為祭。這獻祭如此有價值，它能永遠除去所有罪惡。耶穌就是在降卑的境界中，或者說受苦的生命中，如此作祭。現在祂已升高，耶穌仍是祂百姓的祭司。無論撒但何時控告上帝的兒女犯罪，耶穌就在那裡提醒，祂的死已經償還了上帝百姓所有的罪債。耶穌永遠活著，為祂所代死的人禱告。請讀希伯來書 7:24-27。</p><blockquote><p><strong>希伯來書7:24-27</strong><br>這位既是永遠常存的，他祭司的職任就長久不更換。<br>凡靠著他進到　神面前的人，他都能拯救到底，因為他是長遠活著，替他們祈求。<br>像這樣聖潔、無邪惡、無玷汙、遠離罪人、高過諸天的大祭司，原是與我們合宜的。<br>他不像那些大祭司，每日必須先為自己的罪，後為百姓的罪獻祭，因為他只一次將自己獻上，就把這事成全了。</p></blockquote>"},{"day":5,"html":"<p>因為耶穌是上帝，所以耶穌過去、現在都是最偉大的君王。耶穌在世降卑的時期，祂看起來不像是一位君王。祂生在貧窮的家庭中，一生就是個窮人。人們討厭祂，把祂當成罪犯殺了。但是聖經也多次顯明，耶穌是萬王之王，所有的受造物都要順服祂。請讀下面兩個例子裡的故事。馬可福音 1:23-27；馬可福音 4:35-41。</p><blockquote><p><strong>馬可福音1:23-27</strong><br>在會堂裡，有一個人被汙鬼附著。他喊叫說：<br>「拿撒勒人耶穌，我們與你有什麼相干，你來滅我們嗎？我知道你是誰，乃是　神的聖者！」<br>耶穌責備他說：「不要做聲，從這人身上出來吧！」<br>汙鬼叫那人抽了一陣風，大聲喊叫，就出來了。<br>眾人都驚訝，以致彼此對問說：「這是什麼事？是個新道理啊！他用權柄吩咐汙鬼，連汙鬼也聽從了他。」</p><p><strong>馬可福音4:35-41</strong><br>當那天晚上，耶穌對門徒說：「我們渡到那邊去吧。」<br>門徒離開眾人，耶穌仍在船上，他們就把他一同帶去，也有別的船和他同行。<br>忽然起了暴風，波浪打入船內，甚至船要滿了水。<br>耶穌在船尾上，枕著枕頭睡覺。門徒叫醒了他，說：「夫子！我們喪命，你不顧嗎？」<br>耶穌醒了，斥責風，向海說：「住了吧！靜了吧！」風就止住了，大大地平靜了。<br>耶穌對他們說：「為什麼膽怯，你們還沒有信心嗎？」<br>他們就大大地懼怕，彼此說：「這到底是誰，連風和海也聽從他了。」</p></blockquote>"},{"day":6,"html":"<p>耶穌為祂的百姓而死，完成了上帝的旨意之後，上帝使祂從死裡復活，使祂升高，遠在萬物之上。上帝使耶穌高過任何其他事物。請讀以弗所書 1:20-23。</p><blockquote><p><strong>以弗所書1:20-23</strong><br>就是照他在基督身上所執行的大能大力，使他從死裡復活，叫他在天上坐在自己的右邊，<br>遠超過一切執政的、掌權的、有能的、主治的和一切有名的，不但是今世的，連來世的也超過了。<br>又將萬有服在他的腳下，使他為教會作萬有之首。<br>教會是他的身體，是那充滿萬有者所充滿的。</p></blockquote><p>現在耶穌超過了什麼？什麼服在祂的腳下（在祂的權柄下）？上帝使耶穌為教會作什麼？這意味著，耶穌作為君王，掌管著萬事的發生，來使祂的百姓、祂的教會得益處。</p>"}]},{"num":24,"title":"基督如何執行先知的職分？","answer":"基督執行先知的職分，在於藉著祂的道和聖靈，將上帝的旨意啟示我們，為要叫我們得救。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-8","days":[{"day":1,"html":"<p>有時候，先知會預言將來要發生的事情。當他發預言的時候，表明他在傳講上帝的資訊，因為只有上帝才能預知未來。不過，先知的主要任務，是向上帝的百姓啟示上帝的旨意。啟示的意思就是，把先前隱藏的東西顯明出來。上帝比我們偉大得多。我們的思想是有罪的，因此無法自己理解屬靈的事。</p><p>我們靠自己永遠無法弄明白上帝的旨意。它對於我們是隱藏的，必須由上帝來將它顯明出來。上帝使用舊約的先知，來啟示祂一部分的旨意，不過所有在基督之前的先知，都是指向耶穌的。耶穌是完全的先知，祂能夠向我們完美地啟示上帝的旨意。早在摩西的時期，上帝就應許，會賜下這位完美的先知。耶穌復活昇天之後，使徒彼得講了一篇道。在這篇講道中，彼得說，耶穌實現了上帝給摩西的應許。請讀使徒行傳 3:18-24 中彼得的講道片段。</p><blockquote><p><strong>使徒行傳3:18-24</strong><br>但　神曾藉眾先知的口，預言基督將要受害，就這樣應驗了。<br>所以你們當悔改歸正，使你們的罪得以塗抹；這樣，那安舒的日子就必從主面前來到，<br>主也必差遣所預定給你們的基督耶穌降臨。<br>天必留他，等到萬物復興的時候，就是　神從創世以來，藉著聖先知的口所說的。<br>摩西曾說：『主　神要從你們弟兄中給你們興起一位先知像我，凡他向你們所說的，你們都要聽從。<br>凡不聽從那先知的，必要從民中全然滅絕。』<br>從撒母耳以來的眾先知，凡說預言的，也都說到這些日子。</p></blockquote>"},{"day":2,"html":"<p>耶穌在世的時候，祂透過祂的教導啟示上帝的旨意。耶穌時代的人們習慣於被教導。文士和法利賽人教導他們上帝的律法。不過，耶穌教導上帝的律法，是用不同的方式。群眾都很讚歎祂的教導，因為祂教導的時候，是作為有權柄的上帝來教導。（馬太福音 7:28-29）</p><blockquote><p><strong>馬太福音7:28-29</strong><br>耶穌講完了這些話，眾人都希奇他的教訓。<br>因為他教訓他們，正像有權柄的人，不像他們的文士。</p></blockquote><p>祂教導的時候，似乎真正地知道祂在說什麼。祂確實知道！當耶穌說到天堂，祂說的就是祂見過的地方。當祂說到父神，祂說的就是祂熟悉的那一位。請讀約翰福音 3:31-32。</p><blockquote><p><strong>約翰福音3:31-32</strong><br>從天上來的，是在萬有之上；從地上來的，是屬乎地，他所說的也是屬乎地。從天上來的是在萬有之上。<br>他將所見所聞的見證出來，只是沒有人領受他的見證。</p></blockquote><p>耶穌所講的話，總是完全照著父的命令說的。請讀約翰福音 12:49-50。</p><blockquote><p><strong>約翰福音12:49-50</strong><br>因為我沒有憑著自己講，惟有差我來的父，已經給我命令，叫我說什麼，講什麼。<br>我也知道他的命令就是永生。故此，我所講的話正是照著父對我所說的。</p></blockquote>"},{"day":3,"html":"<p>耶穌藉著祂的教導啟示上帝的旨意。祂也藉著祂的生活，向我們啟示上帝。祂在世的生活給我們設立了完美的榜樣，看到上帝想讓我們做什麼，讓我們成為什麼樣的人。上帝給祂兒女的旨意就是，要像耶穌。當我們看耶穌的生命，我們就看到了上帝對我們的旨意。耶穌向我們顯明，我們應該成為什麼樣的人。但是祂也向我們顯明，上帝是怎樣的上帝。當耶穌成為人，活在我們中間的時候，祂沒有一刻不是上帝，這樣祂作為人的生活，就向我們顯明瞭上帝。藉著祂的無罪生命，祂向我們顯明，上帝是聖潔的。祂對罪惡發怒，向我們顯明上帝恨惡罪惡。當祂醫治病人，祂向我們顯明，上帝是有憐憫的。藉著愛那些沒人要的罪人，祂向我們顯明上帝是有慈愛、有恩典的上帝。請讀約翰福音 1:14-18。</p><blockquote><p><strong>約翰福音1:14-18</strong><br>道成了肉身，住在我們中間，充充滿滿地有恩典，有真理。我們也見過他的榮光，正是父獨生子的榮光。<br>約翰為他作見證，喊著說：「這就是我曾說：『那在我以後來的，反成了在我以前的，因他本來在我以前。』」<br>從他豐滿的恩典裡，我們都領受了，而且恩上加恩。<br>律法本是藉著摩西傳的，恩典和真理都是由耶穌基督來的。<br>從來沒有人看見　神，只有在父懷裡的獨生子將他表明出來。</p></blockquote>"},{"day":4,"html":"<p>耶穌顯明瞭上帝的旨意，這樣祂的百姓才能得救。上帝揀選一些人，叫他們得永生。祂差遣祂的兒子——這位完美的先知，來使那些被揀選的人能夠得永生。對於祂自己，耶穌說過一句話，是別的先知從來沒有說過的。請讀約翰福音 14:6，看看那句話是什麼。</p><blockquote><p><strong>約翰福音14:6</strong><br>耶穌說：「我就是道路、真理、生命；若不藉著我，沒有人能到父那裡去。」</p></blockquote><p>人們認出耶穌是先知，是教師，所以他們問祂，上帝對於他們的旨意是什麼。他們想的都是上帝要他們做什麼。而耶穌告訴他們的是，上帝給人的旨意，是要他們信耶穌，就是上帝賜下的救主，好叫他們的罪得赦免，好叫他們得永生。請讀約翰福音 6:28-29。</p><blockquote><p><strong>約翰福音6:28-29</strong><br>眾人問他說：「我們當行什麼，才算做　神的工呢？」<br>耶穌回答說：「信　神所差來的，這就是做　神的工。」</p></blockquote>"},{"day":5,"html":"<p>主耶穌現在已經不再以人的身體活在地上，所以我們沒有辦法看到祂的行為，讓我們知道如何生活，也無法看到祂的屬性。我們沒辦法去聽祂教導，聽祂講道。那是不是說，耶穌已經不再是先知了呢？完全不是這樣的。耶穌仍然向我們啟示上帝的旨意。</p><p>耶穌昇天之前。祂揀選一些人作門徒。這些人曾與耶穌共同生活，曾親眼看過祂，曾聆聽祂的教導，曾在祂死後見祂復活。耶穌給門徒一個工作，就是把他們所看到的，所聽到的，傳揚給世人，好叫別人也能得永生。他們必須完全照著他們所看見所聽見的來傳遞資訊，不可有絲毫改動。這是多麼重大的責任啊！如果他們弄錯了怎麼辦？如果他們忘記了什麼重要的事怎麼辦？</p><p>耶穌知道有這種危險，所以祂應許要把聖靈賜給他們。聖靈也是上帝，從不會犯錯誤。祂能叫他們想起他們需要說的話。聖靈也會幫助他們更好地理解耶穌曾經教導他們的。因為聖靈的工作，門徒們可以確定，他們傳給別人的就是上帝的話，裡面沒有錯誤。請讀約翰福音 14:26 和約翰福音 16:13-14。</p><blockquote><p><strong>約翰福音14:26</strong><br>但保惠師，就是父因我的名所差來的聖靈，他要將一切事指教你們，並且要叫你們想起我對你們所說的一切話。</p><p><strong>約翰福音16:13-14</strong><br>只等真理的聖靈來了，他要引導你們明白一切的真理，因為他不是憑自己說的，乃是把他所聽見的都說出來，並要把將來的事告訴你們。<br>他要榮耀我，因為他要將受於我的告訴你們。</p></blockquote><p>他們不僅可以確定，他們所說出來的是上帝無誤的話語，而且可以確定他所寫下來的也是上帝無誤的話語。上帝使用這些使徒來寫成了整本新約，這樣我們這些生活在如今的人們，也可以得著上帝的話，也可以知道祂的旨意。耶穌就是這樣作我們的先知。祂從祂的話語中對我們講話。</p>"},{"day":6,"html":"<p class=\"read-prompt\">請讀希伯來書 1:1-2。</p><blockquote><p><strong>希伯來書1:1-2</strong><br>神既在古時藉著眾先知多次多方地曉諭列祖，<br>就在這末世，藉著他兒子曉諭我們，又早已立他為承受萬有的，也曾藉著他創造諸世界。</p></blockquote><p>上帝要對我們說的一切，祂都藉著耶穌基督告訴我們。耶穌呼召人作祂的使徒，並且賜下聖靈藉著他們啟示祂的旨意。這些門徒記下了耶穌的生平和教導。他們描述了耶穌的本性和耶穌的作為是何等的重要。他們的寫作構成了新約。最後一位使徒一離開世界，上帝的啟示就結束了。上帝要我們知道的一切，祂都藉著祂的兒子，也藉著記錄耶穌的那些聖徒，告訴了我們。今天，最完美的先知耶穌，惟獨藉著祂的話語跟我們說話。</p><p>耶穌作為完美的先知，還有一種方式。罪已經矇蔽了我們的心，使我們沒辦法正確理解上帝的話語說的是什麼。耶穌已經賜下一個方法，確保我們明白上帝在聖經中給我們的啟示。祂已經賜下祂的聖靈住在每一位信徒的裡面。聖靈使我們能夠正確理解、領受耶穌在聖經中對我們說的話。請讀約翰福音 14:16-17 和哥林多前書 2:12。</p><blockquote><p><strong>約翰福音14:16-17</strong><br>我要求父，父就另外賜給你們一位保惠師，叫他永遠與你們同在，<br>就是真理的聖靈，乃世人不能接受的，因為不見他，也不認識他；你們卻認識他，因他常與你們同在，也要在你們裡面。</p><p><strong>哥林多前書2:12</strong><br>我們所領受的，並不是世上的靈，乃是從　神來的靈，叫我們能知道　神開恩賜給我們的。</p></blockquote>"}]},{"num":25,"title":"基督如何執行祭司的職分？","answer":"基督執行祭司的職分，在於將祂自己一次獻上為祭，以滿足上帝的公義，使我們與上帝和好，並且又為我們不斷地代禱。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-8","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀希伯來書 5:1-4。</p><blockquote><p><strong>希伯來書5:1-4</strong><br>凡從人間挑選的大祭司，是奉派替人辦理　神的事，為要獻上禮物和贖罪祭。<br>他能體諒那愚蒙和失迷的人，因為他自己也是被軟弱所困。<br>故此，他理當為百姓和自己獻祭贖罪。<br>這大祭司的尊榮，沒有人自取，惟要蒙　神所召，像亞倫一樣。</p></blockquote><p>亞當和夏娃犯罪之後，上帝滿有恩典地應許賜下一位救主，救祂的百姓脫離罪和罪的悲慘結局。但是祂並沒有馬上就賜下那一位。祂想要教導祂的百姓，罪是可怕的，罪會使他們與祂隔絕。為了叫他們明白這一點，上帝命令祂的百姓為罪把祭物獻給祂。他們要把牛羊帶到會幕，殺死牠們，把它們獻為祭物。帶祭物來的人要把手按在祭物的身上，表明他的罪被放在了祭物身上。然後，祭司會殺掉它。這表明，帶來祭物的那人是該死的，但是這隻動物卻要替死。年復一年的屢次獻祭，叫上帝的百姓明白，他們的罪十分嚴重，應該受到死的刑罰。</p><p>上帝也命令祂的百姓設立祭司，就是祂所揀選獻祭的人。不是隨便哪個人都可以獻祭的，只有祭司可以。這樣，上帝叫百姓知道，罪使人與上帝隔絕，罪使他們成為上帝的敵人。祂教導他們，他們需要一位中保，就是來到人與上帝中間，使他們和好的那一位。當然，動物的死亡不足以償還我們得罪上帝的罪債。祭司不過和我們一樣，是罪人，永遠也沒有辦法成為上帝與人之間合格的中保。</p><p>舊約的獻祭和舊約的祭司都指向上帝曾經應許的那一位。它們向人們顯明，我們是多麼需要一位完美的祭司，來給我們獻上完美的祭物。</p>"},{"day":2,"html":"<p>日復一日，年復一年，祭司們焚香獻祭。當上帝的百姓目睹這一切的時候，他們開始明白，他們的罪阻隔在他們與上帝之間。他們知道，他們沒有辦法自己直接來到上帝面前，必須來到上帝揀選的人面前，他會代表他們來到上帝面前。當然，舊約的祭司也不過是人。他們也是罪人。他們也要為自己和自己的罪獻祭，然後才能為別人獻祭。上帝從來</p><p>沒有想要這些祭司成為罪人和祂自己之間的中保。他們不過是將來那位完美的中保的影子。</p><p>耶穌在各個方面都活出了完全順服上帝的生命。他從沒有犯過罪，一次也沒有。祂自己沒有罪要認，也沒有罪需要獻祭。耶穌像我們一樣是人，也和我們一樣，在各樣的事上受試探，所以祂能體會我們的需要和我們的軟弱。但是祂從沒有犯罪，祂一直都完全得上帝的喜悅。因為祂完全是上帝，也完全是人，所以只有耶穌是最完美的祭司。請讀希伯來書7:26-28。</p><blockquote><p><strong>希伯來書7:26-28</strong><br>像這樣聖潔、無邪惡、無玷汙、遠離罪人、高過諸天的大祭司，原是與我們合宜的。<br>他不像那些大祭司，每日必須先為自己的罪，後為百姓的罪獻祭，因為他只一次將自己獻上，就把這事成全了。<br>律法本是立軟弱的人為大祭司；但在律法以後起誓的話，是立兒子為大祭司，乃是成全到永遠的。</p></blockquote>"},{"day":3,"html":"<p>我們假設，有一個人送你一幅名畫，價值千萬，是由一位已經過世的畫家創作的。一天，你家來了一位客人，他拿記號筆在上面亂畫一通，把它給糟蹋了。當你的客人意識到，你為此特別惱火的時候，他從報紙廣告版裁剪一幅圖片，遞給你，說：「好了。這個給你，補償你的畫。」你對於你的畫，會不會感覺好一些？當然不會。不僅如此，你的客人竟然以為可以如此輕鬆地補償那幅名畫的損失，簡直是對你的侮辱。</p><p>當我們犯罪的時候，我們是得罪了絕對聖潔的上帝。我們的罪是忘恩負義地反叛創造的主，祂一直如此善待我們。獻上動物永遠沒有辦法補償我們對上帝所做的——就算是獻上千千萬萬的動物也不能。就算是一個人的死亡，也不能補償我們得罪上帝的行為。只有上帝的兒子，祂的死有足夠的價值來償付我們所犯的罪。</p><p>但是，因為上帝的兒子，也是上帝，不可能死亡。所以基督成為人，這樣祂才能夠死亡。祂把自己獻上，在上帝面前成為唯一有價值的祭物，可以償付人的罪。耶穌基督是最完美的祭司，向上帝獻上最完美的祭物——祂自己的身體和血。這祭物是如此有價值，只要獻上一次，就會償付在各個時代所有百姓的所有罪債。請讀希伯來書9:11-14。</p><blockquote><p><strong>希伯來書9:11-12</strong><br>但現在基督已經來到，作了將來美事的大祭司，經過那更大、更全備的帳幕，不是人手所造，也不是屬乎這世界的。<br>並且不用山羊和牛犢的血，乃用自己的血，只一次進入聖所，成了永遠贖罪的事。</p><p><strong>希伯來書 9:13</strong><br>若山羊和公牛的血，並母牛犢的灰，灑在不潔的人身上，尚且叫人成聖，身體潔淨，</p><p><strong>希伯來書9:14</strong><br>何況基督藉著永遠的靈，將自己無瑕無疵獻給 神，他的血豈不更能洗淨你們的心，除去你們的死行，使你們侍奉那永生 神嗎？</p></blockquote>"},{"day":4,"html":"<p>那些愛耶穌的人，一想到耶穌必須受苦，死在十字架，就感到難過。難道沒有別的辦法可以拯救我們嗎？聖經教導我們，因為上帝是聖潔的，祂恨惡所有的罪惡。因為祂是公義的（永遠完全地公正），祂總會懲罰所有的罪惡。如果上帝讓任何的罪逍遙法外，祂就不再是聖潔公義的。必須有人來為上帝百姓的罪受懲罰。只有上帝懲罰某個代替他們的人，上帝的百姓才能逃避懲罰。我們說耶穌的獻祭是「滿足神聖的公義」，就是這個意思。</p><p>神聖的公義，就是上帝的公義。只有某人為上帝的百姓承擔刑罰，上帝的公義才會得以滿足。罪一旦受到完全的懲罰，罪債就被付清了，罪就不再阻隔上帝和祂的百姓。耶穌藉著償付我們的罪債，使我們與上帝和好，跟祂恢復了關係。請讀羅馬書5:1, 8-10。</p><blockquote><p><strong>羅馬書5:1</strong><br>我們既因信稱義，就藉著我們的主耶穌基督得與 神相和。</p><p><strong>羅馬書 5:8</strong><br>惟有基督在我們還作罪人的時候為我們死， 神的愛就在此向我們顯明瞭。</p><p><strong>羅馬書5:9-10</strong><br>現在我們既靠著他的血稱義，就更要藉著他免去 神的忿怒。<br>因為我們作仇敵的時候，且藉著 神兒子的死得與 神和好；既已和好，就更要因他的生得救了。</p></blockquote>"},{"day":5,"html":"<p>耶穌既然為祂的百姓把自己獻上為祭，那麼祂是不是就不再是祭司了呢？不是這樣。祂仍然為那些信祂的人作祭司。除了獻祭，祭司還為百姓禱告。現在耶穌在天上，在父神的右邊，為祂的百姓代求禱告。耶穌從死裡復活，永遠不會再死。祂將永遠作我們的祭司。舊約祭司不停地更換。一位祭司老了死了，另一位祭司就會代替他。而耶穌永遠為我們的祭司。請讀希伯來書7:23-25。</p><blockquote><p><strong>希伯來書7:23-25</strong><br>那些成為祭司的，數目本來多，是因為有死阻隔，不能長久。<br>這位既是永遠常存的，他祭司的職任就長久不更換。<br>凡靠著他進到 神面前的人，他都能拯救到底，因為他是長遠活著，替他們祈求。</p></blockquote>"},{"day":6,"html":"<p>無論在哪一個方面，耶穌都比舊約的祭司更完美，舊約的祭司是耶穌的影子，耶穌才是完美的祭司。那些祭司本身也是罪人；耶穌卻是無罪的。那些祭司獻上動物為祭；耶穌獻上自己的血。那些祭司日復一日，獻上千千萬的祭物；耶穌為所有世代只獻祭一次。那些祭司象徵著上帝的赦免和潔淨除罪；耶穌實際地成就這工作。那些祭司都死去了，必須更換；耶穌永遠活著，會一直作我們的祭司。請讀希伯來書10:11-14。</p><blockquote><p><strong>希伯來書10:11-14</strong><br>凡祭司天天站著事奉 神，屢次獻上一樣的祭物，這祭物永不能除罪。<br>但基督獻了一次永遠的贖罪祭，就在 神的右邊坐下了。<br>從此等候他仇敵成了他的腳凳。<br>因為他一次獻祭，便叫那得以成聖的人永遠完全。</p></blockquote>"}]},{"num":26,"title":"基督如何執行君王的職分？","answer":"基督執行君王的職分，在於使我們降服歸向祂，治理保護我們，並且剋制得勝祂的和我們的一切仇敵。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-8","days":[{"day":1,"html":"<p>上帝曾經應許，將賜下一位最偉大的先知，向我們啟示祂和祂的旨意。祂曾經應許，這位先知同時也是完美的祭司，祂所獻的祭，足以償付我們的罪債，使我們與上帝和好。上帝也曾經應許，這位先知和祭司，將作為萬王之王來掌管萬有，祂的國度沒有窮盡。請讀以賽亞書9:6-7。</p><blockquote><p><strong>以賽亞書9:6-7</strong><br>因有一嬰孩為我們而生，有一子賜給我們，政權必擔在他的肩頭上。他名稱為奇妙策士、全能的神、永在的父、和平的君！<br>他的政權與平安必加增無窮。他必在大衛的寶座上治理他的國，以公平公義使國堅定穩固，從今直到永遠。萬軍之耶和華的熱心必成就這事。</p></blockquote><p>在耶穌降世之前，上帝曾經給祂的百姓賜下君王。不過，他們也僅僅象徵著上帝所揀選的掌權者，為的是要顯明我們多麼需要完美的君王。舊約的君王們，其中有一些比別的好一點。其中最好的要算大衛了，祂是合神心意的人。祂渴望為著上帝的榮耀來治國，他願意保護上帝的百姓。在這方面，他象徵著基督——上帝所賜完美的君王。儘管如此，大衛有時候也犯很嚴重的罪。有時候，他把自己的慾望擺在上帝的旨意之前。為了滿足私慾，他做出一些非常愚蠢邪惡的事情，使百姓陷入到危險之中。在這方面，他表明了，人們需要一位無罪的君王，一位始終不渝地尋求上帝旨意的君王，一位堅持不懈地為上帝百姓謀好處的君王。</p>"},{"day":2,"html":"<p>君王耶穌為上帝的每一位百姓所做的事，就是把我們帶到祂的國度。人人生來就悖逆上帝。我們不想跟祂有什麼關係，也不想與祂所揀選的君王有什麼瓜葛。我們總是想過自己的日子，做自己的事。如果我們屬於被上帝揀選得永生的人，耶穌就必定會使我們成為祂的臣民。如果讓我們自己決定，我們不會把祂當作我們的君王來順服祂。因此，耶穌差下聖靈，祂指出我們心裡的罪，讓我們看到我們需要一位救主。祂改變我們悖逆的心，這樣我們就可以信靠耶穌來作我們的救主，救我們脫離罪惡。這樣祂就會將祂當作我們的君王來順服祂。請讀下面的故事，看耶穌如何使一個悖逆的仇敵降服於祂，以至於這個人成了一個最忠於耶穌的僕人。請讀使徒行傳9:1-7。</p><blockquote><p><strong>使徒行傳9:1-7</strong><br>掃羅仍然向主的門徒口吐威嚇兇殺的話，去見大祭司，<br>求文書給大馬士革的各會堂，若是找著信奉這道的人，無論男女，都準他捆綁帶到耶路撒冷。<br>掃羅行路，將到大馬士革，忽然從天上發光，四面照著他。<br>他就仆倒在地，聽見有聲音對他說：「掃羅，掃羅！你為什麼逼迫我？」<br>他說：「主啊，你是誰？」主說：「我就是你所逼迫的耶穌。<br>起來！進城去，你所當做的事，必有人告訴你。」<br>同行的人站在那裡，說不出話來，聽見聲音，卻看不見人。</p></blockquote>"},{"day":3,"html":"<p>今天我們會把昨天開始的故事看完。請讀使徒行傳9:10-19上。</p><blockquote><p><strong>使徒行傳 9:10</strong><br>當下，在大馬士革有一個門徒，名叫亞拿尼亞。主在異象中對他說：「亞拿尼亞。」他說：「主，我在這裡。」</p><p><strong>使徒行傳9:11-19</strong><br>主對他說：「起來！往直街去，在猶大的家裡，訪問一個大數人，名叫掃羅，他正禱告；<br>又看見了一個人，名叫亞拿尼亞，進來按手在他身上，叫他能看見。」<br>亞拿尼亞回答說：「主啊，我聽見許多人說，這人怎樣在耶路撒冷多多苦害你的聖徒，<br>並且他在這裡有從祭司長得來的權柄，捆綁一切求告你名的人。」<br>主對亞拿尼亞說：「你只管去。他是我所揀選的器皿，要在外邦人和君王並以色列人面前宣揚我的名。<br>我也要指示他，為我的名必須受許多的苦難。」<br>亞拿尼亞就去了，進入那家，把手按在掃羅身上說：「兄弟掃羅，在你來的路上向你顯現的主，就是耶穌，打發我來，叫你能看見，又被聖靈充滿。」<br>掃羅的眼睛上好像有鱗立刻掉下來，他就能看見，於是起來受了洗，<br>吃過飯就健壯了。</p></blockquote><p>亞拿尼亞稱耶穌為「主」。我們會稱我們所順服的人為「主」。亞拿尼亞不願意去見掃羅，因為大家都知道，掃羅想要抓捕、苦害基督徒。但是亞拿尼亞還是去了。他明白，耶穌是他的主宰。僕人不可以和君王頂嘴；僕人順服君王。在第15節和16節，耶穌告訴亞拿尼亞一些關於掃羅的事情，就是現在的暴徒掃羅，將要開始順服主耶穌。耶穌已經揀選他，給他特殊的目標，掃羅將完成耶穌為他設立的目標。要實現耶穌為他設立的目標，掃羅會受許多的苦。儘管如此，他還是會照著耶穌的旨意去做，因為耶穌從此作他的君王。耶穌會掌管掃羅，如同祂掌管祂的每一個百姓一樣。</p>"},{"day":4,"html":"<p>君王統治百姓，而且可以按照自己的意願來命令他們。一個好的君王總是關心百姓的利益。耶穌是最好的君王，所以祂從不會停止保護我們。有時候耶穌保護祂的百姓遠離疾病或傷害。每一次我們從病中復原，哪怕只是一場感冒，也是上帝在祂的護理當中醫治了我們。我們每天所享受的健康，是從上帝來的禮物，祂保護我們，沒有讓我們得病。每當我們發生意外，或者差點兒發生意外，並沒有受到嚴重的傷害，都是我們的君王耶穌在保護我們。</p><p>不過，有時候耶穌的跟隨者也一樣會生病，甚至是重病，而且沒有康復。有時候耶穌的僕人也被傷害，甚至被殺害。所以，當我們說耶穌是君王，祂總用最好的方式來保護祂的百姓，我說的往往不是身體方面的事情。耶穌曾經應許，要一直保守祂的百姓，遠離屬靈的敵人。什麼也不能使我們與祂分離，什麼也不能讓我們重新與祂為敵。什麼也不能讓祂的百姓背叛祂、犯罪得罪祂，什麼也不能讓祂不再愛他們，讓祂撇棄他們。如果靠自己，我們一生都永遠沒辦法有力量抵抗撒但的攻擊，無法遏制心中的罪惡。但是耶穌應許，祂會保守祂所統治的人。他們中間，連一個都不丟棄。請讀羅馬書8:31-39。</p><blockquote><p><strong>羅馬書8:31-37</strong><br>既是這樣，還有什麼說的呢？ 神若幫助我們，誰能敵擋我們呢？<br>神既不愛惜自己的兒子為我們眾人舍了，豈不也把萬物和他一同白白地賜給我們嗎？<br>誰能控告 神所揀選的人呢？有 神稱他們為義了。<br>誰能定他們的罪呢？有基督耶穌已經死了，而且從死裡復活，現今在神的右邊，也替我們祈求。<br>誰能使我們與基督的愛隔絕呢？難道是患難嗎？是困苦嗎？是逼迫嗎？是飢餓嗎？是赤身露體嗎？是危險嗎？是刀劍嗎？<br>如經上所記：「我們為你的緣故終日被殺，人看我們如將宰的羊。」<br>然而，靠著愛我們的主，在這一切的事上已經得勝有餘了。</p><p><strong>羅馬書 8:38</strong><br>因為我深信無論是死、是生、是天使、是掌權的、是有能的，是現在的事、是將來的事，</p><p><strong>羅馬書8:39</strong><br>是高處的、是低處的、是別的受造之物，都不能叫我們與 神的愛隔絕；這愛是在我們的主基督耶穌裡的。</p></blockquote>"},{"day":5,"html":"<p>當我們縱觀歷代的教會歷史，我們常常看到，仇敵似乎得勝了。就連今天，教會的仇敵往往看起來比教會更強大。在許多國家，如果誰承認自己是基督徒，他們就會失去工作，沒有辦法養家餬口。在另外一些地方，基督徒因為信仰被監禁，甚至被處死。在這些國家，教會幾乎是完全看不見的，似乎她的仇敵已經得勝。在另外一些國家，罪惡削弱了教會，看起來跟世界沒有什麼分別。你可能看到許多教堂，也遇到許多人說自己是基督徒。不過，要找到專心學習聖經中君王耶穌的話語、並且願意順服祂的人，就要困難得多。</p><p>當仇敵似乎得勝的時候，我們需要記得，耶穌曾經應許，什麼也不能摧毀祂的教會。我們的仇敵就是祂的仇敵。作為統治萬有的君王，為我們的緣故，祂會遏制敵人的作為。意思是說，祂不會任由他們隨心所欲地作惡，隨心所欲地傷害我們。祂只會允許他們害到某個程度，能使我們更剛強，能最終使我們得益處。耶穌作為君王，祂命定萬事，讓它們互相效力，叫祂的百姓，就是教會，得益處。請讀以弗所書1:20-23。</p><blockquote><p><strong>以弗所書1:20-23</strong><br>就是照他在基督身上所執行的大能大力，使他從死裡復活，叫他在天上坐在自己的右邊，<br>遠超過一切執政的、掌權的、有能的、主治的和一切有名的，不但是今世的，連來世的也都超過了。<br>又將萬有服在他的腳下，使他為教會作萬有之首。<br>教會是他的身體，是那充滿萬有者所充滿的。</p></blockquote>"},{"day":6,"html":"<p>耶穌的仇敵，沒有一個在祂面前站立得住。祂征服了所有的仇敵。將來有一天，祂將完全摧毀他們。請讀啟示錄19:11-16中描述君王耶穌的話。</p><blockquote><p><strong>啟示錄19:11-16</strong><br>我觀看，見天開了。有一匹白馬，騎在馬上的稱為誠信真實，他審判、爭戰都按著公義。<br>他的眼睛如火焰，他頭上戴著許多冠冕，又有寫著的名字，除了他自己沒有人知道。<br>他穿著濺了血的衣服，他的名稱為 神之道。<br>在天上的眾軍騎著白馬，穿著細麻衣，又白又潔，跟隨他。<br>有利劍從他口中出來，可以擊殺列國。他必用鐵杖轄管他們，並要踹全能 神烈怒的酒榨。<br>在他衣服和大腿上有名寫著說：「萬王之王，萬主之主。」</p></blockquote><p>啟示錄也描述了耶穌的仇敵。據啟示錄的描述，他們非常兇猛、恐怖、殘暴。他們都聚集起來要與耶穌作戰。請讀啟示錄17:14。</p><blockquote><p><strong>啟示錄17:14</strong><br>他們與羔羊爭戰，羔羊必勝過他們，因為羔羊是萬主之主，萬王之王。同著羔羊的，就是蒙召、被選、有忠心的，也必得勝。</p></blockquote><p>我們這些以耶穌為君王的人，可以歡呼快樂，因為我們的君王是如此的偉大。祂能保護我們脫離仇敵，而且有一天會把他們全毀滅。</p>"}]},{"num":27,"title":"基督的降卑在於哪些方面？","answer":"基督的降卑在於：降生為人，卑微地生在律法之下，忍受今世的苦難、神的震怒和被咒詛死於十架，又被埋葬，暫時服在死權之下。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-8","days":[{"day":1,"html":"<p>聖父上帝、聖子上帝、聖靈上帝已經同心合意地讓耶穌基督拯救上帝的選民。這個拯救上帝百姓的計劃，總共有兩個部分：基督的降卑和基督的升高。基督的降卑包括耶穌為我們所忍受的各種艱難。祂的降卑包括祂的受苦與受死。上帝為著耶穌的順服而給祂尊榮。上帝恢復了耶穌曾與上帝共享的榮耀。這個禮拜，我們將學習基督的降卑。請讀腓立比書2:5-11。</p><blockquote><p><strong>腓立比書2:5-11</strong><br>你們當以基督耶穌的心為心。<br>他本有神的形像，不以自己與神同等為強奪的，<br>反倒虛己，取了奴僕的形像，成為人的樣式。<br>既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。<br>所以神將他升為至高，又賜給他那超乎萬名之上的名，<br>叫一切在天上的、地上的和地底下的，因耶穌的名無不屈膝，<br>無不口稱耶穌基督為主，使榮耀歸與父神。</p></blockquote>"},{"day":2,"html":"<p class=\"read-prompt\">請讀以賽亞書40:14-17。</p><blockquote><p><strong>以賽亞書40:14-17</strong><br>他與誰商議，誰教導他，誰將公平的路指示他，又將知識教訓他，將通達的道指教他呢？<br>看哪，萬民都像水桶的一滴，又算如天平上的微塵；他舉起眾海島，好像極微之物。<br>黎巴嫩的樹林不夠為柴燒；其中的走獸也不夠作燔祭。<br>萬民在他面前好像虛無，被他看為不及虛無，乃為虛空。</p></blockquote><p>這一章要說一說上帝的偉大和榮耀。基督道成肉身住在我們中間之前，偉大和榮耀屬於基督。根據這段經文，如果你把全世界各國的所有人都加在一起，他們對於上帝來說彷佛是什麼？上帝比人大多了。如果你從人變成海洋裡的單細胞生物，都遠不如上帝成為人的跨度大。這是因為你和單細胞生物還都是有限的，你們也都是被造之物。</p><p>上帝的兒子是無限的，也不是被造的。要成為人，基督要限制自己一段時間，這樣才可以生活在這世界上。祂是上帝，一無所缺，但是成了人之後，祂有了一個被造的身體，有平常人的需要。有人的身體和靈魂，就有一切因人類墮落而來的軟弱和痛苦，這就是基督降卑的第一步。</p>"},{"day":3,"html":"<p class=\"read-prompt\">請讀詩篇95篇。</p><blockquote><p><strong>詩篇95:1-11</strong><br>來啊，我們要向耶和華歌唱；向拯救我們的磐石歡呼！<br>我們要來感謝他，用詩歌向他歡呼！<br>因耶和華為大神，為大王，超乎萬神之上。<br>地的深處在他手中，山的高峰也屬他。<br>海洋屬他，是他造的；旱地也是他手造成的。<br>來啊，我們要屈身敬拜，在造我們的耶和華面前跪下。<br>因為他是我們的神，我們是他草場的羊，是他手下的民。惟願你們今天聽他的話。<br>你們不可硬著心，像當日在米利巴，就是在曠野的瑪撒。<br>那時，你們的祖宗試我探我，並且觀看我的作為。<br>四十年之久，我厭煩那世代，說：「這是心裡迷糊的百姓，竟不曉得我的作為！」<br>所以我在怒中起誓說：「他們斷不可進入我的安息！」</p></blockquote><p>這篇詩篇讚美上帝是萬有之上的大君王。它講述了萬物、萬民都屬於祂，祂都隨自己的旨意對待他們。這篇詩篇提醒他們，必須順服這位大君王，因為祂會審判那些不順服的人。因為耶穌是聖子上帝，所以詩篇中說到上帝的地方也適用於耶穌。基督的降卑，有一部分就是，儘管祂作為上帝統治萬有，但是祂還來服侍我們這些本該服侍祂的人。作為上帝，祂是設立律法叫凡受造者遵行的那一位。但是，祂卻成為人，自己服在律法之下——祂現在竟要順服祂為受造者制定的律法。</p>"},{"day":4,"html":"<p>因為墮落，每一個生在世上的人都經歷一些痛苦愁煩。耶穌也經歷痛苦愁煩。耶穌也能感受到那些使我們生活不完美的事——飢餓、勞累、疼痛、孤獨、悲傷。此外，耶穌在世上的生活，還經歷常人不會面對的痛苦。最為無罪的聖子上帝，祂恨惡罪惡。所以耶穌住在世上的罪人中間，就會給祂帶來極大的痛苦。撒但知道耶穌的工作多麼重要。雖然我們也面對誘惑，但是撒但為猛烈地攻擊耶穌。</p><p>就連耶穌最親近的朋友和親人也常常誤解祂——還有許多人恨惡祂。耶穌忍受著孤獨。祂知道祂是誰。祂知道那重大的責任，就是為救上帝的百姓，祂要為他們的罪承受刑罰。請讀下面的經文，看看耶穌忍受的幾種特別的痛苦。約翰福音7:1；7:5；8:48；8:59；12:27。</p><blockquote><p><strong>約翰福音7:1</strong><br>這事以後，耶穌在加利利遊行，不願在猶太遊行，因為猶太人想要殺他。</p><p><strong>約翰福音7:5</strong><br>因為連他的弟兄說這話，是因為不信他。</p><p><strong>約翰福音8:48</strong><br>猶太人回答說：「我們說你是撒馬利亞人，並且是鬼附著的，這話豈不正對嗎？」</p><p><strong>約翰福音8:59</strong><br>於是他們拿石頭要打他，耶穌卻躲藏，從殿裡出去了。</p><p><strong>約翰福音12:27</strong><br>我現在心裡憂愁，我說什麼才好呢？父啊，救我脫離這時候，但我原是為這時候來的。</p></blockquote>"},{"day":5,"html":"<p>當然，耶穌在祂的降卑中間最難的事，就是承擔上帝百姓的罪惡，為他們承受上帝的憤怒。耶穌作為上帝，祂是完全地聖潔，恨惡所有的罪。當祂走向十字架，身上帶著我們所有的罪，那肯定讓祂心裡滿了痛苦。作為聖子上帝，耶穌一直與聖父上帝享受完美的相交合一。他們在永恆中間從未分開過。當耶穌在十字架上擔負我們所有的罪惡，聖父上帝將祂的憤怒傾倒在祂身上，轉過身去不看祂，就是為此，耶穌才喊叫說：「我的神，我的神，為什麼離棄我？」請讀以賽亞書53:4-6,10上。</p><blockquote><p><strong>以賽亞書53:4-6</strong><br>他誠然擔當我們的憂患，揹負我們的痛苦；我們卻以為他受責罰，被神擊打苦待了。<br>哪知他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。<br>我們都如羊走迷，各人偏行己路。耶和華使我們眾人的罪孽都歸在他身上。</p><p><strong>以賽亞書53:10</strong><br>耶和華卻定意將他壓傷，使他受痛苦；耶和華以他為贖罪祭。</p></blockquote>"},{"day":6,"html":"<p>耶穌作為上帝，是永恆的。祂沒有開始，也沒有結束。死亡不能靠近祂。就算作為人，耶穌也不必死，因為只有祂是無罪的。死是從罪來的。因為耶穌活著無罪的生活，祂不必死。死是因為墮落而臨到人類的咒詛的一部分。耶穌不必經歷那個咒詛，不過祂替我們經歷了。一位人類的統治者（他也是耶穌自己創造的）審訊耶穌，宣判用專為最兇惡罪犯預備的特別死刑來處死祂。祂被釘於十字架，承擔了我們該受的咒詛。儘管祂是至聖的上帝，祂還忍受了死亡，就是給悖逆的受造者的刑罰，而後葬在墳墓中三日。請讀加拉太書3:13。</p><blockquote><p><strong>加拉太書3:13</strong><br>基督既為我們受了咒詛，就贖出我們脫離律法的咒詛，因為經上記著：「凡掛在木頭上都是被咒詛的。」</p></blockquote><p>我們的救主是多麼奇妙！我們的上帝是多麼良善啊，祂為我們這些百姓，這麼多方面都降卑自己，而我們只配得祂的憤怒和刑罰。我們就算每天每時每刻都來讚美祂，也是讚美不盡啊！請讀哥林多後書8:9。</p><blockquote><p><strong>哥林多後書8:9</strong><br>你們知道我們主耶穌基督的恩典：他本來富足，卻為你們成了貧窮，叫你們因他的貧窮，可以成為富足。</p></blockquote>"}]},{"num":28,"title":"基督的升高在於哪些方面？","answer":"基督的升高在於：祂第三日從死裡復活，昇天，坐在父神的右邊，並在末日來審判世界。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-8","days":[{"day":1,"html":"<p>升高某人就是把某人高舉到一個大有權柄和尊榮的地位。耶穌在降卑的狀態中，祂落在低微的地步，這樣才能救祂的百姓。此後，上帝使祂升高。其中的第一步就是上帝叫耶穌從死裡復活。惡人殺害祂，死後祂被葬在墳墓中。但是耶穌不能死就死了。祂是上帝的愛子，祂完全順服了祂的父。於是上帝在第三日使祂復活了。請讀使徒行傳2:22-24。</p><blockquote><p><strong>使徒行傳2:22-24</strong><br>以色列人哪，請聽我的話： 神藉著拿撒勒人耶穌在你們中間施行異能、奇事、神蹟，將他證明出來，這是你們自己知道的。<br>他既按著 神的定旨、先見被交與人，你們就藉著無法之人的手，把他釘在十字架上殺了，<br>神卻將死的痛苦解釋了，叫他復活，因為他原不能被死拘禁。</p></blockquote>"},{"day":2,"html":"<p class=\"read-prompt\">請讀約翰福音2:19-22。</p><blockquote><p><strong>約翰福音2:19-22</strong><br>耶穌回答說：「你們拆毀這殿，我三日內要再建立起來。」<br>猶太人便說：「這殿是四十六年才造成的，你三日內就再建立起來嗎？」<br>但耶穌這話，是以他的身體為殿。<br>所以到他從死裡復活以後，門徒就想起他說過這話，便信了聖經和耶穌所說的。</p></blockquote><p>耶穌在很多方面是與眾不同的。耶穌獨特的一點就是，祂是唯一一位死過又復活的人。在聖經的記載中，上帝有的時候給先知能力，讓人從死裡復活。耶穌在世的時候也曾經叫別人從死裡復活。但是隻有耶穌自己是靠著自己的大能從死裡復活。只有耶穌是上帝，作為上帝，祂有力量勝過死亡。對於我們來說，耶穌從死裡復活這一點很重要，因為這樣我們才知道祂真是上帝。如果祂像其他人那樣死了就死了，那麼祂一生中所做的事情就不足介意了。</p><p>耶穌是我們的先知。祂曾宣告自己是上帝，祂說過祂會復活的。如果祂沒有從死裡復活，那麼祂就成了假先知。耶穌是我們的祭司。如果祂沒有從死裡復活，祂就跟任何一個普通人一樣了，祂的死也不足以償付任何人的罪。耶穌是我們的君王。如果祂未曾從死裡復活，祂就是一個死的君王，不能統治和保護祂的百姓了。耶穌的復活是值得慶祝的理由！</p>"},{"day":3,"html":"<p>耶穌從死裡復活四十天之後，祂升上天堂。祂得了尊貴的地位。這是基督升高的第二階段。耶穌作為上帝，在祂成為人之前就有大榮耀。當祂回到天上，祂是回到了曾有的榮耀中。現在，因祂勝過了罪惡和死亡，祂也得了榮耀。請讀約翰福音17:5和希伯來書2:9。</p><blockquote><p><strong>約翰福音17:5</strong><br>父啊，現在求你使我同你享榮耀，就是未有世界以先，我同你所有的榮耀。</p><p><strong>希伯來書2:9</strong><br>惟獨見那成為比天使小一點的耶穌，因為受死的苦，就得了尊貴、榮耀為冠冕，叫他因著 神的恩，為人人嚐了死味。</p></blockquote>"},{"day":4,"html":"<p>耶穌不僅在昇天的階段被升高。在天上，祂被賦予至高至聖的地位。祂坐在父的右邊。儘管耶穌升高在天上，祂仍眷顧地上的百姓。耶穌作為先知，祂透過寫下來的聖經教導百姓，祂賜下聖靈教導信徒並住在信徒裡面。請讀使徒行傳2:32-33。</p><blockquote><p><strong>使徒行傳2:32-33</strong><br>這耶穌， 神已經叫他復活了，我們都為這事作見證。<br>他既被 神的右手高舉（注：或作「他既高舉在 神的右邊」），又從父受了所應許的聖靈，就把你們所看見、所聽見的澆灌下來。</p></blockquote><p>祂作為祭司，在父面前為我們代求。意思是說，祂為我們禱告，讓我們領受祂為我們所得來的一切福分。請讀希伯來書7:24-25。</p><blockquote><p><strong>希伯來書7:24-25</strong><br>這位既是永遠常存的，他祭司的職任就長久不更換。<br>凡靠著他進到 神面前的人，他都能拯救到底，因為他是長遠活著，替他們祈求。</p></blockquote><p>耶穌作為君王，祂統管我們，就是祂的教會。祂保護我們，供應我們一切的需要。請讀歌羅西書1:13-14。</p><blockquote><p><strong>歌羅西書1:13-14</strong><br>他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡；<br>我們在愛子裡得蒙救贖，罪過得以赦免。</p></blockquote>"},{"day":5,"html":"<p>耶穌在末日再來時，會進一步被升高。到那時，耶穌會照著人一生的行為，來審判世上每個人。那些抵擋上帝，從不悔改的人將會被判受永刑。那些曾抵擋上帝，但是悔改信基督的人，將永遠和祂一起在天上。他們會照著自己的義行得賞賜。聖經教導我們，耶穌是上帝指派的法官。祂再來的時候，會審判當時活著的人，和所有已死的人。請讀使徒行傳17:31和約翰福音5:22-23。</p><blockquote><p><strong>使徒行傳17:31</strong><br>因為他已經定了日子，要藉著他所設立的人按公義審判天下，並且叫他從死裡復活，給萬人作可信的憑據。</p><p><strong>約翰福音5:22-23</strong><br>父不審判什麼人，乃將審判的事全交與子，<br>叫人都尊敬子如同尊敬父一樣。不尊敬子的，就是不尊敬差子來的父。</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀哥林多前書15:24-28。</p><blockquote><p><strong>哥林多前書15:24-28</strong><br>再後，末期到了，那時，基督既將一切執政的、掌權的、有能的，都毀滅了，就把國交與父 神。<br>因為基督必要作王，等 神把一切仇敵都放在他的腳下。<br>盡末了所毀滅的仇敵就是死。<br>因為經上說：「神叫萬物都服在他的腳下。」既說萬物都服了他，明顯那叫萬物服他的，不在其內了。<br>萬物既服了他，那時，子也要自己服叫萬物服他的，叫 神在萬物之上，為萬主之主。</p></blockquote><p>現在，耶穌是萬主之主。不過，祂耐心地等候人們悔改。在祂等待的期間，祂的仇敵——魔鬼、死亡、叛逆的人——都與祂作對。有一天，耶穌會毀滅一切的仇敵。只有那些愛祂、侍奉祂、尊崇祂的人，才會和祂同在。這將是耶穌升高的最後階段。祂將永遠止息仇敵對祂旨意的反抗。天上齊聲頌揚，說：「世上的國，成了我主和主基督的國；他要作王，直到永永遠遠。」（啟示錄11:15）</p>"}]},{"num":29,"title":"我們如何領受基督所買贖的救恩？","answer":"我們領受基督所買贖的救恩，是藉著祂的聖靈，將救恩有效地實施在我們身上。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-9","days":[{"day":1,"html":"<p>假設你是全世界最邪惡的統治者的俘虜。假設這位統治者一直剝奪你的自由，將你限制在一個黑暗痛苦的國度裡。不僅如此，假設這位統治者有力量控制你，讓你執行他邪惡的計劃。日復一日，他叫你做一些傷害自己、傷害親人的事情。這是多麼可怕的生活啊！我們每個人在信基督之前就是這樣生活的。我們需要一位比我們的強敵撒但更厲害的，來救我們脫離他的控制，將我們放在智慧和良善的君王——耶穌的國度裡。</p><p>因為我們的罪，撒但在我們身上就有了權勢。為要釋放我們脫離祂的邪惡統治，必須有人為我們的罪付上代價。耶穌將我們從撒但的權勢下釋放出來，將我們放在祂自己的國度裡。耶穌買贖了我們，或者說，為我們的罪付上了代價，叫我們脫離撒但。請讀歌羅西書1:13-14。</p><blockquote><p><strong>歌羅西書1:13-14</strong><br>他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡；<br>我們在愛子裡得蒙救贖，罪過得以赦免。</p></blockquote>"},{"day":2,"html":"<p>你還記得第二十問的回答嗎？上帝任憑全人類都在罪惡和悲慘狀況中沉淪嗎？回答的開頭是「上帝全然根據自己的美意，在萬古之先，揀選了一些人得永生。」在他們尚未出生之前，甚至在亞當還沒有犯罪之前，上帝就計劃要救贖祂的百姓。請讀以弗所書1:11。</p><blockquote><p><strong>以弗所書1:11</strong><br>我們也在他裡面得了基業，這原是那位隨己意行做萬事的，照著他旨意所預定的。</p></blockquote><p>無論上帝計劃什麼，祂都成就，照著祂的計劃絲毫不差。那些蒙上帝揀選的人，一個也不會在罪惡和悲慘中沉淪。許多人似乎以為，耶穌死在十字架上，只是使人有可能得救。他們以為，耶穌正等著看誰會相信祂，盼望著有人相信祂。聖經教導我們，上帝揀選的所有人都將信耶穌、得救恩。聖靈保證上帝所有的選民都將信靠耶穌作他們的救主。聖父上帝揀選要拯救的人；聖子上帝受死救贖這些人；聖靈上帝在那些人的心中動工，叫他們信基督。</p>"},{"day":3,"html":"<p>許多人以為，為了救人脫離罪惡，上帝能做的一切都已經完成了：祂賜下祂的兒子，為罪付了死的代價。許多人以為，上帝除了盼望人們信祂的兒子作救主，也不能做什麼了。聖經教導我們，上帝計劃拯救特定的人，祂就會一個一個地拯救那些人。上帝總是成就祂的目的，沒有人能夠攔阻祂。</p><p>不僅如此，聖經教導我們，如果讓人自己決定，沒有人會信靠祂的。聖靈必須首先在人心裡動工，叫他們為罪自責。只有這時，他們才能夠相信。在救恩這件至關重要的事情上，上帝不是做一部分，或者做大部分，然後剩下的必須叫我們做。上帝計劃我們的救恩。祂使我們能夠相信。是上帝成就了全部。請讀羅馬書9:15-18。</p><blockquote><p><strong>羅馬書9:15-18</strong><br>因他對摩西說：「我要憐憫誰，就憐憫誰；要恩待誰，就恩待誰。」<br>據此看來，這不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神。<br>因為經上有話向法老說：「我將你興起來，特要在你身上彰顯我的權能，並要使我的名傳遍天下。」<br>如此看來， 神要憐憫誰，就憐憫誰；要叫誰剛硬，就叫誰剛硬。</p></blockquote>"},{"day":4,"html":"<p>上帝是三位一體的上帝：聖父、聖子、聖靈。這三位是在所有事上完全合一。在上帝的所有作為中，每一位都有重要的角色。對於我們的救贖來說也是一樣。聖父上帝揀選人並定意或計劃救贖他們。聖子上帝取了人的身體來代替祂的百姓活出完全公義的生命，並且受死償付他們的罪債。請讀加拉太書1:3-5。</p><blockquote><p><strong>加拉太書1:3-5</strong><br>願恩惠、平安從父 神與我們的主耶穌基督歸與你們。<br>基督照我們父 神的旨意為我們的罪捨己，要救我們脫離這罪惡的世代。<br>但願榮耀歸於 神，直到永永遠遠。阿們！</p></blockquote>"},{"day":5,"html":"<p>在上帝百姓得救贖的事上，聖靈也有重要的角色。耶穌的死，價值無限，足以償付全世界的罪債。但是，對於那些相信祂是叫他們脫離罪惡的救主的人，才有功效。聖靈是在人心裡動工，叫人相信耶穌。本週問題的回答中說「聖靈將救恩有效地實施在我們身上」，就是這個意思。</p><p>因為罪，我們的心剛硬抵擋上帝。如果任憑我們自己，我們照著自己的慾望來尋求，而不是照著上帝的願望。我們自己，沒有辦法明白，我們需要救主。我們自己也不會選擇信耶穌。我們的心必須先改變，然後我們才能認罪悔改、相信。只有聖靈能改變人心。聖靈帶來的人心改變是如此巨大，聖經上說，這過程就是重生。當耶穌說到重生，或者是從聖靈生，就是這種心裡的改變。請讀約翰福音3:3-6。</p><blockquote><p><strong>約翰福音3:3-6</strong><br>耶穌回答說：「我實實在地告訴你：人若不重生，就不能見 神的國。」<br>尼哥底母說：「人已經老了，如何能重生呢？豈能再進母腹生出來嗎？」<br>耶穌說：「我實實在在地告訴你：人若不是從水和聖靈生的，就不能進 神的國。<br>從肉身生的，就是肉身；從靈生的，就是靈。</p></blockquote>"},{"day":6,"html":"<p>是上帝自己拯救祂的百姓。如果某些人是上帝的選民，他們就會悔改相信，無論他們已經離開上帝有多遠。上帝為救自己的百姓，做了一切必要的事。祂百姓的罪惡、頑梗都沒有辦法攔阻上帝，叫上帝不救他們。我們不必擔心，恐怕祂的百姓有些會持續抵擋，怕他們永不歸向基督。因為上帝是救祂百姓的那一位，我們就知道他們每一個都會得救。請讀約翰福音6:37-39。</p><blockquote><p><strong>約翰福音6:37-39</strong><br>凡父所賜給我的人，必到我這裡來；到我這裡來的，我總不丟棄他。<br>因為我從天上降下來，不是要按自己的意思行，乃是要按那差我來者的意思行。<br>差我來者的意思就是：他所賜給我的，叫我一個也不失落，在末日卻叫他復活。</p></blockquote>"}]},{"num":30,"title":"聖靈如何將基督買贖的救恩，實施在我們身上？","answer":"聖靈將基督買贖的救恩，實施在我們身上，是藉著祂在我們心裡作成的信心，並且藉此連結我們歸屬基督，這是發生在臨到我們的有效恩召裡。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-9","days":[{"day":1,"html":"<p>因為亞當是全人類的先祖，我們所有人都是與他聯合的。我們藉著出生，就與第一個人亞當聯合。當亞當悖逆上帝的時候，就算作是我們悖逆了上帝。我們在他的罪上與他聯合。我們在他的罪性上與亞當聯合。我們每個人都是生來帶有罪性，想要自己的方式，不要上帝的方式。亞當的罪將死亡帶入世界，我們就在死亡上與亞當聯合。</p><p>如果我們想要得救，我們就必須與基督聯合。祂完全順服的生命必須成為我們的生命。祂為罪受死，也必須成為我們的死。祂對死的得勝，也必須成為我們的得勝。請讀哥林多後書5:17。信心使我們與基督聯合。</p><blockquote><p><strong>哥林多後書5:17</strong><br>若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。</p></blockquote>"},{"day":2,"html":"<p class=\"read-prompt\">請讀希伯來書11:6。</p><blockquote><p><strong>希伯來書11:6</strong><br>人非有信，就不能得 神的喜悅；因為到 神面前來的人，必須信有神，且信他賞賜那尋求他的人。</p></blockquote><p>我們必須有信心，才能得上帝的喜悅。請讀羅馬書8:8。</p><blockquote><p><strong>羅馬書8:8</strong><br>而且屬肉體的人不能得 神的喜歡。</p></blockquote><p>被罪性控制的人不能得上帝的喜悅。我們自己，不會有上帝喜悅的信心。我們沒有辦法相信耶穌，與祂聯合。如果我們不能靠自己有信心，那麼信心從哪裡來呢？請讀以弗所書2:8-9。信心是上帝給祂百姓的恩賜。</p><blockquote><p><strong>以弗所書2:8-9</strong><br>你們得救是本乎恩，也因著信。這並不是出於自己，乃是 神所賜的；<br>也不是出於行為，免得有人自誇。</p></blockquote><p>聖父上帝賜下祂的兒子來救贖我們。聖子上帝活出完全順服的生命，並且為我們的罪受死。祂的順服和死，只是對於那些與祂聯合的人有效。只有那些信靠耶穌的人，才是與祂聯合的人。聖靈在上帝的百姓裡面產生信心，使他們能夠信耶穌，與祂聯合。</p>"},{"day":3,"html":"<p class=\"read-prompt\">請讀加拉太書2:20。</p><blockquote><p><strong>加拉太書2:20</strong><br>我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信 神的兒子而活，他是愛我，為我捨己。</p></blockquote><p>我們與基督聯合的一個方面，是在祂的死上。祂在十字架上受死，是上帝對罪的刑罰。當我們信靠耶穌，上帝看我們，就彷彿我們跟祂一同死在十字架上一樣。現在我們所有的罪都被一次性地懲罰了。當法官審訊罪犯的時候，他宣告罪犯有罪，並且告訴他將要為所犯的罪承擔什麼刑罰。請讀羅馬書8:1。</p><blockquote><p><strong>羅馬書8:1</strong><br>如今，那些在基督耶穌裡的就不定罪了。</p></blockquote><p>那些在基督裡的人，也就是與祂聯合的人，就不再定罪了。</p>"},{"day":4,"html":"<p>我們也在祂的生命與祂的復活上，與祂聯合。耶穌在世的一生，都完全遵行了父的旨意。藉著信，祂的完全的義，就成了我們的義。請讀哥林多後書5:21。</p><blockquote><p><strong>哥林多後書5:21</strong><br>神使那無罪的，替我們成為罪，好叫我們在他裡面成為 神的義。</p></blockquote><p>正如耶穌從死裡復活，將來我們的身體也會從死裡復活。請讀哥林多前書15:22。</p><blockquote><p><strong>哥林多前書15:22</strong><br>在亞當裡眾人都死了；照樣，在基督裡眾人也都要復活。</p></blockquote><p>藉著信心，我們也在聖潔的新生命上與基督聯合。耶穌整個一生都尋求上帝的喜悅。當我們與祂聯合的時候，我們也追求祂所追求的。住在我們裡面的聖靈，會賜給我們能力來愛慕上帝的旨意，並尋求在我們的生活中遵行它。請讀羅馬書6:4-7。</p><blockquote><p><strong>羅馬書6:4-7</strong><br>所以我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。<br>我們若在他死的形狀上與他聯合，也要在他復活的形狀上與他聯合。<br>因為知道我們的舊人和他同釘十字架，使罪身滅絕，叫他們不再作罪的奴僕，<br>因為已死的人是脫離了罪。</p></blockquote>"},{"day":5,"html":"<p>犯罪抵擋上帝是有後果的。亞當藉著他的悖逆，該承受這些後果。亞當所有的後代，藉著出生與亞當聯合，他們都經歷這些後果——悲傷、痛苦、死亡，還有上帝的憤怒。公義和順服也有結果：那就是上帝的賜福、眷顧、永生，還有永遠的喜樂和平安。耶穌藉著祂完美的義行，贏得了這些福分。凡在耶穌裡的信徒，凡藉著信與基督聯合的人，將經歷順服的賞賜。請讀以弗所書1:3和以弗所書2:6-7。</p><blockquote><p><strong>以弗所書1:3</strong><br>願頌讚歸與我們主耶穌基督的父 神！他在基督裡曾賜給我們天上各樣屬靈的福氣。</p><p><strong>以弗所書2:6</strong><br>他又叫我們與基督耶穌一同復活，一同坐在天上，</p><p><strong>以弗所書 2:7</strong><br>要將他極豐富的恩典，就是他在基督耶穌裡向我們所施的恩慈，顯明給後來的世代看。</p></blockquote>"},{"day":6,"html":"<p>我們與基督聯合的另一個方面，就是在祂的榮耀上與祂聯合。聖經告訴我們，當祂再來的時候，我們將與祂同享榮耀。當祂統管萬有的時候，我們也與祂一同作王。請讀歌羅西書3:4。</p><blockquote><p><strong>歌羅西書3:4</strong><br>基督是我們的生命，他顯現的時候，你們也要與他一同顯現在榮耀裡。</p></blockquote><p>基督徒是與基督聯合的人。他們在祂的死、祂的生命、祂的復活以及祂的榮耀上，與祂聯合。他們藉著信心與基督聯合，他們的信心是來自於聖靈。</p>"}]},{"num":31,"title":"有效的恩召是什麼？","answer":"有效的恩召是上帝的靈所作的工，使我們覺悟自己的罪惡和苦況，光照我們的心使我們認識基督，並更新我們的意志，勸服我們，使我們能接受在福音中白白賜給我們的耶穌基督。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-9","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀（或背誦）約翰福音3:16。</p><blockquote><p><strong>約翰福音3:16</strong><br>神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不至滅亡，反得永生。</p></blockquote><p>這節經文說，那些信上帝兒子的人會得什麼？如果他們沒有信耶穌的話，他們會怎麼樣？根據這節經文，上帝為什麼賜下祂的兒子？誰會永生？</p><p>上帝的愛如此之大，以至於祂賜下祂的獨生子。要想不至滅亡，反得永生，人只需要信靠耶穌。那麼為什麼不是每個人都信耶穌呢？答案就是，因為他們的罪，人們不能信靠基督來救他們。犯罪對我們來說是很自然的事。而遵行上帝的話——比如信靠耶穌得永生——對我們來說卻是不自然的。在福音中，上帝把耶穌基督白白地賜給我們作救主。如果讓我們自己選擇，我們就不可能接受祂。上帝透過有效的恩召，確保祂所有的百姓都能接受耶穌基督。</p>"},{"day":2,"html":"<p>要吃飯了，母親站在門口，大聲叫正在院子裡玩耍的孩子們，「開飯嘍！」孩子們可能會聽媽媽的話回家，還有可能他們不聽。這是一種呼召。但這不是「有效的呼召」。「有效」的意思是帶來結果，促使事情發生。在有效的呼召中，上帝呼召人來信福音中所賜的耶穌基督。同時，上帝會實際地促使那個人做上帝呼召他做的事。聖靈有效地呼召上帝的選民，叫他們以信心回應福音。請讀帖撒羅尼迦後書2:13-14。</p><blockquote><p><strong>帖撒羅尼迦後書2:13-14</strong><br>主所愛的弟兄啊，我們該常為你們感謝 神，因為他從起初揀選了你們，叫你們因信真道，又被聖靈感動，成為聖潔，能以得救。<br>神藉我們所傳的福音召你們到這地步，好得著我們主耶穌基督的榮光。</p></blockquote>"},{"day":3,"html":"<p>想象一下，你正在游泳遊得正歡，這時過來一個怕水的人。他看你在泳池裡，大喊「我來救你！我來救你！」把你拖出水。你會感激他的行為嗎？當然不會啦。你不需要被救，因為你玩得正歡呢。</p><p>上帝把祂的兒子賜給人救他們脫離罪惡。如果人們不相信自己身處險境需要被救，那麼人們就看不到他們需要一位救主。如果讓我們自己選擇，我們永遠不會轉向基督來救我們脫離罪惡，因為我們自己看不到我們需要一位救主。我們享受上帝稱為「罪」的那些事情。我們不把罪看成是危險的，反倒看成是享受。請讀約翰福音3:19。</p><blockquote><p><strong>約翰福音3:19</strong><br>光來到世間，世人因自己的行為是惡的，不愛光倒愛黑暗，定他們的罪就是在此。</p></blockquote><p>人們在意識到自己沒有基督是多麼邪惡、多麼可憐之後，才會懇求耶穌救他們脫離罪惡。在有效的呼召中，聖靈所作的一件事就是，使我們相信，我們是可憐的罪人，需要一位救主。請讀約翰福音16:7-8中耶穌對門徒所說關於聖靈的事。</p><blockquote><p><strong>約翰福音16:7-8</strong><br>然而我將真情告訴你們，我去是與你們有益的。我若不去，保惠師就不到你們這裡來；我若去，就差他來。<br>他既來了，就要叫世人為罪、為義、為審判，自己責備自己。</p></blockquote>"},{"day":4,"html":"<p>即使人們明白自己有罪，需要被救，這也是不夠的。他們必須明白如何能夠得救。在全世界的人類歷史中間，人們發明了許多與上帝和好的方式。但是因為人的思想有罪，無論怎樣挖空心思也沒辦法弄明白如何得救。那是因為，他的理性都是有罪的，不能理解屬靈的真理。請讀哥林多前書2:14。</p><blockquote><p><strong>哥林多前書2:14</strong><br>然而，屬血氣的人不領會 神聖靈的事，反倒以為愚拙，並且不能知道，因為這些事惟有屬靈的人才能看透。</p></blockquote><p>屬血氣的人以為上帝聖靈的事情是愚拙的。請讀哥林多前書2:12。</p><blockquote><p><strong>哥林多前書2:12</strong><br>我們所領受的，並不是世上的靈，乃是從 神來的靈，叫我們能知道 神開恩賜給我們的事。</p></blockquote><p>如果人們不相信耶穌能救他們脫離罪惡，他們就不會信靠耶穌來救他們脫離罪惡。這世界的假神（撒但）想方設法阻止人們明白耶穌是誰。請讀哥林多後書4:4。</p><blockquote><p><strong>哥林多後書4:4</strong><br>此等不信之人，被這世界的 神弄瞎了心眼，不叫基督榮耀福音的光照著他們。基督本是 神的像。</p></blockquote><p>在有效的呼召中，聖靈向我們顯明，我們需要一位救主。祂也光照我們的思想。祂讓我們明白，上帝已經賜下一位救我們脫離罪惡，那位救主就是耶穌。請讀哥林多後書4:6。</p><blockquote><p><strong>哥林多後書4:6</strong><br>那吩咐光從黑暗裡照出來的 神，已經照在我們心裡，叫我們得知 神榮耀的光，顯在耶穌基督的面上。</p></blockquote>"},{"day":5,"html":"<p>昨天，我們看到，我們有罪的思想需要聖靈幫助，才能理解上帝所賜的救恩。那也意味著，我們有罪的意志需要聖靈。如果我們自己選擇，我們永遠不會選擇取悅上帝的事。請讀約翰福音5:39-40。</p><blockquote><p><strong>約翰福音5:39-40</strong><br>你們查考聖經，因你們以為內中有永生；給我作見證的就是這經。<br>然而你們不肯到我這裡來得生命。</p></blockquote><p>耶穌是對那些不信祂的猶太人說這些話。這些猶太人查考聖經，聖經清楚地教導耶穌是救主。但是這些猶太人卻不肯到祂那裡去。我們有罪的意志必須被更新。它需要被轉變，能夠選擇信靠基督，把祂作為主來侍奉。在有效的呼召中，聖靈更新我們的意志，使我們能夠選擇順服上帝的命令，信靠耶穌。請讀羅馬書8:5-6。</p><blockquote><p><strong>羅馬書8:5-6</strong><br>因為隨從肉體的人，體貼肉體的事；隨從聖靈的人，體貼聖靈的事。<br>體貼肉體的就是死；體貼聖靈的乃是生命平安。</p></blockquote>"},{"day":6,"html":"<p>聖靈勸服上帝的百姓信靠耶穌。知道這一點很重要。那些講道的人，或者教導的人，就可以知道人信不信基督，不在於他們講得多麼好。如果有人想「那個人可能上不了天堂，因為我剛才講得不夠好。」，那真的是很可怕的事。其實不是講員，而是聖靈勸服人信耶穌。而且，既然聖靈是勸服人的那一位，我們可以放心，上帝的百姓一個也不會丟在天國的外面。聖靈會供應所需的，聖靈會在人心裡動工，儘管講福音的人可能不是非常出色的講員。</p><p>那些信耶穌的人，並沒有什麼功勞，以為自己幫助拯救自己了。那些跟他們講福音的人也在拯救的事情上沒有功勞。任何人得救，該把所有的頌讚，所有的榮耀都單單歸給上帝。請讀哥林多前書2:4-5。</p><blockquote><p><strong>哥林多前書2:4-5</strong><br>我說的話，講的道，不是用智慧委婉的言語，乃是用聖靈和大能的明證，<br>叫你們的信不在乎人的智慧，只在乎 神的大能。</p></blockquote>"}]},{"num":32,"title":"蒙了有效恩召的人，在今生所領受的恩福有哪些？","answer":"蒙了有效恩召的人，確實得以在今生領受：稱義、得兒女名分、成聖、以及其他在今世與此相伴而來、隨之而來的福分。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-10","days":[{"day":1,"html":"<p>如果你已經信靠耶穌來救你，你就已經領受了某些福分。福分就是使你更幸福的事。常常，我們會贏取一些好處。（如果這周能把所有作業交上來，你週五就可以晚睡半個小時。）有時候，我們買到一些好處。（如果你買了水上公園的全天通票，你可以在當天隨意玩所有的滑梯。）</p><p>當我們蒙有效恩召的時候，我們領受的福分是白白賜給我們的！聖父上帝在我們出世之前很久，就計劃賜給我們這些福分。這些福分必須用代價買，不過聖子上帝已經用祂的血為我們買了。聖靈將這些福分實施在我們身上。這些福分，不僅使他們去世到天上去的時候享受，而且就在今生也使我們更幸福。請讀以弗所書1:3-8。</p><blockquote><p><strong>以弗所書1:3-8</strong><br>願頌讚歸與我們主耶穌基督的父 神！他在基督裡曾賜給我們天上各樣屬靈的福氣。<br>就如 神從創立世界以前，在基督裡揀選了我們，使我們在他面前成為聖潔，無有瑕疵。<br>又因愛我們，就按著自己旨意所喜悅的，預定我們藉著耶穌基督得兒子的名分，<br>使他榮耀的恩典得著稱讚。這恩典是他在愛子裡所賜給我們的。<br>我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。<br>這恩典是 神用諸般智慧聰明，充足足夠賞給我們的。</p></blockquote>"},{"day":2,"html":"<p>我們身上最大的問題就是，我們是罪人，而上帝卻是聖潔的。我們必須用某種方式除掉我們的罪，與上帝和好。稱義是上帝對這個問題的解決方式。在稱義中，上帝赦免我們的罪，因為耶穌已經為之受罰。在稱義中，上帝把耶穌完美生命的義算作我們的義，彷彿我們自己曾經活過完美的生命一樣。</p><p>如果我們自己能守上帝的律法，我們就是義的，我們就會為自己贏取永生了。請讀加拉太書3:21下-22。</p><blockquote><p><strong>加拉太書3:21-22</strong><br>若曾傳一個能叫人得生的律法，義就誠然本乎律法了。<br>但聖經把眾人都圈在罪裡，使所應許的福因信耶穌基督歸給那信的人。</p></blockquote><p>我們不能守住上帝聖潔的律法，因為我們都是罪的俘虜。上帝的律法向我們顯明，我們自己不可能與上帝和好。上帝的律法是引導我們到耶穌面前，讓我們信靠祂來為我們做一切所需要做的。然後我們可以得到赦免，宣告與上帝和好了。請讀加拉太書3:24。</p><blockquote><p><strong>加拉太書3:24</strong><br>這樣，律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。</p></blockquote>"},{"day":3,"html":"<p>上帝創造我們，為要我們認識祂、愛祂、榮耀祂。因為罪，我們生來都作了上帝的敵人。所以我們面對另一個嚴重的問題就是，我們無法認識我們受造者應該認識的那一位。我們與祂隔絕了，無法成為我們被造者應有的那樣。對我們來說，為著享受而活，為了發財而活，為了出名而活，或者為了愛人而活，都是不夠的。</p><p>我們受造是為了比這些更高的目的。我們被造，是為了認識上帝、愛上帝。我們蒙有效恩召的一福分就是，我們開始能夠認識上帝了。上帝對我們真好，我們現在認識祂的方式，不同於生物認識它們的造物主。那些已經蒙耶穌基督救贖的人們，是認識父那樣認識上帝的。那麼美妙的事情啊！雖然我們犯罪得罪造我們的主，使我們成為祂的仇敵，可是祂救贖我們，不僅讓我們作祂的僕人——更是接納我們作祂的兒女！我們本來無法認識祂，這個難題由上帝解決了，就是接納我們成為兒女。請讀約翰一書3:1。</p><blockquote><p><strong>約翰一書3:1</strong><br>你看父賜給我們是何等的慈愛，使我們得稱為 神的兒女！我們也真是他的兒女。世人所以不認識我們，是因未曾認識他。</p></blockquote>"},{"day":4,"html":"<p>因為罪，我們還要面對另一個問題：我們不能取悅上帝，或者說順服上帝。上帝創造人的時候，有能力順服上帝。亞當可以選擇行善或者行惡。可是亞當一犯罪，就失去了取悅上帝、順服上帝的可能。人們仍然可以做一些事情，讓別人看著是好的，但是他們做這些事情就是為了取悅他人，或者為了自我感覺良好。真正的義，只是為上帝而做，對於那些沒有蒙有效恩召的人來說是不可能的。</p><p>上帝對我們這個問題的解決方式就是成聖。聖靈改變蒙有效恩召之人的內心，叫他們渴慕並遵行上帝喜悅的事。聖經把這種改變的內心稱作「新人」。成聖的一部分就是得著一個渴慕聖潔的新人。同時，上帝的百姓仍然有過去舊的生活方式殘留下來的罪。聖經告訴我們，直到我們去天堂之前，我們都得與我們裡面殘留的罪爭戰。當我們安抵天家，我們裡面將沒有任何殘留的罪來攪擾我們了。同時，聖經告訴我們，要善用上帝賜下來幫助我們的那些事物。如果我們照做，上帝應許我們，聖靈會使我們在今生就能越來越像耶穌。成聖的另一個部分就是長成為基督的樣式。請讀哥林多後書3:18。</p><blockquote><p><strong>哥林多後書3:18</strong><br>我們眾人既然敞著臉得以看見主的榮光，好像從鏡子裡返照，就變成主的形狀，榮上加榮，如同從主的靈變成的。</p></blockquote>"},{"day":5,"html":"<p>有時候聽人們談話，彷彿死後上天堂成了信耶穌的主要理由。聖經告訴我們，天堂當然是美好的，比我們能想象的任何地方都好。但是正如這周問答指出的，信耶穌的福分是從今生開始的，不是死後才開始。</p><p>因為人們的罪性，因為撒但設法要勾引人們，非基督徒忙於工作、忙於享樂。他們不會停下來想一想，因為撒但多麼可憐。那些享受不到稱義（被上帝宣告無罪）之福的人，時刻揹負著沉重的罪債。如果他們誠實面對自己，他們知道他們做了許多傷害自己、傷害別人、得罪上帝的事。離開基督，他們沒法處理掉這些事情，也無法被赦免。</p><p>沒有享受到神兒女福分的人，是與上帝還沒有關係的人。這樣的生活方式是孤獨的，因為全世界最好的朋友和家人也不能代替與上帝的關係，這種關係是我們受造的目的之一。沒有享受到成聖（上帝叫我們能在聖潔中不斷成長）之福的人，根本無法順服上帝，無法照著被造時的目的去生活。在今生，有效恩召的福分帶來喜樂、平安和生命的滿足，這都是非基督徒無法體會的。請讀詩篇16:11。</p><blockquote><p><strong>詩篇16:11</strong><br>你必將生命的道路指示我；在你面前有滿足的喜樂，在你右手中有永遠的福樂。</p></blockquote>"},{"day":6,"html":"<p>在聖經裡有兩個叫掃羅的人。如果我們比較一下，就會發現有效恩召帶來的不同。舊約的掃羅是個國王。他住在皇宮，要什麼有什麼。當他下令的時候，大家就都得順服。新約的掃羅成了使徒保羅。他生活艱辛，常常缺少他日常需要的基本物質。他被棍打、被石頭打、被監禁，被不喜歡他的人趕出城。</p><p>我們很自然地會以為，哪一個掃羅會更滿足呢？當然是國王掃羅了。不過，事實不是這樣。聖靈有效地呼召了新約的掃羅。這個掃羅被稱義，他歡喜快樂，因為他的罪得赦免。他被聖父上帝接納為兒子，他知道，無論他有多少仇敵，他都是上帝的兒子，上帝會一直愛他。這個掃羅得成聖之福，能夠一生侍奉上帝、效法基督。</p><p>反觀國王掃羅，他是一個易怒、苦毒的人，根本沒有平安。甚至有鬼魔來攪擾他。他一生多數時間悖逆上帝，死的時候也明知與上帝為敵，他沒有盼望。我們這些已經得蒙有效恩召之福的人，不該以為我們比別人強，因為我們在得救的事上毫無功勞；是上帝做了一切。我們應當何等地感恩，上帝救了我們，白白地賜給我們這些福分。請讀以弗所書2:12-13。</p><blockquote><p><strong>以弗所書2:12-13</strong><br>那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有 神。<br>你們從前遠離 神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了。</p></blockquote>"}]},{"num":33,"title":"稱義是什麼？","answer":"稱義是上帝白白恩典的行動，在其中上帝赦免我們一切的罪惡，接納我們在祂面前為義人，這唯獨因基督的義歸算給我們，而我們只是憑信心接受而已。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-10","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀羅馬書3:22-24。</p><blockquote><p><strong>羅馬書3:22-24</strong><br>就是 神的義，因信耶穌基督加給一切相信的人，並沒有分別。<br>因為世人都犯了罪，虧缺了 神的榮耀；<br>如今卻蒙 神的恩典，因基督耶穌的救贖，就白白地稱義。</p></blockquote><p>人在上帝眼中看為義，這對於人來說是很重要的。人沒有完全的義，就不能夠站在上帝面前。這些經節告訴我們，我們惟有信靠基督為我們提供的義，我們才領受了上帝能接納的義。我們誰也不能把我們的義放在上帝面前。稱義（上帝赦免我們的罪，算我們是義人）是上帝白白恩典的作為。意思是說，我們無法為自己贏得。上帝藉著祂的恩典賜給我們的任何東西，都是我們不配得的東西，而是祂單單定意要賜給我們的。</p><p>當上帝稱我們為義的時候，祂並沒有忽視我們的罪。祂從來不會對罪說「哦，算了，沒事沒事。」上帝總是聖潔公義的，祂總是要懲罰所有的罪惡。上帝可以稱我們為義，是因為耶穌替我們死了，上帝可以稱我們為義，在懲罰犯罪方面也仍然是完全公義的。請讀羅馬書3:25-26。</p><blockquote><p><strong>羅馬書3:25-26</strong><br>神設立耶穌作挽回祭，是憑著耶穌的血，藉著人的信，要顯明 神的義。因為他用忍耐的心，寬容人先時所犯的罪，<br>好在今時顯明他的義，使人知道自己為義，也稱信耶穌的人為義。</p></blockquote>"},{"day":2,"html":"<p>稱義有兩個重要的方面。第一方面就是赦免我們犯過的所有罪。聖經告訴我們，我們犯罪的時候，就是在得罪上帝。儘管我們的罪是在傷害他人，我們仍然是得罪上帝。祂創造我們，給我們律法，叫我們照著生活。在上帝面前，我們每個人都像是在法院裡面，站在法官面前的罪犯，他手裡面有長長的單子，列出我們犯的所有罪孽。當上帝赦免我們的罪，祂不是將我們所做的一筆勾銷而已。祂不是說，我們沒犯過罪。赦免我們的罪，就是不再用它來審判我們。我們不再需要它付出代價。我們不必承受得罪上帝應受的刑罰。上帝已經赦免了我們的罪，因為耶穌已經承擔了我們所有當受的刑罰。沒有剩下什麼需要我們來償付的。請讀詩篇32:1-2。</p><blockquote><p><strong>詩篇32:1-2</strong><br>得赦免其過、遮蓋其罪的，這人是有福的！<br>凡心裡沒有詭詐、耶和華不算為有罪的，這人是有福的！</p></blockquote>"},{"day":3,"html":"<p>雖然上帝已經赦免了我們的罪，為了與上帝和好，還需要一樣。我們需要成為義人。上帝不會僅僅因為一個人沒犯罪就高興了。只有遵行了上帝所命令的一切公義的行為，而且一次也不違背，才能使上帝喜悅。我們永遠無法像上帝要求的那樣完全地公義。</p><p>稱義的第二個重要的部分就是，在上帝眼中，祂看我們為義人。我們沒有遵行上帝的要求，但是我們已經信靠祂的兒子。上帝把耶穌的義算作我們的，就彷彿我們曾經活出祂那樣完全順服的生活。請讀羅馬書4:3-5。</p><blockquote><p><strong>羅馬書4:3-5</strong><br>經上說什麼呢？說：「亞伯拉罕信 神，這就算為他的義。」<br>做工的得工價，不算恩典，乃是該得的；<br>惟有不做工的，只信稱罪人為義的 神，他的信就算為義。</p></blockquote>"},{"day":4,"html":"<p>我們一點兒也不公義，那麼上帝怎麼能看我們是義人呢？這唯獨因基督的義歸算給我們。想象一下，你需要許多錢買一樣重要的東西。不過，你不僅沒有許多錢，反而債臺高築。你的朋友，他辛苦多年，在銀行裡攢了不少錢。他很同情你，主動幫你付了欠款。現在你不欠債了。這就像是耶穌以祂十字架上的捨命來付了我們的罪債。現在我們不再因為得罪上帝而虧欠上帝了。</p><p>不過，雖然你朋友為你還了債，但是不意味著你已經解決了你的問題。你還是需要很多錢，而你卻身無分文。於是你的朋友又為你做了一件事。他將你的名字加在他的戶頭上，這樣你也可以使用他所有的錢。這就像是耶穌替我們活出完全順服上帝的生命。祂是義人。祂是順服的那一位，不過祂所有的義都算作我們的了。上帝把耶穌的義算作是我們的義。請讀哥林多後書5:21。</p><blockquote><p><strong>哥林多後書5:21</strong><br>神使那無罪的，替我們成為罪，好叫我們在他裡面成為 神的義。</p></blockquote>"},{"day":5,"html":"<p>我們單憑信心，領受上帝賜給我們的稱義。許多人以為，他們必須得做點什麼才能與上帝和好——聚會、幫補窮人、行善。還有人說，他們信耶穌，但是還是必須做一些事情才能使他與上帝和好。聖經清楚地教導說，我們稱義所需要做的就是用信心領受上帝賜給我們的。祂已經赦免了我們的罪，祂已經因祂兒子完全的義而宣告我們為義人。我們不可以在耶穌的作為之外再加上任何東西。我們單單靠信心相信，祂已經確實做成了一切。沒有人可以誇口自己有多麼好。我們每個人都是單憑信心領受稱義之福，而不是藉著我們自己的善行或是我們自己對上帝律法的順服。請讀羅馬書3:27-28。</p><blockquote><p><strong>羅馬書3:27-28</strong><br>既是這樣，哪裡能誇口呢？沒有可誇的了！用何法沒有呢？是用立功之法嗎？不是，乃用信主之法。<br>所以我們看定了：人稱義是因著信，不在乎遵行律法。</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀撒迦利亞書3:1-5。</p><blockquote><p><strong>撒迦利亞書3:1-5</strong><br>天使又指給我看，大祭司約書亞站在耶和華的使者面前，撒但也站在約書亞的右邊，與他作對。<br>耶和華向撒但說：「撒但哪，耶和華責備你，就是揀選耶路撒冷的耶和華責備你，這不是從火中抽出來的一根柴嗎？」<br>約書亞穿著汙穢的衣服，站在使者面前。<br>使者吩咐站在面前的說：「你們要脫去他汙穢的衣服。」又對約書亞說：「我使你脫離罪孽，要給你穿上華美的衣服。」<br>我說：「要將潔淨的冠冕戴在他頭上。」他們就把潔淨的冠冕戴在他頭上，給他穿上華美的衣服，耶和華的使者在旁邊站立。</p></blockquote><p>這段描述了舊約先知撒迦利亞的異象。這個異象描繪了上帝稱祂百姓為義的時候，為祂百姓做什麼。這個約書亞不是那個領軍攻打耶利哥的約書亞。這個約書亞是以色列的一個大祭司。這意味著，他代表著上帝的百姓。在撒迦利亞的異象中，他看見約書亞穿著汙穢的衣服。</p><p>這也是我們這些上帝百姓在罪中的景象。在異象中，上帝的使者脫去約書亞汙穢的衣服，說：「我使你脫離罪孽。」在舊約中，當「主的使者」顯現的時候，就是成為肉身之前的聖子上帝。所以說，是主耶穌基督脫去了祂百姓的罪孽。但是主的使者為約書亞所做的還不止這些。他還給他穿上乾淨華美的衣服。耶穌不僅脫去祂百姓的罪，而且把自己的義也賜給了他們。</p>"}]},{"num":34,"title":"得兒女名分是什麼？","answer":"得兒女名分是神白白恩典的行動，藉此我們被收納為神的兒女，使得我們有權柄，享受神兒女的一切特別權益。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-10","days":[{"day":1,"html":"<p>人犯罪之前，屬於上帝。人墮落之後，人仍然屬於上帝。不過，上帝不喜悅他了。罪人與上帝的關係只能是懼怕。每當上帝有效地呼召一個人，這種關係就發生轉變了。上帝收納那個人為兒女。上帝有效呼召的人都以上帝為父。（許多人喜歡說，上帝是全人類的父，但是聖經教導說只有那些信耶穌基督的人可以稱上帝為父）請讀約翰一書 3:1-2。</p><blockquote><p><strong>約翰一書 3:1</strong><br>你看父賜給我們是何等的慈愛，使我們得稱為　神的兒女！我們也真是他的兒女。世人所以不認識我們，是因未曾認識他。</p></blockquote><blockquote><p><strong>約翰一書 3:2</strong><br>親愛的弟兄啊，我們現在是　神的兒女，將來如何，還未顯明；但我們知道，主若顯現，我們必要像他，因為必得見他的真體。</p></blockquote><p>上帝沒有照著我們當受的懲罰來懲罰我們，已經非常有恩典了。祂還稱我們為義，救我們脫離罪惡。不僅如此，祂如此愛我們，甚至還收納我們為祂的兒女，作我們的父！</p>"},{"day":2,"html":"<p>能夠稱自己是上帝的兒女，稱上帝為我們的父，這是多麼美好的事啊。另外，我們還擁有作為上帝兒女的特別權益。比如，我們不再需要懼怕上帝。當然我們一直應該有聖經所說的對上帝的敬畏，是那種讓我們顯出尊重，謹慎不犯罪的那種敬畏。但是我們不必再懼怕上帝。我們不必怕祂不愛我們了，或者我們一犯罪就怕祂懲罰我們。人世間有好爸爸，有壞爸爸。上帝就像人類裡面最好最好的爸爸，甚至還更好。請讀羅馬書 8:15。</p><blockquote><p><strong>羅馬書 8:15</strong><br>你們所受的不是奴僕的心，仍舊害怕；所受的乃是兒子的心，因此我們呼叫：「阿爸，父！」</p></blockquote><p>這節經文說，我們叫上帝「阿爸」。「阿爸」在新約時代就是爸爸的意思。上帝的兒女與他們的父上帝之間有最近最親的關係。</p>"},{"day":3,"html":"<p>我們不再需要因為我們的罪懼怕刑罰。那不是說，上帝就會任憑我們犯罪。好父母不會允許兒女無法無天而不加以約束。好父母會管教不聽話的孩子或者犯傻的孩子，為了要訓練他們舉止得體。上帝是最好的父親。當然，祂會在必要的時候，管教祂的兒女。</p><p>有時候我們做錯事，之後就吃苦頭。這是上帝管教我們的一種方式。有時候，我們並沒有做什麼犯罪的事，但是卻仍經歷患難。上帝使用患難來操練我們，叫我們成為祂想讓我們成為的樣式。這也是祂的管教。一般來說，我們不會把艱難的經歷看成是特權，但是對於上帝的兒女來說，它們就是特權。我們作為上帝兒女的一個特權就是，知道我們的父不會允許我們為所欲為。相反，祂會管教我們，叫我們長成智慧充足的基督徒。請讀希伯來書 12:5-10。</p><blockquote><p><strong>希伯來書 12:5</strong><br>你們又忘記了那勸你們如同勸兒子的話，說：「我兒，你不可輕看主的管教，被他責備的時候，也不可灰心。」</p></blockquote><blockquote><p><strong>希伯來書 12:6</strong><br>因為主所愛的，他必管教，又鞭打凡所收納的兒子。」</p></blockquote><blockquote><p><strong>希伯來書 12:7</strong><br>你們所忍受的，是　神管教你們，待你們如同待兒子。焉有兒子不被父親管教的呢？</p></blockquote><blockquote><p><strong>希伯來書 12:8</strong><br>管教原是眾子所共受的，你們若不受管教，就是私子，不是兒子了。</p></blockquote><blockquote><p><strong>希伯來書 12:9</strong><br>再者，我們曾有生身的父管教我們，我們尚且敬重他；何況萬靈的父，我們豈不更當順服他得生嗎？</p></blockquote><blockquote><p><strong>希伯來書 12:10</strong><br>生身的父都是暫隨己意管教我們；惟有萬靈的父管教我們，是要我們得益處，使我們在他的聖潔上有分。</p></blockquote>"},{"day":4,"html":"<p>好的父母，他們的兒女有一個特權，就是父母會供應兒女的需要。好的父母會確保兒女的需要能得著滿足。上帝是最好的父親。祂應許看顧祂的兒女，供應他們的需要。</p><p>兒女有權分享父母擁有的東西。我們把這個稱為繼承權。如果父母去世，他們沒有留下遺囑作出其它安排，那麼他們的兒女自動地就繼承或領受原來屬於父母的一切。當然，我們的父上帝永遠不會死。但是祂稱我們為祂的後嗣，或者說承受祂產業的人。耶穌是上帝的親兒子，是被生的，而不是被收納的。現在上帝已經收納我們進入祂的家，我們就與耶穌同為後嗣。有一天，屬於耶穌的榮耀以及所有屬靈的福氣，祂都會與我們分享。請讀羅馬書 8:16-17。</p><blockquote><p><strong>羅馬書 8:16</strong><br>聖靈與我們的心同證我們是　神的兒女；</p></blockquote><blockquote><p><strong>羅馬書 8:17</strong><br>既是兒女，便是後嗣，就是　神的後嗣，和基督同為後嗣。如果我們和他一同受苦，也必和他一同得榮耀。</p></blockquote>"},{"day":5,"html":"<p>被上帝收納為兒女，是一件好事，有豐豐富富的特權。當我們有特權的時候，我們通常也會有責任。上帝的兒女也有責任。我們的一個責任就是，要成為上帝要我們成為的樣式。當祂使我們成為祂的兒女，不是說我們就可以悠然自得地享受作兒女的特權。請讀羅馬書 8:28-29。</p><blockquote><p><strong>羅馬書 8:28</strong><br>我們曉得萬事都互相效力，叫愛　神的人得益處，就是按他旨意被召的人。</p></blockquote><blockquote><p><strong>羅馬書 8:29</strong><br>因為他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子在許多弟兄中作長子。</p></blockquote><p>經文告訴我們，上帝揀選我們呼召我們作祂的兒女，有一個目的，就是要我們更像祂的獨生子耶穌。</p>"},{"day":6,"html":"<p>聖經告訴我們，上帝兒女效法耶穌的一個特別的方面就是效法祂的愛。聖經說，如果我們說我們是上帝的兒女，我們也會愛上帝其他的兒女。我們不會只愛那些愛起來比較容易的人。因為上帝是我們的父，也是他們的父，我們要愛上帝家裡的每一個人。聖經還說，如果我們恨（不愛）弟兄姐妹的話，我們說我們是上帝的兒女，就是在說謊。</p><p>我們效法耶穌的另一個方面，就是在公義的生活方面。上帝恨惡罪惡。祂的兒女不可活在罪中。那不是說，上帝的兒女就是完美的。不過，當他們犯罪的時候，他們會悔改，會竭力避免重犯。持續活在罪中，拒絕悔改的人，就是聖經所說的，不是上帝真正的兒女。請讀約翰一書 3:10。</p><blockquote><p><strong>約翰一書 3:10</strong><br>從此就顯出誰是　神的兒女，誰是魔鬼的兒女。凡不行義的就不屬神，不愛弟兄的也是如此。</p></blockquote>"}]},{"num":35,"title":"成聖是什麼？","answer":"成聖是上帝白白恩典的工作，藉此我們全人被更新，恢復上帝的形像；並且使我們得能力，愈來愈向罪死，向義活。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-10","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀哥林多前書 6:11。</p><blockquote><p><strong>哥林多前書 6:11</strong><br>你們中間也有人從前是這樣；但如今你們奉主耶穌基督的名，並藉著我們　神的靈，已經洗淨、成聖、稱義了。</p></blockquote><p>上帝拯救我們時為我們做了一件事，是在我們裡面做的，就是使我們成聖。成聖有兩個意思。第一，是為著特殊的目的留出來。上帝以祂兒子的血買贖了我們。我們屬於祂，祂在我們身上有祂的目標，祂想讓我們成為聖潔，如同祂是聖潔的。祂想讓我們像祂兒子主耶穌基督一樣。所以成聖的第一個意思就是，由上帝分別出來，目的是要成為聖潔。這是上帝拯救我們時，為我們一次成就的事。</p><p>成聖也意味著漸漸地更新一個人，直到他真的變得聖潔。當上帝使我們成聖的時候，祂把我們為了聖潔的目的分別出來，然後開始在我們有罪的內心裡面作工，更新我們。我們會越來越少罪惡，越來越多聖潔。上帝的成聖工作在信徒生命中持續一生之久。在今生不會結束的。在世上沒有一個人會變得完美無缺的。信徒越成長，就越應該像耶穌。當我們到了天堂，上帝會完成祂在我們裡面開始的成聖工作。在天上，我們永遠不會犯罪了，我們將完全順服上帝。</p>"},{"day":2,"html":"<p>上帝是按照祂自己的形像造人。在許多方面，我們仍能看見人裡面有上帝的形像。但是，同時，所有的人如今都是在亞當有罪的形像中出生的。藉著成聖，上帝使我們重新恢復祂的形像。罪不會從我們心裡完全消失。但是，現在我們裡面有個新人，願意做上帝所喜悅的事。那個新人會越來越強壯，而殘餘的罪會越來越無力。這就是成聖。我們的一切都被更新，都越來越像基督——我們的願望，我們的思想，我們的心志。</p><p>有時候，我們似乎完全無法除去罪惡的陋習。效法基督的新習慣如此難以養成。但是，成聖是上帝的工作。祂開了工就會完工。我們可以放心，上帝會不斷地在我們裡面作工，直到祂完成我們的成聖，直到我們成為聖潔，沒有瑕疵。請讀帖撒羅尼迦前書 5:23-24。</p><blockquote><p><strong>帖撒羅尼迦前書 5:23</strong><br>願賜平安的　神親自使你們全然成聖。又願你們的靈與魂並身子得蒙保守，在我主耶穌基督降臨的時候，完全無可指摘。</p></blockquote><blockquote><p><strong>帖撒羅尼迦前書 5:24</strong><br>那召你們的本是信實的，他必成就這事。</p></blockquote>"},{"day":3,"html":"<p>因為就連基督徒裡面仍有罪惡殘存，那麼我們發現，我們常常想要犯錯。因為上帝已經使我們成為祂的兒女，我們就有一個像基督的性情，想要做上帝喜悅的事。在我們的餘生中，我們裡面的罪和我們新的像基督的性情彼此相爭。有時候，我們非常想犯罪，那就需要非常大的力量才能抵制住它。</p><p>罪總是想大行其道。無論何時，當我們屈服了，犯罪了，我們就發現，我們根本不是像當初想象的那樣會享受它。那是因為，我們的新人想要取悅上帝，犯罪的時候就不可能平安。當上帝在我們裡面作工，使我們成聖的時候，我們裡面的罪，以及所有的惡習及慾望，會逐漸地削弱。我們聖潔的新性情會逐漸強壯，我們就會擁有新的像基督一般的心志。請讀以弗所書 4:22-24。</p><blockquote><p><strong>以弗所書 4:22</strong><br>就要脫去你們從前行為上的舊人，這舊人是因私慾的迷惑漸漸變壞的，</p></blockquote><blockquote><p><strong>以弗所書 4:23</strong><br>又要將你們的心志改換一新，</p></blockquote><blockquote><p><strong>以弗所書 4:24</strong><br>並且穿上新人，這新人是照著　神的形像造的，有真理的仁義和聖潔。</p></blockquote>"},{"day":4,"html":"<p>如同稱義和作上帝兒女一樣，成聖是上帝的作為。我們可能拼命要靠自己清除罪孽，卻永遠沒有辦法做到。我們可能每天拼命要效法耶穌，但是如果上帝不使我們成聖，那根本就會一無所成。成聖的工作是屬於聖靈上帝的。當上帝有效地呼召一個人，聖靈就來住在那個人的裡面。祂總是在每一個信徒裡面工作，使那個人愛慕基督，並且藉著效法基督來使祂喜悅。</p><p class=\"read-prompt\">請讀哥林多後書 3:18。</p><blockquote><p><strong>哥林多後書 3:18</strong><br>我們眾人既然敞著臉得以看見主的榮光，好像從鏡子裡返照，就變成主的形狀，榮上加榮，如同從主的靈變成的。</p></blockquote><p>聖經告訴我們，我們可以透過觀察我們的態度，來看聖靈是否在掌管我們。當我們顯出仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制，我們就是靠聖靈而活，不是靠著舊的罪惡情慾而活。（加拉太書 5:22-23）</p><blockquote><p><strong>加拉太書 5:22</strong><br>聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、</p></blockquote><blockquote><p><strong>加拉太書 5:23</strong><br>溫柔、節制。這樣的事，沒有律法禁止。</p></blockquote>"},{"day":5,"html":"<p>雖然上帝是在信徒裡面做成聖工作的那一位，但是，可不是說我們就可以無所事事了。上帝要求我們在成聖的事上與聖靈合作。我們必須每一天努力打破惡習，抵擋邪惡的心思。每一天我們必須尋求效法耶穌的榜樣，盡力去得神喜悅。因此，新約中充滿了給上帝百姓的各種教訓，關於如何生活，關於如何聖潔，關於如何愛神愛人。</p><p>上帝賜我們各種媒介，我們可以用來在成聖方面成長。讀經、禱告、在教會里聽道、與其他人共同敬拜這些都是上帝告訴我們在成聖方面成長需要做的。我們應該努力做上帝呼召我們做的事，但是我們絕對不可因為我們沒有願望中改變那麼快而灰心。我們知道，成聖是上帝的工作。祂會繼續在我們裡面工作，直到祂最終使我們完全。請讀腓立比書 2:12-13。</p><blockquote><p><strong>腓立比書 2:12</strong><br>這樣看來，我親愛的弟兄，你們既是常順服的，不但我在你們那裡，就是我如今不在你們那裡，更是順服的，就當恐懼戰兢，做成你們得救的工夫。</p></blockquote><blockquote><p><strong>腓立比書 2:13</strong><br>因為你們立志行事，都是　神在你們心裡執行，為要成就他的美意。</p></blockquote>"},{"day":6,"html":"<p>每一天，我們一再地想要犯罪，我們會有很強的犯罪欲。也許有人做事惹怒了我們，我們就想給他點兒顏色看看。也許我們知道了某人的什麼事情，雖然我們都知道不應該講出去，但是我們還是急切地想跟別人說。也許有個事情，我們知道它是錯的，但是我們卻以為做了會很快樂。當我們強烈地感到非做不可的時候，那就非常難以抵擋這些惡事。不去做我們想做的惡事，真是很難，連聖經都把這叫做「治死」邪情私慾。如果我們想要在成聖上成長，我們就得向自己死，不去做我們願意的惡。當我們受到犯罪的試探時，我們必須反覆地對自己說「不」。請讀歌羅西書 3:5。</p><blockquote><p><strong>歌羅西書 3:5</strong><br>所以要治死你們在地上的肢體，就如淫亂、汙穢、邪情、惡欲和貪婪，貪婪就與拜偶像一樣。</p></blockquote>"}]},{"num":36,"title":"在今生與「稱義、得兒女名分、成聖」相伴而來、隨之而來的恩福，有哪些？","answer":"在今生與「稱義、得兒女名分、成聖」相伴而來、隨之而來的恩福，就是確信神的愛、良心的平安、在聖靈中喜樂、在恩典中長進、蒙保守恆忍到底。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-10","days":[{"day":1,"html":"<p>上帝對待所有的受造物都是好的。不過，上帝特殊的愛只針對祂自己的百姓。罪已經將所有的人都變成了上帝的仇敵，他對人有憤怒。上帝的百姓跟其他人一樣有罪，但是上帝選擇了要愛他們。他不是因為他們好或者因為他們可愛，才愛他們。祂愛他們，只因為祂就是愛，祂定意要愛他們。</p><p>因為上帝愛祂的百姓，祂賜下祂的兒子替他們死，這樣祂就可以赦免他們的罪。因為上帝愛祂的百姓，祂稱他們為義——算他們是義人——因為祂的兒子曾替他們活出完全的公義。先知耶利米描述了上帝對祂子民的愛。請讀耶利米書 31:3。</p><blockquote><p><strong>耶利米書 31:3</strong><br>古時耶和華向以色列顯現說：「我以永遠的愛愛你，因此我以慈愛吸引你。</p></blockquote><p>上帝對祂百姓的愛是永遠的愛。如果你是上帝所收納的兒女，是被稱義了的兒女，你就可以放心，無論怎樣，上帝都以無始無終的愛來愛你。</p>"},{"day":2,"html":"<p>有時候上帝的兒女可能感覺上帝不愛他們了。也許他們做了錯事，就算是已經懇求赦免了，但是他們還是覺得上帝不可能再愛他們了。也許他們的處境非常艱難。他們遇到了災難，看起來似乎是，如果上帝愛他們，祂就不會讓這樣的事臨到他。有時候人們感覺心灰意冷，發現很難相信上帝愛他們。</p><p>不過，就算這樣的時候，我們也確信上帝愛我們。怎麼能這樣確信呢？因為我們的確信不是我們裡面的感受。我們的確信是上帝自己說的話。上帝從無謊言。上帝從不改變。當祂應許祂會永遠愛祂兒女的時候，那就不管怎樣，我們都知道祂就會永遠愛我們。當我們感受不到神愛的確據的時候，我們去看祂的話，再看看祂的應許。因為神應許祂會永遠愛祂的兒女，所以我們有把握，祂會永遠愛我們的。請讀羅馬書 8:35-39。</p><blockquote><p><strong>羅馬書 8:35</strong><br>誰能使我們與基督的愛隔絕呢？難道是患難嗎？是困苦嗎？是逼迫嗎？是飢餓嗎？是赤身露體嗎？是危險嗎？是刀劍嗎？</p></blockquote><blockquote><p><strong>羅馬書 8:36</strong><br>如經上所記：「我們為你的緣故終日被殺，人看我們如將宰的羊。」</p></blockquote><blockquote><p><strong>羅馬書 8:37</strong><br>然而，靠著愛我們的主，在這一切的事上已經得勝有餘了。</p></blockquote><blockquote><p><strong>羅馬書 8:38</strong><br>因為我深信無論是死、是生、是天使、是掌權的、是有能的、是現在的事、是將來的事，</p></blockquote><blockquote><p><strong>羅馬書 8:39</strong><br>是高處的、是低處的、是別的受造之物，都不能叫我們與　神的愛隔絕；這愛是在我們的主基督耶穌裡的。</p></blockquote><p>列舉一下經文中說到的，哪些事無法使我們與上帝的愛分離？</p>"},{"day":3,"html":"<p>上帝創造有良心的人。良心就是對於是非的意識。聖經告訴我們，就算從來沒讀過聖經的人，從來沒有聽說過真神的人，有時候也會感到內疚。這是因為，他們知道他們錯了。人犯罪以後，他的良心也墮落了。它不再像當初所設計的那樣功能完善了。現在我們發現，很容易就為我們的罪找到藉口。遠離上帝的人、深陷罪惡的人，他的記號就是他的良心幾乎不能使他不安。他可以做最邪惡的事情，卻一點也沒有責備。</p><p>當聖靈在人心裡工作，要有效地呼召一個人信基督的時候，祂叫那人的良心變得敏感。那個人就開始看到，他曾多方地得罪上帝，因此感到不安。一旦那個人信了基督，他的良心就有了平安。這是因為，他知道，耶穌已經承擔了他當受的刑罰。他知道上帝已經赦免他，已經洗淨他的罪。</p><p>這是不是意味著，上帝的兒女可以犯罪，不再感到內疚了呢？絕對不是。上帝真正的兒女會比任何人良心更敏感。當他犯罪的時候，他會因為得罪了父神而非常難過。因為他是上帝的兒女，他知道如何面對內疚的良心。他向上帝認罪，知道上帝會因為耶穌的緣故赦免他。然後他的良心可以恢復平安。請讀希伯來書 10:22。</p><blockquote><p><strong>希伯來書 10:22</strong><br>並我們心中天良的虧欠已經灑去，身體用清水洗淨了，就當存著誠心和充足的信心來到　神面前。</p></blockquote>"},{"day":4,"html":"<p>作為上帝兒女，我們確信祂的愛，我們有良心的平安。我們也有聖靈裡的喜樂。聖靈的喜樂不同於快樂。快樂稍縱即逝，而且快樂與否常在於我們身邊發生的事情。信徒可以一直擁有聖靈裡的喜樂。它來自於認識耶穌，知道祂為我們做了什麼。</p><p>不管周圍發生何事，上帝的兒女都知道，耶穌為他而死。他知道耶穌正在他生命中，也在世界中作工，為要成就祂完美的計劃。不論什麼東西，上帝的兒女想要得著卻沒有得著，他都知道他現在畢竟擁有耶穌，以後還會擁有天堂。聖靈不斷地提醒我們無論環境如何，要常常喜樂。因此，當保羅和西拉坐監的時候，兩腳上了木狗，他們的後背也因被打而疼痛，可他們仍然唱詩讚美。請讀彼得前書 1:8。</p><blockquote><p><strong>彼得前書 1:8</strong><br>你們雖然沒有見過他，卻是愛他；如今雖不得看見，卻因信他就有說不出來、滿有榮光的大喜樂。</p></blockquote>"},{"day":5,"html":"<p>孩子的生命剛剛開始時非常小（大概比鉛筆尖那麼大），然後就快速成長。上帝的兒女也成長。上帝的兒女一生都在成長。他們在愛心上成長，在上帝和祂話語的知識上成長，也在忍耐上成長。他們長得像耶穌。我們說在恩典中成長，就是這個意思。上帝的靈執行在祂兒女裡面，叫他們照著祂的心意成長。當我們老的時候，我們的身體會衰弱。曾經完美的眼睛，現在需要眼鏡了。曾經聽覺靈敏的耳朵現在需要助聽器了。強壯的身體現在不再強壯了。使徒保羅也寫到這些。保羅接著說，基督徒可以倍受鼓勵，因為雖然外面的身體衰老軟弱，但是在裡面他們是一天新似一天。他們每一天都在恩典中成長。請讀哥林多後書 4:16。</p><blockquote><p><strong>哥林多後書 4:16</strong><br>所以，我們不喪膽。外體雖然毀壞，內心卻一天新似一天。</p></blockquote>"},{"day":6,"html":"<p>上帝的兒女不僅享受在恩典中成長的福分，他們還享有在恩典中恆忍到底的福分。意思是說，不管遇到什麼試探，他們都會持續信靠順服耶穌，或者停止在救恩上信靠基督。是不是因為上帝的兒女堅強、善良、聖潔呢？不是的，他們一生在恩典中恆忍——他們會持續信靠順服耶穌——是因為上帝將保證他們能夠如此。</p><p class=\"read-prompt\">請讀約翰福音 10:27-29。</p><blockquote><p><strong>約翰福音 10:27</strong><br>我的羊聽我的聲音，我也認識他們，他們也跟著我；</p></blockquote><blockquote><p><strong>約翰福音 10:28</strong><br>我又賜給他們永生，他們永不滅亡，誰也不能從我手裡把他們奪去；</p></blockquote><blockquote><p><strong>約翰福音 10:29</strong><br>我父把羊賜給我，他比萬有都大，誰也不能從我父手裡把他們奪去。</p></blockquote><p>耶穌說祂的百姓是祂的羊。他說，沒有人能從祂的手裡把他們奪去。聖父上帝也把祂的百姓拿在手裡。我們這些信靠耶穌基督救我們脫離罪惡的人，知道我們會繼續信靠祂，直到迴天家。上帝自己應許會保守我們。</p>"}]},{"num":37,"title":"信徒離世時，從基督得著什麼恩福？","answer":"信徒離世時，他們的靈魂就得以完全成聖，立即進入榮耀裡；他們的身體仍然是與基督聯合的，就安歇在墳墓裡，直到復活的時候。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-11","days":[{"day":1,"html":"<p>我們所愛的人去世，會讓我們傷心。當我們愛一些人，我們就想和他們在一起。死亡將我們和我們所愛的人分開，叫我們不能再和他們在一起，不能再和他們說話。死亡並不是上帝起初創造的一部分。有時候你會聽人說，死亡就是這世上生命的一個自然的部分。其實那不是真的。死亡是不自然的。人們之所以死亡，是因為罪進入世界。如果亞當和夏娃從未犯罪，就沒有人會死。人們不喜歡死和等死。我們都把死亡看作是敵人。上帝也不喜歡死亡。死亡是從罪來的。上帝造萬物都是美好的。罪和死都是來自於人。他們把上帝創造時本來沒有的壞東西帶到上帝創造的世界。請讀羅馬書 5:12。</p><blockquote><p><strong>羅馬書 5:12</strong><br>這就如罪是從一人入了世界，死又是從罪來的，於是死就臨到眾人，因為眾人都犯了罪。</p></blockquote>"},{"day":2,"html":"<p>聖經告訴我們，每個人生在世上，有一天都會面對死亡（希伯來書 9:27 按著定命，人人都有一死，死後且有審判。）——除非主耶穌來迎接自己百姓的時候他們還在世。人死的時候會怎樣？</p><p>我們每個人是兩個部分組成的。我們每個人都有身體和靈魂。當然，我們的身體是人能看見，能聽見，能摸到的部分。我們用我們的身體去看、去聽、去觸控周圍的世界。我們的靈魂就是人看不到、聽不到、摸不到的部分，不過它依然是又真實又重要的。你的靈魂就是用來思考和愛恨的那部分。你的靈魂包括你的個性，你的個性使你不同於世上任何人。沒了靈魂，你的身體就不能活下去。沒有靈魂的身體根本無法思想、無法感覺、無法呼吸，什麼也幹不了。</p><p>人死的時候，身體和靈魂分離。身體看起來跟平時一樣，不過裡面的靈魂已經不在那裡了。靈魂去了哪裡呢？上帝百姓所得的一個恩福就是，我們死的時候，我們的靈魂立即進入榮耀裡。意思是說，立刻，不需要等，直接進入天堂。為什麼叫做「進入榮耀」呢？因為在天上，我們就會跟耶穌在一起。我們將看見祂榮耀中的本體。祂將歡迎我們，我們將永遠與祂同住。我們信耶穌、愛耶穌的人，在今世親近祂，祂也一直與我們同在。可是，當我們的靈魂與祂在天上團聚，我們將比現在更加親近祂。請讀腓立比書 1:21, 23。看看保羅面對死亡，有什麼可盼望的。</p><blockquote><p><strong>腓立比書 1:21</strong><br>因我活著就是基督，我死了就有益處。</p></blockquote><blockquote><p><strong>腓立比書 1:23</strong><br>我正在兩難之間，情願離世與基督同在，因為這是好得無比的。</p></blockquote>"},{"day":3,"html":"<p>屬於基督，就得著恩福與祂同在。人年輕的時候，都很難相信，在天上與耶穌同在，比在地上與家人和朋友同在更好。這是很正常的。不過我們年歲越大，我們越認識耶穌，我們就越盼望永遠與祂同在，那種關係是比這世上能經歷的任何關係都更親密的。</p><p>信徒去世時，耶穌賜他們另一個恩福。祂使他們立即成為完全聖潔。在世上，我們每一天犯罪。我們的願望是不犯罪，可是還是犯罪了。我們越認識耶穌，越愛耶穌，我們犯罪的時候做祂不喜悅的事情時，就越痛苦。與祂同住在天堂裡，然後還如同在世上一樣犯罪得罪祂，想起來就可怕！好在我們不必為此擔憂。當我們離世的時候，靈魂離開身體，與耶穌同在，是已經「完全成聖」了。我們不會再做一件事、說一句話、想一個念頭，是耶穌不喜悅的。這是多美好的福分啊！請讀約翰一書 3:2。</p><blockquote><p><strong>約翰一書 3:2</strong><br>親愛的弟兄啊，我們現在是　神的兒女，將來如何，還未顯明；但我們知道，主若顯現，我們必要像他，因為必得見他的真體。</p></blockquote>"},{"day":4,"html":"<p>死亡將靈魂與身體分開。當上帝的兒女去世，靈魂立刻與基督同在，並且永遠完全成聖。不過上帝的兒女的身體會怎樣呢？有人以為只有靈魂重要，身體不重要。那也不是上帝說的。上帝造我們就是身體和靈魂的結合。我們的身體對上帝來說也重要。</p><p>當我們與基督聯合的時候，我們的靈魂和我們的身體都與祂聯合。現在主耶穌基督也擁有在地上時曾擁有的身體。這身體已經「得了榮耀」，意思是說，能夠做世人的身體不能做的事，不過仍是身體。耶穌的身體甚至還帶著釘十字架留下的釘痕和槍傷。上帝的旨意是，我們在天上也像耶穌一樣有身體。人去世的時候，他的靈魂離開身體，他的身體就死了。他的親朋會洗淨他的身體，穿上衣服，然後葬在地下。上帝的百姓對於身體也有相當的尊重，因為他們知道，身體也是上帝看重的。</p><p>上帝曾經應許讓耶穌的信徒從死裡復活。當耶穌再來的時候，祂將兌現祂的話。就連千百年前死去的信徒也會從死裡復活，重新擁有自己的身體。這身體將成為更好的、「榮耀了」的身體，不會再生病，也不會衰老。信徒的靈魂在死後就與耶穌同在，待耶穌使他的身體從死裡復活，靈魂與身體重新結合。請讀哥林多前書 15:42-44。</p><blockquote><p><strong>哥林多前書 15:42</strong><br>死人復活也是這樣：所種的是必朽壞的，復活的是不朽壞的；</p></blockquote><blockquote><p><strong>哥林多前書 15:43</strong><br>所種的是羞辱的，復活的是榮耀的；所種的是軟弱的，復活的是強壯的；</p></blockquote><blockquote><p><strong>哥林多前書 15:44</strong><br>所種的是血氣的身體，復活的是靈性的身體。若有血氣的身體，也必有靈性的身體。</p></blockquote>"},{"day":5,"html":"<p>想到去天堂與耶穌同在，是一件美好的事。儘管我們的身體有一天會死去（除非耶穌先回來），不過祂將使我們的身體復活，我們就可以在天上有永遠完美的身體，知道這一點也是非常好的。不過，大家請注意這個問答所說的，是誰會得著這些恩福呢？這些恩福是為信徒預備的。</p><p>那麼信徒是誰呢？信徒就是，相信上帝所說的關於他的話——他是個罪人，是上帝憤怒的物件。他相信上帝所說的關於耶穌基督的話——祂是上帝的兒子，是救罪人脫離刑罰的唯一救主。每個人都想自己死後去天堂。每個人都希望自己在天堂裡永遠快樂。聖經告訴我們，天堂和永生是隻給信徒預備的。只有信靠耶穌救他們脫離上帝的憤怒，並且與上帝和好的人，才能死後去天堂。其餘的人必須獨自面對上帝和上帝對他們罪惡的憤怒。請讀約翰福音3:36。</p><blockquote><p><strong>約翰福音3:36</strong><br>信子的人有永生；不信子的人得不著永生，神的震怒常在他身上。</p></blockquote>"},{"day":6,"html":"<p>你是不是一想到死就害怕呢？你怕死嗎？貫穿整個歷史，自亞當和夏娃犯罪以來，人就怕死。死是所有人最怕的敵人。但是我們這些已經信靠主耶穌的人無所懼怕。關於死，有兩樣最讓人恐懼。一是不知道死後會怎樣。二是必須獨自面對偉大聖潔的上帝。</p><p>但是耶穌已經終結了我們的恐懼。我們不需要疑惑我們會怎樣。耶穌已經經歷死亡，又復活了。祂也會與我們每個人一同經歷死亡。我們不必害怕獨自面對上帝。耶穌死的時候，祂已經在自己身上，承擔了上帝對祂百姓罪惡的憤怒。我們信靠祂的人，不必面對上帝的憤怒。耶穌會保守我們的靈魂，確保它們不會滅亡，祂會復活我們的身體，叫我們與祂永遠住在天堂。請讀啟示錄1:17-18。</p><blockquote><p><strong>啟示錄1:17-18</strong><br>我一看見，就仆倒在他腳前，像死了一樣。他用右手按著我說：「不要懼怕！我是首先的，我是末後的，<br>又是那存活的；我曾死過，現在又活了，直活到永永遠遠，並且拿著死亡和陰間的鑰匙。</p></blockquote>"}]},{"num":38,"title":"信徒復活時，從基督得到了什麼恩福？","answer":"在復活之時，信徒在榮耀中復起；並在審判日，當眾被主承認並宣判無罪，完全得著一切恩福，全然以神為樂，直到永遠。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p1-11","days":[{"day":1,"html":"<p>這個問題問的是，信徒在復活中從基督那裡會得著什麼？聖經教導我們，有一天，上帝會終結這個罪惡的世界。上帝會消滅仇敵，耶穌基督會成為至高的掌權者。那時，這個世界結束，耶穌的統治開始，已死的所有人都將復活。對於信徒來說，這是個歡喜的時刻。主耶穌會使他們已死的身體復活。祂將使他們的身體變成比地上的身體更好的身體，因為祂給了他們榮耀。</p><p>我們不知道，有一個榮耀的身體到底都意味著什麼。但是我們知道，我們榮耀的身體不會生病，不會衰老，不會受傷。就連千百年前死去的信徒，曾被燒死的信徒，以及在意外事故中失去完整身體的人，都將得回他們的身體，從死裡復活，完全得以恢復並且得著榮耀。我們知道這事一定發生，因為耶穌曾經應許。復活的、榮耀的身體，是信徒從基督得著的恩福之一。請讀約翰福音6:39-40。</p><blockquote><p><strong>約翰福音6:39-40</strong><br>差我來者的意思就是：他所賜給我的，叫我一個也不失落，在末日卻叫他復活。<br>因為我父的意思是叫一切見子而信的人得永生，並且在末日我要叫他復活。</p></blockquote>"},{"day":2,"html":"<p>罪惡世界的毀滅以及死人復活將會發生在耶穌再來的時候。但是那些沒死的信徒會怎樣呢？耶穌再來的時候還活著的人怎麼樣呢？請讀帖撒羅尼迦前書4:16-17。</p><blockquote><p><strong>帖撒羅尼迦前書4:16-17</strong><br>因為主必親自從天降臨，有呼叫的聲音和天使長的聲音，又有神的號吹響；那在基督裡死了的人必先復活。<br>以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇。這樣，我們就要和主永遠同在。</p></blockquote><p>在基督裡死了的將從墳墓裡復活。然後，那些還活著的，將被提到空中與主相遇。</p><p>主再來時還活著的信徒，他們的身體會怎麼樣？因為他們不是從死裡復活，那麼他們也會有榮耀的身體嗎？聖經教導說，活著的信徒，他們的身體將會霎時改變。</p><blockquote><p><strong>哥林多前書15:51-52</strong><br>我如今把一件奧秘的事告訴你們：我們不是都要睡覺，乃是都要改變，就在一霎時，眨眼之間，號筒末次吹響的時候。因號筒要響，死人要復活，成為不朽壞的，我們也要改變。</p></blockquote><p>這樣，這些信徒也將擁有榮耀的身體，可以永遠活著，沒有疾病、痛苦、死亡。</p>"},{"day":3,"html":"<p>你曾否屬於一個很引以為榮的群體？你曾否很高興，人們知道某某人是你的爸爸，或者某某人是你的好朋友？如果你是一個基督徒，聖經告訴我們，當耶穌再來的時候，祂會讓所有人都知道你是屬於祂的。這是復活時，信徒在基督裡所得的恩福之一。在世上，上帝的敵人取笑，甚至傷害那些說自己屬於耶穌的人。有時候，讓別人知道我們是跟隨基督的人，並不是很容易的事。在復活的時候，每個人都會看到，屬於耶穌是好得無比的事。祂會在父和眾天使面前，說那些一生愛祂、順服祂的人，「這個人屬於我。」請讀馬太福音10:32-33。</p><blockquote><p><strong>馬太福音10:32-33</strong><br>凡在人面前認我的，我在我天上的父面前也必認他；<br>凡在人面前不認我的，我在我天上的父面前也必不認他。</p></blockquote>"},{"day":4,"html":"<p>那麼不是信徒的人怎麼樣呢？在復活的時候，他們會發生什麼事？聖經教導說，凡是曾經活在世上的人，都會來到上帝面前受審判。人一生所做的、所說的、所想的都將真相大白。上帝會按照人的行為來審判各人。如果法官是個普通的人，將我們與他人比較，那麼我們中間有些人會像是壞人，另一些人像是好人。</p><p>但是上帝是完美的法官。祂不會將從未違反過任何一條誡命的、完全順服祂話語的人，判定為好人。那你想，世上有那麼好的人嗎？任何一個人，哪怕只違背了上帝的一條誡命，就在祂面前成為有罪的，就該受祂的審判。耶穌為所有信祂的人承擔了罪責和刑罰。祂替他們承受刑罰，他們將永遠不必面對上帝的憤怒。</p><p>聖經說，信徒的名字記在生命冊上。他們的名字記在生命冊上，但是因為他們信靠耶穌來把他們從罪惡中救出來，所以上帝在審判日，宣告他們無罪。這是在復活時，信徒從基督得著的另一個恩福。請讀啟示錄20:12-15。</p><blockquote><p><strong>啟示錄20:12-15</strong><br>我又看見死了的人，無論大小，都站在寶座前。案卷展開了，並且另有一卷展開，就是生命冊。死了的人都憑著這些案卷所記載的，照他們所行的受審判。<br>於是海交出其中的死人，死亡和陰間也交出其中的死人。他們都照各人所行的受審判。<br>死亡和陰間也被扔在火湖裡，這火湖就是第二次的死。<br>若有人名字沒記在生命冊上，他就被扔在火湖裡。</p></blockquote>"},{"day":5,"html":"<p>有沒有那樣一個人，你享受和他/她在一起的時間？對於孩子，那可能是小夥伴或者爺爺奶奶。對於成人來說，可能是丈夫或者妻子。當我們與特別的人在一起，好像做什麼、去哪裡都不那麼重要。單單跟那個人在一起就很享受。當我們越來越認識上帝，祂成為我們認識的最特殊的一位。有些人去聚會、讀經、禱告，因為他們感到他們不得不做這些。而那些更認識上帝的人，做這些事是因為他們享受這些事。我們越認識上帝，我們就越以祂為樂。</p><p>我們中間認識上帝、愛上帝的人，都相信，我們在復活時從基督得著的最大的福分就是「我們將在以上帝為樂中得著完全的喜樂」。我們將比在世上時更加充分地認識祂、以祂為樂。我們將不再有罪惡的慾望，除了上帝以外，我們不渴望什麼，這樣我們的喜樂就單單在乎祂。在世上，由於罪惡和愁苦，沒有人是完全喜樂的；在天上，我們將滿了喜樂，我們的喜樂就在喜樂的源頭——上帝——那裡。請讀啟示錄21:3-4。</p><blockquote><p><strong>啟示錄21:3-4</strong><br>我聽見有大聲音從寶座出來說：「看哪！神的帳幕在人間。他要與人同住，他們要作他的子民；神要親自與他們同在，作他們的神。<br>神要擦去他們一切的眼淚。不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。」</p></blockquote>"},{"day":6,"html":"<p>基督賜給祂百姓的恩福都是永遠長存的。信徒榮耀的身體將永遠健康。身體會與靈魂結合，完全聖潔，永不犯罪。他們將永遠與主在一起，永遠以祂的同在為樂。請讀啟示錄22:3-5。</p><blockquote><p><strong>啟示錄22:3-5</strong><br>以後再沒有咒詛。在城裡有神和羔羊的寶座，他的僕人都要事奉他，<br>也要見他的面。他的名字必寫在他們的額上。<br>不再有黑夜，他們也不用燈光、日光，因為主神要光照他們。他們要作王，直到永永遠遠。</p></blockquote>"}]},{"num":39,"title":"神所要人盡的本分是什麼？","answer":"神所要人盡的本分，就是順從祂所啟示的旨意。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-1","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀詩篇95:1-6。</p><blockquote><p><strong>詩篇95:1-6</strong><br>來啊，我們要向耶和華歌唱！向拯救我們的磐石歡呼！<br>我們要來感謝他，用詩歌向他歡呼！<br>因耶和華為大神，為大王，超乎萬神之上。<br>地的深處在他手中，山的高峰也屬他。<br>海洋屬他，是他造的；旱地也是他手造成的。<br>來啊，我們要屈身敬拜，在造我們的耶和華面前跪下。</p></blockquote><p>第六節提醒我們，是上帝創造了我們。第三節告訴我們，上帝是萬有之上的大君王。因為上帝造了我們，我們屬於祂，祂是我們的君王。我們應該看我們自己是祂的僕人，預備遵行祂一切的命令。這個問答說上帝要求我們順服祂。祂有權這樣做，因為祂是君王，我們屬於祂。</p>"},{"day":2,"html":"<p>君王們都期待百姓順服他們。如果有這樣一位君王，百姓一不順服他，他就懲罰百姓，可是他又從來不告訴人，他到底要什麼，或者他的規矩是什麼，那可如何是好？如果你生活在那樣一個國家，你得成天提心吊膽，生怕不知不覺惹火了他。</p><p>上帝是良善恩慈的君王。祂清楚地告訴我們，祂向我們要求什麼。啟示的意思，就是顯明原先不可能知道的事情。如果上帝不施恩啟示祂的旨意，我們就永遠不會知道。我們會對某些事情好奇，不過上帝選擇不把那些事啟示給我們。不過，祂已經啟示我們，祂向我們要求什麼。請讀申命記29:29。</p><blockquote><p><strong>申命記29:29</strong><br>隱秘的事是屬耶和華我神的；惟有明顯的事是永遠屬我和我們子孫的，好叫我們遵行這律法上的一切話。</p></blockquote><p>上帝向我們啟示祂的旨意，叫我們遵行。</p>"},{"day":3,"html":"<p>我們的君王期待我們順服祂。祂啟示祂的旨意，目的不是隻叫我們知道祂的旨意，也不是隻叫我們知道關於上帝的事實。祂啟示祂的旨意，為要叫我們遵行。有時候，當我們比較熟悉一件事，就很容易以為，我們既然知道了，就是在遵行了。請讀雅各書1:22-25。</p><blockquote><p><strong>雅各書1:22-25</strong><br>只是你們要行道，不要單單聽道，自己欺哄自己。<br>因為聽道而不行道的，就像人對著鏡子看自己本來的面目，<br>看見，走後，隨即忘了他的相貌如何。<br>惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。</p></blockquote>"},{"day":4,"html":"<p>有時候，老師給比較難的考試打分比較容易。老師會看班裡最優秀的試卷，發現就連這個學生也錯了幾道題。於是，老師稍稍降低評分標準，這樣可以讓每個人的成績都提上來一點。有些人談論上帝的時候，彷彿上帝就要事這樣的混亂處境。有些人常說：「哎呀，人無完人嘛。上帝知道我已經盡力了。祂能理解我的混亂處境。」</p><p>這並不是聖經教導的。上帝是全然聖潔的。祂要求我們完全遵守祂聖潔的律法。第三十九問說，上帝要求人順服祂的旨意。祂不是要求我們儘量順服或者部分順服。上帝要求人完全順服祂所賜的每一條律法，沒有一次失敗。上帝說過要審判每一個人。祂會懲罰那些作惡的。祂會賞賜行善的——只要他們完全地、不斷地、成功地順服。這是上帝的要求，祂不會得過且過。當我們理解這一點，我們就看到我們是多麼需要一位救主——就是替我們受罰，並且替我們完全順服上帝的那一位。請讀羅馬書2:9-13。</p><blockquote><p><strong>羅馬書2:9-13</strong><br>將患難、困苦加給一切作惡的人，先是猶太人，後是希臘人；<br>卻將榮耀、尊貴、平安加給一切行善的人，先是猶太人，後是希臘人。<br>因為神不偏待人。<br>凡沒有律法犯了罪的，也必不按律法滅亡；凡在律法以下犯了罪的，也必按律法受審判。<br>（原來，在神面前不是聽律法的為義，乃是行律法的稱義。）</p></blockquote>"},{"day":5,"html":"<p>信耶穌的人，他們的罪已被上帝全部赦免。祂不會再懲罰他們，因為耶穌已經替他們承擔了他們當受的刑罰。那麼是不是信徒就可以為所欲為、隨心所欲了呢？絕對不是。上帝仍是聖潔的，仍是要求聖潔的。上帝的百姓倚靠耶穌來與上帝和好，因為他們自己永遠無法達到良善的標準。但是他們也會竭力活出上帝喜悅的生活。請讀彼得前書1:14-17。</p><blockquote><p><strong>彼得前書1:14-17</strong><br>你們既作順命的兒女，就不要效法從前矇昧無知的時候那放縱私慾的樣子。<br>那召你們的既是聖潔，你們在一切所行的事上也要聖潔。<br>因為經上記著說：「你們要聖潔，因為我是聖潔的。」<br>你們既稱那不偏待人、按各人行為審判人的主為父，就當存敬畏的心，度你們在世寄居的日子。</p></blockquote>"},{"day":6,"html":"<p>上帝作為君王，統管整個人類，因為祂創造所有人。祂要求所有人都順服祂。我們已經信耶穌作救主的人，已經有耶穌作我們的君王。如果祂是我們的君王，我們就會順服祂。請讀馬太福音7:21-23。</p><blockquote><p><strong>馬太福音7:21-23</strong><br>凡稱呼我「主啊，主啊」的人，不能都進天國；惟獨遵行我天父旨意的人，才能進去。<br>當那日，必有許多人對我說：「主啊，主啊，我們不是奉你的名傳道，奉你的名趕鬼，奉你的名行許多異能嗎？」<br>我就明明地告訴他們說：「我從來不認識你們，你們這些作惡的人，離開我去吧！」</p></blockquote><p>耶穌說，有人嘴裡稱祂為主，也為祂忙碌地工作——但是他們不順服祂給他們的命令。這些人將不會進入天國。只是口裡說是基督徒，不能叫我們真的就成為基督徒。為基督工作，也不會使我成為基督徒。基督徒就是信靠耶穌作救主和生命主宰的人。真正的基督徒會順服祂，遵行祂所說的。請讀馬太福音7:24-27中大家很熟悉的故事。請注意，聰明人就是聽了耶穌的話，就去遵行的人。</p><blockquote><p><strong>馬太福音7:24-27</strong><br>所以，凡聽見我這話就去行的，好比一個聰明人，把房子蓋在磐石上。<br>雨淋，水衝，風吹，撞著那房子，房子總不倒塌，因為根基立在磐石上。<br>凡聽見我這話不去行的，好比一個無知的人，把房子蓋在沙土上。<br>雨淋，水衝，風吹，撞著那房子，房子就倒塌了，並且倒塌得很大。</p></blockquote>"}]},{"num":40,"title":"神起初啟示給人，要人順從的法則是什麼？","answer":"神起初啟示給人，要人順從的法則就是道德律。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-1","days":[{"day":1,"html":"<p>因為上帝是人的創造主和君王，所以祂制定了人類必須遵守的法則。這些法則叫做道德律。它們告訴我們對神對人應該如何行事。上帝不是要我們只在外面順服，而是心裡也順服。祂不僅要求我們遵行祂的旨意，祂還要求我們愛慕祂的旨意。</p><p>上帝在西奈山上賜給百姓十誡。在過後的千百年中，祂越來越多地啟示祂的旨意，叫人寫下，成為聖經。甚至在沒有成文的法則之前，上帝已經向人啟示的道德律。實際上，今日的人們，就算從未看過、聽過聖經，也有這樣的道德律。上帝在我們心裡啟示道德律。</p><p>上帝照著自己的形像造人。按照上帝的形像被造，其中一個含義就是，我們能夠有是非的意識。動物和其它活物沒有良心。它們所做的都只是照著它們的本能所告訴它們的。人不一樣。上帝造人有良心。人知道自己什麼時候在守上帝的法則，什麼時候沒守。由於墮落，人的每一個部分都是有罪的，包括他的良心。現在我們的良心變得剛硬，因為我們忽視良心，不管良心的感受，選擇去犯罪。就算這樣，人們仍然知道是非，沒有藉口違揹我們君王和創造主的法則。請讀羅馬書2:14-15。</p><blockquote><p><strong>羅馬書2:14-15</strong><br>沒有律法的外邦人，若順著本性行律法上的事，他們雖然沒有律法，自己就是自己的律法。<br>這是顯出律法的功用刻在他們心裡，他們是非之心同作見證，並且他們的思念互相較量，或以為是，或以為非。</p></blockquote><p>根據這節經文，對於那些從來沒有律法的人，律法的要求寫在什麼地方？</p>"},{"day":2,"html":"<p>上帝賜給摩西許多律法，叫他傳給百姓以色列人。其中有一些就屬於道德律。另外的屬於禮儀律。禮儀律包括獻祭的規則，祭司的服飾，帳幕內的程式等。這些都象徵耶穌降臨時將為我們做的事。現在基督既然已經來了，上帝就不再要求祂的百姓來守所有禮儀律的法則。道德律不一樣。上帝要求全世界的所有人都一直遵守它。不管是誰，不管他生存在歷史中哪個時期，不管他是哪一國的人，他的創造主都要求他遵守道德律。請讀馬太福音5:17-19。</p><blockquote><p><strong>馬太福音5:17-19</strong><br>莫想我來要廢掉律法和先知；我來不是要廢掉，乃是要成全。<br>我實在告訴你們：就是到天地都廢去了，律法的一點一畫也不能廢去，都要成全。<br>所以，無論何人廢掉這誡命中最小的一條，又教訓人這樣做，他在天國要稱為最小的；但無論何人遵行這誡命，又教訓人遵行，他在天國要稱為大的。</p></blockquote>"},{"day":3,"html":"<p>上帝所賜的都是美好的。道德律是上帝給人的美好禮物之一。道德律在幾個方面幫助我們。它向我們展示上帝是怎樣的。上帝是聖潔的。祂恨惡罪惡、喜愛公義。祂照著祂自己的形像創造我們，在我們的裡面放置了良心，告訴我們什麼時候做得對，什麼時候做得不對。上帝向我們顯明祂是怎樣的。祂要求我們公義聖潔，上帝藉此彰顯祂自己的公義和聖潔。請讀利未記20:7-8。</p><blockquote><p><strong>利未記20:7-8</strong><br>所以你們要自潔成聖，因為我是耶和華你們的神。<br>你們要謹守遵行我的律例，我是叫你們成聖的耶和華。</p></blockquote>"},{"day":4,"html":"<p>道德律對我們還有一個作用。它向我們顯明上帝要求我們的是什麼。既然上帝創造我們、設計我們，所以祂知道什麼對我們最好的。對於我們，最好的事就是去做我們的創造主上帝告訴我們當做的事。上帝完全可以造了我們，就把我們扔在地上不管。我們就不會知道祂在我們身上有何目的。上帝造我們有良心，上帝也賜給我們祂的啟示，祂藉此向我們啟示，如何能活出最好的生命。上帝向我們啟示如何與祂的創造主和好。人們不必再去猜測，做什麼才能取悅上帝。我們不必再猜測，應該如何生活。上帝已經將這些事透過祂的道德律啟示我們。請讀彌迦書6:8。</p><blockquote><p><strong>彌迦書6:8</strong><br>世人哪，耶和華已指示你何為善，他向所要的是什麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。</p></blockquote>"},{"day":5,"html":"<p>道德律對我們還有一個作用。它向我們顯明我們是多麼的罪惡。它讓他們看到我們的危險，看到我們需要救主。如果上帝沒有在聖經中向我們啟示祂的道德律，如果我們從不感到難過，那麼我們就會以為我們是相當好的人。畢竟，有各種各樣的人，比我們還壞呢。上帝不允許我們那樣想。祂啟示祂完全聖潔的道德律，那是我們這些罪人永遠無法守得住的。</p><p>當我們為所犯的罪所疚，當我們將我們的生活與聖經中上帝的要求比較，我們發現我們靠自己根本無法讓上帝喜悅。我們完全不能遵行祂的全部要求。這時候，我們才意識到，我們在上帝面前是邪惡的、是有罪的，我們束手無策。我們從上帝那裡，只能期待憤怒和審判了。這時，當我們得知上帝已經預備耶穌作救主，我們意識到我們何等地需要祂。如果沒有上帝的律法，我們不會轉向耶穌來得救，因為我們不會知道我們需要得救。請讀羅馬書3:20。</p><blockquote><p><strong>羅馬書3:20</strong><br>所以凡有血氣的，沒有一個因行律法能在神面前稱義，因為律法本是叫人知罪。</p></blockquote>"},{"day":6,"html":"<p>道德律對我們還有一個作用，不過這個作用只是對於已經信靠耶穌與上帝和好的人有效。你可能以為這樣的人就不再需要理會道德律了吧？不管怎麼說，多虧了耶穌，信徒的罪已經得以赦免。耶穌已經替他完全滿足了道德律的所有要求。上帝已經宣告他為義人。道德律讓信徒看到自己是蒙了耶穌何等大的恩典。</p><p>我們越是知道上帝的要求，我們就越是意識到我們是多麼不可能做到。然後我們開始理解耶穌為我們做了何等大的事啊。道德律叫我們對於上帝所賜的救主有感恩的心。它也向我們顯明我們可以怎樣做，來證明我們對耶穌的感恩。我們可以照著上帝喜悅的方式生活，順服道德律。當然我們會有失敗，不過我們會一直渴慕得上帝喜悅，我們會因為我們對祂的感恩，在聖潔裡不斷地成長。請讀歌羅西書1:10。</p><blockquote><p><strong>歌羅西書1:10</strong><br>好叫你們行事為人對得起主，凡事蒙他喜悅，在一切善事上結果子，漸漸地多知道神。</p></blockquote>"}]},{"num":41,"title":"道德律是總括在什麼裡面？","answer":"道德律是總括在十誡裡面。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-1","days":[{"day":1,"html":"<p>上帝造人有良心。我們的良心會告訴我們，什麼時候我們順服上帝了，什麼時候得罪上帝了。但是因為我們是有罪的，所以我們不能一直信賴我們的良心。有時候我們犯罪的時候倒也沒有難過。有時候我們做對了也感到自責。上帝在祂的良善中，以絕不會錯誤的形式賜給我們祂的道德律。祂賜給我們聖經，就是上帝自己的話被記載下來，這樣不會被遺忘或者篡改。</p><p>上帝不是一次性地賜給我們整本聖經。上帝賜下的最初的經文就包括十誡。請讀出埃及記34:27-28。</p><blockquote><p><strong>出埃及記34:27-28</strong><br>耶和華吩咐摩西說：「你要將這些話寫上，因為我是按這話與你和以色列人立約。」<br>摩西在耶和華那裡四十晝夜，也不吃飯，也不喝水。耶和華將這約的話，就是十條誡，寫在兩塊版上。</p></blockquote><p>十誡總結了上帝啟示給我們的全部旨意。總結就是儘量以最簡短的方式，講出某事最重要的部分。十誡只用幾句話，就將上帝所要求我們的，都告訴我們了。經文中其他的教導和命令，都在解釋十誡，幫助我們更完整地看到上帝賜下十誡時的用意。</p>"},{"day":2,"html":"<p>當十誡告訴我們，我們不可做某事，我們就絕對不要做那件事以及類似的事。我們要做相反的事。比如，十誡中有一誡告訴我們，不可殺人。我們不僅應該不殺無辜之人，並且不可以用任何方式傷害任何人。不僅如此，我們也不可用語言來傷害別人。就是在我們心裡，也不可希望別人遭災。相反，我們要愛別人，做事考慮別人的益處。因為十誡是上帝道德律的總結，以上所說的那些方面，其實都包括在「不可殺人」這條誡命之內了。請讀馬太福音5:21-22。</p><blockquote><p><strong>馬太福音5:21-22</strong><br>你們聽見有吩咐古人的話，說：『不可殺人』，又說：『凡殺人的，難免受審判。』<br>只是我告訴你們：凡向弟兄動怒的，難免受審判。凡罵弟兄是拉加的，難免公會的審斷；凡罵弟兄是魔利的，難免地獄的火。</p></blockquote>"},{"day":3,"html":"<p>上帝對於祂的律法是十分嚴肅的。祂賜給我們道德律，不是什麼明智的建議而已，告訴你如何活得開心快樂。上帝要求我們順服祂的道德律。上帝如同軍隊的元帥，或者國家的君王，祂發出命令，是要我們順服的。當上帝起初賜下十誡的時候，祂將十誡賜給以色列人，這是上帝從萬民中揀選出來歸於自己的百姓。聖經給我們講述了上帝賜給以色列人十誡的過程。上帝告訴祂的百姓，祂將在西奈山與他們相見。</p><p>會見重要的人，需要特殊的行為舉止。如果我們去見國家主席，就不會穿一件舊工作服，嚼著口香糖，或者把腳搭在沙發上。會見上帝比見任何人都重要得多。以色列人必須做一些預備的工作。他們的朝見上帝時，必須遵守一定的行為規範。請讀出埃及記19:10-13。</p><blockquote><p><strong>出埃及記19:10-13</strong><br>耶和華又對摩西說：「你往百姓那裡去，叫他們今天明天自潔，又叫他們洗衣服。<br>到第三天要預備好了，因為第三天耶和華要在眾百姓眼前降臨在西奈山上。<br>你要在山的四圍給百姓定界限，說：『你們當謹慎，不可上山去，也不可摸山的邊界；凡摸這山的，必要治死他。<br>不可用手摸他，必用石頭打死，或用箭射透，無論是人是牲畜，都不得活。到角聲拖長的時候，他們才可到山根來。』」</p></blockquote>"},{"day":4,"html":"<p>以色列人朝見上帝的時間到了，他們聚集在西奈山腳下。請讀出埃及記19:16-19和出埃及記20:18-19。</p><blockquote><p><strong>出埃及記19:16-19</strong><br>到了第三天早晨，在山上有雷轟、閃電和密雲，並且角聲甚大，營中的百姓盡都發顫。<br>摩西率領百姓出營迎接神，都站在山下。<br>西奈全山冒煙，因為耶和華在火中降於山上，山的煙氣上騰，如燒窯一般，遍山大大地震動。<br>角聲漸漸地高而又高，摩西就說話，神有聲音答應他。</p></blockquote><blockquote><p><strong>出埃及記20:18-19</strong><br>眾百姓見雷轟、閃電、角聲、山上冒煙，就都發顫，遠遠地站立。<br>對摩西說：「求你和我們說話，我們必聽，不要神和我們說話，恐怕我們死亡。」</p></blockquote><p>儘管上帝並不是想讓我們像懼怕兇惡的怪獸那樣怕祂，不過祂確實要我們敬畏祂。請讀出埃及記20:20。</p><blockquote><p><strong>出埃及記20:20</strong><br>摩西對百姓說：「不要懼怕，因為神降臨是要試驗你們，叫你們時常敬畏他，不至犯罪。」</p></blockquote><p>如果我們以正確的方式敬畏祂，我們就會謹慎不去得罪上帝。</p>"},{"day":5,"html":"<p>以色列人朝見上帝的時候，上帝給他們一些特殊的行為規範，目的是叫他們知道上帝的偉大聖潔，以及上帝配得何等的尊榮。當上帝降臨在山上，祂帶著電閃雷鳴、烈火濃煙、地動山搖、響亮號角，叫以色列人戰兢不已。上帝要他們意識到，必須得順服上帝，必須嚴肅對待上帝要賜下的律法。上帝不允許任何一條法則被觸犯。就算一個人絕大多數時間都謹慎順服了上帝的道德律，上帝仍然會對那人不順服的那些事憤怒。偶爾的順服無法達到上帝的要求。請讀雅各書2:10。</p><blockquote><p><strong>雅各書2:10</strong><br>因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條。</p></blockquote>"},{"day":6,"html":"<p>我們沒有可能一直全守上帝的律法。任何一條律法被觸犯，上帝都會憤怒，懲罰罪人。我們怎麼還有指望能讓祂喜悅呢？我們唯一的盼望就是，信靠基督替我們完全地順服律法。請讀羅馬書10:4。</p><blockquote><p><strong>羅馬書10:4</strong><br>律法的總結就是基督，使凡信他的都得著義。</p></blockquote><p>如果我們信靠耶穌滿足上帝所有的要求，是不是說我們不用再思考遵守上帝道德律的事了？絕對不是。我們現在是上帝的兒女，我們想要像祂的樣式。我們想要讓祂知道我們是怎樣地愛祂。請讀約翰福音14:15。</p><blockquote><p><strong>約翰福音14:15</strong><br>你們若愛我，就必遵守我的命令。</p></blockquote>"}]},{"num":42,"title":"十誡的總綱是什麼？","answer":"十誡的總綱，就是要盡心、儘性、盡意、盡力，愛主我們的神，並且愛鄰舍如同自己。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-1","days":[{"day":1,"html":"<p>你曾否背誦過十誡的內容？如果你背過，現在再來一次吧。如果沒有背過，那麼十誡（簡版）就在下面列舉出來：</p><p>【1】除了上帝不可有別神；【2】不可製造偶像；【3】不可妄稱神的名；【4】要守安息日為聖；【5】要孝敬父母；【6】不可殺人；【7】不可姦淫；【8】不可偷竊；【9】不可作假見證；【10】不可貪心。</p><p>有一次，一個人問耶穌，哪個誡命是最大的。耶穌的答案可能讓他始料未及。請讀馬太福音22:37-39。</p><blockquote><p><strong>馬太福音22:37-39</strong><br>耶穌對他說：「你要盡心、儘性、盡意，愛主你的神。<br>這是誡命中的第一，且是最大的。<br>其次也相仿，就是要愛人如己。</p></blockquote><p>耶穌說，最大的誡命是竭誠愛神。祂說第二大的誡命就是要愛人如己。你能在列出來的十誡中看到這兩點嗎？雖然我們在十誡中沒有發現這兩條，但是這兩條總結了十誡的全部。因此，耶穌說這就是最大的兩條誡命。請讀馬太福音22:40。</p><blockquote><p><strong>馬太福音22:40</strong><br>這兩條誡命是律法和先知一切道理的總綱。</p></blockquote>"},{"day":2,"html":"<p>我們看一看禮拜一列出來的十誡。其中一些告訴我們如何愛神。另一些告訴我們如何愛人。前四誡更多是關於愛上帝的。面對「哪個誡命是最大的」這個問題，耶穌給出的答案是在舊約經文裡面的。請讀申命記6:4-7。</p><blockquote><p><strong>申命記6:4-7</strong><br>以色列阿，你要聽！耶和華我們神是獨一的主。<br>你要盡心、儘性、盡力愛耶和華你的神。<br>我今日所吩咐你的話都要記在心上，<br>也要殷勤教訓你的兒女，無論你坐在家裡，行在路上，躺下，起來，都要談論；</p></blockquote><p>找一找耶穌給出的第一個答案。誡命中的第一部分，總結起來就是，竭盡全力愛上帝。</p><p>如果我們真愛上帝，我們就會只敬拜上帝，不會製造任何偶像。如果我們真愛上帝，我們就會尊重上帝的名，不會用在罵人話裡，也不會輕浮地使用它。當我們愛上帝的時候，守安息日，在特殊的日子裡敬拜和認識上帝，就自然成為我們的渴慕。如果我們能夠完美地愛上帝，我們就會全然愛祂，就連處理我們與人關係的另外六誡，也不會違背了。因為上帝照著自己的形像造人，我們什麼時候得罪一個人，我們其實首先得罪了造他的上帝。</p>"},{"day":3,"html":"<p class=\"read-prompt\">請讀利未記19:11-18。</p><blockquote><p><strong>利未記19:11-18</strong><br>你們不可偷盜，不可欺騙，也不可彼此說謊。<br>不可指著我的名起假誓，褻瀆神的名。我是耶和華。<br>不可欺壓你的鄰舍，也不可搶奪他的物。僱工人的工價，不可在你那裡過夜到早晨。<br>不可咒罵聾子，也不可將絆腳石放在瞎子面前，只要敬畏你的神。我是耶和華。<br>你們施行審判，不可行不義，不可偏護窮人，也不可重看有勢力的人，只要按著公義審判你的鄰舍。<br>不可在民中往來搬弄是非，也不可與鄰舍為敵，置之於死。我是耶和華。<br>不可心裡恨你的弟兄；總要指摘你的鄰舍，免得因他擔罪。<br>不可報仇，也不可埋怨你本國的子民，卻要愛人如己。我是耶和華。</p></blockquote><p>找一找耶穌所說的誡命中第二大的「愛人如己」。我們常常聽人說，要愛自己。聖經從來沒有告訴我們要愛自己。聖經告訴我們要愛別人，如同我們已經愛自己的程度。我們總是用心來為自己獲得所需要的東西。上帝要我們同樣用心地去滿足別人的需要。我們千方百計地保護自己不受傷害。當我們愛人如己的時候，我們應該用心地保護他們，不讓他們受傷。</p><p>我們犯錯的時候，我們有一大堆理由來解釋。如果我們愛人如己，我們在別人犯錯的時候，就會跟他們發怒。我們會找出他們犯錯的原因，原諒他們，像對待自己一樣。我們總是照顧自己。這方面，我們不學就會。上帝命令我們，要以照顧自己的方式來照顧別人。</p>"},{"day":4,"html":"<p>我們愛人如己的時候，我們就會當心，不傷害別人。十誡的後面六誡，禁止我們做傷害別人的事：不可殺人，不可姦淫，不可偷竊，不可撒謊，不可貪心。如果我們只愛自己，我們可能就會做上面的事情。如果我們愛人如己，我們就不會做這些事，因為我們不想傷害別人。請讀羅馬書13:8-10。</p><blockquote><p><strong>羅馬書13:8-10</strong><br>凡事都不可虧欠人，惟有彼此相愛，要常以為虧欠，因為愛人的就完全了律法。<br>像那「不可姦淫」，「不可殺人」，「不可偷盜」，「不可貪婪」，或有別的誡命，都包在「愛人如己」這一句話之內了。<br>愛是不加害與人的，所以愛就完全了律法。</p></blockquote>"},{"day":5,"html":"<p>當我們愛人如己的時候，我們就不僅不傷害他們，還會想方設法幫助他們。當有人鼓勵你做得很棒的時候，你是不是喜歡呢？別人也喜歡啊。你既然喜歡被人鼓勵，那麼你也可以藉著鼓勵別人，來顯明你對人的愛。如果有人對你好或者送你精心的禮物，是不是你會喜歡呢？別人也喜歡啊。那麼你也可以藉著愛心的舉動或者送給別人你喜歡收到的禮物，來表達你對人的愛。如果你主動地尋求愛人的方式，你就是在履行律法。請讀馬太福音7:12。</p><blockquote><p><strong>馬太福音7:12</strong><br>所以，無論何事，你們願意人怎樣待你們，你們也要怎樣待人，因為這就是律法和先知的道理。</p></blockquote>"},{"day":6,"html":"<p class=\"read-prompt\">請讀約翰福音15:12-14。</p><blockquote><p><strong>約翰福音15:12-14</strong><br>你們要彼此相愛，像我愛你們一樣，這就是我的命令。<br>人為朋友捨命，人的愛心沒有比這個大的。<br>你們若遵行我所吩咐的，就是我的朋友了。</p></blockquote><p>這幾節經文是耶穌對祂的門徒說的話。在第十二節祂給他們什麼命令？耶穌做了什麼來顯明祂對自己百姓的愛？耶穌說，我們必須做什麼，才能顯出我們是祂的朋友。如果我們盡心、儘性、盡意、盡力愛上帝，我們就會遵守十誡所歸納起來的道德律。</p>"}]},{"num":43,"title":"十誡的序言是什麼？","answer":"十誡的序言是：「我是耶和華你的神，曾將你從埃及地為奴之家領出來」。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-1","days":[{"day":1,"html":"<p>上帝是宇宙的君王。祂的命令一發出，祂就要求我們順服。上帝是所有存在的創造者。當祂讓祂的受造物做什麼，他們必須做。上帝給人道德律，祂要求我們順服。祂不必給我們解釋。有時候當老師或者父母告訴孩子做什麼事，孩子的答覆是「為什麼呀？」。而我們並沒有權利問上帝，我們為什麼必須順服祂的律法。</p><p>因為上帝是良善恩慈的，祂確實給了我們順服的理由。上帝創造我們，叫我們能思想，能理解，於是祂向我們解釋，我們為什麼應該順服。十誡總結了上帝要求我們順服的道德律。在賜下十誡之前，上帝解釋了百姓要順服這些誡命的原因。請翻到出埃及記20章，是上帝起初賜下十誡的記載，讀一讀上帝為百姓的順服給出什麼原因。這原因就記在第二節。</p><blockquote><p><strong>出埃及記20:2</strong><br>我是耶和華你的神，曾將你從埃及地為奴之家領出來。</p></blockquote>"},{"day":2,"html":"<p>上帝為以色列民做了一件大事。他們曾在埃及為奴，那裡的埃及人虐待他們。上帝曾勸埃及人給以色列人自由。上帝的方式是在埃及和國降下十災。他們的莊稼被毀，他們的牛羊被殺，災難接連不斷。最終，每個埃及人家都死了長子。最終埃及人相信，如果再不讓以色列人走，上帝是不會放過他們的。以色列人離了埃及，很高興上帝替他們做了大事。</p><p>後來，埃及人又改變了主意。他們派軍兵車馬去追殺那些手無寸鐵的以色列人。把恐慌的以色列人一直追到紅海邊上。在那兒，上帝行了神蹟來救以色列人。祂將海水分開，使兩邊的水立起成壘，中間露出乾地。以色列人走乾地過了海。當埃及人也想追趕的時候，上帝讓水復歸原位，埃及人全軍覆沒。</p><p>從那天開始，以色列人一直歡喜回顧上帝為他們成就的救恩。上帝曾救他們脫離奴役。上帝曾救他們脫離勁敵。上帝成就這一切的時候，彰顯了祂的大能。這次的拯救，標誌著以色列人與上帝之間開始了特殊的關係。請讀出埃及記15:1-2。</p><blockquote><p><strong>出埃及記15:1-2</strong><br>那時，摩西和以色列人向耶和華歌唱說：「我要向耶和華歌唱，因他大大戰勝，將馬和騎馬的投在海中。<br>耶和華是我的力量、我的詩歌，也成了我的拯救。這是我的神，我要讚美他；是我父親的神，我要尊崇他。</p></blockquote>"},{"day":3,"html":"<p>上帝救了以色列人，因為祂想要他們作祂的子民。在世界萬國之中，祂只和他們立了約。意思是說，祂跟他們達成了協議。祂承諾為他們做特殊的事，並對他們有某些要求。在上帝救埃及人出埃及之後不久，上帝賜給他們十誡。上帝在西奈山，也叫何烈山，賜下律法。在申命記第五章，摩西提醒以色列人，上帝賜給他們十誡。他說，當上帝賜下律法的時候，「我們的神與我們立約」請讀申命記5:1-6。</p><blockquote><p><strong>申命記5:1-6</strong><br>摩西將以色列眾人召來，對他們說：「以色列人哪，我今日曉諭你們的律例典章，你們要聽，可以學習，謹守遵行。<br>耶和華我們的神在何烈山與我們立約。<br>這約不是與我們列祖立的，乃是與我們今日在這裡存活之人立的。<br>耶和華在山上，從火中，面對面與你們說話。<br>（那時我站在耶和華和你們中間，要將耶和華的話傳給你們，因為你們懼怕那火，沒有上山。）<br>說：」我是耶和華你的神，曾將你從埃及地為奴之家領出來。『</p></blockquote>"},{"day":4,"html":"<p>申命記是摩西在臨死之前，就在以色列人即將進入迦南地之前，他所講的一篇道。在申命記中，摩西提醒以色列人，上帝都為他們做了什麼。他勸勉他們要忠實於上帝在律法中告訴他們應當遵行的一切事。請讀申命記4:5-8。</p><blockquote><p><strong>申命記4:5-8</strong><br>我照著耶和華我神所吩咐的，將律例典章教訓你們，使你們在所要進去得為業的地上遵行。<br>所以你們要謹守遵行，這就是你們在萬民眼前的智慧、聰明。他們聽見這一切律例，必說：『這大國的人真是有智慧有聰明。』<br>哪一大國的人有神與他們相近，像耶和華我們的神、在我們求告他的時候與我們相近呢？<br>又哪一大國有這樣公義的律例典章，像我今日在你們面前所陳明的這一切律法呢？</p></blockquote><p>摩西說，如果以色列人能認真遵守上帝的律法，其它的國家會這樣講以色列：「這國的人，真是有聰明有智慧。」他說，沒有哪個國家像以色列一樣有上帝親近它。擁有上帝的律法，使以色列成為大國。</p>"},{"day":5,"html":"<p>在舊約記載中，上帝真的為以色列民行了好多神蹟奇事。祂以大能拯救他們，救他們脫離仇敵，給他們充足的福分。今天，上帝給祂的百姓做了更大的事。祂以大能救我們脫離罪惡，也脫離祂對我們罪孽的憤怒。祂救我們脫離我們的仇敵、罪惡、撒但、死亡。上帝藉著收納我們為祂的兒女，賜給我們充足的福分，賜給我們祂的聖靈住在我們裡面，還賜給我們永生的禮物。</p><p>如果舊約中上帝的百姓有充分的理由順服上帝所賜的道德律，我們今日作百姓的，當然有更充分的理由，在順服中侍奉上帝。上帝賜給以色列人摩西，作為領袖，來拯救他們，可是上帝把祂自己的兒子耶穌賜給我們，耶穌為了拯救我們而受死。因為上帝為他們所做的一切，上帝要求以色列人順服祂。我們豈不更當奉獻一生，來順服上帝對我們的要求嗎？請讀哥林多後書5:14-15。</p><blockquote><p><strong>哥林多後書5:14-15</strong><br>原來基督的愛激勵我們。因我們想，一人既替眾人死，眾人就都死了；<br>並且他替眾人死，是叫那些活著的人不再為自己活，乃為替他們死而復活的主活。</p></blockquote>"},{"day":6,"html":"<p>禮拜四的時候，我們在申命記中讀到，以色列人之所以特別，是因為上帝親近他們，比跟任何其它國家都親近。上帝不僅僅親近祂藉著耶穌拯救的人，祂其實親自就藉著祂的聖靈住在他們裡面。上帝要求舊約的百姓要聖潔，因為祂住在他們中間。既然祂住在我們裡面，祂豈不要求我們更加倍地聖潔呢？上帝應許要作以色列的神，這樣地期待他們順服祂，活出與上帝相稱的生活。祂應許作我們的父，期待我們保守自己遠離罪惡，衷心地順服祂。請讀哥林多後書6:16-7:1。</p><blockquote><p><strong>哥林多後書6:16-18</strong><br>神的殿和偶像有什麼相同呢？因為我們是永生神的殿，就如神曾說：「我要在他們中間居住，在他們中間來往；我要作他們的神，他們要作我的子民。」<br>又說：「你們務要從他們中間出來，與他們分別，不要沾不潔淨的物，我就收納你們。<br>我要作你們的父，你們要作我的兒女。」這是全能的主說的。</p><p><strong>哥林多後書7:1</strong><br>親愛的弟兄啊，我們既有這等應許，就當潔淨自己，除去身體、靈魂一切的汙穢，敬畏神，得以成聖。</p></blockquote>"}]},{"num":44,"title":"十誡的序言教導我們什麼？","answer":"十誡的序言教導我們：因為耶和華是主、是我們的神、是我們的救贖主，所以我們應當遵守祂一切的誡命。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-1","days":[{"day":1,"html":"<p>我們為什麼應該順服上帝？十誡的序言暗示三個原因。這些原因，對於蒙上帝賜下十誡的以色列人來說，是充分的原因。今天對於我們這些上帝的百姓來說，它們甚至是更合理的原因。</p><p>順服上帝的第一個原因是，上帝創造了我們。誰創造了一樣東西，就擁有那樣東西。上帝創造了宇宙。全宇宙都屬於上帝。上帝創造了我們。每個人都屬於上帝，都必須聽從祂。因為我們屬於祂，所以祂給我們命令，我們就必須順服。祂有權力命令我們。上帝的百姓順服上帝，因為上帝是他們的創造者。請讀詩篇100:2-3。</p><blockquote><p><strong>詩篇100:2-3</strong><br>你們當樂意事奉耶和華，當來向他歌唱！<br>你們當曉得耶和華是神。我們是他造的，也是屬他的；我們是他的民，也是他草場的羊。</p></blockquote>"},{"day":2,"html":"<p>以色列人要順服上帝律法的第二個原因是，上帝曾與他們立約，就是曾應許作他們的神，讓他們作祂的子民。在這個約中，上帝應許以色列人，祂將把他們從世上的萬民中分別出來。只有他們在祂眼中為特別、得到特別的尊榮。祂會愛他們、眷顧他們，遠在萬邦之上。以色列人對於這個約的責任，就是遵守上帝的誡命。上帝是聖潔的。祂只能親近聖潔的子民。在舊約中，上帝的百姓要順服上帝的誡命，因為祂是他們的上帝，他們是上帝的子民。請讀申命記26:16-19。</p><blockquote><p><strong>申命記26:16-19</strong><br>耶和華你的神今日吩咐你行這些律例典章，所以你要盡心儘性謹守遵行。<br>你今日認耶和華為你的神，應許遵行他的道，謹守他的律例、誡命、典章，聽從他的話。<br>耶和華今日照他所應許你的，也認你為他的子民，使你謹守他的一切誡命，<br>又使你得稱讚、美名、尊榮，超乎他所造的萬民之上，並照他所應許的，使你歸耶和華神為聖潔的民。</p></blockquote>"},{"day":3,"html":"<p>今天，上帝的百姓必須順服上帝誡命的第二個原因是，祂也曾與我們立約。當耶穌基督降世，上帝與祂的百姓立了新約。這個約比上帝與舊約的以色列所立的約更美。所有民族的人都可以加入這個新約。在新約之下，我們與上帝有特別的關係，不是藉著我們一絲不苟地守了每一條規矩，而是藉著信靠耶穌為我們做的。在新約之下，上帝賜我們一個新心，可以順服祂。祂不僅讓我們作祂的子民，那已經足夠好的了，祂還收納我們為祂自己的兒女。</p><p>以色列人作為上帝的百姓有很高的特權，他們要聖潔，因為上帝是聖潔的。我們擁有了更高的特權。我們是上帝的兒女，我們要藉著聖潔順服的生活，活出上帝兒女的樣子來。請讀彼得前書1:14-17。</p><blockquote><p><strong>彼得前書1:14-17</strong><br>你們既作順命的兒女，就不要效法從前矇昧無知的時候那放縱私慾的樣子。<br>那召你們的既是聖潔，你們在一切所行的事上也要聖潔。<br>因為經上記著說：「你們要聖潔，因為我是聖潔的。」<br>你們既稱那不偏待人、按各人行為審判人的主為父，就當存敬畏的心，度你們在世寄居的日子。</p></blockquote><p>作為新約之下上帝的百姓，我們要順服上帝的誡命，因為祂是我們的上帝，我們是祂的子民。</p>"},{"day":4,"html":"<p>以色列人要順服上帝的第三個原因是，要因祂為以色列人所作的一切感謝祂。祂曾救贖以色列人脫離埃及人的殘酷奴役。祂帶領他們安全地穿過曠野，一路上供應他們各種需要。上帝賜給他們以前曾應許給他們的土地，將又大又強的民趕出，叫他們居住。上帝將他妥善安置在那地，叫他們成為大國、強國、富國，成為世上唯一以上帝為神的國家。</p><p>以色列有如此眾多向救贖主——上帝感恩的理由。對於這樣一位曾經如此愛護他們、善待他們的上帝，叫祂喜悅，就應該是順服祂誡命的充分理由。請讀申命記7:7-11。</p><blockquote><p><strong>申命記7:7-11</strong><br>耶和華專愛你們，揀選你們，並非因你們的人數多於別民，原來你們的人數在萬民中是最少的。<br>只因耶和華愛你們，又因要守他向你們列祖所起的誓，就用大能的手領你們出來，從為奴之家救贖你們脫離埃及王法老的手。<br>所以你要知道耶和華你的神，他是神，是信實的神，向愛他、守他誡命的人守約施慈愛，直到千代；<br>向恨他的人當面報應他們，將他們滅絕。凡恨他的人，必報應他們，決不遲延。<br>所以，你要謹守遵行我今日所吩咐你的誡命、律例、典章。</p></blockquote><p>以色列人應該遵守上帝的誡命，因為祂是他們的救贖主，曾為他們成就許多事情。</p>"},{"day":5,"html":"<p>今天，上帝的百姓應該順服上帝的第三個原因是，他們有眾多要感謝上帝的事。祂為我們所做的事，比為舊約的以色列人還多。祂救我們脫離撒但的控制。因為耶穌在十架受死，上帝藉著赦免我們的罪救贖了我們。祂將我們從死亡的恐懼中釋放出來，應許我們將在天堂永遠和祂在一起。祂賜聖靈住在我們裡面，叫我們能夠尋求祂的喜悅。</p><p>上帝賜給我們這麼多恩典，為叫我們得著這些恩典，上帝付出沉重的代價。祂是以祂自己兒子的死為代價換來這一切。我們應該何等感謝上帝！我們應該何等熱心地藉著忠心順服祂的要求，來顯明我們的愛和感恩！今天，我們作為上帝的百姓，我們應該遵守上帝的誡命，因為祂是我們的救贖主，我們應該為祂而活。請讀提多書2:11-14。</p><blockquote><p><strong>提多書2:11-14</strong><br>因為神救眾人的恩已經顯明出來，<br>教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日，<br>等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現。<br>他為我們舍了自己，要贖我們脫離一切罪惡，又潔淨我們，特作自己的子民，熱心為善。</p></blockquote>"},{"day":6,"html":"<p>上帝是我們的創造者。我們順服祂，因為我們屬於祂。如果我們是基督徒，上帝是我們的上帝，我們順服祂，因為祂是聖潔的，祂需要聖潔的人。上帝是我們的救贖主，是救我們脫離罪惡、撒但和死亡的那一位。我們順服祂，因為我們對於祂的作為如此感恩。上帝救祂的百姓，要叫他們順服祂。祂救我們要我們聖潔。就在耶穌昇天之前，祂給門徒們一個任務。請讀馬太福音28:19-20。</p><blockquote><p><strong>馬太福音28:19-20</strong><br>所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗，<br>凡我所吩咐你們的，都教訓他們遵守，我就常與你們同在，直到世界的末了了。</p></blockquote><p>耶穌告訴祂的門徒，要叫萬國的人作門徒。祂告訴他們應該教訓這些門徒什麼內容？</p>"}]},{"num":45,"title":"第一誡命是什麼？","answer":"第一誡命是：「除了我以外，你不可有別的神。」","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-2","days":[{"day":1,"html":"<p class=\"read-prompt\">請讀出埃及記20:3中的第一誡命。</p><blockquote><p><strong>出埃及記20:3</strong><br>除了我以外，你不可有別的神。</p></blockquote><p>只有一位上帝。全宇宙沒有什麼事物或人物能與上帝相比。只有祂配得我們的敬拜。但是因為我們是有罪的，我們是悖逆的，我們為自己製造別神。因此上帝所賜的第一誡命就直接告訴我們不可有別神。</p><p>當上帝把這條誡命賜給以色列人的時候，他們周圍所有的民族都敬拜偶像。這些偶像，都是人可以看得見摸得著的，不過它們根本什麼也做不了。上帝曾經警告以色列人不要效法周圍的民族。我們也許會笑話那些向雕像禱告的人，好像雕像能聽見能回答似的，不過今天，人們也有各種的偶像。什麼東西對於一個人是最重要的，那就成了那人的偶像。如果對於某人來說，最重要的是真神以外的事物，那麼那個人就有偶像了？這個禮拜的每一天，我們都會有一種不同的偶像。其中有些是可見的偶像。有一些就不那麼容易看出來。</p>"},{"day":2,"html":"<p>上帝曾經應許，要在西奈山召見祂的百姓以色列人。祂要把祂的律法賜給他們。祂告訴百姓要用幾天的時間來預備朝見祂。終於到了那一天，他們聽到了上帝的聲音。他們看見山震動冒煙，因為上帝已經臨在西奈山。百姓害怕了，他們請求摩西自己去跟上帝說話，然後回來轉達上帝說的話。摩西就去了。摩西上了山，在那裡朝見上帝，從上帝那裡得了指示。摩西在山上停留四十晝夜。請讀出埃及記32:1-4。看看以色列人在等待的期間做了什麼事。</p><blockquote><p><strong>出埃及記32:1-4</strong><br>百姓見摩西遲延不下山，就大家聚集到亞倫那裡，對他說：「起來！為我們做神像，可以在我們前面引路，因為領我們出埃及地的那個摩西，我們不知道他遭了什麼事。」<br>亞倫對他們說：「你們去摘下你們妻子、兒女耳上的金環，拿來給我。」<br>百姓就都摘下他們耳上的金環，拿來給亞倫。<br>亞倫從他們手裡接過來，鑄了一隻牛犢，用雕刻的器具做成。他們就說：「以色列啊，這是領你出埃及地的神！」</p></blockquote><p>摩西下山，看見他們所做的事，勃然大怒。他將寫有上帝所賜十誡的石版摔碎在地上。上帝也十分憤怒，他命令摩西，叫人在以色列人營中往來，用刀劍殺人。那天死了三千人。上帝說要棄絕以色列人，不過摩西為他們禱告，請求上帝為自己的榮耀，顯出忍耐和饒恕。上帝回應了摩西的禱告。</p>"},{"day":3,"html":"<p>貫穿整個舊約，上帝的百姓都在與偶像崇拜爭戰。儘管他們有上帝的誡命，告訴他們要敬拜祂，而且只能敬拜祂，不過以色列人還是想要周圍的鄰邦有的東西。所有其它的國，都有不止一個的神。其它的國都能看見他們的神。當然，他們的神都是雕像而已，絕對什麼也做不了。以色列人仍然一再效法鄰國，想要一邊敬拜上帝，一邊敬拜偶像。最終，上帝差遣強大殘酷的國家來摧毀以色列的城市，把它民眾當作俘虜搶走了。這件事治好了他們的偶像崇拜。等他們可以回到祖國，重建城市的時候，他們不再敬拜偶像了——至少不再敬拜那些明刻的偶像了。</p><p>不過罪人總是為自己製造偶像，雖然不是真的樹立像來拜。有一個故事，說到一個忠心的猶太人，祂連做夢都不會向雕像禱告。不過祂顯然有一個偶像。請讀馬太福音19:16-22中的故事。這個人的偶像是什麼？</p><blockquote><p><strong>馬太福音19:16-22</strong><br>有一個人來見耶穌說：「夫子，我該做什麼善事才能得永生？」<br>耶穌對他說：「你為什麼以善事問我呢？只有一位是善的。你若要進入永生，就當遵守誡命。」<br>他說：「什麼誡命？」耶穌說：「就是『不可殺人，不可姦淫，不可偷盜，不可作假見證，<br>當孝敬父母，又當愛人如己。』」<br>那少年人說：「這一切我都遵守了，還缺少什麼呢？」<br>耶穌說：「你若願意作完全人，可去變賣你所有的，分給窮人，你必有財寶在天上；你還要來跟從我。」<br>那少年人聽見這話，就憂憂愁愁地走了，因為他的產業很多。</p></blockquote>"},{"day":4,"html":"<p>新約的另一個故事講到一個人和他妻子。他們都屬於早期的教會。他們非常慷慨，奉獻了不少錢幫助教會里的窮人。不過，他們撒了謊。使徒彼得說他們是向上帝說謊了。他們有一個偶像，致使他們這麼做。故事沒有具體告訴你，對於他們來說，有什麼比上帝更重要，不過你讀一讀故事就會知道的。請讀使徒行傳5:1-11。</p><blockquote><p><strong>使徒行傳5:1-11</strong><br>有一個人，名叫亞拿尼亞，同他的妻子撒非喇賣了田產，<br>把價銀私自留下幾分，他的妻子也知道，其餘的幾分拿來放在使徒腳前。<br>彼得說：「亞拿尼亞，為什麼撒但充滿了你的心，叫你欺哄聖靈，把田地的價銀私自留下幾分呢？<br>田地還沒有賣，不是你自己的嗎？既賣了，價銀不是你作主嗎？你怎麼心裡起這意念呢？你不是欺哄人，是欺哄神了！」<br>亞拿尼亞聽見這話，就仆倒，斷了氣。聽見的人都甚懼怕。<br>有些少年人起來，把他包裹，抬出去埋葬了。<br>約過了三小時，他的妻子進來，還不知道這事。<br>彼得對她說：「你告訴我，你們賣田地的價銀就是這些嗎？」她說：「就是這些。」<br>彼得說：「你們為什麼同心試探主的靈呢？埋葬你丈夫之人的腳已到門口，他們也要把你抬出去。」<br>婦人立刻仆倒在彼得腳前，斷了氣。那些少年人進來，見她已經死了，就抬出去，埋在她丈夫旁邊。<br>全教會和聽見這事的人都甚懼怕。</p></blockquote><p>你認為他們的偶像是什麼？不是錢，否則他們不會奉獻那麼多。是他們的名聲，對他們來說很重要。他們想讓教會里的人以為，他們比實際上更慷慨，更不擺上自己。於是他們就撒謊，來給大家留下這樣的印象。</p>"},{"day":5,"html":"<p class=\"read-prompt\">請讀腓立比書3:18-19。</p><blockquote><p><strong>腓立比書3:18-19</strong><br>因為有許多人行事是基督十字架的仇敵。我屢次告訴你們，現在又流淚地告訴你們：<br>他們的結局就是沉淪，他們的神就是自己的肚腹，他們以自己的羞辱為榮耀，專以地上的事為念。</p></blockquote><p>在這段經文中，使徒保羅描述了上帝的那些仇敵。他說他們的神是什麼？當然了，這不是說他們向自己的肚腹禱告。這就是在說，對於他們，沒有比滿足慾望更重要的事了。對於許多人來說，安逸享樂是世上最重要的事。他們時刻在尋找更多更好的方式來享樂。他們想要逃避艱難的事情，或者需要紀律或辛苦的事情。這種人總是在想尋歡作樂。聽起來是不是很熟悉？是的！這個安逸享樂的偶像，大概已經是我國第一號的偶像。</p>"},{"day":6,"html":"<p class=\"read-prompt\">請讀歌羅西書3:5。</p><blockquote><p><strong>歌羅西書3:5</strong><br>所以要治死你們在地上的肢體，就如淫亂、汙穢、邪情、惡欲和貪婪，貪婪就與拜偶像一樣。</p></blockquote><p>在我國還有另一個常見的偶像。聖經教導我們要以自己所有的為滿足。我們所有的，是上帝給我們的恩賜。如果有什麼東西祂還沒有給我們，那不是因為祂給不了，而是因為，祂憑藉祂的智慧，選擇現在不給。當我們因為沒有那些東西就抱怨，當我們忽略了最重要的事情，反而去為自己謀求更多的東西，我們就是在上帝以外有了別神。</p>"}]},{"num":46,"title":"第一誡命吩咐我們做什麼？","answer":"第一誡命吩咐我們認識神，並且承認祂是獨一的真神，是我們的神，因此我們當敬拜祂、榮耀祂。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-2","days":[{"day":1,"html":"<p>你還記得要理問答的第一問嗎？「人的主要目的是什麼？」「人的主要目的是榮耀上帝，以祂為樂，直到永遠。」上帝設計我們的目的，就是認識祂、以祂為樂、榮耀祂。第一條誡命告訴我們除了上帝以外不可有別神。這個絕對不是一個不合情不合理的命令。其實，這就是告訴我們要做上帝設計我們當做的事情。因為我們被設計的目的就是以上帝為樂、榮耀上帝，所以，當我們真的去以上帝為樂、榮耀上帝的時候，我們會是最滿足、最喜樂的。所以說，這第一條誡命是要求我們做一件叫我們最快樂的事。</p><p>許多人選擇服侍別神。他們活著，或者為財利，或者為權力，或者為享樂。他們以為自己正在做叫自己快樂的事，不過，他們最終會發現這些事不能叫他們滿足。上帝造人，不是為了這些東西。祂造我們，要叫我們認識祂。請讀耶利米書9:23-24。</p><blockquote><p><strong>耶利米書9:23-24</strong><br>耶和華如此說：「智慧人不要因他的智慧誇口，勇士不要因他的勇力誇口，財主不要因他的財物誇口。<br>誇口的卻因他有聰明，認識我是耶和華，又知道我喜悅在世上施行慈愛、公平和公義，以此誇口。」這是耶和華說的。</p></blockquote>"},{"day":2,"html":"<p>第一條誡命要求我們承認上帝是獨一真神。人們敬拜各種東西，來替代獨一真神。在舊約時代，人們敬拜雕像，不敬拜上帝。今天，有各種宗教信仰的人敬拜他們稱之為「神」的，但是其實不是那位在聖經中啟示自己的真神。相反的，這些人敬拜的神，是他們自己想象出來的。</p><p>有時候，一些自稱基督徒的人也這麼做。他們不透過研讀聖經來看上帝是怎樣的，反而照著自己喜歡的樣子來形成關於上帝的觀點，然後敬拜那個上帝。還有人用物質享樂代替了上帝，把時間精力全投入其中。在第一條誡命中，上帝要求所有的人只承認祂是獨一的真神。請讀以賽亞書43:10-12。</p><blockquote><p><strong>以賽亞書43:10-12</strong><br>耶和華說：「你們是我的見證，我所揀選的僕人。既是這樣，便可以知道，且信服我，又明白我就是耶和華。在我以前沒有真神，在我以後也沒有。<br>惟有我是耶和華，除我以外沒有救主。<br>我曾指示，我曾拯救，我曾說明，並且在你們中間沒有別神。」所以耶和華說：「你們是我的見證，我也是神。」</p></blockquote>"},{"day":3,"html":"<p>上帝要求祂的百姓不僅要認識祂，承認祂是獨一真神。祂也要求我們認識祂，承認祂是我們的神。祂對於我們，要高過一切。這啦，大多數人會說上帝比一切都重要，因為他們知道他們應該那麼說而已。如果我們對於他們，上帝真的高於一切，那麼我們的生命就會顯露出來。我們將做一些能幫助我們更認識神的事。我們會花時間透過禱告、讀經來尋求祂。我們會團契會，我們必須有上帝，其它一切都不能代替祂。</p><p class=\"read-prompt\">請讀詩篇63:1-4。</p><blockquote><p><strong>詩篇63:1-4</strong><br>神啊，你是我的神！我要切切地尋求你；在乾旱疲乏無水之地，我渴想你，我的心切慕你。<br>我在聖所中曾如此瞻仰你，為要見你的能力和你的榮耀。<br>因你的慈愛比生命更好，我的嘴唇要頌讚你。<br>我還活的時候要這樣稱頌你，我要奉你的名舉手。</p></blockquote><p>大衛說，上帝是他的神。他如同沙漠裡的人渴慕水那樣地尋求神。如果我們認識上帝、承認上帝是我們的上帝，我們就會熱切地尋求祂。</p>"},{"day":4,"html":"<p>如果上帝是獨一真神，如果祂是我們的神，那麼我們必須敬拜祂。那也就是第一條誡命「除了我以外，你不可有別神」所要求的。英文中「敬拜」這個詞，worship，源於worth（價值）。當我們敬拜什麼，我們就是在宣告，那是大有價值的。敬拜不僅僅是禱告的時候偶爾讚美上帝幾聲。敬拜也不僅僅是聚會的時候唱詩讚美。</p><p>敬拜上帝，是向周圍的全世界宣告，祂的價值何等的大。我們的宣告，是透過我們為祂而活的整個生命。當我們天天尋求與上帝更親近，我們是在活敬拜的生命。當認識我們的人都看到，對我們來說，世上最重要的事就是認識上帝，我們是在敬拜祂。我們是在向全世界宣告：「看哪，祂的價值多麼大！我願捨棄一切來得著祂。」請讀保羅在腓立比書3:7-8中關於敬拜的話。</p><blockquote><p><strong>腓立比書3:7-8</strong><br>只是我先前以為與我有益的，我現在因基督都當作有損的。<br>不但如此，我也將萬事當作有損的，因我以認識我主基督耶穌為至寶。我為他已經丟棄萬事，看作糞土，為要得著基督。</p></blockquote>"},{"day":5,"html":"<p>如果我們承認上帝是獨一真神，我們就明白上帝創造萬物，是為祂的榮耀。萬物也包括我們。如果我們以上帝為我們的上帝，我們會對於祂的一切懷感恩之心，叫我們渴慕取悅祂。第一條誡命要求我們榮耀上帝，為上帝的榮耀而活。請讀哥林多前書10:31。</p><blockquote><p><strong>哥林多前書10:31</strong><br>所以，你們或吃或喝，無論做什麼，都要為榮耀神而行。</p></blockquote><p>就連吃喝這樣必需的平常的事，都要為著上帝的榮耀而做。我們凡事為著上帝的榮耀，如何做呢？當我們盡我們的全力來做一切事，我們就榮耀上帝。當我們留意不去做那些犯罪的事，當我們做事不出於自私的動機，而是叫上帝得著尊榮，那我們就榮耀上帝。</p>"},{"day":6,"html":"<p>人們對於上帝有很多不同的想法。當然，這些想法不可能都是正確的，因為這些說法會有分歧。不過，如果你聽別人說，或者閱讀書刊雜誌，大家的說法好像是，關於上帝的觀念都是對的——就連那些互相牴觸的觀點也都是對的！人們常說，我們信什麼無所謂，只要我們相信我們的想法是最好的就行了。他們說，告訴別人關於上帝的想法有錯誤，這種做法是不對的。那可能會傷害人的感情。至於那些對上帝根本不感興趣的人，人們常說，我們沒有權利告訴他們忽視上帝是錯的。</p><p>但是，上帝自己命令我們除了祂以外不可有別神。祂不是提建議而已，也不是告訴人這個誡命是給那些願意遵守的人規定的。上帝對所有的人都敬拜祂，而且只能敬拜祂。祂說祂要毀滅拒絕遵守祂命令的人。請讀詩篇50:22-23。</p><blockquote><p><strong>詩篇50:22-23</strong><br>你們忘記神的，要思想這事，免得我把你們撕碎，無人搭救。<br>凡以感謝獻上為祭的便是榮耀我。那按正路而行的，我必使他得著我的救恩。</p></blockquote>"}]},{"num":47,"title":"第一誡命禁止我們做什麼？","answer":"第一誡命禁止我們否認真神、或不敬榮耀祂為神、為我們的神；也禁止我們將敬拜和榮耀，歸給任何受造之物，因為這是唯獨歸屬於祂的。","hasDays":true,"mergedInto":null,"mergedFrom":null,"categoryId":"p2-2","days":[{"day":1,"html":"<p>說某事被禁止，就是不被允許之意。十誡的每一誡命都要求一些事（就是說，必須做某些事），並且禁止另外一些事（就是說，那些事是不允許做的）。除了上帝以外不可有別神，這條誡命也禁止幾件事。</p><p>第一，上帝禁止人否認祂。否認上帝，就是說上帝不存在。說沒有上帝的人，被稱為無神論者。無神論者常常聲稱，因為沒人能證明有上帝，所以他們不信上帝。這麼說，讓他們聽上去很科學，很聰明。對於否認祂的人，上帝也有話說。上帝說無神論者是什麼？請讀詩篇14:1。</p><blockquote><p><strong>詩篇14:1</strong><br>愚頑人心裡說：「沒有神。」他們都是邪惡，行了可憎惡的事；沒有一個人行善。</p></blockquote>"},{"day":2,"html":"<p>跟無神論者一樣，有一些人根本不相信有神。還有許多人嘴裡說有上帝，甚至自稱是信耶穌呢，可是他們的生活，彷彿沒有上帝一樣。許多人禮拜天去聚會，可是一週裡面的其它時間，根本不考慮上帝對他們的旨意如何。他們也不查考上帝的話，看看祂有何要求。他們不花時間禱告、尋求祂幫助他們順服祂。這些人想怎麼活就怎麼活。觀察他們，你根本沒辦法知道他們是遵守過上帝的人。</p><p>當我們的生命與他們的鄰舍沒有分別，當我們跟非基督徒一樣，不怎麼禱告、讀經，我們就是用我們的生活來否認上帝。上帝在祂的話語中多處描述過這種人，並警告要審判他們。請讀以賽亞書29:13。</p><blockquote><p><strong>以賽亞書29:13</strong><br>主說：「因為這百姓親近我，用嘴唇尊敬我，心卻遠離我；他們敬畏我，不過是領受人的吩咐。</p></blockquote>"},{"day":3,"html":"<p>第一條誡命禁止否認上帝，禁止用嘴唇或用生活來否認祂的存在。第一誡也禁止我們不敬拜祂。換句話說，我們不可以不敬拜上帝。大多數人把敬拜看做是可以在方便的時候選擇做的事。許多人從來不去教會。就算是在那些去教會的人中間，如果他們醒了發現自己還是疲倦，想接著睡覺，或者如果他們禮拜天上午有別的地方去，或有別的事去做，他們就會選擇那麼做，而不去參加敬拜。我們很多人似乎覺得這不算什麼問
